# Dependabot version updates. (Security updates run separately and need no config.)
# Non-major updates are grouped into one PR per ecosystem per week to keep noise low;
# major bumps come as their own PRs so they get a deliberate review.
version: 2
updates:
  # ── Go modules ────────────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /console-api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apply-sink
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /test/render
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  # ── Console SPA (npm) ─────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @rjsf/* v6 is a breaking migration for the console's create-forms, and the
      # family (core/utils/validator/theme) must move in lockstep or npm ci fails on
      # peer conflicts. Hold the major until it's done deliberately, then remove this.
      - dependency-name: "@rjsf/*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions:
        patterns: ["*"]

  # ── Container base images (Dockerfile FROM lines) ─────────────────────────────
  # Previously unwatched: the images we build + ship (apply-sink, babelfish, console-api, query)
  # and the hello-web example never got base-image (golang/node/alpine/debezium/…) bumps or CVE
  # fixes. Grouped weekly, non-major; majors come separately for a deliberate review.
  - package-ecosystem: docker
    directories:
      - /apply-sink
      - /babelfish
      - /console-api
      - /query
      - /examples/hello-web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # babelfish compiles Babelfish-for-PostgreSQL from source with `-Werror`; Ubuntu's
      # newer GCC (24.04+) flags warnings the pinned source hits, and 26.04 also drops the
      # `libicu70` this Dockerfile needs. Moving the base OS is a source-porting task, not a
      # dependency bump — hold the major until that's done deliberately, then remove this.
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major"]
      # Stay on the Node LTS line for the console SPA builder; odd majors (23/25/…) are not
      # LTS. Take the next even LTS deliberately rather than tracking every major.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
