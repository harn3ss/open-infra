# Build the first-party images for arm64 (aarch64) and push them under EXPLICIT
# `-arm64` tags. These are NON-FIPS portability builds: the default tags (latest /
# sha-<short>) stay amd64, so a FIPS/amd64 deployment can never pull a non-FIPS arm64
# image by accident. See docs/architecture-support.md (FIPS is a substrate property,
# validated on amd64; the images carry no image-level FIPS claim on any arch).
#
# Native arm64 runners (ubuntu-24.04-arm, free for public repos) — no QEMU emulation.
# babelfish is intentionally NOT here: it is an experimental, effort-capped C++/ANTLR
# source build; it stays amd64-only until someone takes on the arm64 compile.
name: build-arm64

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "console-api/**"
      - "dynamodb/**"
      - "apply-sink/**"
      - "statemachine/**"
      - "hpo/**"
      - "featurestore/**"
      - "mc/**"
      - "open-appsync/**"
      - "tds-proxy/**"
      - "query/**"
      - ".github/workflows/build-arm64.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing (Sigstore OIDC)

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate on the same test suite the amd64 builds use (arch-independent Go).
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: open-infra-console,       context: ".",           file: console-api/Dockerfile }
          - { image: open-infra-attest,        context: ".",           file: console-api/Dockerfile.attest }
          - { image: open-infra-audit-offsite, context: ".",           file: console-api/Dockerfile.audit-offsite }
          - { image: open-infra-aws-shim,      context: ".",           file: console-api/Dockerfile.aws-shim }
          - { image: open-infra-ca-issuer,     context: ".",           file: console-api/Dockerfile.ca-issuer }
          - { image: open-infra-apply-sink,    context: apply-sink,    file: apply-sink/Dockerfile }
          - { image: open-infra-statemachine,  context: statemachine,  file: statemachine/Dockerfile }
          - { image: open-infra-hpo,           context: hpo,           file: hpo/Dockerfile }
          - { image: open-infra-featurestore,  context: featurestore,  file: featurestore/Dockerfile }
          - { image: open-infra-open-appsync,  context: ".",           file: open-appsync/Dockerfile }
          - { image: open-infra-tds-proxy,     context: tds-proxy,     file: tds-proxy/Dockerfile }
          - { image: open-infra-query,         context: query,         file: query/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (arm64 tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # Explicit -arm64 tags ONLY — never latest/sha (those stay amd64).
          tags: |
            type=raw,value=latest-arm64
            type=sha,format=short,suffix=-arm64

      - name: Build & push (arm64, non-FIPS)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          # arm64 stays NON-FIPS: override the Dockerfiles' amd64-default GOFIPS140 to empty so the
          # arm64 binaries are plain Go builds, matching the openinfra.dev/fips=false label below.
          build-args: |
            GOFIPS140=
            OPENINFRA_FIPS=false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            openinfra.dev/fips=false
            openinfra.dev/arch-variant=arm64-portability-nonfips
          cache-from: type=gha,scope=arm64-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=arm64-${{ matrix.image }}

      # Prove the image actually EXECUTES on arm64 — the runner is native aarch64, so
      # running the just-built arm64 image here is a real arm64 runtime check. A wrong-arch
      # binary fails immediately with "exec format error"; a server that runs until the
      # timeout kills it, or a CLI that exits on missing args, both mean it executed → PASS.
      - name: Smoke-test — the arm64 image runs on arm64
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
          echo "runner arch: $(uname -m); running $IMG"
          out="$(timeout -s KILL 25 docker run --rm "$IMG" 2>&1 || true)"
          echo "--- container output (head) ---"; printf '%s\n' "$out" | head -25
          if printf '%s' "$out" | grep -qiE 'exec format error|cannot execute binary file|exec .*: no such file'; then
            echo "::error::${{ matrix.image }}:latest-arm64 did NOT execute on arm64 (exec format error)"; exit 1
          fi
          echo "PASS: ${{ matrix.image }} arm64 image executed on $(uname -m) — no exec-format-error"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
