# Build the open-infra authz-webhook image and push it to GHCR.
#
# authz-webhook is the Cedar control-plane authorization webhook (Phase 2): it answers the
# Kubernetes authorization-webhook contract (SubjectAccessReview in, allow/deny/no-opinion out) and
# decides via the policy engine over kind: Policy spec.controlPlane. It lives in the console-api Go
# module (reuses policyengine), so it rebuilds on console-api changes. Same supply-chain treatment
# as the other images (Trivy-scanned + cosign-signed).
name: build-authz-webhook

on:
  push:
    branches: [main]
    paths:
      - "console-api/**"
      - "policyengine/**"
      - ".github/workflows/build-authz-webhook.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: build-authz-webhook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-infra-authz-webhook
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: console-api/Dockerfile.authz-webhook
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/open-infra-authz-webhook@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          limit-severities-for-sarif: "true"
        env:
          TRIVY_CACHE_DIR: .trivycache

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-authz-webhook

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/open-infra-authz-webhook@${{ steps.build.outputs.digest }}
