# Build open-infra's first-party Babelfish image and push it to GHCR.
#
# Babelfish for PostgreSQL is the SQL-Server-compatible managed-DB engine
# (`database: { engine: babelfish }`). This layers our own start.sh (TLS-capable)
# onto the pinned community base and gives us a signed, scanned image in our own
# registry — same supply-chain treatment as the console + apply-sink images.
name: build-babelfish

on:
  push:
    branches: [main]
    paths:
      - "babelfish/**"
      - ".github/workflows/build-babelfish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing (Sigstore OIDC)
  security-events: write # upload Trivy results to the Security tab

concurrency:
  group: build-babelfish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: don't build/push unless the test suite passes on this ref.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    # One image per PostgreSQL major under Babelfish (database.engineVersion): 17 is the default
    # (:latest), 16 restores an Aurora PostgreSQL 16 (Babelfish 4.x) bbf_dump.
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "17"
            version: BABEL_5_4_0__PG_17_7
            tags: |
              type=raw,value=latest
              type=raw,value=pg17
              type=raw,value=pg17.7
              type=sha,format=short
            sarif: trivy-babelfish
          - pg: "16"
            version: BABEL_4_10_0__PG_16_14
            tags: |
              type=raw,value=pg16
              type=raw,value=pg16.14
              type=sha,format=short,suffix=-pg16
            sarif: trivy-babelfish-pg16
          # Babelfish 4.9 on PostgreSQL 16.13 (Aurora PostgreSQL 16.13's): a stable branch, not a
          # release, so it builds from these pinned commits.
          - pg: "16.13"
            version: BABEL_4_9_STABLE__PG_16_13
            pg_commit: d466f3ae8a29adebf2c415ba313e269c2168681c
            ext_commit: bf29f078cccbd151414ff402db9b4d361adc0098
            tags: |
              type=raw,value=pg16.13
              type=sha,format=short,suffix=-pg16.13
            sarif: trivy-babelfish-pg16.13
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-infra-babelfish
          tags: ${{ matrix.tags }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: babelfish
          file: babelfish/Dockerfile
          push: true
          build-args: |
            BABELFISH_VERSION=${{ matrix.version }}
            BABELFISH_PG_COMMIT=${{ matrix.pg_commit }}
            BABELFISH_EXT_COMMIT=${{ matrix.ext_commit }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=babelfish-pg${{ matrix.pg }}
          cache-to: type=gha,mode=max,scope=babelfish-pg${{ matrix.pg }}

      # --- Supply chain: scan + sign the pushed image ---
      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/open-infra-babelfish@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          # Keep the SARIF (Security tab) in sync with the triage policy above —
          # otherwise trivy-action uploads every severity, flooding it with medium/low
          # base-image CVEs. Fully eliminating those is the from-source-image follow-up.
          limit-severities-for-sarif: "true"
        env:
          TRIVY_CACHE_DIR: .trivycache

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4.38.1
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.sarif }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/open-infra-babelfish@${{ steps.build.outputs.digest }}
