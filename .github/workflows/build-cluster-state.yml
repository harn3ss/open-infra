# Build the cluster-state collector image (polyhedron#314) and push it to GHCR.
#
# A read-only, scheduled observer that snapshots the whole cluster into harn3ss/cluster-state and
# rewrites the pinned front-page issue. Python + the kubernetes client; not part of the Go module, so
# it does not gate on the Go test suite. Same supply-chain treatment as the other images
# (Trivy-scanned + cosign-signed).
name: build-cluster-state

on:
  push:
    branches: [main]
    paths:
      - "tools/cluster-state-reporter/**"
      - ".github/workflows/build-cluster-state.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: build-cluster-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-infra-cluster-state
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: tools/cluster-state-reporter
          file: tools/cluster-state-reporter/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/open-infra-cluster-state@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          limit-severities-for-sarif: "true"
        env:
          TRIVY_CACHE_DIR: .trivycache

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4.38.1
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-cluster-state

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/open-infra-cluster-state@${{ steps.build.outputs.digest }}
