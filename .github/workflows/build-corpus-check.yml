# Build the open-infra corpus-check image and push it to GHCR.
#
# corpus-check audits the control-plane authorization corpus (Cedar grants derived from live RBAC) for
# cluster-admin sprawl / wildcard / cluster-wide-secret-read / escalation — the machine-checkable
# replacement for the CIS Kubernetes RBAC controls under Cedar (CA-2/CA-7, #109 Phase 3 / #110). Lives
# in the console-api Go module. Same supply-chain treatment as the other images (Trivy + cosign).
name: build-corpus-check

on:
  push:
    branches: [main]
    paths:
      - "console-api/**"
      - "dynamodb/**"
      - "policyengine/**"
      - ".github/workflows/build-corpus-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing (Sigstore OIDC)
  security-events: write # upload Trivy results to the Security tab

concurrency:
  group: build-corpus-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: don't build/push latest unless the test suite passes on this ref.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-infra-corpus-check
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: console-api/Dockerfile.corpus-check
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/open-infra-corpus-check@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          limit-severities-for-sarif: "true"
        env:
          TRIVY_CACHE_DIR: .trivycache

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-corpus-check

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/open-infra-corpus-check@${{ steps.build.outputs.digest }}
