# Build the open-infra featurestore image and push it to GHCR.
#
# featurestore is the API behind kind: FeatureGroup (the online feature store): a small
# Valkey-backed service serving PutRecord / GetRecord for real-time feature lookups. Same
# supply-chain treatment as the other first-party images (Trivy-scanned + cosign-signed).
name: build-featurestore

on:
  push:
    branches: [main]
    paths:
      - "featurestore/**"
      - ".github/workflows/build-featurestore.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: build-featurestore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-infra-featurestore
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: featurestore
          file: featurestore/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/open-infra-featurestore@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          limit-severities-for-sarif: "true"
        env:
          TRIVY_CACHE_DIR: .trivycache
      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4.37.7
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-featurestore
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/open-infra-featurestore@${{ steps.build.outputs.digest }}
