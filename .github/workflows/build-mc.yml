# Build the open-infra-mc image — the MinIO client with a world-readable /usr/bin/mc, so the non-root
# fetch-mc init containers in the WORM audit / attestation / crypto-erase jobs stage it without root
# (restricted-PSA clean). Same supply-chain treatment as the other images (Trivy-scanned + cosign-signed).
name: build-mc

on:
  push:
    branches: [main]
    paths:
      - "mc/**"
      - ".github/workflows/build-mc.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing (Sigstore OIDC)
  security-events: write # upload Trivy results to the Security tab

concurrency:
  group: build-mc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4   # arm64 emulation for the multi-arch mc build

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-infra-mc
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: mc
          file: mc/Dockerfile
          # mc is the ONE first-party image published as a shared MULTI-ARCH :latest (amd64+arm64):
          # it is the upstream MinIO client with NO FIPS claim (fips=false), so a shared tag can't
          # silently serve a non-FIPS build of a FIPS image. This lets the static mc-consumer manifests
          # (destruction/audit-offsite/compliance-attest) run on either arch from a single image ref.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/open-infra-mc@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          limit-severities-for-sarif: "true"
        env:
          TRIVY_CACHE_DIR: .trivycache

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-mc

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/open-infra-mc@${{ steps.build.outputs.digest }}
