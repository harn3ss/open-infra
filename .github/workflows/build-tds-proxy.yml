# Build the open-infra tds-proxy image (the RDS-Proxy-equivalent TDS connection pooler) and
# push it to GHCR. A stdlib-only static Go binary, run
# in front of a managed SQL-Server/Babelfish DB by the kind: DatabaseProxy composition. Same supply-chain
# treatment as the other images (Trivy-scanned + cosign-signed).
name: build-tds-proxy

on:
  push:
    branches: [main]
    paths:
      - "tds-proxy/**"
      - ".github/workflows/build-tds-proxy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing (Sigstore OIDC)
  security-events: write # upload Trivy results to the Security tab

concurrency:
  group: build-tds-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: don't build/push latest unless the test suite passes on this ref.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-infra-tds-proxy
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: tds-proxy
          file: tds-proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Supply chain: scan + sign the pushed image ---
      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/open-infra-tds-proxy@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          limit-severities-for-sarif: "true"
        env:
          TRIVY_CACHE_DIR: .trivycache

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4.37.7
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-tds-proxy

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/open-infra-tds-proxy@${{ steps.build.outputs.digest }}
