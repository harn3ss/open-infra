# Continuous Chaos — the generator draws a RANDOM WATCHED PLANE each run, so the suite rotates the
# whole proven surface (mesh, stream, app-SLO, security-deny, VM, volume, storage, fileshare,
# directory, dataflow, migration) around the clock — not just multi-master. This is a constant
# BUG-FINDER.
#
# `chainforge pick` (tools/chainforge, reading chaos/grammar.json) selects the plane; only planes
# marked watched:true are drawn (the PENDING serverless plane is never picked until its oracle
# graduates). Each run records what it drew into its own run Summary + a JSON artifact.
#
# Relationship to nightly-chaos.yml: the nightly stays the daily status-of-record and owns the
# calendar-day graduation clock (it publishes chaos/nightly-status.json). Continuous publishes NOTHING
# and touches no clock — a red is a failed run + retained artifacts. It SHARES the nightly-chaos
# concurrency group, so continuous and the nightly serialize onto one queue and never collide on the
# shared chaos-sandbox. Runs on the self-hosted openinfra-chaos runner (kubectl + Go + kubeconfig).
name: continuous-chaos

on:
  schedule:
    - cron: "*/30 * * * *" # every ~30 min (GitHub schedules are best-effort)
  workflow_dispatch:
    inputs:
      pick_seed:
        description: "force the plane-draw seed (blank = random each run)"
        type: string
        default: ""

concurrency:
  group: nightly-chaos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chaos:
    runs-on: [self-hosted, openinfra-chaos]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Draw a plane + run it (continuous)
        id: scenario
        # KUBECONFIG (scoped chaos-runner) + Go/kubectl on PATH come from the runner's own .env.
        env:
          PICK_SEED: ${{ github.event.inputs.pick_seed }}
        run: |
          chmod +x chaos/*.sh
          # The generator picks WHICH plane to exercise this run (random, or a forced seed).
          SEED="${PICK_SEED:-$(shuf -i 1-2147483647 -n1)}"
          SCEN="$( cd tools/chainforge && go run . pick --seed "$SEED" 2>/tmp/pick.err )"
          cat /tmp/pick.err
          echo "plane_seed=$SEED" >> "$GITHUB_OUTPUT"
          echo "scenario=$SCEN"   >> "$GITHUB_OUTPUT"

          set +e
          case "$SCEN" in
            lottery)              ./chaos/scenario-lottery.sh ;;
            generated-mesh)       ./chaos/scenario-generated-mesh.sh ;;
            stream-noloss)        ./chaos/scenario-stream-noloss.sh ;;
            stream-function-noloss) ./chaos/scenario-stream-function-noloss.sh ;;
            async-invoke-noloss)  ./chaos/scenario-async-invoke-noloss.sh ;;
            async-invoke-delivered) ./chaos/scenario-async-invoke-delivered.sh ;;
            subscription-reconnect) ./chaos/scenario-subscription-reconnect.sh ;;
            app-availability)     ./chaos/scenario-app-availability.sh ;;
            security-deny)        ./chaos/scenario-security-deny.sh ;;
            vm-resilience)        ./chaos/scenario-vm-resilience.sh ;;
            volume-durable)       ./chaos/scenario-volume-durable.sh ;;
            storage-replica-loss) ./chaos/scenario-storage-replica-loss.sh ;;
            fileshare-durable)    ./chaos/scenario-fileshare-durable.sh ;;
            directory-recover)    ./chaos/scenario-directory-recover.sh ;;
            dataflow-converge)    ./chaos/scenario-dataflow-converge.sh ;;
            migration)            ./chaos/scenario-migration.sh ;;
            *) echo "unknown scenario '$SCEN'"; exit 2 ;;
          esac
          rc=$?
          # 42 = INCONCLUSIVE (capacity short, or a fault never fired / never bit). Record + pass, so
          # continuous coverage is never a false red.
          if [ "$rc" -eq 42 ]; then
            echo "result=inconclusive" >> "$GITHUB_OUTPUT"
            echo "::warning title=Chaos INCONCLUSIVE::$SCEN void (capacity short or a fault never fired)."
            exit 0
          fi
          if [ "$rc" -eq 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      # Self-document EVERY run: what plane/scenario was drawn, the seed to replay it, and the verdict
      # — into the run Summary + a JSON record. No commit, no touch to the graduation clock.
      - name: Record the draw
        if: always()
        env:
          PLANE_SCEN: ${{ steps.scenario.outputs.scenario }}
          PLANE_SEED: ${{ steps.scenario.outputs.plane_seed }}
          SEED: ${{ steps.scenario.outputs.seed }}     # the lottery's fault seed (mesh draws only)
          FAULTS: ${{ steps.scenario.outputs.faults }} # the lottery's drawn faults (mesh draws only)
          RESULT: ${{ steps.scenario.outputs.result }}
        run: |
          RESULT="${RESULT:-unknown}"
          {
            echo "### Continuous chaos — draw"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| scenario | \`${PLANE_SCEN:-?}\` — replay the plane draw with \`pick_seed=${PLANE_SEED:-?}\` |"
            if [ -n "$FAULTS" ]; then echo "| mesh faults | ${FAULTS} (fault seed \`${SEED}\`) |"; fi
            echo "| verdict | **${RESULT}** |"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p chaos/artifacts
          printf '{"run":"%s","scenario":"%s","plane_seed":"%s","faults":"%s","fault_seed":"%s","result":"%s"}\n' \
            "${{ github.run_id }}" "${PLANE_SCEN:-}" "${PLANE_SEED:-}" "${FAULTS:-}" "${SEED:-}" "$RESULT" \
            > "chaos/artifacts/continuous-${{ github.run_id }}.json"

      # Belt-and-suspenders: sweep any finished pods the per-scenario teardown orphaned, so the
      # rotation can't accumulate dead pods toward the chaos-sandbox pod quota.
      - name: Sweep finished pods
        if: always()
        run: |
          kubectl -n chaos-sandbox delete pod --field-selector status.phase=Succeeded --ignore-not-found >/dev/null 2>&1 || true
          kubectl -n chaos-sandbox delete pod --field-selector status.phase=Failed --ignore-not-found >/dev/null 2>&1 || true

      - name: Upload run record (+ red evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: continuous-${{ github.run_id }}
          path: |
            chaos/artifacts/**
          if-no-files-found: ignore
          retention-days: 21
