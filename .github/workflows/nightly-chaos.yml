# Nightly Chaos Suite (design §4, §6). Runs on the self-hosted runner ON the validation
# cluster — zero GitHub-hosted minutes. Each night it runs the chaos LOTTERY (a seeded draw of
# 2–4 composed faults) against a disposable multi-master mesh and proves it re-converges; the
# individual scenarios stay runnable on demand via workflow_dispatch. A red run is a RELEASE
# BLOCKER, same philosophy as the `needs: test` gate.
#
# Requires a self-hosted runner labelled `openinfra-chaos` with kubectl + Go and a
# kubeconfig for the cluster. Until one is registered this workflow simply queues (it never
# runs against anything real, and the pre-flight guard + sandbox RBAC bound it if it does).
name: nightly-chaos

on:
  schedule:
    - cron: "17 8 * * *" # ~nightly, off the top of the hour
  workflow_dispatch:
    inputs:
      scenario:
        description: "scenario to run"
        type: choice
        default: lottery
        options: [partition, partition-flapping, partition-latency, partition-isolation, partition-loss, healing-order, stress-cpu, stress-mem, clockskew, sinkkill, cnpgfailover, sinkdrainkill, concurrent, migration, app-availability, security-deny, stream-noloss, subscription-reconnect, directory-recover, fileshare-durable, volume-durable, dataflow-converge, vm-resilience, lottery]
      keep:
        description: "keep the sandbox up after the run (debug)"
        type: boolean
        default: false
      oracle:
        description: "force a lottery oracle for UN-GATED shakeout (blank = normal convergence draw). Only applies when scenario=lottery."
        type: choice
        default: ""
        options: ["", migration]

concurrency:
  group: nightly-chaos
  cancel-in-progress: false

jobs:
  chaos:
    runs-on: [self-hosted, openinfra-chaos]
    timeout-minutes: 45
    permissions:
      contents: write # to commit the regenerated docs/chaos-scenarios.md + nightly-status.json
    steps:
      - uses: actions/checkout@v7

      - name: Scenario — ${{ github.event.inputs.scenario || 'lottery' }}
        id: scenario
        # KUBECONFIG (scoped chaos-runner) + Go/kubectl on PATH come from the runner's
        # own .env, so the job inherits them — don't override KUBECONFIG here.
        env:
          CHAOS_KEEP: ${{ github.event.inputs.keep == 'true' && '1' || '0' }}
          # Force a gated lottery oracle (un-gated shakeout). Empty on the cron → convergence draw.
          LOTTERY_ORACLE: ${{ github.event.inputs.oracle }}
          # seed is logged by the run and re-runnable via workflow_dispatch
        run: |
          chmod +x chaos/*.sh
          set +e
          case "${{ github.event.inputs.scenario || 'lottery' }}" in
            partition) ./chaos/scenario-partition.sh ;;
            partition-flapping) ./chaos/scenario-partition-flapping.sh ;;
            partition-latency) ./chaos/scenario-partition-latency.sh ;;
            partition-isolation) ./chaos/scenario-partition-isolation.sh ;;
            partition-loss) ./chaos/scenario-partition-loss.sh ;;
            healing-order) ./chaos/scenario-healing-order.sh ;;
            stress-cpu) ./chaos/scenario-stress-cpu.sh ;;
            stress-mem) ./chaos/scenario-stress-mem.sh ;;
            clockskew) ./chaos/scenario-clockskew.sh ;;
            sinkkill)  ./chaos/scenario-sinkkill.sh ;;
            cnpgfailover) ./chaos/scenario-cnpgfailover.sh ;;
            sinkdrainkill) ./chaos/scenario-sink-drain-kill.sh ;;
            concurrent)   ./chaos/scenario-concurrent.sh ;;
            migration) ./chaos/scenario-migration.sh ;;
            app-availability) ./chaos/scenario-app-availability.sh ;;
            security-deny) ./chaos/scenario-security-deny.sh ;;
            stream-noloss) ./chaos/scenario-stream-noloss.sh ;;
            subscription-reconnect) ./chaos/scenario-subscription-reconnect.sh ;;
            directory-recover) ./chaos/scenario-directory-recover.sh ;;
            fileshare-durable) ./chaos/scenario-fileshare-durable.sh ;;
            volume-durable) ./chaos/scenario-volume-durable.sh ;;
            dataflow-converge) ./chaos/scenario-dataflow-converge.sh ;;
            vm-resilience) ./chaos/scenario-vm-resilience.sh ;;
            lottery)   ./chaos/scenario-lottery.sh ;;
            *) echo "unknown scenario"; exit 2 ;;
          esac
          rc=$?
          # Exit 42 = the capacity pre-flight aborted INCONCLUSIVE: the cluster couldn't
          # run the sandbox (a node down + no headroom). That is NOT a product red and
          # must not fail the night — but it is NOT a green night either (nothing was
          # proven), so it must not silently pass as a checkmark. Surface it loudly and
          # exit 0 so the run is neither a release-blocker nor a false green.
          if [ "$rc" -eq 42 ]; then
            echo "::warning title=Chaos INCONCLUSIVE::Scenario skipped — insufficient node capacity. Counts as neither a green night nor a red one."
            {
              echo "### ⚠️ Chaos run INCONCLUSIVE"
              echo "The node-capacity pre-flight found too little schedulable headroom to run the sandbox, so the scenario did **not** run."
              echo "This is **not** a red (no product failure) and does **not** count toward the 30-green-night graduation clock."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "result=inconclusive" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -eq 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      - name: Retain artifacts on red
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-artifacts-${{ github.run_id }}
          path: |
            chaos/artifacts/**
          if-no-files-found: ignore
          retention-days: 30

      # Record this night's result into chaos/nightly-status.json, regenerate the public
      # gallery (docs/chaos-scenarios.md), and commit both. Best-effort: a docs hiccup must
      # never turn a green chaos night red, so every command here swallows its own failure.
      - name: Publish nightly status + regenerate docs
        if: always()
        env:
          SCEN: ${{ github.event.inputs.scenario || 'lottery' }}
          RESULT: ${{ steps.scenario.outputs.result }}
          FAULTS: ${{ steps.scenario.outputs.faults }} # space-separated fault names the lottery actually drew
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          set +e
          RESULT="${RESULT:-failure}"
          DATE="$(date -u +%Y-%m-%d)"; UPDATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$SCEN" "$RESULT" "$DATE" "$UPDATED" "$RUN_URL" "$FAULTS" <<'PY'
          import json, os, sys
          scen, result, date, updated, url, faults = sys.argv[1:7]
          p = "chaos/nightly-status.json"
          d = {"updated": updated, "runs": {}}
          if os.path.exists(p):
              try: d = json.load(open(p))
              except Exception: pass
          runs = d.setdefault("runs", {})
          # the scenario itself (e.g. "lottery" → drives the top banner + M24)
          runs[scen] = {"conclusion": result, "date": date, "runUrl": url}
          # stamp ONLY the faults the lottery actually drew this run — so per-scenario dates
          # advance only when a fault was truly exercised (never a uniform hand-stamp).
          for f in faults.split():
              runs[f] = {"conclusion": result, "date": date, "runUrl": url}
          d["updated"] = updated
          with open(p, "w") as f:
              json.dump(d, f, indent=2, ensure_ascii=False); f.write("\n")
          PY
          ( cd tools/chaosdoc && go run . ) || { echo "::warning::chaosdoc regen failed"; exit 0; }
          if [ -z "$(git status --porcelain chaos/nightly-status.json docs/chaos-scenarios.md)" ]; then
            echo "no doc changes"; exit 0
          fi
          git config user.name "openinfra-chaos-bot"
          git config user.email "chaos-bot@users.noreply.github.com"
          git add chaos/nightly-status.json docs/chaos-scenarios.md
          git commit -m "docs(chaos): nightly ${SCEN} → ${RESULT} [skip ci]" || { echo "::warning::commit failed"; exit 0; }
          git pull --rebase origin "$REF" || echo "::warning::rebase issue"
          git push origin "HEAD:$REF" || echo "::warning::doc push failed"
          exit 0
