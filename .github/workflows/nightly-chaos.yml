# Nightly Chaos Suite (design §4, §6). Runs on the self-hosted runner ON the validation
# cluster — zero GitHub-hosted minutes. Each night it partitions a disposable multi-master
# mesh and proves it re-converges. A red run is a RELEASE BLOCKER, same philosophy as the
# `needs: test` gate.
#
# Requires a self-hosted runner labelled `openinfra-chaos` with kubectl + Go and a
# kubeconfig for the cluster. Until one is registered this workflow simply queues (it never
# runs against anything real, and the pre-flight guard + sandbox RBAC bound it if it does).
name: nightly-chaos

on:
  schedule:
    - cron: "17 8 * * *" # ~nightly, off the top of the hour
  workflow_dispatch:
    inputs:
      scenario:
        description: "scenario to run"
        type: choice
        default: partition
        options: [partition, clockskew, sinkkill, cnpgfailover, concurrent]
      keep:
        description: "keep the sandbox up after the run (debug)"
        type: boolean
        default: false

concurrency:
  group: nightly-chaos
  cancel-in-progress: false

jobs:
  chaos:
    runs-on: [self-hosted, openinfra-chaos]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Scenario — ${{ github.event.inputs.scenario || 'partition' }}
        # KUBECONFIG (scoped chaos-runner) + Go/kubectl on PATH come from the runner's
        # own .env, so the job inherits them — don't override KUBECONFIG here.
        env:
          CHAOS_KEEP: ${{ github.event.inputs.keep == 'true' && '1' || '0' }}
          # seed is logged by the run and re-runnable via workflow_dispatch
        run: |
          chmod +x chaos/*.sh
          set +e
          case "${{ github.event.inputs.scenario || 'partition' }}" in
            partition) ./chaos/scenario-partition.sh ;;
            clockskew) ./chaos/scenario-clockskew.sh ;;
            sinkkill)  ./chaos/scenario-sinkkill.sh ;;
            cnpgfailover) ./chaos/scenario-cnpgfailover.sh ;;
            concurrent)   ./chaos/scenario-concurrent.sh ;;
            *) echo "unknown scenario"; exit 2 ;;
          esac
          rc=$?
          # Exit 42 = the capacity pre-flight aborted INCONCLUSIVE: the cluster couldn't
          # run the sandbox (a node down + no headroom). That is NOT a product red and
          # must not fail the night — but it is NOT a green night either (nothing was
          # proven), so it must not silently pass as a checkmark. Surface it loudly and
          # exit 0 so the run is neither a release-blocker nor a false green.
          if [ "$rc" -eq 42 ]; then
            echo "::warning title=Chaos INCONCLUSIVE::Scenario skipped — insufficient node capacity. Counts as neither a green night nor a red one."
            {
              echo "### ⚠️ Chaos run INCONCLUSIVE"
              echo "The node-capacity pre-flight found too little schedulable headroom to run the sandbox, so the scenario did **not** run."
              echo "This is **not** a red (no product failure) and does **not** count toward the 30-green-night graduation clock."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

      - name: Retain artifacts on red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-artifacts-${{ github.run_id }}
          path: |
            chaos/artifacts/**
          if-no-files-found: ignore
          retention-days: 30
