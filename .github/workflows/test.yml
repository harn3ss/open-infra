# Stage A — fast unit & composition-render tests. Runs on every push/PR that
# touches Go code or the abstraction compositions, as the correctness gate before
# the build-* image workflows. No cluster, no DB: pure-Go unit tests (apply-sink
# coercion/dialect logic), the console-api handlers, and the composition-render
# assertions that guard template logic (e.g. the CNPG hibernation annotation).
#
# The MySQL/Postgres HLC *integration* tests are tagged `integration` and are NOT
# run here (they need a live database) — run them locally with, e.g.:
#   MYSQL_TEST_DSN=... go test -tags integration ./... (in apply-sink/)
name: test

on:
  push:
    branches: [main]
    paths:
      - "apply-sink/**"
      - "statemachine/**"
      - "hpo/**"
      - "featurestore/**"
      - "cfn/**"
      - "dynamodb/**"
      - "console-api/**"
      - "test/**"
      - "lambda-runtime/**" # the runtime bootstraps (test/lambda-runtime runs them as processes)
      - "platform/**" # every manifest: the user-authority check (rbac_user_authority_test.go) walks them all
      - "platform/storage/longhorn*.yaml" # volume_render_test.go pins the Volume's classes to Immediate binding
      - "platform/security/volume-crypto.yaml" # crypto_reconcilers_test.go runs these reconciler scripts
      - "platform/security/encryptionkey-reconciler.yaml"
      - "platform/aws-shim/**" # the login-profile guard (test/admission) and the shim's RBAC (test/render)
      - "ui/**" # console SPA — typecheck + build (catches UI dependency-bump breakage)
      - "chaos/**" # the lottery draw engine — chaos-draw job guards replay/gating invariants
      - "open-appsync/**" # the VTL engine + resolver probe
      - "policyengine/**" # the Cedar-based data-plane authorization engine
      - "docs/openapi/**" # the generated platform spec — re-run the drift gate when it changes
      - "probe/**" # aws-shim probes + registry — the shimgen service-list/count drift gate
      - "docs/aws-shim.md" # generated shim service blocks — re-run the drift gate when it changes
      - "docs/cloudformation.md" # generated coverage block + hand tables the coverage gate checks
      - "docs/aws-coverage.md" # the generated AWS coverage registry page
      - "docs/customer-surface.md" # the generated customer-surface inventory
      - "README.md" # generated shim service matrix — re-run the drift gate when it changes
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "apply-sink/**"
      - "statemachine/**"
      - "hpo/**"
      - "featurestore/**"
      - "cfn/**"
      - "dynamodb/**"
      - "console-api/**"
      - "test/**"
      - "lambda-runtime/**" # the runtime bootstraps (test/lambda-runtime runs them as processes)
      - "platform/**" # every manifest: the user-authority check (rbac_user_authority_test.go) walks them all
      - "platform/storage/longhorn*.yaml" # volume_render_test.go pins the Volume's classes to Immediate binding
      - "platform/security/volume-crypto.yaml" # crypto_reconcilers_test.go runs these reconciler scripts
      - "platform/security/encryptionkey-reconciler.yaml"
      - "platform/aws-shim/**" # the login-profile guard (test/admission) and the shim's RBAC (test/render)
      - "ui/**" # console SPA — typecheck + build (catches UI dependency-bump breakage)
      - "chaos/**" # the lottery draw engine — chaos-draw job guards replay/gating invariants
      - "open-appsync/**" # the VTL engine + resolver probe
      - "policyengine/**" # the Cedar-based data-plane authorization engine
      - "docs/openapi/**" # the generated platform spec — re-run the drift gate when it changes
      - "probe/**" # aws-shim probes + registry — the shimgen service-list/count drift gate
      - "docs/aws-shim.md" # generated shim service blocks — re-run the drift gate when it changes
      - "docs/cloudformation.md" # generated coverage block + hand tables the coverage gate checks
      - "docs/aws-coverage.md" # the generated AWS coverage registry page
      - "docs/customer-surface.md" # the generated customer-surface inventory
      - "README.md" # generated shim service matrix — re-run the drift gate when it changes
      - ".github/workflows/test.yml"
  workflow_dispatch: {}
  workflow_call: {} # callable as a required gate by the build/release workflows

permissions:
  contents: read

concurrency:
  # Include github.workflow so the reusable calls (release/build-*) and the standalone
  # run get distinct groups — otherwise they share one group and cancel each other.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - apply-sink # pure-Go CDC apply logic (coerce, dialects, table parsing)
          - statemachine # the ASL workflow engine (parse, JSONPath, choice, retry/catch)
          - hpo # the hyperparameter-tuning engine (grid search, metric extraction)
          - featurestore # the online feature store API (RESP client, put/get)
          - cfn # the CloudFormation engine's plan/dry-run (mapping table + intrinsics + ordering)
          - dynamodb # the shared Dynamo-shaped store (executor + expression evaluator), used by open-appsync + the aws-shim
          - console-api # BFF handlers (crd, proxy)
          - test/render # composition-render assertions (hibernation, HA)
          - test/admission # admission policies' CEL evaluated case by case (login-profile guard)
          - tools/chaosdoc # chaos-scenario gallery generator + drift-guard
          - tools/chainforge # chaos chain grammar: validate corpus + generate chains
          - open-appsync # the VTL engine + $util + the docs-anchored resolver probe
          - policyengine # the Cedar-based fine-grained data-plane authz engine (allow/deny/conditions)
          - lan-expose # the LAN-exposure controller (EIP allocation + policyRoute merge)
          - scripts/iam-migrate # the one-shot IAM migration into the AWS policy model (plan + apply)
    name: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # go.mod (not go.sum) as the cache key: test/render is stdlib-only and has
          # no go.sum, and go.mod changes are what invalidate the module cache anyway.
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: gofmt (must be clean)
        working-directory: ${{ matrix.module }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # crypto_reconcilers_test.go runs the reconciler scripts under every POSIX shell present; busybox
      # adds ash, the shell the alpine/k8s reconciler image actually runs (dash is already present).
      - name: busybox (the reconcilers' runtime shell)
        if: matrix.module == 'test/render'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox || true

      - name: go test -race
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

      # The aws-shim's store-backed tests (cfn_services_pg_test.go: a stack's queues, topics, parameters
      # and keys used through the SQS/SNS/SSM/KMS front doors) need a real Postgres — the runner's
      # preinstalled one, started for this step. Each test makes and drops its own database.
      - name: aws-shim store-backed tests (Postgres)
        if: matrix.module == 'console-api'
        working-directory: console-api
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -qc "CREATE ROLE shimtest LOGIN SUPERUSER PASSWORD 'shimtest'"
          OPENINFRA_TEST_PG_URI='postgres://shimtest:shimtest@127.0.0.1:5432/postgres?sslmode=disable' \
            go test -race -count=1 -run 'TestServicesPG' ./cmd/aws-shim/

      # The oracle mode engine (recover/tolerate/deny) lives under the `convergence` build tag with
      # the rest of the chaos harness, but the mode-engine tests use in-memory fakes (no DB), so run
      # just those under the tag. -run isolates them from the DB-backed convergence/migration tests.
      # The mode engine + every per-plane oracle adapter's prove-red/green test (no DB): each adapter
      # must go BOTH green on good data and red on a real product failure — "an oracle that has never
      # gone red has never been shown it can." Live Test<Plane> entrypoints run in the chaos suite.
      - name: oracle engine + per-plane prove-red (convergence tag, no DB)
        if: matrix.module == 'apply-sink'
        working-directory: apply-sink
        run: go test -tags convergence -run 'TestModeEngine|RedGreen' -count=1 ./...

      # docs/chaos-scenarios.md is generated from chaos/scenarios.json — fail if it drifted.
      - name: chaosdoc drift-guard
        if: matrix.module == 'tools/chaosdoc'
        working-directory: tools/chaosdoc
        run: go run . -check

      # Every chain in chaos/scenarios.json must be type-legal against chaos/grammar.json
      # (fail-closed) — a scenario that drifts off the grammar, or a grammar that loses a
      # connector, fails here.
      - name: chainforge grammar gate
        if: matrix.module == 'tools/chainforge'
        working-directory: tools/chainforge
        run: go run . validate

  # Console SPA: typecheck + build. Without this, dependency bumps to ui/ (e.g.
  # Dependabot's npm PRs) merged with no verification that the console still compiles.
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: install
        working-directory: ui
        run: npm ci

      - name: typecheck
        working-directory: ui
        run: npm run typecheck

      - name: unit tests
        working-directory: ui
        run: npm test

      - name: build
        working-directory: ui
        run: npm run build

  # The lottery draw engine (chaos/lottery-draw.py) is pure + replay-critical: a fixed seed must
  # yield a fixed draw, and the oracle-partitioning invariant must hold. stdlib only, no deps.
  chaos-draw:
    name: chaos-draw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lottery draw unit test
        run: python3 chaos/test_lottery_draw.py

      - name: scenario convention guard (EXIT_INCONCLUSIVE=42)
        run: python3 chaos/test_scenario_conventions.py

      - name: per-run sandbox isolation renderer tests
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 chaos/test_runspace.py

      - name: capacity reservation ledger tests
        run: python3 chaos/test_capacity_ledger.py

      - name: chain→manifest compiler tests
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 chaos/test_compile_chain.py

      # The platform OpenAPI spec is generated from the CRD schemas — fail if it drifted.
      - name: platform OpenAPI drift gate
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 docs/openapi/generate.py --check

      # The aws-shim service list + count in README.md and docs/aws-shim.md are generated from
      # probe/shim-services.yaml and cross-checked against probe/aws-shim-*.sh — fail if they drifted
      # (e.g. a new probe not added to the registry, or a hand-edited generated block). The same command
      # holds every probe-proven service to a live denial (one of its probes asserts AWS's access-denied,
      # and probe/iam-no-policy.sh calls every service the router serves), and is the customer-surface
      # gate: every claim kind, spec field, console route, console screen and AWS API a customer can reach
      # (read from the XRDs, the kinds table, the console's route table and screens, the shim's router)
      # has an AWS-shaped entry in probe/registry/customer-surface.json — or a ruling in
      # probe/registry/surface.yaml — and docs/customer-surface.md is current.
      # The same command is the AWS coverage gate: it joins the CloudFormation engine's types with the
      # shim router's front doors (probe/registry/, read from code by the cfn and console-api Go tests,
      # which fail when those halves are stale) and fails when a type a stack can create has no front
      # door for its own API, or a front door that serves no call reading it, unless
      # probe/registry/coverage.yaml excuses it with a reason; or when the docs it renders are stale.
      - name: aws-shim service-list drift gate + AWS coverage gate
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 probe/shimgen.py --check

      # The coverage gate proven RED as well as green: a deliberately added CloudFormation type with no
      # front door fails it — in the module and end to end through `shimgen.py --check` on a copy of
      # the repository — as do stale, wildcard or reasonless exceptions and over-claiming docs.
      - name: AWS coverage gate tests (prove-red)
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 probe/test_coverage.py

      # The customer-surface and denial gates proven RED as well as green: a claim kind with no IAM
      # action row, a claim field or console route the committed registry does not list, a route on an
      # action AWS does not document, a screen that belongs to no service, a platform extra without the
      # operator's ruling, and a proven service whose probes assert no denial each fail — in the module and
      # end to end through `shimgen.py --check` on a copy of the repository.
      - name: customer-surface + denial gate tests (prove-red)
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 probe/test_surface.py

      # The IAM probes' own self-tests, against fakes (no cluster): each probe's allow/deny logic, cleanup
      # and inconclusive paths.
      - name: IAM probe self-tests
        run: python3 probe/test_iam_probes.py

      - name: chaos shell scripts parse (bash -n)
        run: for f in chaos/*.sh; do bash -n "$f"; done

      # A probe's mint_key records the Users + access keys it creates so the EXIT trap can delete
      # them. Called inside $(...), it runs in a subshell, the record is lost, and every run leaves
      # working access keys behind. mint_key returns MK_AK/MK_SK instead; call it directly.
      - name: aws-shim probes clean up the credentials they mint
        run: |
          if grep -n -F '$(mint_key' probe/*.sh; then
            echo "::error::call mint_key directly (it sets MK_AK/MK_SK), never inside \$(...)"; exit 1
          fi
          for f in probe/*.sh; do bash -n "$f"; done

  lambda-runtime:
    name: lambda-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runtime bootstraps (node, python, dotnet8 and dotnet10) run as processes against a stub aws-shim:
      # the stored deployment package fetch (#402) — bearer token, SHA-256, retries, zip-entry refusals — and
      # the function's own timeout, enforced from the invoke's arrival (#413). Each test runs once on the
      # runner's Python and .NET 8, then again on Python 3.14 and .NET 10 (#409), as each runtime's image runs.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        id: py314
        with: { python-version: "3.14", update-environment: false }
      - name: runtime tests (python3, dotnet8)
        run: |
          for t in code_package cfn_response context log_tail timeout layers_url role_credentials; do
            python3 test/lambda-runtime/${t}_test.py
          done
      - name: runtime tests (python3.14, dotnet10)
        env: { OPENINFRA_TEST_DOTNET: "10.0" }
        run: |
          for t in code_package cfn_response context log_tail timeout layers_url role_credentials; do
            "${{ steps.py314.outputs.python-path }}" test/lambda-runtime/${t}_test.py
          done

  vm-creds-cli:
    name: vm-creds-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The in-guest instance metadata agent ships inside vm-composition.yaml; every step below runs
      # the exact agent text extracted from it, with the config shape test/render pins
      # (test/vm-creds/testdata/metadata-agent.golden.json).
      #
      # Agent logic (IMDSv2 tokens, hop-limit TTL, httpTokens, metadata paths, credential cache, the
      # loopback credentials endpoint) — on the runner's python3 AND on Python 3.6, the oldest guest
      # interpreter it must run on (RHEL 8 platform-python).
      # The TLS cases need a throwaway PKI; python:3.6-slim has no openssl CLI, so it is made here and handed in.
      - name: metadata agent unit tests (python3 + python 3.6)
        run: |
          python3 test/vm-creds/metadata_agent_test.py
          python3 test/vm-creds/command_runner_test.py
          pki="$RUNNER_TEMP/vm-creds-pki"
          python3 test/vm-creds/vmcreds_common.py make-pki "$pki"
          docker run --rm -v "$PWD:/src:ro" -v "$pki:/pki:ro" -e OPENINFRA_TEST_PKI=/pki -w /src python:3.6-slim python3 test/vm-creds/metadata_agent_test.py
          docker run --rm -v "$PWD:/src:ro" -v "$pki:/pki:ro" -e OPENINFRA_TEST_PKI=/pki -w /src python:3.6-slim python3 test/vm-creds/command_runner_test.py
      # The real network path, in a throwaway network namespace (never the runner's own network): the
      # agent's metadata namespace, port 80 left free for the workload, EC2 hop-limit semantics for a
      # "container" one forwarding hop behind the guest, and a "LAN host" routing through the guest dropped.
      - name: metadata agent network namespace + hop limit (isolated netns, root)
        run: sudo unshare --net --mount --fork python3 test/vm-creds/metadata_agent_netns_test.py
      # #347 items 13 + 14 + A: real aws CLIs get VM role credentials from the agent via the env the
      # composition renders (FULL_URI alone, no token variable) and via IMDSv2 with no container env, trust
      # the platform CA through AWS_CA_BUNDLE, and reach AWS_ENDPOINT_URL with no --endpoint-url. ubuntu-latest
      # ships aws-cli v2 (the hard gate, native AWS_ENDPOINT_URL). A real aws-cli v1 1.22 (Ubuntu 22.04's
      # version, which predates AWS_ENDPOINT_URL) proves the shipped [plugins] endpoint plugin: it builds only
      # on an older Python (PyYAML 5.4.1 has no 3.12 wheel), so it is installed on a 3.10 and passed in by path.
      - name: python 3.10 for the aws-cli v1 build
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install aws-cli v1 1.22 (the distro v1 the endpoint plugin targets)
        run: |
          python3.10 -m venv "$RUNNER_TEMP/awsv1"
          "$RUNNER_TEMP/awsv1/bin/pip" install -q "Cython<3.0" "setuptools<60" wheel
          "$RUNNER_TEMP/awsv1/bin/pip" install -q --no-build-isolation "PyYAML==5.4.1"
          "$RUNNER_TEMP/awsv1/bin/pip" install -q "awscli==1.22.34"
          "$RUNNER_TEMP/awsv1/bin/aws" --version
      - name: VM credentials CLI test (container credentials + IMDSv2 + the v1 endpoint plugin)
        run: OPENINFRA_AWS_V1="$RUNNER_TEMP/awsv1/bin/aws" python3 test/vm-creds/container_creds_cli_test.py
