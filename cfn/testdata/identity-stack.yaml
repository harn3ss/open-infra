AWSTemplateFormatVersion: "2010-09-09"
Description: "Identity resources the engine can create: an IAM user (identity only — permissions come from group membership) and a Cognito user pool (a hosted OIDC pool / Keycloak realm)."
Resources:
  AppUser:
    Type: AWS::IAM::User
    Properties:
      UserName: appuser
  AppPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: app-pool
      MfaConfiguration: "OFF"
