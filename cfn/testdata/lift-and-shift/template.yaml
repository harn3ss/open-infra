AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Generic lift-and-shift fixture. One EC2 instance (instance role, encrypted data disk, IMDSv2,
  security group, Elastic IP) that reads an S3 bucket and pulls a container from an ECR repository,
  pulls from an existing ECR repository, plus a static site served by CloudFront from a private S3 bucket. The same template deploys to AWS
  and to open-infra; only the parameter file differs. The instance's UserData checks each behavior
  and serves the results at http://<Elastic IP>/results.json.

Parameters:
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    # 22.04: its apt archive still ships the distro awscli (v1), so the instance proves both CLIs.
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
  InstanceType:
    Type: String
    Default: t3.small
  SiteDomain:
    Type: String
    Description: The static site's hostname (a CloudFront alias).
  SiteHostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 zone for automatic ACM DNS validation on AWS. Empty to validate by hand.
  AppRepositoryName:
    Type: String
    Description: An existing ECR repository the instance pulls its app image from (pushed by CI).
  AppImageTag:
    Type: String
    Default: app
  SesSenderAddress:
    Type: String
    Default: fixture-sender@example.test
    Description: >-
      The address the instance sends email as through SES. On AWS it must be a verified SES identity
      (and, while the account is in the SES sandbox, so must the recipient).
  SesRecipientAddress:
    Type: String
    Default: fixture-recipient@example.test
    Description: Where the instance's test email goes.
  AppAddressAllocationId:
    Type: String
    Default: ""
    Description: >-
      An Elastic IP kept in its own stack (eip.yaml's AllocationId output), so the address outlives this
      stack. Empty: this stack allocates its own.

Conditions:
  HasZone: !Not [!Equals [!Ref SiteHostedZoneId, ""]]
  OwnAddress: !Equals [!Ref AppAddressAllocationId, ""]

Resources:
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AppQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-jobs"

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
      Policies:
        - PolicyName: app-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${AppBucket.Arn}/*"
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt AppBucket.Arn
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: "*"
              - Effect: Allow
                Action: [ecr:DescribeRepositories, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${AppRepositoryName}"
              # The sender's DOMAIN identity (the usual verified-domain setup): any address at it may send.
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: !Sub
                  - "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}"
                  - SenderDomain: !Select [1, !Split ["@", !Ref SesSenderAddress]]
              - Effect: Allow
                Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueUrl]
                Resource: !GetAtt AppQueue.Arn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH and HTTP to the app instance
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestUbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt AppSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        HttpEndpoint: enabled
      BlockDeviceMappings:
        # The root volume, encrypted (as account-default EBS encryption makes it): the AMI's root device.
        - DeviceName: /dev/sda1
          Ebs: { VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        - DeviceName: /dev/sdf
          Ebs: { VolumeSize: 1, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Each check appends "name": "ok|fail" to results.json, served on port 80.
          exec >/var/log/fixture.log 2>&1
          set -u
          mkdir -p /var/www && cd /var/www
          # Served by a unit, so the results outlive a stop and start (a resize); each boot also records
          # the memory the instance has and the boot's id at /boot.json.
          cat > /usr/local/bin/fixture-boot-info <<'SH'
          #!/bin/sh
          mem=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          printf '{"memTotalKiB": %s, "bootId": "%s"}\n' "$mem" "$(cat /proc/sys/kernel/random/boot_id)" > /var/www/boot.json
          SH
          chmod +x /usr/local/bin/fixture-boot-info
          cat > /etc/systemd/system/fixture-web.service <<'UNIT'
          [Unit]
          Description=The fixture's results and this boot's memory, on port 80
          After=network-online.target
          [Service]
          WorkingDirectory=/var/www
          ExecStartPre=/usr/local/bin/fixture-boot-info
          ExecStart=/usr/bin/python3 -m http.server 80
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now fixture-web.service
          REGION="${AWS::Region}"
          check() { if eval "$2"; then r=ok; else r=fail; fi; echo "  \"$1\": \"$r\"," >> /var/www/r.part; echo "$1: $r"; }
          # retry <tries> <command>: the app's inputs (its config object, its image) arrive after boot.
          retry() { n=$1; shift; for i in $(seq 1 $n); do eval "$*" && return 0; sleep 10; done; return 1; }
          publish() { { echo "{"; cat /var/www/r.part; echo "  \"done\": \"$1\""; echo "}"; } > /var/www/results.tmp && mv /var/www/results.tmp /var/www/results.json; }
          : > /var/www/r.part; publish no

          # 1. UserData runs under bash (the shebang is honored).
          check userdata_bash '[ -n "$BASH_VERSION" ]'
          # The image's default user exists, as on its AMI (UserData routinely adds it to groups).
          check default_user 'id ubuntu'

          # 2. The encrypted data disk, by its Nitro device name: it is the 1 GiB volume (not some other
          #    disk), and it formats, mounts and holds a file.
          check data_disk '[ "$(blockdev --getsize64 /dev/nvme1n1)" -ge 1000000000 ] && mkfs.ext4 -q -F /dev/nvme1n1 && mkdir -p /data && mount /dev/nvme1n1 /data && echo ok > /data/probe && grep -q ok /data/probe'

          # 3. IMDSv2: a token is required, and the instance role's credentials are served.
          TOKEN=$(curl -s -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 300" http://169.254.169.254/latest/api/token)
          check imdsv2_token_required '[ "$(curl -s -o /dev/null -w %{http_code} http://169.254.169.254/latest/meta-data/instance-id)" = 401 ]'
          check imdsv2_role_credentials 'curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/security-credentials/ | grep -q .'
          publish no

          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3 4 5; do apt-get update -q && apt-get install -y -q docker.io unzip && break; sleep 15; done
          apt-get install -y -q awscli || echo "no distro awscli package in this image"

          # 4. aws s3 cp with the instance role: the distro CLI and aws-cli v2.
          check s3_cp_distro_cli "retry 90 aws --region $REGION s3 cp s3://${AppBucket}/hello.txt /tmp/hello-distro.txt && grep -q hello /tmp/hello-distro.txt"
          curl -sSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip && unzip -q -o /tmp/awscliv2.zip -d /tmp && /tmp/aws/install -i /opt/aws-cli -b /usr/local/bin --update
          check s3_cp_aws_cli_v2 "retry 30 /usr/local/bin/aws --region $REGION s3 cp s3://${AppBucket}/hello.txt /tmp/hello-v2.txt && grep -q hello /tmp/hello-v2.txt"

          # 5. A call outside the role's policy is denied (the role cannot list the site bucket): S3's own
          #    AccessDenied for that operation, not just any error (an unreachable or foreign endpoint fails too).
          check denied_outside_policy "/usr/local/bin/aws --region $REGION s3 ls s3://${SiteBucket} 2>&1 | grep -q 'An error occurred (AccessDenied) when calling the ListObjectsV2 operation'"
          publish no

          # 6. Email through SES with the instance role, as an address of the domain identity its policy
          #    names: SendEmail, SendRawEmail with a MIME message built here, and SES v2's SendEmail.
          #    (Functions, so check/retry's eval keeps the message's spaces intact.)
          send_email() {
            /usr/local/bin/aws --region $REGION ses send-email --from '${SesSenderAddress}' \
              --destination 'ToAddresses=${SesRecipientAddress}' --query MessageId --output text \
              --message 'Subject={Data=lift-and-shift ${AWS::StackName} send-email},Body={Text={Data=sent by the instance role}}'
          }
          printf 'From: %s\r\nTo: %s\r\nSubject: lift-and-shift %s send-raw-email\r\n\r\nsent raw by the instance role\r\n' \
            '${SesSenderAddress}' '${SesRecipientAddress}' '${AWS::StackName}' > /tmp/raw.eml
          python3 -c 'import json; json.dump({"Data": open("/tmp/raw.eml", newline="").read()}, open("/tmp/raw.json", "w"))'
          send_raw_email() {
            /usr/local/bin/aws --region $REGION ses send-raw-email --cli-binary-format raw-in-base64-out \
              --raw-message file:///tmp/raw.json --query MessageId --output text
          }
          send_email_v2() {
            /usr/local/bin/aws --region $REGION sesv2 send-email --from-email-address '${SesSenderAddress}' \
              --destination 'ToAddresses=${SesRecipientAddress}' --query MessageId --output text \
              --content 'Simple={Subject={Data=lift-and-shift ${AWS::StackName} sesv2-send-email},Body={Text={Data=sent by the instance role through SES v2}}}'
          }
          check ses_send_email "retry 6 send_email"
          check ses_send_raw_email "retry 6 send_raw_email"
          check ses_v2_send_email "retry 6 send_email_v2"
          publish no

          # 7. An image pulls from the registry (pushed after the stack creates the repository).
          URI=$(/usr/local/bin/aws --region $REGION ecr describe-repositories --repository-names ${AppRepositoryName} --query 'repositories[0].repositoryUri' --output text)
          REG=$(echo "$URI" | cut -d/ -f1)
          for i in $(seq 1 90); do
            /usr/local/bin/aws --region $REGION ecr get-login-password | docker login --username AWS --password-stdin "$REG" && docker pull "$URI:${AppImageTag}" && break
            sleep 10
          done
          check ecr_pull "docker image inspect '$URI:${AppImageTag}' >/dev/null"

          # 8. A container in the guest gets the role's credentials through the default chain (IMDS, hop limit 2).
          check container_default_chain "docker run --rm -e AWS_REGION=$REGION '$URI:${AppImageTag}' s3 cp s3://${AppBucket}/hello.txt - | grep -q hello"
          publish no

          # 9. AWS's own names reach the platform, never AWS. Without AWS_ENDPOINT_URL (an SDK that ignores
          #    it, a URL from the AWS side's configuration) the CLI calls sqs.<region>.amazonaws.com with an
          #    AWS-style queue URL, and <bucket>.s3.<region>.amazonaws.com.
          QURL="https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${AWS::StackName}-jobs"
          sqs_by_aws_url() {
            env -u AWS_ENDPOINT_URL /usr/local/bin/aws --region $REGION sqs send-message --queue-url "$QURL" --message-body cli-aws-style >/dev/null || return 1
            M=$(env -u AWS_ENDPOINT_URL /usr/local/bin/aws --region $REGION sqs receive-message --queue-url "$QURL" --wait-time-seconds 10 --query 'Messages[0].[Body,ReceiptHandle]' --output text) || return 1
            [ "$(echo "$M" | cut -f1)" = cli-aws-style ] || return 1
            env -u AWS_ENDPOINT_URL /usr/local/bin/aws --region $REGION sqs delete-message --queue-url "$QURL" --receipt-handle "$(echo "$M" | cut -f2)"
          }
          check sqs_aws_style_queue_url "retry 6 sqs_by_aws_url"
          check s3_aws_name "env -u AWS_ENDPOINT_URL /usr/local/bin/aws --region $REGION s3 cp s3://${AppBucket}/hello.txt - | grep -q hello"

          # 10. The registry by its ECR name, as UserData and compose files name images.
          ECRHOST="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
          ecr_by_aws_name() {
            /usr/local/bin/aws --region $REGION ecr get-login-password | docker login --username AWS --password-stdin "$ECRHOST" >/dev/null &&
              docker pull -q "$ECRHOST/${AppRepositoryName}:${AppImageTag}" >/dev/null
          }
          check ecr_pull_aws_name "retry 6 ecr_by_aws_name"
          publish no

          # 11. The JavaScript SDK v3 with its default configuration, in a container: S3Client addresses the
          #     bucket virtual-hosted on AWS_ENDPOINT_URL's host, batch-deletes (DeleteObjects: each key
          #     authorized, a key the role may not delete is that key's AccessDenied), and SQSClient sends to
          #     an AWS-style QueueUrl's host.
          cat > /tmp/sdkv3.js <<'JS'
          const { S3Client, GetObjectCommand, PutObjectCommand, DeleteObjectsCommand, HeadObjectCommand } = require("@aws-sdk/client-s3");
          const { SQSClient, SendMessageCommand, ReceiveMessageCommand, DeleteMessageCommand } = require("@aws-sdk/client-sqs");
          const [bucket, queueUrl, otherBucket] = process.argv.slice(2);
          (async () => {
            const s3 = new S3Client({});
            const obj = await s3.send(new GetObjectCommand({ Bucket: bucket, Key: "hello.txt" }));
            if (!(await obj.Body.transformToString()).includes("hello")) throw new Error("unexpected object body");
            const keys = ["batch/one.txt", "batch/two.txt"];
            for (const Key of keys) await s3.send(new PutObjectCommand({ Bucket: bucket, Key, Body: Key }));
            const del = await s3.send(new DeleteObjectsCommand({ Bucket: bucket, Delete: { Objects: keys.map((Key) => ({ Key })) } }));
            if ((del.Deleted || []).length !== 2 || (del.Errors || []).length !== 0) throw new Error("DeleteObjects: " + JSON.stringify(del));
            for (const Key of keys) {
              const gone = await s3.send(new HeadObjectCommand({ Bucket: bucket, Key })).then(() => false, (e) => e.$metadata?.httpStatusCode === 404);
              if (!gone) throw new Error(Key + " is still there after DeleteObjects");
            }
            // The role may not delete in the other bucket: a 200 whose one error is that key's AccessDenied.
            const denied = await s3.send(new DeleteObjectsCommand({ Bucket: otherBucket, Delete: { Objects: [{ Key: "no-such-key.txt" }] } }));
            if ((denied.Errors || []).length !== 1 || denied.Errors[0].Code !== "AccessDenied") throw new Error("DeleteObjects outside the policy: " + JSON.stringify(denied));
            const sqs = new SQSClient({});
            await sqs.send(new SendMessageCommand({ QueueUrl: queueUrl, MessageBody: "sdk-v3-aws-style" }));
            for (let i = 0; i < 5; i++) {
              const r = await sqs.send(new ReceiveMessageCommand({ QueueUrl: queueUrl, WaitTimeSeconds: 5 }));
              for (const m of r.Messages || []) {
                await sqs.send(new DeleteMessageCommand({ QueueUrl: queueUrl, ReceiptHandle: m.ReceiptHandle }));
                if (m.Body === "sdk-v3-aws-style") { console.log("ok"); return; }
              }
            }
            throw new Error("the message did not come back");
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
          sdk_v3_defaults() {
            docker run --rm -e AWS_REGION=$REGION -v /tmp/sdkv3.js:/app/sdkv3.js:ro -w /app node:22-alpine \
              sh -c 'npm i --silent --no-audit --no-fund @aws-sdk/client-s3@3 @aws-sdk/client-sqs@3 >/dev/null && node sdkv3.js "$0" "$1" "$2"' "${AppBucket}" "$QURL" "${SiteBucket}"
          }
          check sdk_v3_default_clients "retry 3 sdk_v3_defaults"
          publish yes

  AppAddress:
    Type: AWS::EC2::EIP
    Condition: OwnAddress
    Properties:
      Domain: vpc

  AppAddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !If [OwnAddress, !GetAtt AppAddress.AllocationId, !Ref AppAddressAllocationId]
      InstanceId: !Ref AppInstance

  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref SiteDomain
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasZone
        - [ { DomainName: !Ref SiteDomain, HostedZoneId: !Ref SiteHostedZoneId } ]
        - !Ref AWS::NoValue

  SiteHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-site-headers"
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }
        CustomHeadersConfig:
          Items:
            - { Header: X-Fixture, Value: lift-and-shift, Override: true }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: [!Ref SiteDomain]
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt SiteOriginAccess.Id
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed CachingOptimized
          ResponseHeadersPolicyId: !Ref SiteHeaders
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

Outputs:
  InstanceId:
    Description: >-
      The instance (what its instance metadata reports as instance-id). The deploy flow's code update runs
      on it with `aws ssm send-command --instance-ids` (its role attaches AmazonSSMManagedInstanceCore).
    Value: !Ref AppInstance
  InstanceAddress:
    Description: The instance's static address (Elastic IP). With an address from eip.yaml, that stack's PublicIp.
    Condition: OwnAddress
    Value: !Ref AppAddress
  InstanceAllocationId:
    Description: The Elastic IP allocation the instance carries.
    Value: !If [OwnAddress, !GetAtt AppAddress.AllocationId, !Ref AppAddressAllocationId]
  InstancePublicDnsName:
    Description: The instance's public DNS name ("" where the network gives instances none).
    Value: !GetAtt AppInstance.PublicDnsName
  InstancePrivateDnsName:
    Value: !GetAtt AppInstance.PrivateDnsName
  SiteUrl:
    Value: !Sub "https://${SiteDomain}"
  SiteDomainName:
    Value: !GetAtt SiteDistribution.DomainName
  SiteDistributionId:
    Description: The distribution to invalidate after uploading the site.
    Value: !Ref SiteDistribution
  AppBucketName:
    Value: !Ref AppBucket
  SiteBucketName:
    Value: !Ref SiteBucket
