AWSTemplateFormatVersion: "2010-09-09"
Description: Things the engine must refuse — an unsupported type and an unsupported intrinsic. Nothing here should provision.

Resources:
  # unsupported: no backing open-infra kind (the engine never guesses).
  Users:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true

  # supported type, but pulls a value from another stack — an unsupported intrinsic.
  Fn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: consumer
      Role: !ImportValue shared-role-arn
      Runtime: provided.al2
      Handler: bootstrap
