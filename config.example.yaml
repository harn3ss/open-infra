# ─────────────────────────────────────────────────────────────
# open-infra site config — copy to config.yaml and edit.
#
#   cp config.example.yaml config.yaml
#
# config.yaml is GITIGNORED. It is the ONLY place your real LAN,
# domain, and secret references should live. Never commit it.
# All values below are EXAMPLES/placeholders — replace them.
# ─────────────────────────────────────────────────────────────

# "dev"  = single-node, non-HA, sslip.io magic DNS, self-signed TLS. Try-it mode.
# "prod" = multi-node HA (3 servers + N agents), real DNS, real TLS.
mode: dev

cluster:
  # Name shown in Argo/Grafana. Cosmetic.
  name: open-infra

  # k3s version channel. "stable" is fine for most.
  k3sChannel: stable

  # API-server AUDIT LOG directory on the control-plane node. The audit-trail
  # features — off-siting to a WORM store and the console CloudTrail view — read
  # the log from this HOST directory. The default is the k3s location; on other
  # distributions set it to match your API server's --audit-log-path directory:
  #   k3s      /var/lib/rancher/k3s/server/logs
  #   RKE2     /var/lib/rancher/rke2/server/logs
  #   kubeadm  the directory of your --audit-log-path (e.g. /var/log/kubernetes/audit)
  #   Talos    the directory your audit policy writes to
  # install.sh probes the control-plane node and WARNS if the log isn't found
  # here. Because these two manifests mount the directory and are synced from git
  # (not templated), set the SAME path in both when you change it — they are
  # flagged: platform/observability/promtail.yaml and
  # platform/security/audit-offsite.yaml. See docs/portability.md.
  auditLogDir: /var/lib/rancher/k3s/server/logs

  # HA control plane needs 3 servers with embedded etcd. In dev, leave as-is.
  # Real hostnames/IPs belong here ONLY (this file is ignored by git).
  servers: []          # e.g. ["10.0.0.11", "10.0.0.12", "10.0.0.13"]
  agents:  []          # e.g. ["10.0.0.21"]

networking:
  # MetalLB needs a small pool of spare LAN IPs OUTSIDE your DHCP range.
  # Reserve these on your router first. If you also enable lanExpose (below), keep
  # this pool DISJOINT from the lanExpose EIP zone (eipRange + lrpIP + traefikIP +
  # kourierIP) or MetalLB will grab a FIP IP and fight the OVN ARP responder.
  # Comma-separate ranges to leave gaps. EXAMPLE ONLY — set your own:
  metallbPool: "192.0.2.211-192.0.2.229"

  # The DNS suffix an instance's public DNS name is built on (CloudFormation GetAtt
  # <Instance>.PublicDnsName, the shape of AWS's ec2-a-b-c-d.compute-1.amazonaws.com):
  # ec2-<LAN IP with dashes>.<suffix>. Use a zone that resolves such names on your LAN
  # (a wildcard DNS zone that answers a name carrying an address with that address).
  # Blank => instances have no public DNS name (""), as in an AWS VPC without DNS
  # hostnames. install.sh writes it to configmap/openinfra-public-dns for the aws-shim
  # (restart the shim after changing it). EXAMPLE ONLY — set your own:
  publicDnsSuffix: ""

  # AWS's own names inside VM guests (with components.awsShim): a resolver for guests
  # only answers the amazonaws.com names of the services the aws-shim serves (and
  # <account>.dkr.ecr.<region>.amazonaws.com) with the platform's addresses, and guests
  # trust a CA name-constrained to amazonaws.com that only they trust. A queue URL, image
  # name or bucket URL a guest carries from its AWS-side config then reaches the platform,
  # never AWS (platform/aws-shim/guest-aws-endpoints.yaml). false => guests use the
  # cluster DNS, and such URLs reach AWS. A guest picks the change up at its next start.
  guestAwsEndpoints: true

  # Ingress controller bundled with k3s. Keep traefik for v1.
  ingress: traefik

  # Traefik as a host-network edge (routed ingress, the AWS ALB shape). On kube-ovn a
  # LoadBalancer in front of a pod-network traefik answers LAN clients unreliably (the
  # cross-node return path is asymmetric); on the host network the node a request
  # reaches is the one that answers. install.sh renders the traefik HelmChartConfig
  # (hostNetwork, binding 8000/8443) and a traefik-lb LoadBalancer Service (80/443,
  # externalTrafficPolicy: Local). Ignored while lanExpose.enabled is true (that mode
  # pins traefik to the gateway node instead). EXAMPLE ONLY — set your own:
  traefik:
    hostNetwork: false
    lbPool: ""                 # MetalLB IPAddressPool for traefik-lb (blank => MetalLB's default)
    lbIP: ""                   # pin traefik-lb's address (blank => MetalLB picks one)

  # Direct-LAN networking for VMs (kind: VirtualMachine, network: bridge): attach
  # VMs to the physical LAN via Multus + macvlan so they pull a real DHCP lease —
  # a first-class LAN host, no MetalLB/NAT. Set enabled: true and re-run
  # ./install.sh — it installs Multus (a cluster CNI change) and auto-labels the
  # nodes that have 'interface'. No manual steps. 'interface' is your LAN NIC;
  # only nodes that actually have it will host bridged VMs.
  vmLan:
    enabled: false
    interface: eno1             # your LAN NIC (e.g. eno1 / enp4s0)

  # LAN exposure for Services (kube-ovn external gateway). Under kube-ovn, plain
  # MetalLB LoadBalancer / NodePort external access does not work (the DNAT'd reply
  # never completes back to the LAN client). This controller makes it work: annotate
  # any Service with `openinfra.dev/lan-expose: "true"` (optionally
  # `openinfra.dev/lan-ip: <ip>`) and it provisions the kube-ovn OvnEip + OvnFip +
  # return-path policy so the Service's pod is reachable from the LAN on a stable
  # EIP — and re-points automatically when the pod restarts.
  #
  # The eipRange must be a slice of your static LAN zone that is DISJOINT from
  # metallbPool (so MetalLB can't grab a FIP IP). Requires kube-ovn as the CNI.
  # install.sh stands up the whole kube-ovn external-gateway substrate below from
  # this config so LAN exposure survives a from-scratch cluster rebuild — no manual
  # OVN steps. EXAMPLE ONLY — set your own:
  lanExpose:
    enabled: false
    lanCIDR: "192.0.2.0/24"                 # your LAN subnet (the EIPs live here)
    eipRange: "192.0.2.241-192.0.2.249"     # EIP pool for FIPs (disjoint from metallbPool)
    externalSubnet: external                # the kube-ovn external Subnet name
    # Optional, comma-separated. The LAN subnets allowed to reach FIPs — used for BOTH
    # the return-path VPC policyRoutes and the per-service ingress NetworkPolicy ipBlock.
    # Defaults to just lanCIDR (the EIP's own subnet). Add other client VLANs here so a
    # client on a different VLAN than the EIP can reach FIPs (otherwise the subnet's
    # natOutgoing hijacks the reply). Include lanCIDR plus each client VLAN, e.g.:
    # returnPathCIDRs: "192.0.2.0/24,198.51.100.0/24"

    # The kube-ovn external gateway. A FIP is a *distributed* NAT whose ARP
    # responder lives on the exposed pod's own chassis, so exactly one node bridges
    # the physical LAN and all FIP-exposed pods are pinned there. install.sh renders
    # the ProviderNetwork/Vlan/Subnet, the pinned router LRP, the gateway ConfigMap,
    # and the node label. Leave gateway.node blank to skip the substrate (e.g. you
    # provisioned it by hand). EXAMPLE ONLY — set your own:
    gateway:
      node: ""                              # node whose NIC bridges the LAN (blank => skip)
      interface: eno1                       # that node's physical LAN NIC
      routerIP: 192.0.2.254                 # your LAN's real default gateway (the router)
      lrpIP: 192.0.2.250                    # pinned OVN router-port EIP (off the app IPs)
      # IPs OVN must NOT auto-assign: everything on the /24 except the usable EIP
      # zone (eipRange + lrpIP + traefikIP + kourierIP — here .230-.250 usable, so
      # exclude the rest). Comma-separated kube-ovn ranges. EXAMPLE ONLY:
      subnetExcludeIps: "192.0.2.1..192.0.2.229,192.0.2.251..192.0.2.254"

    # Optional shared-ingress exposure. Pinning traefik (all web apps) and kourier
    # (all Knative Functions) to the gateway node LAN-exposes the whole platform with
    # zero per-app work — apps behind them can live anywhere. Blank => leave alone.
    traefikIP: 192.0.2.232                  # web apps via traefik (blank => skip)
    kourierIP: 192.0.2.231                  # Knative Functions via kourier (blank => skip)

dns:
  # "sslip"     -> zero-config magic DNS: <app>.<lb-ip>.sslip.io  (great for dev)
  # "cloudflare"-> real public DNS via Cloudflare (see edge: below)
  # "external"  -> ExternalDNS against your own provider
  provider: sslip

tls:
  # "selfsigned" -> internal CA for LAN (dev)
  # "letsencrypt"-> public certs (needs a real domain + reachable HTTP-01, or DNS-01)
  issuer: selfsigned
  letsencryptEmail: ""   # required if issuer: letsencrypt

certificates:
  # ACM's domain validation, done once: the domains you own, comma-separated. A static site
  # (CloudFront Aliases) whose every hostname is under one gets its certificate from an
  # ACM-style CA (ClusterIssuer openinfra-acm) that the platform root signs and that is
  # name-constrained to exactly these domains, so a client that trusts the platform root
  # trusts the site, and the CA can vouch for no other name. The CloudFormation front door
  # then refuses an alias outside them (on AWS its certificate would never validate). Each
  # domain must be inside the platform root's own name constraints (cluster.local, svc,
  # sslip.io, or a domain added in platform/networking/cluster-ca.yaml). Prefer a domain of
  # its own for sites, so no tenant can name a platform hostname. Blank => sites stay
  # self-signed (openinfra-issuer). EXAMPLE ONLY — set your own:
  validatedDomains: ""   # e.g. sites.192-0-2-232.sslip.io

# Public edge — only needed to serve the internet (see docs/architecture.md §edge).
edge:
  enabled: false
  # Cloudflare Tunnel is the recommended public path (no port-forward, no static IP).
  cloudflare:
    domain: ""                  # e.g. example.com
    # Provide these via Sealed Secrets / env at install time — do NOT inline real
    # tokens here even though this file is ignored. Names reference k8s secrets.
    tunnelTokenSecret: "cloudflare-tunnel-token"
    apiTokenSecret: "cloudflare-api-token"   # scoped for DNS-01 + Tunnel
  # Lightsail + WireGuard is the "I need raw TCP/UDP" advanced tier.
  wireguard:
    enabled: false
    endpoint: ""                # public IP:port of the Lightsail edge

storage:
  # Fast local SSD/NVMe (RWO) for databases. k3s local-path. NEVER put DBs on CIFS/NFS.
  # Enforced: DB pods only schedule onto a node measured disk-class nvme or sata-ssd.
  databaseStorageClass: local-path
  # MinIO object storage topology. false = standalone (default; fine for dev /
  # single node). true = distributed HA (4 erasure-coded drives across nodes;
  # needs >=4 drives). Not defaulted to HA — opt in deliberately.
  highAvailability: false
  # NAS-backed shared/bulk volumes (RWX). Point at an SMB/NFS export.
  shared:
    enabled: false
    type: smb                   # smb | nfs
    server: ""                  # e.g. 192.0.2.50
    share: ""                   # e.g. /nas
    # Reuse an existing MinIO data dir if you already have one.
    minioDataPath: ""           # e.g. /mnt/<your-nas>/minio-data

registry:
  # "ghcr" = zero infra (recommended). "harbor" = fully self-hosted/offline.
  provider: ghcr

gitops:
  # The state repo Argo watches (can be this repo's /deploy dir in monorepo mode).
  repoUrl: ""                   # e.g. https://github.com/me/open-infra-gitops
  branch: main
  path: deploy

components:
  # Platform services installed by the GitOps app-of-apps. All are on by default
  # (batteries-included). Set any to `false` to leave it out — install.sh wires
  # this into the app-of-apps include path.
  minio: true                  # object storage (S3)
  cloudnativePG: true          # managed Postgres (RDS)
  mariadbOperator: true        # managed MySQL/MariaDB (RDS MySQL) — engine: mysql
  nats: true                   # queues / JetStream (SQS/SNS)
  redis: true                  # cache
  observability: true          # kube-prometheus-stack + Loki + Grafana
  sealedSecrets: true          # encrypted secrets in Git
  crossplane: true             # the Application/Model/Function abstraction engine
  console: true                # the web console (UI for everything)
  serverless: true             # Knative — kind: Function, scale-to-zero
  lakehouse: true              # Trino + Iceberg REST catalog (the kind: Query "trino" engine + Glue); heavy — DuckDB Query needs none of it
  gpu: true                    # NVIDIA device plugin + DCGM metrics (GPU nodes only)
  velero: true                 # scheduled backups → MinIO (node-agent fs backups)
  virtualization: true         # KubeVirt + CDI — kind: VirtualMachine (EC2-style VMs); needs /dev/kvm
  awsShim: false               # AWS-SDK interception shim (S3/STS/Lambda/AppSync) — experimental, opt-in, OFF by default
  openAppsync: false           # open-appsync — resolver-first VTL-faithful AppSync engine + kind: GraphQLApi authoring plane (the shim's AppSync surface fronts it); experimental, opt-in, OFF
  hardened: false             # hardened profile: enforce restricted PSS on the control plane + warn/audit elsewhere; opt-in, OFF (don't enable until workloads are PSS-compliant — see docs/security-and-compliance.md)
  encryption: false            # customer-owned keys: Vault Transit KMS + kind: EncryptionKey + encrypted Longhorn SC; experimental, opt-in, OFF (Vault needs operator init/unseal — see docs/encryption.md)
  pki: false                   # private CA: kind: CertificateAuthority (Vault PKI) + ca-issuer; experimental, opt-in, OFF (requires the encryption component + an initialized Vault — see docs/certificate-authority.md)
  objectEncryption: false      # object encryption at rest: every NEW MinIO bucket is encrypted by default (AES256) with the platform MinIO's own key, and the aws-shim accepts BucketEncryption; opt-in, OFF (turning it on restarts all MinIO servers together once; back the key up — see docs/encryption.md)
  objectEncryptionKes: false   # MinIO KES with a Vault KV keystore (customer-held keys + crypto-erase); experimental, opt-in, OFF; shipped but not wired to the platform MinIO (requires the encryption component — see docs/encryption.md)
  attestation: false           # daily immutable compliance-attestation snapshots to the WORM audit store; opt-in, OFF (sign out-of-band with the release key — see docs/compliance-attestation.md)
  airgap: false                # air-gap support: in-cluster registry mirror + image prefetch (front-load), and the optional public-egress cutoff; opt-in, OFF (internet allowed by default — see docs/airgapping.md)
  mail: false                  # transactional email: kind: EmailSender + the shared in-cluster SMTP relay, which also serves the aws-shim's SES front door; opt-in, OFF (internet delivery needs a smarthost + SPF/DKIM — see docs/email.md)

# Mail (issue #23). Only meaningful when components.mail: true.
mail:
  # true = a TEST cluster: the relay is a capturing sink (Mailpit) that accepts every message and
  # delivers none, so SES and kind: EmailSender can be exercised without ever sending real mail; read
  # what was "sent" through its API (docs/email.md). false (default) = the postfix relay, delivering.
  capture: false

# Air-gap posture (issue #72). Only meaningful when components.airgap: true. Two phases, deliberately
# separate so you front-load first and cut the internet last — and both are reversible.
airgap:
  # THE ELECTION. false = internet allowed (default). true = apply the cluster-wide public-egress
  # cutoff (deny 0.0.0.0/0 except RFC1918/CGNAT/link-local) — install.sh applies the form your CNI
  # needs: Cilium CCNP, Calico/Canal GNP, or kube-ovn ovn-default ACLs. Do NOT set true until the
  # registry mirror is populated (run the prefetch) and nodes point at it, or image pulls will fail.
  denyPublicEgress: false
