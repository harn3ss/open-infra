          description: Not found
components:
  schemas:
    ObjectMeta:
      type: object
      properties:
        name:
          type: string
          description: Resource name (RFC 1123).
        namespace:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    Status:
      type: object
      description: K8s API status on error.
      properties:
        message:
          type: string
        reason:
          type: string
        code:
          type: integer
    Application:
      type: object
      description: 'open-infra kind: Application.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - Application
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            image:
              type: string
              description: Container image to run, e.g. ghcr.io/me/my-api:latest. Omit for a data-only app (just a database,
                buckets, or queues).
            port:
              type: integer
              description: The port your container listens on (e.g. 8080). Needed to serve the app over HTTPS or a LAN IP.
            domain:
              type: string
              description: "Hostname to serve the app on \u2014 open-infra provisions Ingress, a TLS certificate, and DNS\
                \ for it (e.g. my-api.example.com)."
            expose:
              type: boolean
              default: false
              description: "Also expose the app's port on a LAN IP (MetalLB LoadBalancer), in addition to any Ingress \u2014\
                \ for raw TCP, non-HTTP, or no-DNS access."
            scaling:
              type: object
              description: Horizontal autoscaling (HPA) based on CPU.
              properties:
                min:
                  type: integer
                  default: 1
                  description: Minimum number of replicas.
                max:
                  type: integer
                  default: 5
                  description: Maximum replicas the autoscaler may scale up to.
                targetCPUPercent:
                  type: integer
                  default: 70
                  description: Average CPU utilization (%) the autoscaler targets before adding replicas.
            database:
              type: object
              description: Attach a managed database; open-infra provisions it and injects its connection URL into the app.
              properties:
                engine:
                  type: string
                  enum:
                  - postgres
                  - mongo
                  - mysql
                  - babelfish
                  default: postgres
                  description: "Database engine. postgres = CloudNativePG (relational, injects DATABASE_URL). mongo = FerretDB\
                    \ on DocumentDB-Postgres (Mongo wire protocol, injects MONGODB_URI). mysql = MariaDB (MySQL wire protocol,\
                    \ injects DATABASE_URL). babelfish = SQL Server-compatible (TDS 1433 + T-SQL on Postgres) \u2014 experimental,\
                    \ single instance."
                name:
                  type: string
                  description: Database name (defaults to the application name).
                highAvailability:
                  type: boolean
                  default: false
                  description: 'Run the database highly available (postgres: primary + standby on separate nodes with automatic
                    failover). Needs 2 or more nodes. Default false = single instance (fine for dev).'
                vector:
                  type: boolean
                  default: false
                  description: "postgres only: enable the pgvector extension (vector similarity search) \u2014 pairs with\
                    \ kind: Model for RAG."
                expose:
                  type: boolean
                  default: false
                  description: Expose the database on a LAN IP (MetalLB LoadBalancer) so workstations can connect directly.
                    Default false = in-cluster only.
                stopped:
                  type: boolean
                  default: false
                  description: Stop the database to save resources while keeping its data, like RDS stop/start (Postgres hibernates;
                    MySQL/Mongo scale to zero; PVCs are retained). Set back to false to start it.
                storageClass:
                  type: string
                  description: 'StorageClass for the database''s persistent volumes. When unset, each engine keeps its default
                    (local-path; babelfish: longhorn). Set this to your cluster''s StorageClass on substrates that don''t
                    ship a default local-path provisioner, or to pin the DB onto replicated storage (e.g. longhorn).'
            storage:
              type: object
              description: Object storage for the app.
              properties:
                buckets:
                  type: array
                  items:
                    type: string
                  description: S3-compatible bucket names to create and grant the app access to (MinIO).
            queues:
              type: array
              items:
                type: string
              description: Message queue names (NATS/JetStream) to create for the app.
            env:
              type: array
              description: Environment variables to set on the app's container.
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Variable name.
                  value:
                    type: string
                    description: Variable value.
            secrets:
              type: array
              items:
                type: string
              description: Sealed Secret names to mount into the app.
            securityGroups:
              type: array
              items:
                type: string
              description: SecurityGroup (firewall rule set) names to attach to this app's pods.
        status:
          type: object
          properties:
            url:
              type: string
    CertificateAuthority:
      type: object
      description: 'open-infra kind: CertificateAuthority.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - CertificateAuthority
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            commonName:
              type: string
              description: The CA's subject common name (e.g. "OpenInfra Internal Root CA").
            hierarchy:
              type: string
              enum:
              - root
              - intermediate
              default: root
              description: root = a self-signed root CA. intermediate = a CA signed by a parent CertificateAuthority (set-signed);
                requires spec.parent.
            parent:
              type: string
              description: The name of the parent CertificateAuthority that signs this CA when hierarchy=intermediate. Ignored
                for a root CA.
            keyType:
              type: string
              enum:
              - rsa-2048
              - rsa-4096
              - ec-256
              - ec-384
              default: rsa-4096
              description: Key type/size for the CA's private key.
            maxTtl:
              type: string
              default: 8760h
              description: Maximum TTL for certificates issued under this CA (Vault duration).
            allowedDomains:
              type: array
              items:
                type: string
              description: Domains the "issuer" PKI role may issue for (allow_subdomains=true). Empty permits none until set.
          required:
          - commonName
        status:
          type: object
          properties:
            ready:
              type: boolean
            pkiMount:
              type: string
              description: The Vault PKI mount for this CA (pki-<name>).
            caCertPem:
              type: string
              description: The CA certificate, PEM-encoded.
            serial:
              type: string
              description: The CA certificate's serial number.
            notAfter:
              type: string
              description: The CA certificate's expiry timestamp.
    DataClassification:
      type: object
      description: 'open-infra kind: DataClassification.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - DataClassification
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            level:
              type: string
              enum:
              - public
              - internal
              - confidential
              - restricted
              description: "Sensitivity level, ordered low\u2192high. `restricted` is the most sensitive (e.g. regulated /\
                \ CUI); `public` the least."
            description:
              type: string
              description: What data this class covers, shown in the console.
            requires:
              type: object
              description: The handling requirements data at this level must meet.
              properties:
                encryptionAtRest:
                  type: boolean
                  description: 'Data must be encrypted at rest. Satisfied by either an encrypted (LUKS) StorageClass for the
                    volume layer, or by binding the workload to a provisioned kind: EncryptionKey (Vault Transit) for the
                    app layer via the label openinfra.dev/encryptionkey: <key-name>.'
                networkRestricted:
                  type: boolean
                  description: The resource must be covered by a SecurityGroup / NetworkPolicy.
                noPublicExposure:
                  type: boolean
                  description: The resource must not be reachable via a LoadBalancer or public ingress.
                backup:
                  type: boolean
                  description: The resource must have a backup / snapshot policy.
                residencyNodeLabel:
                  type: string
                  description: "If set, the resource must be pinned (nodeSelector/placement) to nodes carrying this label\
                    \ \u2014 data-residency enforcement (e.g. openinfra.dev/residency)."
                retentionDays:
                  type: integer
                  description: Minimum retention for data / its audit records at this level.
          required:
          - level
        status:
          type: object
          properties:
            ready:
              type: boolean
            level:
              type: string
    DataFlow:
      type: object
      description: 'open-infra kind: DataFlow.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - DataFlow
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - nodes
          - edges
          properties:
            storageClass:
              type: string
              description: StorageClass for this resource's persistent volumes. Defaults to 'longhorn'. Set to your cluster's
                StorageClass on substrates that do not ship Longhorn (e.g. RKE2 with local-path).
            nodes:
              type: array
              description: 'Nodes on the canvas: database endpoints (role: database) or message topics (role: topic). `name`
                is the node id used by edges and as the replication origin marker.'
              items:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                  role:
                    type: string
                    enum:
                    - database
                    - topic
                    - function
                    - bucket
                    default: database
                    description: database = a DB endpoint; topic = a message stream apps consume; function = an HTTP transform
                      in the pipeline; bucket = an object-store sink. Non-database roles ignore the connection fields.
                  functionRef:
                    type: string
                    description: 'function role: name of a kind: Function in this namespace (resolved to its in-cluster URL).'
                  functionUrl:
                    type: string
                    description: 'function role: explicit HTTP endpoint (overrides functionRef).'
                  bucket:
                    type: string
                    description: 'bucket role: object-store bucket name.'
                  prefix:
                    type: string
                    description: 'bucket role: key prefix for written objects.'
                  engine:
                    type: string
                    enum:
                    - postgres
                    - mysql
                    - mariadb
                    - sqlserver
                  host:
                    type: string
                  port:
                    type: integer
                    default: 5432
                  database:
                    type: string
                  username:
                    type: string
                  passwordSecretRef:
                    type: object
                    required:
                    - name
                    properties:
                      name:
                        type: string
                      key:
                        type: string
                        default: password
                  schema:
                    type: string
                    default: public
                    description: 'Schema/namespace (Postgres: public; SQL Server: dbo). Ignored for MySQL.'
                  ssl:
                    type: boolean
                    default: false
                  x:
                    type: integer
                    default: 0
                    description: Canvas position (persisted for the editor).
                  y:
                    type: integer
                    default: 0
                    description: "Canvas position (persisted). Quoted \u2014 unquoted y is YAML boolean true."
            edges:
              type: array
              description: Data movement between nodes.
              items:
                type: object
                required:
                - from
                - to
                - type
                properties:
                  from:
                    type: string
                    description: Source node name.
                  to:
                    type: string
                    description: Target node name (for replication the link is bidirectional).
                  type:
                    type: string
                    enum:
                    - replication
                    - migration
                    - stream
                    - pipe
                    description: replication = bidirectional multi-master; migration = one-way from -> to; stream = publish
                      a database's changes to a topic; pipe = one-way ETL flow into a function (transform), database (load),
                      or bucket (store).
                  mode:
                    type: string
                    enum:
                    - full-load
                    - cdc
                    - full-load-and-cdc
                    default: full-load-and-cdc
                    description: 'Migration edges only: full-load / cdc / both.'
                  bootstrap:
                    type: boolean
                    default: false
                    description: 'Replication edges: create the target''s tables from `from` before syncing (seeds an empty
                      member). Initial rows then load via the CDC snapshot.'
            tables:
              type: array
              items:
                type: string
              description: Tables moved on every edge of this flow (e.g. ["public.orders"], or ["*"] for all). Scope is per-flow;
                per-edge table subsets are not yet supported.
            versionColumn:
              type: string
              default: _mm_version
            originColumn:
              type: string
              default: _mm_origin
            autoSyncTables:
              type: boolean
              default: false
              description: 'Multi-master only: automatically keep the table SET in sync across all members. A table created
                on ANY member is auto-created on the others (cross-engine) and made multi-master-ready, with no spec edit.
                Implies capturing all tables.'
            driftDetection:
              type: boolean
              default: false
              description: 'Multi-master only: run an always-on schema-drift detector alongside the flow that periodically
                introspects every member and logs `schema-drift: DIVERGENCE` when their table schemas diverge (a silent multi-master
                hazard). Opt-in; detection only, it never mutates schemas.'
        status:
          type: object
          properties:
            phase:
              type: string
            ready:
              type: boolean
    DatabaseProxy:
      type: object
      description: 'open-infra kind: DatabaseProxy.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - DatabaseProxy
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - targetDatabase
          properties:
            targetDatabase:
              type: string
              description: 'Name of the managed database to pool in front of (the database.name of its kind: Application).
                The proxy fronts that engine''s TDS Service (<targetDatabase>-babelfish:1433) in the same namespace.'
            engineFamily:
              type: string
              enum:
              - babelfish
              - sqlserver
              default: babelfish
              description: "Wire family of the target backend (the proxy connects to it in plaintext \u2014 the managed engine\
                \ is TDS-no-TLS). Client-side TLS is a separate concern: set spec.tls to terminate encrypt=on/strict clients\
                \ regardless of engineFamily (#6)."
            poolMax:
              type: integer
              default: 20
              minimum: 1
              description: "Max backend connections the proxy will ever open per credential key (user+database+password).\
                \ Beyond this, clients queue \u2014 this is the connection ceiling that protects the database from stampedes."
            acquireTimeoutMs:
              type: integer
              default: 10000
              minimum: 100
              description: How long a client waits for a backend when the pool is at its cap before failing.
            replicas:
              type: integer
              default: 1
              minimum: 1
              description: Proxy Deployment replicas (each keeps its own pool; size the cap accordingly).
            tls:
              type: object
              description: "Terminate client TLS at the proxy (issue #6). Off by default. When enabled the proxy presents\
                \ a cert-manager-issued serving certificate and accepts encrypt=on (TLS tunneled in PRELOGIN) and encrypt=strict\
                \ (TDS 8.0) clients \u2014 the modes JDBC/ODBC/.NET default to \u2014 while the backend connection stays plaintext\
                \ (the managed engine is TDS-no-TLS). A client that requires encryption when this is off is refused, never\
                \ downgraded."
              properties:
                terminate:
                  type: boolean
                  default: false
                  description: Enable TLS termination. A cert is issued via issuerRef.
                issuerRef:
                  type: object
                  description: The cert-manager (Cluster)Issuer that signs the proxy's serving cert.
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                      enum:
                      - Issuer
                      - ClusterIssuer
                      default: ClusterIssuer
                  required:
                  - name
                dnsNames:
                  type: array
                  items:
                    type: string
                  description: Additional SANs for the serving cert. The proxy Service DNS names are always included; add
                    the external name clients dial if different (strict clients validate the chain, so the connect name must
                    be covered).
        status:
          type: object
          properties:
            endpoint:
              type: string
              description: The in-cluster TDS endpoint clients connect to.
    Destruction:
      type: object
      description: 'open-infra kind: Destruction.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - Destruction
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            encryptionKey:
              type: string
              description: 'The kind: EncryptionKey to destroy (its Vault Transit key).'
            confirm:
              type: string
              description: 'Must exactly equal `encryptionKey`. A typo-guard: destruction is irreversible, so the request
                must name the key twice or the destroyer refuses it.'
            reason:
              type: string
              description: Why the data is being destroyed, recorded on the certificate (AU / MP-6).
          required:
          - encryptionKey
          - confirm
        status:
          type: object
          properties:
            phase:
              type: string
              description: Pending | Refused | Destroyed | Error.
            message:
              type: string
            certificate:
              type: string
              description: Object path of the immutable destruction certificate in the WORM audit store.
            destroyedAt:
              type: string
    Directory:
      type: object
      description: 'open-infra kind: Directory.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - Directory
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - domain
          properties:
            storageClass:
              type: string
              description: StorageClass for this resource's persistent volumes. Defaults to 'longhorn'. Set to your cluster's
                StorageClass on substrates that do not ship Longhorn (e.g. RKE2 with local-path).
            domain:
              type: string
              description: AD domain FQDN, lowercase, e.g. corp.openinfra.lan. The Kerberos realm (uppercase) and the NetBIOS
                short name are derived from it.
              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
            size:
              type: string
              default: 5Gi
              description: Storage for the directory database (Longhorn-backed).
            expose:
              type: boolean
              default: true
              description: "Get a LAN IP (DNS/Kerberos/LDAP/SMB) so machines can join. On by default \u2014 a directory you\
                \ can't reach isn't useful."
        status:
          type: object
          properties:
            domain:
              type: string
            ready:
              type: boolean
    EncryptionKey:
      type: object
      description: 'open-infra kind: EncryptionKey.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - EncryptionKey
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            description:
              type: string
              description: What this key protects, shown in the console.
            rotationDays:
              type: integer
              description: If set, the reconciler rotates the Transit key (adds a new version) once this many days have passed
                since the last rotation. Old versions still decrypt existing data; new writes use the latest version.
            keyType:
              type: string
              enum:
              - aes256-gcm96
              - chacha20-poly1305
              - rsa-4096
              default: aes256-gcm96
              description: Vault Transit key type. AES-256-GCM by default.
          required: []
        status:
          type: object
          properties:
            ready:
              type: boolean
            vaultKeyPath:
              type: string
              description: The Vault Transit path for this key (transit/keys/<name>).
    FaultInjection:
      type: object
      description: 'open-infra kind: FaultInjection.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - FaultInjection
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - type
          - target
          properties:
            type:
              type: string
              enum:
              - pod-kill
              - pod-failure
              - network-latency
              - network-loss
              - network-partition
              - stress-cpu
              - stress-memory
              - clock-skew
            target:
              type: object
              required:
              - labelSelector
              properties:
                namespace:
                  type: string
                  description: Defaults to the FaultInjection's namespace.
                labelSelector:
                  type: object
                  additionalProperties:
                    type: string
                  description: 'Pod labels to target, e.g. {app: pg}.'
            mode:
              type: string
              enum:
              - one
              - all
              - fixed-percent
              default: one
            value:
              type: string
              description: For mode=fixed-percent, e.g. "50".
            duration:
              type: string
              default: 60s
            latency:
              type: string
              default: 200ms
              description: network-latency delay.
            loss:
              type: string
              default: '50'
              description: network-loss packet-loss percent.
            direction:
              type: string
              enum:
              - to
              - from
              - both
              default: to
              description: network chaos direction.
            partitionPeer:
              type: object
              additionalProperties:
                type: string
              description: "Network faults (partition/latency/loss): the OTHER side of the link \u2014 pod labels the target's\
                \ fault is scoped to (e.g. {app: pg, site: a}). Both sides stay reachable by outside clients; only traffic\
                \ BETWEEN the two sets is affected. Required for latency/loss with direction from|both (Chaos Mesh rejects\
                \ those without a peer). For a partition, omit to isolate the target from everything."
            cpuWorkers:
              type: integer
              default: 1
              description: stress-cpu worker threads.
            cpuLoad:
              type: integer
              default: 80
              description: stress-cpu load percent per worker.
            memory:
              type: string
              default: 256MB
              description: stress-memory size to consume.
            timeOffset:
              type: string
              default: +5m
              description: clock-skew offset, e.g. +5m or -1h.
        status:
          type: object
          properties:
            phase:
              type: string
    FileShare:
      type: object
      description: 'open-infra kind: FileShare.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - FileShare
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - size
          properties:
            storageClass:
              type: string
              description: StorageClass for this resource's persistent volumes. Defaults to 'longhorn'. Set to your cluster's
                StorageClass on substrates that do not ship Longhorn (e.g. RKE2 with local-path).
            size:
              type: string
              description: Share capacity, e.g. 100Gi (Longhorn-backed).
            expose:
              type: boolean
              default: true
              description: "Get a LAN IP (SMB 445) so VMs/desktops can mount it. On by default \u2014 a share you can't reach\
                \ isn't useful."
            nodeIP:
              type: string
              description: "Optional: also answer SMB 445 on this cluster node's LAN IP (Service externalIPs). Masquerade-networked\
                \ VMs can't reach the MetalLB LAN IP, but they can reach a node IP \u2014 so this lets such a VM mount the\
                \ share at \\\\<nodeIP>\\<name>. Use a stable, always-on node."
        status:
          type: object
          properties:
            share:
              type: string
              description: Name of the exported SMB share (equals the FileShare name); clients mount it as //<host>/<share>.
            ready:
              type: boolean
              description: True once the share is provisioned and ready to mount (Samba server, Service, and connection secret
                are up).
    Function:
      type: object
      description: 'open-infra kind: Function.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - Function
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - image
          properties:
            image:
              type: string
              description: Container image that serves HTTP (CI replaces the tag)
            port:
              type: integer
              default: 8080
              description: Container port the function listens on
            gpu:
              type: integer
              default: 0
              description: GPUs per instance (serverless inference); 0 = CPU
            memory:
              type: string
              description: "Guaranteed memory per instance as a Kubernetes quantity (e.g. \"512Mi\", \"1Gi\") \u2014 the AWS\
                \ Lambda memory-size knob. Set as both request and limit. Unset = cluster default."
            timeout:
              type: integer
              description: "Max wall-clock seconds per request (Knative revision timeout) \u2014 the AWS Lambda timeout knob.\
                \ Unset = Knative default (300s)."
            expose:
              type: boolean
              default: true
              description: "Publish the function on the Knative gateway so it is reachable from the LAN (default true). Set\
                \ false to make it cluster-local \u2014 labels the Knative Service networking.knative.dev/visibility: cluster-local,\
                \ so only in-cluster callers can reach it."
            scaling:
              type: object
              description: 'Knative request-driven autoscaling (KPA): scales the function between min and max instances based
                on how many concurrent requests each instance handles.'
              properties:
                min:
                  type: integer
                  default: 0
                  description: Min instances (0 = scale to zero)
                max:
                  type: integer
                  default: 10
                  description: Maximum instances the autoscaler may scale up to (default 10).
                target:
                  type: integer
                  default: 100
                  description: Target concurrent requests per pod
            queues:
              type: array
              items:
                type: string
              description: Queues this function works with (injects NATS_URL + OPENINFRA_QUEUES)
            env:
              type: array
              description: Environment variables to set on the function's container.
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Variable name.
                  value:
                    type: string
                    description: Variable value.
            secrets:
              type: array
              items:
                type: string
              description: "Secrets to inject (envFrom) \u2014 e.g. an app's DB/bucket creds, or a Sealed Secret"
            securityGroups:
              type: array
              items:
                type: string
              description: Names of SecurityGroups (firewall rule sets) to attach to this function's pods.
            trigger:
              type: object
              description: 'Event-source mapping: subscribe this function to a Stream''s CDC events (kind: Stream). A pump
                delivers each change as an HTTP POST; the function cold-starts on demand and scales back to zero when idle.'
              properties:
                stream:
                  type: string
                  description: "Stream (kind: Stream) name to consume \u2014 events from cdc.<stream>.*"
                subject:
                  type: string
                  description: Optional subject filter (default cdc.<stream>.>), e.g. cdc.<stream>.public.orders
        status:
          type: object
          properties:
            url:
              type: string
    Grant:
      type: object
      description: 'open-infra kind: Grant.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - iam.openinfra.dev/v1
        kind:
          type: string
          enum:
          - Grant
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            subject:
              type: object
              description: Who the access is granted to.
              properties:
                kind:
                  type: string
                  enum:
                  - User
                  - Group
                  description: 'Whether `name` is a kind: User (a person) or a kind: Group.'
                name:
                  type: string
                  description: The User or Group name; bound as the Kubernetes subject openinfra:<name>.
              required:
              - kind
              - name
            clusterRole:
              type: string
              description: "The ClusterRole to grant, e.g. `openinfra-role-<yourRole>` (a kind: Role) or a built-in console\
                \ role (`open-infra-readonly` / `open-infra-poweruser`). Bounded by the same bind fence as kind: Group \u2014\
                \ only roles within the openinfra.dev boundary or the fenced console roles can be granted."
            duration:
              type: string
              description: "How long the grant lasts from creation, as a Go duration (e.g. \"30m\", \"4h\", \"8h\"). The reconciler\
                \ deletes the Grant \u2014 and thus the binding \u2014 once creation + duration has passed. Cap enforced by\
                \ the reconciler (GRANT_MAX_DURATION, default 24h)."
            reason:
              type: string
              description: Justification for the elevation, recorded for audit (AC-2(2)/AU).
            requestedBy:
              type: string
              description: Who requested this grant. Stamped by the console from the authenticated requester and recorded
                for audit (AC-2(2)/AU); the approver must differ from this identity (AC-5).
            approval:
              type: object
              description: "Second-party authorization (AC-2(2)/AC-5/AC-6(2)). A grant renders NO binding \u2014 confers no\
                \ access \u2014 until approvedBy is set to an identity DIFFERENT from requestedBy. Set through the console's\
                \ SAR-gated approve action, never self-service."
              properties:
                approvedBy:
                  type: string
                  description: The approver's identity. Must differ from requestedBy or the grant stays inert.
                approvedAt:
                  type: string
                  description: RFC3339 time of approval; the expiry clock starts here, not at creation.
                note:
                  type: string
                  description: Optional approver note, recorded for audit.
          required:
          - subject
          - clusterRole
          - duration
        status:
          type: object
          properties:
            ready:
              type: boolean
            phase:
              type: string
              description: "AwaitingApproval (approved by nobody yet \u2014 no binding), Active (approved + bound), or NotGrantable\
                \ (role outside the ceiling, or approver == requester)."
            boundTo:
              type: string
              description: The Kubernetes subject the grant bound (openinfra:<name>).
            message:
              type: string
              description: "Set when the grant confers nothing \u2014 awaiting approval, an approver equal to the requester\
                \ (AC-5), or a clusterRole outside the grantable ceiling."
    GraphQLApi:
      type: object
      description: 'open-infra kind: GraphQLApi.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - GraphQLApi
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - resolvers
          properties:
            schema:
              type: string
              description: "GraphQL SDL for the API. When set, the engine parses it into an in-memory type graph and answers\
                \ __schema/__type introspection over it \u2014 so GraphQL tooling (graphql-codegen, Apollo, GraphiQL) can\
                \ build a client schema from this API. Optional: the executor still resolves fields from the resolver list\
                \ without it, but introspection is then unavailable."
            image:
              type: string
              default: ghcr.io/harn3ss/open-infra-open-appsync:latest
              description: The open-appsync engine image serving this API.
            replicas:
              type: integer
              default: 1
            mongoURI:
              type: string
              description: FerretDB (Mongo wire) endpoint backing `dynamodb` data sources. Required only if a data source
                is type dynamodb; a dynamodb source with no mongoURI fails closed at load.
            apiKeysSecret:
              type: string
              description: "Name of a Secret (in this API's namespace) holding apikeys.json \u2014 a JSON array of {key, username,\
                \ groups}. Enables @aws_api_key auth. THE KEY IS AN IDENTITY: presenting a key authenticates the request AS\
                \ the mapped k8s identity (username/groups), whose SAR then authorizes @aws_api_key fields (one policy world).\
                \ Keep key material in this Secret, never in the spec. @aws_iam/@aws_oidc/@aws_cognito_user_pools are likewise\
                \ enforced when their directives appear (each through the same SAR boundary); @aws_lambda is advisory (parsed\
                \ + reported, not enforced)."
            mongoDB:
              type: string
              default: open_appsync
              description: FerretDB database name for dynamodb data sources.
            limits:
              type: object
              description: Hostile-load guards. ON by default even if omitted; a maxDepth/maxCost of 0 keeps the safe default,
                a negative value opts out of that guard.
              properties:
                maxDepth:
                  type: integer
                  description: Reject queries whose selection nesting exceeds this (default 10; negative disables).
                maxCost:
                  type: integer
                  description: Reject queries with more than this many fields (default 1000; negative disables).
                persistedOnly:
                  type: boolean
                  description: "When true, only pre-registered query documents in persistedQueries run \u2014 the strongest\
                    \ posture for a fixed-client deployment."
                persistedQueries:
                  type: array
                  description: Allow-listed query documents (for persistedOnly mode).
                  items:
                    type: string
                introspection:
                  type: string
                  enum:
                  - enabled
                  - disabled
                  - authenticated-only
                  description: "Who may read the schema via __schema/__type. enabled (default) \u2014 any client, best for\
                    \ tooling; disabled \u2014 never; authenticated-only \u2014 off for untrusted (anonymous) callers. Requires\
                    \ spec.schema."
            dataSources:
              type: array
              description: The data sources resolvers bind to.
              items:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    description: Data source name a resolver references.
                  type:
                    type: string
                    default: memory
                    enum:
                    - memory
                    - none
                    - dynamodb
                    - http
                    - lambda
                    - rds
                    - opensearch
                    - eventbridge
                    description: 'memory = ephemeral (dev/demo); none = no backend, resolved in the mapping templates (pub/sub-only
                      fields, local computation); dynamodb = FerretDB-backed (needs a collection + spec.mongoURI); http =
                      an HTTP endpoint (needs an endpoint); lambda = invoke a kind: Function over HTTP (needs the function
                      URL as endpoint); rds = SQL over PostgreSQL/Aurora-PostgreSQL (needs a connectionSecret with the DSN);
                      opensearch = search against an OpenSearch domain (needs an endpoint; optional basic auth via connectionSecret
                      keys username/password); eventbridge = publish events to the NATS event bus (PutEvents; uses the platform
                      NATS, or set endpoint to a NATS URL).'
                  collection:
                    type: string
                    description: 'dynamodb: the FerretDB collection (the ''table'').'
                  endpoint:
                    type: string
                    description: 'http: the base URL the resolver''s operation ({method, resourcePath, params}) targets. lambda:
                      the function (kind: Function) URL invoked with the resolver''s payload.'
                  connectionSecret:
                    type: string
                    description: 'Name of a Secret (this API''s namespace) holding this source''s credentials, kept out of
                      the spec. rds: a `dsn` key with the PostgreSQL connection string (e.g. postgres://user:pass@host:5432/db?sslmode=require).
                      opensearch: optional `username`/`password` keys for HTTP basic auth. The engine reads these from injected
                      env vars.'
            resolvers:
              type: array
              description: Field bindings. A resolver is EITHER a unit resolver (dataSource + request + response) OR a pipeline
                resolver (functions[], with optional before/after). Malformed resolvers fail closed at load.
              minItems: 1
              items:
                type: object
                required:
                - type
                - field
                properties:
                  type:
                    type: string
                    description: "The type this field lives on: Query or Mutation for a root resolver, or any object type\
                      \ (e.g. Post) for a per-nested-field resolver that runs when that field is selected below the root \u2014\
                      \ it receives the parent object as $ctx.source."
                  field:
                    type: string
                    description: The GraphQL field name, e.g. getTodo.
                  runtime:
                    type: string
                    default: appsync-vtl
                    description: "The resolver runtime (the extension point): appsync-vtl (VTL mapping templates \u2014 a\
                      \ resolver author's VTL is byte-for-byte identical, zero retraining) or appsync-js (a sandboxed JavaScript\
                      \ module exporting request(ctx)/response(ctx), carried in the request field)."
                  dataSource:
                    type: string
                    description: 'Unit resolver: name of a spec.dataSources entry.'
                  request:
                    type: string
                    description: 'Unit resolver: the request mapping template source (VTL for appsync-vtl).'
                  response:
                    type: string
                    description: 'Unit resolver: the response mapping template source.'
                  before:
                    type: string
                    description: 'Pipeline resolver: the before mapping template (sets $ctx.stash / may abort; touches no
                      data source).'
                  auth:
                    type: object
                    description: "Field-level authorization: the k8s RBAC permission the caller must have (checked via a SubjectAccessReview\
                      \ \u2014 the same boundary as every other front door). Omit for a public field."
                    properties:
                      group:
                        type: string
                        description: API group, e.g. openinfra.dev.
                      resource:
                        type: string
                        description: Resource plural, e.g. graphqlapis.
                      verb:
                        type: string
                        description: e.g. get, create.
                      namespace:
                        type: string
                        description: Namespace, or empty for cluster-scoped.
                      name:
                        type: string
                        description: Optional specific object name.
                  after:
                    type: string
                    description: 'Pipeline resolver: the after mapping template (shapes the final value from $ctx.prev.result).'
                  functions:
                    type: array
                    description: 'Pipeline resolver: ordered functions; each function''s response becomes $ctx.prev.result
                      for the next.'
                    items:
                      type: object
                      required:
                      - dataSource
                      - request
                      - response
                      properties:
                        dataSource:
                          type: string
                          description: Name of a spec.dataSources entry this function targets.
                        runtime:
                          type: string
                          default: appsync-vtl
                        request:
                          type: string
                          description: The function's request mapping template source.
                        response:
                          type: string
                          description: The function's response mapping template source.
                  caching:
                    type: object
                    description: "Per-resolver response caching (AppSync's caching behavior). Ignored on Mutation resolvers\
                      \ \u2014 they are never cached. The caller identity is ALWAYS folded into the cache key, so per-user\
                      \ data is never served across callers even if `keys` omits it (safer than AppSync, where omitting the\
                      \ identity key silently shares one entry). Backed by an in-memory cache (per replica) today; a shared\
                      \ multi-replica backend is a later rung."
                    properties:
                      ttlSeconds:
                        type: integer
                        description: How long a cached response lives, in seconds. 0 or unset disables caching for this resolver.
                      keys:
                        type: array
                        description: "$context paths that, with the caller identity, form the cache key \u2014 e.g. arguments.id,\
                          \ identity.sub, source.tenantId. Omit to fold ALL of the field's arguments into the key (per-caller,\
                          \ per-argument-set), so distinct arguments never collide."
                        items:
                          type: string
            subscriptions:
              type: array
              description: "Subscription-type fields (experimental). Each has a response mapping (no request phase \u2014\
                \ the push source calls it) and the mutations that trigger it. Served over graphql-transport-ws at /graphql-ws."
              items:
                type: object
                required:
                - field
                - response
                properties:
                  field:
                    type: string
                    description: The Subscription field name, e.g. onCreateTodo.
                  subject:
                    type: string
                    description: Bus subject the events ride; defaults to sub.<field>.
                  runtime:
                    type: string
                    default: appsync-vtl
                  response:
                    type: string
                    description: The response mapping template that shapes each pushed event.
                  triggeredBy:
                    type: array
                    description: Mutation field names whose success publishes to this subscription.
                    items:
                      type: string
                  auth:
                    type: object
                    description: Authorization checked at subscribe time (a SubjectAccessReview), like a resolver's auth.
                    properties:
                      group:
                        type: string
                      resource:
                        type: string
                      verb:
                        type: string
                      namespace:
                        type: string
                      name:
                        type: string
        status:
          type: object
          properties:
            url:
              type: string
              description: In-cluster GraphQL endpoint of the engine serving this API.
    Group:
      type: object
      description: 'open-infra kind: Group.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - iam.openinfra.dev/v1
        kind:
          type: string
          enum:
          - Group
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            description:
              type: string
              description: What this group is for, shown in the console.
            clusterRole:
              type: string
              description: "Name of the ClusterRole members receive. Use a built-in (open-infra-console for full access, open-infra-poweruser,\
                \ open-infra-readonly) or your own. This is the ONLY field that grants anything \u2014 choose it deliberately."
              default: open-infra-readonly
          required:
          - clusterRole
        status:
          type: object
          properties:
            ready:
              type: boolean
            boundTo:
              type: string
              description: The Kubernetes group name members are bound as.
    HttpApi:
      type: object
      description: 'open-infra kind: HttpApi.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - HttpApi
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - domain
          - routes
          properties:
            domain:
              type: string
              description: Hostname the API is served on, e.g. api.example.com.
            tls:
              type: boolean
              default: true
              description: Terminate TLS via cert-manager (openinfra-issuer). Set false for plain HTTP.
            routes:
              type: array
              description: "Path \u2192 backend routes, evaluated in order (put more specific paths first)."
              minItems: 1
              items:
                type: object
                required:
                - path
                - backend
                properties:
                  path:
                    type: string
                    description: URL path to match, e.g. / or /users.
                  pathType:
                    type: string
                    default: Prefix
                    enum:
                    - Prefix
                    - Exact
                    - ImplementationSpecific
                    description: Ingress path match type.
                  backend:
                    type: object
                    required:
                    - name
                    properties:
                      kind:
                        type: string
                        default: Function
                        enum:
                        - Function
                        - Application
                        description: The kind of backend this route targets (both expose an in-cluster Service named after
                          the resource on port 80).
                      name:
                        type: string
                        description: 'Name of the backing kind: Function or kind: Application (same namespace as this HttpApi).'
                      port:
                        type: integer
                        default: 80
                        description: Backend Service port. Functions and Applications both listen on 80.
        status:
          type: object
          properties:
            url:
              type: string
              description: The public URL of the API (scheme + domain).
    Migration:
      type: object
      description: 'open-infra kind: Migration.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - Migration
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - source
          - target
          properties:
            storageClass:
              type: string
              description: StorageClass for this resource's persistent volumes. Defaults to 'longhorn'. Set to your cluster's
                StorageClass on substrates that do not ship Longhorn (e.g. RKE2 with local-path).
            mode:
              type: string
              enum:
              - full-load
              - cdc
              - full-load-and-cdc
              default: full-load-and-cdc
              description: 'Replication type, like AWS DMS. full-load = one-shot copy of existing data. cdc = ongoing change-data-capture
                sync only. full-load-and-cdc = initial copy then keep in sync (continuous, the default). CDC modes require
                a CDC-ready source (Postgres: wal_level=logical; MySQL/MariaDB: binlog_format=ROW; SQL Server: CDC enabled
                + SQL Server Agent).'
            source:
              type: object
              required:
              - engine
              - host
              - database
              - username
              - passwordSecretRef
              properties:
                engine:
                  type: string
                  enum:
                  - postgres
                  - mysql
                  - mariadb
                  - sqlserver
                  description: "Source database engine. A source may be proprietary (e.g. sqlserver) \u2014 it's your database,\
                    \ we only read from it."
                host:
                  type: string
                  description: Source host (a Service DNS name for internal sources, or any reachable host).
                port:
                  type: integer
                  default: 5432
                  description: Source port (Postgres 5432, MySQL/MariaDB 3306, SQL Server 1433).
                database:
                  type: string
                  description: Source database name.
                username:
                  type: string
                  description: Source username (needs read + replication for CDC).
                passwordSecretRef:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: Secret (same namespace) holding the source password.
                    key:
                      type: string
                      default: password
                      description: Key in the Secret.
                schemas:
                  type: array
                  items:
                    type: string
                  default:
                  - public
                  description: 'Schemas to replicate (Postgres: public; SQL Server: dbo). Ignored for MySQL/MariaDB.'
                ssl:
                  type: boolean
                  default: false
                  description: Require TLS to the source.
            target:
              type: object
              required:
              - engine
              - host
              - database
              - username
              - passwordSecretRef
              properties:
                engine:
                  type: string
                  enum:
                  - postgres
                  - mysql
                  - sqlserver
                  default: postgres
                  description: Target engine. The apply-sink writes via the engine's native upsert (Postgres ON CONFLICT /
                    MySQL ON DUPLICATE KEY / SQL Server MERGE) and auto-creates tables with cross-engine type mapping, so
                    the target may differ from the source.
                host:
                  type: string
                  description: Target host (e.g. <cluster>-rw.<ns>.svc for a managed Postgres).
                port:
                  type: integer
                  default: 5432
                database:
                  type: string
                username:
                  type: string
                passwordSecretRef:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: password
                schema:
                  type: string
                  description: 'Optional target schema/namespace override (default: source schema for Postgres, dbo for SQL
                    Server, the database for MySQL).'
                ssl:
                  type: boolean
                  default: false
            tables:
              type: array
              items:
                type: string
              description: Optional table selection (bare table names). Empty = all tables.
        status:
          type: object
          properties:
            phase:
              type: string
            ready:
              type: boolean
            stream:
              type: string
              description: The JetStream stream carrying this Migration's change events.
    Model:
      type: object
      description: 'open-infra kind: Model.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - Model
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            model:
              type: string
              description: 'The model to serve, chosen from a curated catalog (allowlist). Each entry maps to a resource tier
                that sets CPU/RAM and GPU placement: qwen2.5:0.5b and llama3.2:1b run CPU-only; llama3.2:3b and llama3.1:8b
                request a small GPU (A2000 class); mixtral:8x7b requires a large GPU (3090 class). Omit when using `serve`.'
              enum:
              - qwen2.5:0.5b
              - llama3.2:1b
              - llama3.2:3b
              - llama3.1:8b
              - mixtral:8x7b
            serve:
              type: object
              description: "Serve a custom trained model artifact instead of a catalog model \u2014 the train->serve path\
                \ (typically a kind: ModelPackage you promote here). The image must load the artifact and serve HTTP on `port`;\
                \ the artifact location and S3-compatible credentials are injected (ARTIFACT_BUCKET / ARTIFACT_KEY + AWS_ENDPOINT_URL\
                \ / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY). Set this OR `model`."
              properties:
                image:
                  type: string
                  description: Serving container image that loads the artifact and serves HTTP.
                port:
                  type: integer
                  default: 8080
                  description: Port the serving container listens on (the key-gated proxy forwards to it).
                artifact:
                  type: object
                  description: The trained model artifact in the object store.
                  properties:
                    bucket:
                      type: string
                    key:
                      type: string
                      description: Object key (or prefix) of the artifact.
                gpu:
                  type: integer
                  default: 0
                  description: GPUs for serving (0 = CPU-only).
                gpuTier:
                  type: string
                  enum:
                  - smallgpu
                  - largegpu
                  default: smallgpu
                  description: GPU class when gpu>0.
                cpu:
                  type: string
                  description: CPU request/limit (e.g. "2").
                memory:
                  type: string
                  description: Memory request/limit (e.g. "8Gi").
                modelPackage:
                  type: string
                  description: 'Provenance: the ModelPackage this endpoint serves (informational).'
                env:
                  type: array
                  description: Extra environment variables for the serving container.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
            highAvailability:
              type: boolean
              default: false
              description: Run two replicas spread across separate nodes (pod anti-affinity), load-balanced so the endpoint
                survives a single node loss. If too few qualifying nodes are available the second replica stays Pending, degrading
                gracefully to one. Default false = a single replica.
            domain:
              type: string
              description: "Hostname to expose the key-gated inference endpoint on externally \u2014 open-infra provisions\
                \ an Ingress and a cert-manager TLS certificate for it (e.g. llama.example.com)."
            storageSize:
              type: string
              default: 20Gi
              description: Size limit for the ephemeral weight cache (an emptyDir). Weights are re-pulled each time a fresh
                pod starts, so this is scratch space, not persistent storage. Default 20Gi.
            expose:
              type: boolean
              default: false
              description: Also expose the inference endpoint on a LAN IP (a MetalLB LoadBalancer Service), so workstations
                can call the OpenAI-compatible API without DNS or Ingress. Default false = in-cluster only.
        status:
          type: object
          properties:
            endpoint:
              type: string
            model:
              type: string
    ModelPackage:
      type: object
      description: 'open-infra kind: ModelPackage.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - ModelPackage
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - modelName
          - image
          - artifact
          properties:
            modelName:
              type: string
              description: The model group/family this is a version of (e.g. fraud-detector). Group versions by this name.
            version:
              type: string
              default: '1'
              description: Version label within the model group (e.g. "1", "2", or a git sha).
            artifact:
              type: object
              required:
              - bucket
              description: The trained model artifact in the object store.
              properties:
                bucket:
                  type: string
                key:
                  type: string
                  description: Object key (or prefix) of the artifact.
            image:
              type: string
              description: "The serving container image that loads this artifact and serves HTTP \u2014 what a kind: Model\
                \ spec.serve uses to promote it."
            port:
              type: integer
              default: 8080
              description: Port the serving container listens on.
            framework:
              type: string
              description: Optional framework label (e.g. pytorch, tensorflow, sklearn).
            metrics:
              type: string
              description: Optional evaluation metrics as a JSON string (e.g. {"accuracy":0.92}).
            description:
              type: string
              description: Optional human description of this model version.
            approvalStatus:
              type: string
              enum:
              - PendingManualApproval
              - Approved
              - Rejected
              default: PendingManualApproval
              description: 'Approval gate (like SageMaker): only an Approved package should be promoted to a served endpoint.
                Flip it from the console (approve/reject) or by editing the resource.'
        status:
          type: object
          properties:
            approvalStatus:
              type: string
    Policy:
      type: object
      description: 'open-infra kind: Policy.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - iam.openinfra.dev/v1
        kind:
          type: string
          enum:
          - Policy
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            description:
              type: string
              description: What this policy is for, shown in the console.
            statements:
              type: array
              description: Allow statements. Everything not allowed is implicitly denied.
              items:
                type: object
                properties:
                  effect:
                    type: string
                    enum:
                    - Allow
                    default: Allow
                    description: "Only Allow \u2014 RBAC cannot express Deny (see docs/iam.md)."
                  actions:
                    type: array
                    description: <resource>:<verb> pairs over openinfra.dev, e.g. "virtualmachines:*", "volumes:Get". resource
                      may be "*" (all openinfra.dev kinds); verb may be "*" (all verbs).
                    items:
                      type: string
                  resources:
                    type: array
                    description: "Reserved for future object-name scoping. Kubernetes RBAC cannot restrict list/watch by name,\
                      \ so today this is effectively [\"*\"] \u2014 set it for forward-compatibility and documentation."
                    items:
                      type: string
                    default:
                    - '*'
                required:
                - actions
          required:
          - statements
        status:
          type: object
          properties:
            ready:
              type: boolean
            clusterRole:
              type: string
              description: The ClusterRole this policy compiled to.
            ruleCount:
              type: integer
              description: How many RBAC rules it produced.
    Query:
      type: object
      description: 'open-infra kind: Query.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - Query
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - sql
          properties:
            sql:
              type: string
              description: The SQL to execute. With engine=duckdb, read lake data by path, e.g. SELECT * FROM read_parquet('s3://my-bucket/events/*.parquet').
                With engine=trino, query catalog tables, e.g. SELECT * FROM iceberg.demo.sales.
            engine:
              type: string
              enum:
              - duckdb
              - trino
              default: duckdb
              description: Query engine. duckdb = serverless, single-node, schema-on-read over lake files ($0 idle). trino
                = the warehouse engine for catalog database.table querying + cross-source federation (idle-stops when unused).
            outputBucket:
              type: string
              default: query-results
              description: "MinIO bucket the results (CSV) + a <id>.metadata.json are written to \u2014 Athena's \"output\
                \ location\". Created if it doesn't exist."
        status:
          type: object
          properties:
            queryId:
              type: string
            resultLocation:
              type: string
            phase:
              type: string
    Replication:
      type: object
      description: 'open-infra kind: Replication.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - Replication
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - siteA
          - siteB
          - tables
          properties:
            siteA: &id091
              type: object
              description: "One endpoint of the replication pair. Both sites are simultaneously source and target \u2014 changes\
                \ captured here are applied to the peer and vice-versa. The two sites may run different engines (e.g. sqlserver\
                \ <-> postgres)."
              required:
              - name
              - engine
              - host
              - database
              - username
              - passwordSecretRef
              properties:
                name:
                  type: string
                  description: Short site id used as the origin marker (e.g. 'a', 'east'). Must be unique across the pair.
                engine:
                  type: string
                  enum:
                  - postgres
                  - mysql
                  - mariadb
                  - sqlserver
                  description: Database engine at this site. Selects the Debezium source connector that captures changes and
                    the apply-sink driver that writes the peer's changes here.
                host:
                  type: string
                  description: Hostname or service address of this site's database.
                port:
                  type: integer
                  default: 5432
                  description: Database port. Default 5432 (Postgres); set the engine's port, e.g. 3306 for MySQL/MariaDB
                    or 1433 for SQL Server.
                database:
                  type: string
                  description: Name of the database that holds the replicated tables.
                username:
                  type: string
                  description: "Database user the engine connects as \u2014 used both to capture changes (Debezium) and to\
                    \ apply the peer's changes. Must be able to read the tables' change stream and write the replicated tables."
                passwordSecretRef:
                  type: object
                  description: Reference to a Kubernetes Secret (in the claim's namespace) holding this site's database password.
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: Name of the Secret.
                    key:
                      type: string
                      default: password
                      description: Key within the Secret that holds the password. Default 'password'.
                schema:
                  type: string
                  default: public
                  description: 'Schema/namespace of the tables (Postgres: public; SQL Server: dbo).'
                ssl:
                  type: boolean
                  default: false
                  description: Connect to this site's database over TLS (default false). Applied for Postgres (sslmode=require)
                    and SQL Server (encrypt=true).
            siteB: *id091
            tables:
              type: array
              items:
                type: string
              description: Bare table names replicated both ways. Must exist on both sites with the same PK.
            versionColumn:
              type: string
              default: _mm_version
              description: HLC version column added by mm-prep and used for last-write-wins.
            originColumn:
              type: string
              default: _mm_origin
              description: Origin-marker column added by mm-prep and used for loop prevention + LWW tiebreak.
            scheduling:
              type: object
              description: 'Optional pod placement for the replication engine pods (apply-sink + Debezium). Its purpose is
                the chaos suite: pin the disposable sandbox mesh onto dedicated, tainted chaos nodes so a fault never lands
                on production hardware. Empty (the default) = schedule anywhere, unchanged behavior.'
              properties:
                nodeSelector:
                  type: object
                  description: Node labels a replication pod must match to be scheduled (maps to the pods' nodeSelector).
                  additionalProperties:
                    type: string
                tolerations:
                  type: array
                  description: Tolerations added to the replication pods so they can schedule onto tainted nodes (e.g. dedicated
                    chaos nodes). Standard Kubernetes toleration objects.
                  items:
                    type: object
                    description: A single Kubernetes toleration (key / operator / value / effect / tolerationSeconds).
                    x-kubernetes-preserve-unknown-fields: true
        status:
          type: object
          properties:
            phase:
              type: string
            ready:
              type: boolean
    Role:
      type: object
      description: 'open-infra kind: Role.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - iam.openinfra.dev/v1
        kind:
          type: string
          enum:
          - Role
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            description:
              type: string
              description: What this role is for, shown in the console.
            policies:
              type: array
              description: Names of Policies (in this namespace) to aggregate.
              items:
                type: string
          required:
          - policies
        status:
          type: object
          properties:
            ready:
              type: boolean
            clusterRole:
              type: string
              description: The aggregated ClusterRole a Group can bind to.
    SecurityGroup:
      type: object
      description: 'open-infra kind: SecurityGroup.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - SecurityGroup
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            ingress:
              type: array
              description: Inbound allow-rules. Omit for none (members stay default-deny inbound once attached).
              items:
                type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - TCP
                    - UDP
                    default: TCP
                  description:
                    type: string
                    description: Optional note explaining why this rule exists.
                  ports:
                    type: array
                    items:
                      type: integer
                    description: Ports to allow. Empty = all ports.
                  from:
                    type: array
                    description: Sources (OR'd). Each is one of cidr / securityGroup / namespace.
                    items:
                      type: object
                      properties:
                        cidr:
                          type: string
                          description: edge/LAN source, e.g. 192.0.2.0/24 or 0.0.0.0/0
                        securityGroup:
                          type: string
                          description: members of another SecurityGroup (same namespace)
                        namespace:
                          type: string
                          description: all pods in this namespace
            egress:
              type: array
              description: Outbound allow-rules. If set, members become egress-restricted (DNS auto-allowed).
              items:
                type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - TCP
                    - UDP
                    default: TCP
                  description:
                    type: string
                    description: Optional note explaining why this rule exists.
                  ports:
                    type: array
                    items:
                      type: integer
                  to:
                    type: array
                    description: Destinations (OR'd). Each is one of cidr / securityGroup / namespace.
                    items:
                      type: object
                      properties:
                        cidr:
                          type: string
                        securityGroup:
                          type: string
                        namespace:
                          type: string
        status:
          type: object
          properties:
            memberLabel:
              type: string
              description: Pods carrying this label are members.
    StateMachine:
      type: object
      description: 'open-infra kind: StateMachine.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - StateMachine
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - definition
          properties:
            definition:
              type: string
              description: "The workflow as an Amazon States Language (ASL) JSON document \u2014 the same string you would\
                \ pass to aws_sfn_state_machine.definition. Must have a top-level \"StartAt\" and \"States\". Task states\
                \ invoke a kind: Function via \"Resource\": \"function:<name>\" (resolved to the Function's cluster-local\
                \ URL) or a raw \"http(s)://...\" URL."
            type:
              type: string
              enum:
              - Standard
              default: Standard
              description: Workflow class. Only Standard (durable, checkpointed, full execution history) is implemented in
                v1; Express is a planned follow-up.
        status:
          type: object
          properties:
            controller:
              type: string
    Stream:
      type: object
      description: 'open-infra kind: Stream.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - Stream
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - source
          properties:
            storageClass:
              type: string
              description: StorageClass for this resource's persistent volumes. Defaults to 'longhorn'. Set to your cluster's
                StorageClass on substrates that do not ship Longhorn (e.g. RKE2 with local-path).
            source:
              type: object
              required:
              - engine
              - host
              - database
              - username
              - passwordSecretRef
              properties:
                engine:
                  type: string
                  enum:
                  - postgres
                  - mysql
                  - mariadb
                  - sqlserver
                  - mongodb
                  description: "Source database engine for CDC capture. A source may be proprietary (e.g. sqlserver) \u2014\
                    \ we only read its change log."
                host:
                  type: string
                  description: Source host (a Service DNS name, or any reachable host).
                port:
                  type: integer
                  default: 5432
                  description: Source port (Postgres 5432, MySQL/MariaDB 3306, SQL Server 1433, MongoDB 27017).
                database:
                  type: string
                  description: Source database (for MongoDB, the database whose collections are captured).
                username:
                  type: string
                  description: Source user with replication/CDC rights.
                passwordSecretRef:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: Secret (same namespace) holding the source password.
                    key:
                      type: string
                      default: password
                      description: Key in the Secret.
                schemas:
                  type: array
                  items:
                    type: string
                  default:
                  - public
                  description: 'Schema(s) the tables live in (Postgres: public; SQL Server: dbo). Ignored for MySQL/MariaDB/MongoDB.'
                tables:
                  type: array
                  items:
                    type: string
                  description: Tables/collections to capture (bare names). Empty = all in the database.
                ssl:
                  type: boolean
                  default: false
                  description: Require TLS to the source.
                replicaSet:
                  type: string
                  default: rs0
                  description: MongoDB replica set name (change streams require a replica set).
        status:
          type: object
          properties:
            stream:
              type: string
              description: The JetStream stream backing this Stream.
            subjects:
              type: string
              description: The subject wildcard change events publish to.
            phase:
              type: string
            ready:
              type: boolean
    TrainingJob:
      type: object
      description: 'open-infra kind: TrainingJob.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - TrainingJob
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - image
          properties:
            image:
              type: string
              description: The training container image. It runs to completion; write model artifacts to the output bucket
                (see output).
            command:
              type: array
              items:
                type: string
              description: Optional entrypoint override (container command).
            args:
              type: array
              items:
                type: string
              description: Optional container args.
            env:
              type: array
              description: "Environment variables \u2014 the place to pass hyperparameters and config to the training script."
              items:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: string
            gpu:
              type: integer
              default: 1
              description: GPUs to request. `0` runs CPU-only (useful for smoke tests); >0 schedules on a GPU node and sets
                nvidia.com/gpu.
            gpuTier:
              type: string
              enum:
              - smallgpu
              - largegpu
              default: smallgpu
              description: 'GPU class when gpu>0: smallgpu (A2000 class, may use a large GPU) or largegpu (requires a large
                GPU, e.g. 3090). Ignored when gpu=0.'
            cpu:
              type: string
              description: CPU request/limit as a Kubernetes quantity (e.g. "2", "500m"). Unset uses a modest default.
            memory:
              type: string
              description: Memory request/limit as a Kubernetes quantity (e.g. "8Gi"). Unset uses a modest default.
            dataset:
              type: object
              description: Input data location in the object store (MinIO). Injected as DATASET_BUCKET/DATASET_PREFIX plus
                S3-compatible credentials.
              properties:
                bucket:
                  type: string
                  description: Existing bucket holding the training data.
                prefix:
                  type: string
                  description: Optional key prefix within the bucket.
            output:
              type: object
              description: Where the job writes model artifacts (MinIO). The bucket is created if absent; injected as OUTPUT_BUCKET/OUTPUT_PREFIX
                plus S3-compatible credentials.
              properties:
                bucket:
                  type: string
                  description: Artifact bucket (created on demand).
                prefix:
                  type: string
                  description: Optional key prefix for artifacts.
            secrets:
              type: array
              items:
                type: string
              description: "Extra secrets to inject with envFrom \u2014 e.g. a model-registry or Hugging Face token."
            backoffLimit:
              type: integer
              default: 0
              description: How many times the Job retries a failed pod before it is marked Failed. Defaults to 0 (no retry).
            maxRuntimeSeconds:
              type: integer
              description: Hard wall-clock cap (Job activeDeadlineSeconds). The job is failed if it runs longer. Unset means
                no cap.
        status:
          type: object
          properties:
            jobName:
              type: string
    User:
      type: object
      description: 'open-infra kind: User.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - iam.openinfra.dev/v1
        kind:
          type: string
          enum:
          - User
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          properties:
            displayName:
              type: string
              description: Human-readable name shown in the console.
            email:
              type: string
              description: Optional contact address; not used for authentication.
            groups:
              type: array
              description: Groups this user belongs to. Each becomes an Impersonate-Group of openinfra:<group>, and RBAC bindings
                on that group are what actually grant permission. A user with no groups can sign in but can do nothing.
              items:
                type: string
              default: []
            source:
              type: string
              description: Where the password is verified. `local` uses passwordSecretRef; `ldap` and `oidc` defer to the
                configured directory (AUTH_MODE).
              enum:
              - local
              - ldap
              - oidc
              default: local
            passwordSecretRef:
              type: object
              description: Secret holding a BCRYPT HASH (never a password) for source=local. Omit for ldap/oidc users.
              properties:
                name:
                  type: string
                key:
                  type: string
                  default: hash
              required:
              - name
            disabled:
              type: boolean
              description: Suspend sign-in without deleting the account or its history.
              default: false
          required:
          - displayName
        status:
          type: object
          properties:
            ready:
              type: boolean
            groups:
              type: array
              items:
                type: string
    VirtualMachine:
      type: object
      description: 'open-infra kind: VirtualMachine.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - VirtualMachine
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - os
          properties:
            os:
              type: string
              description: "Operating system, from the curated catalog. Linux entries (ubuntu-*, fedora-40, debian-12, centos-stream-9)\
                \ boot ready-made cloud images; windows-server-* clone a golden image you build first via kind: VmImage (console:\
                \ Virtual Machines \u2192 VM Images)."
              enum:
              - ubuntu-24.04
              - ubuntu-22.04
              - fedora-40
              - debian-12
              - centos-stream-9
              - windows-server-2019
              - windows-server-2022
              - windows-server-2025
            cpu:
              type: integer
              default: 2
              minimum: 1
              description: Number of vCPU cores (KubeVirt domain.cpu.cores). Default 2.
            memory:
              type: string
              default: 2Gi
              description: Guest RAM, e.g. 2Gi or 4Gi. Default 2Gi.
            diskSize:
              type: string
              default: 20Gi
              description: 'Root disk size, retained across reboots and stop/start. Default 20Gi. Linux grows its rootfs to
                fit via cloud-init; Windows ignores this and uses a fixed 100Gi root (a generalized image''s C: can''t be
                reliably auto-grown).'
            sshKey:
              type: string
              description: SSH public key injected via cloud-init on first boot (Linux only). If omitted, the only login is
                a generated password stored in the connection secret (<name>-vm).
            expose:
              type: boolean
              default: false
              description: "Give the VM a LAN IP (MetalLB LoadBalancer) carrying its access port \u2014 SSH 22 (Linux) or\
                \ RDP 3389 (Windows). Default false: reach the VM via port-forward or the web VNC console instead. Setting\
                \ any entry in ports also implies this."
            ports:
              type: array
              items:
                type: object
                required:
                - port
                properties:
                  port:
                    type: integer
                    description: "Port number (1\u201365535)."
                  protocol:
                    type: string
                    enum:
                    - TCP
                    - UDP
                    default: TCP
                    description: Transport protocol for this port. Default TCP.
              description: "Extra TCP/UDP ports to publish on the VM's LAN IP, beyond the access port (SSH/RDP) \u2014 e.g.\
                \ [{port: 80}, {port: 53, protocol: UDP}]. They ride the same MetalLB IP as SSH/RDP (one LAN IP, the ports\
                \ you pick). Adding any port also gives the VM a LAN IP (implies expose)."
            network:
              type: string
              enum:
              - masquerade
              - bridge
              - macvtap
              default: masquerade
              description: "Network attachment. masquerade (default, supported) puts the VM behind the pod network (NAT) \u2014\
                \ reach it in-cluster via its Service, or from the LAN via expose/MetalLB. macvtap is the supported direct-LAN\
                \ mode: a second NIC attaches straight to the physical LAN via a macvtap device (the VM pulls its own DHCP\
                \ lease and is a first-class LAN host, e.g. reachable on SMB/445). bridge is the legacy LAN mode (Multus+macvlan\
                \ with KubeVirt bridge binding) and does NOT work on this stack \u2014 a macvlan sub-interface cannot be a\
                \ KubeVirt bridge port; use macvtap instead. macvtap/bridge require networking.vmLan enabled at install and\
                \ nodes labelled openinfra.dev/vm-lan=true; see docs/virtual-machines.md."
            securityGroups:
              type: array
              items:
                type: string
              description: Names of SecurityGroups (firewall rule sets) to attach to this VM.
            running:
              type: boolean
              default: true
              description: Power state. Default true = running; false stops the VM (mapped to KubeVirt runStrategy Halted)
                while retaining its disk. The console's Start/Stop button flips this.
            highAvailability:
              type: boolean
              default: false
              description: 'Node-independent storage and live migration. Default false = root disk on local-path NVMe (faster,
                but pinned to one node). true provisions the root disk on Longhorn (replicated, migratable RWX block) and
                sets evictionStrategy: LiveMigrate, so the VM survives a node loss (reschedule + reboot) and live-migrates
                off a drained node with zero downtime. See cpuModel for cross-CPU portability.'
            existingRootClaim:
              type: string
              description: "Boot from an existing root PVC instead of cloning a fresh disk from the OS image \u2014 used to\
                \ migrate or restore a VM onto a pre-populated disk (e.g. one cloned onto Longhorn). When set, no root DataVolume\
                \ is provisioned."
            cpuModel:
              type: string
              description: "Guest CPU model to require (KubeVirt domain.cpu.model). Empty (default) uses host-model \u2014\
                \ best performance, but pins the VM to its node's exact CPU. For live migration or node-loss recovery across\
                \ heterogeneous CPUs, set the newest model common to all nodes (e.g. Broadwell-noTSX). HA VMs fall back to\
                \ Nehalem when this is unset."
        status:
          type: object
          properties:
            os:
              type: string
            ip:
              type: string
            ready:
              type: boolean
    VmImage:
      type: object
      description: 'open-infra kind: VmImage.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - VmImage
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - os
          properties:
            storageClass:
              type: string
              description: StorageClass for this resource's persistent volumes. Defaults to 'longhorn'. Set to your cluster's
                StorageClass on substrates that do not ship Longhorn (e.g. RKE2 with local-path).
            os:
              type: string
              description: Windows version to build (curated catalog).
              enum:
              - windows-server-2019
              - windows-server-2022
              - windows-server-2025
            sourceUrl:
              type: string
              description: Override eval-ISO URL
            diskSize:
              type: string
              default: 64Gi
              description: Golden disk size
            existingGoldenClaim:
              type: string
        status:
          type: object
          properties:
            phase:
              type: string
            ready:
              type: boolean
    Volume:
      type: object
      description: 'open-infra kind: Volume.'
      required:
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - openinfra.dev/v1
        kind:
          type: string
          enum:
          - Volume
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          type: object
          required:
          - size
          properties:
            size:
              type: string
              description: Volume size, e.g. 50Gi (expandable later).
            migratable:
              type: boolean
              default: false
              description: RWX block on the longhorn-migratable class so this volume can attach to a live-migratable (highAvailability)
                VM without blocking its live migration. Default false = RWO (fine for normal VMs; blocks live migration if
                attached to an HA VM).
            source:
              type: object
              description: 'Optional: restore a new volume from a snapshot.'
              properties:
                snapshot:
                  type: string
                  description: VolumeSnapshot name (same namespace) to restore from.
        status:
          type: object
          properties:
            phase:
              type: string
              description: Observed lifecycle phase of the volume (its backing Longhorn PersistentVolumeClaim); the console
                surfaces it as the volume's Status.
            size:
              type: string
              description: Observed (provisioned) capacity of the volume.
