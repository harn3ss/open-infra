            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    delete:
      tags:
      - VmImage
      summary: Delete a VmImage
      parameters:
      - *id085
      - *id087
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found
  /namespaces/{namespace}/volumes:
    get:
      tags:
      - Volume
      summary: List Volume resources
      parameters:
      - &id088
        name: namespace
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
