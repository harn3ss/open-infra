# The account compiler: one kind: Account -> its namespaces labeled into the account, and, for a member
# account, the isolation baseline, Service Quotas defaults and OrganizationAccountAccessRole.
#
# The management account (the install's own, openinfra-aws-identity awsAccountId) renders nothing: its
# namespaces are the platform's own, which GitOps owns, so their account labels are in their manifests.
# Labeling them here too would make two client-side appliers undo each other's labels.
#
# A namespace is labeled through a provider-kubernetes Object with no Delete in its managementPolicies and
# deletionPolicy Orphan: closing an account (deleting its Account) never deletes a namespace or its data.
#
# Synced after the XRD (sync-wave 3). Also here: the admission that keeps an account id and a namespace's
# account unique, and the RBAC the composition's providers need for namespaces and Roles.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: account
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: organizations.openinfra.dev/v1
    kind: Account
  mode: Pipeline
  pipeline:
    # The install's AWS identity (platform/aws-shim/aws-identity.yaml): its account is the management
    # account. Optional: without it the management account is 000000000000.
    - step: environment
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          policy:
            resolution: Optional
          environmentConfigs:
            - type: Reference
              ref:
                name: openinfra-aws-identity
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec }}
            {{- $envCfg := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $mgmt := index $envCfg "awsAccountId" | default "000000000000" }}
            {{- $acct := $spec.accountId | default "" }}
            {{- if not (regexMatch "^[0-9]{12}$" $acct) }}
            {{-   fail "Account: the account id must be 12 digits (accountId)" }}
            {{- end }}
            {{- $nss := $spec.namespaces | default list }}
            {{- if eq (len $nss) 0 }}
            {{-   fail "Account: an account needs at least one namespace, the first being its home (namespaces)" }}
            {{- end }}
            {{- $home := index $nss 0 }}
            {{- $isMgmt := eq $acct $mgmt }}
            {{- $state := "ACTIVE" }}{{- if $spec.suspended }}{{- $state = "SUSPENDED" }}{{- end }}
            {{- $isolation := $spec.isolation | default "baseline" }}
            {{- /* The account's applied Service Quotas: the platform's defaults (AWS's quota codes and names;
                   kept in step with the aws-shim's Service Quotas table by a test) with spec.serviceQuotas
                   over them, an operator's approved increases. */}}
            {{- $over := dict }}
            {{- range $q := ($spec.serviceQuotas | default list) }}
            {{-   $_ := set $over (printf "%s/%s" $q.serviceCode $q.quotaCode) $q.value }}
            {{- end }}
            {{- $defaults := list
                  (dict "s" "ec2" "c" "L-1216C47A" "n" "Running On-Demand Standard (A, C, D, H, I, M, R, T, Z) instances" "v" 64)
                  (dict "s" "ec2" "c" "L-0263D0A3" "n" "EC2-VPC Elastic IPs" "v" 5)
                  (dict "s" "lambda" "c" "L-B99A9384" "n" "Concurrent executions" "v" 1000)
                  (dict "s" "cloudformation" "c" "L-0485CB21" "n" "Stacks" "v" 2000)
                  (dict "s" "s3" "c" "L-DC2B2D3D" "n" "General purpose buckets" "v" 10000)
                  (dict "s" "dynamodb" "c" "L-F98FE922" "n" "Maximum number of tables" "v" 2500) }}
            {{- $applied := list }}
            {{- $concurrency := 1000 }}
            {{- range $d := $defaults }}
            {{-   $k := printf "%s/%s" $d.s $d.c }}
            {{-   $v := $d.v }}
            {{-   if hasKey $over $k }}{{- $v = index $over $k }}{{- end }}
            {{-   if eq $k "lambda/L-B99A9384" }}{{- $concurrency = $v }}{{- end }}
            {{-   $applied = append $applied (dict "ServiceCode" $d.s "QuotaCode" $d.c "QuotaName" $d.n "Unit" "None" "Value" $v) }}
            {{- end }}
            {{- range $i, $ns := $nss }}
            {{- if not $isMgmt }}
            ---
            # Namespace {{ $ns }} into account {{ $acct }}. Observe/Create/Update only and orphaned on delete:
            # an Account never deletes a namespace. Create covers a new account's home (CreateAccount).
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "ns-%s" $ns | toJson }}
            spec:
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              deletionPolicy: Orphan
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $ns | toJson }}
                    labels:
                      openinfra.dev/account-id: {{ $acct | toJson }}
                      openinfra.dev/account-status: {{ $state | toJson }}
                      # Lambda's concurrent executions (Service Quotas L-B99A9384): the function-concurrency
                      # policy (the compliance component) turns it into a ResourceQuota on this namespace's
                      # burstable function pods.
                      openinfra.dev/function-concurrency: {{ printf "%d" (int $concurrency) | toJson }}
                      # Whether the account's default VPC has its internet gateway (spec.defaultVpc
                      # internetGateway): the public-address policy below refuses an instance here a public
                      # address when it does not. Always written, "true" or "false", as a label provider-kubernetes
                      # stops rendering is never removed.
                      openinfra.dev/internet-gateway: {{ if eq (printf "%v" ($spec.defaultVpc | default dict).internetGateway) "false" }}"false"{{ else }}"true"{{ end }}
                      {{- /* spec.capacity: the operator's ceiling on what the account may reserve in each of
                             its namespaces. The account-capacity policy (the compliance component) turns each
                             label into a ResourceQuota. Every label is always written, "none" when its limit is
                             unset: provider-kubernetes never removes a label it stops rendering, so "none" is
                             how a removed limit reaches the namespace (and the policy drops its quota). */}}
                      {{- $cap := $spec.capacity | default dict }}
                      openinfra.dev/capacity-cpu: {{ $cap.cpu | default "none" | toJson }}
                      openinfra.dev/capacity-memory: {{ $cap.memory | default "none" | toJson }}
                      openinfra.dev/capacity-gpu: {{ if hasKey $cap "gpus" }}{{ printf "%d" (int $cap.gpus) | toJson }}{{ else }}"none"{{ end }}
                      openinfra.dev/capacity-storage: {{ $cap.storage | default "none" | toJson }}
                      openinfra.dev/capacity-pods: {{ if $cap.pods }}{{ printf "%d" (int $cap.pods) | toJson }}{{ else }}"none"{{ end }}
                      {{- if eq $i 0 }}
                      openinfra.dev/account-home: "true"
                      {{- end }}
            {{- end }}
            {{- if and (not $isMgmt) (eq $isolation "baseline") }}
            ---
            # The account's isolation baseline in {{ $ns }}: ingress only from the account's own namespaces and
            # the platform's data path. Additive with the policies a workload carries itself (an Application's,
            # a Function's, a VM's security groups), which still admit what they admit; the baseline closes
            # what had no policy at all. Kubelet probes come from the pod's own node, which kube-ovn admits.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "isolation-%s" $ns | toJson }}
            spec:
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: openinfra-account-isolation
                    namespace: {{ $ns | toJson }}
                    labels: { openinfra.dev/isolation: account, openinfra.dev/account-id: {{ $acct | toJson }} }
                  spec:
                    podSelector: {}
                    policyTypes: [Ingress]
                    ingress:
                      - from:
                          # the account's own namespaces
                          - namespaceSelector: { matchLabels: { openinfra.dev/account-id: {{ $acct | toJson }} } }
                          # Knative's data path: the gateway, the activator and the autoscaler
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: knative-serving } }
                          # the ingress controller on the pod network, and host-sourced traffic (host-network
                          # Traefik, NodePort and LoadBalancer Services), which arrives as a node's join IP
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
                            podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
                          - ipBlock: { cidr: 100.64.0.0/16 }
                          # the console (database stats, point-in-time restore) and the aws-shim's front doors
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: open-infra-console } }
                            podSelector: { matchLabels: { app: console } }
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: open-infra-aws-shim } }
                            podSelector: { matchLabels: { app: aws-shim } }
                          # the AppSync engine (a GraphQL API's data sources)
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: open-infra-open-appsync } }
                          # Prometheus, scraping metrics
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
                            podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
                          # the database operators (instance status, backups, failover; users and grants)
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cnpg-system } }
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: mariadb-operator } }
            ---
            # The platform's disk copies into {{ $ns }}: an instance's root disk is copied from its image (a
            # Windows golden, or an account image it may launch) in openinfra-images, by CDI's clone source pod
            # there to CDI's upload pod here. Only CDI's upload pods take it, from that namespace's clone
            # sources, on the upload port.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "disk-copies-%s" $ns | toJson }}
            spec:
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: openinfra-disk-copies
                    namespace: {{ $ns | toJson }}
                    labels: { openinfra.dev/isolation: account, openinfra.dev/account-id: {{ $acct | toJson }} }
                  spec:
                    podSelector: { matchLabels: { cdi.kubevirt.io: cdi-upload-server } }
                    policyTypes: [Ingress]
                    ingress:
                      - from:
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: openinfra-images } }
                            podSelector: { matchLabels: { cdi.kubevirt.io: cdi-clone-source } }
                        ports: [ { protocol: TCP, port: 8443 } ]
            {{- end }}
            {{- end }}
            {{- if not $isMgmt }}
            ---
            # The account's applied Service Quotas (the defaults with spec.serviceQuotas over them), as the
            # aws-shim's Service Quotas front door answers GetServiceQuota: a readable copy in its home.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service-quotas
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: openinfra-service-quotas
                    namespace: {{ $home | toJson }}
                    labels: { openinfra.dev/account-id: {{ $acct | toJson }} }
                  data:
                    quotas.json: {{ $applied | toJson | toJson }}
            ---
            # OrganizationAccountAccessRole: the role the management account assumes into this account
            # ("Switch role"), with AdministratorAccess, as AWS Organizations creates in every member account.
            # The Kubernetes name is the AWS name lowercased; openinfra.dev/aws-name carries the AWS name.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: access-role
            spec:
              forProvider:
                manifest:
                  apiVersion: iam.openinfra.dev/v1
                  kind: Role
                  metadata:
                    name: organizationaccountaccessrole
                    namespace: {{ $home | toJson }}
                    labels: { openinfra.dev/account-id: {{ $acct | toJson }} }
                    annotations: { openinfra.dev/aws-name: OrganizationAccountAccessRole }
                  spec:
                    description: The management account's administrator access into this account (AWS Organizations).
                    trust: [{{ printf "arn:aws:iam::%s:root" $mgmt | toJson }}]
                    # AWS's AdministratorAccess: the platform's managed library names it aws-administratoraccess
                    # (a Role's spec.policies are Policy names, resolved from the library in the management
                    # account's IAM home when this namespace has no Policy of that name).
                    policies: ["aws-administratoraccess"]
            {{- with $spec.defaultVpc }}
            {{- $cidr := .subnetCidr }}
            {{- $third := int (index (splitList "." $cidr) 2) }}
            {{- $net := printf "172.31.%d" $third }}
            ---
            # The account's default subnet (its default VPC, 172.31.0.0/16): a /20 of the cluster network of its
            # own, which a workload joins by naming it (ovn.kubernetes.io/logical_switch) — the account's
            # namespaces are not bound to it, so nothing else moves. Public, as AWS's default subnets are, and
            # its traffic to the internet is NATed by the node. AWS reserves a subnet's first four addresses and
            # its last, so they are kept out of it here too.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: default-subnet
            spec:
              forProvider:
                manifest:
                  apiVersion: kubeovn.io/v1
                  kind: Subnet
                  metadata:
                    name: {{ printf "default-vpc-%s" $acct | toJson }}
                    labels: { openinfra.dev/default-vpc: "true", openinfra.dev/account-id: {{ $acct | toJson }} }
                  spec:
                    protocol: IPv4
                    vpc: ovn-cluster
                    cidrBlock: {{ $cidr | toJson }}
                    gateway: {{ printf "%s.1" $net | toJson }}
                    excludeIps:
                      - {{ printf "%s.1..%s.3" $net $net | toJson }}
                      - {{ printf "172.31.%d.255" (add $third 15) | toJson }}
                    private: false
                    {{- if eq (printf "%v" .internetGateway) "false" }}
                    # No internet gateway (spec.defaultVpc.internetGateway false): nothing NATs the subnet's
                    # traffic out, and its network ACL lets it leave only for the platform's own networks —
                    # the cluster's services (its AWS endpoints, DNS), its pods, the nodes' join network, and
                    # the subnet itself — dropping the rest, before any network policy allows it.
                    natOutgoing: false
                    acls:
                      - direction: from-lport
                        priority: 3000
                        match: {{ printf "ip4 && ip4.dst != {10.43.0.0/16, 10.16.0.0/16, 100.64.0.0/16, %s}" $cidr | toJson }}
                        action: drop
                      # DNS only to the VPC resolver (Route 53 Resolver, its DNS Firewall: vpcresolver_default.go),
                      # never to the cluster's own resolver or any other, so the firewall cannot be gone around.
                      - direction: from-lport
                        priority: 3001
                        match: "(udp.dst == 53 || tcp.dst == 53) && ip4.dst != 10.43.0.2"
                        action: drop
                    {{- else }}
                    natOutgoing: true
                    acls: []
                    {{- end }}
            {{- end }}
            {{- end }}
            ---
            apiVersion: organizations.openinfra.dev/v1
            kind: Account
            status:
              state: {{ $state | toJson }}
              management: {{ $isMgmt }}
              homeNamespace: {{ $home | toJson }}
              {{- if not $isMgmt }}
              accessRoleArn: {{ printf "arn:aws:iam::%s:role/OrganizationAccountAccessRole" $acct | toJson }}
              {{- end }}
              ready: true
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
---
# An account is named by its account id, so two accounts can never share one: the API server refuses a
# second object of the same name.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-account-named-by-id
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["organizations.openinfra.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["accounts"]
  validations:
    - expression: "has(object.spec.accountId) && object.metadata.name == object.spec.accountId"
      message: an Account is named by its account id (metadata.name must equal spec.accountId)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-account-named-by-id
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  policyName: openinfra-account-named-by-id
  validationActions: [Deny]
---
# A namespace belongs to one account: once labeled into an account, its account label is not changed or
# removed, except by a cluster administrator (system:masters) moving it on purpose. So a second Account
# listing a namespace another holds fails to apply, and says why, instead of taking it over.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-account-namespace-owner
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    # only a namespace already in an account; every other namespace update is untouched
    - name: in-an-account
      expression: "has(oldObject.metadata.labels) && 'openinfra.dev/account-id' in oldObject.metadata.labels && oldObject.metadata.labels['openinfra.dev/account-id'] != ''"
  validations:
    - expression: >-
        (has(object.metadata.labels) && 'openinfra.dev/account-id' in object.metadata.labels &&
        object.metadata.labels['openinfra.dev/account-id'] == oldObject.metadata.labels['openinfra.dev/account-id'])
        || 'system:masters' in request.userInfo.groups
      messageExpression: >-
        'namespace ' + object.metadata.name + ' belongs to account ' +
        oldObject.metadata.labels['openinfra.dev/account-id'] +
        ': only a cluster administrator moves a namespace between accounts'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-account-namespace-owner
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  policyName: openinfra-account-namespace-owner
  validationActions: [Deny]
---
# What the account composition's providers need: Crossplane reads and writes Accounts (a new API group, so
# the group-wide grant the other kinds' groups have does not cover it), and provider-kubernetes labels
# namespaces (creating a new account's home) and writes the account's OrganizationAccountAccessRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:openinfra-organizations-access
rules:
  - apiGroups: ["organizations.openinfra.dev"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane:openinfra-organizations-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane:openinfra-organizations-access
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes:openinfra-accounts
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["iam.openinfra.dev"]
    resources: ["roles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes:openinfra-accounts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-kubernetes:openinfra-accounts
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
---
# An instance in a default VPC without its internet gateway gets no public address, as EC2 refuses to
# associate an Elastic IP with an instance in a VPC that has none (Gateway.NotAttached). Here a public
# address is a LAN address that would reach the instance from outside the platform, which that VPC's routes
# do not allow; a network load balancer (Elastic Load Balancing) is how such an instance is reached. The
# namespace's openinfra.dev/internet-gateway label, which the Account writes, says which VPC an instance
# launches in. A launch with an address (spec.expose, spec.ports or spec.elasticIp), and an update that
# adds one, are refused; an instance that already has one keeps it. An instance that names another subnet
# (a stack's own VPC) is not this VPC's.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-public-address-needs-internet-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["openinfra.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["virtualmachines"]
  matchConditions:
    - name: in-a-default-vpc-without-internet-gateway
      expression: >-
        namespaceObject != null && has(namespaceObject.metadata.labels) &&
        'openinfra.dev/internet-gateway' in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels['openinfra.dev/internet-gateway'] == 'false'
  variables:
    - name: account
      expression: >-
        'openinfra.dev/account-id' in namespaceObject.metadata.labels ?
        namespaceObject.metadata.labels['openinfra.dev/account-id'] : ''
    - name: inDefaultSubnet
      expression: >-
        !has(object.spec.subnet) || object.spec.subnet == '' || object.spec.subnet == 'default-vpc-' + variables.account
    - name: addressed
      expression: >-
        (has(object.spec.expose) && object.spec.expose == true) ||
        (has(object.spec.ports) && size(object.spec.ports) > 0) || has(object.spec.elasticIp)
    - name: hadAddress
      expression: >-
        oldObject != null && has(oldObject.spec) &&
        ((has(oldObject.spec.expose) && oldObject.spec.expose == true) ||
        (has(oldObject.spec.ports) && size(oldObject.spec.ports) > 0) || has(oldObject.spec.elasticIp))
  validations:
    - expression: "!variables.inDefaultSubnet || !variables.addressed || variables.hadAddress"
      messageExpression: >-
        'Gateway.NotAttached: the default VPC of account ' + variables.account + ' is not attached to any
        internet gateway, so instance ' + object.metadata.name + ' cannot have a public address
        (spec.expose, spec.ports or spec.elasticIp). Reach it through a network load balancer (Elastic Load
        Balancing).'
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-public-address-needs-internet-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  policyName: openinfra-public-address-needs-internet-gateway
  validationActions: [Deny]
