# kind: Account — an AWS account (AWS Organizations' member account), the boundary every principal,
# resource and ARN belongs to.
#
# An account owns one or more namespaces. Its composition labels each of them
# openinfra.dev/account-id=<accountId> (the first, its home, also openinfra.dev/account-home=true): the
# aws-shim, the console and the CloudFormation engine read the labels (console-api/internal/accounts) to
# resolve a caller's account, build its ARNs with that account's id, and keep its resources in its
# namespaces. Its IAM (Users, Groups, Roles, Policies) lives in its home namespace.
#
# The management account is the install's own account (openinfra-aws-identity, ACCOUNT_ID — 000000000000
# unless configured): every ARN, StackId and queue URL an install has already handed out keeps its id, and a
# namespace no account claims belongs to it. install.sh creates its Account. A member account is created
# with organizations:CreateAccount through the aws-shim, or as this object; it gets, as on AWS:
#   - an isolation baseline (spec.isolation): ingress to its namespaces only from its own namespaces and the
#     platform's data path, so one account's workloads cannot reach another's;
#   - Service Quotas defaults in its home namespace;
#   - OrganizationAccountAccessRole in its home namespace, which the management account may assume
#     ("Switch role" in the console), with AdministratorAccess.
#
# Cluster-scoped and composite-only (no claim): an account is the container of namespaces, so it lives in
# none. The object is named by its account id — admission requires metadata.name == spec.accountId (the
# ValidatingAdmissionPolicy in account-composition.yaml) — so an id is unique by construction.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: accounts.organizations.openinfra.dev
  annotations:
    # Composite-only and cluster-scoped on purpose (no claim): an account contains namespaces, so it lives
    # in none, and it is the management account's to create, never a tenant-grantable kind.
    openinfra.dev/composite-only: "true"
    openinfra.dev/chaos-role: "none"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: organizations.openinfra.dev
  names:
    kind: Account
    plural: accounts
  defaultCompositionRef:
    name: account
  versions:
    - name: v1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - { name: ALIAS, type: string, jsonPath: .spec.alias }
        - { name: HOME, type: string, jsonPath: ".spec.namespaces[0]" }
        - { name: STATUS, type: string, jsonPath: .status.state }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [accountId, namespaces]
              x-kubernetes-validations:
                - rule: "self.accountId == oldSelf.accountId"
                  message: an account's id never changes
                - rule: "self.namespaces[0] == oldSelf.namespaces[0]"
                  message: an account's home namespace (the first in namespaces) never changes
                # Platform-internal namespaces are never an account's. Kept in step with
                # console-api/internal/accounts PlatformNamespaces/PlatformPrefixes by a test.
                - rule: >-
                    self.namespaces.all(n, !(n in ['argocd', 'cdi', 'cert-manager', 'chaos-mesh', 'cnpg-system',
                    'crossplane-system', 'dcgm-exporter', 'gpu-operator', 'keda', 'kourier-system', 'kubevirt',
                    'kyverno', 'lakehouse', 'longhorn-system', 'mail', 'mariadb-operator', 'metallb-system', 'minio',
                    'monitoring', 'nats', 'nvidia-device-plugin', 'open-infra-authz', 'open-infra-aws-shim',
                    'open-infra-prepull', 'openbao', 'redis', 'sealed-secrets', 'vault', 'velero']) &&
                    !n.startsWith('kube-') && !n.startsWith('knative-') && !n.startsWith('openinfra-'))
                  message: a platform namespace (the cluster's own machinery) cannot belong to an account
              properties:
                accountId:
                  type: string
                  pattern: '^[0-9]{12}$'
                  description: >-
                    The account's 12-digit id, in every ARN of its principals and resources. The management
                    account's is the install's ACCOUNT_ID. A new account's is given here (an imported estate
                    keeps its real id), or derived by CreateAccount: 9 followed by 11 digits of its home
                    namespace's SHA-256. The object's name must equal it.
                alias:
                  type: string
                  pattern: '^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?$'
                  description: >-
                    The account alias (AWS's iam:CreateAccountAlias): 3–63 lowercase letters, digits and
                    hyphens, shown in the console and as the account's name in Organizations.
                email:
                  type: string
                  maxLength: 64
                  pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}$'
                  description: The account's email address, as AWS Organizations records it.
                namespaces:
                  type: array
                  minItems: 1
                  maxItems: 100
                  x-kubernetes-list-type: set
                  description: >-
                    The namespaces the account owns. The first is its home: its IAM objects live there and
                    the aws-shim creates its resources there. A namespace belongs to one account at most
                    (admission refuses moving one that another account holds, except to a cluster
                    administrator). Removing a namespace from the list leaves the namespace and its label.
                  items:
                    type: string
                    maxLength: 63
                    pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
                parent:
                  type: string
                  pattern: '^(r-[0-9a-z]{4,32}|ou-[0-9a-z]{4,32}-[a-z0-9]{8,32})$'
                  description: >-
                    The Organizations root (r-…) or organizational unit (ou-…) the account sits under. Unset:
                    the organization's root.
                isolation:
                  type: string
                  enum: [baseline, none]
                  default: baseline
                  description: >-
                    baseline (the default for a member account): ingress to the account's pods only from its
                    own namespaces and the platform's data path (the Functions gateway, the ingress
                    controller and host-network traffic, the console, the aws-shim, the AppSync engine,
                    Prometheus and the database operators). Policies a workload carries itself (an
                    Application's, a VM's security groups) still admit what they admit. none: no account
                    policy. The management account never gets one.
                suspended:
                  type: boolean
                  default: false
                  description: >-
                    Suspend the account (AWS's SUSPENDED state): its namespaces are labeled
                    openinfra.dev/account-status=SUSPENDED, and the platform's front doors refuse its
                    principals. Unsuspend by setting it false.
                serviceQuotas:
                  type: array
                  maxItems: 100
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [serviceCode, quotaCode]
                  description: >-
                    The account's applied Service Quotas where they differ from the platform's defaults
                    (AWS's GetServiceQuota answers these). An operator sets an entry to approve an increase
                    an account requested with servicequotas:RequestServiceQuotaIncrease. Lambda's concurrent
                    executions (L-B99A9384) is enforced: every namespace of a member account is labeled
                    openinfra.dev/function-concurrency with it, which the compliance component's
                    function-concurrency-quota policy turns into a ResourceQuota on that namespace's
                    burstable function pods.
                  items:
                    type: object
                    required: [serviceCode, quotaCode, value]
                    properties:
                      serviceCode:
                        type: string
                        pattern: '^[a-z0-9-]{1,63}$'
                      quotaCode:
                        type: string
                        pattern: '^L-[0-9A-F]{8}$'
                      value:
                        type: number
                        minimum: 0
                capacity:
                  type: object
                  description: >-
                    The most the account's workloads may reserve, set by the operator to protect the shared
                    cluster. Each limit applies in each of the account's namespaces and is enforced natively, by
                    a ResourceQuota the compliance component generates there: a pod that would take the
                    namespace past a limit is refused when it is created, whatever made it (the AWS API,
                    CloudFormation or the console). Unset limits are not enforced; an account with no capacity
                    is unchanged. Setting cpu or memory also gives containers that declare no request a small
                    default one, so they are counted instead of refused.
                  properties:
                    cpu:
                      type: string
                      maxLength: 16
                      pattern: '^[0-9]+(\.[0-9]+)?m?$'
                      description: "CPU the namespace's pods may request in total (requests.cpu), e.g. \"16\" or \"500m\"."
                    memory:
                      type: string
                      maxLength: 16
                      pattern: '^[0-9]+(Ki|Mi|Gi|Ti)$'
                      description: "Memory the namespace's pods may request in total (requests.memory), e.g. \"64Gi\"."
                    gpus:
                      type: integer
                      minimum: 0
                      maximum: 64
                      description: "GPUs the namespace's pods may request in total (requests.nvidia.com/gpu); 0 allows none."
                    storage:
                      type: string
                      maxLength: 16
                      pattern: '^[0-9]+(Mi|Gi|Ti)$'
                      description: "Storage the namespace's volume claims may request in total (requests.storage), e.g. \"500Gi\"."
                    pods:
                      type: integer
                      minimum: 1
                      maximum: 100000
                      description: "Pods the namespace may run at once (count/pods, the tenant pod budget)."
                ses:
                  type: object
                  description: >-
                    The account's Amazon SES identities and sending status, as the operator has verified and
                    granted them. SES verifies an identity by proving its owner controls it (a DNS record for a
                    domain, a confirmation link for an address); here the operator, who holds the sending
                    domains' DNS and the platform relay's smarthost, does that and records it on the account.
                    A member account sends — SES SendEmail / SendRawEmail, SES v2 SendEmail, and the SES SMTP
                    interface (kind: EmailSender) — only as these identities. The management account sends as
                    every identity the relay is configured for, and ignores this.
                  properties:
                    verifiedIdentities:
                      type: array
                      maxItems: 1000
                      x-kubernetes-list-type: set
                      description: >-
                        Verified identities: domains (example.com — every address at the domain; a subdomain is
                        an identity of its own) and email addresses (noreply@example.com).
                      items:
                        type: string
                        maxLength: 320
                        pattern: '^([A-Za-z0-9._%+-]+@)?[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'
                    productionAccessEnabled:
                      type: boolean
                      default: false
                      description: >-
                        Whether the account is out of the SES sandbox (AWS's production access). In the sandbox
                        an account also sends only TO its verified identities. An operator sets it to grant an
                        account's request for production access.
            status:
              type: object
              properties:
                state:
                  type: string
                  description: ACTIVE or SUSPENDED (AWS Organizations' account status).
                management:
                  type: boolean
                  description: Whether this is the management account (the install's own).
                homeNamespace:
                  type: string
                accessRoleArn:
                  type: string
                  description: The ARN of the account's OrganizationAccountAccessRole (a member account only).
                ready:
                  type: boolean
