# The compiler for kind: BatchTransform -> a run-once, offline batch-inference Job.
# It renders a bucket-setup Job (ensures the input/output/artifact buckets exist and
# writes a <name>-minio creds secret, the pre-defined openinfra-bucket-setup identity)
# and the inference batch/v1 Job: the user's container on an optional GPU node, with the
# input/output/artifact locations + S3-compatible credentials injected. Structurally the
# same as kind: TrainingJob, but for scoring rather than training. Status is the Job's.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: batchtransform
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XBatchTransform
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec }}
            {{- $labels := $xr.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default $xr.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- $job := printf "%s-transform" $name }}
            {{- $gpu := 0 }}{{- if hasKey $spec "gpu" }}{{- $gpu = $spec.gpu }}{{- end }}
            {{- $useGpu := gt $gpu 0 }}
            {{- $tier := $spec.gpuTier | default "smallgpu" }}
            {{- $cpu := $spec.cpu | default "2" }}
            {{- $mem := $spec.memory | default "4Gi" }}
            {{- $in := $spec.input | default dict }}
            {{- $out := $spec.output | default dict }}
            {{- $art := $spec.artifact | default dict }}
            {{- $buckets := list }}
            {{- if $in.bucket }}{{- $buckets = append $buckets $in.bucket }}{{- end }}
            {{- if $out.bucket }}{{- $buckets = append $buckets $out.bucket }}{{- end }}
            {{- if $art.bucket }}{{- $buckets = append $buckets $art.bucket }}{{- end }}
            ---
            # Ensure the buckets exist + write the S3 creds secret (<name>-minio).
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-setup
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  {{- range $b := $buckets }}
                  {{-   if ne (regexReplaceAll "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" (printf "%v" $b) "") "" }}{{- fail (printf "kind: BatchTransform %s/%s: bucket %q is not a valid S3 bucket name (3-63 lowercase letters, digits, dots, hyphens)" $ns $name (printf "%v" $b)) }}{{- end }}
                  {{- end }}
                  {{- /* Tenant isolation: each bucket belongs to this namespace (bucket-ownership.sh in
                         provider-setup.yaml); the MinIO user and this Job are named from the claim's kind,
                         namespace and name. */}}
                  {{- $bktOwner := printf "BatchTransform/%s/%s" $ns $name }}
                  {{- $bktUser := printf "app-%s-%s" (printf "%s-%s" $ns $name | replace "." "-" | trunc 40 | trimSuffix "-") ($bktOwner | sha256sum | trunc 10) }}
                  {{- $bktHash := printf "%s|own-v2" $bktOwner | sha256sum | trunc 5 }}
                  metadata: { name: {{ $name }}-bt-bucket-{{ $bktHash }}, namespace: minio }
                  spec:
                    backoffLimit: 20
                    # No ttlSecondsAfterFinished: provider-kubernetes recreates a TTL-GC'd managed Job
                    # → infinite re-run loop; the finished Job persists as its done-marker (see bucket-composition.yaml).
                    template:
                      spec:
                        # enableServiceLinks off: per-Service env overflows execve (E2BIG) in dense namespaces; unused here.
                        enableServiceLinks: false
                        serviceAccountName: openinfra-bucket-setup
                        restartPolicy: OnFailure
                        volumes:
                          - { name: mc, emptyDir: {} }
                          - { name: ownership, configMap: { name: openinfra-bucket-ownership } }
                        initContainers:
                          # Bring `mc` in OFFLINE (copied from its image) — for bucket creation
                          # AND minting the scoped per-app user/policy (#151 faults 1+3).
                          - name: fetch-mc
                            image: ghcr.io/harn3ss/open-infra-mc@sha256:a689825d5299d02e6f35973e726a6e49a77469cde644dd52d60586b07bd85744
                            command: [sh, -c, "cp /usr/bin/mc /mc/mc && chmod +x /mc/mc"]
                            volumeMounts: [{ name: mc, mountPath: /mc }]
                        containers:
                          - name: setup
                            image: alpine/k8s:1.30.0
                            volumeMounts: [{ name: mc, mountPath: /mc }, { name: ownership, mountPath: /opt/openinfra, readOnly: true }]
                            env:
                              # Root provisions ONLY (create buckets + mint the scoped user);
                              # it is never written into the app secret (#151 fault 3).
                              - name: ROOT_USER
                                valueFrom: { secretKeyRef: { name: minio, key: rootUser } }
                              - name: ROOT_PASS
                                valueFrom: { secretKeyRef: { name: minio, key: rootPassword } }
                              - { name: OWNER_NS, value: {{ $ns | quote }} }
                              - { name: OWNER_REF, value: {{ $bktOwner | quote }} }
                              - { name: XR_CREATED, value: {{ $.observed.composite.resource.metadata.creationTimestamp | default "" | quote }} }
                            command: ["/bin/sh", "-c"]
                            args:
                              - |
                                set -e
                                MC=/mc/mc
                                E=http://minio.minio.svc.cluster.local:9000
                                # alias set validates root up front — a rotated/wrong root key fails
                                # HERE, loud, instead of a false-green (#151 faults 1+2).
                                "$MC" alias set m "$E" "$ROOT_USER" "$ROOT_PASS" >/dev/null
                                # 0. Every bucket must be this namespace's (or new) before anything is created or granted.
                                . /opt/openinfra/bucket-ownership.sh
                                for b in {{ range $buckets }}{{ . }} {{ end }}; do
                                  claim_bucket "$b"
                                done
                                # 1. Create each bucket idempotently but FAIL LOUD (#151 fault 1).
                                for b in {{ range $buckets }}{{ . }} {{ end }}; do
                                  "$MC" mb --ignore-existing "m/$b"
                                  echo "bucket $b ready"
                                done
                                # 2. Mint a PER-APP, NON-root user scoped to ONLY these buckets (#151 fault 3). Its key
                                #    lives in a platform-side Secret (openinfra-bucket-creds/<user>); a provider Object
                                #    copies it into {{ $name }}-minio and GCs it with the claim.
                                APPUSER="{{ $bktUser }}"
                                RES=""
                                for b in {{ range $buckets }}{{ . }} {{ end }}; do
                                  RES="$RES\"arn:aws:s3:::$b\",\"arn:aws:s3:::$b/*\","
                                done
                                printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":[%s]}]}' "${RES%,}" > /tmp/pol.json
                                mint_scoped_user "$APPUSER" /tmp/pol.json
            {{- /* Scoped-credential delivery: Observe the platform Secret; once it exists, copy its key into
                   {{ $name }}-minio as a composed (GC'd) Secret. See bucket-composition.yaml for the model. */}}
            {{- $pcreds := index (.observed.resources | default dict) "bt-pcreds" }}
            {{- $pexists := false }}
            {{- if $pcreds }}{{- with $pcreds.resource.status }}{{- with .atProvider }}{{- with .manifest }}{{- with .metadata }}{{- if .uid }}{{- $pexists = true }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bt-pcreds
                # Observing the platform-side creds must not hold the claim NotReady: a claim from before the
                # scoped-creds model has none until its migration seeds one (its old Secret keeps it working).
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              managementPolicies: ["Observe"]
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata: { name: {{ $bktUser }}, namespace: openinfra-bucket-creds }
            {{- if $pexists }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bt-creds
            spec:
              references:
                - patchesFrom:
                    apiVersion: v1
                    kind: Secret
                    namespace: openinfra-bucket-creds
                    name: {{ $bktUser }}
                    fieldPath: data.MINIO_SECRET_KEY
                  toFieldPath: data.MINIO_SECRET_KEY
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  type: Opaque
                  metadata: { name: {{ $name }}-minio, namespace: {{ $ns }} }
                  stringData:
                    MINIO_ENDPOINT: http://minio.minio.svc.cluster.local:9000
                    MINIO_ACCESS_KEY: {{ $bktUser }}
            {{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: transform
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $job }}
                    namespace: {{ $ns }}
                    labels: { app.kubernetes.io/name: {{ $name }}, openinfra.dev/batchtransform: {{ $name }} }
                  spec:
                    backoffLimit: {{ $spec.backoffLimit | default 0 }}
                    {{- if $spec.maxRuntimeSeconds }}
                    activeDeadlineSeconds: {{ $spec.maxRuntimeSeconds }}
                    {{- end }}
                    template:
                      metadata: { labels: { app.kubernetes.io/name: {{ $name }}, openinfra.dev/batchtransform: {{ $name }} } }
                      spec:
                        # enableServiceLinks off: per-Service env overflows execve (E2BIG) in dense namespaces; unused here.
                        enableServiceLinks: false
                        restartPolicy: Never
                        {{- if $useGpu }}
                        runtimeClassName: nvidia
                        affinity:
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: openinfra.dev/gpu-tier
                                      operator: In
                                      {{- if eq $tier "largegpu" }}
                                      values: [large]
                                      {{- else }}
                                      values: [small, large]
                                      {{- end }}
                            {{- if eq $tier "smallgpu" }}
                            preferredDuringSchedulingIgnoredDuringExecution:
                              - weight: 100
                                preference:
                                  matchExpressions:
                                    - { key: openinfra.dev/gpu-tier, operator: In, values: [small] }
                            {{- end }}
                        {{- end }}
                        containers:
                          - name: transform
                            image: {{ $spec.image }}
                            {{- if $spec.command }}
                            command: {{ $spec.command | toJson }}
                            {{- end }}
                            {{- if $spec.args }}
                            args: {{ $spec.args | toJson }}
                            {{- end }}
                            env:
                              {{- range $e := ($spec.env | default (list)) }}
                              - { name: {{ $e.name | quote }}, value: {{ $e.value | quote }} }
                              {{- end }}
                              - { name: INPUT_BUCKET, value: {{ $in.bucket | quote }} }
                              - { name: INPUT_PREFIX, value: {{ $in.prefix | default "" | quote }} }
                              - { name: OUTPUT_BUCKET, value: {{ $out.bucket | quote }} }
                              - { name: OUTPUT_PREFIX, value: {{ $out.prefix | default "" | quote }} }
                              {{- if $art.bucket }}
                              - { name: ARTIFACT_BUCKET, value: {{ $art.bucket | quote }} }
                              - { name: ARTIFACT_KEY, value: {{ $art.key | default "" | quote }} }
                              {{- end }}
                              - { name: AWS_ENDPOINT_URL, value: "http://minio.minio.svc.cluster.local:9000" }
                              - { name: AWS_DEFAULT_REGION, value: "us-east-1" }
                              - name: AWS_ACCESS_KEY_ID
                                valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_ACCESS_KEY } }
                              - name: AWS_SECRET_ACCESS_KEY
                                valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_SECRET_KEY } }
                            {{- $envFrom := $spec.secrets | default (list) }}
                            {{- if gt (len $envFrom) 0 }}
                            envFrom:
                              {{- range $s := $envFrom }}
                              - secretRef: { name: {{ $s | quote }} }
                              {{- end }}
                            {{- end }}
                            resources:
                              # request == limit -> Guaranteed QoS. A one-shot Job has no warm-idle
                              # fleet, so there is no reservation trap to avoid (unlike a Function);
                              # reserving what the job may use keeps request <= limit (a fixed floor
                              # above a small user limit would render an invalid pod) and stops
                              # concurrent jobs from OOMing a node. GPU is an extended resource: limit only.
                              requests: { cpu: "{{ $cpu }}", memory: {{ $mem | quote }} }
                              limits:
                                cpu: "{{ $cpu }}"
                                memory: {{ $mem | quote }}
                                {{- if $useGpu }}
                                nvidia.com/gpu: {{ $gpu }}
                                {{- end }}
            ---
            apiVersion: openinfra.dev/v1
            kind: XBatchTransform
            status:
              jobName: {{ $job }}
            ---
            # --- Tenant isolation (ingress) for the transform pods: this namespace and the platform callers named
            #     below only; every other namespace is refused. Pod->Service calls keep the caller's pod IP (kube-
            #     ovn enable-lb), so the namespace is what tells tenants apart. ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: isolation-netpol
            spec:
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: {{ $name }}-batchtransform-isolation
                    namespace: {{ $ns }}
                    labels: { openinfra.dev/isolation: tenant }
                  spec:
                    podSelector: { matchLabels: { openinfra.dev/batchtransform: "{{ $name }}" } }
                    policyTypes: [Ingress]
                    ingress:
                      - from:
                          # this namespace
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $ns }} } }
                          # Prometheus, scraping metrics
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
                            podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
