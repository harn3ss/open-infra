# The compiler for kind: Bucket. A single setup Job (aws-cli + kubectl) in the minio namespace
# creates the MinIO bucket, applies versioning + lifecycle (expiration) via the S3 API, and writes
# the per-bucket creds Secret (<name>-minio) into the claim namespace. It reuses the same pattern as
# an Application's storage.buckets: runs in the minio namespace so MinIO root creds come from the
# `minio` Secret via env (never from this Composition), on the pre-defined openinfra-bucket-setup SA.
#
# The Job name carries a hash of the mutable spec (versioning + lifecycle) and of the owner, so changing
# either re-runs the setup (a fresh Job) rather than being a no-op on an immutable Job. The hash also
# carries the composite's uid, so a re-created claim (same name, same spec) never meets the Job of the
# one before it; and the Job is composed under a hash-qualified resource name, so a spec change makes
# Crossplane delete the superseded Job instead of leaving it behind.
#
# Default encryption (components.objectEncryption, storage/minio-kms.yaml): when the platform switch
# (configmap/openinfra-object-encryption in ns minio) is on, a bucket this Job creates — or one that is
# still empty and has none — gets default encryption (AES256 under MinIO's key). Buckets already holding
# objects are left as they are.
#
# Bucket names are global, as on S3: the bucket belongs to the namespace whose claim created it
# (bucket-ownership.sh, provider-setup.yaml). A claim in another namespace that names it is refused,
# and the per-bucket MinIO user is named from the claim's kind, namespace and name.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: bucket
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XBucket
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- $bucket := $spec.bucketName | default $name }}
            {{- if ne (regexReplaceAll "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" (printf "%v" $bucket) "") "" }}{{- fail (printf "kind: Bucket %s/%s: %q is not a valid S3 bucket name (3-63 lowercase letters, digits, dots, hyphens)" $ns $name (printf "%v" $bucket)) }}{{- end }}
            {{- /* Tenant isolation: the bucket belongs to this namespace (bucket-ownership.sh in
                   provider-setup.yaml), and the MinIO user is this claim's alone, named from its kind,
                   namespace and name, so a same-named claim elsewhere never shares it. */}}
            {{- $owner := printf "Bucket/%s/%s" $ns $name }}
            {{- $appUser := printf "app-%s-%s" (printf "%s-%s" $ns $name | replace "." "-" | trunc 40 | trimSuffix "-") ($owner | sha256sum | trunc 10) }}
            {{- $rules := list }}
            {{- range $r := ($spec.lifecycleRules | default list) }}
              {{- $rule := dict "ID" $r.id "Status" "Enabled" "Filter" (dict "Prefix" ($r.prefix | default "")) }}
              {{- if $r.expireDays }}{{- $_ := set $rule "Expiration" (dict "Days" $r.expireDays) }}{{- end }}
              {{- if $r.noncurrentExpireDays }}{{- $_ := set $rule "NoncurrentVersionExpiration" (dict "NoncurrentDays" $r.noncurrentExpireDays) }}{{- end }}
              {{- $rules = append $rules $rule }}
            {{- end }}
            {{- $lifecycle := dict "Rules" $rules | toJson }}
            {{- $lock := $spec.objectLock | default dict }}
            {{- $lockJson := "" }}
            {{- if $lock.mode }}
              {{- $ret := dict "Mode" $lock.mode }}
              {{- if $lock.days }}{{- $_ := set $ret "Days" $lock.days }}{{- else if $lock.years }}{{- $_ := set $ret "Years" $lock.years }}{{- end }}
              {{- $lockJson = dict "ObjectLockEnabled" "Enabled" "Rule" (dict "DefaultRetention" $ret) | toJson }}
            {{- end }}
            {{- $policy := $spec.policy | default "" }}
            {{- /* The policy must be a JSON object. It reaches the setup script only as an env value. */}}
            {{- if $policy }}{{- if not (and (hasPrefix "{" (trim $policy)) (kindIs "map" (fromYaml $policy))) }}{{- fail (printf "kind: Bucket %s/%s: spec.policy must be a JSON policy document (an object)" $ns $name) }}{{- end }}{{- end }}
            {{- /* The owner is in the Job name too: same-named claims in two namespaces get two Jobs. */}}
            {{- /* own-v3 (scoped creds), own-v2: the setup now passes the policy/lifecycle/lock as env values rather than inline
                   (the #347 injection fix). The Job's pod template is immutable, so the version bump mints a
                   fresh Job name on rollout — the old finished Job can't be patched in place — and the new
                   Job re-runs idempotently (own bucket, mb --ignore-existing, the existing key is reused). */}}
            {{- /* own-v4: the composite's uid is in the hash (a re-created claim gets a fresh Job), the Job is
                   composed per hash (a superseded one is deleted), and the setup sets default encryption. */}}
            {{- $hashIn := printf "%v|%s|%s|%s|%s|own-v4" ($spec.versioning | default false) $lifecycle $lockJson $owner .observed.composite.resource.metadata.uid }}
            {{- if $policy }}{{- $hashIn = printf "%s|%s" $hashIn $policy }}{{- end }}
            {{- /* Bucket tags (S3 bucket tagging), as a TagSet document in key order. A claim with none renders
                   exactly as before (no env, no step), so adding the field re-runs no existing Job. */}}
            {{- $tagList := list }}
            {{- range $k, $v := ($spec.tags | default dict) }}{{- $tagList = append $tagList (dict "Key" $k "Value" $v) }}{{- end }}
            {{- $tagging := "" }}
            {{- if $tagList }}{{- $tagging = dict "TagSet" $tagList | toJson }}{{- $hashIn = printf "%s|tags=%s" $hashIn $tagging }}{{- end }}
            {{- $hash := $hashIn | sha256sum | trunc 10 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-setup-{{ $hash }}
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata: { name: {{ $name }}-bucket-{{ $hash }}, namespace: minio }
                  spec:
                    backoffLimit: 20
                    # No ttlSecondsAfterFinished: this Job is managed by a provider-kubernetes Object,
                    # and a TTL-GC'd managed Job is recreated by the provider every poll → an infinite
                    # re-run loop (~12.5 min). The finished Job persists as its own done-marker; the
                    # claim's readiness keys off the creds Secret below, not the Job's presence.
                    template:
                      spec:
                        serviceAccountName: openinfra-bucket-setup
                        restartPolicy: OnFailure
                        volumes:
                          - { name: mc, emptyDir: {} }
                          - { name: ownership, configMap: { name: openinfra-bucket-ownership } }
                        initContainers:
                          # `mc` (offline copy) mints the scoped per-app user/policy (#151 fault 3);
                          # the rich bucket config below still uses the aws CLI.
                          - name: fetch-mc
                            image: ghcr.io/harn3ss/open-infra-mc@sha256:a689825d5299d02e6f35973e726a6e49a77469cde644dd52d60586b07bd85744
                            command: [sh, -c, "cp /usr/bin/mc /mc/mc && chmod +x /mc/mc"]
                            volumeMounts: [{ name: mc, mountPath: /mc }]
                        containers:
                          - name: setup
                            image: alpine/k8s:1.30.0
                            volumeMounts: [{ name: mc, mountPath: /mc }, { name: ownership, mountPath: /opt/openinfra, readOnly: true }]
                            env:
                              # Root provisions ONLY (create/configure the bucket + mint the scoped
                              # user); it is never written into the claim's secret (#151 fault 3).
                              - name: AWS_ACCESS_KEY_ID
                                valueFrom: { secretKeyRef: { name: minio, key: rootUser } }
                              - name: AWS_SECRET_ACCESS_KEY
                                valueFrom: { secretKeyRef: { name: minio, key: rootPassword } }
                              - name: AWS_DEFAULT_REGION
                                value: us-east-1
                              - { name: OWNER_NS, value: {{ $ns | quote }} }
                              - { name: OWNER_REF, value: {{ $owner | quote }} }
                              - { name: XR_CREATED, value: {{ .observed.composite.resource.metadata.creationTimestamp | default "" | quote }} }
                              # Tenant-supplied documents travel as env values, never inside the script.
                              - { name: LIFECYCLE_JSON, value: {{ $lifecycle | toJson }} }
                              - { name: LOCK_JSON, value: {{ $lockJson | toJson }} }
                              - { name: BUCKET_POLICY, value: {{ $policy | toJson }} }
                              {{- if $tagging }}
                              - { name: BUCKET_TAGGING, value: {{ $tagging | toJson }} }
                              {{- end }}
                              # The platform's default encryption, once it is on (storage/minio-kms.yaml).
                              - name: OBJECT_ENCRYPTION_DEFAULT
                                valueFrom: { configMapKeyRef: { name: openinfra-object-encryption, key: default, optional: true } }
                            command: ["/bin/sh", "-c"]
                            args:
                              - |
                                set -e
                                E=http://minio.minio.svc.cluster.local:9000
                                # The bucket must be this namespace's (or new) before anything below runs.
                                . /opt/openinfra/bucket-ownership.sh
                                claim_bucket {{ $bucket }}
                                # Create idempotently but FAIL LOUD: an already-existing bucket is fine (claim_bucket
                                # has checked it is this namespace's), any other error (bad/rotated root creds, server unreachable, quota) fails
                                # the job so the claim goes NotReady with the reason — never a false green
                                # that only surfaces later as NoSuchBucket in the app's own logs (#151).
                                {{- if $lockJson }}
                                # Object Lock must be enabled AT creation (it auto-enables versioning); can't be added later.
                                created=0
                                if out=$(aws --endpoint-url $E s3api create-bucket --bucket {{ $bucket }} --object-lock-enabled-for-bucket 2>&1); then
                                  created=1
                                  echo "created bucket {{ $bucket }}"
                                else
                                  case "$out" in
                                    *BucketAlreadyOwnedByYou*|*BucketAlreadyExists*) echo "bucket {{ $bucket }} already exists" ;;
                                    *) echo "create-bucket failed for {{ $bucket }}: $out" >&2; exit 1 ;;
                                  esac
                                fi
                                aws --endpoint-url $E s3api put-object-lock-configuration --bucket {{ $bucket }} --object-lock-configuration "$LOCK_JSON"
                                {{- else }}
                                created=0
                                if out=$(aws --endpoint-url $E s3 mb "s3://{{ $bucket }}" 2>&1); then
                                  created=1
                                  echo "created bucket {{ $bucket }}"
                                else
                                  case "$out" in
                                    *BucketAlreadyOwnedByYou*|*BucketAlreadyExists*) echo "bucket {{ $bucket }} already exists" ;;
                                    *) echo "mb failed for {{ $bucket }}: $out" >&2; exit 1 ;;
                                  esac
                                fi
                                {{- end }}
                                # Default encryption, once the platform has it on: a bucket created here, or one
                                # still empty with none (a retried setup). One that holds objects is left as is.
                                if [ -n "${OBJECT_ENCRYPTION_DEFAULT:-}" ]; then
                                  [ "$OBJECT_ENCRYPTION_DEFAULT" = AES256 ] || { echo "unsupported default encryption: $OBJECT_ENCRYPTION_DEFAULT" >&2; exit 1; }
                                  if [ "$created" = 0 ] && ! aws --endpoint-url $E s3api get-bucket-encryption --bucket {{ $bucket }} >/dev/null 2>&1; then
                                    lv=$(aws --endpoint-url $E s3api list-object-versions --bucket {{ $bucket }} --max-items 1 --output json 2>&1) \
                                      || { echo "list-object-versions failed for {{ $bucket }}: $lv" >&2; exit 1; }
                                    [ "$(printf '%s' "$lv" | jq -s '(.[0] // {}) | ((.Versions // []) + (.DeleteMarkers // [])) | length')" = 0 ] && created=1
                                  fi
                                  if [ "$created" = 1 ]; then
                                    aws --endpoint-url $E s3api put-bucket-encryption --bucket {{ $bucket }} \
                                      --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
                                    echo "default encryption (AES256) set on bucket {{ $bucket }}"
                                  fi
                                fi
                                {{- if $spec.versioning }}
                                aws --endpoint-url $E s3api put-bucket-versioning --bucket {{ $bucket }} --versioning-configuration Status=Enabled
                                {{- end }}
                                {{- if $rules }}
                                aws --endpoint-url $E s3api put-bucket-lifecycle-configuration --bucket {{ $bucket }} --lifecycle-configuration "$LIFECYCLE_JSON"
                                {{- end }}
                                {{- if $policy }}
                                # Bucket policy applied verbatim. MinIO stores it via put-bucket-policy, but only `*`
                                # (public) principals resolve — AWS-IAM-ARN principals name identities MinIO can't map.
                                aws --endpoint-url $E s3api put-bucket-policy --bucket {{ $bucket }} --policy "$BUCKET_POLICY"
                                {{- end }}
                                {{- if $tagging }}
                                aws --endpoint-url $E s3api put-bucket-tagging --bucket {{ $bucket }} --tagging "$BUCKET_TAGGING"
                                {{- end }}
                                # Mint a PER-APP, NON-root user scoped to ONLY this bucket (#151 fault 3). Its key
                                # lives in a platform-side Secret (openinfra-bucket-creds/<user>) — this Job never
                                # writes into the claim namespace (so its SA needs no cluster-wide secret access).
                                # A provider Object below copies the key into {{ $name }}-minio and GCs it with the claim.
                                MC=/mc/mc
                                "$MC" alias set m "$E" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" >/dev/null
                                APPUSER="{{ $appUser }}"
                                printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::{{ $bucket }}","arn:aws:s3:::{{ $bucket }}/*"]}]}' > /tmp/pol.json
                                mint_scoped_user "$APPUSER" /tmp/pol.json
            {{- /* Credential delivery (scoped SA model): the scoped key lives in a platform Secret
                   (openinfra-bucket-creds/{{ $appUser }}). Observe it; once it exists, copy MINIO_SECRET_KEY
                   into the claim's {{ $name }}-minio Secret as a composed, GC'd resource. Until it exists
                   (a legacy claim awaiting migration, or a brand-new claim whose setup Job has not run yet)
                   render no copy — the readiness gate below Observes the claim Secret, so a legacy claim whose
                   Secret already exists stays Ready and a new one reports NotReady until its creds land. */}}
            {{- $pcreds := index (.observed.resources | default dict) "bucket-pcreds" }}
            {{- $pexists := false }}
            {{- if $pcreds }}{{- with $pcreds.resource.status }}{{- with .atProvider }}{{- with .manifest }}{{- with .metadata }}{{- if .uid }}{{- $pexists = true }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}
            ---
            # Observe the platform-side scoped-credentials Secret (written by the setup Job above).
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-pcreds
                # Observing the platform-side creds must not hold the claim NotReady: a claim from before the
                # scoped-creds model has none until its migration seeds one (its old Secret keeps it working).
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              managementPolicies: ["Observe"]
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata: { name: {{ $appUser }}, namespace: openinfra-bucket-creds }
            {{- if $pexists }}
            ---
            # The claim's scoped creds: non-secret fields rendered here, the secret key copied from the
            # platform Secret via patchesFrom. A composed resource, so it is deleted with the claim
            # (fixing the leftover <name>-minio Secrets) and never written cross-namespace by the Job's SA.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-creds
            spec:
              references:
                - patchesFrom:
                    apiVersion: v1
                    kind: Secret
                    namespace: openinfra-bucket-creds
                    name: {{ $appUser }}
                    fieldPath: data.MINIO_SECRET_KEY
                  toFieldPath: data.MINIO_SECRET_KEY
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  type: Opaque
                  metadata: { name: {{ $name }}-minio, namespace: {{ $ns }} }
                  stringData:
                    MINIO_ENDPOINT: http://minio.minio.svc.cluster.local:9000
                    MINIO_BUCKET: {{ $bucket }}
                    MINIO_ACCESS_KEY: {{ $appUser }}
            {{- end }}
            ---
            # Readiness gate (#165 part 3): the claim is Ready only once the setup Job has SUCCEEDED,
            # not merely once the Object was applied. The durable success signal is the per-bucket creds
            # Secret the Job writes on success (it persists, unlike the ttl-GC'd Job — so no readiness
            # flip-flop, and an already-provisioned bucket whose Secret exists stays Ready). This Observe
            # Object is Ready (DeriveFromCelQuery) only when that Secret exists; function-auto-ready then
            # gates the XR on it. A failed/blocked setup (bad creds, registry unreachable, quota) leaves
            # no Secret → the claim honestly reports NotReady instead of a false green.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-ready-gate
            spec:
              managementPolicies: ["Observe"]
              readiness: { policy: DeriveFromCelQuery, celQuery: "object.metadata.uid != ''" }
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata: { name: {{ $name }}-minio, namespace: {{ $ns }} }
            ---
            apiVersion: openinfra.dev/v1
            kind: XBucket
            status:
              {{- /* status.ready is what CloudFormation's deploy waits on: true only once the setup has
                     delivered the claim's credentials Secret, i.e. after the bucket exists. */}}
              {{- $gate := index (.observed.resources | default dict) "bucket-ready-gate" }}
              {{- $gateReady := false }}
              {{- if $gate }}{{- with $gate.resource.status }}{{- with .atProvider }}{{- with .manifest }}{{- with .metadata }}{{- if .uid }}{{- $gateReady = true }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}
              ready: {{ $gateReady }}
              bucket: {{ $bucket | quote }}
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
