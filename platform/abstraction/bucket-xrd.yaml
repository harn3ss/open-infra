# kind: Bucket — a standalone S3-compatible object store (MinIO), the object-storage analog of
# kind: Volume. One claim -> a MinIO bucket + per-bucket credentials (a <name>-minio Secret in the
# claim namespace: MINIO_ENDPOINT / MINIO_BUCKET / MINIO_ACCESS_KEY / MINIO_SECRET_KEY), with
# optional object VERSIONING and LIFECYCLE (expiration) rules.
#
# Use it for object storage that isn't tied to one workload (a data lake, a shared asset store); an
# app that owns its bucket can still declare it inline via an Application's storage.buckets. This is
# the CFN engine's AWS::S3::Bucket target — a dedicated kind, so a bucket with versioning/lifecycle
# maps rather than riding an empty data-only Application.
#
# NOT modelled here: server-side encryption (that is the opt-in objectEncryption stack — SSE-KMS via
# KES->Vault, applied at the MinIO-tenant level, see docs/object-encryption.md), website hosting,
# replication, and CORS. Per-bucket CORS is a documented MinIO ceiling: MinIO rejects the S3
# PutBucketCors call (MalformedXML) and does CORS globally via MINIO_API_CORS_ALLOW_ORIGIN, not per
# bucket. Object Lock and bucket POLICIES are modelled (objectLock / policy below).
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xbuckets.openinfra.dev
  annotations:
    openinfra.dev/chaos-role: "none"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names: { kind: XBucket, plural: xbuckets }
  claimNames: { kind: Bucket, plural: buckets }
  defaultCompositionRef: { name: bucket }
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                bucketName:
                  type: string
                  description: "The S3 bucket name. Defaults to the claim name. DNS-compatible (lowercase letters, digits, hyphens), 3-63 chars. Immutable."
                  pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
                versioning:
                  type: boolean
                  default: false
                  description: "Keep prior versions of overwritten/deleted objects (S3 bucket versioning)."
                lifecycleRules:
                  type: array
                  description: "Object lifecycle (expiration) rules — MinIO applies them in the background."
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string, description: "Rule id (unique within the bucket)." }
                      prefix: { type: string, description: "Apply only to object keys under this prefix. Empty = the whole bucket." }
                      expireDays:
                        type: integer
                        description: "Delete current-version objects this many days after creation."
                      noncurrentExpireDays:
                        type: integer
                        description: "Delete non-current (prior) versions this many days after they become non-current. Pairs with versioning."
                objectLock:
                  type: object
                  description: >-
                    WORM retention (S3 Object Lock), enforced by MinIO. Set only at creation and
                    auto-enables versioning. In COMPLIANCE mode not even an admin can delete or
                    shorten a locked object's retention until it expires — the WORM guarantee the
                    audit store already relies on.
                  required: [mode]
                  properties:
                    mode:
                      type: string
                      enum: [GOVERNANCE, COMPLIANCE]
                      description: "GOVERNANCE (privileged users can override) or COMPLIANCE (no one can, until expiry)."
                    days:
                      type: integer
                      description: "Default retention period in days (mutually exclusive with years)."
                    years:
                      type: integer
                      description: "Default retention period in years (mutually exclusive with days)."
                policy:
                  type: string
                  description: >-
                    An S3/MinIO bucket-policy JSON document applied verbatim via put-bucket-policy.
                    Principals must be `*` (public); AWS-IAM-ARN principals do not resolve on MinIO.
            status:
              type: object
              properties:
                bucket: { type: string }
                ready: { type: boolean }
