# Crossplane — the engine that compiles one Application claim into many resources.
# Installs Crossplane + the providers/functions the Composition needs. The XRD and
# Composition themselves live in abstraction/config/ and are synced by
# openinfra-config.yaml (after the CRDs from this app exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 1.17.1
    helm:
      values: |
        # Single replica (below), so leader election buys nothing — and at full-estate scale it became
        # actively harmful: a slow API (reconcile storm over ~2,030 XRs) made the LE lease renewal time out,
        # crossplane lost the lease and crashed, each restart did a full resync that hammered the API harder
        # — a self-amplifying crashloop that froze convergence (2026-10-24). Disable it for the single replica.
        leaderElection: false
        provider:
          packages:
            # Lets the Composition create arbitrary k8s objects (Deployment, CNPG
            # Cluster, etc.) and Helm releases inside the cluster.
            - xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.14.1
        function:
          packages:
            - xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.7.0
            - xpkg.upbound.io/crossplane-contrib/function-go-templating:v0.6.0
            - xpkg.upbound.io/crossplane-contrib/function-auto-ready:v0.4.0
            # Loads the openinfra-platform EnvironmentConfig into the pipeline .context so
            # compositions can read the per-cluster image arch suffix (amd64="" / arm64="-arm64").
            - xpkg.upbound.io/crossplane-contrib/function-environment-configs:v0.2.0
        # Restricted-PSA-conformant securityContext for the core + rbac-manager pods
        # (#34). The chart default sets runAsUser/APE/roRootfs but omits capabilities.drop
        # and seccompProfile, so these pods fail a restricted PodSecurity namespace; add
        # them here. (Provider/function pods are hardened separately — see
        # platform/overlays/restricted-psa/crossplane-provider-runtimeconfig.yaml.)
        securityContextCrossplane:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop: [ALL]
        podSecurityContextCrossplane:
          seccompProfile:
            type: RuntimeDefault
        securityContextRBACManager:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop: [ALL]
        podSecurityContextRBACManager:
          seccompProfile:
            type: RuntimeDefault
        # Full-estate sizing (2026-10-24): the core pod OOMKilled at the 1Gi chart default once the
        # otf full-estate fill landed (~2,030 Function XRs + their composed objects held in the informer
        # cache), crashlooping (r85+) and stalling ALL reconciliation — functions stuck NotReady, statuses
        # stale. Observed ~2.1Gi steady at full estate; set 4Gi with headroom. rbac-manager bumped too
        # (it was flapping). A live patch is futile here — selfHeal reverts it — so this lives in GitOps.
        resourcesCrossplane:
          limits: { cpu: "1", memory: 4Gi }
          requests: { cpu: 100m, memory: 1Gi }
        resourcesRBACManager:
          limits: { cpu: 500m, memory: 1Gi }
          requests: { cpu: 100m, memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
