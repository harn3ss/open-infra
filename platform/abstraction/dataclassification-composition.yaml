# The compiler for kind: DataClassification. One DataClassification becomes a ConfigMap mirror in
# the console namespace holding the level + handling requirements, so the compliance auditor and the
# console read the taxonomy cheaply (a labelled ConfigMap list) without needing CRD access, and there
# is a concrete cluster artifact proving the class exists. The XR status echoes the level.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: dataclassification
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XDataClassification
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $req := $spec.requires | default dict }}
            ---
            # The taxonomy mirror the auditor reads (label-selected). Booleans/ints are stringified
            # (ConfigMap data is string-valued); the auditor parses them back.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: dataclass-configmap
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: openinfra-dataclass-{{ $name }}
                    namespace: open-infra-console
                    labels:
                      openinfra.dev/dataclass: {{ $name }}
                  data:
                    level: "{{ $spec.level }}"
                    description: {{ $spec.description | default "" | quote }}
                    encryptionAtRest: "{{ $req.encryptionAtRest | default false }}"
                    networkRestricted: "{{ $req.networkRestricted | default false }}"
                    noPublicExposure: "{{ $req.noPublicExposure | default false }}"
                    backup: "{{ $req.backup | default false }}"
                    residencyNodeLabel: "{{ $req.residencyNodeLabel | default "" }}"
                    retentionDays: "{{ $req.retentionDays | default 0 }}"
            ---
            apiVersion: openinfra.dev/v1
            kind: XDataClassification
            status:
              ready: true
              level: "{{ $spec.level }}"
