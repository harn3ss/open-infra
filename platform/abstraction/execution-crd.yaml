# kind: Execution — one run of a kind: StateMachine (the analogue of an AWS Step
# Functions execution). Creating an Execution is "StartExecution": the state
# machine's per-machine controller picks it up, runs the workflow against
# spec.input, and checkpoints progress into status (durable across a controller
# restart — a Running execution resumes from status.currentState). This is a plain
# CRD, not a Crossplane claim: an execution is a runtime object, not declared
# infrastructure, so it is deliberately absent from the Terraform provider (you
# start executions from the console or kubectl, exactly as AWS starts them from the
# API rather than from Terraform).
#
# Synced before the controller RBAC that references it (sync-wave 1).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: executions.openinfra.dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: openinfra.dev
  scope: Namespaced
  names:
    kind: Execution
    plural: executions
    singular: execution
    shortNames: [exec]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [stateMachineRef]
              properties:
                stateMachineRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      description: "Name of the kind: StateMachine to run (same namespace)."
                input:
                  type: string
                  description: >-
                    The execution input as a JSON string (passed to StartAt). Defaults to
                    "{}". A string keeps arbitrary JSON expressible without a fixed schema —
                    the console sends jsonencode(...) here.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                  description: "Running | Succeeded | Failed | TimedOut"
                output:
                  type: string
                  description: "The final output as a JSON string (on Succeeded)."
                error:
                  type: string
                  description: "The error name on a failed execution (e.g. States.TaskFailed)."
                cause:
                  type: string
                  description: "Human-readable failure detail."
                currentState:
                  type: string
                  description: "The state the execution is at (checkpoint for durable resume)."
                startedAt: { type: string }
                stoppedAt: { type: string }
                # history[] and the running data context are carried under status too, but
                # are free-form (x-kubernetes-preserve-unknown-fields above) so the engine can
                # evolve the checkpoint shape without a CRD bump.
      additionalPrinterColumns:
        - name: StateMachine
          type: string
          jsonPath: .spec.stateMachineRef.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: State
          type: string
          jsonPath: .status.currentState
        - name: Started
          type: string
          jsonPath: .status.startedAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
