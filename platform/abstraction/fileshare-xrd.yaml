# open-infra's "FSx for Windows File Server": kind: FileShare — a managed SMB
# share backed by Longhorn that VMs (and desktops) mount as a network drive
# (Windows: net use; Linux: mount -t cifs). One claim -> a Samba server, a LAN
# endpoint, and a connection secret (USERNAME/PASSWORD/SHARE/HOST). NFS export for
# Linux-native access is a planned addition.
# KEEP THIS SCHEMA STABLE — it is part of the product's contract.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xfileshares.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "fileshare"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names:
    kind: XFileShare
    plural: xfileshares
  claimNames:
    kind: FileShare    # what users write
    plural: fileshares
  defaultCompositionRef:
    name: fileshare
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [size]
              properties:
                storageClass:
                  type: string
                  description: "StorageClass for this resource's persistent volumes. Defaults to 'longhorn'. Set to your cluster's StorageClass on substrates that do not ship Longhorn (e.g. RKE2 with local-path)."
                size:
                  type: string
                  description: "Share capacity, e.g. 100Gi (Longhorn-backed)."
                expose:
                  type: boolean
                  default: true
                  description: "Get a LAN IP (SMB 445) so VMs/desktops can mount it. On by default — a share you can't reach isn't useful."
                nodeIP:
                  type: string
                  pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$'
                  description: "Deprecated and ignored. It used to add this address to the share's Service externalIPs so masquerade-networked VMs could mount it on a node IP; VMs reach the share's ClusterIP directly now, and the platform refuses Service externalIPs (a tenant-chosen external IP can capture traffic meant for any address, CVE-2020-8554). Mount \\\\<Service address>\\<name> from a VM in the share's namespace, or the LAN IP when exposed."
            status:
              type: object
              properties:
                share: { type: string, description: "Name of the exported SMB share (equals the FileShare name); clients mount it as //<host>/<share>." }
                ready: { type: boolean, description: "True once the share is provisioned and ready to mount (Samba server, Service, and connection secret are up)." }
