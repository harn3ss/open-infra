# The compiler for kind: Function -> a Knative Service (scale-to-zero HTTP), plus
# the same on-demand managed services as kind: Application (DB / bucket / queue /
# secret injection). Knative handles the Service, ingress route, and request-driven
# autoscaling (0..N..0); we just declare the container + scaling + optional GPU.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: function
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XFunction
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- $scaling := $spec.scaling | default dict }}
            {{- $gpu := $spec.gpu | default 0 }}
            {{- /* expose defaults true; hasKey check (Sprig default treats false
                   as empty). false -> cluster-local (in-cluster only). */}}
            {{- $expose := true }}{{- if hasKey $spec "expose" }}{{- $expose = $spec.expose }}{{- end }}
            {{- $envCfg := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $arch := index $envCfg "imageArchSuffix" | default "" }}
            {{- /* image | code: EXACTLY one. code => run a handler on a managed runtime base image. */}}
            {{- $code := $spec.code }}
            {{- if and (not $spec.image) (not $code) }}{{- fail "Lambda function: specify a container image (ImageUri) or a deployment package (Code); neither is set (image / code)" }}{{- end }}
            {{- if and $spec.image $code }}{{- fail "Lambda function: specify a container image (ImageUri) or a deployment package (Code), not both (image / code)" }}{{- end }}
            {{- $img := $spec.image }}
            {{- $csrc := dict }}
            {{- $unsupported := false }}
            {{- if $code }}
            {{-   $csrc = $code.source | default dict }}
            {{-   if $code.runtimeImage }}
            {{- /* ESCAPE HATCH: a BYO base image for a runtime we don't vouch for (EOL/other). Fails
                   closed — requires unsupportedRuntime, then the service is marked/isolated/asleep below. */}}
            {{-     if $code.runtime }}{{- fail "Lambda function: specify a managed runtime (Runtime) or a custom runtime image, not both (code.runtime / code.runtimeImage)" }}{{- end }}
            {{-     if not ($code.unsupportedRuntime | default false) }}{{- fail "Lambda function: a custom runtime image is unsupported and not for production, so it must be accepted as such (code.unsupportedRuntime: true)" }}{{- end }}
            {{-     $img = $code.runtimeImage }}{{- $unsupported = true }}
            {{-   else if eq $code.runtime "python3.12" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-python:latest%s" $arch }}{{- else if eq $code.runtime "python3.13" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-python313:latest%s" $arch }}{{- else if eq $code.runtime "nodejs20" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-nodejs:latest%s" $arch }}{{- else if eq $code.runtime "nodejs22" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-nodejs22:latest%s" $arch }}{{- else if eq $code.runtime "nodejs24" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-nodejs24:latest%s" $arch }}{{- else if eq $code.runtime "nodejs16" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-nodejs16:latest%s" $arch }}{{- else if eq $code.runtime "nodejs18" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-nodejs18:latest%s" $arch }}{{- else if eq $code.runtime "python3.8" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-python38:latest%s" $arch }}{{- else if eq $code.runtime "python3.9" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-python39:latest%s" $arch }}{{- else if eq $code.runtime "python3.10" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-python310:latest%s" $arch }}{{- else if eq $code.runtime "python3.11" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-python311:latest%s" $arch }}{{- else if eq $code.runtime "python3.14" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-python314:latest%s" $arch }}{{- else if eq $code.runtime "dotnet8" }}{{- $img = printf "ghcr.io/harn3ss/open-infra-lambda-dotnet:latest%s" $arch }}{{- else }}{{- fail (printf "kind: Function spec.code: set runtime (a supported enum value) or runtimeImage (BYO, unsupported); got runtime=%q" ($code.runtime | default "")) }}{{- end }}
            {{-   $nsrc := 0 }}{{- if $csrc.bucket }}{{- $nsrc = add $nsrc 1 }}{{- end }}{{- if $csrc.configMap }}{{- $nsrc = add $nsrc 1 }}{{- end }}{{- if $csrc.package }}{{- $nsrc = add $nsrc 1 }}{{- end }}
            {{-   if gt (int $nsrc) 1 }}{{- fail "Lambda function: the deployment package is inline code (ZipFile), an S3 object (S3Bucket and S3Key) or a stored package, only one of them (code.source)" }}{{- end }}
            {{-   if eq (int $nsrc) 0 }}{{- fail "Lambda function: the deployment package needs inline code (ZipFile) or an S3 object (S3Bucket and S3Key) (code.source)" }}{{- end }}
            {{-   if and $csrc.package $csrc.secret }}{{- fail "Lambda function: a stored deployment package is fetched with the function's own identity, never with keys (code.source.package / code.source.secret)" }}{{- end }}
            {{- /* Layers are .zip artifacts fetched with the handler's S3 creds, so they require a bucket source. */}}
            {{-   if and $code.layers (not (and $csrc.bucket $csrc.secret)) }}{{- fail "Lambda function: layers need the deployment package in S3, with credentials to read it (code.source.bucket and code.source.secret)" }}{{- end }}
            {{- end }}
            {{- /* Burstable admission (the Lambda memory model). Default false = today's Guaranteed QoS
                   (request == limit == memory). true: request = a per-runtime floor, limit = memory, so a
                   warm/idle pod reserves the floor not the full ceiling (a single invocation still bursts to
                   limit). Burstable also runs the function strictly one-request-per-instance and in the
                   low-priority openinfra-function class. See docs/function-admission.md. Fails closed:
                   burstable needs spec.memory (the ceiling). Floors are UNMEASURED 128Mi placeholders — set
                   per-runtime from measurement, or per-function via spec.memoryRequest. */}}
            {{- $burst := $spec.burstable | default false }}
            {{- $rt := "" }}{{- if $code }}{{- $rt = ($code.runtime | default "") }}{{- end }}
            {{- $floors := dict "python3.12" "128Mi" "python3.13" "128Mi" "nodejs20" "128Mi" "nodejs22" "128Mi" "nodejs24" "128Mi" "nodejs16" "128Mi" "nodejs18" "128Mi" "python3.8" "128Mi" "python3.9" "128Mi" "python3.10" "128Mi" "python3.11" "128Mi" "python3.14" "128Mi" "dotnet8" "128Mi" }}
            {{- $memReq := "" }}
            {{- if $burst }}
            {{-   if not $spec.memory }}{{- fail "Lambda function: burstable memory needs a memory size (MemorySize): the runtime's floor is reserved and the memory size is the limit (burstable / memory)" }}{{- end }}
            {{-   $memReq = $spec.memoryRequest | default (index $floors $rt) | default "128Mi" }}
            {{- end }}
            {{- /* Execution role (spec.role, Lambda's Role). The function's pods run as their own
                   ServiceAccount, fn-<name>, with a projected token the AWS SDK exchanges for the role's
                   temporary credentials (sts:AssumeRoleWithWebIdentity on the aws-shim) — no static keys.
                   The aws-shim mints them only for a pod Knative runs for this function as that
                   ServiceAccount, and only for the role this claim names (a role trusting
                   lambda.amazonaws.com) or one whose trust names the ServiceAccount itself. AWS_ROLE_ARN is
                   the role's ARN in the function's account: an ARN as given, a name in the account of the
                   function's namespace (its kind: Account, else the install's own — the
                   openinfra-aws-identity EnvironmentConfig), both read as extra resources. Unset, nothing
                   below renders and the function renders exactly as before. */}}
            {{- $role := $spec.role | default "" }}
            {{- /* A stored deployment package (code.source.package, Lambda's COPY storage: what CloudFormation's
                   Code.ZipFile or Code.S3Bucket/S3Key becomes) is fetched at cold start from the aws-shim with
                   the function's own identity, the same ServiceAccount and token an execution role uses: the
                   shim hands a pod only its own function's package. So either one gives the function its
                   identity ($ident). */}}
            {{- $pkg := $csrc.package | default dict }}
            {{- $ident := or $role $pkg.sha256 }}
            {{- $fnSA := printf "fn-%s" $name }}
            {{- $roleArn := "" }}
            {{- $fnRegion := "us-east-1" }}
            {{- $shimEndpoint := "http://aws-shim.open-infra-aws-shim.svc.cluster.local:4566" }}
            {{- if $role }}
            {{-   if $csrc.secret }}{{- fail "Lambda function: an execution role (Role) can't be combined with a deployment package read with static keys (code.source.secret): the handler's AWS SDK would act with those keys instead of the role's credentials — use an image or inline code (code.source.configMap) with a role" }}{{- end }}
            {{-   $xres := .extraResources | default dict }}
            {{-   $fnAcct := "000000000000" }}
            {{-   range $i := (((index $xres "aws-identity") | default dict).items | default list) }}
            {{-     $d := $i.resource.data | default dict }}
            {{-     $fnAcct = (index $d "awsAccountId") | default $fnAcct }}
            {{-     $fnRegion = (index $d "awsRegion") | default $fnRegion }}
            {{-   end }}
            {{-   range $a := (((index $xres "accounts") | default dict).items | default list) }}
            {{-     $as := $a.resource.spec | default dict }}
            {{-     if has $ns ($as.namespaces | default list) }}{{- $fnAcct = $as.accountId }}{{- end }}
            {{-   end }}
            {{-   if hasPrefix "arn:" $role }}
            {{-     $roleArn = $role }}
            {{-     $arnAcct := index (splitList ":" $role) 4 }}
            {{-     if and (hasKey $xres "aws-identity") (ne $arnAcct $fnAcct) }}{{- fail (printf "Lambda function: the execution role (Role) %s is a role of account %s; a function's role must be a role of its own account (%s)" $role $arnAcct $fnAcct) }}{{- end }}
            {{-   else }}
            {{-     $roleArn = printf "arn:aws:iam::%s:role/%s" $fnAcct $role }}
            {{-   end }}
            {{- end }}
            {{- /* Published versions (Lambda versions) whose revision is known: each is kept and addressable
                   as a Knative traffic tag at 0% (v<version>-<function>), so the function's own traffic stays
                   100% on its latest revision ($LATEST), as on Lambda. Aliases are resolved by the aws-shim. */}}
            {{- $pinned := list }}
            {{- range $v := ($spec.versions | default list) }}{{ if $v.revision }}{{ $pinned = append $pinned $v }}{{ end }}{{ end }}
            {{- /* Unsupported (BYO) runtime: fail closed into an isolated posture — cluster-local (expose
                   off), min-scale 0 and non-production label on the Service below, and egress-denied here. */}}
            {{- if $unsupported }}{{- $expose = false }}{{- end }}
            {{- if and $unsupported (not ($code.allowEgress | default false)) }}
            ---
            # Egress-denied: an unsupported-runtime fixture may reach in-cluster destinations (its code
            # bucket, DNS, the harness that invokes it) but not the LAN or the internet.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: function-eol-netpol
            spec:
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata: { name: {{ $name }}-eol-egress, namespace: {{ $ns }} }
                  spec:
                    podSelector: { matchLabels: { serving.knative.dev/service: {{ $name }} } }
                    policyTypes: [Egress]
                    egress:
                      - to: [ { namespaceSelector: {} } ]   # in-cluster pods/services only; external denied
            {{- end }}
            ---
            # --- Knative Service: the scale-to-zero "Function" ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: function
            spec:
              # Derive readiness from the Knative Service's own Ready condition, NOT the provider default
              # (ready as soon as the Object is CREATED). A revision that fails to come up — crash-looping
              # user container, unloadable handler, bad image — leaves the ksvc Ready=False, so the XR/claim
              # now report NotReady instead of a silently-healthy claim over a broken function. (A scale-to-
              # zero function that only crashes on first activation can still read Ready until then — that
              # residual cold-start case is caught at emit time, not here.)
              readiness:
                policy: DeriveFromCelQuery
                celQuery: has(object.status) && has(object.status.conditions) && object.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
              forProvider:
                manifest:
                  apiVersion: serving.knative.dev/v1
                  kind: Service
                  metadata:
                    name: {{ $name }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/name: {{ $name }}
                      {{- if $unsupported }}
                      # Unsupported/EOL runtime kept only as a comparison fixture — never production.
                      openinfra.dev/non-production: "true"
                      {{- end }}
                      {{- if not $expose }}
                      # Private: only reachable from inside the cluster.
                      networking.knative.dev/visibility: cluster-local
                      {{- end }}
                  spec:
                    template:
                      metadata:
                        annotations:
                          # KPA scaling: min 0 = scale to zero when idle.
                          autoscaling.knative.dev/min-scale: "{{ if $unsupported }}0{{ else }}{{ $scaling.min | default 0 }}{{ end }}"
                          {{- if $spec.reservedConcurrency }}
                          # Reserved concurrency (AWS Lambda analog): a HARD cap on concurrent requests.
                          # One request per instance (containerConcurrency 1 below) + at most this many
                          # instances = at most this many concurrent executions. Overrides scaling.max/target.
                          autoscaling.knative.dev/max-scale: "{{ $spec.reservedConcurrency }}"
                          autoscaling.knative.dev/target: "1"
                          {{- else if $burst }}
                          # Burstable / Lambda admission model: one request per instance (containerConcurrency
                          # 1 below), per-function ceiling = scaling.max (the reserved-concurrency analog). The
                          # ACCOUNT total is capped by a per-tenant quota (docs/function-admission.md).
                          autoscaling.knative.dev/max-scale: "{{ $scaling.max | default 10 }}"
                          autoscaling.knative.dev/target: "1"
                          {{- else }}
                          autoscaling.knative.dev/max-scale: "{{ $scaling.max | default 10 }}"
                          autoscaling.knative.dev/target: "{{ $scaling.target | default 100 }}"
                          {{- end }}
                          {{- if $burst }}
                          # Queue-proxy sidecar sizing (honored only with config-features
                          # queueproxy.resource-defaults: enabled, set in platform/serverless/knative-serving.yaml):
                          # give the sidecar an explicit small request + limit so the pod's reservation is the
                          # function floor plus a KNOWN sidecar cost, and so a per-tenant requests.memory quota
                          # (which requires every in-scope container to declare a memory request) never rejects
                          # the pod for a request-less sidecar. Inert on non-burstable revisions (no annotation).
                          queue.sidecar.serving.knative.dev/cpu-resource-request: "25m"
                          queue.sidecar.serving.knative.dev/memory-resource-request: "32Mi"
                          queue.sidecar.serving.knative.dev/memory-resource-limit: "64Mi"
                          {{- end }}
                        {{- if $spec.securityGroups }}
                        # SecurityGroup membership: attached SGs' NetworkPolicies select these labels.
                        labels:
                          {{- range $sg := $spec.securityGroups }}
                          openinfra.dev/sg-{{ $sg }}: ""
                          {{- end }}
                        {{- end }}
                      spec:
                        {{- if or $spec.reservedConcurrency $burst }}
                        # One request per instance (Lambda's 1-per-sandbox model): set by reservedConcurrency
                        # (hard per-function cap) OR burstable (so a running pod == one in-flight request ==
                        # the "concurrent executions" unit the per-tenant concurrency quota counts).
                        containerConcurrency: 1
                        {{- end }}
                        {{- if $spec.timeout }}
                        # Max wall-clock per request (Knative revision timeout) — the AWS Lambda timeout knob.
                        timeoutSeconds: {{ $spec.timeout }}
                        # Max time to the FIRST byte from the handler. Knative defaults this to 300s (its default
                        # revision timeout), independently of timeoutSeconds — so a quiet-but-working request (a
                        # long report, a batch read, a slow migration step) is silently cut at 300s even when the
                        # declared timeout is higher. This is a SECOND 300s boundary, separate from the gateway's
                        # idle timeout; raising only the gateway does not move it. Couple it to the declared
                        # timeout so the function has ONE deadline — its own — honoured end to end. The Knative
                        # webhook requires responseStartTimeoutSeconds <= timeoutSeconds, so they are set equal.
                        responseStartTimeoutSeconds: {{ $spec.timeout }}
                        {{- end }}
                        {{- if gt (int $gpu) 0 }}
                        runtimeClassName: nvidia
                        nodeSelector: { openinfra.dev/gpu: "true" }
                        {{- end }}
                        {{- if $burst }}
                        # Burstable function pods are overcommitted, so they must lose first under node memory
                        # pressure — not MinIO, databases, or the control plane (which stay Guaranteed and
                        # higher-priority). openinfra-function is below default workloads and non-preempting, so
                        # scheduling a function never evicts anything else. See function-priorityclass.yaml.
                        priorityClassName: openinfra-function
                        {{- end }}
                        {{- if $ident }}
                        # The function runs as its own identity: its token assumes the execution role and fetches
                        # its stored deployment package.
                        serviceAccountName: {{ $fnSA }}
                        {{- end }}
                        containers:
                          - image: {{ $img | toJson }}
                            ports: [ { containerPort: {{ $spec.port | default 8080 }} } ]
                            {{- if or $code $spec.env $spec.queues $role }}
                            env:
                            {{- if $code }}
                              - { name: OPENINFRA_HANDLER, value: "{{ $code.handler }}" }
                              - { name: OPENINFRA_FUNCTION_NAME, value: "{{ $name }}" }
                              {{- if $csrc.bucket }}
                              - { name: OPENINFRA_CODE_BUCKET, value: "{{ $csrc.bucket }}" }
                              - { name: OPENINFRA_CODE_KEY, value: "{{ $csrc.key }}" }
                              {{- end }}
                              {{- if $code.layers }}
                              - { name: OPENINFRA_LAYERS, value: {{ $code.layers | toJson | quote }} }
                              {{- end }}
                              # AWS Lambda reserved runtime variables — AWS's own runtime injects these and a
                              # handler relies on them (e.g. an SDK client needs a region). They can't be set
                              # as function env because AWS reserves the names, so the runtime must inject them.
                              - { name: AWS_REGION, value: "{{ $code.region | default "us-east-1" }}" }
                              - { name: AWS_DEFAULT_REGION, value: "{{ $code.region | default "us-east-1" }}" }
                              - { name: AWS_LAMBDA_FUNCTION_NAME, value: "{{ $name }}" }
                              - { name: AWS_LAMBDA_FUNCTION_VERSION, value: "$LATEST" }
                              - { name: AWS_LAMBDA_LOG_GROUP_NAME, value: "/aws/lambda/{{ $name }}" }
                              - { name: LAMBDA_TASK_ROOT, value: "/var/task" }
                              - { name: LAMBDA_RUNTIME_DIR, value: "/var/runtime" }
                              - { name: TZ, value: "UTC" }
                              {{- if $code.runtime }}
                              - { name: AWS_EXECUTION_ENV, value: "AWS_Lambda_{{ $code.runtime }}" }
                              {{- end }}
                              # DynamoDB data plane: the aws-shim's DynamoDB endpoint (FerretDB / DocumentDB-Postgres
                              # backed). Service-scoped — AWS_ENDPOINT_URL_DYNAMODB redirects ONLY the handler's DynamoDB
                              # client; every other AWS service keeps its default resolution (a global AWS_ENDPOINT_URL
                              # would wrongly capture them all). A handler that never calls DynamoDB is unaffected.
                              - { name: AWS_ENDPOINT_URL_DYNAMODB, value: "http://aws-shim.open-infra-aws-shim.svc.cluster.local:4566" }
                              {{- if and $csrc.bucket $csrc.secret }}
                              # Code-source creds mapped EXPLICITLY (not envFrom) so the S3/MinIO endpoint is
                              # the service-scoped AWS_ENDPOINT_URL_S3, never the global AWS_ENDPOINT_URL (a
                              # global override would point every service — dynamodb, sns, … — at the S3
                              # gateway). The shim reads AWS_ENDPOINT_URL_S3 for its own code fetch.
                              - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: {{ $csrc.secret }}, key: AWS_ACCESS_KEY_ID, optional: true } } }
                              - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: {{ $csrc.secret }}, key: AWS_SECRET_ACCESS_KEY, optional: true } } }
                              - { name: AWS_ENDPOINT_URL_S3, valueFrom: { secretKeyRef: { name: {{ $csrc.secret }}, key: AWS_ENDPOINT_URL, optional: true } } }
                              {{- end }}
                              {{- if $pkg.sha256 }}
                              # The stored deployment package: the runtime fetches it from the aws-shim at cold start with
                              # the function's identity token (the shim serves a pod only its own function's package),
                              # checks its SHA-256 and unpacks it into /var/task. No keys.
                              - { name: OPENINFRA_CODE_URL, value: "{{ $shimEndpoint }}/v1/function-code" }
                              - { name: OPENINFRA_CODE_SHA256, value: {{ $pkg.sha256 | toJson }} }
                              - { name: OPENINFRA_CODE_TOKEN_FILE, value: "/var/run/secrets/openinfra/token" }
                              {{- end }}
                            {{- end }}
                            {{- if $role }}
                              # Execution role (Lambda's Role): the AWS SDK's web-identity provider reads these and
                              # calls sts:AssumeRoleWithWebIdentity on the aws-shim with the function's projected
                              # token, for the role's temporary credentials (session assumed-role/<role>/<function>,
                              # as Lambda names it). Every AWS call then goes to the aws-shim, where they are valid.
                              - { name: AWS_ROLE_ARN, value: {{ $roleArn | toJson }} }
                              - { name: AWS_ROLE_SESSION_NAME, value: "{{ $name }}" }
                              - { name: AWS_WEB_IDENTITY_TOKEN_FILE, value: "/var/run/secrets/openinfra/token" }
                              - { name: AWS_ENDPOINT_URL_STS, value: "{{ $shimEndpoint }}" }
                              - { name: AWS_ENDPOINT_URL, value: "{{ $shimEndpoint }}" }
                              {{- if not $code }}
                              # An image function's SDK needs a region too (a code function's runtime sets it above).
                              - { name: AWS_REGION, value: "{{ $fnRegion }}" }
                              - { name: AWS_DEFAULT_REGION, value: "{{ $fnRegion }}" }
                              {{- end }}
                            {{- end }}
                            {{- range $spec.env }}
                              - { name: {{ .name }}, value: "{{ .value }}" }
                            {{- end }}
                            {{- if $spec.queues }}
                              - { name: NATS_URL, value: "nats://nats.nats.svc.cluster.local:4222" }
                              - { name: OPENINFRA_QUEUES, value: "{{ join "," $spec.queues }}" }
                            {{- end }}
                            {{- end }}
                            {{- if $spec.secrets }}
                            envFrom:
                            {{- range $spec.secrets }}
                              - secretRef: { name: {{ . }}, optional: true }
                            {{- end }}
                            {{- end }}
                            {{- if or (and $code $csrc.configMap) $ident }}
                            volumeMounts:
                            {{- if and $code $csrc.configMap }}
                              - { name: openinfra-code, mountPath: /var/task, readOnly: true }
                            {{- end }}
                            {{- if $ident }}
                              - { name: openinfra-sts-token, mountPath: /var/run/secrets/openinfra, readOnly: true }
                            {{- end }}
                            {{- end }}
                            {{- if or $spec.memory (gt (int $gpu) 0) }}
                            # memory → the AWS Lambda memory knob (also the per-invocation ceiling); gpu → device limit.
                            # Default (burstable false): request == limit == memory → Guaranteed QoS, so the full
                            # configured memory is RESERVED even while the pod is warm and idle. burstable true:
                            # request = per-runtime floor ($memReq), limit = memory → Burstable QoS; the pod still
                            # bursts to the full limit for an invocation but reserves far less when warm. This is
                            # the reservation-not-use fix — see docs/function-admission.md.
                            resources:
                              {{- if $spec.memory }}
                              requests: { memory: {{ if $burst }}{{ $memReq | quote }}{{ else }}{{ $spec.memory | quote }}{{ end }} }
                              {{- end }}
                              limits:
                                {{- if $spec.memory }}
                                memory: {{ $spec.memory | quote }}
                                {{- end }}
                                {{- if gt (int $gpu) 0 }}
                                nvidia.com/gpu: {{ $gpu }}
                                {{- end }}
                            {{- end }}
                        {{- if or (and $code $csrc.configMap) $ident }}
                        volumes:
                        {{- if and $code $csrc.configMap }}
                          - name: openinfra-code
                            configMap: { name: {{ $csrc.configMap }} }
                        {{- end }}
                        {{- if $ident }}
                          # The function identity's token, for the aws-shim (its STS audience) only: the execution
                          # role's credentials and the stored deployment package.
                          - name: openinfra-sts-token
                            projected:
                              sources:
                                - serviceAccountToken:
                                    audience: sts.openinfra
                                    expirationSeconds: 3600
                                    path: token
                        {{- end }}
                        {{- end }}
                    {{- if $pinned }}
                    # Published versions: all traffic on the latest revision ($LATEST), each version kept
                    # and addressable at its tag v<version>.
                    traffic:
                      - latestRevision: true
                        percent: 100
                      {{- range $v := $pinned }}
                      - tag: {{ printf "v%s" $v.version | toJson }}
                        revisionName: {{ $v.revision | toJson }}
                        percent: 0
                      {{- end }}
                    {{- end }}
            {{- if $ident }}
            ---
            # --- Execution identity (spec.role, or a stored package): the ServiceAccount the function's pods run as. The aws-shim
            #     hands the role's credentials only to a pod Knative runs for this function as this
            #     ServiceAccount (it checks the token's pod, its serving.knative.dev/service label and this
            #     ServiceAccount's openinfra.dev/function label). No Kubernetes API token is mounted: the
            #     function needs only the STS-audience token projected above. ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: function-identity-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: {{ $fnSA }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/name: {{ $name }}
                      openinfra.dev/function: {{ $name }}
                  automountServiceAccountToken: false
            ---
            # The account the function's namespace belongs to (the kind: Account that lists it, else the
            # install's own account) and the install's region, for the role's ARN. Read-only.
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              aws-identity:
                apiVersion: apiextensions.crossplane.io/v1alpha1
                kind: EnvironmentConfig
                matchName: openinfra-aws-identity
              accounts:
                apiVersion: organizations.openinfra.dev/v1
                kind: Account
                matchLabels: {}
            {{- end }}
            {{- if $spec.trigger }}
            {{- $tstream := $spec.trigger.stream }}
            {{- $tsubject := $spec.trigger.subject | default (printf "cdc.%s.>" $tstream) }}
            ---
            # Event-source mapping: a Benthos "pump" holds a durable JetStream
            # consumer and POSTs each CDC event to this function (which cold-starts
            # on demand, then scales back to zero). open-infra's Lambda-on-Kinesis.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pump-config
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $name }}-pump-cfg
                    namespace: {{ $ns }}
                  data:
                    benthos.yaml: |
                      logger: { level: INFO, format: logfmt }
                      input:
                        nats_jetstream:
                          urls: ["nats://nats.nats.svc.cluster.local:4222"]
                          subject: "{{ $tsubject }}"
                          durable: "fn-{{ $name }}"
                          deliver: all
                          ack_wait: 2m
                      output:
                        http_client:
                          url: "http://{{ $name }}.{{ $ns }}.svc.cluster.local"
                          verb: POST
                          timeout: 90s
                          headers: { Content-Type: application/json }
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pump
            spec:
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: {{ $name }}-pump
                    namespace: {{ $ns }}
                    labels: { app: {{ $name }}-pump, openinfra.dev/function-pump: "{{ $name }}" }
                  spec:
                    replicas: 1
                    selector: { matchLabels: { app: {{ $name }}-pump } }
                    template:
                      # function-invoker: the Kourier gateway's internal listener admits it
                      # (platform/serverless/function-gateway-isolation.yaml); it calls only this Function.
                      metadata: { labels: { app: {{ $name }}-pump, openinfra.dev/function-invoker: pump } }
                      spec:
                        # enableServiceLinks off: per-Service env overflows execve (E2BIG) in dense namespaces; unused here.
                        enableServiceLinks: false
                        containers:
                          - name: pump
                            image: jeffail/benthos:4.27.0
                            args: ["-c", "/etc/benthos/benthos.yaml"]
                            volumeMounts: [{ name: cfg, mountPath: /etc/benthos }]
                        volumes:
                          - name: cfg
                            configMap: { name: {{ $name }}-pump-cfg }
            {{- end }}
            ---
            # --- Tenant isolation (ingress) for Functions (Knative revision pods): this namespace and
            #     Knative's data path only (every call comes through the gateway or the activator, so
            #     callers elsewhere still invoke by URL), plus Prometheus; every other namespace is
            #     refused, so a Function can no longer be called by pod IP or its private Service from
            #     another tenant, skipping Invoke's authorization. One policy per namespace, shared by
            #     every Function there (a policy per Function would mean thousands of OVN ACL sets).
            #     Each Function renders the same object and none deletes it (no Delete in
            #     managementPolicies), so removing one Function leaves the others covered. ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: isolation-netpol
            spec:
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: openinfra-function-isolation
                    namespace: {{ $ns }}
                    labels: { openinfra.dev/isolation: tenant }
                  spec:
                    podSelector: { matchExpressions: [ { key: serving.knative.dev/service, operator: Exists } ] }
                    policyTypes: [Ingress]
                    ingress:
                      - from:
                          # this namespace
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $ns }} } }
                          # Knative's data path: the gateway, the activator (scale from zero) and the autoscaler
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: knative-serving } }
                          # Prometheus, scraping metrics
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
                            podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
