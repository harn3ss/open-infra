# open-infra's "Lambda": a third public API, kind: Function — a scale-to-zero HTTP
# service on Knative Serving. Give it a container image; get request-driven
# autoscaling (0..N..0), with optional GPU (serverless inference) and the same
# DB/storage/queue/secret injection as kind: Application.
# KEEP THIS SCHEMA STABLE — it is part of the product's contract.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xfunctions.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "function"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: "http-invoke,stream-out"
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names:
    kind: XFunction
    plural: xfunctions
  claimNames:
    kind: Function          # what users write in infra.yaml
    plural: functions
  defaultCompositionRef:
    name: function
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                # A burstable function renders memoryRequest as the container's memory REQUEST and
                # memory as its LIMIT; a container's request may not exceed its limit, or the
                # Deployment is refused one layer down at creation and the Service sits NotReady
                # with no cause visible on the claim (the claim is where a tenant looks, and it
                # looks fine). This is a pure arithmetic invariant on two fields of the SAME claim,
                # so reject it here at admission — naming both values — instead of emitting an
                # invalid pod. quantity() normalizes units (1Gi vs 512Mi). Only enforced when both
                # are set (memoryRequest is ignored unless burstable). Verified live by server
                # dry-run (160Mi>128Mi rejected, 512Mi<1Gi accepted, cross-unit both ways).
                - rule: "!has(self.memoryRequest) || !has(self.memory) || quantity(self.memoryRequest).compareTo(quantity(self.memory)) <= 0"
                  messageExpression: "'spec.memoryRequest (' + self.memoryRequest + ') must not exceed spec.memory (' + self.memory + '): memoryRequest becomes the container memory request and memory its limit, and a request cannot exceed its limit — lower memoryRequest or raise memory.'"
              # Exactly one of spec.image (BYO container) or spec.code (a handler on a managed
              # runtime base image) — enforced in the composition. image is no longer required at
              # the schema level so a code-only Function validates; existing image Functions are
              # unaffected.
              properties:
                image: { type: string, description: "Container image that serves HTTP (CI replaces the tag). Use this OR spec.code." }
                code:
                  type: object
                  description: >-
                    Run handler CODE on a managed runtime base image instead of a BYO container (the
                    Lambda Zip+handler model). open-infra injects the handler into a first-party
                    runtime image whose shim serves it over HTTP. Use this OR spec.image.
                  required: [handler]
                  properties:
                    runtime:
                      type: string
                      enum: [python3.8, python3.9, python3.10, python3.11, python3.12, python3.13, python3.14, nodejs16, nodejs18, nodejs20, nodejs22, nodejs24, dotnet8]
                      description: "Managed runtime base image the handler runs on: python3.8 to python3.14 (handler '<module>.<function>'), nodejs16 to nodejs24 (handler '<file>.<export>', CommonJS or ESM — a .mjs file, or a .js file with \"type\":\"module\" in package.json, loads as ESM), or dotnet8 (handler 'Assembly::Namespace.Type::Method', a published .NET build; v1 signatures Method(input) / Method(input, ILambdaContext), sync or Task). This enum is the set of AWS Lambda runtimes open-infra runs, deprecated ones included while AWS still creates functions on them (each follows AWS's deprecation dates through the Lambda API and CloudFormation); for anything else use runtimeImage."
                    runtimeImage:
                      type: string
                      description: >-
                        ESCAPE HATCH — run the handler on a BYO base image instead of a managed runtime,
                        for a runtime open-infra does not vouch for: an EOL version (nodejs18, python3.7)
                        kept only as a comparison fixture, or a language not in the enum. The image must
                        honor the runtime contract (serve the handler at /var/task over HTTP on spec.port
                        per the OPENINFRA_* env — build it FROM the old interpreter plus an open-infra
                        bootstrap shim). Requires unsupportedRuntime: true. Use runtime OR runtimeImage.
                    unsupportedRuntime:
                      type: boolean
                      default: false
                      description: >-
                        Required true to use runtimeImage — you accept an UNSUPPORTED, non-production
                        runtime. The platform then fails closed into a marked, isolated, asleep posture:
                        labelled non-production, forced cluster-local (expose off), min-scale 0, and
                        egress-denied unless allowEgress. Mirrors acceptEula on the SQL Server engine.
                    allowEgress:
                      type: boolean
                      default: false
                      description: "unsupportedRuntime only: permit outbound network calls. Default false — an unsupported-runtime fixture is egress-denied (invoked in-cluster, it shouldn't call out)."
                    handler:
                      type: string
                      description: "Entrypoint '<module>.<function>', e.g. 'app.handler' -> function handler in app.py."
                    region:
                      type: string
                      description: "AWS region to present to the handler as AWS_REGION / AWS_DEFAULT_REGION — AWS's runtime injects these and handlers need them (e.g. to build an SDK client), but they cannot be set as function env because AWS reserves the names. Set this to the function's real source region; unset defaults to us-east-1."
                    source:
                      type: object
                      description: >-
                        Where the handler code lives. Exactly one of configMap (inline source files,
                        for small handlers), bucket+key (a .zip object the runtime unpacks at start), or
                        package (a deployment package the platform stores).
                      properties:
                        configMap:
                          type: string
                          description: "Name of a ConfigMap whose keys are the handler source files (mounted read-only at /var/task)."
                        bucket:
                          type: string
                          description: "MinIO/S3 bucket holding the code .zip (an init-container fetches + unzips it into /var/task)."
                        key:
                          type: string
                          description: "Object key of the .zip within the bucket."
                        secret:
                          type: string
                          description: "Secret whose keys the runtime's AWS SDK reads to fetch the .zip: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and (for MinIO / S3-compatible endpoints) AWS_ENDPOINT_URL. The bucket and object key come from source.bucket / source.key, not this secret. NOTE: a MinIO bucket's own creds secret uses MINIO_* keys and does NOT fit directly — create a secret with these AWS_* names from the bucket's scoped creds (see probe/function-code-zip.sh for the exact recipe)."
                        package:
                          type: object
                          description: >-
                            A deployment package the platform stores, as Lambda stores one (its COPY mode):
                            a CloudFormation stack's Code.ZipFile, a .zip the Lambda API's CreateFunction or
                            UpdateFunctionCode uploads, or a Code.S3Bucket/S3Key object read with the caller's
                            authority. The function's pods fetch it from the aws-shim with the function's own
                            identity at cold start, check its SHA-256 and unpack it into /var/task; no keys are
                            involved, so it combines with spec.role. Set by the aws-shim (a stack's deploy, or
                            the Lambda API), not by hand.
                          required: [sha256]
                          properties:
                            sha256:
                              type: string
                              pattern: "^[0-9a-f]{64}$"
                              description: "SHA-256 of the stored .zip (lowercase hex) — the package's identity."
                            size:
                              type: integer
                              description: "Size of the stored .zip in bytes (Lambda's CodeSize)."
                            origin:
                              type: string
                              description: "Where the package came from: inline (a stack's Code.ZipFile), zipfile (a .zip uploaded with the Lambda API) or s3://<bucket>/<key>[?versionId=<v>]. Informational; a stack update re-reads the object only when this changes, as CloudFormation does."
                    layers:
                      type: array
                      description: >-
                        Lambda LAYERS: .zip artifacts extracted (merged, in order) into /opt at cold
                        start, so the handler can import shared code/deps they provide (a python layer's
                        zip carries a python/ tree, a Node.js layer's a nodejs/node_modules tree). Each is
                        an S3 bucket+key. A function with its own identity (an execution role or a stored
                        deployment package) fetches them from the aws-shim with its identity token, which
                        serves only objects the function's account may read (its own buckets, or another
                        account's whose bucket policy grants it); a function whose code is read with
                        source.secret fetches them with those keys.
                      items:
                        type: object
                        required: [bucket, key]
                        properties:
                          bucket: { type: string, description: "MinIO/S3 bucket holding the layer .zip." }
                          key:    { type: string, description: "Object key of the layer .zip within the bucket." }
                port:  { type: integer, default: 8080, description: "Container port the function listens on" }
                gpu:   { type: integer, default: 0, description: "GPUs per instance (serverless inference); 0 = CPU" }
                memory:  { type: string, description: "Memory per instance as a Kubernetes quantity (e.g. \"512Mi\", \"1Gi\") — the AWS Lambda memory-size knob, and the per-invocation ceiling. Default (burstable false): set as BOTH request and limit → Guaranteed QoS (the full amount is RESERVED even while the pod is idle). With burstable: true it becomes the LIMIT only (a single invocation still gets the full ceiling) while the request is a smaller per-runtime floor. Unset = cluster default; REQUIRED when burstable is true." }
                burstable:
                  type: boolean
                  default: false
                  description: >-
                    Bill memory by real use instead of reserved use — the AWS Lambda admission model. false
                    (default) = Guaranteed QoS: request == limit == memory, so every warm/idle instance reserves
                    its full configured memory (the capacity trap when thousands of functions are mostly idle).
                    true = Burstable QoS: request = a small per-runtime floor (see memoryRequest), limit = memory;
                    the instance still bursts to the full limit for an invocation but reserves far less while warm.
                    true also runs the function strictly Lambda-style (one request per instance,
                    containerConcurrency 1) and places its pods in the low-priority openinfra-function class so
                    that, under node memory pressure, function pods are reclaimed before platform pods (MinIO,
                    databases, control plane). ALWAYS pair it with a per-tenant function-concurrency + memory
                    quota BEFORE enabling it for a group of functions — Burstable without that quota is unbraked
                    overcommit (see docs/function-admission.md). Requires memory.
                memoryRequest:
                  type: string
                  description: >-
                    burstable only: override the per-runtime memory-request FLOOR (e.g. "192Mi") with a value
                    backed by measurement. Unset = the per-runtime default floor, which is currently an
                    UNMEASURED 128Mi placeholder for every runtime (replace with measured warm-set values —
                    see docs/function-admission.md). Ignored when burstable is false.
                timeout: { type: integer, minimum: 1, maximum: 900, description: "Max wall-clock seconds per request (the AWS Lambda timeout knob). 1–900 (900 = Lambda's own maximum, and the platform's configured ceiling). Honoured END TO END: the two request-path timeouts that would otherwise cut earlier are aligned to it — the shared gateway's idle timeout is set above the ceiling, and the revision's response-start timeout (max time to the FIRST byte) is set equal to this value — so a quiet-but-working request (a long report, a batch read, a slow migration step) runs its full timeout instead of being cut at Knative's 300s default. Declaring above 900 is rejected at admission (the maximum here). Unset = Knative default (300s for both the request timeout and the response-start)." }
                expose: { type: boolean, default: true, description: "Publish the function on the Knative gateway so it is reachable from the LAN (default true). Set false to make it cluster-local — labels the Knative Service networking.knative.dev/visibility: cluster-local, so only in-cluster callers can reach it." }
                scaling:
                  type: object
                  description: "Knative request-driven autoscaling (KPA): scales the function between min and max instances based on how many concurrent requests each instance handles."
                  properties:
                    min:    { type: integer, default: 0, description: "Min instances (0 = scale to zero)" }
                    max:    { type: integer, default: 10, description: "Maximum instances the autoscaler may scale up to (default 10)." }
                    target: { type: integer, default: 100, description: "Target concurrent requests per pod" }
                reservedConcurrency:
                  type: integer
                  minimum: 1
                  description: >-
                    The AWS Lambda reserved-concurrency analog: the maximum number of requests this
                    function may serve concurrently. When set, the function runs Lambda-style — one
                    request per instance (Knative containerConcurrency 1) and at most this many
                    instances — so it is a HARD concurrency cap, not a soft target. It overrides
                    scaling.max and scaling.target (scaling.min still sets the warm floor, the
                    "provisioned concurrency" analog). Unset = the request-driven scaling block applies.
                role:
                  type: string
                  maxLength: 2048
                  # A role name (AWS's role-name characters, at most 64), or a role ARN
                  # (arn:aws:iam::<12-digit account>:role/[<path>/]<name>), as Lambda's Role takes it.
                  pattern: '^(arn:aws(-[a-z]+)*:iam::[0-9]{12}:role/([A-Za-z0-9+=,.@_-]+/)*)?[A-Za-z0-9+=,.@_-]{1,64}$'
                  description: >-
                    The function's execution role (Lambda's Role): the name or ARN of a kind: Role of the
                    function's own account. The function's code runs with that role's temporary
                    credentials — its AWS SDK finds them with no keys configured — so its calls are
                    exactly as authorized as the role's policies. The role's trust policy must name
                    lambda.amazonaws.com (or this function's identity, system:serviceaccount:<namespace>:fn-<name>).
                    Naming a role needs iam:PassRole on it. Unset: the function has no role, as before.
                    Not combinable with code.source.secret (the package's static keys would shadow the
                    role in the handler's SDK).
                # Functions are stateless compute: they CONNECT to resources, they
                # don't own them. To use a database/bucket, provision it on an
                # Application and reference its secret here (e.g. secrets: [api-db-app]).
                queues:
                  type: array
                  items: { type: string }
                  description: "Queues this function works with (injects NATS_URL + OPENINFRA_QUEUES)"
                env:
                  type: array
                  description: "Environment variables to set on the function's container."
                  items:
                    type: object
                    properties:
                      name:  { type: string, description: "Variable name." }
                      value: { type: string, description: "Variable value." }
                secrets:
                  type: array
                  items: { type: string }
                  description: "Secrets to inject (envFrom) — e.g. an app's DB/bucket creds, or a Sealed Secret"
                securityGroups:
                  type: array
                  items: { type: string }
                  description: "Names of SecurityGroups (firewall rule sets) to attach to this function's pods."
                vpcConfig:
                  type: object
                  description: >-
                    Lambda's VpcConfig: the function's network interfaces are in these subnets of one VPC, its
                    outbound traffic is governed by these security groups, its DNS goes to the VPC's resolver
                    (Route 53 Resolver: the VPC's DNS Firewall and query logging apply), and its network traffic
                    can be recorded by the VPC's flow logs. See docs/lambda-vpc.md.
                  x-kubernetes-validations:
                    - rule: "(size(self.subnetIds) == 0) == (size(self.securityGroupIds) == 0)"
                      message: "Lambda function: a VPC configuration names both its subnets (SubnetIds) and its security groups (SecurityGroupIds), or neither (vpcConfig)"
                    - rule: "size(self.subnetIds) == 0 || (has(self.vpcId) && self.vpcId != '')"
                      message: "Lambda function: a VPC configuration names the VPC its subnets are in (vpcConfig.vpcId)"
                  required: [subnetIds, securityGroupIds]
                  properties:
                    subnetIds:
                      type: array
                      maxItems: 16
                      items: { type: string, maxLength: 63 }
                      description: "Subnet ids (kind: Subnet names) of one VPC. Empty: the function is not in a VPC."
                    securityGroupIds:
                      type: array
                      maxItems: 5
                      items: { type: string, maxLength: 60 }
                      description: "Security group ids (kind: SecurityGroup names) of the same VPC."
                    vpcId:
                      type: string
                      maxLength: 63
                      description: "The VPC (kind: Vpc name) the subnets and security groups belong to. The Lambda API fills it in."
                trigger:
                  type: object
                  description: >-
                    Event-source mapping: subscribe this function to a Stream's CDC
                    events (kind: Stream). A pump delivers each change as an HTTP POST;
                    the function cold-starts on demand and scales back to zero when idle.
                  properties:
                    stream:
                      type: string
                      description: "Stream (kind: Stream) name to consume — events from cdc.<stream>.*"
                    subject:
                      type: string
                      description: "Optional subject filter (default cdc.<stream>.>), e.g. cdc.<stream>.public.orders"
                versions:
                  type: array
                  maxItems: 100
                  description: >-
                    The function's published versions (AWS Lambda versions), in the order published. Each is
                    an immutable snapshot of the function's code and configuration: the Knative revision it
                    runs (pinned, so it is kept) and the configuration it was published with. A version is
                    invoked as <function>:<version>. Written by the aws-shim's PublishVersion (or Publish on
                    CreateFunction / UpdateFunctionCode), not by hand.
                  items:
                    type: object
                    required: [version]
                    properties:
                      version:
                        type: string
                        pattern: '^[1-9][0-9]{0,8}$'
                        description: The version number, from 1.
                      revision:
                        type: string
                        maxLength: 63
                        description: >-
                          The Knative revision the version runs; empty while the publish waits for the
                          function's update to roll out.
                      description:
                        type: string
                        maxLength: 256
                      published:
                        type: string
                        description: When the version was published (RFC 3339).
                      configuration:
                        type: string
                        description: >-
                          The function's configuration when the version was published, as Lambda's
                          FunctionConfiguration (JSON): the version's own GetFunctionConfiguration answer.
                      code:
                        type: string
                        description: >-
                          Where the version's code is, as Lambda's FunctionCodeLocation (JSON): the version's
                          own GetFunction Code.
                aliases:
                  type: array
                  maxItems: 50
                  description: >-
                    The function's aliases (AWS Lambda aliases). Each names a version ($LATEST or a published
                    version) and may send a share of its invocations to one other version (Lambda's
                    RoutingConfig). An alias is invoked as <function>:<alias>; the aws-shim resolves it to a
                    version for each invocation.
                  items:
                    type: object
                    required: [name, functionVersion]
                    properties:
                      name:
                        type: string
                        maxLength: 128
                        pattern: '^[a-zA-Z0-9_-]*[a-zA-Z_-][a-zA-Z0-9_-]*$'
                        description: The alias name (not all digits, as a version is).
                      functionVersion:
                        type: string
                        pattern: '^(\$LATEST|[1-9][0-9]{0,8})$'
                        description: The version the alias invokes ($LATEST or a version number).
                      description:
                        type: string
                        maxLength: 256
                      additionalVersionWeights:
                        type: object
                        maxProperties: 1
                        additionalProperties: { type: number, minimum: 0, maximum: 1 }
                        description: >-
                          Lambda's RoutingConfig.AdditionalVersionWeights: one other version and the share
                          (0-1) of the alias's invocations it receives.
            status:
              type: object
              properties:
                url: { type: string }
