# The composition for kind: Grant (temporary access). A Grant renders NO binding: an approved grant's
# policies are attached to its subject by the one evaluator and the IAM compiler, which read every
# approved, unexpired Grant as an attachment of its policies for its window (grant-xrd.yaml). This
# composition only reports where the grant stands — awaiting approval, approved by its own requester
# (attaches nothing), or active — and mirrors what it names into a ConfigMap, which gives the pipeline a
# composed resource so the status lands.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: grant
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: iam.openinfra.dev/v1
    kind: XGrant
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "open-infra-console" }}
            {{- $subject := $spec.subject | default dict }}
            {{- $policies := $spec.policies | default list }}
            {{/*
              Approval (AC-2(2)/AC-5/AC-6(2)): a grant attaches its policies only once someone other than
              its requester has approved it. Approving your own request is not a second person's approval:
              it attaches nothing, here and in the evaluator.
            */}}
            {{- $requestedBy := $spec.requestedBy | default "" }}
            {{- $approval := $spec.approval | default dict }}
            {{- $approvedBy := $approval.approvedBy | default "" }}
            {{- $approvedAt := $approval.approvedAt | default "" }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: grant-spec
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: openinfra-grant-{{ $name }}
                    namespace: {{ $ns }}
                    labels:
                      openinfra.dev/iam-grant: {{ $name }}
                  data:
                    name: {{ $name | quote }}
                    subject: {{ printf "%v/%v" ($subject.kind | default "") ($subject.name | default "") | quote }}
                    policies: {{ $policies | toJson | quote }}
            ---
            apiVersion: iam.openinfra.dev/v1
            kind: XGrant
            status:
              {{- if eq $approvedBy "" }}
              ready: false
              phase: AwaitingApproval
              message: "awaiting approval by a second person; the grant attaches nothing until then"
              {{- else if eq $approvedBy $requestedBy }}
              ready: false
              phase: NotGrantable
              message: {{ printf "%v approved their own request: the approver must be someone other than the requester (separation of duties, AC-5), so the grant attaches nothing" $approvedBy | toJson }}
              {{- else }}
              ready: true
              phase: Active
              message: {{ printf "approved by %v at %v: attaches %v to %v %v for %v" $approvedBy $approvedAt (join ", " $policies) ($subject.kind | default "") ($subject.name | default "") ($spec.duration | default "") | toJson }}
              {{- end }}
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
