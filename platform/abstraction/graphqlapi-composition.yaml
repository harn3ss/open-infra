# Composition for kind: GraphQLApi. Renders, with NO bespoke controller
# (mirrors kind: HttpApi): (a) a ConfigMap holding config.json + one request/response .vtl file per
# resolver, in the exact shape open-appsync's server.Load already reads, and (b) the open-appsync engine
# Deployment + a Service. A checksum annotation over the rendered config rolls the pod on any change
# (no fsnotify; hot-reload is later polish). The engine stays Kubernetes-free — this Composition is the
# only k8s-aware thing, so the dependency arrow points inward-only.
#
# Fail-closed (negative-proof bar): the engine validates every template on load and refuses to serve
# if one is malformed, so a bad resolver keeps the whole API from coming up (the pod stays not-ready and
# the error is in its logs) — an invalid resolver never serves. It is NOT "rejected at apply instant"
# (there is no validating webhook; that does not fit the Crossplane flow).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: graphqlapi
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef: { apiVersion: openinfra.dev/v1, kind: XGraphQLApi }
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef: { name: crossplane-contrib-function-environment-configs }
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref: { name: openinfra-platform }
    - step: render-resources
      functionRef: { name: crossplane-contrib-function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- $envCfg := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $arch := index $envCfg "imageArchSuffix" | default "" }}
            {{- /* Per-resource override: annotation openinfra.dev/arch (amd64|arm64) beats the cluster
                   default, so a specific claim can target the other arch in a MIXED cluster. */}}
            {{- $annos := .observed.composite.resource.metadata.annotations | default dict }}
            {{- $reqArch := index $annos "openinfra.dev/arch" | default "" }}
            {{- if eq $reqArch "arm64" }}{{- $arch = "-arm64" }}{{- else if eq $reqArch "amd64" }}{{- $arch = "" }}{{- end }}
            {{- $nodeArch := "amd64" }}{{- if eq $arch "-arm64" }}{{- $nodeArch = "arm64" }}{{- end }}
            {{- $image := $spec.image | default (printf "ghcr.io/harn3ss/open-infra-open-appsync:latest%s" $arch) }}
            {{- $replicas := $spec.replicas | default 1 }}
            {{- /* Checksum over schema + every data source + every resolver, so ANY authoring change
                   rolls the pod (the reload mechanism, since the engine reads a directory once). */ -}}
            {{- $blob := $spec.schema | default "" }}
            {{- range $ds := ($spec.dataSources | default list) }}{{ $blob = printf "%s|ds|%s|%s|%s|%s" $blob $ds.name ($ds.type | default "memory") ($ds.collection | default "") ($ds.endpoint | default "") }}{{ end }}
            {{- range $r := $spec.resolvers }}{{ $blob = printf "%s|r|%s|%s|%s|%s|%s|%s|%s|%s" $blob $r.type $r.field ($r.dataSource | default "") ($r.runtime | default "") ($r.request | default "") ($r.response | default "") ($r.before | default "") ($r.after | default "") }}{{ range $f := ($r.functions | default list) }}{{ $blob = printf "%s|fn|%s|%s|%s|%s" $blob ($f.dataSource | default "") ($f.runtime | default "") ($f.request | default "") ($f.response | default "") }}{{ end }}{{ with $r.auth }}{{ $blob = printf "%s|auth|%s|%s|%s|%s|%s" $blob (.group | default "") (.resource | default "") (.verb | default "") (.namespace | default "") (.name | default "") }}{{ end }}{{ with $r.caching }}{{ $blob = printf "%s|cache|%v|%v" $blob (.ttlSeconds | default 0) (.keys | default list) }}{{ end }}{{ end }}
            {{- with $spec.limits }}{{ $blob = printf "%s|lim|%v|%v|%v" $blob (.maxDepth | default 0) (.maxCost | default 0) (.persistedOnly | default false) }}{{ range $q := (.persistedQueries | default list) }}{{ $blob = printf "%s|pq|%s" $blob $q }}{{ end }}{{ end }}
            {{- range $s := ($spec.subscriptions | default list) }}{{ $blob = printf "%s|sub|%s|%s|%s|%s" $blob $s.field ($s.subject | default "") ($s.runtime | default "") ($s.response | default "") }}{{ range $m := ($s.triggeredBy | default list) }}{{ $blob = printf "%s|trig|%s" $blob $m }}{{ end }}{{ end }}
            {{- $checksum := $blob | sha256sum | trunc 16 }}
            ---
            # --- (a) The engine config: config.json + one .vtl file per resolver's templates ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: config
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: open-appsync-{{ $name }}-config
                    namespace: {{ $ns }}
                    labels:
                      openinfra.dev/graphqlapi: {{ $name }}
                  data:
                    config.json: |
                      {
                        {{- if $spec.limits }}
                        "limits": { "maxDepth": {{ $spec.limits.maxDepth | default 0 }}, "maxCost": {{ $spec.limits.maxCost | default 0 }}, "persistedOnly": {{ $spec.limits.persistedOnly | default false }}{{ if $spec.limits.introspection }}, "introspection": {{ $spec.limits.introspection | quote }}{{ end }}{{ if $spec.limits.persistedQueries }}, "persistedQueries": [{{ range $i, $q := $spec.limits.persistedQueries }}{{ if $i }},{{ end }}{{ $q | quote }}{{ end }}]{{ end }} },
                        {{- end }}
                        "dataSources": [{{ range $i, $ds := ($spec.dataSources | default list) }}{{ if $i }},{{ end }}
                          { "name": "{{ $ds.name }}", "type": "{{ $ds.type | default "memory" }}"{{ if $ds.collection }}, "collection": "{{ $ds.collection }}"{{ end }}{{ if $ds.endpoint }}, "endpoint": "{{ $ds.endpoint }}"{{ end }} }{{ end }}
                        ],
                        "resolvers": [{{ range $i, $r := $spec.resolvers }}{{ if $i }},{{ end }}
                          {{- if $r.functions }}
                          { "type": "{{ $r.type }}", "field": "{{ $r.field }}", {{ with $r.auth }}"auth": { "group": "{{ .group | default "" }}", "resource": "{{ .resource | default "" }}", "verb": "{{ .verb | default "" }}", "namespace": "{{ .namespace | default "" }}", "name": "{{ .name | default "" }}" }, {{ end }}"before": "{{ if $r.before }}{{ $r.type }}.{{ $r.field }}.before.vtl{{ end }}", "after": "{{ if $r.after }}{{ $r.type }}.{{ $r.field }}.after.vtl{{ end }}", "functions": [{{ range $j, $f := $r.functions }}{{ if $j }},{{ end }} { "dataSource": "{{ $f.dataSource }}", "runtime": "{{ $f.runtime | default "appsync-vtl" }}", "request": "{{ $r.type }}.{{ $r.field }}.fn{{ $j }}.request.vtl", "response": "{{ $r.type }}.{{ $r.field }}.fn{{ $j }}.response.vtl" }{{ end }} ]{{ with $r.caching }}, "caching": { "ttlSeconds": {{ .ttlSeconds | default 0 }}, "keys": [{{ range $k, $key := (.keys | default list) }}{{ if $k }},{{ end }}{{ $key | quote }}{{ end }}] }{{ end }} }
                          {{- else }}
                          { "type": "{{ $r.type }}", "field": "{{ $r.field }}", {{ with $r.auth }}"auth": { "group": "{{ .group | default "" }}", "resource": "{{ .resource | default "" }}", "verb": "{{ .verb | default "" }}", "namespace": "{{ .namespace | default "" }}", "name": "{{ .name | default "" }}" }, {{ end }}"dataSource": "{{ $r.dataSource }}", "runtime": "{{ $r.runtime | default "appsync-vtl" }}", "request": "{{ $r.type }}.{{ $r.field }}.request.vtl", "response": "{{ $r.type }}.{{ $r.field }}.response.vtl"{{ with $r.caching }}, "caching": { "ttlSeconds": {{ .ttlSeconds | default 0 }}, "keys": [{{ range $k, $key := (.keys | default list) }}{{ if $k }},{{ end }}{{ $key | quote }}{{ end }}] }{{ end }} }
                          {{- end }}{{ end }}
                        ]{{ if $spec.subscriptions }},
                        "subscriptions": [{{ range $i, $s := $spec.subscriptions }}{{ if $i }},{{ end }}
                          { "field": "{{ $s.field }}"{{ if $s.subject }}, "subject": "{{ $s.subject }}"{{ end }}, "runtime": "{{ $s.runtime | default "appsync-vtl" }}", "response": "{{ $s.field }}.subscription.response.vtl"{{ if $s.triggeredBy }}, "triggeredBy": [{{ range $j, $m := $s.triggeredBy }}{{ if $j }},{{ end }}{{ $m | quote }}{{ end }}]{{ end }}{{ with $s.auth }}, "auth": { "group": "{{ .group | default "" }}", "resource": "{{ .resource | default "" }}", "verb": "{{ .verb | default "" }}", "namespace": "{{ .namespace | default "" }}", "name": "{{ .name | default "" }}" }{{ end }} }{{ end }}
                        ]{{ end }}
                      }
                    {{- if $spec.schema }}
                    # The GraphQL SDL, carried as a sibling file (not inlined in config.json, to avoid
                    # JSON escaping — same reason the .vtl templates are files). The engine parses it into
                    # its type graph and answers __schema/__type introspection over it.
                    schema.graphql: |
                      {{- $spec.schema | nindent 22 }}
                    {{- end }}
                    {{- range $s := ($spec.subscriptions | default list) }}
                    {{ $s.field }}.subscription.response.vtl: |
                      {{- $s.response | nindent 22 }}
                    {{- end }}
                    {{- range $r := $spec.resolvers }}
                    {{- if $r.functions }}
                    {{- if $r.before }}
                    {{ $r.type }}.{{ $r.field }}.before.vtl: |
                      {{- $r.before | nindent 22 }}
                    {{- end }}
                    {{- if $r.after }}
                    {{ $r.type }}.{{ $r.field }}.after.vtl: |
                      {{- $r.after | nindent 22 }}
                    {{- end }}
                    {{- range $j, $f := $r.functions }}
                    {{ $r.type }}.{{ $r.field }}.fn{{ $j }}.request.vtl: |
                      {{- $f.request | nindent 22 }}
                    {{ $r.type }}.{{ $r.field }}.fn{{ $j }}.response.vtl: |
                      {{- $f.response | nindent 22 }}
                    {{- end }}
                    {{- else }}
                    {{ $r.type }}.{{ $r.field }}.request.vtl: |
                      {{- $r.request | nindent 22 }}
                    {{ $r.type }}.{{ $r.field }}.response.vtl: |
                      {{- $r.response | nindent 22 }}
                    {{- end }}
                    {{- end }}
            ---
            # --- (b) The open-appsync engine serving THIS API ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: deployment
            spec:
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: open-appsync-{{ $name }}
                    namespace: {{ $ns }}
                    labels: { app: open-appsync-{{ $name }}, openinfra.dev/graphqlapi: {{ $name }} }
                  spec:
                    replicas: {{ $replicas }}
                    selector:
                      matchLabels: { app: open-appsync-{{ $name }} }
                    template:
                      metadata:
                        labels: { app: open-appsync-{{ $name }} }
                        annotations:
                          # Roll the pod whenever the authored config changes (the reload mechanism).
                          openinfra.dev/config-checksum: "{{ $checksum }}"
                      spec:
                        {{- /* Pin to a matching-arch node only for the default first-party image;
                               a user-supplied image carries its own arch. */}}
                        {{- if not $spec.image }}
                        nodeSelector: { kubernetes.io/arch: {{ $nodeArch }} }
                        {{- end }}
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 65532
                          seccompProfile: { type: RuntimeDefault }
                        containers:
                          - name: engine
                            image: {{ $image }}
                            imagePullPolicy: Always
                            ports:
                              - { name: http, containerPort: 8080 }
                            env:
                              - { name: LISTEN_ADDR, value: ":8080" }
                              - { name: CONFIG_DIR, value: "/etc/open-appsync" }
                              # Subscriptions, the eventbridge data source, and the shared response cache ride
                              # the platform NATS bus.
                              {{- $needsNats := false }}
                              {{- $hasCaching := false }}
                              {{- if $spec.subscriptions }}{{ $needsNats = true }}{{ end }}
                              {{- range $ds := ($spec.dataSources | default list) }}{{- if eq ($ds.type | default "memory") "eventbridge" }}{{ $needsNats = true }}{{ end }}{{- end }}
                              {{- range $r := ($spec.resolvers | default list) }}{{- if $r.caching }}{{ $needsNats = true }}{{ $hasCaching = true }}{{ end }}{{- end }}
                              {{- if $needsNats }}
                              - { name: NATS_URL, value: "nats://nats.nats.svc.cluster.local:4222" }
                              {{- end }}
                              {{- if $hasCaching }}
                              # Response caching uses a per-API NATS KV bucket, so distinct APIs on the shared
                              # NATS never collide; without NATS the engine falls back to a per-replica cache.
                              - { name: APPSYNC_CACHE_BUCKET, value: "open_appsync_cache_{{ $name | replace "." "_" }}" }
                              {{- end }}
                              {{- if $spec.mongoURI }}
                              - { name: MONGO_URI, value: "{{ $spec.mongoURI }}" }
                              - { name: MONGO_DB, value: "{{ $spec.mongoDB | default "open_appsync" }}" }
                              {{- end }}
                              {{- if $spec.apiKeysSecret }}
                              # API-key auth (@aws_api_key): the mounted Secret's apikeys.json maps each key
                              # to the k8s identity it impersonates — THE KEY IS AN IDENTITY.
                              - { name: APPSYNC_API_KEYS_FILE, value: "/etc/open-appsync-apikeys/apikeys.json" }
                              {{- end }}
                              {{- range $ds := ($spec.dataSources | default list) }}
                              {{- if eq ($ds.type | default "memory") "rds" }}
                              # rds data source {{ $ds.name }}: DSN from its connectionSecret (key `dsn`), never the CR.
                              - name: APPSYNC_RDS_DSN_{{ $ds.name | upper | replace "-" "_" | replace "." "_" }}
                                valueFrom: { secretKeyRef: { name: "{{ $ds.connectionSecret }}", key: dsn } }
                              {{- end }}
                              {{- if and (eq ($ds.type | default "memory") "opensearch") $ds.connectionSecret }}
                              # opensearch data source {{ $ds.name }}: optional basic auth from its connectionSecret.
                              - name: APPSYNC_OPENSEARCH_USER_{{ $ds.name | upper | replace "-" "_" | replace "." "_" }}
                                valueFrom: { secretKeyRef: { name: "{{ $ds.connectionSecret }}", key: username, optional: true } }
                              - name: APPSYNC_OPENSEARCH_PASS_{{ $ds.name | upper | replace "-" "_" | replace "." "_" }}
                                valueFrom: { secretKeyRef: { name: "{{ $ds.connectionSecret }}", key: password, optional: true } }
                              {{- end }}
                              {{- end }}
                            volumeMounts:
                              - { name: config, mountPath: /etc/open-appsync }
                              {{- if $spec.apiKeysSecret }}
                              - { name: apikeys, mountPath: /etc/open-appsync-apikeys, readOnly: true }
                              {{- end }}
                            readinessProbe:
                              httpGet: { path: /healthz, port: 8080 }
                              initialDelaySeconds: 3
                              periodSeconds: 10
                            livenessProbe:
                              httpGet: { path: /healthz, port: 8080 }
                              initialDelaySeconds: 15
                              periodSeconds: 20
                            securityContext:
                              readOnlyRootFilesystem: true
                              allowPrivilegeEscalation: false
                              capabilities:
                                drop: [ALL]
                            resources:
                              requests: { cpu: 25m, memory: 32Mi }
                              limits: { cpu: 500m, memory: 256Mi }
                        volumes:
                          - name: config
                            configMap:
                              name: open-appsync-{{ $name }}-config
                          {{- if $spec.apiKeysSecret }}
                          - name: apikeys
                            secret:
                              secretName: {{ $spec.apiKeysSecret }}
                          {{- end }}
            ---
            # --- The in-cluster GraphQL endpoint for this API ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: open-appsync-{{ $name }}
                    namespace: {{ $ns }}
                    labels: { app: open-appsync-{{ $name }}, openinfra.dev/graphqlapi: {{ $name }} }
                  spec:
                    type: ClusterIP
                    selector: { app: open-appsync-{{ $name }} }
                    ports:
                      - { name: http, port: 80, targetPort: 8080 }
            ---
            # --- Ingress isolation: the engine answers only its legitimate front doors ---
            # The engine TRUSTS the X-OpenInfra-* identity headers the aws-shim sets (that is how field-mode
            # enforcement conveys a verified principal), so any pod that can reach :8080 could FORGE them and
            # impersonate. Ingress must therefore be POD-scoped, not merely namespace-scoped: allow only the
            # aws-shim (SigV4/JWT/Lambda-authorizer front door), the console BFF (Test Resolver posts to
            # /test-resolver), and Prometheus (scrapes /metrics) — each an explicit namespace+pod pair. No
            # blanket same-namespace allow: a co-tenant pod must not be able to forge identity; the shim is
            # the sole authenticating door, and kubelet health probes are node-sourced (exempt). Ingress is
            # evaluated post-DNAT by Cilium identity, so a standard NetworkPolicy is correct; ports match the
            # pod's container port (8080), not the Service port. Egress is left open — resolvers reach
            # arbitrary data-source hosts (http/rds/opensearch/lambda), NATS, FerretDB and the API server
            # (SAR), and a standard egress policy would silently drop in-cluster ClusterIPs (pre-DNAT).
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: netpol
            spec:
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: open-appsync-{{ $name }}
                    namespace: {{ $ns }}
                    labels: { app: open-appsync-{{ $name }}, openinfra.dev/graphqlapi: {{ $name }} }
                  spec:
                    podSelector: { matchLabels: { app: open-appsync-{{ $name }} } }
                    policyTypes: [Ingress]
                    ingress:
                      - from:
                          # The aws-shim — the authenticating front door (the only sender of trusted identity).
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: open-infra-aws-shim } }
                            podSelector: { matchLabels: { app: aws-shim } }
                          # The console BFF — Test Resolver posts to /test-resolver.
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: open-infra-console } }
                            podSelector: { matchLabels: { app: console } }
                          # Prometheus — scrapes /metrics.
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
                            podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
                        ports:
                          - { protocol: TCP, port: 8080 }
    - step: ready
      functionRef: { name: crossplane-contrib-function-auto-ready }
