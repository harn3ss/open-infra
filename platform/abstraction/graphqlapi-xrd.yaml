# kind: GraphQLApi — open-infra's NEUTRAL GraphQL authoring plane.
#
# A GraphQL schema served by mapping templates over data sources IS what a resolver-based engine is —
# not an AWS concept. So the kind describes the engine's own nouns (a schema, data sources, resolvers),
# and the AWS-ness lives entirely inside a resolver's `runtime` value ("appsync-vtl" today) and the
# template it carries. Swap in runtime: js or a neutral format later and the kind never changes. That
# is the thing AWS structurally can't offer: a runtime is a real, third-party extension point.
#
# Deliberately ONE kind (not separate Resolver/DataSource/GraphQLApi objects): those are AWS's
# MANAGEMENT nouns, and collapsing N sibling Resolver objects into one engine config would need a
# bespoke controller open-infra doesn't have. One object is both the vendor-neutral model AND the
# no-controller mechanism — it renders exactly like kind: HttpApi (XRD + go-templating composition).
#
# Honest scope (Stage 1): a neutral engine that runs a team's unchanged VTL, wired via THIS object.
# It is NOT yet the AWS packaging experience — CreateResolver / the CloudFormation type are Stage 2,
# a shim that later patches this same object at the edge. See open-appsync/README.md.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xgraphqlapis.openinfra.dev
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names:
    kind: XGraphQLApi
    plural: xgraphqlapis
  claimNames:
    kind: GraphQLApi
    plural: graphqlapis
  defaultCompositionRef: { name: graphqlapi }
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [resolvers]
              properties:
                schema:
                  type: string
                  description: "GraphQL SDL for the API. When set, the engine parses it into an in-memory type graph and answers __schema/__type introspection over it — so GraphQL tooling (graphql-codegen, Apollo, GraphiQL) can build a client schema from this API. Optional: the executor still resolves fields from the resolver list without it, but introspection is then unavailable."
                image:
                  type: string
                  default: ghcr.io/harn3ss/open-infra-open-appsync:latest
                  description: "The open-appsync engine image serving this API."
                replicas:
                  type: integer
                  default: 1
                mongoURI:
                  type: string
                  description: "FerretDB (Mongo wire) endpoint backing `dynamodb` data sources. Required only if a data source is type dynamodb; a dynamodb source with no mongoURI fails closed at load."
                mongoDB:
                  type: string
                  default: open_appsync
                  description: "FerretDB database name for dynamodb data sources."
                limits:
                  type: object
                  description: "Hostile-load guards. ON by default even if omitted; a maxDepth/maxCost of 0 keeps the safe default, a negative value opts out of that guard."
                  properties:
                    maxDepth:
                      type: integer
                      description: "Reject queries whose selection nesting exceeds this (default 10; negative disables)."
                    maxCost:
                      type: integer
                      description: "Reject queries with more than this many fields (default 1000; negative disables)."
                    persistedOnly:
                      type: boolean
                      description: "When true, only pre-registered query documents in persistedQueries run — the strongest posture for a fixed-client deployment."
                    persistedQueries:
                      type: array
                      description: "Allow-listed query documents (for persistedOnly mode)."
                      items:
                        type: string
                    introspection:
                      type: string
                      enum: [enabled, disabled, authenticated-only]
                      description: "Who may read the schema via __schema/__type. enabled (default) — any client, best for tooling; disabled — never; authenticated-only — off for untrusted (anonymous) callers. Requires spec.schema."
                dataSources:
                  type: array
                  description: "The data sources resolvers bind to."
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: "Data source name a resolver references."
                      type:
                        type: string
                        default: memory
                        enum: [memory, dynamodb, http, lambda]
                        description: "memory = ephemeral (dev/demo); dynamodb = FerretDB-backed (needs a collection + spec.mongoURI); http = an HTTP endpoint (needs an endpoint); lambda = invoke a kind: Function over HTTP (needs the function URL as endpoint)."
                      collection:
                        type: string
                        description: "dynamodb: the FerretDB collection (the 'table')."
                      endpoint:
                        type: string
                        description: "http: the base URL the resolver's operation ({method, resourcePath, params}) targets. lambda: the function (kind: Function) URL invoked with the resolver's payload."
                resolvers:
                  type: array
                  description: "Field bindings. A resolver is EITHER a unit resolver (dataSource + request + response) OR a pipeline resolver (functions[], with optional before/after). Malformed resolvers fail closed at load."
                  minItems: 1
                  items:
                    type: object
                    required: [type, field]
                    properties:
                      type:
                        type: string
                        description: "The type this field lives on: Query or Mutation for a root resolver, or any object type (e.g. Post) for a per-nested-field resolver that runs when that field is selected below the root — it receives the parent object as $ctx.source."
                      field:
                        type: string
                        description: "The GraphQL field name, e.g. getTodo."
                      runtime:
                        type: string
                        default: appsync-vtl
                        description: "The resolver runtime (the extension point): appsync-vtl (VTL mapping templates — a resolver author's VTL is byte-for-byte identical, zero retraining) or appsync-js (a sandboxed JavaScript module exporting request(ctx)/response(ctx), carried in the request field)."
                      dataSource:
                        type: string
                        description: "Unit resolver: name of a spec.dataSources entry."
                      request:
                        type: string
                        description: "Unit resolver: the request mapping template source (VTL for appsync-vtl)."
                      response:
                        type: string
                        description: "Unit resolver: the response mapping template source."
                      before:
                        type: string
                        description: "Pipeline resolver: the before mapping template (sets $ctx.stash / may abort; touches no data source)."
                      auth:
                        type: object
                        description: "Field-level authorization: the k8s RBAC permission the caller must have (checked via a SubjectAccessReview — the same boundary as every other front door). Omit for a public field."
                        properties:
                          group: { type: string, description: "API group, e.g. openinfra.dev." }
                          resource: { type: string, description: "Resource plural, e.g. graphqlapis." }
                          verb: { type: string, description: "e.g. get, create." }
                          namespace: { type: string, description: "Namespace, or empty for cluster-scoped." }
                          name: { type: string, description: "Optional specific object name." }
                      after:
                        type: string
                        description: "Pipeline resolver: the after mapping template (shapes the final value from $ctx.prev.result)."
                      functions:
                        type: array
                        description: "Pipeline resolver: ordered functions; each function's response becomes $ctx.prev.result for the next."
                        items:
                          type: object
                          required: [dataSource, request, response]
                          properties:
                            dataSource:
                              type: string
                              description: "Name of a spec.dataSources entry this function targets."
                            runtime:
                              type: string
                              default: appsync-vtl
                            request:
                              type: string
                              description: "The function's request mapping template source."
                            response:
                              type: string
                              description: "The function's response mapping template source."
                subscriptions:
                  type: array
                  description: "Subscription-type fields (experimental). Each has a response mapping (no request phase — the push source calls it) and the mutations that trigger it. Served over graphql-transport-ws at /graphql-ws."
                  items:
                    type: object
                    required: [field, response]
                    properties:
                      field:
                        type: string
                        description: "The Subscription field name, e.g. onCreateTodo."
                      subject:
                        type: string
                        description: "Bus subject the events ride; defaults to sub.<field>."
                      runtime:
                        type: string
                        default: appsync-vtl
                      response:
                        type: string
                        description: "The response mapping template that shapes each pushed event."
                      triggeredBy:
                        type: array
                        description: "Mutation field names whose success publishes to this subscription."
                        items:
                          type: string
                      auth:
                        type: object
                        description: "Authorization checked at subscribe time (a SubjectAccessReview), like a resolver's auth."
                        properties:
                          group: { type: string }
                          resource: { type: string }
                          verb: { type: string }
                          namespace: { type: string }
                          name: { type: string }
            status:
              type: object
              properties:
                url:
                  type: string
                  description: "In-cluster GraphQL endpoint of the engine serving this API."
