# Admission WARNS (never refuses) on a Group still naming a clusterRole: the permission-tier form is
# deprecated in favour of attached policies. A warning, so nothing that writes Groups today breaks.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-group-clusterrole-deprecated
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["iam.openinfra.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["groups"]
  validations:
    - expression: "!has(object.spec) || !has(object.spec.clusterRole) || object.spec.clusterRole == ''"
      message: >-
        spec.clusterRole is deprecated: a Group is a container of policies (spec.policies), as on AWS.
        Attach aws-administratoraccess, aws-poweruseraccess or aws-readonlyaccess instead of the
        open-infra-console, open-infra-poweruser or open-infra-readonly tier (hack/iam-migrate does it).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-group-clusterrole-deprecated
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  policyName: openinfra-group-clusterrole-deprecated
  validationActions: [Warn]
