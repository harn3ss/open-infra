# A Group is a container of policies (spec.policies, spec.inlinePolicies), as on AWS, and renders
# no binding: the one evaluator reads its policies for every member, and the IAM compiler generates
# whatever RBAC they need underneath (labelled openinfra.dev/generated-by: iam-compiler). A Group
# never binds a ClusterRole — the XRD refuses spec.clusterRole at admission, and a Group that still
# carried one from before would render exactly what any other Group renders.
#
# The console sends a member's groups as Impersonate-Group: openinfra:<group> with every proxied
# call; what that identity may do is the IAM compiler's generated RBAC, never a hand-written grant.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: group
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: iam.openinfra.dev/v1
    kind: XGroup
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- /* A Group of policies (spec.policies / inlinePolicies, as on AWS) binds no ClusterRole: the
                   one evaluator reads its policies for every member, and the IAM compiler generates any RBAC
                   they need. A spec-mirror ConfigMap is the pipeline's composed resource, so the status lands. */ -}}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "open-infra-console" }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: group-spec
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: openinfra-group-{{ $name }}
                    namespace: {{ $ns }}
                    labels:
                      openinfra.dev/iam-group: {{ $name }}
                  data:
                    name: {{ $name | quote }}
                    policies: {{ $spec.policies | default list | toJson | quote }}
            ---
            {{- $ready := true }}
            apiVersion: iam.openinfra.dev/v1
            kind: XGroup
            status:
              ready: {{ $ready }}
              boundTo: "openinfra:{{ $name }}"
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
