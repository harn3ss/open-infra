# kind: Group — as on AWS, a container of policies users are placed into: every member gets
# the group's attached policies (spec.policies) and inline policies (spec.inlinePolicies). A
# group with no policies grants nothing.
#
# DEPRECATED FORM, kept working until the cutover rewrites it: spec.clusterRole, a permission
# tier the group binds members to. What follows describes that form.
#
# A Group compiles to a ClusterRoleBinding whose subject is the Kubernetes group
# `openinfra:<name>`, bound to a ClusterRole. The console sends that group as an
# Impersonate-Group header, so KUBERNETES RBAC — not the console — decides what members
# may do, and every action is attributable in the audit log.
#
# Lives in iam.openinfra.dev rather than openinfra.dev: RBAC is purely additive, and the
# console's readonly role holds openinfra.dev ["*"], so an identity kind in that group
# would be readable by every reader the moment it existed. See docs/iam.md.
#
# The three built-in groups (admins / powerusers / readers) are shipped as static manifests
# in platform/console/manifests/rbac-roles.yaml; this kind is for defining your own.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xgroups.iam.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "none"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: iam.openinfra.dev
  names:
    kind: XGroup
    plural: xgroups
  claimNames:
    kind: Group
    plural: groups
  defaultCompositionRef:
    name: group
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                  description: What this group is for, shown in the console.
                policies:
                  type: array
                  description: >-
                    The policies attached to this group (AWS AttachGroupPolicy): names of kind: Policy — an AWS
                    managed policy by its object name (aws-poweruseraccess) or a customer policy's name. Every
                    member gets them, as on AWS. A group is a container of policies, not a permission tier: a
                    group with no policies grants nothing.
                  items:
                    type: string
                    # a Policy name, or "<namespace>/<name>" for one outside the group's namespace
                    pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?/)?[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                    maxLength: 128
                inlinePolicies:
                  type: array
                  description: >-
                    Inline policies embedded in this group (AWS PutGroupPolicy): each a name and an AWS policy
                    document, deleted with the group.
                  items:
                    type: object
                    required: [name, document]
                    properties:
                      name:
                        type: string
                        maxLength: 128
                      document:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        required: [Statement]
                        properties:
                          Version:
                            type: string
                            enum: ["2012-10-17", "2008-10-17"]
                          Id:
                            type: string
                          Statement:
                            x-kubernetes-preserve-unknown-fields: true
                            description: One statement object or a list of them (Effect, Action/NotAction, Resource/NotResource, Condition), as AWS accepts.
                clusterRole:
                  type: string
                  description: >-
                    DEPRECATED — the permission-tier form: the name of a ClusterRole members receive (built-in
                    open-infra-console, open-infra-poweruser, open-infra-readonly, or your own). Use policies
                    instead (AdministratorAccess, PowerUserAccess, ReadOnlyAccess are attachable managed
                    policies); hack/iam-migrate rewrites a tier into its managed policy. Still bound while set,
                    and admission warns.
            status:
              type: object
              properties:
                ready:
                  type: boolean
                boundTo:
                  type: string
                  description: The Kubernetes group name members are bound as.
