# Composition for kind: HttpApi — renders a Traefik IngressRoute mapping the declared routes onto
# their backend Services (a kind: Function's Knative Service or a kind: Application's Service, both
# reachable as `service <name>:80` in the claim namespace).
#
# It renders an IngressRoute (not a plain Ingress) because API Gateway routes discriminate by HTTP
# method, which a k8s Ingress cannot express — Traefik's IngressRoute match rule can
# (`Method(`GET`)`). TLS is issued by cert-manager (a Certificate → the `httpapi-<name>-tls`
# secret the IngressRoute references), since the ingress-shim that auto-issues from an Ingress
# annotation does not watch IngressRoutes. CORS / rate-limit / WAF / JWT-authorizer attach as an
# ordered per-route middleware chain.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: httpapi
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef: { apiVersion: openinfra.dev/v1, kind: XHttpApi }
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef: { name: crossplane-contrib-function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- /* `| default true` is WRONG for a bool: Sprig's default treats false as empty and
                   would force TLS on. Respect an explicit tls:false; default to true only when the
                   key is absent (the XRD default sets it, so absence is only the bare-template case). */ -}}
            {{- $tls := true }}
            {{- if hasKey $spec "tls" }}{{- $tls = $spec.tls }}{{- end }}
            {{- $waf := false }}
            {{- if hasKey $spec "waf" }}{{- $waf = $spec.waf }}{{- end }}
            {{- $cors := hasKey $spec "cors" }}
            {{- $rateLimit := hasKey $spec "rateLimit" }}
            {{- $authz := hasKey $spec "authorizer" }}
            {{- /* The ordered middleware chain applied to every route, as {name,namespace} refs:
                   CORS first (answer preflight before auth rejects the OPTIONS), then the JWT
                   authorizer, then the rate limit, then the WAF. Each is a per-API Middleware
                   rendered below. */}}
            {{- $mwnames := list }}
            {{- if $cors }}{{- $mwnames = append $mwnames (printf "httpapi-%s-cors" $name) }}{{- end }}
            {{- if $authz }}{{- $mwnames = append $mwnames (printf "httpapi-%s-authorizer" $name) }}{{- end }}
            {{- if $rateLimit }}{{- $mwnames = append $mwnames (printf "httpapi-%s-ratelimit" $name) }}{{- end }}
            {{- if $waf }}{{- $mwnames = append $mwnames (printf "httpapi-%s-waf" $name) }}{{- end }}
            {{- /* Each route backend is EXACTLY ONE of in-cluster (name) or external (url, the
                   HTTP_PROXY integration). Fail loud rather than render an empty/ambiguous target. */}}
            {{- range $spec.routes }}
            {{-   if and .backend.name .backend.url }}{{- fail "kind: HttpApi route backend: set backend.name OR backend.url, not both" }}{{- end }}
            {{-   if and (not .backend.name) (not .backend.url) }}{{- fail "kind: HttpApi route backend: set backend.name (in-cluster) or backend.url (external)" }}{{- end }}
            {{- end }}
            {{- /* Multi-domain: the primary domain plus any extras (the custom-domains equivalent) —
                   added to every route's Host match and to the TLS certificate SANs. */}}
            {{- $domains := list $spec.domain }}
            {{- range $d := ($spec.domains | default list) }}{{- $domains = append $domains $d }}{{- end }}
            {{- /* Base-path mapping: mount the whole API under a prefix and strip it before the
                   backend (so backends see their declared paths). The strip is the LAST middleware
                   in the chain — after auth/waf, which see the full incoming path. */}}
            {{- $basePath := $spec.basePath | default "" }}
            {{- if $basePath }}{{- $mwnames = append $mwnames (printf "httpapi-%s-stripbase" $name) }}{{- end }}
            {{- if $tls }}
            ---
            # --- TLS: cert-manager issues the cert into the secret the IngressRoute references.
            # (An IngressRoute is not watched by the ingress-shim, so the cert is requested
            # explicitly rather than via an Ingress annotation.) ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: certificate
            spec:
              forProvider:
                manifest:
                  apiVersion: cert-manager.io/v1
                  kind: Certificate
                  metadata:
                    name: httpapi-{{ $name }}-tls
                    namespace: {{ $ns }}
                  spec:
                    secretName: httpapi-{{ $name }}-tls
                    issuerRef: { name: openinfra-issuer, kind: ClusterIssuer }
                    dnsNames: [ {{ join ", " $domains }} ]
            {{- end }}
            ---
            # --- The API Gateway front door: one Traefik IngressRoute, one route per declared
            # route (Host + path + optional method match), each carrying the middleware chain. ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ingressroute
            spec:
              forProvider:
                manifest:
                  apiVersion: traefik.io/v1alpha1
                  kind: IngressRoute
                  metadata:
                    name: httpapi-{{ $name }}
                    namespace: {{ $ns }}
                    labels:
                      openinfra.dev/httpapi: {{ $name }}
                  spec:
                    entryPoints: [ {{ if $tls }}websecure{{ else }}web{{ end }} ]
                    routes:
                      {{- range $i, $route := $spec.routes }}
                      {{- /* Build the match: (Host||Host) && (PathPrefix|Path) && optional (Method || ...).
                             Path is prefixed by basePath (mounted under it); Host is an OR of all domains. */}}
                      {{- $hosts := list }}
                      {{- range $d := $domains }}{{- $hosts = append $hosts (printf "Host(`%s`)" $d) }}{{- end }}
                      {{- $m := index $hosts 0 }}
                      {{- if gt (len $hosts) 1 }}{{- $m = printf "(%s)" (join " || " $hosts) }}{{- end }}
                      {{- $pt := $route.pathType | default "Prefix" }}
                      {{- $rp := printf "%s%s" $basePath $route.path }}
                      {{- if eq $pt "Exact" }}{{- $m = printf "%s && Path(`%s`)" $m $rp }}
                      {{- else }}{{- $m = printf "%s && PathPrefix(`%s`)" $m $rp }}{{- end }}
                      {{- if $route.methods }}
                      {{-   $mm := list }}
                      {{-   range $meth := $route.methods }}{{- $mm = append $mm (printf "Method(`%s`)" $meth) }}{{- end }}
                      {{-   $m = printf "%s && (%s)" $m (join " || " $mm) }}
                      {{- end }}
                      {{- /* Request validation (required params): the route matches only when the
                             required headers/query params are present, so a request missing them never
                             reaches the backend (the API Gateway required-parameter validator). */}}
                      {{- range $h := ($route.requiredHeaders | default list) }}{{- $m = printf "%s && HeaderRegexp(`%s`, `.+`)" $m $h }}{{- end }}
                      {{- range $q := ($route.requiredQueryParams | default list) }}{{- $m = printf "%s && QueryRegexp(`%s`, `.+`)" $m $q }}{{- end }}
                      - kind: Rule
                        match: {{ $m | quote }}
                        services:
                          {{- if $route.backend.url }}
                          {{- /* External backend (HTTP_PROXY): forward to the per-route ExternalName
                                 Service rendered below. scheme + port are parsed from the origin URL. */}}
                          {{- $u := $route.backend.url }}
                          {{- $https := ne (trimPrefix "https://" $u) $u }}
                          {{- $parts := splitList ":" ($u | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/") }}
                          {{- $port := "80" }}{{- if $https }}{{- $port = "443" }}{{- end }}
                          {{- if gt (len $parts) 1 }}{{- $port = index $parts 1 }}{{- end }}
                          - name: httpapi-{{ $name }}-ext-{{ $i }}
                            port: {{ $port }}
                            scheme: {{ ternary "https" "http" $https }}
                            passHostHeader: false
                          {{- else }}
                          - name: {{ $route.backend.name }}
                            port: {{ $route.backend.port | default 80 }}
                          {{- end }}
                        {{- if $mwnames }}
                        middlewares:
                          {{- range $ref := $mwnames }}
                          - name: {{ $ref }}
                            namespace: {{ $ns }}
                          {{- end }}
                        {{- end }}
                      {{- end }}
                    {{- if $tls }}
                    tls:
                      secretName: httpapi-{{ $name }}-tls
                    {{- end }}
            {{- /* One ExternalName Service per external-URL route, so the IngressRoute can forward
                   to an origin outside the cluster (the HTTP_PROXY integration target). */}}
            {{- range $i, $route := $spec.routes }}
            {{- if $route.backend.url }}
            {{- $u := $route.backend.url }}
            {{- $https := ne (trimPrefix "https://" $u) $u }}
            {{- $parts := splitList ":" ($u | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/") }}
            {{- $host := index $parts 0 }}
            {{- $port := "80" }}{{- if $https }}{{- $port = "443" }}{{- end }}
            {{- if gt (len $parts) 1 }}{{- $port = index $parts 1 }}{{- end }}
            ---
            # External backend (HTTP_PROXY) for route {{ $i }} ({{ $route.path }}): an ExternalName
            # Service so the IngressRoute forwards to {{ $host }}:{{ $port }} outside the cluster.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ext-backend-{{ $i }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: httpapi-{{ $name }}-ext-{{ $i }}
                    namespace: {{ $ns }}
                  spec:
                    type: ExternalName
                    externalName: {{ $host }}
                    ports:
                      - port: {{ $port }}
                        targetPort: {{ $port }}
            {{- end }}
            {{- end }}
            {{- if $authz }}
            ---
            # JWT authorizer: a per-API Traefik JWT middleware that validates a Bearer OIDC token
            # against the issuer's JWKS before the request reaches a backend (pair with a
            # kind: UserPool as the issuer). Requires a JWT Traefik plugin enabled on the cluster
            # (see docs/api-gateway-coverage.md) — off until then, exactly like the WAF. Confirm the
            # plugin's config keys against the version you enable before trusting enforcement.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: authorizer-middleware
            spec:
              forProvider:
                manifest:
                  apiVersion: traefik.io/v1alpha1
                  kind: Middleware
                  metadata:
                    name: httpapi-{{ $name }}-authorizer
                    namespace: {{ $ns }}
                  spec:
                    plugin:
                      jwt:
                        Keys: [ "{{ $spec.authorizer.jwt.issuer }}/.well-known/jwks.json" ]
                        Issuers: [ "{{ $spec.authorizer.jwt.issuer }}" ]
                        {{- if $spec.authorizer.jwt.audience }}
                        Audiences: {{ $spec.authorizer.jwt.audience | toJson }}
                        {{- end }}
                        Required: {{ $spec.authorizer.jwt.required | default true }}
                        ForwardToken: true
            {{- end }}
            {{- if $waf }}
            ---
            # In-cluster L7 WAF: a per-API Traefik Coraza (OWASP CRS) middleware in this
            # namespace, referenced by the IngressRoute's route middlewares above.
            # Requires the `coraza` Traefik plugin enabled on the cluster (see
            # platform/networking/traefik-coraza.yaml + docs/api-gateway-coverage.md).
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: waf-middleware
            spec:
              forProvider:
                manifest:
                  apiVersion: traefik.io/v1alpha1
                  kind: Middleware
                  metadata:
                    name: httpapi-{{ $name }}-waf
                    namespace: {{ $ns }}
                  spec:
                    plugin:
                      coraza:
                        directives:
                          - "SecRuleEngine On"
                          - "Include @coraza.conf-recommended"
                          - "Include @crs-setup.conf.example"
                          - "Include @owasp_crs/*.conf"
            {{- end }}
            {{- if $cors }}
            ---
            # CORS: a Traefik headers middleware (the API Gateway CORS-equivalent) — answers
            # preflight and sets the Access-Control-* headers on responses. Built-in Traefik
            # middleware, no plugin needed.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cors-middleware
            spec:
              forProvider:
                manifest:
                  apiVersion: traefik.io/v1alpha1
                  kind: Middleware
                  metadata:
                    name: httpapi-{{ $name }}-cors
                    namespace: {{ $ns }}
                  spec:
                    headers:
                      accessControlAllowOriginList: {{ $spec.cors.allowOrigins | default (list "*") | toJson }}
                      accessControlAllowMethods: {{ $spec.cors.allowMethods | default (list "GET" "POST" "PUT" "PATCH" "DELETE" "OPTIONS") | toJson }}
                      accessControlAllowHeaders: {{ $spec.cors.allowHeaders | default (list "*") | toJson }}
                      accessControlMaxAge: {{ $spec.cors.maxAge | default 600 }}
                      accessControlAllowCredentials: {{ $spec.cors.allowCredentials | default false }}
                      addVaryHeader: true
            {{- end }}
            {{- if $rateLimit }}
            ---
            # Rate limit: a Traefik rateLimit middleware (the usage-plan / throttle-equivalent) —
            # a per-source token bucket. Built-in, no plugin needed.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ratelimit-middleware
            spec:
              forProvider:
                manifest:
                  apiVersion: traefik.io/v1alpha1
                  kind: Middleware
                  metadata:
                    name: httpapi-{{ $name }}-ratelimit
                    namespace: {{ $ns }}
                  spec:
                    rateLimit:
                      average: {{ $spec.rateLimit.average | default 100 }}
                      burst: {{ $spec.rateLimit.burst | default 50 }}
            {{- end }}
            {{- if $basePath }}
            ---
            # Base-path mapping: strip the API's mount prefix before the request reaches the backend,
            # so backends see their declared paths (the API Gateway base-path-mapping equivalent).
            # Last in the per-route middleware chain, so auth/waf still see the full incoming path.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: stripbase-middleware
            spec:
              forProvider:
                manifest:
                  apiVersion: traefik.io/v1alpha1
                  kind: Middleware
                  metadata:
                    name: httpapi-{{ $name }}-stripbase
                    namespace: {{ $ns }}
                  spec:
                    stripPrefix:
                      prefixes: [ "{{ $basePath }}" ]
            {{- end }}
    - step: ready
      functionRef: { name: crossplane-contrib-function-auto-ready }
