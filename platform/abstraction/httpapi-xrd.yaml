# kind: HttpApi — open-infra's "API Gateway": a hostname with path routes onto backends.
#
# API Gateway's job is to put an HTTP front door in front of functions/services and route by path.
# open-infra already has the pieces — Traefik ingress + cert-manager TLS + Knative Functions and
# Applications — so HttpApi is a thin, NATIVE composite over them: declare a domain and a list of
# path → backend routes, and the composition renders one Traefik Ingress. It is not an emulator and
# it is not the AWS API Gateway wire protocol (that management API can be fronted by the shim later,
# on top of this real backend); it is the genuine capability, expressed as a first-class kind.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xhttpapis.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "app"
    openinfra.dev/chaos-offers: "sql-session,http-invoke,enqueue,authz-probe"
    openinfra.dev/chaos-accepts: "authz-probe,stream-out"
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names: { kind: XHttpApi, plural: xhttpapis }
  claimNames: { kind: HttpApi, plural: httpapis }
  defaultCompositionRef: { name: httpapi }
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [domain, routes]
              properties:
                domain:
                  type: string
                  description: "Hostname the API is served on, e.g. api.example.com."
                tls:
                  type: boolean
                  default: true
                  description: "Terminate TLS via cert-manager (openinfra-issuer). Set false for plain HTTP."
                waf:
                  type: boolean
                  default: false
                  description: "Attach an in-cluster L7 WAF (Traefik Coraza / OWASP CRS) to this API's Ingress. Defense-in-depth for apps not fronted by a CDN WAF; requires the Coraza Traefik plugin to be enabled on the cluster (see docs/api-gateway-coverage.md). Off by default."
                cors:
                  type: object
                  description: "Enable CORS on the API (an API Gateway CORS-equivalent, via a Traefik headers middleware). Presence turns it on; all fields have sensible defaults."
                  properties:
                    allowOrigins:
                      type: array
                      items: { type: string }
                      description: "Allowed origins for Access-Control-Allow-Origin. Defaults to [\"*\"]."
                    allowMethods:
                      type: array
                      items: { type: string }
                      description: "Allowed methods. Defaults to [GET, POST, PUT, PATCH, DELETE, OPTIONS]."
                    allowHeaders:
                      type: array
                      items: { type: string }
                      description: "Allowed request headers. Defaults to [\"*\"]."
                    allowCredentials:
                      type: boolean
                      description: "Send Access-Control-Allow-Credentials: true. Defaults to false."
                    maxAge:
                      type: integer
                      description: "Preflight cache seconds (Access-Control-Max-Age). Defaults to 600."
                rateLimit:
                  type: object
                  description: "Throttle requests (an API Gateway usage-plan/throttle-equivalent, via a Traefik rateLimit middleware). Presence turns it on."
                  properties:
                    average:
                      type: integer
                      description: "Sustained requests per second allowed (token-bucket refill). Defaults to 100."
                    burst:
                      type: integer
                      description: "Max burst above the average. Defaults to 50."
                authorizer:
                  type: object
                  description: "A JWT authorizer (the API Gateway JWT-authorizer equivalent): validate a Bearer OIDC token against an issuer's JWKS before the request reaches a backend. Off unless set. Pair with a kind: UserPool as the issuer. Requires a JWT Traefik plugin enabled on the cluster (see docs/api-gateway-coverage.md), like the WAF — off until then."
                  properties:
                    jwt:
                      type: object
                      required: [issuer]
                      properties:
                        issuer:
                          type: string
                          description: "OIDC issuer URL (e.g. a UserPool's ISSUER_URL). Keys are fetched from <issuer>/.well-known/jwks.json."
                        audience:
                          type: array
                          items: { type: string }
                          description: "Accepted token audiences (the aud claim). Optional; when set, a token's aud must match."
                        required:
                          type: boolean
                          default: true
                          description: "Reject requests without a valid token (401). Set false to allow through and let the backend decide."
                routes:
                  type: array
                  description: "Path → backend routes, evaluated in order (put more specific paths first)."
                  minItems: 1
                  items:
                    type: object
                    required: [path, backend]
                    properties:
                      path:
                        type: string
                        description: "URL path to match, e.g. / or /users."
                      pathType:
                        type: string
                        default: Prefix
                        enum: [Prefix, Exact, ImplementationSpecific]
                        description: "Path match type. Prefix and ImplementationSpecific match a path prefix; Exact matches the whole path."
                      methods:
                        type: array
                        items:
                          type: string
                          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
                        description: "HTTP methods this route accepts (the API Gateway per-method route equivalent). Omit to accept all methods. A request whose method isn't listed doesn't match this route."
                      backend:
                        type: object
                        required: [name]
                        properties:
                          kind:
                            type: string
                            default: Function
                            enum: [Function, Application]
                            description: "The kind of backend this route targets (both expose an in-cluster Service named after the resource on port 80)."
                          name:
                            type: string
                            description: "Name of the backing kind: Function or kind: Application (same namespace as this HttpApi)."
                          port:
                            type: integer
                            default: 80
                            description: "Backend Service port. Functions and Applications both listen on 80."
            status:
              type: object
              properties:
                url:
                  type: string
                  description: "The public URL of the API (scheme + domain)."
