# IAMUserChangePassword (arn:aws:iam::aws:policy/IAMUserChangePassword)
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
    openinfra.dev/title: IAMUserChangePassword
  labels:
    openinfra.dev/aws-managed-policy: "true"
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: job-function
  name: aws-iamuserchangepassword
  namespace: open-infra-console
spec:
  arn: arn:aws:iam::aws:policy/IAMUserChangePassword
  dataPlane:
    statements:
      - actions:
          - iam:ChangePassword
        effect: Allow
        resources:
          - User::${aws:username}
      - actions:
          - iam:GetAccountPasswordPolicy
        effect: Allow
        resources:
          - '*'
  description: Provides the ability for an IAM user to change their own password.
  policyName: IAMUserChangePassword
  document:
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "iam:ChangePassword"
          ],
          "Resource": [
            "arn:aws:iam::*:user/${aws:username}"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "iam:GetAccountPasswordPolicy"
          ],
          "Resource": "*"
        }
      ]
    }
---
