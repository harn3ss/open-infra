# open-infra's "Bedrock": a second public API, kind: Model. Give it a model name
# and get a GPU-backed, OpenAI-compatible inference endpoint gated by a generated
# API key — provisioned the same way `kind: Application` provisions apps.
# KEEP THIS SCHEMA STABLE — it is part of the product's contract.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xmodels.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "function"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: "http-invoke,stream-out"
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names:
    kind: XModel
    plural: xmodels
  claimNames:
    kind: Model            # what users write in infra.yaml
    plural: models
  defaultCompositionRef:
    name: model
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                  description: "The model to serve, chosen from a curated catalog (allowlist). Each entry maps to a resource tier that sets CPU/RAM and GPU placement: qwen2.5:0.5b and llama3.2:1b run CPU-only; llama3.2:3b and llama3.1:8b request a small GPU (A2000 class); mixtral:8x7b requires a large GPU (3090 class)."
                  enum:
                    - qwen2.5:0.5b     # nano  · CPU-only · ultra-fast, tiny
                    - llama3.2:1b      # nano  · CPU-only
                    - llama3.2:3b      # small · GPU (A2000 class)
                    - llama3.1:8b      # standard · GPU (A2000 class)
                    - mixtral:8x7b     # large · requires a large GPU (3090 class)
                highAvailability: { type: boolean, default: false, description: "Run two replicas spread across separate nodes (pod anti-affinity), load-balanced so the endpoint survives a single node loss. If too few qualifying nodes are available the second replica stays Pending, degrading gracefully to one. Default false = a single replica." }
                domain:      { type: string, description: "Hostname to expose the key-gated inference endpoint on externally — open-infra provisions an Ingress and a cert-manager TLS certificate for it (e.g. llama.example.com)." }
                storageSize: { type: string, default: "20Gi", description: "Size limit for the ephemeral weight cache (an emptyDir). Weights are re-pulled each time a fresh pod starts, so this is scratch space, not persistent storage. Default 20Gi." }
                expose:      { type: boolean, default: false, description: "Also expose the inference endpoint on a LAN IP (a MetalLB LoadBalancer Service), so workstations can call the OpenAI-compatible API without DNS or Ingress. Default false = in-cluster only." }
            status:
              type: object
              properties:
                endpoint: { type: string }
                model:    { type: string }
