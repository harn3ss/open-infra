# The permission boundary for kind: Policy — the single source of truth.
#
# A kind: Policy may grant verbs ONLY on the openinfra.dev resources in `boundary`. This is
# a POLICY DECISION, deliberately NOT derived from "all XRDs minus IAM": deriving it would
# mean that adding any new XRD silently WIDENS the permission boundary as a side effect of
# an unrelated feature — precisely the thing a boundary exists to prevent.
#
# CI (TestPolicyBoundaryNoDrift in console-api) asserts:
#   1. (boundary MINUS shimResources) ∪ excluded == every XRD's claimNames.plural  (a new kind
#      fails the build until it is consciously placed in one list or the other)
#   2. boundary and excluded are disjoint; shimResources ⊆ boundary and name no XRD kind
#   3. the $known dict in policy-composition.yaml            ==  boundary   (compile-time drop)
#   4. the openinfra.dev resources in provider-setup.yaml    ==  boundary   (API-server fence)
#   5. policyResources in console-api/cmd/server/iam_policies.go == boundary (BFF validation)
#
# `boundary` is what a Policy may grant on. Most entries are XRD claim plurals (a kind you can
# write). A FEW are `shimResources`: aws-shim front-door authz scopes that have NO XRD — they
# exist only as coarse Cedar/RBAC types at the shim. They are grantable (so they are in
# `boundary`, enforced in all four mirrors), but assertion 1 subtracts them before the
# XRD-coverage check, so they neither demand nor pretend to be a kind.
#
# Change the boundary HERE, then run `go test ./...` in console-api; it will name every file
# that still disagrees. There is no generator — the other four stay hand-authored and the
# test just refuses to let them drift.

boundary:
  - applications
  - functions
  - models
  - virtualmachines
  - vmimages
  - volumes
  - fileshares
  - directories
  - migrations
  - replications
  - dataflows
  - streams
  - securitygroups
  - faultinjections
  - queries
  - httpapis
  - graphqlapis
  - databaseproxies
  - statemachines
  - trainingjobs
  - modelpackages
  - batchtransforms
  - processingjobs
  - modelmonitors
  - scheduledjobs
  - autoscalinggroups
  - featuregroups
  - staticsites
  - parameters
  - emailsenders
  - tables
  - buckets
  - queues
  - backupplans
  - backupvaults
  - configrules
  # shimResources (below) — grantable, but not XRDs:
  - repositories
  - secrets

# shim-only coarse authz types: in `boundary` (grantable, and mirrored into $known /
# provider-setup / policyResources like any boundary entry) but backed by NO XRD. They are the
# aws-shim front doors that were split off the shared "applications" gate so neither grant leaks
# into the other (#345.6 / #347.0.2). Assertion 1 subtracts these before comparing boundary to
# the XRD claim plurals. Keep this list TINY and reasoned — each entry is something a Policy can
# grant with no corresponding kind, so it must earn its place.
shimResources:
  - repositories: "ECR front door (registry login / push / pull). Its own coarse type so a registry grant does not also read Secrets Manager."
  - secrets:      "Secrets Manager front door. Scopes to secrets.openinfra.dev — NEVER core k8s Secrets, since the Policy composition hardcodes apiGroups:[openinfra.dev]. Its own coarse type so a secret grant does not also reach the registry."

# Kinds a Policy may NOT grant on, each with the reason it is excluded. Exhaustive on
# purpose: every XRD must appear in exactly one of these two lists, so a new kind cannot be
# silently in or out.
excluded:
  - users:    "identity object — a Policy granting on it would be privilege escalation"
  - groups:   "identity object — a Policy granting on it would be privilege escalation"
  - policies: "a Policy that could grant on Policies could widen its own boundary"
  - roles:    "a Role is what binds the boundary to a person — granting on it escalates"
  - grants:   "a Grant confers a Role for a time — granting on it is temporal privilege escalation"
  - dataclassifications: "a data-categorization scheme is set centrally by the security team, not grantable to projects"
  - encryptionkeys: "a customer-owned encryption key is a KMS object — granting on it is a path to the data it protects"
  - destructions: "a Destruction crypto-erases data irreversibly — never grantable; a deliberate admin act"
  - certificateauthorities: "a private CA is a trust-minting authority — `update` on it IS the cert issue/revoke capability (ca-issuer), so granting on it is a path to forging trusted certs; keep it admin-gated like encryptionkeys"
  - userpools: "a UserPool is a customer-facing identity provider that issues tokens — granting on it is a path to minting identities the platform trusts; keep it admin-gated like certificateauthorities"
  - identityproviders: "an IdentityProvider registers an external OIDC issuer the platform TRUSTS for AssumeRoleWithWebIdentity — granting on it is a path to trusting an attacker-controlled issuer and minting assumable identities; keep it admin-gated like userpools"
