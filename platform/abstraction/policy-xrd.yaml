# open-infra's "IAM policies": kind: Policy — an attachable permission document, like an
# AWS managed policy. You author it once and attach it to Users, Groups and Roles; it grants
# nothing until attached.
#
# spec.document is the AWS IAM policy document itself and the one source of truth: the same
# evaluator reads it at every door. The AWS managed policies ship as kind: Policy objects
# carrying AWS's names, ARNs and documents (platform/abstraction/managed-policies/). The
# statements / dataPlane / controlPlane blocks described below are the earlier forms, read for
# one more release.
#
# THE PERMISSION BOUNDARY. A Policy can only ever grant verbs on the platform's own
# resources (the openinfra.dev API group). That is enforced structurally: the composition
# hardcodes apiGroups: [openinfra.dev] into every rule it emits, so a Policy CANNOT express
# a grant on secrets, RBAC, or anything else — there is no field in which to say it. This is
# the open-infra equivalent of an AWS permission boundary, and it is why no `escalate`
# privilege is needed anywhere: the compiled ClusterRole never exceeds what the rendering
# identity already holds. See docs/iam.md.
#
# Actions are `<resource>:<verb>`, e.g. `virtualmachines:Get` or `volumes:*`, where the
# resource is an openinfra.dev plural and the verb is Get/List/Watch/Create/Update/Patch/
# Delete or `*`. effect here is Allow only — RBAC cannot express Deny. To express a Deny (or a
# conditional Allow), put the statement in controlPlane.statements or dataPlane.statements, which
# are Cedar-backed and accept effect: Deny with AWS-style precedence (an explicit Deny overrides
# Allow). Do NOT read "Allow-only" as a gap to close by adding Deny here: a Deny compiled to RBAC
# cannot deny, so it would silently fail OPEN — route Denies to the Cedar blocks instead.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpolicies.iam.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "none"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: iam.openinfra.dev
  names:
    kind: XPolicy
    plural: xpolicies
  claimNames:
    kind: Policy
    plural: policies
  defaultCompositionRef:
    name: policy
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                  description: What this policy is for, shown in the console.
                policyName:
                  type: string
                  maxLength: 128
                  description: >-
                    The policy's IAM name (AWS's PolicyName), when it is not the object's name: an AWS
                    managed policy keeps AWS's name (PowerUserAccess) while its object is
                    aws-poweruseraccess. Defaults to the object's name.
                arn:
                  type: string
                  pattern: '^arn:aws:iam::(aws|[0-9]{12}):policy/.+$'
                  description: >-
                    The policy's ARN. An AWS managed policy carries AWS's
                    (arn:aws:iam::aws:policy[/path]/<Name>), which is how a principal attaches it — by ARN, as
                    on AWS. A customer policy's ARN is its account's (arn:aws:iam::<account>:policy/<name>)
                    and need not be set.
                document:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  required: [Statement]
                  properties:
                    Version:
                      type: string
                      enum: ["2012-10-17", "2008-10-17"]
                    Id:
                      type: string
                    Statement:
                      x-kubernetes-preserve-unknown-fields: true
                      description: One statement object or a list of them (Effect, Action/NotAction, Resource/NotResource, Condition), as AWS accepts.
                  description: >-
                    THE SOURCE OF TRUTH: the AWS IAM policy document — {"Version": "2012-10-17", "Statement":
                    [...]} with Effect, Action/NotAction, Resource/NotResource and Condition — stored as
                    written (JSON is YAML, so it can be pasted as is). One evaluator reads it for every door:
                    the aws-shim, the console and the Kubernetes RBAC the IAM compiler generates from it.
                    Explicit Deny wins over Allow; a condition key that cannot be evaluated never widens a
                    grant (an Allow carrying it is dropped and reported, a Deny applies unconditionally). A
                    Policy with a document renders no ClusterRole of its own. The statements, dataPlane and
                    controlPlane blocks below are the earlier forms, read for one more release and rewritten
                    into a document by scripts/iam-migrate.
                statements:
                  type: array
                  description: >-
                    Control-plane Allow statements — compiled to a Kubernetes ClusterRole over the
                    openinfra.dev API group (the permission boundary). Optional: a data-plane-only
                    policy may omit these and carry only a dataPlane block.
                  items:
                    type: object
                    properties:
                      effect:
                        type: string
                        enum: [Allow]
                        default: Allow
                        description: "Only Allow — this block compiles to a Kubernetes ClusterRole (RBAC), which cannot express Deny. To Deny (or conditionally Allow), put the statement in controlPlane.statements or dataPlane.statements (Cedar), where effect accepts Deny with AWS-style precedence. A Deny added here would silently fail open. See docs/iam.md."
                      actions:
                        type: array
                        description: >-
                          <resource>:<verb> pairs over openinfra.dev, e.g.
                          "virtualmachines:*", "volumes:Get". resource may be "*"
                          (all openinfra.dev kinds); verb may be "*" (all verbs).
                        items:
                          type: string
                      resources:
                        type: array
                        description: >-
                          Reserved for future object-name scoping. Kubernetes RBAC cannot
                          restrict list/watch by name, so today this is effectively ["*"] —
                          set it for forward-compatibility and documentation.
                        items:
                          type: string
                        default: ["*"]
                    required: [actions]
                dataPlane:
                  type: object
                  description: >-
                    Fine-grained DATA-PLANE authorization for the aws-shim front doors — the services
                    the shim enforces (today 17: s3, dynamodb, lambda, sqs, sns, kinesis, kms, ssm,
                    secretsmanager, ecr, ecs, logs, rds, ses, apigateway, cloudwatch, cloudfront, plus ec2's
                    Elastic IP address actions; the authoritative set is policyengine.SupportedServices and
                    SupportedActions), evaluated by the Cedar-backed policy engine.
                    Unlike the control-plane
                    statements above, it supports explicit Deny (which overrides Allow) and request
                    conditions — the model Kubernetes RBAC cannot express. Additive: it can only
                    tighten a grant the coarse RBAC check already allowed. See docs/policy-engine.md.
                  properties:
                    appliesTo:
                      type: array
                      description: >-
                        Principals these statements govern — "User::<name>", "Group::<name>",
                        "Role::<name>" (an assumed sts:AssumeRole session — see role-xrd.yaml), or
                        "*". This is the INLINE/direct axis (a Policy names its own principals). The
                        MANAGED axis is the reverse: a principal names this Policy in its
                        spec.policies (kind: Role/User), which confers the same dataPlane authority —
                        one policy world, resolved together by internal/dataplaneauthz.
                      items:
                        type: string
                    statements:
                      type: array
                      items:
                        type: object
                        required: [effect]
                        properties:
                          effect:
                            type: string
                            enum: [Allow, Deny]
                            description: Allow or Deny. An explicit Deny overrides any Allow (AWS-style precedence).
                          actions:
                            type: array
                            description: >-
                              Data-plane actions, e.g. "s3:GetObject", "dynamodb:Query",
                              "lambda:InvokeFunction", or "*". A statement sets EITHER actions OR
                              notActions (not both); omitting both means "any action".
                            items:
                              type: string
                          notActions:
                            type: array
                            description: >-
                              The complement of actions (AWS NotAction): matches every data-plane action
                              EXCEPT these, e.g. notActions ["s3:DeleteObject"] grants all s3 actions but
                              delete. Mutually exclusive with actions (a statement setting both is rejected,
                              fail closed). An entry for a service the shim does not front is a harmless
                              no-op carve-out; a lone "*" excludes everything (the statement then matches
                              nothing). On a Deny, "deny everything except X" is a broad forbid — author
                              with care.
                            items:
                              type: string
                          resources:
                            type: array
                            description: >-
                              Typed resources, e.g. "Bucket::assets", "Table::orders",
                              "Function::worker", or "*". A statement sets EITHER resources OR
                              notResources (not both); omitting both means "any resource".
                            items:
                              type: string
                          notResources:
                            type: array
                            description: >-
                              The complement of resources (AWS NotResource): matches every resource EXCEPT
                              these, e.g. notResources ["Bucket::secret"] scopes to all buckets but that one.
                              Mutually exclusive with resources (both set is rejected, fail closed). A lone
                              "*" excludes everything (matches nothing). Each entry must be Type::id or a
                              wildcard; an unmappable exclusion is refused at import rather than silently
                              widening the grant.
                            items:
                              type: string
                          condition:
                            type: object
                            description: >-
                              Request-context equality conditions (e.g. sourceIp, authenticated).
                              Values "true"/"false" are matched as booleans. Optional.
                            additionalProperties:
                              type: string
                          ipConditions:
                            type: array
                            description: >-
                              Source-IP CIDR conditions (the aws:SourceIp equivalent the AWS importer
                              emits from IpAddress/NotIpAddress), evaluated via the policy engine's
                              ipaddr extension. Each requires the request source IP to be in (negate
                              false) or not in (negate true) the CIDR. On a Deny statement these fail
                              CLOSED: an absent or unparseable source IP DENIES rather than letting the
                              forbid evaporate. key must be a request attribute the shim populates
                              (today: "sourceIp"). Optional.
                            items:
                              type: object
                              required: [key, cidr]
                              properties:
                                key:
                                  type: string
                                  description: The request-context attribute to test, e.g. "sourceIp".
                                cidr:
                                  type: string
                                  description: An IPv4/IPv6 CIDR (a bare address is treated as /32), e.g. "10.0.0.0/8".
                                negate:
                                  type: boolean
                                  default: false
                                  description: true = NotIpAddress (the source must NOT be in the CIDR).
                          likeConditions:
                            type: array
                            description: >-
                              Wildcard string conditions (the aws:username StringLike/StringNotLike
                              equivalent the AWS importer emits), evaluated via the policy engine's
                              `like` match. Each requires the request attribute to match (negate false)
                              or not match (negate true) the pattern, where "*" is any run of characters.
                              On a Deny statement these fail CLOSED: an absent attribute DENIES rather
                              than letting the forbid evaporate. key must be a request attribute the shim
                              populates (today: "username"). Optional.
                            items:
                              type: object
                              required: [key, pattern]
                              properties:
                                key:
                                  type: string
                                  description: The request-context attribute to test, e.g. "username".
                                pattern:
                                  type: string
                                  description: A Cedar `like` pattern; "*" matches any run of characters, e.g. "admin-*".
                                negate:
                                  type: boolean
                                  default: false
                                  description: true = StringNotLike (the attribute must NOT match the pattern).
                          timeConditions:
                            type: array
                            description: >-
                              Datetime window conditions (the aws:CurrentTime Date{Greater,Less}Than
                              [Equals] equivalent the AWS importer emits), evaluated via the policy
                              engine's datetime extension. Each requires the request attribute, compared
                              as a datetime, to satisfy op against target. On a Deny statement these fail
                              CLOSED: an absent or unparseable attribute DENIES rather than letting the
                              forbid evaporate. key must be a request attribute the shim populates
                              (today: "currentTime"). Optional.
                            items:
                              type: object
                              required: [key, op, target]
                              properties:
                                key:
                                  type: string
                                  description: The request-context datetime attribute to test, e.g. "currentTime".
                                op:
                                  type: string
                                  enum: ["<", "<=", ">", ">="]
                                  description: >-
                                    The datetime comparison: "<" (DateLessThan), "<=" (DateLessThanEquals),
                                    ">" (DateGreaterThan), ">=" (DateGreaterThanEquals).
                                target:
                                  type: string
                                  description: >-
                                    A Cedar-parseable datetime the attribute is compared against, e.g.
                                    "2025-01-01T00:00:00Z".
                          keyConditions:
                            type: array
                            description: >-
                              Conditions on request attributes AWS leaves out of some requests on purpose —
                              the multi-factor keys the AWS importer emits from aws:MultiFactorAuthPresent
                              (Bool / BoolIfExists) and aws:MultiFactorAuthAge (Numeric* and their IfExists
                              forms), and Null on either. An absent attribute is evaluated as AWS does: it
                              does not match a plain operator, matches an IfExists or negated one, and Null
                              true tests for it. key is "multiFactorAuthPresent" (present on every temporary
                              credential, absent for long-term access keys) or "multiFactorAuthAge" (the
                              seconds since MFA, present only with MFA). A malformed entry makes the policy
                              fail to compile (it then grants nothing). Optional.
                            items:
                              type: object
                              required: [key, op, value]
                              properties:
                                key:
                                  type: string
                                  description: The request-context attribute, e.g. "multiFactorAuthPresent".
                                op:
                                  type: string
                                  enum: ["==", "!=", "<", "<=", ">", ">=", "null"]
                                  description: >-
                                    The comparison: "==" (Bool, NumericEquals), "!=" (NumericNotEquals),
                                    "<" "<=" ">" ">=" (NumericLessThan[Equals], NumericGreaterThan[Equals]),
                                    or "null" (Null).
                                value:
                                  type: string
                                  description: '"true" or "false" for a boolean (and for null), an integer for a number.'
                                ifExists:
                                  type: boolean
                                  default: false
                                  description: true = the operator's IfExists form (an absent attribute matches).
                controlPlane:
                  type: object
                  description: >-
                    Fine-grained CONTROL-PLANE authorization (Kubernetes API access), evaluated by
                    the Cedar authorization webhook (docs/authz-webhook.md). Same Cedar model as
                    dataPlane — explicit Deny overrides Allow, plus conditions — over a control-plane
                    vocabulary: a k8s verb is the action; the resource is "<resource>.<group>" scoped
                    by "::<namespace>/<name>" (or "::*"); a non-resource URL is "NonResourceURL::<path>".
                    Read by the webhook; NOT compiled to RBAC. This is Phase 2 (shadow first).
                  properties:
                    appliesTo:
                      type: array
                      description: >-
                        Principals these statements govern — "User::<name>", "Group::<name>",
                        "ServiceAccount::<namespace>/<name>", or "*".
                      items:
                        type: string
                    statements:
                      type: array
                      items:
                        type: object
                        required: [effect, actions]
                        properties:
                          effect:
                            type: string
                            enum: [Allow, Deny]
                            description: Allow or Deny. An explicit Deny overrides any Allow.
                          actions:
                            type: array
                            description: >-
                              k8s verbs, e.g. "get", "list", "watch", "create", "update", "delete",
                              or "*".
                            items:
                              type: string
                          resources:
                            type: array
                            description: >-
                              Typed resources, e.g. "databases.openinfra.dev::team-a/*",
                              "secrets::kube-system/*", "NonResourceURL::/healthz", or "*".
                            items:
                              type: string
                          condition:
                            type: object
                            description: Request-context equality conditions. Optional.
                            additionalProperties:
                              type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                clusterRole:
                  type: string
                  description: The ClusterRole this policy compiled to (a policy with only statements; a document policy has none).
                ruleCount:
                  type: integer
                  description: How many RBAC rules it produced.
                arn:
                  type: string
                  description: The policy's ARN, when it carries one (spec.arn).
                compiled:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: >-
                    What the IAM compiler made of spec.document: ok, or the statements it dropped and why
                    (a condition it cannot evaluate, a NotAction/NotResource Kubernetes RBAC cannot express).
                    Written by the compiler.
      additionalPrinterColumns:
        - name: Rules
          type: integer
          jsonPath: .status.ruleCount
        - name: Ready
          type: boolean
          jsonPath: .status.ready
