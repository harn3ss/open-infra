# open-infra's "IAM policies": kind: Policy — an attachable permission document, like an
# AWS managed policy. You author it once and attach it to Roles; it grants nothing until
# attached.
#
# THE PERMISSION BOUNDARY. A Policy can only ever grant verbs on the platform's own
# resources (the openinfra.dev API group). That is enforced structurally: the composition
# hardcodes apiGroups: [openinfra.dev] into every rule it emits, so a Policy CANNOT express
# a grant on secrets, RBAC, or anything else — there is no field in which to say it. This is
# the open-infra equivalent of an AWS permission boundary, and it is why no `escalate`
# privilege is needed anywhere: the compiled ClusterRole never exceeds what the rendering
# identity already holds. See docs/iam.md.
#
# Actions are `<resource>:<verb>`, e.g. `virtualmachines:Get` or `volumes:*`, where the
# resource is an openinfra.dev plural and the verb is Get/List/Watch/Create/Update/Patch/
# Delete or `*`. effect is Allow only — Deny is a later, admission-time concern (Stage 3),
# not something RBAC can express.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpolicies.iam.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "none"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: iam.openinfra.dev
  names:
    kind: XPolicy
    plural: xpolicies
  claimNames:
    kind: Policy
    plural: policies
  defaultCompositionRef:
    name: policy
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                  description: What this policy is for, shown in the console.
                statements:
                  type: array
                  description: >-
                    Control-plane Allow statements — compiled to a Kubernetes ClusterRole over the
                    openinfra.dev API group (the permission boundary). Optional: a data-plane-only
                    policy may omit these and carry only a dataPlane block.
                  items:
                    type: object
                    properties:
                      effect:
                        type: string
                        enum: [Allow]
                        default: Allow
                        description: Only Allow — RBAC cannot express Deny (see docs/iam.md).
                      actions:
                        type: array
                        description: >-
                          <resource>:<verb> pairs over openinfra.dev, e.g.
                          "virtualmachines:*", "volumes:Get". resource may be "*"
                          (all openinfra.dev kinds); verb may be "*" (all verbs).
                        items:
                          type: string
                      resources:
                        type: array
                        description: >-
                          Reserved for future object-name scoping. Kubernetes RBAC cannot
                          restrict list/watch by name, so today this is effectively ["*"] —
                          set it for forward-compatibility and documentation.
                        items:
                          type: string
                        default: ["*"]
                    required: [actions]
                dataPlane:
                  type: object
                  description: >-
                    Fine-grained DATA-PLANE authorization for the aws-shim front doors (S3, DynamoDB,
                    Lambda), evaluated by the Cedar-backed policy engine. Unlike the control-plane
                    statements above, it supports explicit Deny (which overrides Allow) and request
                    conditions — the model Kubernetes RBAC cannot express. Additive: it can only
                    tighten a grant the coarse RBAC check already allowed. See docs/policy-engine.md.
                  properties:
                    appliesTo:
                      type: array
                      description: >-
                        Principals these statements govern — "User::<name>", "Group::<name>", or "*".
                      items:
                        type: string
                    statements:
                      type: array
                      items:
                        type: object
                        required: [effect, actions]
                        properties:
                          effect:
                            type: string
                            enum: [Allow, Deny]
                            description: Allow or Deny. An explicit Deny overrides any Allow (AWS-style precedence).
                          actions:
                            type: array
                            description: >-
                              Data-plane actions, e.g. "s3:GetObject", "dynamodb:Query",
                              "lambda:InvokeFunction", or "*".
                            items:
                              type: string
                          resources:
                            type: array
                            description: >-
                              Typed resources, e.g. "Bucket::assets", "Table::orders",
                              "Function::worker", or "*".
                            items:
                              type: string
                          condition:
                            type: object
                            description: >-
                              Request-context equality conditions (e.g. sourceIp, authenticated).
                              Values "true"/"false" are matched as booleans. Optional.
                            additionalProperties:
                              type: string
                controlPlane:
                  type: object
                  description: >-
                    Fine-grained CONTROL-PLANE authorization (Kubernetes API access), evaluated by
                    the Cedar authorization webhook (docs/authz-webhook.md). Same Cedar model as
                    dataPlane — explicit Deny overrides Allow, plus conditions — over a control-plane
                    vocabulary: a k8s verb is the action; the resource is "<resource>.<group>" scoped
                    by "::<namespace>/<name>" (or "::*"); a non-resource URL is "NonResourceURL::<path>".
                    Read by the webhook; NOT compiled to RBAC. This is Phase 2 (shadow first).
                  properties:
                    appliesTo:
                      type: array
                      description: >-
                        Principals these statements govern — "User::<name>", "Group::<name>",
                        "ServiceAccount::<namespace>/<name>", or "*".
                      items:
                        type: string
                    statements:
                      type: array
                      items:
                        type: object
                        required: [effect, actions]
                        properties:
                          effect:
                            type: string
                            enum: [Allow, Deny]
                            description: Allow or Deny. An explicit Deny overrides any Allow.
                          actions:
                            type: array
                            description: >-
                              k8s verbs, e.g. "get", "list", "watch", "create", "update", "delete",
                              or "*".
                            items:
                              type: string
                          resources:
                            type: array
                            description: >-
                              Typed resources, e.g. "databases.openinfra.dev::team-a/*",
                              "secrets::kube-system/*", "NonResourceURL::/healthz", or "*".
                            items:
                              type: string
                          condition:
                            type: object
                            description: Request-context equality conditions. Optional.
                            additionalProperties:
                              type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                clusterRole:
                  type: string
                  description: The ClusterRole this policy compiled to.
                ruleCount:
                  type: integer
                  description: How many RBAC rules it produced.
      additionalPrinterColumns:
        - name: Rules
          type: integer
          jsonPath: .status.ruleCount
        - name: Ready
          type: boolean
          jsonPath: .status.ready
