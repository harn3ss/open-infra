# The compiler for kind: ProcessingJob -> a run-once, GPU-capable data-processing Job.
# It renders a bucket-setup Job (ensures every input/output bucket exists + writes a
# <name>-minio creds secret, the pre-defined openinfra-bucket-setup identity) and the
# processing batch/v1 Job: the user's container with each named channel injected as
# INPUT_<NAME>_BUCKET/PREFIX and OUTPUT_<NAME>_BUCKET/PREFIX + S3 credentials. Same
# run-once + GPU pattern as kind: TrainingJob / BatchTransform, but N inputs and N outputs.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: processingjob
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XProcessingJob
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec }}
            {{- $labels := $xr.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default $xr.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- $job := printf "%s-proc" $name }}
            {{- $gpu := 0 }}{{- if hasKey $spec "gpu" }}{{- $gpu = $spec.gpu }}{{- end }}
            {{- $useGpu := gt $gpu 0 }}
            {{- $tier := $spec.gpuTier | default "smallgpu" }}
            {{- $cpu := $spec.cpu | default "2" }}
            {{- $mem := $spec.memory | default "4Gi" }}
            {{- $inputs := $spec.inputs | default (list) }}
            {{- $outputs := $spec.outputs | default (list) }}
            {{- $buckets := list }}
            {{- range $i := $inputs }}{{- if $i.bucket }}{{- $buckets = append $buckets $i.bucket }}{{- end }}{{- end }}
            {{- range $o := $outputs }}{{- if $o.bucket }}{{- $buckets = append $buckets $o.bucket }}{{- end }}{{- end }}
            {{- $hasBuckets := gt (len $buckets) 0 }}
            {{- if $hasBuckets }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-setup
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata: { name: {{ $name }}-proc-bucket-setup, namespace: minio }
                  spec:
                    backoffLimit: 20
                    ttlSecondsAfterFinished: 600
                    template:
                      spec:
                        serviceAccountName: openinfra-bucket-setup
                        restartPolicy: OnFailure
                        volumes:
                          - { name: mc, emptyDir: {} }
                        initContainers:
                          # Bring `mc` in OFFLINE (copied from its image) — for bucket creation
                          # AND minting the scoped per-app user/policy (#151 faults 1+3).
                          - name: fetch-mc
                            image: quay.io/minio/mc:latest
                            command: [sh, -c, "cp /usr/bin/mc /mc/mc && chmod +x /mc/mc"]
                            volumeMounts: [{ name: mc, mountPath: /mc }]
                        containers:
                          - name: setup
                            image: alpine/k8s:1.30.0
                            volumeMounts: [{ name: mc, mountPath: /mc }]
                            env:
                              # Root provisions ONLY (create buckets + mint the scoped user);
                              # it is never written into the app secret (#151 fault 3).
                              - name: ROOT_USER
                                valueFrom: { secretKeyRef: { name: minio, key: rootUser } }
                              - name: ROOT_PASS
                                valueFrom: { secretKeyRef: { name: minio, key: rootPassword } }
                            command: ["/bin/sh", "-c"]
                            args:
                              - |
                                set -e
                                MC=/mc/mc
                                E=http://minio.minio.svc.cluster.local:9000
                                # alias set validates root up front — a rotated/wrong root key fails
                                # HERE, loud, instead of a false-green (#151 faults 1+2).
                                "$MC" alias set m "$E" "$ROOT_USER" "$ROOT_PASS" >/dev/null
                                # 1. Create each bucket idempotently but FAIL LOUD (#151 fault 1).
                                for b in {{ range $buckets }}{{ . }} {{ end }}; do
                                  "$MC" mb --ignore-existing "m/$b"
                                  echo "bucket $b ready"
                                done
                                # 2. Mint a PER-APP, NON-root user scoped to ONLY these buckets (#151 fault 3);
                                #    reuse the existing key across re-syncs so app creds stay stable.
                                APPUSER="app-{{ $name }}"
                                SK=$(kubectl get secret {{ $name }}-minio -n {{ $ns }} -o jsonpath='{.data.MINIO_SECRET_KEY}' 2>/dev/null | base64 -d || true)
                                [ -n "$SK" ] || SK=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
                                "$MC" admin user add m "$APPUSER" "$SK" >/dev/null
                                RES=""
                                for b in {{ range $buckets }}{{ . }} {{ end }}; do
                                  RES="$RES\"arn:aws:s3:::$b\",\"arn:aws:s3:::$b/*\","
                                done
                                printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":[%s]}]}' "${RES%,}" > /tmp/pol.json
                                "$MC" admin policy create m "$APPUSER" /tmp/pol.json >/dev/null 2>&1 \
                                  || "$MC" admin policy info m "$APPUSER" >/dev/null 2>&1 \
                                  || { echo "policy create failed for $APPUSER" >&2; exit 1; }
                                "$MC" admin policy attach m "$APPUSER" --user "$APPUSER" >/dev/null 2>&1 || true
                                # 3. Hand the app ITS OWN scoped creds — never the root key.
                                kubectl create secret generic {{ $name }}-minio -n {{ $ns }} \
                                  --from-literal=MINIO_ENDPOINT=$E \
                                  --from-literal=MINIO_ACCESS_KEY="$APPUSER" \
                                  --from-literal=MINIO_SECRET_KEY="$SK" \
                                  --dry-run=client -o yaml | kubectl apply -f -
            {{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: proc
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $job }}
                    namespace: {{ $ns }}
                    labels: { app.kubernetes.io/name: {{ $name }}, openinfra.dev/processingjob: {{ $name }} }
                  spec:
                    backoffLimit: {{ $spec.backoffLimit | default 0 }}
                    {{- if $spec.maxRuntimeSeconds }}
                    activeDeadlineSeconds: {{ $spec.maxRuntimeSeconds }}
                    {{- end }}
                    template:
                      metadata: { labels: { app.kubernetes.io/name: {{ $name }}, openinfra.dev/processingjob: {{ $name }} } }
                      spec:
                        restartPolicy: Never
                        {{- if $useGpu }}
                        runtimeClassName: nvidia
                        affinity:
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: openinfra.dev/gpu-tier
                                      operator: In
                                      {{- if eq $tier "largegpu" }}
                                      values: [large]
                                      {{- else }}
                                      values: [small, large]
                                      {{- end }}
                            {{- if eq $tier "smallgpu" }}
                            preferredDuringSchedulingIgnoredDuringExecution:
                              - weight: 100
                                preference:
                                  matchExpressions:
                                    - { key: openinfra.dev/gpu-tier, operator: In, values: [small] }
                            {{- end }}
                        {{- end }}
                        containers:
                          - name: process
                            image: {{ $spec.image }}
                            {{- if $spec.command }}
                            command: {{ $spec.command | toJson }}
                            {{- end }}
                            {{- if $spec.args }}
                            args: {{ $spec.args | toJson }}
                            {{- end }}
                            env:
                              {{- range $e := ($spec.env | default (list)) }}
                              - { name: {{ $e.name | quote }}, value: {{ $e.value | quote }} }
                              {{- end }}
                              {{- $innames := list }}
                              {{- range $i := $inputs }}
                              {{-   $N := $i.name | upper | regexReplaceAll "[^A-Z0-9]" "_" }}
                              {{-   $innames = append $innames $i.name }}
                              - { name: "INPUT_{{ $N }}_BUCKET", value: {{ $i.bucket | quote }} }
                              - { name: "INPUT_{{ $N }}_PREFIX", value: {{ $i.prefix | default "" | quote }} }
                              {{- end }}
                              {{- $outnames := list }}
                              {{- range $o := $outputs }}
                              {{-   $N := $o.name | upper | regexReplaceAll "[^A-Z0-9]" "_" }}
                              {{-   $outnames = append $outnames $o.name }}
                              - { name: "OUTPUT_{{ $N }}_BUCKET", value: {{ $o.bucket | quote }} }
                              - { name: "OUTPUT_{{ $N }}_PREFIX", value: {{ $o.prefix | default "" | quote }} }
                              {{- end }}
                              - { name: INPUTS, value: {{ join "," $innames | quote }} }
                              - { name: OUTPUTS, value: {{ join "," $outnames | quote }} }
                              {{- if $hasBuckets }}
                              - { name: AWS_ENDPOINT_URL, value: "http://minio.minio.svc.cluster.local:9000" }
                              - { name: AWS_DEFAULT_REGION, value: "us-east-1" }
                              - name: AWS_ACCESS_KEY_ID
                                valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_ACCESS_KEY } }
                              - name: AWS_SECRET_ACCESS_KEY
                                valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_SECRET_KEY } }
                              {{- end }}
                            {{- $envFrom := $spec.secrets | default (list) }}
                            {{- if gt (len $envFrom) 0 }}
                            envFrom:
                              {{- range $s := $envFrom }}
                              - secretRef: { name: {{ $s | quote }} }
                              {{- end }}
                            {{- end }}
                            resources:
                              requests: { cpu: 250m, memory: 512Mi }
                              limits:
                                cpu: "{{ $cpu }}"
                                memory: {{ $mem | quote }}
                                {{- if $useGpu }}
                                nvidia.com/gpu: {{ $gpu }}
                                {{- end }}
            ---
            apiVersion: openinfra.dev/v1
            kind: XProcessingJob
            status:
              jobName: {{ $job }}
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
