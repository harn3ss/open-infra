# What provider-kubernetes needs to actually create resources from a Composition:
#   1. a ProviderConfig telling it to use its own in-cluster identity, and
#   2. RBAC granting that identity permission to manage the composed resources.
#
# RBAC is bound to the provider's fixed ServiceAccount name provider-kubernetes (set by the
# DeploymentRuntimeConfig below, so it survives provider upgrades), never to the crossplane-system
# ServiceAccount group: that group holds every reconciler, every function pod and `default`, and this
# role (clusterrole bind/escalate, clusterrolebinding create) is cluster-admin-equivalent.
# Applied after Crossplane + the provider install (sync-wave 2); SkipDryRun so it
# applies even before the ProviderConfig CRD is registered.
---
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: InjectedIdentity
---
# provider-kubernetes runs as the fixed ServiceAccount name provider-kubernetes rather than the
# revision-hashed one, so its grants below are bound to that one identity (not to every ServiceAccount
# in crossplane-system) and survive provider upgrades. The Provider itself is installed by the
# Crossplane chart (crossplane.yaml, provider.packages: its init creates it only when absent); declaring
# it here adds the runtime config. Keep the package in step with crossplane.yaml.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: openinfra-provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
  # --enable-watches: an Object with spec.watch: true has its observed state refreshed when the resource
  # changes, not only on the provider's slow drift poll (about 10 minutes). Only Objects that opt in are
  # watched — a step a composition waits on (an encrypted VM root's image import and copy).
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              args: ["--enable-watches"]
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.14.1
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: openinfra-provider-kubernetes
---
# Least-privilege-ish: only the resource kinds the Application Composition emits.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    # serviceaccounts: an Application with spec.assumeRole (workload identity, #111) runs under a
    # dedicated SA the composition creates, so the provider must be able to manage them.
    # pods: an encrypted VM root is filled by a bare copy Pod (vm-composition.yaml, root-populate). No new
    # power: the provider already creates Deployments, StatefulSets, DaemonSets and Jobs.
    resources: [services, configmaps, secrets, serviceaccounts, resourcequotas, limitranges, persistentvolumeclaims, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # kube-ovn Vpc/Subnet: kind: Vpc and kind: Subnet (#120) compile to kubeovn.io objects the
  # provider manages — real OVN-enforced topological isolation (the AWS VPC/subnet model).
  # The NAT family backs kind: NatGateway (the border device) and kind: ElasticIp (public IP +
  # DNAT/FIP association) — the AWS EIP + NAT/Internet-Gateway surface (#120).
  - apiGroups: [kubeovn.io]
    resources: [vpcs, subnets, vpc-nat-gateways, iptables-eips, iptables-dnat-rules, iptables-snat-rules, iptables-fip-rules]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, update, patch, delete]
  # MariaDB for the managed MySQL engine (mariadb-operator). Without this the provider
  # cannot create/observe the MariaDB CR and mysql databases never provision. The operator
  # owns the StatefulSet/User/Database/Services from the MariaDB spec.
  - apiGroups: [k8s.mariadb.com]
    resources: [mariadbs]
    verbs: [get, list, watch, create, update, patch, delete]
  # kind: Group compiles to a ClusterRoleBinding, so the provider must be able to
  # create them. This is an escalation vector — anything that can create a binding
  # can grant any role it is permitted to bind — so it is deliberately fenced:
  #   * bindings themselves: full management, but
  #   * the `bind` verb is restricted by resourceNames to the three console roles.
  # Kubernetes requires `bind` (or holding the role's permissions outright) to
  # reference a ClusterRole in a binding, so this list is the hard ceiling on what
  # a kind: Group can ever grant. Adding a role here widens that ceiling — do it
  # deliberately, and never add cluster-admin.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames:
      - open-infra-console
      - open-infra-poweruser
      - open-infra-readonly

  # kind: Policy / kind: Role compile to ClusterRoles (a labelled one per Policy, an
  # aggregated one per Role), so the provider must be able to write ClusterRoles.
  #
  # THE PERMISSION BOUNDARY. Kubernetes refuses to let you create a ClusterRole granting
  # verbs you do not already hold — unless you hold `escalate`. The provider is granted
  # exactly the openinfra.dev product surface below, and the Policy composition hardcodes
  # apiGroups: [openinfra.dev] into every rule and drops anything outside a 15-resource
  # whitelist. So a Policy can only ever grant a subset of the product surface; a rule
  # outside the boundary is unrepresentable, and even if one were forged the API server
  # would refuse the create. This is the open-infra analogue of an AWS permission boundary.
  #
  # `escalate` on clusterroles IS granted — but only because kind: Role compiles to an
  # AGGREGATED ClusterRole, and Kubernetes requires escalate to create ANY role carrying an
  # aggregationRule (a rule separate from, and not satisfied by, the boundary above). This
  # is deliberately bounded-harmless, and the bound is the `bind` verb, NOT escalate:
  #   * `bind` is resourceName-fenced to the three built-in roles (see above), and
  #   * the provider holds no secrets/RBAC/etc., only the openinfra.dev surface.
  # So even with escalate, the provider can CREATE a ClusterRole granting anything, but it
  # can only BIND to a user a role whose permissions it already holds (i.e. within the
  # openinfra.dev boundary) or one of the three fenced names. Escalate widens what roles can
  # be *created*, never what can be *granted to a person*. Keep it that way: never add a
  # privileged role to the bind resourceNames, and never grant this SA secrets/RBAC verbs.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [get, list, watch, create, update, patch, delete, escalate]
  - apiGroups: [openinfra.dev]
    resources:
      - applications
      - functions
      - models
      - virtualmachines
      - vmimages
      - volumes
      - fileshares
      - directories
      - migrations
      - replications
      - dataflows
      - streams
      - securitygroups
      - faultinjections
      - queries
      - httpapis
      - graphqlapis
      - databaseproxies
      - statemachines
      - trainingjobs
      - modelpackages
      - batchtransforms
      - processingjobs
      - modelmonitors
      - scheduledjobs
      - autoscalinggroups
      - featuregroups
      - staticsites
      - parameters
      - emailsenders
      - tables
      - buckets
      - queues
      - backupplans
      - backupvaults
      - configrules
      # shimResources — ECR / Secrets Manager coarse authz types (no XRD). Held here so the
      # compile-fence (create a ClusterRole granting only verbs you hold) admits a Policy that
      # grants on them; see platform/abstraction/policy-boundary.yaml (#345.6 / #347.0.2).
      - repositories
      - secrets
    verbs: [get, list, watch, create, update, patch, delete]

  # Knative Services for the kind: Function (serverless) abstraction.
  - apiGroups: [serving.knative.dev]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  # Jobs + CronJobs: bucket-setup jobs, and the kind: ModelMonitor scheduled CronJob.
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  # VirtualMachines for the kind: VirtualMachine (EC2) abstraction. KubeVirt's own
  # controller creates the backing DataVolume/VMI from dataVolumeTemplates, so the
  # provider only manages the VirtualMachine itself (datavolumes listed for safety).
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines, virtualmachineinstances]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes]
    verbs: [get, list, watch, create, update, patch, delete]
  # kind: AutoScalingGroup compiles to a VirtualMachinePool; the pool controller creates the
  # member VirtualMachines/DataVolumes, so the provider only manages the pool itself.
  - apiGroups: [pool.kubevirt.io]
    resources: [virtualmachinepools]
    verbs: [get, list, watch, create, update, patch, delete]
  # kind: BackupVault -> a Velero BackupStorageLocation; kind: BackupPlan -> Velero Schedules
  # (AWS Backup). The provider manages those objects in the velero namespace.
  - apiGroups: [velero.io]
    resources: [backupstoragelocations, schedules]
    verbs: [get, list, watch, create, update, patch, delete]
  # kind: ConfigRule -> a Kyverno ClusterPolicy (AWS Config; needs the opt-in `compliance` component
  # installed for the CRD to exist + a corpus regen like velero.io, #270).
  - apiGroups: [kyverno.io]
    resources: [clusterpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # Chaos Mesh experiments for the kind: FaultInjection (Fault Injection Simulator).
  - apiGroups: [chaos-mesh.org]
    resources: [podchaos, networkchaos, stresschaos, timechaos, iochaos, schedules]
    verbs: [get, list, watch, create, update, patch, delete]
  # cert-manager Certificates for the babelfish managed DB's TDS/PG TLS.
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  # Traefik Middlewares + IngressRoutes for kind: HttpApi (the front-door IngressRoute with
  # per-method routing, plus the CORS / rate-limit / WAF / JWT-authorizer middlewares).
  - apiGroups: [traefik.io]
    resources: [middlewares, ingressroutes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openinfra-provider-kubernetes
subjects:
  # provider-kubernetes's fixed ServiceAccount name (DeploymentRuntimeConfig above) — it alone.
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
---
# provider-kubernetes's own system permissions (its CRDs, finalizers, events/leases/secrets), the rules
# Crossplane's rbac-manager generates per package revision and binds to whatever ServiceAccount the
# provider Deployment runs as. Declared here as well, bound to the fixed name, so the identity holds them
# — and the regenerated control-plane corpus grants them — before the provider first runs under it,
# rather than only once rbac-manager has caught up. Keep in step with the generated
# crossplane:provider:crossplane-contrib-provider-kubernetes-<rev>:system ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-provider-kubernetes-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [kubernetes.crossplane.io]
    resources: [objects, objects/status, observedobjectcollections, observedobjectcollections/status,
      providerconfigs, providerconfigs/status, providerconfigusages, providerconfigusages/status]
    verbs: [get, list, watch, update, patch, create]
  - apiGroups: [kubernetes.crossplane.io]
    resources: ["*/finalizers"]
    verbs: [update]
  - apiGroups: ["", coordination.k8s.io]
    resources: [secrets, configmaps, events, leases]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-provider-kubernetes-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openinfra-provider-kubernetes-system
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
---
# A dedicated namespace holding the platform-side scoped-credential Secrets the setup Jobs write, and
# the bucket-owner records. The setup SA's secret access is a Role bound here only — so it cannot read
# the minio namespace's own Secrets (minio-kes-*, the KES/root keys) even though its Jobs run there to
# read MinIO root via env. Credentials reach a claim namespace only as a provider-copied, GC'd Secret.
apiVersion: v1
kind: Namespace
metadata:
  name: openinfra-bucket-creds
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# Identity used by every bucket-setup Job (Bucket, StaticSite, Application storage.buckets + db-backup,
# and the ML kinds) to provision the bucket, mint the scoped MinIO user, and write that user's key to a
# platform-side Secret in openinfra-bucket-creds. The Job runs in the minio namespace (to read the MinIO
# root secret via env); its only secret RBAC is the Role in openinfra-bucket-creds below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openinfra-bucket-setup
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
---
# Bucket ownership, shared by every bucket-setup Job (Bucket, StaticSite, Application storage.buckets
# and the ML kinds). Each Job mounts this script and calls `claim_bucket <bucket>` for every bucket
# before it creates, configures or grants anything.
#
# Bucket names are global, so a bucket belongs to the claim that created it. The record is a Secret
# bucket-owner-<bucket> in the openinfra-bucket-creds namespace, which tenants cannot write. It is
# created atomically before the bucket, so two claims racing for one name cannot both win. A claim from
# another namespace (or another claim in the same namespace) that names the bucket fails its Job: no
# policy, no credentials. Platform buckets are never handed to a claim.
#
# A bucket that exists with no record predates these records. It is adopted only if it was created
# after this claim's composite, i.e. by this claim's own earlier setup. An older one is refused until
# an admin records its owner; the refusal prints the command.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openinfra-bucket-ownership
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
data:
  bucket-ownership.sh: |
    # Sourced by POSIX sh. Needs E (the MinIO endpoint), MinIO root in AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY or ROOT_USER / ROOT_PASS, and OWNER_NS, OWNER_REF and XR_CREATED (the
    # claim's namespace, <Kind>/<namespace>/<name>, and its composite's creationTimestamp).
    # Platform buckets are owned by the platform itself and never handed to a claim. Keep in step with
    # the buckets platform components create: velero (platform/backup), lakehouse + query-data +
    # query-results (platform/query), db-snapshots (managed-DB WAL + DynamoDB PITR), openinfra-audit
    # (the WORM audit store), ecr-registry (the image registry), and longhorn (Longhorn's volume backups).
    PLATFORM_BUCKETS="velero lakehouse query-data query-results db-snapshots openinfra-audit ecr-registry longhorn"
    # Owner records (and the platform-side scoped-credential Secrets) live here, not in the minio
    # namespace, so the setup SA needs no secret access to the minio namespace's own keys.
    OWN_NS="${OWN_NS:-openinfra-bucket-creds}"

    oi_refuse() { echo "BucketAlreadyExists: $*" >&2; exit 1; }

    oi_epoch() { date -u -d "$(printf '%.19s' "$1" | tr T ' ')" +%s 2>/dev/null; }

    # The bucket's creation time, or "None" if it does not exist.
    oi_bucket_created() {
      AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-$ROOT_USER}" AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-$ROOT_PASS}" \
        AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}" \
        aws --endpoint-url "$E" s3api list-buckets --query "Buckets[?Name=='$1'].CreationDate | [0]" --output text
    }

    # oi_bucket_empty <bucket>: true when the bucket holds no objects, prior versions or delete markers. A
    # bucket that no longer exists holds nothing (a stack delete removes the bucket before the reaper
    # removes its record).
    oi_bucket_empty() {
      if ! out=$(AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-$ROOT_USER}" AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-$ROOT_PASS}" \
          AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}" \
          aws --endpoint-url "$E" s3api list-object-versions --bucket "$1" --max-items 1 --output json 2>&1); then
        case "$out" in *NoSuchBucket*) return 0 ;; esac
        echo "cannot list bucket $1: $out" >&2; exit 1
      fi
      ! printf '%s' "$out" | grep -q '"Key"'
    }

    # oi_plural <Kind>: the resource of a claim kind whose setup runs here ("" for any other kind).
    oi_plural() {
      case "$1" in
        Bucket) echo buckets ;; StaticSite) echo staticsites ;; Application) echo applications ;;
        Model) echo models ;; TrainingJob) echo trainingjobs ;; ProcessingJob) echo processingjobs ;;
        BatchTransform) echo batchtransforms ;; ModelMonitor) echo modelmonitors ;; *) echo "" ;;
      esac
    }

    # oi_claim_superseded: true only when it is CERTAIN that the claim instance this setup was rendered
    # for (OWNER_REF, composite created at XR_CREATED) is gone: the claim or its composite is NotFound, or
    # the claim now has a different composite (it was deleted and created again). A setup pod can outlive
    # its claim — provider-kubernetes deletes a Job without a propagation policy, which orphans the Job's
    # pod, and an orphan keeps retrying (restartPolicy OnFailure) — and it must never re-create a deleted
    # claim's bucket, owner record or credentials. Any doubt (no identity, another kind, an API error such
    # as a missing grant, a claim not bound yet) is "not superseded": the setup carries on as before.
    # (POSIX sh has no `local`: every variable here is oi_-prefixed so a caller's — claim_bucket's $b —
    # survives the call.)
    oi_claim_superseded() {
      oi_ref="${OWNER_REF:-}"
      oi_kind=${oi_ref%%/*}; oi_rest=${oi_ref#*/}; oi_cns=${oi_rest%%/*}; oi_cname=${oi_rest#*/}
      oi_pl=$(oi_plural "$oi_kind")
      [ -n "$oi_pl" ] && [ "$oi_rest" != "$oi_ref" ] && [ "$oi_cname" != "$oi_rest" ] && [ -n "$oi_cns" ] && [ -n "$oi_cname" ] || return 1
      oi_err="${TMPDIR:-/tmp}/oi-claim-err.$$"
      if ! oi_xr=$(kubectl get "$oi_pl.openinfra.dev" "$oi_cname" -n "$oi_cns" -o jsonpath='{.spec.resourceRef.name}' 2>"$oi_err"); then
        grep -q NotFound "$oi_err" 2>/dev/null; oi_r=$?; rm -f "$oi_err"; return $oi_r
      fi
      [ -n "$oi_xr" ] || { rm -f "$oi_err"; return 1; }
      if ! oi_made=$(kubectl get "x$oi_pl.openinfra.dev" "$oi_xr" -o jsonpath='{.metadata.creationTimestamp}' 2>"$oi_err"); then
        grep -q NotFound "$oi_err" 2>/dev/null; oi_r=$?; rm -f "$oi_err"; return $oi_r
      fi
      rm -f "$oi_err"
      [ -n "${XR_CREATED:-}" ] && [ -n "$oi_made" ] || return 1
      oi_t1=$(oi_epoch "$oi_made") && oi_t2=$(oi_epoch "$XR_CREATED") && [ -n "$oi_t1" ] && [ -n "$oi_t2" ] || return 1
      [ "$oi_t1" -ne "$oi_t2" ]
    }

    # oi_require_claim: ends the setup — successfully, having created nothing — when its claim instance is
    # certainly gone (oi_claim_superseded). Called before anything is recorded, created or minted.
    oi_require_claim() {
      if oi_claim_superseded; then
        echo "$OWNER_REF (created ${XR_CREATED:-?}) no longer exists, or was created again as a new instance: this setup creates nothing"
        exit 0
      fi
    }

    # oi_set_instance <record>: record which instance of the owning claim (its composite's creation time)
    # the bucket belongs to.
    oi_set_instance() {
      [ -n "$XR_CREATED" ] || return 0
      kubectl patch secret "$1" -n "$OWN_NS" --type merge -p "{\"stringData\":{\"instance\":\"$XR_CREATED\"}}" >/dev/null \
        || { echo "cannot update the owner record $1" >&2; exit 1; }
    }

    # Returns only when bucket $1 is (now) this namespace's; otherwise exits the Job.
    claim_bucket() {
      b="$1"
      case "$b" in '' | *[!a-z0-9.-]*) oi_refuse "invalid bucket name '$b'" ;; esac
      for p in $PLATFORM_BUCKETS; do
        [ "$b" != "$p" ] || oi_refuse "bucket $b is a platform bucket; $OWNER_REF cannot use it"
      done
      [ -n "$OWNER_NS" ] && [ -n "$OWNER_REF" ] || { echo "claim_bucket: OWNER_NS and OWNER_REF must be set" >&2; exit 1; }
      oi_require_claim
      rec="bucket-owner-$b"
      for _ in 1 2 3; do
        # The record carries both the owning claim's identity (owner=<Kind>/<ns>/<name>) and its
        # namespace. Match on the full identity: a bucket belongs to the one claim that created it, not
        # to its whole namespace — otherwise two claims in a shared namespace (every CloudFormation
        # stack lives in open-infra-cfn) could adopt each other's bucket by naming it. A legacy record
        # that predates the owner field falls back to the namespace check.
        if ! rawowner=$(kubectl get secret "$rec" -n "$OWN_NS" --ignore-not-found -o jsonpath='{.data.owner}'); then
          echo "cannot read the owner record of bucket $b" >&2; exit 1
        fi
        if ! rawns=$(kubectl get secret "$rec" -n "$OWN_NS" --ignore-not-found -o jsonpath='{.data.namespace}'); then
          echo "cannot read the owner record of bucket $b" >&2; exit 1
        fi
        if [ -n "$rawowner" ]; then
          owner=$(printf '%s' "$rawowner" | base64 -d)
          if [ "$owner" = "$OWNER_REF" ]; then
            # The record also names the claim INSTANCE (its composite's creation time). A claim deleted
            # and created again under the same name is a new instance: on AWS a re-created stack gets a
            # new, empty bucket, so the earlier instance's data never carries over. An empty bucket is
            # simply taken over; one that still holds data is refused. A record from before instances
            # were recorded is upgraded in place.
            if ! rawinst=$(kubectl get secret "$rec" -n "$OWN_NS" --ignore-not-found -o jsonpath='{.data.instance}'); then
              echo "cannot read the owner record of bucket $b" >&2; exit 1
            fi
            inst=$(printf '%s' "$rawinst" | base64 -d)
            if [ -z "$inst" ] || [ -z "$XR_CREATED" ] || [ "$inst" = "$XR_CREATED" ]; then
              [ -n "$inst" ] || oi_set_instance "$rec"
              echo "bucket $b belongs to $OWNER_REF"
              return 0
            fi
            # A stack delete removes the bucket itself; its record lingers until the reaper's next pass,
            # and the reaper never removes it once the claim exists again. A bucket that is gone is taken
            # over (this setup then creates it), like an empty one.
            if ! made=$(oi_bucket_created "$b"); then
              echo "cannot list buckets to check $b" >&2; exit 1
            fi
            if [ -z "$made" ] || [ "$made" = "None" ]; then
              oi_set_instance "$rec"
              echo "bucket $b of an earlier $OWNER_REF no longer exists; its record is taken over by this one"
              return 0
            fi
            if oi_bucket_empty "$b"; then
              oi_set_instance "$rec"
              echo "bucket $b belonged to an earlier $OWNER_REF and is empty; taken over by this one"
              return 0
            fi
            oi_refuse "bucket $b still holds data from an earlier $OWNER_REF (created $inst), which was deleted;" \
              "a new claim of the same name never inherits it. Empty the bucket (the setup then takes it over)," \
              "or have an admin remove it."
          fi
          # A kind: Bucket claim is the bucket itself (AWS::S3::Bucket), so it may only be its own. A
          # claim that USES a bucket (a StaticSite serving it — a CloudFront origin —, an Application's
          # storage, an ML job's output) may use one another claim in the same namespace owns, as anything
          # in one AWS account may; the record stays the owner's.
          case "$OWNER_REF" in
            Bucket/*) ;;
            *)
              if [ -n "$rawns" ] && [ "$(printf '%s' "$rawns" | base64 -d)" = "$OWNER_NS" ]; then
                echo "bucket $b belongs to $owner; $OWNER_REF uses it from the same namespace"
                return 0
              fi ;;
          esac
          oi_refuse "bucket $b belongs to another claim ($owner); $OWNER_REF cannot use it"
        elif [ -n "$rawns" ]; then
          owner=$(printf '%s' "$rawns" | base64 -d)
          if [ "$owner" = "$OWNER_NS" ]; then
            echo "bucket $b belongs to namespace $OWNER_NS"
            return 0
          fi
          oi_refuse "bucket $b belongs to another namespace ($owner); $OWNER_REF cannot use it"
        fi
        if ! made=$(oi_bucket_created "$b"); then
          echo "cannot list buckets to check $b" >&2; exit 1
        fi
        if [ -n "$made" ] && [ "$made" != "None" ]; then
          m=$(oi_epoch "$made") || m=""
          x=$(oi_epoch "$XR_CREATED") || x=""
          if [ -z "$m" ] || [ -z "$x" ] || [ "$m" -lt "$x" ]; then
            oi_refuse "bucket $b exists, has no owner record and predates $OWNER_REF." \
              "Adopt it ONLY after confirming who the bucket really belongs to — do not assume it is this" \
              "claim. If $OWNER_REF is genuinely its owner, an admin records that with:" \
              "kubectl -n $OWN_NS create secret generic $rec --from-literal=namespace=$OWNER_NS --from-literal=owner=$OWNER_REF" \
              "&& kubectl -n $OWN_NS label secret $rec openinfra.dev/bucket-owner=true" \
              "(set namespace/owner to the TRUE owner if it is a different claim)."
          fi
        fi
        if out=$(kubectl create secret generic "$rec" -n "$OWN_NS" --from-literal=namespace="$OWNER_NS" --from-literal=owner="$OWNER_REF" --from-literal=instance="$XR_CREATED" --dry-run=client -o yaml \
            | kubectl label --local -f - openinfra.dev/bucket-owner=true -o yaml | kubectl create -f - 2>&1); then
          echo "bucket $b recorded as owned by $OWNER_REF"
          return 0
        fi
        case "$out" in
          *AlreadyExists*) ;; # another claim recorded it first: read the record again
          *) echo "cannot record the owner of bucket $b: $out" >&2; exit 1 ;;
        esac
      done
      echo "the owner of bucket $b did not settle" >&2
      exit 1
    }

    # mint_scoped_user <user> <policy-json-file>: ensure the scoped MinIO user exists with a key held in
    # a PLATFORM-side Secret (openinfra-bucket-creds/<user>) — the Job never writes a credential into a
    # claim namespace (a provider Object copies it out and GCs it with the claim). Needs MC set and the
    # `m` alias configured. The legacy rule: if the user exists but has no platform Secret yet, its key
    # is only in the claim's own Secret (which this Job can no longer read) — NEVER rotate it; the
    # one-time migration seeds the platform Secret, after which the claim Secret becomes a managed copy.
    mint_scoped_user() {
      user="$1"; polfile="$2"
      oi_require_claim
      sk=$(kubectl get secret "$user" -n "$OWN_NS" -o jsonpath='{.data.MINIO_SECRET_KEY}' 2>/dev/null | base64 -d || true)
      # Credentials left by an EARLIER instance of this claim (deleted and created again under the same
      # name): rotate them. A re-created stack gets new credentials on AWS too, and taking them over here
      # (rather than leaving them to the bucket reaper) means a re-create never races the reaper's sweep.
      # Earlier = marked with another instance, or — written before Secrets were marked — created before
      # this instance's composite (this instance's own Secret is always newer than its composite). An
      # unmarked Secret whose age cannot be read is left as it is.
      if [ -n "$sk" ] && [ -n "${XR_CREATED:-}" ]; then
        was=$(kubectl get secret "$user" -n "$OWN_NS" -o jsonpath='{.metadata.annotations.openinfra\.dev/instance}' 2>/dev/null || true)
        if [ -z "$was" ]; then
          sc=$(kubectl get secret "$user" -n "$OWN_NS" -o jsonpath='{.metadata.creationTimestamp}' 2>/dev/null || true)
          st=""; xt=""
          [ -n "$sc" ] && st=$(oi_epoch "$sc") && xt=$(oi_epoch "$XR_CREATED") || true
          if [ -n "$st" ] && [ -n "$xt" ] && [ "$st" -lt "$xt" ]; then
            was="$sc (unmarked)"
          fi
        fi
        if [ -n "$was" ] && [ "$was" != "$XR_CREATED" ]; then
          sk=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
          kubectl create secret generic "$user" -n "$OWN_NS" \
            --from-literal=MINIO_ACCESS_KEY="$user" --from-literal=MINIO_SECRET_KEY="$sk" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null
          oi_mark_creds "$user"
          echo "rotated the credentials $user left by an earlier $OWNER_REF (created $was)"
        fi
      fi
      if [ -n "$sk" ]; then
        "$MC" admin user add m "$user" "$sk" >/dev/null                     # platform creds exist: same key, no rotation
      elif "$MC" admin user info m "$user" >/dev/null 2>&1; then
        echo "legacy user $user: platform creds not yet seeded (migration pending); leaving the password unchanged"
      else
        sk=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)  # new: write platform Secret FIRST, then the user
        kubectl create secret generic "$user" -n "$OWN_NS" \
          --from-literal=MINIO_ACCESS_KEY="$user" --from-literal=MINIO_SECRET_KEY="$sk" \
          --dry-run=client -o yaml | kubectl apply -f -
        "$MC" admin user add m "$user" "$sk" >/dev/null
      fi
      "$MC" admin policy create m "$user" "$polfile" >/dev/null 2>&1 \
        || "$MC" admin policy info m "$user" >/dev/null 2>&1 \
        || { echo "policy create failed for $user" >&2; exit 1; }
      "$MC" admin policy attach m "$user" --user "$user" >/dev/null 2>&1 || true
      oi_mark_creds "$user"
    }

    # oi_mark_creds <user>: name the claim instance a platform-side credentials Secret belongs to, so the
    # bucket reaper (platform/abstraction/bucket-reaper.yaml) removes the user and the Secret once that
    # claim is deleted. A legacy user with no platform Secret yet has nothing to mark.
    oi_mark_creds() {
      kubectl get secret "$1" -n "$OWN_NS" >/dev/null 2>&1 || return 0
      kubectl label secret "$1" -n "$OWN_NS" openinfra.dev/scoped-creds=true --overwrite >/dev/null \
        && kubectl annotate secret "$1" -n "$OWN_NS" openinfra.dev/owner="$OWNER_REF" openinfra.dev/instance="$XR_CREATED" --overwrite >/dev/null \
        || echo "warning: could not mark the platform credentials of $1 with their claim; the reaper will not remove them" >&2
    }
---
# The setup SA's ONLY secret access: owner records + platform-side scoped-credential Secrets, in the
# openinfra-bucket-creds namespace. No longer a cluster-wide ClusterRole — the Job never writes into a
# claim namespace (a provider Object copies the credential out), and it cannot read the minio namespace's
# own Secrets. The claim-side <name>-minio Secret is written by provider-kubernetes, which already holds
# the cluster-wide secret grant it needs for that copy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openinfra-bucket-setup
  namespace: openinfra-bucket-creds
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openinfra-bucket-setup
  namespace: openinfra-bucket-creds
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openinfra-bucket-setup
subjects:
  - kind: ServiceAccount
    name: openinfra-bucket-setup
    namespace: minio
---
# Read-only: whether the claim a setup runs for (and which instance of it) still exists, so a setup pod
# that outlived its claim creates nothing (oi_require_claim in bucket-ownership.sh). The same reads the
# bucket reaper has; get only, never list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-bucket-setup-claims
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [openinfra.dev]
    resources: [buckets, staticsites, applications, models, trainingjobs, processingjobs, batchtransforms, modelmonitors,
      xbuckets, xstaticsites, xapplications, xmodels, xtrainingjobs, xprocessingjobs, xbatchtransforms, xmodelmonitors]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-bucket-setup-claims
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: openinfra-bucket-setup-claims }
subjects: [{ kind: ServiceAccount, name: openinfra-bucket-setup, namespace: minio }]
