# The compiler for kind: Queue. A setup Job in the nats namespace creates/updates the JetStream
# stream (an initContainer with the nats CLI — internal NATS is no-auth) and writes the per-queue
# connection Secret (<name>-queue) into the claim namespace (the openinfra-queue-setup SA).
#
# The Job name carries a hash of the mutable spec (retention + max-bytes), so changing either
# re-runs the setup rather than being a no-op on an immutable Job. fanout/retention policy is fixed
# at creation (JetStream cannot change a stream's retention policy in place).
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: queue
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XQueue
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- $q := $spec.queueName | default $name }}
            {{- $ret := $spec.retentionHours | default 96 }}
            {{- $retpolicy := "work" }}{{- if $spec.fanout }}{{ $retpolicy = "limits" }}{{- end }}
            {{- $maxbytes := "" }}{{- if $spec.maxBytes }}{{ $maxbytes = printf "--max-bytes %d" (int $spec.maxBytes) }}{{- else }}{{ $maxbytes = "--max-bytes=-1" }}{{- end }}
            {{- /* FIFO (#116): a per-group subject wildcard (<q>.>) so each MessageGroupId is its own
                   ordered subject (parallel across groups), and a 5m dedup window matching SQS FIFO. */}}
            {{- $fifo := $spec.fifo | default false }}
            {{- $subjects := $q }}{{- if $fifo }}{{ $subjects = printf "%s,%s.>" $q $q }}{{- end }}
            {{- $dupwin := "2m" }}{{- if $fifo }}{{ $dupwin = printf "%dm" (int ($spec.deduplicationWindowMinutes | default 5)) }}{{- end }}
            {{- $hash := (printf "%s|%d|%s|%v|%s" $retpolicy (int $ret) $maxbytes $fifo $dupwin) | sha256sum | trunc 10 }}
            ---
            # The stream-init Job talks to NATS over the network only — it needs no Kubernetes secret
            # access. Readiness keys off the Job's own success (object.status.succeeded), so there is no
            # need to write a Secret as a completion marker. The connection Secret (credential-less) is
            # rendered directly as a composed resource below, so it is GC'd with the claim.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: queue-setup
            spec:
              readiness: { policy: DeriveFromCelQuery, celQuery: "has(object.status.succeeded) && object.status.succeeded > 0" }
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata: { name: {{ $name }}-queue-{{ $hash }}, namespace: nats }
                  spec:
                    backoffLimit: 20
                    # No ttlSecondsAfterFinished: provider-kubernetes recreates a TTL-GC'd managed Job
                    # → infinite re-run loop; the finished Job persists as its done-marker (see bucket-composition.yaml).
                    template:
                      spec:
                        serviceAccountName: openinfra-queue-setup
                        restartPolicy: OnFailure
                        containers:
                          - name: stream
                            image: ghcr.io/harn3ss/open-infra-nats-box@sha256:40719f9bd2f77e14db7a7741abd07f90e983d46bdf78cb884b61a92fb96c4780
                            command: [/bin/sh, -ceu]
                            args:
                              - |
                                S=nats://nats.nats.svc.cluster.local:4222
                                if nats --server $S stream info {{ $q }} >/dev/null 2>&1; then
                                  nats --server $S stream edit {{ $q }} --subjects '{{ $subjects }}' --max-age {{ $ret }}h {{ $maxbytes }} --dupe-window {{ $dupwin }} -f
                                else
                                  nats --server $S stream add {{ $q }} --subjects '{{ $subjects }}' --storage file --retention {{ $retpolicy }} --max-age {{ $ret }}h {{ $maxbytes }} --discard old --dupe-window {{ $dupwin }} --replicas 1 --defaults
                                fi
                                echo "stream {{ $q }} ready ({{ $retpolicy }}, {{ $ret }}h, fifo={{ $fifo }}, dupe-window {{ $dupwin }})"
            ---
            # The connection Secret is credential-less (NATS is no-auth in-cluster), so it is rendered
            # directly by the provider — no setup Job writes it, so the queue SA needs no secret access —
            # and it is a composed resource, deleted with the claim.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: queue-conn
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  type: Opaque
                  metadata: { name: {{ $name }}-queue, namespace: {{ $ns }} }
                  stringData:
                    NATS_URL: nats://nats.nats.svc.cluster.local:4222
                    QUEUE_STREAM: {{ $q }}
                    QUEUE_SUBJECT: {{ $q }}
                    QUEUE_FIFO: "{{ $fifo }}"
            ---
            apiVersion: openinfra.dev/v1
            kind: XQueue
            status:
              ready: true
              stream: {{ $q | quote }}
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
