# The kind: Queue stream-init Job runs as this ServiceAccount (in the nats namespace, next to NATS).
# It talks to NATS over the network only and writes no Kubernetes object, so it holds NO RBAC: the
# connection Secret is now rendered directly by provider-kubernetes as a composed resource (see
# queue-composition.yaml), not written by the Job. The previous cluster-wide secrets ClusterRole is
# gone — nothing the Job does needs it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openinfra-queue-setup
  namespace: nats
