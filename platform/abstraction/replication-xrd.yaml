# open-infra's bidirectional / multi-master replication: kind: Replication.
#
# Two database "sites" kept in sync BOTH ways (each is source and target), like a
# SymmetricDS / AWS-DMS bidirectional task. The engine is open-infra's own:
# per-site Debezium captures changes onto NATS JetStream and a per-direction
# apply-sink applies them to the other site, with:
#   - loop prevention: an origin-marker column (writes carry their origin site; a
#     sink drops events that originated at the peer, so changes don't echo/loop),
#   - conflict resolution: last-write-wins on a Hybrid-Logical-Clock version column
#     (clock-skew-safe; ties broken by origin),
#   - safety: capped JetStream streams + dead-lettering in the apply-sink.
#
# Sites may be different engines (e.g. siteA: sqlserver, siteB: postgres). The
# version + origin columns and the per-site stamping are installed by an mm-prep
# step (Postgres: an HLC trigger; see apply-sink/).
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xreplications.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "none"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names:
    kind: XReplication
    plural: xreplications
  claimNames:
    kind: Replication
    plural: replications
  defaultCompositionRef:
    name: replication
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [siteA, siteB, tables]
              properties:
                siteA: &site
                  type: object
                  description: "One endpoint of the replication pair. Both sites are simultaneously source and target — changes captured here are applied to the peer and vice-versa. The two sites may run different engines (e.g. sqlserver <-> postgres)."
                  required: [name, engine, host, database, username, passwordSecretRef]
                  properties:
                    name:
                      type: string
                      description: "Short site id used as the origin marker (e.g. 'a', 'east'). Must be unique across the pair."
                    engine:
                      type: string
                      enum: [postgres, mysql, mariadb, sqlserver]
                      description: "Database engine at this site. Selects the Debezium source connector that captures changes and the apply-sink driver that writes the peer's changes here."
                    host: { type: string, description: "Hostname or service address of this site's database." }
                    port: { type: integer, default: 5432, description: "Database port. Default 5432 (Postgres); set the engine's port, e.g. 3306 for MySQL/MariaDB or 1433 for SQL Server." }
                    database: { type: string, description: "Name of the database that holds the replicated tables." }
                    username: { type: string, description: "Database user the engine connects as — used both to capture changes (Debezium) and to apply the peer's changes. Must be able to read the tables' change stream and write the replicated tables." }
                    passwordSecretRef:
                      type: object
                      description: "Reference to a Kubernetes Secret (in the claim's namespace) holding this site's database password."
                      required: [name]
                      properties:
                        name: { type: string, description: "Name of the Secret." }
                        key:  { type: string, default: "password", description: "Key within the Secret that holds the password. Default 'password'." }
                    schema:
                      type: string
                      default: "public"
                      description: "Schema/namespace of the tables (Postgres: public; SQL Server: dbo)."
                    ssl: { type: boolean, default: false, description: "Connect to this site's database over TLS (default false). Applied for Postgres (sslmode=require) and SQL Server (encrypt=true)." }
                siteB: *site
                tables:
                  type: array
                  items: { type: string }
                  description: "Bare table names replicated both ways. Must exist on both sites with the same PK."
                versionColumn:
                  type: string
                  default: "_mm_version"
                  description: "HLC version column added by mm-prep and used for last-write-wins."
                originColumn:
                  type: string
                  default: "_mm_origin"
                  description: "Origin-marker column added by mm-prep and used for loop prevention + LWW tiebreak."
                scheduling:
                  type: object
                  description: "Optional pod placement for the replication engine pods (apply-sink + Debezium). Its purpose is the chaos suite: pin the disposable sandbox mesh onto dedicated, tainted chaos nodes so a fault never lands on production hardware. Empty (the default) = schedule anywhere, unchanged behavior."
                  properties:
                    nodeSelector:
                      type: object
                      description: "Node labels a replication pod must match to be scheduled (maps to the pods' nodeSelector)."
                      additionalProperties: { type: string }
                    tolerations:
                      type: array
                      description: "Tolerations added to the replication pods so they can schedule onto tainted nodes (e.g. dedicated chaos nodes). Standard Kubernetes toleration objects."
                      items:
                        type: object
                        description: "A single Kubernetes toleration (key / operator / value / effect / tolerationSeconds)."
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase: { type: string }
                ready: { type: boolean }
      additionalPrinterColumns:
        - name: SiteA
          type: string
          jsonPath: .spec.siteA.engine
        - name: SiteB
          type: string
          jsonPath: .spec.siteB.engine
        - name: Ready
          type: boolean
          jsonPath: .status.ready
