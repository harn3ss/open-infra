# open-infra's "IAM roles": kind: Role — a named bundle of Policies, like an AWS role with
# managed policies attached. It compiles to an AGGREGATED ClusterRole: its rules are the
# union of every attached Policy's ClusterRole, selected by label. Attaching or detaching a
# policy is adding or removing a name from spec.policies — the aggregation controller
# recomputes the union, exactly as Kubernetes' own admin/edit/view roles work.
#
# A Role grants nothing until a Group points at it (spec.clusterRole:
# openinfra-role-<name>) and that group is impersonable — the same ceiling every group is
# subject to. See docs/iam.md.
#
# No `escalate` is needed to create it: an aggregated ClusterRole is created with empty
# rules (the controller fills them in), so at creation it grants nothing.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xroles.iam.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "none"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: iam.openinfra.dev
  names:
    kind: XRole
    plural: xroles
  claimNames:
    kind: Role
    plural: roles
  defaultCompositionRef:
    name: role
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                  description: What this role is for, shown in the console.
                inlinePolicies:
                  type: array
                  description: >-
                    Inline policies embedded in this role (AWS PutRolePolicy): each a name and an AWS policy
                    document, deleted with the role.
                  items:
                    type: object
                    required: [name, document]
                    properties:
                      name:
                        type: string
                        maxLength: 128
                      document:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        required: [Statement]
                        properties:
                          Version:
                            type: string
                            enum: ["2012-10-17", "2008-10-17"]
                          Id:
                            type: string
                          Statement:
                            x-kubernetes-preserve-unknown-fields: true
                            description: One statement object or a list of them (Effect, Action/NotAction, Resource/NotResource, Condition), as AWS accepts.
                policies:
                  type: array
                  description: >-
                    The policies attached to this role (AWS AttachRolePolicy): names of Policies in this
                    namespace, or of the platform's AWS managed policies (aws-<name>, resolved from the
                    management account's library when this namespace has no Policy of that name). Optional —
                    a role with no policies is a trust anchor (an aggregated ClusterRole with no rules of its
                    own), exactly as AWS allows a role carrying only a trust policy (Cognito and Elastic
                    Beanstalk create these). The composition already renders an empty-policy role safely.
                  items:
                    type: string
                    # A Policy's name; it becomes the label key rbac.openinfra.dev/policy-<name>, whose
                    # name part is at most 63 characters.
                    pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                    maxLength: 56
                trust:
                  type: array
                  description: >-
                    Trust policy — the principals permitted to assume this role. Each entry names one
                    kind of principal, so a principal of one kind never stands in for another of the
                    same name: a kind: User name (or "User::<name>"); "Role::<name>" (or
                    "<namespace>/<name>" for a Role outside the IAM home namespace), a session of that
                    role (role chaining); "system:serviceaccount:<ns>:<sa>", that workload's
                    ServiceAccount token (sts:AssumeRoleWithWebIdentity); "OIDC::<provider>", any token
                    that kind: IdentityProvider issues, or "OIDC::<provider>:<subject>" for one subject
                    of it; or "*" for any authenticated principal. The service principal "vm" makes the
                    role assumable by a VM INSTANCE that names it as its spec.instanceRole — the
                    open-infra analog of an AWS role trusting ec2.amazonaws.com (the instance obtains
                    credentials from the instance metadata service, no static keys). A role with no
                    trust entries cannot be assumed by anyone (fail closed), exactly as an AWS role
                    needs a trust policy. An assumed session acts with the role's attached policies.
                  items:
                    type: string
                maxSessionDuration:
                  type: integer
                  minimum: 3600
                  maximum: 43200
                  description: >-
                    The longest session, in seconds, this role may be assumed for (AWS's
                    MaxSessionDuration): 3600 (1 hour, the default) to 43200 (12 hours). An assume that
                    asks for longer (DurationSeconds) is refused; one that asks for nothing gets 1 hour.
                    A session assumed by another role's session (role chaining) is capped at 1 hour.
                permissionBoundary:
                  type: string
                  description: >-
                    Optional data-plane permission boundary (the AWS permission-boundary analog): the
                    name of a kind: Policy whose dataPlane Allow statements are the CEILING for an
                    assumed session. The effective permission is the INTERSECTION of the role's
                    identity policies and this boundary — nothing outside the boundary can be allowed,
                    no matter what an attached Policy grants (compiled as a Cedar forbid-unless guard,
                    fail-closed). It caps a session already governed at the data plane for a service;
                    it does not itself confer access. A boundary that allows nothing caps to nothing.
                revokeSessionsBefore:
                  type: string
                  format: date-time
                  description: >-
                    "Revoke sessions" cutoff (RFC3339), the analog of AWS's AWSRevokeOlderSessions
                    inline policy. Any sts:AssumeRole session of this role that was ISSUED BEFORE this
                    instant is revoked — the aws-shim rejects it at verify even though its token is
                    otherwise valid and unexpired. Sessions assumed at or after the cutoff are
                    unaffected, so new assumes keep working; it revokes a role's current sessions
                    without rotating the global STS signing key (which would cut every role's
                    sessions at once). Set it to "now" via the console "Revoke sessions" action.
            status:
              type: object
              properties:
                ready:
                  type: boolean
                clusterRole:
                  type: string
                  description: The aggregated ClusterRole a Group can bind to.
      additionalPrinterColumns:
        - name: ClusterRole
          type: string
          jsonPath: .status.clusterRole
        - name: Ready
          type: boolean
          jsonPath: .status.ready
