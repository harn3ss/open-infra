# The compiler: one SecurityGroup claim -> one NetworkPolicy that selects the SG's
# members (pods labelled openinfra.dev/sg-<name>) and applies default-deny + the
# declared allows. Enforced by the CNI (kube-ovn ACLs).
#
#   from/to:
#     cidr          -> ipBlock          (edge/LAN IP enforcement; external sources), plus
#                                        the join address of each cluster node the cidr
#                                        names (see "Cluster nodes as sources" below)
#     securityGroup -> podSelector      (members of another SG, same namespace)
#     namespace     -> namespaceSelector (all pods in a namespace)
#   protocol/ports  -> NetworkPolicyPort list (empty ports = every port of the protocol; protocol ALL = every protocol)
#   any egress rule -> Egress policyType + an auto DNS allow (UDP/TCP 53 to kube-system)
#
# Members are produced by the resource compositions: an Application/Function/VM with
# `securityGroups: [web]` stamps openinfra.dev/sg-web="" on its pods.
#
# Cluster nodes as sources: a connection a node makes itself (an operator working on a
# node, or a host-network pod on it) reaches a member from that node's join-subnet address
# (annotation ovn.kubernetes.io/ip_address), never from its LAN address: kube-proxy
# masquerades a node's own connection to a Service or LAN address, and the node enters the
# pod network through its join port. So an ingress cidr that contains a node's LAN address
# also admits that node's join address, which is what the policy sees. Other nodes, and LAN
# hosts outside the cidr, stay refused. The nodes are read as extra resources (Crossplane
# needs get/list/watch on nodes: platform/security/crossplane-node-read.yaml), and only by a
# group with a narrower ingress cidr than 0.0.0.0/0 (which already covers join addresses).
# Until they are observed (the first reconcile), only the declared cidrs render.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: securitygroup
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XSecurityGroup
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- $defIngress := hasKey $spec "ingress" }}
            {{- $defEgress := hasKey $spec "egress" }}
            {{- /* The cluster's nodes, as {join, joinN, lanN}: the join address a node's own
                   connections arrive from, and its LAN addresses as integers (for cidr
                   containment; Go templates have no CIDR functions). Only canonical dotted
                   IPv4 is read, so a leading-zero or IPv6 value is never mis-parsed. */}}
            {{- $v4 := "^(0|[1-9][0-9]{0,2})([.](0|[1-9][0-9]{0,2})){3}$" }}
            {{- $nodeHosts := list }}
            {{- $nodeReq := index (.extraResources | default dict) "nodes" }}
            {{- $nodeItems := list }}
            {{- if $nodeReq }}{{ $nodeItems = ($nodeReq.items | default list) }}{{ end }}
            {{- range $n := $nodeItems }}
              {{- $node := ($n.resource | default dict) }}
              {{- $meta := ($node.metadata | default dict) }}
              {{- $ann := ($meta.annotations | default dict) }}
              {{- $status := ($node.status | default dict) }}
              {{- $join := index (splitList "," (index $ann "ovn.kubernetes.io/ip_address" | default "")) 0 }}
              {{- if regexMatch $v4 $join }}
                {{- $o := splitList "." $join }}
                {{- $joinN := add (mul (int (index $o 0)) 16777216) (mul (int (index $o 1)) 65536) (mul (int (index $o 2)) 256) (int (index $o 3)) }}
                {{- $lanN := list }}
                {{- range $a := ($status.addresses | default list) }}
                  {{- if and (has $a.type (list "InternalIP" "ExternalIP")) (regexMatch $v4 ($a.address | default "")) }}
                    {{- $o = splitList "." $a.address }}
                    {{- $lanN = append $lanN (add (mul (int (index $o 0)) 16777216) (mul (int (index $o 1)) 65536) (mul (int (index $o 2)) 256) (int (index $o 3))) }}
                  {{- end }}
                {{- end }}
                {{- $nodeHosts = append $nodeHosts (dict "join" $join "joinN" $joinN "lanN" $lanN) }}
              {{- end }}
            {{- end }}
            {{- $wantNodes := false }}
            {{- /* build ingress rules */}}
            {{- $ingressRules := list }}
            {{- range $rule := ($spec.ingress | default list) }}
              {{- $peers := list }}
              {{- range $src := ($rule.from | default list) }}
                {{- if $src.cidr }}{{ $peers = append $peers (dict "ipBlock" (dict "cidr" $src.cidr)) }}
                  {{- /* Admit the join address of each node whose LAN address is in the cidr
                         (and whose join address is not already in it). */}}
                  {{- $c := splitList "/" $src.cidr }}
                  {{- if and (eq (len $c) 2) (regexMatch $v4 (index $c 0)) (regexMatch "^[0-9]{1,2}$" (index $c 1)) }}
                    {{- $bits := int (index $c 1) }}
                    {{- if gt $bits 0 }}{{ $wantNodes = true }}{{ end }}
                    {{- $size := 1 }}
                    {{- range $i := until 32 }}{{ if ge $i $bits }}{{ $size = mul $size 2 }}{{ end }}{{ end }}
                    {{- $o := splitList "." (index $c 0) }}
                    {{- $netN := div (add (mul (int (index $o 0)) 16777216) (mul (int (index $o 1)) 65536) (mul (int (index $o 2)) 256) (int (index $o 3))) $size }}
                    {{- range $h := $nodeHosts }}
                      {{- $named := false }}
                      {{- range $l := $h.lanN }}{{ if eq (div $l $size) $netN }}{{ $named = true }}{{ end }}{{ end }}
                      {{- if and $named (ne (div $h.joinN $size) $netN) }}
                        {{- $jb := dict "ipBlock" (dict "cidr" (printf "%s/32" $h.join)) }}
                        {{- if not (has $jb $peers) }}{{ $peers = append $peers $jb }}{{ end }}
                      {{- end }}
                    {{- end }}
                  {{- end }}
                {{- else if $src.securityGroup }}{{ $peers = append $peers (dict "podSelector" (dict "matchLabels" (dict (printf "openinfra.dev/sg-%s" $src.securityGroup) ""))) }}
                {{- else if $src.namespace }}{{ $peers = append $peers (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $src.namespace))) }}
                {{- end }}
              {{- end }}
              {{- $r := dict "from" $peers }}
              {{- if $rule.ports }}
                {{- $ports := list }}
                {{- range $p := $rule.ports }}{{ $ports = append $ports (dict "protocol" ($rule.protocol | default "TCP") "port" $p) }}{{ end }}
                {{- $r = set $r "ports" $ports }}
              {{- else if ne ($rule.protocol | default "TCP") "ALL" }}
                {{- /* No ports: every port OF ITS PROTOCOL, as an AWS rule is (tcp 0-65535 is TCP only).
                       Only protocol ALL (AWS -1) is every protocol: a rule with no ports at all. */}}
                {{- $r = set $r "ports" (list (dict "protocol" ($rule.protocol | default "TCP"))) }}
              {{- end }}
              {{- $ingressRules = append $ingressRules $r }}
            {{- end }}
            {{- /* Always let the console (the trusted management plane, namespace
                   open-infra-console) reach SG-gated workloads, so console features
                   like DB Peek can't be silently broken by a user's SG. Only when
                   ingress is restricted; mirrors the auto-DNS egress below. A user's
                   narrower cidrs don't cover the console's pod addresses. */}}
            {{- if $defIngress }}
              {{- $console := dict "from" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "open-infra-console")))) }}
              {{- $ingressRules = append $ingressRules $console }}
            {{- end }}
            {{- /* build egress rules + auto DNS */}}
            {{- $egressRules := list }}
            {{- range $rule := ($spec.egress | default list) }}
              {{- $peers := list }}
              {{- range $dst := ($rule.to | default list) }}
                {{- if $dst.cidr }}{{ $peers = append $peers (dict "ipBlock" (dict "cidr" $dst.cidr)) }}
                {{- else if $dst.securityGroup }}{{ $peers = append $peers (dict "podSelector" (dict "matchLabels" (dict (printf "openinfra.dev/sg-%s" $dst.securityGroup) ""))) }}
                {{- else if $dst.namespace }}{{ $peers = append $peers (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $dst.namespace))) }}
                {{- end }}
              {{- end }}
              {{- $r := dict "to" $peers }}
              {{- if $rule.ports }}
                {{- $ports := list }}
                {{- range $p := $rule.ports }}{{ $ports = append $ports (dict "protocol" ($rule.protocol | default "TCP") "port" $p) }}{{ end }}
                {{- $r = set $r "ports" $ports }}
              {{- else if ne ($rule.protocol | default "TCP") "ALL" }}
                {{- $r = set $r "ports" (list (dict "protocol" ($rule.protocol | default "TCP"))) }}
              {{- end }}
              {{- $egressRules = append $egressRules $r }}
            {{- end }}
            {{- if $defEgress }}
              {{- $dns := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")))) "ports" (list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53)) }}
              {{- $egressRules = append $egressRules $dns }}
              {{- if $spec.vpc }}
              {{- /* A group in a VPC: its members are the VPC's Lambda functions, whose DNS goes to the VPC
                     resolver and whose code and credentials come from the Lambda service, both served by
                     the aws-shim (5353 DNS, 4568 the Lambda service). AWS never filters either with a
                     security group, so neither is filtered here. */}}
              {{- $shim := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "open-infra-aws-shim")) "podSelector" (dict "matchLabels" (dict "app" "aws-shim")) }}
              {{- $egressRules = append $egressRules (dict "to" (list $shim) "ports" (list (dict "protocol" "UDP" "port" 5353) (dict "protocol" "TCP" "port" 5353) (dict "protocol" "TCP" "port" 4568))) }}
              {{- end }}
            {{- end }}
            {{- if $wantNodes }}
            ---
            # Read the cluster's nodes, for the join address of each node an ingress cidr names.
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              nodes:
                apiVersion: v1
                kind: Node
                matchLabels:
                  kubernetes.io/os: linux
            {{- end }}
            ---
            # --- The SecurityGroup's NetworkPolicy ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: netpol
            spec:
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: sg-{{ $name }}
                    namespace: {{ $ns }}
                    labels: { openinfra.dev/securitygroup: {{ $name }} }
                    {{- if $spec.vpc }}
                    # A group in a VPC: OVN logs every packet the group refuses, which the VPC's flow logs
                    # record (EC2 CreateFlowLogs, TrafficType REJECT). Admitted traffic is not logged: OVN
                    # would log every packet of it, unmetered.
                    annotations:
                      ovn.kubernetes.io/enable_log: "true"
                      ovn.kubernetes.io/log_acl_actions: "drop"
                    {{- end }}
                  spec:
                    podSelector:
                      matchLabels:
                        openinfra.dev/sg-{{ $name }}: ""
                    policyTypes:
                    {{- if $defIngress }}
                      - Ingress
                    {{- end }}
                    {{- if $defEgress }}
                      - Egress
                    {{- end }}
                    {{- if $defIngress }}
                    ingress:{{ if $ingressRules }}{{ toYaml $ingressRules | nindent 22 }}{{ else }} []{{ end }}
                    {{- end }}
                    {{- if $defEgress }}
                    egress:{{ if $egressRules }}{{ toYaml $egressRules | nindent 22 }}{{ else }} []{{ end }}
                    {{- end }}
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
