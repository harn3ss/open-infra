# The composition for kind: StateMachine. Unusually, it emits NO child resources:
# a state machine is just a validated ASL definition (spec.definition), and it is run
# by the singleton statemachine controller (platform/abstraction/statemachine-controller.yaml),
# which reads the StateMachine directly and watches kind: Execution objects. There is
# therefore no per-machine Deployment/RBAC to render — which also keeps this within the
# provider's deliberately RBAC-free permission boundary (see provider-setup.yaml). The
# composition just marks the claim Ready and records which controller runs it.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: statemachine
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XStateMachine
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- /* No child resources: the singleton controller runs executions. Just
                   reflect the controller name into status. */}}
            apiVersion: openinfra.dev/v1
            kind: XStateMachine
            status:
              controller: openinfra-statemachine
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
