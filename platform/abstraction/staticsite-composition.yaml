# The compiler for kind: StaticSite -> static frontend hosting. It renders a
# bucket-setup Job (creates the MinIO bucket + a <name>-minio connection secret
# for uploads), an nginx Deployment that syncs the bucket and serves it with SPA
# history-fallback, a ClusterIP Service, and a Traefik Ingress with cert-manager
# TLS. Upload a built dist/ to the bucket; the server picks it up on its next sync.
#
# Reuses the Application composition's bucket-setup Job pattern (aws-cli + kubectl
# under the pre-defined openinfra-bucket-setup SA, so the provider needs no
# RBAC-creation power) and the HttpApi Ingress/TLS block.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: staticsite
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XStaticSite
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- $bucket := $spec.bucket | default (printf "%s-site" $name) }}
            {{- if ne (regexReplaceAll "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" (printf "%v" $bucket) "") "" }}{{- fail (printf "kind: StaticSite %s/%s: %q is not a valid S3 bucket name (3-63 lowercase letters, digits, dots, hyphens)" $ns $name (printf "%v" $bucket)) }}{{- end }}
            {{- /* Tenant isolation: the bucket belongs to this namespace (bucket-ownership.sh in
                   provider-setup.yaml); the MinIO user and the setup Job are named from the claim's
                   kind, namespace and name, so a same-named site elsewhere shares neither. */}}
            {{- $owner := printf "StaticSite/%s/%s" $ns $name }}
            {{- $appUser := printf "app-%s-%s" (printf "%s-%s" $ns $name | replace "." "-" | trunc 40 | trimSuffix "-") ($owner | sha256sum | trunc 10) }}
            {{- $ownHash := printf "%s|own-v2" $owner | sha256sum | trunc 5 }}
            {{- $index := $spec.indexDocument | default "index.html" }}
            {{- $error := $spec.errorDocument | default "" }}
            {{- $interval := $spec.syncIntervalSeconds | default 30 }}
            {{- $tls := true }}{{- if hasKey $spec "tls" }}{{- $tls = $spec.tls }}{{- end }}
            {{- $spa := true }}{{- if hasKey $spec "spa" }}{{- $spa = $spec.spa }}{{- end }}
            {{- /* Every hostname the site answers on: domain first, then any extra domains (Ingress rules + TLS SANs). */}}
            {{- $hosts := list $spec.domain }}
            {{- range $d := ($spec.domains | default list) }}{{- $hosts = append $hosts $d }}{{- end }}
            {{- /* nginx reads its config only at start: with responseHeaders set, a hash of the config inputs
                   rides the pod template so a changed header (or spa/index/error document) rolls the pod. */}}
            {{- $confHash := printf "%s|%v|%s|%s" $index $spa $error (toJson ($spec.responseHeaders | default list)) | sha256sum | trunc 10 }}
            {{- /* Amplify-style build: derive the poll cron (pollSeconds -> whole minutes, min 1). */}}
            {{- $build := $spec.build | default dict }}
            {{- $pollMin := 5 }}
            {{- if $build.pollSeconds }}{{- $pollMin = div (int $build.pollSeconds) 60 }}{{- if lt $pollMin 1 }}{{- $pollMin = 1 }}{{- end }}{{- end }}
            {{- $bbranch := $build.branch | default "main" }}
            {{- $boutput := $build.outputDir | default "dist" }}
            ---
            # Bucket + connection secret: one Job (aws-cli + kubectl) creates the
            # bucket and writes <name>-minio into the app namespace, in the minio ns
            # under the openinfra-bucket-setup SA (root creds never leave minio).
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-setup
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata: { name: {{ $name }}-site-{{ $ownHash }}, namespace: minio }
                  spec:
                    backoffLimit: 20
                    # No ttlSecondsAfterFinished: provider-kubernetes recreates a TTL-GC'd managed Job
                    # → infinite re-run loop; the finished Job persists as its done-marker (see bucket-composition.yaml).
                    template:
                      spec:
                        # enableServiceLinks off: per-Service env overflows execve (E2BIG) in dense namespaces; unused here.
                        enableServiceLinks: false
                        serviceAccountName: openinfra-bucket-setup
                        restartPolicy: OnFailure
                        volumes:
                          - { name: mc, emptyDir: {} }
                          - { name: ownership, configMap: { name: openinfra-bucket-ownership } }
                        initContainers:
                          # Bring `mc` in OFFLINE (copied from its image) — for bucket creation
                          # AND minting the scoped per-app user/policy (#151 faults 1+3).
                          - name: fetch-mc
                            image: ghcr.io/harn3ss/open-infra-mc@sha256:a689825d5299d02e6f35973e726a6e49a77469cde644dd52d60586b07bd85744
                            command: [sh, -c, "cp /usr/bin/mc /mc/mc && chmod +x /mc/mc"]
                            volumeMounts: [{ name: mc, mountPath: /mc }]
                        containers:
                          - name: setup
                            image: alpine/k8s:1.30.0
                            volumeMounts: [{ name: mc, mountPath: /mc }, { name: ownership, mountPath: /opt/openinfra, readOnly: true }]
                            env:
                              # Root provisions ONLY (create the bucket + mint the scoped user);
                              # it is never written into the app secret (#151 fault 3).
                              - name: ROOT_USER
                                valueFrom: { secretKeyRef: { name: minio, key: rootUser } }
                              - name: ROOT_PASS
                                valueFrom: { secretKeyRef: { name: minio, key: rootPassword } }
                              - { name: OWNER_NS, value: {{ $ns | quote }} }
                              - { name: OWNER_REF, value: {{ $owner | quote }} }
                              - { name: XR_CREATED, value: {{ .observed.composite.resource.metadata.creationTimestamp | default "" | quote }} }
                            command: ["/bin/sh", "-c"]
                            args:
                              - |
                                set -e
                                MC=/mc/mc
                                E=http://minio.minio.svc.cluster.local:9000
                                # alias set validates root up front — a rotated/wrong root key fails
                                # HERE, loud, instead of a false-green (#151 faults 1+2).
                                "$MC" alias set m "$E" "$ROOT_USER" "$ROOT_PASS" >/dev/null
                                # 1. The bucket must be this namespace's (or new), then create it idempotently
                                #    but FAIL LOUD (#151 fault 1).
                                . /opt/openinfra/bucket-ownership.sh
                                claim_bucket {{ $bucket }}
                                "$MC" mb --ignore-existing "m/{{ $bucket }}"
                                echo "bucket {{ $bucket }} ready"
                                # 2. Mint a PER-APP, NON-root user scoped to ONLY this bucket (#151 fault 3). Its key
                                #    lives in a platform-side Secret (openinfra-bucket-creds/<user>); a provider Object
                                #    copies it into {{ $name }}-minio and GCs it with the claim — the Job writes no
                                #    credential into the claim namespace.
                                APPUSER="{{ $appUser }}"
                                printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::{{ $bucket }}","arn:aws:s3:::{{ $bucket }}/*"]}]}' > /tmp/pol.json
                                mint_scoped_user "$APPUSER" /tmp/pol.json
            {{- /* Scoped-credential delivery: Observe the platform Secret; once it exists, copy its key into
                   {{ $name }}-minio as a composed (GC'd) Secret. See bucket-composition.yaml for the model. */}}
            {{- $pcreds := index (.observed.resources | default dict) "site-pcreds" }}
            {{- $pexists := false }}
            {{- if $pcreds }}{{- with $pcreds.resource.status }}{{- with .atProvider }}{{- with .manifest }}{{- with .metadata }}{{- if .uid }}{{- $pexists = true }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: site-pcreds
                # Observing the platform-side creds must not hold the claim NotReady: a claim from before the
                # scoped-creds model has none until its migration seeds one (its old Secret keeps it working).
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              managementPolicies: ["Observe"]
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata: { name: {{ $appUser }}, namespace: openinfra-bucket-creds }
            {{- if $pexists }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: site-creds
            spec:
              references:
                - patchesFrom:
                    apiVersion: v1
                    kind: Secret
                    namespace: openinfra-bucket-creds
                    name: {{ $appUser }}
                    fieldPath: data.MINIO_SECRET_KEY
                  toFieldPath: data.MINIO_SECRET_KEY
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  type: Opaque
                  metadata: { name: {{ $name }}-minio, namespace: {{ $ns }} }
                  stringData:
                    MINIO_ENDPOINT: http://minio.minio.svc.cluster.local:9000
                    MINIO_BUCKETS: {{ $bucket }}
                    MINIO_ACCESS_KEY: {{ $appUser }}
            {{- end }}
            {{- if $spec.build }}
            ---
            # Amplify-style managed build: a CronJob polls the git repo and, ONLY when the branch
            # HEAD changed since the last build (tracked as s3://<bucket>/.build/last-sha), clones,
            # runs the build command in a SANDBOXED step (non-root, no cluster credentials), and
            # publishes the output dir to the site bucket — the server then picks it up on its sync.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: build
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: CronJob
                  metadata: { name: {{ $name }}-site-build, namespace: {{ $ns }} }
                  spec:
                    schedule: "*/{{ $pollMin }} * * * *"
                    concurrencyPolicy: Forbid
                    successfulJobsHistoryLimit: 1
                    failedJobsHistoryLimit: 3
                    jobTemplate:
                      spec:
                        backoffLimit: 1
                        activeDeadlineSeconds: 1800
                        ttlSecondsAfterFinished: 600
                        template:
                          metadata: { labels: { app: {{ $name }}-site-build } }
                          spec:
                            # enableServiceLinks off: per-Service env overflows execve (E2BIG) in dense namespaces; unused here.
                            enableServiceLinks: false
                            # Untrusted repo code runs here: no cluster credentials, non-root, capped.
                            automountServiceAccountToken: false
                            restartPolicy: Never
                            securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
                            volumes:
                              - { name: ws, emptyDir: {} }
                            initContainers:
                              # 1. Read the last-built SHA marker from the bucket.
                              - name: prev
                                image: alpine/k8s:1.30.0
                                command: [/bin/sh, -c]
                                args: ['aws --endpoint-url "$MINIO_ENDPOINT" s3 cp "s3://{{ $bucket }}/.build/last-sha" /ws/.prev 2>/dev/null || echo none > /ws/.prev']
                                env:
                                  - { name: MINIO_ENDPOINT, valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_ENDPOINT } } }
                                  - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_ACCESS_KEY } } }
                                  - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_SECRET_KEY } } }
                                  - { name: AWS_DEFAULT_REGION, value: us-east-1 }
                                volumeMounts: [{ name: ws, mountPath: /ws }]
                              # 2. ls-remote the branch HEAD; clone only if it changed (else .skip).
                              - name: clone
                                image: alpine/git:2.45.2
                                command: [/bin/sh, -c]
                                args:
                                  - |
                                    set -e
                                    AUTH=""
                                    {{- if $build.secret }}
                                    [ -n "$GIT_TOKEN" ] && AUTH="${GIT_TOKEN}@"
                                    {{- end }}
                                    URL=$(printf '%s' "$REPO_URL" | sed -E "s#^https://#https://${AUTH}#")
                                    HEAD=$(git ls-remote "$URL" "$BRANCH" | awk '{print $1}' | head -1)
                                    printf '%s' "$HEAD" > /ws/.head
                                    if [ -n "$HEAD" ] && [ "$HEAD" = "$(cat /ws/.prev)" ]; then touch /ws/.skip; echo "no new commit ($HEAD)"; else git clone --depth 1 -b "$BRANCH" "$URL" /ws/src; fi
                                env:
                                  # The repo and branch are the tenant's: data for the script, never part of it.
                                  - { name: REPO_URL, value: {{ $build.repo | toJson }} }
                                  - { name: BRANCH, value: {{ $bbranch | toJson }} }
                                  {{- if $build.secret }}
                                  - { name: GIT_TOKEN, valueFrom: { secretKeyRef: { name: {{ $build.secret | toJson }}, key: GIT_TOKEN, optional: true } } }
                                  {{- end }}
                                volumeMounts: [{ name: ws, mountPath: /ws }]
                              # 3. Build (sandboxed) in the repo root, into the output dir.
                              - name: build
                                image: {{ $build.image | default "node:20-alpine" | toJson }}
                                workingDir: /ws/src
                                command: [/bin/sh, -c]
                                # The tenant's build command is a script by design, but it travels as an env value
                                # and runs as its own `sh -c`, so quotes, brackets or newlines in it (amplify.yml
                                # commands routinely have them) can neither break this manifest nor this wrapper.
                                args:
                                  - |
                                    if [ -f /ws/.skip ]; then exit 0; fi
                                    exec /bin/sh -c "$BUILD_COMMAND"
                                securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: [ALL] } }
                                env:
                                  - { name: HOME, value: /ws }
                                  - { name: CI, value: "true" }
                                  - { name: BUILD_COMMAND, value: {{ $build.buildCommand | default "npm ci && npm run build" | toJson }} }
                                  {{- range $e := ($build.env | default list) }}
                                  - { name: {{ $e.name | toJson }}, value: {{ $e.value | toJson }} }
                                  {{- end }}
                                volumeMounts: [{ name: ws, mountPath: /ws }]
                            containers:
                              # 4. Publish the output to the bucket + record the new SHA marker.
                              - name: publish
                                image: alpine/k8s:1.30.0
                                command: [/bin/sh, -c]
                                args:
                                  - |
                                    if [ -f /ws/.skip ]; then echo "unchanged — nothing to publish"; exit 0; fi
                                    aws --endpoint-url "$MINIO_ENDPOINT" s3 sync "/ws/src/$OUTPUT_DIR/" "s3://{{ $bucket }}/" --delete --exclude ".build/*"
                                    aws --endpoint-url "$MINIO_ENDPOINT" s3 cp /ws/.head "s3://{{ $bucket }}/.build/last-sha"
                                    echo "published $OUTPUT_DIR -> {{ $bucket }}"
                                env:
                                  - { name: OUTPUT_DIR, value: {{ $boutput | toJson }} }
                                  - { name: MINIO_ENDPOINT, valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_ENDPOINT } } }
                                  - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_ACCESS_KEY } } }
                                  - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_SECRET_KEY } } }
                                  - { name: AWS_DEFAULT_REGION, value: us-east-1 }
                                volumeMounts: [{ name: ws, mountPath: /ws }]
            {{- end }}
            ---
            # nginx server config: SPA history-fallback (try_files -> index) or a
            # plain multi-file site with an optional error document. responseHeaders are
            # added at server level with `always`, so error responses carry them too (the
            # XRD restricts names/values so each one is a single safe nginx token/string).
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nginx-config
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $name }}-site-nginx
                    namespace: {{ $ns }}
                  data:
                    default.conf: |
                      server {
                        listen 80;
                        server_name _;
                        root /usr/share/nginx/html;
                        index {{ $index }};
                        {{- range $h := ($spec.responseHeaders | default list) }}
                        add_header {{ $h.name }} {{ $h.value | quote }} always;
                        {{- end }}
                        location / {
                          {{- if $spa }}
                          try_files $uri $uri/ /{{ $index }};
                          {{- else }}
                          try_files $uri $uri/ =404;
                          {{- end }}
                        }
                        {{- if and (not $spa) $error }}
                        error_page 404 /{{ $error }};
                        {{- end }}
                      }
                    # The status port, in-cluster only (no Ingress routes to it): GET /synced is the start time
                    # (Unix seconds) of the last successful sync of the site's copy of its bucket — what the
                    # aws-shim's CloudFront CreateInvalidation/GetInvalidation decide "Completed" by.
                    status.conf: |
                      server {
                        listen 8081;
                        server_name _;
                        access_log off;
                        location = /synced {
                          default_type text/plain;
                          alias /status/synced;
                        }
                        location / {
                          return 404;
                        }
                      }
            ---
            # The server: nginx serving a shared volume, kept in sync with the bucket
            # by a sidecar (aws s3 sync loop) + an initContainer for the first fill.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: server
            spec:
              # Ready when the site serves, not when the Deployment object exists: the pod cannot start until
              # the scoped <name>-minio Secret has been delivered, so without this the claim (and a stack's
              # CloudFront distribution) reports Ready a minute or more before anything answers on its domain.
              readiness:
                policy: DeriveFromCelQuery
                celQuery: object.spec.replicas == 0 || (has(object.status) && has(object.status.readyReplicas) && object.status.readyReplicas == object.spec.replicas)
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: {{ $name }}-site
                    namespace: {{ $ns }}
                    labels: { app: {{ $name }}-site, openinfra.dev/staticsite: "true" }
                  spec:
                    replicas: 1
                    selector: { matchLabels: { app: {{ $name }}-site } }
                    template:
                      metadata: { labels: { app: {{ $name }}-site }{{ if $spec.responseHeaders }}, annotations: { openinfra.dev/site-config: "{{ $confHash }}" }{{ end }} }
                      spec:
                        # enableServiceLinks off: per-Service env overflows execve (E2BIG) in dense namespaces; unused here.
                        enableServiceLinks: false
                        initContainers:
                          - name: sync-init
                            image: alpine/k8s:1.30.0
                            command: ["/bin/sh", "-c"]
                            # A successful sync records the time it STARTED (/status/synced), served on the status port.
                            args: ['start=$(date +%s); aws --endpoint-url "$MINIO_ENDPOINT" s3 sync "s3://{{ $bucket }}/" /web --delete --exact-timestamps && echo "$start" > /status/synced || true']
                            env:
                              - name: MINIO_ENDPOINT
                                valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_ENDPOINT } }
                              - name: AWS_ACCESS_KEY_ID
                                valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_ACCESS_KEY } }
                              - name: AWS_SECRET_ACCESS_KEY
                                valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_SECRET_KEY } }
                              - { name: AWS_DEFAULT_REGION, value: us-east-1 }
                            volumeMounts:
                              - { name: web, mountPath: /web }
                              - { name: sync-status, mountPath: /status }
                        containers:
                          - name: nginx
                            image: nginx:1.27-alpine
                            ports:
                              - { name: http, containerPort: 80 }
                              - { name: status, containerPort: 8081 }
                            # TCP, not httpGet /: nginx is ready to serve as soon as it is
                            # listening — an as-yet-empty bucket (content not uploaded) returns 404
                            # on /, which would keep the pod permanently NotReady and endpoint-less.
                            readinessProbe:
                              tcpSocket: { port: 80 }
                              initialDelaySeconds: 5
                              periodSeconds: 10
                            volumeMounts:
                              - { name: web, mountPath: /usr/share/nginx/html }
                              - { name: nginx-config, mountPath: /etc/nginx/conf.d }
                              - { name: sync-status, mountPath: /status, readOnly: true }
                          - name: sync
                            image: alpine/k8s:1.30.0
                            command: ["/bin/sh", "-c"]
                            # --exact-timestamps: without it, an S3-to-local sync skips a changed object of
                            # the same size (it re-downloads only when the local copy is NEWER), so a
                            # redeploy that changes a file but not its length would never be served.
                            args:
                              - 'while true; do start=$(date +%s); if aws --endpoint-url "$MINIO_ENDPOINT" s3 sync "s3://{{ $bucket }}/" /web --delete --exact-timestamps 2>/dev/null; then echo "$start" > /status/synced.tmp && mv /status/synced.tmp /status/synced; fi; sleep {{ $interval }}; done'
                            env:
                              - name: MINIO_ENDPOINT
                                valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_ENDPOINT } }
                              - name: AWS_ACCESS_KEY_ID
                                valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_ACCESS_KEY } }
                              - name: AWS_SECRET_ACCESS_KEY
                                valueFrom: { secretKeyRef: { name: {{ $name }}-minio, key: MINIO_SECRET_KEY } }
                              - { name: AWS_DEFAULT_REGION, value: us-east-1 }
                            volumeMounts:
                              - { name: web, mountPath: /web }
                              - { name: sync-status, mountPath: /status }
                        volumes:
                          - name: web
                            emptyDir: {}
                          - name: sync-status
                            emptyDir: {}
                          - name: nginx-config
                            configMap: { name: {{ $name }}-site-nginx }
            ---
            # Service: the site, in-cluster on port 80.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $name }}-site
                    namespace: {{ $ns }}
                    labels: { openinfra.dev/staticsite: "true" }
                    # Traefik runs on the host network: told to dial the Service's ClusterIP (nativelb) rather than a
                    # pod IP, its connection reaches the pod from the kube-ovn join subnet, which the isolation policy admits.
                    annotations: { traefik.ingress.kubernetes.io/service.nativelb: "true" }
                  spec:
                    type: ClusterIP
                    selector: { app: {{ $name }}-site }
                    ports:
                      - { name: http, port: 80, targetPort: 80 }
                      - { name: status, port: 8081, targetPort: 8081 }
            {{- if $tls }}
            ---
            # The Ingress's TLS Secret, created here — empty — so it is a composed resource and goes with the
            # site. cert-manager fills and renews it (its issuance applies the data with force); the provider
            # only creates and deletes it, never updates it, so the two never fight. Left to cert-manager's
            # ingress-shim it would outlive the site: cert-manager owns no Secret unless the cluster-wide
            # --enable-certificate-owner-ref is on.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: tls-secret
            spec:
              managementPolicies: ["Observe", "Create", "Delete"]
              # Ready once the Secret exists, whoever created it. The provider's default (SuccessfulCreate) counts
              # an Object ready only when the live object carries the provider's own last-applied annotation; when
              # cert-manager issues first and writes the Secret itself, it has none, and with no Update allowed the
              # Object would never turn ready, holding the site NotReady until its create times out.
              readiness: { policy: DeriveFromCelQuery, celQuery: "object.metadata.uid != ''" }
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  type: kubernetes.io/tls
                  metadata:
                    name: staticsite-{{ $name }}-tls
                    namespace: {{ $ns }}
                    labels: { openinfra.dev/staticsite: {{ $name }} }
                  data: { tls.crt: "", tls.key: "" }
            {{- end }}
            ---
            # Ingress: the public front door, TLS via cert-manager (mirrors HttpApi).
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ingress
            spec:
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: staticsite-{{ $name }}
                    namespace: {{ $ns }}
                    labels:
                      openinfra.dev/staticsite: {{ $name }}
                    annotations:
                      {{- if $tls }}
                      cert-manager.io/cluster-issuer: openinfra-issuer
                      traefik.ingress.kubernetes.io/router.entrypoints: websecure
                      {{- else }}
                      traefik.ingress.kubernetes.io/router.entrypoints: web
                      {{- end }}
                  spec:
                    ingressClassName: traefik
                    rules:
                      {{- range $h := $hosts }}
                      - host: {{ $h }}
                        http:
                          paths:
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: {{ $name }}-site
                                  port:
                                    number: 80
                      {{- end }}
                    {{- if $tls }}
                    tls:
                      - hosts: [ {{ join ", " $hosts }} ]
                        secretName: staticsite-{{ $name }}-tls
                    {{- end }}
            ---
            # --- Tenant isolation (ingress) for the site server and its build pods: this namespace and the
            #     platform callers named below only; every other namespace is refused. Pod->Service calls keep the
            #     caller's pod IP (kube-ovn enable-lb), so the namespace is what tells tenants apart. ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: isolation-netpol
            spec:
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: {{ $name }}-staticsite-isolation
                    namespace: {{ $ns }}
                    labels: { openinfra.dev/isolation: tenant }
                  spec:
                    {{- if $spec.build }}
                    podSelector: { matchExpressions: [ { key: app, operator: In, values: [ "{{ $name }}-site", "{{ $name }}-site-build" ] } ] }
                    {{- else }}
                    podSelector: { matchLabels: { app: "{{ $name }}-site" } }
                    {{- end }}
                    policyTypes: [Ingress]
                    ingress:
                      - from:
                          # this namespace
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $ns }} } }
                          # host-sourced traffic (hostNetwork Traefik; NodePort, LoadBalancer and external-IP Services
                          # through kube-proxy) arrives as a node's kube-ovn join IP
                          - ipBlock: { cidr: 100.64.0.0/16 }
                          # the ingress controller, should it run on the pod network (on the host network it is admitted
                          # through the join subnet: it dials the Service's ClusterIP, see the Service's nativelb annotation)
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
                            podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
                          # Prometheus, scraping metrics
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
                            podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
                      # the aws-shim, reading the last-sync time on the status port only (CloudFront invalidations)
                      - from:
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: open-infra-aws-shim } }
                            podSelector: { matchLabels: { app: aws-shim } }
                        ports:
                          - { protocol: TCP, port: 8081 }
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
