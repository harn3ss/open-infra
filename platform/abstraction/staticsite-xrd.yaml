# kind: StaticSite — frontend static hosting for a built SPA (a dist/ tree), the
# S3-static-website + CloudFront-origin-shaped primitive. One claim -> a MinIO
# bucket (the artifact store), an nginx server that syncs the bucket and serves it
# with SPA history-fallback, and a Traefik Ingress with cert-manager TLS.
#
# Upload your built assets to the bucket (the <name>-minio connection secret gives
# the endpoint + credentials); the server picks them up. Client-side routes work:
# unknown paths fall back to index.html when spec.spa is true.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xstaticsites.openinfra.dev
  annotations:
    openinfra.dev/chaos-role: "none"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names: { kind: XStaticSite, plural: xstaticsites }
  claimNames: { kind: StaticSite, plural: staticsites }
  defaultCompositionRef: { name: staticsite }
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  description: "Hostname the site is served on, e.g. app.example.com."
                bucket:
                  type: string
                  description: "MinIO bucket holding the built assets. Defaults to <name>-site; created if absent, with a <name>-minio connection secret (endpoint + credentials) for uploads."
                  pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
                tls:
                  type: boolean
                  default: true
                  description: "Terminate TLS via cert-manager (openinfra-issuer). Set false for plain HTTP."
                spa:
                  type: boolean
                  default: true
                  description: "Single-page-app history fallback: serve index.html for unknown paths so client-side routing works. Turn off for a plain multi-file site."
                indexDocument:
                  type: string
                  default: "index.html"
                  description: "The index/entry document served at / and (when spa) for unmatched routes."
                errorDocument:
                  type: string
                  description: "Document served for 404s when spa is false (e.g. 404.html). Ignored when spa is true."
                syncIntervalSeconds:
                  type: integer
                  default: 30
                  description: "How often the server re-syncs the bucket to pick up new uploads."
                build:
                  type: object
                  required: [repo]
                  description: "Amplify-style managed build: poll a git repo and, on a new commit, clone it, run the build command in a sandboxed Job, and publish the output directory to the site bucket (the server then picks it up). Omit to upload pre-built assets yourself."
                  properties:
                    repo:
                      type: string
                      description: "Git repository URL (https), e.g. https://github.com/me/app.git."
                    branch:
                      type: string
                      default: main
                      description: "Branch to build."
                    buildCommand:
                      type: string
                      default: "npm ci && npm run build"
                      description: "Shell command run at the repo root to produce the output (runs in the build image)."
                    outputDir:
                      type: string
                      default: dist
                      description: "Directory (relative to the repo root) whose contents are published to the bucket."
                    image:
                      type: string
                      default: node:20-alpine
                      description: "Build container image — must carry the toolchain buildCommand needs. Runs sandboxed (non-root, no cluster credentials)."
                    pollSeconds:
                      type: integer
                      default: 300
                      description: "How often to poll the repo for new commits (a rebuild runs only when the branch HEAD changes). The first build runs on the first poll."
                    secret:
                      type: string
                      description: "Optional Secret (this namespace) with git credentials for a private repo: key GIT_TOKEN (https token/PAT)."
                    env:
                      type: array
                      description: "Build-time environment variables passed to the build command."
                      items:
                        type: object
                        required: [name, value]
                        properties:
                          name: { type: string }
                          value: { type: string }
            status:
              type: object
              properties:
                url: { type: string }
                bucket: { type: string }
                ready: { type: boolean }
