# The compiler for kind: Table. It renders a spec-mirror ConfigMap in the aws-shim's OWN namespace
# (open-infra-aws-shim) — the DynamoDB service's domain, so the table registry lives with the
# service that owns it (AWS-shaped), not in the console/IAM namespace (which the control-plane
# authorizer deliberately fences off). Labeled openinfra.dev/dynamo-table, holding the table's name + ordered key attributes (+ an
# optional TTL attribute). The aws-shim reads these ConfigMaps and registers each table in its
# FerretDB registry (the same entry a runtime CreateTable writes) — so a declared table is
# usable (PutItem/GetItem/…) without a manual CreateTable call. The shim is the reconciler
# because it is the one process that holds the FerretDB creds and owns the registry contract;
# see console-api/cmd/aws-shim/dynamo_tables.go and docs/aws-shim.md.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: table
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XTable
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- $table := $spec.tableName | default $name }}
            {{- $keyAttrs := list $spec.hashKey.name }}
            {{- if $spec.rangeKey }}{{- $keyAttrs = append $keyAttrs $spec.rangeKey.name }}{{- end }}
            {{- $gsis := list }}
            {{- range $g := ($spec.globalSecondaryIndexes | default list) }}
              {{- $ka := list $g.hashKey.name }}
              {{- if $g.rangeKey }}{{- $ka = append $ka $g.rangeKey.name }}{{- end }}
              {{- $gsis = append $gsis (dict "name" $g.name "keyAttrs" $ka) }}
            {{- end }}
            {{- /* LSIs share the table's HASH key and add an alternate RANGE key: keyAttrs = [tableHash, lsiRange]. */}}
            {{- $lsis := list }}
            {{- range $l := ($spec.localSecondaryIndexes | default list) }}
              {{- if not $spec.rangeKey }}{{- fail "kind: Table localSecondaryIndexes require the table to have a rangeKey" }}{{- end }}
              {{- $lka := list $spec.hashKey.name $l.rangeKey.name }}
              {{- $lsis = append $lsis (dict "name" $l.name "keyAttrs" $lka) }}
            {{- end }}
            {{- /* DynamoDB Streams: record the view type so the shim opens a change stream for the table. */}}
            {{- $streamView := "" }}
            {{- if $spec.streamSpecification }}{{- $streamView = $spec.streamSpecification.streamViewType }}{{- end }}
            ---
            # Spec mirror the aws-shim reads (label-selected) to register the table's registry entry.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: table-spec
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: openinfra-dynamo-table-{{ $name }}
                    # The aws-shim's own namespace: the DynamoDB service owns its table registry
                    # (TABLE_CONFIG_NAMESPACE must match). Must NOT be open-infra-console — the
                    # control-plane authorizer fences the shim out of that IAM/console namespace.
                    namespace: open-infra-aws-shim
                    labels:
                      openinfra.dev/dynamo-table: {{ $name }}
                      openinfra.dev/table-namespace: {{ $ns }}
                  data:
                    tableName: {{ $table | quote }}
                    keyAttrs: {{ $keyAttrs | toJson | quote }}
                    billingMode: "{{ $spec.billingMode | default "PAY_PER_REQUEST" }}"
                    {{- if $spec.ttlAttribute }}
                    ttlAttribute: {{ $spec.ttlAttribute | quote }}
                    {{- end }}
                    {{- if $gsis }}
                    gsi: {{ $gsis | toJson | quote }}
                    {{- end }}
                    {{- if $lsis }}
                    lsi: {{ $lsis | toJson | quote }}
                    {{- end }}
                    {{- if $streamView }}
                    streamViewType: {{ $streamView | quote }}
                    {{- end }}
            ---
            apiVersion: openinfra.dev/v1
            kind: XTable
            status:
              ready: true
              tableName: {{ $table | quote }}
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
