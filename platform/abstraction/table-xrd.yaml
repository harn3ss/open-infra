# kind: Table — a DynamoDB-shaped key/value table (AWS DynamoDB equivalent). One claim ->
# a registered table on the aws-shim's DynamoDB data layer (FerretDB): its name and key
# schema are recorded so items can be written (PutItem) without a runtime CreateTable, and
# a TTL attribute (if declared) is enforced by the shim's reaper.
#
# This is a THIN declarative front, not a standalone managed database. A Table functions only
# where the aws-shim DynamoDB front door is enabled (the `awsShim` component, opt-in / off by
# default) — the shim is the one process that holds the FerretDB creds and owns the table
# registry, so it reconciles declared tables (see the composition + docs/aws-shim.md). The key
# schema is IMMUTABLE, exactly as in DynamoDB — you cannot change a table's hash/range key after
# it is created; delete and recreate instead.
#
# GLOBAL + LOCAL secondary indexes, TTL, AND STREAMS ARE modelled — spec.globalSecondaryIndexes and
# spec.localSecondaryIndexes (both backed by real Mongo indexes; LSI shares the table HASH key and
# requires a rangeKey) + spec.ttlAttribute (shim reaper) + spec.streamSpecification (a change log
# read via the dynamodbstreams API). NOT modelled: read/write capacity (billingMode is advisory
# CFN-round-trip metadata only — the FerretDB store has no capacity model), PITR/continuous-backup,
# per-table SSE. Reach for a real managed database (kind: Application.database) when you need the rest.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xtables.openinfra.dev
  annotations:
    openinfra.dev/chaos-role: "none"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names: { kind: XTable, plural: xtables }
  claimNames: { kind: Table, plural: tables }
  defaultCompositionRef: { name: table }
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [hashKey]
              properties:
                tableName:
                  type: string
                  description: "The DynamoDB table name clients address (the X-Amz-Target TableName). Defaults to the claim name. Immutable."
                  pattern: '^[A-Za-z0-9_.-]{3,255}$'
                hashKey:
                  type: object
                  description: "The partition (HASH) key. Immutable, as in DynamoDB."
                  required: [name, type]
                  properties:
                    name: { type: string, description: "Attribute name of the partition key." }
                    type:
                      type: string
                      enum: ["S", "N", "B"]
                      description: 'Scalar key type: S (string), N (number), or B (binary). Quote the value in YAML (type: "N") — an unquoted N is YAML''s boolean false.'
                rangeKey:
                  type: object
                  description: "The optional sort (RANGE) key. Immutable, as in DynamoDB."
                  required: [name, type]
                  properties:
                    name: { type: string, description: "Attribute name of the sort key." }
                    type:
                      type: string
                      enum: ["S", "N", "B"]
                      description: 'Scalar key type: S (string), N (number), or B (binary). Quote the value in YAML (type: "N") — an unquoted N is YAML''s boolean false.'
                billingMode:
                  type: string
                  default: PAY_PER_REQUEST
                  enum: [PAY_PER_REQUEST, PROVISIONED]
                  description: "Advisory metadata only — the FerretDB-backed store has no capacity/billing model; mirrors DynamoDB's field so a CloudFormation table round-trips."
                ttlAttribute:
                  type: string
                  description: "Optional. Enables Time-To-Live on this numeric (epoch-seconds) attribute; the shim's reaper deletes items whose value is at or before now."
                globalSecondaryIndexes:
                  type: array
                  description: "Global secondary indexes — query the table by a non-primary key. Each is backed by a real Mongo index on its key attributes; a Query with this IndexName filters on those attributes. The store keeps full items, so projection is always effectively ALL."
                  items:
                    type: object
                    required: [name, hashKey]
                    properties:
                      name:
                        type: string
                        description: "Index name — the Query IndexName."
                      hashKey:
                        type: object
                        description: "The index's partition key."
                        required: [name, type]
                        properties:
                          name: { type: string, description: "Attribute name of the index partition key." }
                          type:
                            type: string
                            enum: ["S", "N", "B"]
                            description: 'Scalar key type: S / N / B. Quote it in YAML (type: "N").'
                      rangeKey:
                        type: object
                        description: "The index's optional sort key."
                        required: [name, type]
                        properties:
                          name: { type: string, description: "Attribute name of the index sort key." }
                          type:
                            type: string
                            enum: ["S", "N", "B"]
                            description: 'Scalar key type: S / N / B. Quote it in YAML.'
                streamSpecification:
                  type: object
                  description: "DynamoDB Streams — emit an ordered change record (INSERT/MODIFY/REMOVE) for every item write, readable via the dynamodbstreams API (DescribeStream/GetShardIterator/GetRecords). Off unless set. v1: a single shard; captures single-item PutItem/UpdateItem/DeleteItem."
                  required: [streamViewType]
                  properties:
                    streamViewType:
                      type: string
                      enum: [KEYS_ONLY, NEW_IMAGE, OLD_IMAGE, NEW_AND_OLD_IMAGES]
                      description: "What each change record carries: KEYS_ONLY (just the key), NEW_IMAGE (item after), OLD_IMAGE (item before), or NEW_AND_OLD_IMAGES (both)."
                localSecondaryIndexes:
                  type: array
                  description: "Local secondary indexes — query the table by an alternate sort key under the SAME partition (HASH) key. Declared at table creation (immutable, as in DynamoDB), each backed by a real Mongo index on (table hashKey, this rangeKey). Requires the table to have a rangeKey. Like GSIs, projection is effectively ALL (the store keeps full items)."
                  items:
                    type: object
                    required: [name, rangeKey]
                    properties:
                      name:
                        type: string
                        description: "Index name — the Query IndexName."
                      rangeKey:
                        type: object
                        description: "The index's sort key (the partition key is the table's hashKey)."
                        required: [name, type]
                        properties:
                          name: { type: string, description: "Attribute name of the index sort key." }
                          type:
                            type: string
                            enum: ["S", "N", "B"]
                            description: 'Scalar key type: S / N / B. Quote it in YAML (type: "N").'
            status:
              type: object
              properties:
                tableName: { type: string }
                ready: { type: boolean }
