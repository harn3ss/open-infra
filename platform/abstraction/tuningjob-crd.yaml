# kind: TuningJob — hyperparameter tuning (SageMaker Automatic Model Tuning). Give it a
# base training spec, a search space, and an objective; the singleton tuning controller
# runs a kind: TrainingJob per hyperparameter combination (grid search), reads each
# trial's reported metric from its logs, and records the best in status.
#
# A plain CRD (not a Crossplane claim), like kind: Execution: a TuningJob is a RUN whose
# status the controller owns (trials, best result) — not declared infrastructure, so it
# is started from the console or kubectl and is deliberately absent from Terraform. Each
# trial IS a kind: TrainingJob, so tuning reuses the whole training data plane.
#
# The trial container reports its objective by printing `OPENINFRA_METRIC=<value>`
# (override with spec.metricRegex).
#
# Synced before the controller RBAC that references it (sync-wave 1).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tuningjobs.openinfra.dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: openinfra.dev
  scope: Namespaced
  names:
    kind: TuningJob
    plural: tuningjobs
    singular: tuningjob
    shortNames: [tune]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [training, parameters]
              properties:
                training:
                  type: object
                  required: [image]
                  description: "The base training spec each trial runs (a kind: TrainingJob). The tuned hyperparameters are added to its env per trial, and each trial gets its own output prefix."
                  properties:
                    image:   { type: string, description: "Training container image. Must print the objective as `OPENINFRA_METRIC=<value>` (or match metricRegex)." }
                    command: { type: array, items: { type: string } }
                    args:    { type: array, items: { type: string } }
                    gpu:     { type: integer, default: 0, description: "GPUs per trial (0 = CPU)." }
                    gpuTier: { type: string, enum: [smallgpu, largegpu], default: smallgpu }
                    cpu:     { type: string }
                    memory:  { type: string }
                    dataset: { type: object, properties: { bucket: { type: string }, prefix: { type: string } } }
                    output:  { type: object, properties: { bucket: { type: string }, prefix: { type: string } }, description: "Base artifact location; each trial writes under <prefix>/<trial>/." }
                    env:
                      type: array
                      description: "Base environment (constant across trials)."
                      items: { type: object, properties: { name: { type: string }, value: { type: string } } }
                    secrets: { type: array, items: { type: string } }
                    maxRuntimeSeconds: { type: integer }
                parameters:
                  type: array
                  description: "The search space (grid search). Each parameter is swept over its discrete values and injected into the trial's env as name=value; trials are the cartesian product."
                  items:
                    type: object
                    required: [name, values]
                    properties:
                      name:   { type: string, description: "Environment variable name set on the trial (the hyperparameter)." }
                      values: { type: array, items: { type: string }, description: "Discrete values to try." }
                objective:
                  type: object
                  properties:
                    metric: { type: string, default: "OPENINFRA_METRIC" }
                    goal:   { type: string, enum: [Minimize, Maximize], default: Minimize, description: "Whether a lower or higher metric is better." }
                metricRegex:
                  type: string
                  description: "Regex with one capture group extracting the objective value from a trial's logs. Default: OPENINFRA_METRIC=([-0-9.eE+]+)."
                maxParallel:
                  type: integer
                  default: 1
                  description: "How many trials run concurrently."
                maxTrials:
                  type: integer
                  description: "Cap on the number of trials (the grid is truncated to this many)."
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:          { type: string, description: "Running | Succeeded | Failed" }
                bestTrial:      { type: string }
                bestValue:      { type: string }
                bestParameters: { type: string }
                trialsTotal:    { type: integer }
                trialsComplete: { type: integer }
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Trials
          type: string
          jsonPath: .status.trialsComplete
        - name: Best
          type: string
          jsonPath: .status.bestValue
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
