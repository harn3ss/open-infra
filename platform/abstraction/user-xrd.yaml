# open-infra's "IAM users": kind: User and kind: Group — console identities as declarative
# resources instead of a JSON blob inside the console-auth Secret, so accounts are
# GitOps-managed like everything else.
#
# WHY A SEPARATE API GROUP (iam.openinfra.dev, not openinfra.dev):
# Kubernetes RBAC is purely ADDITIVE — a wildcard GRANTS. The console's readonly role
# holds `apiGroups: [openinfra.dev], resources: ["*"]`, so putting identity kinds in that
# group would silently give every reader access to the objects that define who can do
# what, the moment these CRDs existed. A distinct group makes that boundary structural
# rather than a list someone must remember to maintain.
#
# A User does NOT itself grant anything: it names an identity and its groups. Those become
# the Impersonate-User / Impersonate-Group headers the console sends, and RBAC bindings on
# `openinfra:<group>` are what actually confer permission. See docs/iam.md.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xusers.iam.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "none"
    openinfra.dev/chaos-offers: ""
    openinfra.dev/chaos-accepts: ""
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: iam.openinfra.dev
  names:
    kind: XUser
    plural: xusers
  claimNames:
    kind: User
    plural: users
  defaultCompositionRef:
    name: user
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                displayName:
                  type: string
                  description: Human-readable name shown in the console.
                email:
                  type: string
                  description: Optional contact address; not used for authentication.
                groups:
                  type: array
                  description: >-
                    The groups this user is a member of (AWS AddUserToGroup) — membership only: a group
                    confers its attached policies, as on AWS. (A group still in the deprecated
                    permission-tier form grants its clusterRole through the openinfra:<group>
                    impersonation until the cutover rewrites it.)
                  items:
                    type: string
                  default: []
                policies:
                  type: array
                  description: >-
                    The policies attached to this user (AWS AttachUserPolicy): names of kind: Policy — an
                    AWS managed policy by its object name (aws-readonlyaccess) or a customer policy's name.
                    With the user's groups' policies and inline policies these are the user's identity
                    policies, which the one evaluator reads at every door. A user with no policies, through
                    itself or a group, can sign in and do nothing, as on AWS.
                  items:
                    type: string
                  default: []
                inlinePolicies:
                  type: array
                  description: >-
                    Inline policies embedded in this user (AWS PutUserPolicy): each a name and an AWS policy
                    document, deleted with the user.
                  items:
                    type: object
                    required: [name, document]
                    properties:
                      name:
                        type: string
                        maxLength: 128
                      document:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        required: [Statement]
                        properties:
                          Version:
                            type: string
                            enum: ["2012-10-17", "2008-10-17"]
                          Id:
                            type: string
                          Statement:
                            x-kubernetes-preserve-unknown-fields: true
                            description: One statement object or a list of them (Effect, Action/NotAction, Resource/NotResource, Condition), as AWS accepts.
                permissionBoundary:
                  type: string
                  description: >-
                    Optional permission boundary (AWS PutUserPermissionsBoundary): the name of a kind:
                    Policy whose Allow statements (spec.document; or its earlier dataPlane block) are the
                    CEILING for this user's authority. The effective permission is the INTERSECTION of the
                    user's identity policies (spec.policies + any Policy whose appliesTo names them) and
                    this boundary — nothing outside the boundary can be allowed (compiled as a Cedar
                    forbid-unless guard, fail-closed). It caps a user already governed at the data plane
                    for a service; it does not itself confer access.
                source:
                  type: string
                  description: >-
                    Where the password is verified. `local` uses passwordSecretRef;
                    `ldap` and `oidc` defer to the configured directory (AUTH_MODE).
                  enum: [local, ldap, oidc]
                  default: local
                passwordSecretRef:
                  type: object
                  description: >-
                    Secret holding a BCRYPT HASH (never a password) for source=local.
                    Omit for ldap/oidc users.
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: hash
                    namespace:
                      type: string
                      description: >-
                        Where the Secret is: omitted for the console's own namespace, or the IAM credential
                        store's (the aws-shim's KEYS_NAMESPACE) for a login profile set through the IAM API
                        (CreateLoginProfile). A sign-in accepts a store Secret only if it is this user's own
                        login profile; any other namespace is refused.
                  required: [name]
                disabled:
                  type: boolean
                  description: Suspend sign-in without deleting the account or its history.
                  default: false
              required: [displayName]
            status:
              type: object
              properties:
                ready:
                  type: boolean
                groups:
                  type: array
                  items:
                    type: string
