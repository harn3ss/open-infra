                                        if status == "Success" and code != 0:
                                            status, note = "Failed", "failed to run commands: exit status %d" % code
                                        stderr = read_capped(err_path)
                                        if note:
                                            stderr = (stderr + ("\n" if stderr and not stderr.endswith("\n") else "") + note)[:OUTPUT_CAP]
                                        return {"Status": status, "ResponseCode": code, "StandardOutputContent": read_capped(out_path),
                                                "StandardErrorContent": stderr}
