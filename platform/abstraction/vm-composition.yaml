                                    return [c for c in (doc.get("Commands") or []) if isinstance(c, dict) and c.get("CommandId")]

                                def execute(self, cmd):
                                    """Runs one AWS-RunShellScript command as root; returns its report."""
                                    params = cmd.get("Parameters") or {}
                                    lines = [str(c) for c in (params.get("commands") or [])]
                                    workdir = str((params.get("workingDirectory") or [""])[0] or "").strip()
                                    try:
                                        timeout = int((params.get("executionTimeout") or ["3600"])[0])
                                    except (TypeError, ValueError):
                                        timeout = 3600
                                    timeout = min(max(timeout, 1), 172800)
                                    d = os.path.join(self.work_dir, re.sub(r"[^A-Za-z0-9-]", "", cmd["CommandId"])[:64] or "command")
                                    os.makedirs(d, 0o700, exist_ok=True)
                                    os.chmod(self.work_dir, 0o700)
                                    try:
                                        script = os.path.join(d, "_script.sh")
                                        with open(script, "w") as fh:
                                            fh.write("\n".join(lines) + "\n")
                                        os.chmod(script, 0o700)
                                        out_path, err_path = os.path.join(d, "stdout"), os.path.join(d, "stderr")
                                        status, code, note = "Success", 0, ""
                                        with open(out_path, "wb") as out, open(err_path, "wb") as err, open(os.devnull, "rb") as nul:
                                            try:
                                                p = subprocess.Popen(["/bin/sh", script], cwd=workdir or d, stdin=nul, stdout=out,
                                                                     stderr=err, start_new_session=True)
