                                        detail = e.read()[:300].decode("utf-8", "replace").strip()
                                        raise CredentialsError("aws-shim %s answered HTTP %d: %s" % (url, e.code, detail), e.code)
                                    except (urllib.error.URLError, socket.timeout, OSError, ssl.CertificateError) as e:
                                        raise CredentialsError("cannot reach the aws-shim at %s: %s" % (url, getattr(e, "reason", e)))
