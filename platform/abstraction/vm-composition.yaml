                            #!/usr/bin/env python3
                            # open-infra OCI runtime wrapper (Docker's default runtime in a kind: VirtualMachine guest). A container
                            # does not inherit the guest's environment, so a container's AWS SDK would call AWS's own endpoints. For
                            # `create` and `run` this adds the guest's AWS endpoint and CA (the metadata agent's config, key
                            # "containers") to the bundle's config.json: each variable only when the container does not set it
                            # itself, and the CA bundle as a read-only mount at the same path. A container with
                            # OPENINFRA_AWS_ENV=off in its environment is left as it is. Then it runs the real runc with the same
                            # arguments. Anything unexpected leaves the container unchanged rather than failing it.

                            import json
                            import os
                            import sys

                            CONFIG = os.environ.get("OPENINFRA_METADATA_CONFIG", "/etc/openinfra/metadata-agent.json")
                            RUNCS = ("/usr/bin/runc", "/usr/sbin/runc", "/usr/local/bin/runc", "/usr/local/sbin/runc")
                            VALUE_FLAGS = ("--root", "--log", "--log-format", "--criu", "--rootless")  # runc global flags that take a value
                            OPT_OUT = "OPENINFRA_AWS_ENV=off"


                            def real_runc():
                                pinned = os.environ.get("OPENINFRA_RUNC")
                                if pinned:
                                    return pinned
                                me = os.path.realpath(os.path.abspath(sys.argv[0]))
                                for p in RUNCS:
                                    if os.path.isfile(p) and os.access(p, os.X_OK) and os.path.realpath(p) != me:
                                        return p
                                return None


                            def bundle_of(args):
                                """(subcommand, bundle dir or None): the bundle only for create/run (default: the working directory)."""
                                i, sub = 0, None
                                while i < len(args):
                                    a = args[i]
                                    if a in VALUE_FLAGS:
                                        i += 2
                                        continue
                                    if a.startswith("-"):
                                        i += 1
                                        continue
                                    sub = a
                                    break
                                if sub not in ("create", "run"):
                                    return sub, None
                                rest, bundle = args[i + 1:], None
                                for j, a in enumerate(rest):
                                    if a in ("--bundle", "-b") and j + 1 < len(rest):
                                        bundle = rest[j + 1]
                                    elif a.startswith("--bundle="):
                                        bundle = a.split("=", 1)[1]
                                return sub, bundle or os.getcwd()


                            def inject(spec, env, ca_bundle, exists=os.path.exists, realpath=os.path.realpath):
                                """Add env + the CA mount to an OCI spec in place; True if it changed. Without the CA bundle on the
                                guest nothing is added: the endpoint verifies only against it."""
                                if not env or not ca_bundle or not exists(ca_bundle):
                                    return False
                                proc = spec.get("process")
                                if not isinstance(proc, dict):
                                    return False
                                cur = list(proc.get("env") or [])
                                if OPT_OUT in cur:
                                    return False
                                names = set(e.split("=", 1)[0] for e in cur)
                                added = [e for e in env if e.split("=", 1)[0] not in names]
                                mounts = spec.get("mounts")
                                if not isinstance(mounts, list):
                                    mounts = []
                                mount = not any(isinstance(m, dict) and m.get("destination") == ca_bundle for m in mounts)
                                if not added and not mount:
                                    return False
                                proc["env"] = cur + added
                                if mount:
                                    mounts.append({"destination": ca_bundle, "type": "bind", "source": realpath(ca_bundle),
                                                   "options": ["rbind", "ro", "nosuid", "nodev"]})
                                    spec["mounts"] = mounts
                                return True


                            def containers_cfg(path=CONFIG):
                                with open(path) as fh:
                                    c = json.load(fh).get("containers") or {}
                                return [e for e in (c.get("env") or []) if isinstance(e, str) and "=" in e], c.get("caBundle") or ""


                            def main(argv):
                                args = argv[1:]
                                runc = real_runc()
                                if not runc:
                                    sys.stderr.write("openinfra-oci: no runc binary found (%s)\n" % ", ".join(RUNCS))
                                    return 127
                                try:
                                    sub, bundle = bundle_of(args)
                                    if bundle:
                                        path = os.path.join(bundle, "config.json")
                                        with open(path) as fh:
                                            spec = json.load(fh)
                                        env, ca = containers_cfg()
                                        if inject(spec, env, ca):
                                            tmp = path + ".openinfra-tmp"
                                            with open(tmp, "w") as fh:
                                                json.dump(spec, fh)
                                            os.replace(tmp, path)
                                except Exception as e:  # never fail a container over this
                                    sys.stderr.write("openinfra-oci: container left unchanged: %s\n" % e)
                                sys.stderr.flush()  # before Python 3.9 a piped stderr is block-buffered, and execv drops the buffer
                                os.execv(runc, [runc] + args)


                            if __name__ == "__main__":
                                sys.exit(main(sys.argv))
                        {{- /* The endpoint plugin for the distro aws CLI v1 (awscli 1.22, Ubuntu 22.04): v1 predates
                               AWS_ENDPOINT_URL, so on `top-level-args-parsed` this sets the endpoint from the environment
                               when the command gave no --endpoint-url. The agent makes it importable (a .pth) and lists it
                               in the CLI config's [plugins]. aws-cli v2 reads that config but ignores [plugins] without
                               cli_legacy_plugin_path (kept out), so the plugin loads only under v1. NO template actions. */}}
                        - path: /usr/local/lib/openinfra/awscli-plugins/openinfra_endpoint_plugin.py
                          permissions: '0644'
                          content: |
                            # open-infra aws-cli v1 plugin: use AWS_ENDPOINT_URL when no --endpoint-url is given.
                            #
                            # aws-cli v1 (botocore before ~1.27) does not read AWS_ENDPOINT_URL, so an unmodified call like
                            # `aws s3 cp s3://b/k .` in a guest goes to AWS's own endpoint. This plugin, listed in the CLI
                            # config's [plugins] section, registers on the global-args event and, when the command set no
                            # --endpoint-url, fills in the endpoint from AWS_ENDPOINT_URL (the full system endpoint the guest's
                            # environment already names). An explicit --endpoint-url always wins. aws-cli v2 reads AWS_ENDPOINT_URL
                            # itself and never loads this (its [plugins] needs cli_legacy_plugin_path, which the agent keeps unset).
                            import os


                            def _set_endpoint_from_env(parsed_args, **kwargs):
                                if getattr(parsed_args, "endpoint_url", None):
                                    return  # an explicit --endpoint-url wins
                                endpoint = os.environ.get("AWS_ENDPOINT_URL")
                                if endpoint:
                                    # A raw string; aws-cli's own resolve_types validates the scheme right after this runs.
                                    parsed_args.endpoint_url = endpoint


                            def awscli_initialize(event_hooks):
                                event_hooks.register(
                                    "top-level-args-parsed", _set_endpoint_from_env,
                                    unique_id="openinfra-endpoint-from-env")
                        {{- end }}
                        {{- end }}
                        {{- if $spec.userData }}
                        - path: /opt/openinfra-userdata
                          permissions: '0755'
                          content: {{ $spec.userData | toJson }}
                        {{- end }}
                        {{- if or $dataDisks $attached }}
                        {{- /* AWS device-name aliases (#115/#344): an unmodified lift-and-shift UserData
                               script formats/mounts its data disk by the Nitro name AWS gives it
                               (/dev/nvme1n1, …) or by its mapping's DeviceName (/dev/sdf, /dev/xvdf), but
                               KubeVirt presents virtio disks (/dev/vd*). udev symlinks bridge the two so the
                               script runs unchanged. They are keyed by each disk's serial (oi-nvme<n>, set
                               on the disk above), not by its kernel name: the cloud-init seed disk is a
                               virtio disk too, so vd* order does not say which disk is which. The root is
                               nvme0n1; data disks, then attached volumes, are nvme1n1, nvme2n1, … in order;
                               a disk with a deviceName also gets that name and its sd/xvd twin. Partitions
                               alias through %n (nvme1n1p1, sdf1). */}}
                        - path: /etc/udev/rules.d/99-openinfra-aws-device-names.rules
                          content: |
                            KERNEL=="vd*[!0-9]", ATTRS{serial}=="oi-nvme0", SYMLINK+="nvme0n1"
                            KERNEL=="vd*[0-9]", ATTRS{serial}=="oi-nvme0", SYMLINK+="nvme0n1p%n"
                            {{- $aliasDisks := list }}
                            {{- range $dd := $dataDisks }}{{ $aliasDisks = append $aliasDisks ($dd.deviceName | default "") }}{{ end }}
                            {{- range $av := $attached }}{{ $aliasDisks = append $aliasDisks ($av.deviceName | default "") }}{{ end }}
                            {{- range $i, $dev := $aliasDisks }}
                            {{- $n := add $i 1 }}
                            {{- $sfx := regexReplaceAll "^/dev/(sd|xvd)" (printf "%v" $dev) "" }}
                            {{- $twins := "" }}{{- $ptwins := "" }}
                            {{- if and $dev (regexMatch "^[a-z]{1,2}$" $sfx) }}
                            {{-   $twins = printf " sd%s xvd%s" $sfx $sfx }}{{- $ptwins = printf " sd%s%%n xvd%s%%n" $sfx $sfx }}
                            {{- end }}
                            KERNEL=="vd*[!0-9]", ATTRS{serial}=="oi-nvme{{ $n }}", SYMLINK+="nvme{{ $n }}n1{{ $twins }}"
                            KERNEL=="vd*[0-9]", ATTRS{serial}=="oi-nvme{{ $n }}", SYMLINK+="nvme{{ $n }}n1p%n{{ $ptwins }}"
                            {{- end }}
                        {{- end }}
                      {{- end }}
                      {{- if $guestIdentity }}
                      {{- /* Mount the workload-identity token iso and copy the token, ROOT-ONLY (0600 in a
                             0700 dir), to /run on every boot (tmpfs; re-done each boot), then unmount the
                             iso. Only the root-run metadata agent reads it — it authenticates to the shim
                             on every caller's behalf — so no workload process can read the raw token.
                             Whitespace is stripped (a JWT has none; a stray newline would corrupt the
                             Authorization header). */}}
                      bootcmd:
                        - [ bash, -c, "umask 077; mkdir -p /mnt/openinfra-identity /run/openinfra-identity; chmod 0700 /run/openinfra-identity; mountpoint -q /mnt/openinfra-identity || mount -o ro /dev/disk/by-id/virtio-SATOKEN /mnt/openinfra-identity 2>/dev/null || mount -o ro -L cfgdata /mnt/openinfra-identity 2>/dev/null || true; tr -d '[:space:]' < /mnt/openinfra-identity/token > /run/openinfra-identity/token.tmp && chown root:root /run/openinfra-identity/token.tmp && chmod 0600 /run/openinfra-identity/token.tmp && mv -f /run/openinfra-identity/token.tmp /run/openinfra-identity/token; umount /mnt/openinfra-identity 2>/dev/null; true" ]
                      {{- end }}
                      {{- if not $guestIdentity }}
                      bootcmd:
                      {{- end }}
                        {{- /* Refresh the metadata agent's own files from this VM's CURRENT spec at every boot
                               (bootcmd runs every boot, before the agent starts). write_files runs once per
                               instance, so without this a guest would keep the agent, its config and the
                               platform root CA it was created with: an older agent that sends its token over
                               plain HTTP, the old IMDS guard and hop limit, a rotated-away root. KubeVirt builds
                               the NoCloud disk (label cidata) from the <vm>-cloudinit Secret at every VM start,
                               so it holds the spec as it is now; only the agent's files are rewritten, only
                               when they differ, and an unreadable disk or a guest without PyYAML (cloud-init's
                               own dependency) leaves them as they are. OPENINFRA_REFRESH_SRC / _ROOT are for
                               test/render only. */}}
                        - - sh
                          - -c
                          - 'for py in python3 /usr/libexec/platform-python; do command -v "$py" >/dev/null 2>&1 && exec "$py" -c "$1"; done; echo "openinfra-agent-refresh: no python3" >&2'
                          - openinfra-agent-refresh
                          - |
                            import os, subprocess, sys, tempfile
                            MANAGED = ("/usr/local/lib/openinfra/metadata-agent.py", "/etc/openinfra/metadata-agent.json",
                                       "/etc/openinfra/platform-root-ca.pem", "/etc/systemd/system/openinfra-metadata.service",
                                       "/etc/openinfra-aws.env", "/etc/systemd/system.conf.d/10-openinfra-aws.conf",
                                       "/usr/local/lib/openinfra/oci-aws-env",
                                       "/usr/local/lib/openinfra/awscli-plugins/openinfra_endpoint_plugin.py")
                            UNITS = ("/etc/systemd/system/openinfra-metadata.service", "/etc/systemd/system.conf.d/10-openinfra-aws.conf")


                            def log(msg):
                                sys.stderr.write("openinfra-agent-refresh: %s\n" % msg)


                            def current_user_data(src):
                                if src:
                                    with open(os.path.join(src, "user-data"), "rb") as fh:
                                        return fh.read()
                                devs = [d for d in ("/dev/disk/by-label/cidata", "/dev/disk/by-label/CIDATA") if os.path.exists(d)]
                                if not devs:
                                    raise RuntimeError("no cidata disk")
                                mnt = tempfile.mkdtemp(prefix="openinfra-cidata-", dir="/run")
                                try:
                                    subprocess.check_call(["mount", "-o", "ro", devs[0], mnt], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                                    try:
                                        with open(os.path.join(mnt, "user-data"), "rb") as fh:
                                            return fh.read()
                                    finally:
                                        subprocess.call(["umount", mnt], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                                finally:
                                    os.rmdir(mnt)


                            def main(src, root):
                                try:
                                    import yaml
                                except ImportError:
                                    log("no PyYAML: the agent's files stay as they are")
                                    return 0
                                try:
                                    cfg = yaml.safe_load(current_user_data(src)) or {}
                                except Exception as e:
                                    log("cannot read this VM's current spec (%s): the agent's files stay as they are" % e)
                                    return 0
                                changed = []
                                for f in cfg.get("write_files") or []:
                                    path = f.get("path") if isinstance(f, dict) else None
                                    if path not in MANAGED or f.get("append") or f.get("encoding"):
                                        continue
                                    content = f.get("content") or ""
                                    data = content.encode("utf-8") if not isinstance(content, bytes) else content
                                    mode = int(str(f.get("permissions") or "0644"), 8)
                                    dest = root + path
                                    try:
                                        with open(dest, "rb") as fh:
                                            if fh.read() == data and os.stat(dest).st_mode & 0o7777 == mode:
                                                continue
                                    except (IOError, OSError):
                                        pass
                                    if not os.path.isdir(os.path.dirname(dest)):
                                        os.makedirs(os.path.dirname(dest), 0o755)
                                    tmp = dest + ".openinfra-tmp"
                                    with open(tmp, "wb") as fh:
                                        fh.write(data)
                                    os.chmod(tmp, mode)
                                    os.rename(tmp, dest)
                                    changed.append(path)
                                if changed:
                                    log("refreshed from this VM's current spec: " + ", ".join(changed))
                                    if not root and any(p in UNITS for p in changed) and os.path.isdir("/run/systemd/system"):
                                        subprocess.call(["systemctl", "daemon-reload"])
                                return 0


                            sys.exit(main(os.environ.get("OPENINFRA_REFRESH_SRC", ""), os.environ.get("OPENINFRA_REFRESH_ROOT", "")))
                      runcmd:
                        {{- if $metadataAgent }}
                        # Start the instance metadata agent (and pick up the credentials env drop-in) BEFORE
                        # the boot script, so an `aws s3 cp` or a `docker pull` from the platform registry at
                        # first boot finds IMDS, the credentials endpoint and the platform root CA ready
                        # (Type=notify: this returns once the agent is ready).
                        - [ systemctl, daemon-reload ]
                        - [ systemctl, enable, --now, openinfra-metadata.service ]
                        {{- end }}
                        {{- if or $dataDisks $attached }}
                        # Materialize the AWS device-name symlinks BEFORE the user's UserData runs, so a
                        # script that formats/mounts /dev/nvme1n1 (or /dev/sdf) finds it.
                        - [ udevadm, control, --reload-rules ]
                        - [ udevadm, trigger ]
                        - [ udevadm, settle ]
                        {{- end }}
                        - [systemctl, enable, --now, qemu-guest-agent]
                        {{- if $spec.userData }}
                        # EXEC the script so its shebang is honored (AWS runs UserData this way; passing it
                        # to `sh` would ignore `#!/bin/bash` and run it under dash, where `set -o pipefail`
                        # aborts on line 1). Source the AWS SDK env first (credentials endpoint, CA bundle) —
                        # cloud-final.service is already running, so it predates the systemd
                        # DefaultEnvironment drop-in; `set -a` exports it to the script. The file is 0755
                        # and always carries a shebang (cfn prepends `#!/bin/sh` when none is given).
                        - [ bash, -c, "set -a; [ -f /etc/openinfra-aws.env ] && . /etc/openinfra-aws.env; set +a; exec /opt/openinfra-userdata" ]
                        {{- end }}
            {{- end }}
            {{- if $instanceRole }}
            ---
            # --- Per-VM workload identity (spec.instanceRole): a dedicated ServiceAccount whose token
            #     KubeVirt projects into the guest (serviceAccount volume below). The in-guest metadata
            #     agent presents that token to the aws-shim's /v1/vm-credentials endpoint and serves the
            #     rotating credentials it receives for the Role named here over EC2 IMDS (and the loopback
            #     container-credentials endpoint) — so no static keys ever touch the disk. The shim
            #     verifies the token (TokenReview) and reads this instance-role annotation to decide which
            #     Role to mint (that Role must trust "vm").
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vm-identity-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: vm-{{ $name }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/name: {{ $name }}
                      openinfra.dev/vm: "true"
                    annotations:
                      openinfra.dev/instance-role: {{ $instanceRole | toJson }}
                      openinfra.dev/vm: {{ $name }}
            {{- end }}
            {{- if $eipAlloc }}
            ---
            # --- The Elastic IP allocation's holder Service (the aws-shim's, in this namespace): observed
            #     only, for the address it holds. Ready once it holds one. ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vm-eip-holder
            spec:
              managementPolicies: ["Observe"]
              readiness:
                policy: DeriveFromCelQuery
                celQuery: "has(object.metadata.labels) && 'openinfra.dev/eip-holder' in object.metadata.labels && object.metadata.labels['openinfra.dev/eip-holder'] == 'true' && has(object.status.loadBalancer.ingress) && size(object.status.loadBalancer.ingress) > 0"
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata: { name: {{ $eipAlloc | toJson }}, namespace: {{ $ns | toJson }} }
            {{- end }}
            {{- if and (or $spec.expose $ports) (or (not $eipAlloc) $eipAddr) }}
            ---
            # --- LAN LoadBalancer (MetalLB): reach the VM from workstations. One IP
            #     carries the access port (SSH/RDP) plus any spec.ports (e.g. 80/443). ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vm-lan
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $name }}-lan
                    namespace: {{ $ns }}
                    labels: { openinfra.dev/vm-lan: {{ $name }} }
                    {{- if $eipAlloc }}
                    # The allocation's address, shared with its holder (same key, same selector).
                    annotations:
                      metallb.universe.tf/loadBalancerIPs: {{ $eipAddr | toJson }}
                      metallb.universe.tf/allow-shared-ip: {{ $eipAlloc | toJson }}
                    {{- end }}
                  spec:
                    type: LoadBalancer
                    # Preserve the client's real source IP so SecurityGroup CIDR rules
                    # can actually match LAN clients on these published ports (without
                    # this, MetalLB SNATs the source to a node IP and CIDR rules can't
                    # distinguish callers). MetalLB L2 announces from the VM's node.
                    externalTrafficPolicy: Local
                    {{- if $eipAlloc }}
                    selector: { openinfra.dev/eip-allocation: {{ $eipAlloc | toJson }} }
                    {{- else }}
                    selector: { kubevirt.io/domain: {{ $name }} }
                    {{- end }}
                    ports:
                      - { name: {{ $proto }}, port: {{ $port }}, targetPort: {{ $port }} }
                      {{- range $p := $ports }}
                      - { name: "{{ ($p.protocol | default "TCP") | lower }}{{ $p.port }}", port: {{ $p.port }}, targetPort: {{ $p.port }}, protocol: {{ $p.protocol | default "TCP" }} }
                      {{- end }}
            {{- end }}
            {{- /* The VM's LAN IP, read back once MetalLB assigns it to the <name>-lan
                   Service above (populated on the reconcile after the Service exists — the
                   same read-back kind: Directory uses for its VIP). Surfaced as
                   status.lanIp so the claim — and a CloudFormation stack Output for an
                   Elastic IP / an instance's PublicIp — can read the address. Empty while
                   unassigned, and when the VM is not exposed (so a stale IP never lingers). */}}
            {{- $lanIp := "" }}
            {{- if or $spec.expose $ports }}
            {{- $lanObs := index ($.observed.resources | default dict) "vm-lan" }}
            {{- if $lanObs }}{{- with $lanObs.resource.status }}{{- with .atProvider }}{{- with .manifest.status }}{{- with .loadBalancer }}{{- with .ingress }}{{- if gt (len .) 0 }}{{- $lanIp = ((index . 0).ip | default "") }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}
            {{- end }}
            ---
            # --- Composite status: the VM's LAN IP (see above). ---
            apiVersion: openinfra.dev/v1
            kind: XVirtualMachine
            status:
              lanIp: {{ $lanIp | quote }}
              {{- if $rootEnc }}
              {{- /* Kept once set: the copy onto the encrypted root is done exactly once. */}}
              rootPopulated: {{ $rootPopulated }}
              {{- end }}
            {{- if not $spec.securityGroups }}
            ---
            # --- Tenant isolation (ingress) for a VM with no security group. A VM with one is governed by
            #     its groups' policies alone, as on AWS. Without one, only this namespace and host-sourced
            #     traffic reach it, plus the ports it publishes on its LAN address (spec.expose /
            #     spec.ports), which are open to every source, as that LoadBalancer is (it keeps the
            #     client's IP, so those callers are not join IPs). Pod->Service calls keep the caller's
            #     pod IP (kube-ovn enable-lb), so the namespace is what tells tenants apart. ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: isolation-netpol
            spec:
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: {{ $name }}-vm-isolation
                    namespace: {{ $ns }}
                    labels: { openinfra.dev/isolation: tenant }
                  spec:
                    podSelector: { matchLabels: { kubevirt.io/domain: "{{ $name }}" } }
                    policyTypes: [Ingress]
                    ingress:
                      - from:
                          # this namespace
                          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $ns }} } }
                          # host-sourced traffic (hostNetwork Traefik; NodePort, LoadBalancer and external-IP Services
                          # through kube-proxy) arrives as a node's kube-ovn join IP
                          - ipBlock: { cidr: 100.64.0.0/16 }
                      {{- if or $spec.expose $ports }}
                      # the ports published on the VM's LAN LoadBalancer (vm-lan above), from any source
                      - ports:
                          - { protocol: TCP, port: {{ $port }} }
                          {{- range $p := $ports }}
                          - { protocol: {{ $p.protocol | default "TCP" }}, port: {{ $p.port }} }
                          {{- end }}
                      {{- end }}
            {{- end }}
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
