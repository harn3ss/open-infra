                                if not p.get("enabled") or not p.get("module") or not p.get("configFile"):
                                    return {}
                                if not os.path.isfile(p["module"]):
                                    LOG.warning("aws-cli v1 endpoint plugin module %s is missing; the distro CLI v1 keeps the gap", p["module"])
                                    return {"module": "missing"}
                                return {"path": "registered" if register_plugin_path(p["module"]) else "unregistered",
