# The compiler for kind: VirtualMachine -> a KubeVirt VirtualMachine with a
# persistent CDI disk (cloud image for Linux, a cloned golden image for Windows),
# first-boot config (cloud-init for Linux, cloudbase-init PowerShell for Windows),
# a Service, a connection Secret (<name>-vm: USERNAME/PASSWORD/HOST/PORT/ACCESS),
# and an optional LAN LoadBalancer (SSH 22 / RDP 3389).
#
# OS image + type come from a curated catalog ($catalog below, in sync with the
# XRD enum). The login password is derived deterministically from the composite's
# UID so it is stable across reconciles. Power state (spec.running) maps to
# runStrategy so the console can Start/Stop without the provider reverting it.
#
# Synced after the XRD (sync-wave 3).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: vm
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: openinfra.dev/v1
    kind: XVirtualMachine
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            {{- $ns := (index $labels "crossplane.io/claim-namespace") | default "default" }}
            {{- $cpu := $spec.cpu | default 2 }}
            {{- $memory := $spec.memory | default "2Gi" }}
            {{- $disk := $spec.diskSize | default "20Gi" }}
            {{- /* running defaults true; explicit hasKey check because Sprig
                   `default` treats boolean false as empty (would force true). */}}
            {{- $running := true }}{{- if hasKey $spec "running" }}{{- $running = $spec.running }}{{- end }}
            {{- $pass := printf "%s-vmpass" .observed.composite.resource.metadata.uid | sha256sum | trunc 20 }}
            {{- /* Curated OS catalog: os -> disk image + type. KEEP IN SYNC with the
                   XRD enum. Linux images are ready-made cloud images (containerdisks)
                   imported by CDI; windows clones the golden image PVC built once
                   built via kind: VmImage (console: VM Images). */}}
            {{- $catalog := dict
                  "ubuntu-24.04"    (dict "image" "quay.io/containerdisks/ubuntu:24.04"    "osType" "linux")
                  "ubuntu-22.04"    (dict "image" "quay.io/containerdisks/ubuntu:22.04"    "osType" "linux")
                  "fedora-40"       (dict "image" "quay.io/containerdisks/fedora:40"       "osType" "linux")
                  "debian-12"       (dict "image" "quay.io/containerdisks/debian:12"       "osType" "linux")
                  "centos-stream-9"     (dict "image" "quay.io/containerdisks/centos-stream:9" "osType" "linux")
                  "windows-server-2016" (dict "image" "" "osType" "windows")
                  "windows-server-2019" (dict "image" "" "osType" "windows")
                  "windows-server-2022" (dict "image" "" "osType" "windows")
                  "windows-server-2025" (dict "image" "" "osType" "windows") }}
            {{- $profile := (index $catalog $spec.os) | default (dict "image" "quay.io/containerdisks/ubuntu:24.04" "osType" "linux") }}
            {{- $isWin := eq $profile.osType "windows" }}
            {{- $port := 22 }}{{- $user := "openinfra" }}{{- $proto := "ssh" }}
            {{- if $isWin }}{{- $port = 3389 }}{{- $user = "Administrator" }}{{- $proto = "rdp" }}{{- end }}
            {{- /* Arch pin: Windows is STRUCTURALLY amd64 (q35 + MBR BIOS + amd64 sysprep), so it must
                   never schedule onto an arm64 node. Linux guests use multi-arch containerDisks and stay
                   flexible unless a per-resource openinfra.dev/arch (amd64|arm64) targets one. */}}
            {{- $vmAnnos := .observed.composite.resource.metadata.annotations | default dict }}
            {{- $vmArch := index $vmAnnos "openinfra.dev/arch" | default "" }}
            {{- if $isWin }}{{- $vmArch = "amd64" }}{{- end }}
            {{- /* Extra TCP ports to publish on the VM's LAN IP (the masquerade NIC
                   forwards all ports to the guest; the Service just advertises these). */}}
            {{- $ports := $spec.ports | default (list) }}
            {{- /* Windows root disk is FIXED and NOT user-selectable: a generalized
                   image's C: can't be reliably auto-grown, so a larger root would only
                   strand unallocated space. Extra Windows storage is added as separate
                   attachable volumes (EBS-style, issue #53). Linux keeps the user's
                   diskSize — cloud-init grows the rootfs to fit.
                   CRITICAL: this MUST be >= the golden image PVC's size — CDI refuses to
                   clone a source into a smaller target (ErrIncompatiblePVC) and the DV
                   wedges in CloneScheduled forever. The windows-*-golden images are
                   ~95.4Gi, so 100Gi clears them with headroom. Bump this if a future
                   golden rebuild grows past 100Gi. */}}
            {{- if $isWin }}{{- $disk = "100Gi" }}{{- end }}
            {{- $bridge := eq ($spec.network | default "masquerade") "bridge" }}
            {{- /* macvtap: supported direct-LAN mode — a second NIC on a macvtap device
                   over the parent LAN NIC. Unlike bridge (macvlan can't be a KubeVirt
                   bridge port), macvtap gives the VM a real LAN presence + DHCP lease. */}}
            {{- $macvtap := eq ($spec.network | default "masquerade") "macvtap" }}
            {{- /* $lan: either direct-LAN mode — shared node-affinity + dual-NIC DHCP. */}}
            {{- $lan := or $bridge $macvtap }}
            {{- /* highAvailability: root disk on Longhorn (migratable RWX block) + live migration */}}
            {{- $ha := $spec.highAvailability | default false }}
            {{- /* adopt an existing root PVC (migration/restore) instead of cloning the image */}}
            {{- $adopt := $spec.existingRootClaim | default "" }}
            {{- /* Instance identity (IMDS): the kind: Role this VM assumes. Labelled onto the VMI +
                   launcher pod so the instance-metadata responder can map the caller pod -> its role
                   and mint scoped credentials. Inert until the responder is deployed. */}}
            {{- $instanceRole := $spec.instanceRole | default "" }}
            {{- /* Extra boot-time data disks (#115 lift-and-shift): blank persistent volumes attached
                   as virtio devices in order (/dev/vdb, /dev/vdc, …), each following the root disk's
                   HA storage policy. Unnamed disks get data1, data2, … so the attach order is stable. */}}
            {{- $dataDisks := list }}
            {{- range $i, $dd := ($spec.dataDisks | default list) }}
            {{-   $ddname := $dd.name | default (printf "data%d" (add $i 1)) }}
            {{-   $dataDisks = append $dataDisks (dict "name" $ddname "size" $dd.size "encrypted" ($dd.encrypted | default false) "encryptionKey" ($dd.encryptionKey | default "")) }}
            {{- end }}
            {{- /* explicit CPU model for cross-node portability (else host-model / Nehalem when HA) */}}
            {{- $cpuModel := $spec.cpuModel | default "" }}
            {{- /* Boot firmware (bios|uefi + secureBoot + vTPM). A MIGRATED disk (existingRootClaim)
                   carries its boot mode baked into its partition layout, so guessing BIOS for a
                   UEFI-installed disk bricks the boot — refuse to guess, require firmware.mode. A fresh
                   clone boots the catalog image, which is MBR/BIOS, so it defaults to bios. */}}
            {{- $fw := $spec.firmware | default dict }}
            {{- $fwMode := $fw.mode | default "" }}
            {{- if and $adopt (not $fwMode) }}
            {{-   fail "kind: VirtualMachine existingRootClaim requires spec.firmware.mode (bios|uefi): a migrated disk's boot mode cannot be guessed — a UEFI-installed disk (GPT/ESP) will not boot under BIOS. Set it from the source instance's boot mode." }}
            {{- end }}
            {{- if and $isWin (not $adopt) (eq $fwMode "uefi") }}
            {{-   fail "kind: VirtualMachine spec.firmware.mode: uefi on a FRESH windows-server-* clone: the golden images are MBR/BIOS, so a UEFI clone would not boot. Boot a UEFI disk via existingRootClaim, or build a UEFI golden via kind: VmImage." }}
            {{- end }}
            {{- $fwMode = $fwMode | default "bios" }}
            {{- $secureBoot := $fw.secureBoot | default false }}
            {{- $vTPM := $fw.tpm | default false }}
            {{- if and $secureBoot (ne $fwMode "uefi") }}
            {{-   fail "kind: VirtualMachine spec.firmware.secureBoot requires spec.firmware.mode: uefi." }}
            {{- end }}
            {{- $efi := eq $fwMode "uefi" }}
            ---
            # --- The VM. dataVolumeTemplates provisions the persistent root disk via
            #     CDI (registry import for Linux; clone of the golden PVC for Windows).
            #     runStrategy follows spec.running so Start/Stop is a spec toggle. ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: virtualmachine
            spec:
              forProvider:
                manifest:
                  apiVersion: kubevirt.io/v1
                  kind: VirtualMachine
                  metadata:
                    name: {{ $name }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/name: {{ $name }}
                      openinfra.dev/vm: "true"
                      openinfra.dev/os: {{ $spec.os }}
                  spec:
                    runStrategy: {{ if $running }}Always{{ else }}Halted{{ end }}
                    {{- /* Root DV when not adopting; data-disk DVs always. Render the key if either
                           exists so an adopted-root VM can still get fresh data disks. */}}
                    {{- if or (not $adopt) $dataDisks }}
                    dataVolumeTemplates:
                      {{- if not $adopt }}
                      - metadata:
                          name: {{ $name }}-root
                        spec:
                          storage:
                            accessModes: [{{ if $ha }}ReadWriteMany{{ else }}ReadWriteOnce{{ end }}]
                            {{- if $ha }}
                            volumeMode: Block   # raw block is required for live-migratable Longhorn
                            {{- end }}
                            resources:
                              requests:
                                storage: {{ $disk }}
                            storageClassName: {{ if $ha }}longhorn-migratable{{ else }}local-path{{ end }}
                          source:
                            {{- if $isWin }}
                            # Clone the per-version golden image (build via kind: VmImage).
                            pvc:
                              namespace: openinfra-images
                              name: {{ $spec.os }}-golden
                            {{- else }}
                            registry:
                              url: "docker://{{ $profile.image }}"
                            {{- end }}
                      {{- end }}
                      {{- /* Blank data disks (#115). Same HA storage policy as root, so an HA VM's
                             data disks live-migrate with it. Guest formats/mounts them. */}}
                      {{- range $dd := $dataDisks }}
                      - metadata:
                          name: {{ $name }}-{{ $dd.name }}
                          {{- if $dd.encrypted }}
                          annotations:
                            # LUKS at rest: the volume-crypto reconciler keys this disk from the named
                            # EncryptionKey (CDI copies DataVolume annotations onto the PVC it creates,
                            # which is what the reconciler selects on). Destroying the key crypto-erases it.
                            openinfra.dev/encryption-key: {{ $dd.encryptionKey | quote }}
                          {{- end }}
                        spec:
                          storage:
                            {{- /* An encrypted disk is longhorn-encrypted (LUKS) and RWO — there is no
                                   encrypted+migratable class — so it ignores the HA/local-path policy
                                   (and pins live migration, as documented). Otherwise: HA → migratable
                                   RWX block; non-HA → local-path. */}}
                            accessModes: [{{ if $dd.encrypted }}ReadWriteOnce{{ else if $ha }}ReadWriteMany{{ else }}ReadWriteOnce{{ end }}]
                            {{- if or $ha $dd.encrypted }}
                            volumeMode: Block
                            {{- end }}
                            resources:
                              requests:
                                storage: {{ $dd.size }}
                            storageClassName: {{ if $dd.encrypted }}longhorn-encrypted{{ else if $ha }}longhorn-migratable{{ else }}local-path{{ end }}
                          source:
                            blank: {}
                      {{- end }}
                    {{- end }}
                    template:
                      metadata:
                        labels:
                          kubevirt.io/domain: {{ $name }}
                          app.kubernetes.io/name: {{ $name }}
                          {{- /* SecurityGroup membership: launcher pod inherits VMI labels,
                                 so attached SGs' NetworkPolicies select the VM. */}}
                          {{- range $sg := ($spec.securityGroups | default list) }}
                          openinfra.dev/sg-{{ $sg }}: ""
                          {{- end }}
                          {{- /* Instance identity: the metadata responder maps the caller pod's IP to
                                 this VMI and mints credentials for the named role. */}}
                          {{- if $instanceRole }}
                          openinfra.dev/instance-role: {{ $instanceRole }}
                          {{- end }}
                        {{- if $spec.subnet }}
                        annotations:
                          # Place the VM's launcher pod in a kind: Subnet (kube-ovn) — the VM inherits
                          # that subnet's OVN-enforced isolation (the AWS "launch in this subnet" model).
                          ovn.kubernetes.io/logical_switch: {{ $spec.subnet }}
                        {{- end }}
                      spec:
                        {{- if $vmArch }}
                        # Pin BOTH the VMI architecture and the launcher node arch. `architecture` matters
                        # at ADMISSION: on a non-amd64 control plane virt-api derives allowed machine types
                        # from the CP arch, so an x86 (q35) VM is REJECTED unless spec.architecture says
                        # amd64 (which also needs the KubeVirt CR architectureConfiguration for amd64 — set
                        # by install.sh on a mixed-arch cluster). nodeSelector then lands the launcher on a
                        # matching-arch node. Windows -> amd64 (structural); Linux only when
                        # openinfra.dev/arch targets one. (#51)
                        architecture: {{ $vmArch }}
                        nodeSelector: { kubernetes.io/arch: {{ $vmArch }} }
                        {{- end }}
                        {{- if $ha }}
                        # Drain a node -> live-migrate this VM off it (zero downtime) instead
                        # of killing it. Requires the migratable RWX block root disk above.
                        evictionStrategy: LiveMigrate
                        {{- end }}
                        {{- if or $lan (not $ha) }}
                        # One nodeSelectorTerm, matchExpressions AND-ed:
                        # - Direct-LAN VMs must land where the parent LAN NIC exists (openinfra.dev/vm-lan).
                        # - Fail-closed storage (#307): a non-HA VM's root disk is on local-path, so the
                        #   launcher node's disk-class must be nvme or sata-ssd. (HA roots live on Longhorn,
                        #   placed by Longhorn's own disk-class tags, so no node constraint is added here.)
                        affinity:
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    {{- if $lan }}
                                    - { key: openinfra.dev/vm-lan, operator: In, values: ["true"] }
                                    {{- end }}
                                    {{- if not $ha }}
                                    - { key: openinfra.dev/disk-class, operator: In, values: [nvme, sata-ssd] }
                                    {{- end }}
                        {{- end }}
                        domain:
                          cpu:
                            cores: {{ $cpu }}
                            {{- if $cpuModel }}
                            model: {{ $cpuModel }}
                            {{- else if $ha }}
                            # Live migration/reschedule needs a CPU model every target node
                            # supports; host-model (default) pins the VM to its source node.
                            # Nehalem is a universally-safe baseline; override per cluster with
                            # spec.cpuModel (e.g. the newest model common to all nodes).
                            model: Nehalem
                            {{- end }}
                          resources:
                            requests:
                              memory: {{ $memory }}
                          {{- if $efi }}
                          # UEFI/OVMF boot (spec.firmware.mode: uefi). secureBoot → OVMF secure-boot
                          # firmware (needs SMM, set in features below). A migrated UEFI disk (GPT + EFI
                          # system partition) boots only under this; see spec.firmware / existingRootClaim.
                          firmware:
                            bootloader:
                              efi:
                                secureBoot: {{ $secureBoot }}
                          {{- end }}
                          {{- if $isWin }}
                          # Windows: q35 + Hyper-V enlightenments. Boot firmware is spec.firmware (fresh
                          # clones use the MBR/BIOS golden; a migrated UEFI disk sets firmware.mode: uefi).
                          machine:
                            type: q35
                          features:
                            acpi: {}
                            apic: {}
                            {{- if $secureBoot }}
                            smm: { enabled: true }   # required by the OVMF Secure Boot firmware
                            {{- end }}
                            hyperv:
                              relaxed: {}
                              vapic: {}
                              spinlocks:
                                spinlocks: 8191
                          clock:
                            utc: {}
                            timer:
                              hpet:
                                present: false
                              hyperv: {}
                          {{- else if $secureBoot }}
                          # Non-Windows Secure Boot still needs SMM for the OVMF secure-boot firmware.
                          features:
                            smm: { enabled: true }
                          {{- end }}
                          devices:
                            {{- if $vTPM }}
                            tpm: {}   # ephemeral vTPM 2.0 (Secure Boot / Windows 11 guests)
                            {{- end }}
                            disks:
                              - name: root
                                disk:
                                  bus: virtio
                                bootOrder: 1
                              {{- if $isWin }}
                              # Per-VM OOBE answer file on a sysprep CD: the generalized
                              # golden reads it on first boot, sets the Administrator
                              # password + enables RDP, and auto-completes OOBE.
                              - name: sysprep
                                cdrom:
                                  bus: sata
                              {{- else }}
                              - name: cloudinit
                                disk:
                                  bus: virtio
                              {{- end }}
                              {{- /* Extra data disks (#115), virtio, in order — /dev/vdb, /dev/vdc, …
                                     No bootOrder so they never compete with the root disk for boot. */}}
                              {{- range $dd := $dataDisks }}
                              - name: {{ $dd.name }}
                                disk:
                                  bus: virtio
                              {{- end }}
                              {{- /* Workload-identity token disk (spec.instanceRole): KubeVirt projects
                                     the per-VM ServiceAccount token as an iso9660 disk. The serial lets
                                     cloud-init find it deterministically (/dev/disk/by-id/virtio-SATOKEN). */}}
                              {{- if and $instanceRole (not $isWin) }}
                              - name: identity
                                serial: SATOKEN
                                disk:
                                  bus: virtio
                              {{- end }}
                            interfaces:
                              - name: default
                                masquerade: {}
                              {{- if $bridge }}
                              # Second NIC bridged onto the physical LAN (macvlan). NOTE: does not
                              # work here — a macvlan sub-iface can't be a KubeVirt bridge port. Use macvtap.
                              - name: lan
                                bridge: {}
                              {{- else if $macvtap }}
                              # Second NIC on a macvtap device over the LAN NIC (direct LAN + own DHCP lease).
                              - name: lan
                                binding:
                                  name: macvtap
                              {{- end }}
                            networkInterfaceMultiqueue: true
                        networks:
                          - name: default
                            pod: {}
                          {{- if $bridge }}
                          - name: lan
                            multus:
                              networkName: default/openinfra-lan
                          {{- else if $macvtap }}
                          - name: lan
                            multus:
                              networkName: default/openinfra-lan-macvtap
                          {{- end }}
                        volumes:
                          - name: root
                            {{- if $adopt }}
                            persistentVolumeClaim:
                              claimName: {{ $adopt }}
                            {{- else }}
                            dataVolume:
                              name: {{ $name }}-root
                            {{- end }}
                          {{- /* Workload identity (spec.instanceRole): project the per-VM SA token. */}}
                          {{- if and $instanceRole (not $isWin) }}
                          - name: identity
                            serviceAccount:
                              serviceAccountName: vm-{{ $name }}
                          {{- end }}
                          {{- if $isWin }}
                          - name: sysprep
                            sysprep:
                              configMap:
                                name: {{ $name }}-oobe
                          {{- else }}
                          - name: cloudinit
                            cloudInitNoCloud:
                              {{- /* The full #cloud-config lives in the <vm>-cloudinit Secret (below):
                                     KubeVirt caps INLINE userData at 2048 bytes, which an instanceRole
                                     config exceeds. A Secret has no such limit. networkData stays inline.
                                     NB KubeVirt's userData secret field is `secretRef` (the legacy name),
                                     not `userDataSecretRef` (which it silently prunes). */}}
                              secretRef:
                                name: {{ $name }}-cloudinit
                              {{- if $lan }}
                              networkData: |
                                version: 2
                                ethernets:
                                  eth0: { dhcp4: true }
                                  eth1: { dhcp4: true }
                              {{- end }}
                          {{- end }}
                          {{- /* Extra data disks (#115): bind each virtio device to its DataVolume. */}}
                          {{- range $dd := $dataDisks }}
                          - name: {{ $dd.name }}
                            dataVolume:
                              name: {{ $name }}-{{ $dd.name }}
                          {{- end }}
            {{- if $isWin }}
            ---
            # --- Windows OOBE answer file (per-VM): the generalized golden reads this
            #     sysprep CD on first boot to set the Administrator password + enable
            #     RDP, then auto-completes OOBE. Each clone gets its own password. ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: oobe
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata: { name: {{ $name }}-oobe, namespace: {{ $ns }} }
                  data:
                    # NB: a DEPLOYED generalized image's oobeSystem pass reads
                    # `unattend.xml` from removable media — NOT `autounattend.xml`
                    # (that name is only honored by Setup during windowsPE). Validated.
                    unattend.xml: |
                      <?xml version="1.0" encoding="utf-8"?>
                      <unattend xmlns="urn:schemas-microsoft-com:unattend">
                        <settings pass="oobeSystem">
                          <component name="Microsoft-Windows-International-Core" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                            <InputLocale>en-US</InputLocale><SystemLocale>en-US</SystemLocale><UILanguage>en-US</UILanguage><UserLocale>en-US</UserLocale>
                          </component>
                          <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                            <UserAccounts><AdministratorPassword><Value>{{ $pass }}</Value><PlainText>true</PlainText></AdministratorPassword></UserAccounts>
                            <OOBE><HideEULAPage>true</HideEULAPage><HideLocalAccountScreen>true</HideLocalAccountScreen><HideOnlineAccountScreens>true</HideOnlineAccountScreens><HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE><NetworkLocation>Work</NetworkLocation><ProtectYourPC>3</ProtectYourPC></OOBE>
                            <TimeZone>UTC</TimeZone>
                            <FirstLogonCommands>
                              <SynchronousCommand wcm:action="add" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State"><Order>1</Order><CommandLine>cmd /c reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f</CommandLine></SynchronousCommand>
                              <SynchronousCommand wcm:action="add" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State"><Order>2</Order><CommandLine>netsh advfirewall firewall set rule group="remote desktop" new enable=Yes</CommandLine></SynchronousCommand>
                            </FirstLogonCommands>
                          </component>
                        </settings>
                      </unattend>
            {{- end }}
            ---
            # --- Service: in-cluster reach to SSH (Linux) / RDP (Windows). ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata: { name: {{ $name }}, namespace: {{ $ns }} }
                  spec:
                    selector: { kubevirt.io/domain: {{ $name }} }
                    ports:
                      - { name: {{ $proto }}, port: {{ $port }}, targetPort: {{ $port }} }
                      {{- range $p := $ports }}
                      - { name: "{{ ($p.protocol | default "TCP") | lower }}{{ $p.port }}", port: {{ $p.port }}, targetPort: {{ $p.port }}, protocol: {{ $p.protocol | default "TCP" }} }
                      {{- end }}
            ---
            # --- Connection Secret: how to log in (cf. the DB/model secret). ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vm-secret
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata: { name: {{ $name }}-vm, namespace: {{ $ns }} }
                  stringData:
                    OS: "{{ $spec.os }}"
                    PROTOCOL: "{{ $proto }}"
                    USERNAME: "{{ $user }}"
                    PASSWORD: "{{ $pass }}"
                    HOST: "{{ $name }}.{{ $ns }}.svc.cluster.local"
                    PORT: "{{ $port }}"
                    {{- if $isWin }}
                    ACCESS: "mstsc /v:HOST:{{ $port }}  (user {{ $user }})"
                    {{- else }}
                    ACCESS: "ssh {{ $user }}@HOST"
                    {{- end }}
            {{- if not $isWin }}
            ---
            # --- cloud-init Secret: the full #cloud-config. KubeVirt caps INLINE cloudInitNoCloud
            #     userData at 2048 bytes (an instanceRole config exceeds it); a Secret is unbounded.
            #     The VMI references it via cloudInitNoCloud.userDataSecretRef. The user's first-boot
            #     script is embedded with toJson (a quoted scalar) rather than a nested block scalar,
            #     so there is no fragile indentation coupling.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vm-cloudinit
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata: { name: {{ $name }}-cloudinit, namespace: {{ $ns }} }
                  stringData:
                    userdata: |
                      #cloud-config
                      hostname: {{ $name }}
                      users:
                        - name: {{ $user }}
                          sudo: ALL=(ALL) NOPASSWD:ALL
                          shell: /bin/bash
                          lock_passwd: false
                          {{- if $spec.sshKey }}
                          ssh_authorized_keys:
                            - {{ $spec.sshKey }}
                          {{- end }}
                      ssh_pwauth: true
                      chpasswd:
                        expire: false
                        list: |
                          {{ $user }}:{{ $pass }}
                      packages:
                        - qemu-guest-agent
                      {{- if or $spec.userData $instanceRole $dataDisks }}
                      write_files:
                        {{- if $instanceRole }}
                        - path: /etc/environment
                          append: true
                          content: "AWS_CONTAINER_CREDENTIALS_FULL_URI=http://aws-shim.open-infra-aws-shim.svc.cluster.local:4566/v1/vm-credentials\nAWS_CONTAINER_CREDENTIALS_TOKEN_FILE=/run/openinfra-identity/token\n"
                        {{- end }}
                        {{- if $spec.userData }}
                        - path: /opt/openinfra-userdata
                          permissions: '0755'
                          content: {{ $spec.userData | toJson }}
                        {{- end }}
                        {{- if $dataDisks }}
                        {{- /* AWS Nitro device-name aliases (#115/#344): an unmodified lift-and-shift
                               UserData script formats/mounts its data disk by the Nitro name AWS gives it
                               (/dev/nvme1n1, …), but KubeVirt presents the disks as virtio (/dev/vdb, …).
                               udev symlinks bridge the two so the script runs unchanged. Root is
                               nvme0n1 -> vda; data disk i (0-based) is nvme(i+1)n1 -> vd{b,c,…}. Partitions
                               alias through %n (vdb1 -> nvme1n1p1). */}}
                        {{- $vdl := list "b" "c" "d" "e" "f" "g" "h" "i" "j" "k" "l" "m" "n" "o" "p" }}
                        - path: /etc/udev/rules.d/99-openinfra-aws-device-names.rules
                          content: |
                            KERNEL=="vda", SYMLINK+="nvme0n1"
                            KERNEL=="vda[0-9]*", SYMLINK+="nvme0n1p%n"
                            {{- range $i, $dd := $dataDisks }}
                            KERNEL=="vd{{ index $vdl $i }}", SYMLINK+="nvme{{ add $i 1 }}n1"
                            KERNEL=="vd{{ index $vdl $i }}[0-9]*", SYMLINK+="nvme{{ add $i 1 }}n1p%n"
                            {{- end }}
                        {{- end }}
                      {{- end }}
                      {{- if $instanceRole }}
                      {{- /* Mount the workload-identity token iso and COPY the token to a readable
                             path on every boot. KubeVirt's iso carries Rock Ridge perms (token is
                             0640 root-ish), so a mount mode= does not make it app-readable — copy it
                             to /run (tmpfs; re-done each boot, survives reboots). */}}
                      bootcmd:
                        - [ bash, -c, "mkdir -p /mnt/openinfra-identity /run/openinfra-identity; mountpoint -q /mnt/openinfra-identity || mount -o ro /dev/disk/by-id/virtio-SATOKEN /mnt/openinfra-identity 2>/dev/null || mount -o ro -L cfgdata /mnt/openinfra-identity 2>/dev/null || true; cp -f /mnt/openinfra-identity/token /run/openinfra-identity/token 2>/dev/null && chmod 0644 /run/openinfra-identity/token || true" ]
                      {{- end }}
                      runcmd:
                        {{- if $dataDisks }}
                        # Materialize the AWS Nitro device-name symlinks BEFORE the user's UserData runs,
                        # so a script that formats/mounts /dev/nvme1n1 finds it.
                        - [ udevadm, control, --reload-rules ]
                        - [ udevadm, trigger ]
                        - [ udevadm, settle ]
                        {{- end }}
                        - [systemctl, enable, --now, qemu-guest-agent]
                        {{- if $spec.userData }}
                        - [/bin/sh, /opt/openinfra-userdata]
                        {{- end }}
            {{- end }}
            {{- if $instanceRole }}
            ---
            # --- Per-VM workload identity (spec.instanceRole): a dedicated ServiceAccount whose token
            #     KubeVirt projects into the guest (serviceAccount volume below). The guest's AWS SDK
            #     presents that token to the aws-shim's /v1/vm-credentials endpoint and receives rotating
            #     credentials for the Role named here — the ECS/EKS container-credentials pattern, so no
            #     static keys ever touch the disk. The shim verifies the token (TokenReview) and reads
            #     this instance-role annotation to decide which Role to mint (that Role must trust "vm").
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vm-identity-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: vm-{{ $name }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/name: {{ $name }}
                      openinfra.dev/vm: "true"
                    annotations:
                      openinfra.dev/instance-role: {{ $instanceRole }}
                      openinfra.dev/vm: {{ $name }}
            {{- end }}
            {{- if or $spec.expose $ports }}
            ---
            # --- LAN LoadBalancer (MetalLB): reach the VM from workstations. One IP
            #     carries the access port (SSH/RDP) plus any spec.ports (e.g. 80/443). ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vm-lan
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $name }}-lan
                    namespace: {{ $ns }}
                    labels: { openinfra.dev/vm-lan: {{ $name }} }
                  spec:
                    type: LoadBalancer
                    # Preserve the client's real source IP so SecurityGroup CIDR rules
                    # can actually match LAN clients on these published ports (without
                    # this, MetalLB SNATs the source to a node IP and CIDR rules can't
                    # distinguish callers). MetalLB L2 announces from the VM's node.
                    externalTrafficPolicy: Local
                    selector: { kubevirt.io/domain: {{ $name }} }
                    ports:
                      - { name: {{ $proto }}, port: {{ $port }}, targetPort: {{ $port }} }
                      {{- range $p := $ports }}
                      - { name: "{{ ($p.protocol | default "TCP") | lower }}{{ $p.port }}", port: {{ $p.port }}, targetPort: {{ $p.port }}, protocol: {{ $p.protocol | default "TCP" }} }
                      {{- end }}
            {{- end }}
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
