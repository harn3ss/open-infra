                        {{- /* The OCI runtime wrapper Docker runs every container through (the agent sets it as Docker's
                               default runtime): it adds the guest's AWS endpoint and CA to the container's spec, then
                               runs the real runc. No template actions — test/vm-creds runs it verbatim. */}}
                        - path: /usr/local/lib/openinfra/oci-aws-env
