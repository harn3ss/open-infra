                                def _call(self, method, url, body=None, timeout=40.0):
                                    if not (url or "").lower().startswith("https://"):
                                        raise CredentialsError("refusing to send the instance identity token to %r: the aws-shim is "
                                                               "called over TLS only" % (url,))
                                    ctx = shim_tls_context(self.ca_file)
                                    try:
                                        with open(self.token_file) as fh:
                                            token = "".join(fh.read().split())
                                    except (IOError, OSError) as e:
                                        raise CredentialsError("cannot read the instance identity token %s: %s" % (self.token_file, e))
                                    data = None if body is None else json.dumps(body).encode("utf-8")
                                    req = urllib.request.Request(url, data=data, method=method, headers={
                                        "Authorization": token, "Accept": "application/json", "Content-Type": "application/json"})
                                    opener = urllib.request.build_opener(urllib.request.ProxyHandler({}),
                                                                         urllib.request.HTTPSHandler(context=ctx))
                                    try:
                                        resp = opener.open(req, timeout=timeout)
                                        try:
                                            raw = resp.read()
                                        finally:
                                            resp.close()
