                                def platform_info(self):
                                    info = {"agentVersion": AGENT_VERSION, "platformType": "Linux", "computerName": socket.gethostname()}
                                    try:
                                        with open("/etc/os-release") as fh:
                                            for line in fh:
                                                k, _, v = line.strip().partition("=")
                                                if k == "NAME":
                                                    info["platformName"] = v.strip('"')
                                                elif k == "VERSION_ID":
                                                    info["platformVersion"] = v.strip('"')
