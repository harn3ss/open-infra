                            # SSM Run Command: the commands `aws ssm send-command` sends this instance (AWS-RunShellScript),
                            # fetched from the aws-shim with the VM's ServiceAccount token, run as root, and reported back.
                            # The shim knows the instance from the token alone, so the agent fetches and reports only its own.
                            # ---------------------------------------------------------------------------------------------

                            AGENT_VERSION = "openinfra-1"
                            OUTPUT_CAP = 24000  # characters of each stream kept, as GetCommandInvocation reports them


                            def read_capped(path, cap=OUTPUT_CAP):
                                try:
                                    with open(path, "rb") as fh:
                                        return fh.read(cap * 4).decode("utf-8", "replace")[:cap]
                                except (IOError, OSError):
                                    return ""


                            class CommandRunner:
                                """Long-polls the aws-shim's /v1/vm-commands for this instance's commands and runs each in a thread.

                                A refusal (the instance role does not allow the SSM agent's actions: attach
                                AmazonSSMManagedInstanceCore; or the instance is not managed) backs off for minutes."""

                                def __init__(self, url, token_file, ca_file, work_dir="/var/lib/openinfra/commands"):
                                    self.url = url.rstrip("/")
                                    self.token_file = token_file
                                    self.ca_file = ca_file
                                    self.work_dir = work_dir
                                    self.running = set()
