                                    else:
                                        LOG.info("no instance role: iam/ metadata is not served")
                                    ca = None
                                    if self.cfg.get("trustPlatformCA"):
                                        ca = trust_platform_ca(self.cfg.get("caFile"))
                                    if self.cfg.get("caBundleLink"):  # after the CA step, so the bundle it names carries the root
                                        store = trust_store()
                                        publish_ca_bundle(self.cfg["caBundleLink"], store[0] if store else None,
                                                          platform_ca=ca in ("installed", "unchanged"))
                                    configure_containers(self.cfg)  # before ready: UserData may install Docker and start containers
                                    configure_awscli_v1_plugin(self.cfg)  # the distro aws CLI v1 reads AWS_ENDPOINT_URL through it

                                def shutdown(self):
                                    self.stop.set()
                                    if self.creds is not None:
                                        self.creds._wake.set()
                                    for srv in self.servers:
                                        srv.shutdown()
                                        srv.server_close()
                                    if self.netns:
                                        if self.guard_mode in ("nft-kind", "nft-names", "iptables"):
                                            remove_imds_guard(imds_addr=self.cfg["imds"]["address"])
                                        teardown_netns(self.netns)


                            def main(argv):
                                logging.basicConfig(stream=sys.stderr, level=logging.INFO, format="%(levelname)s %(message)s")
                                path = argv[1] if len(argv) > 1 else os.environ.get("OPENINFRA_METADATA_CONFIG", "/etc/openinfra/metadata-agent.json")
                                try:
                                    cfg = load_config(path)
                                except (IOError, OSError, ValueError) as e:
                                    LOG.error("cannot load config %s: %s", path, e)
                                    return 1
                                agent = Agent(cfg)
                                stopped = threading.Event()

                                def on_signal(signum, frame):
                                    stopped.set()

                                signal.signal(signal.SIGTERM, on_signal)
                                signal.signal(signal.SIGINT, on_signal)
                                try:
                                    agent.start()
                                except Exception as e:
                                    LOG.error("metadata agent failed to start: %s", e)
                                    return 1
                                sd_notify("READY=1")
                                if not agent.servers:
                                    return 0  # boot-time setup only (the metadata service is disabled): nothing to serve
                                while not stopped.wait(1):
                                    pass
                                sd_notify("STOPPING=1")
                                agent.shutdown()
                                return 0


                            if __name__ == "__main__":
                                sys.exit(main(sys.argv))
