                                        shutil.rmtree(d, ignore_errors=True)

                                def report(self, command_id, result):
                                    self._call("POST", self.url + "/" + urllib.parse.quote(command_id, safe=""), body=result)

                                def handle(self, cmd, retry_wait=5.0):
                                    cid = cmd["CommandId"]
                                    try:
                                        try:
                                            result = self.execute(cmd)
                                        except Exception as e:  # report it rather than leave the command InProgress
                                            result = {"Status": "Failed", "ResponseCode": -1, "StandardOutputContent": "",
                                                      "StandardErrorContent": "the metadata agent could not run the command: %s" % e}
                                        LOG.info("SSM command %s: %s (exit %s)", cid, result["Status"], result["ResponseCode"])
                                        for attempt in range(5):
                                            try:
                                                self.report(cid, result)
                                                return
                                            except CredentialsError as e:
                                                LOG.warning("reporting SSM command %s failed: %s", cid, e)
                                                if e.status in (400, 404, 409):
                                                    return  # the shim no longer expects it (cancelled, timed out)
                                                time.sleep(retry_wait * (attempt + 1))
