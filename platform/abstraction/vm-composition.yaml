                                            LOG.warning("SSM Run Command: %s; polling again in %d s", e, wait)
                                            backoff = min(backoff * 2, 60.0)
                                            stop.wait(wait)
                                            continue
                                        except (ValueError, TypeError, AttributeError) as e:
                                            LOG.error("SSM Run Command: the aws-shim sent an unusable answer: %s", e)
                                            stop.wait(backoff)
                                            continue
                                        for cmd in cmds:
                                            with self._lock:
