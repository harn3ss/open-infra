# open-infra's "EC2": a third public API, kind: VirtualMachine. Give it an OS from
# the curated catalog and get a real VM (KubeVirt) with a persistent disk (CDI),
# cloud-init/cloudbase-init login, a web VNC console, and SSH (Linux) or RDP
# (Windows) access — provisioned the same way kind: Application provisions apps.
# KEEP THIS SCHEMA STABLE — it is part of the product's contract.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xvirtualmachines.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "vm"
    openinfra.dev/chaos-offers: "snapshot"
    openinfra.dev/chaos-accepts: "block-attach"
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names:
    kind: XVirtualMachine
    plural: xvirtualmachines
  claimNames:
    kind: VirtualMachine   # what users write in infra.yaml
    plural: virtualmachines
  defaultCompositionRef:
    name: vm
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [os]
              x-kubernetes-validations:
                - rule: "!has(self.rootDisk) || !self.rootDisk.encrypted || (has(self.rootDisk.encryptionKey) && self.rootDisk.encryptionKey != '')"
                  message: "spec.rootDisk.encrypted requires spec.rootDisk.encryptionKey (the kind: EncryptionKey that keys the disk)"
                - rule: "!has(self.rootDisk) || !self.rootDisk.encrypted || (!self.highAvailability && !has(self.existingRootClaim))"
                  message: "an encrypted root disk cannot be combined with highAvailability (there is no encrypted, live-migratable storage class) or existingRootClaim (an adopted disk is booted as it is)"
                # How the root disk is stored is fixed at creation: switching it would replace the disk.
                - rule: "has(self.rootDisk) == has(oldSelf.rootDisk) && (!has(self.rootDisk) || self.rootDisk == oldSelf.rootDisk)"
                  message: "spec.rootDisk is immutable: changing the root disk's encryption would replace the disk"
              properties:
                # Curated OS catalog (allowlist). Each entry maps to a disk image +
                # osType in the Composition's $catalog. Linux entries are ready-made
                # cloud images (containerdisks); windows-server-* clone a golden image
                # built via kind: VmImage (console: Virtual Machines -> VM Images).
                # Adding an OS means adding it here AND to the Composition's $catalog.
                os:
                  type: string
                  description: "Operating system, from the curated catalog. Linux entries (ubuntu-*, fedora-40, debian-12, centos-stream-9) boot ready-made cloud images; windows-server-* clone a golden image you build first via kind: VmImage (console: Virtual Machines → VM Images)."
                  enum:
                    - ubuntu-24.04         # linux · cloud image
                    - ubuntu-22.04         # linux · cloud image
                    - fedora-40            # linux · cloud image
                    - debian-12            # linux · cloud image
                    - centos-stream-9      # linux · cloud image
                    - windows-server-2016  # windows · clones <os>-golden (build via kind: VmImage)
                    - windows-server-2019  # windows
                    - windows-server-2022  # windows
                    - windows-server-2025  # windows
                cpu:      { type: integer, default: 2, minimum: 1, description: "Number of vCPU cores (KubeVirt domain.cpu.cores). Default 2." }
                memory:   { type: string, default: "2Gi", description: "Guest RAM, e.g. 2Gi or 4Gi. Default 2Gi." }
                diskSize: { type: string, default: "20Gi", description: "Root disk size, retained across reboots and stop/start. Default 20Gi. Linux grows its rootfs to fit via cloud-init; Windows ignores this and uses a fixed 100Gi root (a generalized image's C: can't be reliably auto-grown)." }
                rootDisk:
                  type: object
                  description: >-
                    How the root disk is stored. Omitted: an unencrypted disk on the storage policy
                    highAvailability picks. encrypted: true stores it with LUKS at rest on the Longhorn
                    longhorn-encrypted class, keyed by encryptionKey exactly like an encrypted data disk (the
                    EC2 root `BlockDeviceMapping.Ebs.Encrypted` equivalent): the OS image is imported to a
                    temporary disk and copied onto the encrypted one before first boot, so the VM starts a
                    minute or two later. Requires the opt-in encryption component. An encrypted root is RWO,
                    so it cannot be combined with highAvailability or existingRootClaim. Immutable.
                  properties:
                    encrypted: { type: boolean, default: false, description: "Encrypt the root disk at rest (LUKS on longhorn-encrypted)." }
                    encryptionKey: { type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 63, description: "Name of the kind: EncryptionKey (in the VM's namespace) whose data key protects the root disk. Required when encrypted is true." }
                volumes:
                  type: array
                  description: >-
                    Existing kind: Volumes in the VM's namespace, attached as additional virtio disks after the
                    dataDisks (the EC2 VolumeAttachment equivalent). A Volume must be Block mode (its default).
                    A volume is attached when the VM starts: attaching one to, or removing one from, a running
                    VM takes effect at its next restart (the VM reports RestartRequired).
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        maxLength: 58
                        description: "The kind: Volume's name."
                      deviceName: { type: string, pattern: "^/dev/(sd|xvd)[a-z]{1,2}$", description: "The AWS device name the volume is attached as (/dev/sdh, /dev/xvdh). The guest gets that name, and its xvd/sd twin, as a udev alias of the virtio disk, as Nitro instances do." }
                dataDisks:
                  type: array
                  description: >-
                    Additional persistent data disks attached at boot, beyond the root disk (the EC2
                    extra-BlockDeviceMapping equivalent — e.g. a dedicated disk for a database's data
                    directory). Each is a BLANK block volume (CDI), attached as a virtio device in the
                    order listed. NOTE the kernel names are virtio (/dev/vd*); each disk carries a serial and
                    a udev rule aliases the AWS Nitro names onto them by that serial (the root is
                    /dev/nvme0n1, the first data disk /dev/nvme1n1, then attached volumes, with partition
                    names /dev/nvme1n1p1, …), plus each disk's deviceName, so a lift-and-shift userData
                    script that mounts by a hard-coded /dev/nvme* or /dev/sdf path works unmodified. Each disk follows the root's storage
                    policy (highAvailability → longhorn-migratable RWX block, else local-path) UNLESS it
                    is encrypted, and is retained across reboots and stop/start. The guest is responsible
                    for partitioning/formatting/mounting it.
                  items:
                    type: object
                    required: [size]
                    properties:
                      name: { type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63, description: "Stable name for this disk (the DataVolume/PVC suffix and the in-guest device order key). Defaults to data1, data2, … in list order. Renaming replaces the disk." }
                      size: { type: string, description: "Disk size, e.g. 50Gi." }
                      deviceName: { type: string, pattern: "^/dev/(sd|xvd)[a-z]{1,2}$", description: "The AWS device name of this disk (/dev/sdf, /dev/xvdf). The guest gets that name, and its xvd/sd twin, as a udev alias of the virtio disk, as Nitro instances do; the Nitro name (/dev/nvme1n1, …) is aliased either way." }
                      encrypted:
                        type: boolean
                        description: >-
                          Encrypt this data disk at rest with LUKS (Longhorn longhorn-encrypted class),
                          keyed by encryptionKey — the EC2 `BlockDeviceMapping.Ebs.Encrypted` equivalent.
                          The per-disk passphrase is a Vault Transit data key wrapped by the named
                          kind: EncryptionKey, so destroying that key crypto-erases the disk. Requires the
                          opt-in encryption component and encryptionKey. An encrypted disk is RWO (there is
                          no encrypted+migratable class), so on a highAvailability VM it pins live migration
                          — keep encrypted data on a non-HA VM, or accept that the VM won't live-migrate.
                      encryptionKey:
                        type: string
                        description: "Name of the kind: EncryptionKey (a Vault Transit KEK) whose data key protects this disk. Required when encrypted is true; ignored otherwise."
                sshKey:   { type: string, pattern: "^[^\r\n\u0085\u2028\u2029]*$", description: "SSH public key (one line) injected via cloud-init on first boot (Linux only). If omitted, the only login is a generated password stored in the connection secret (<name>-vm)." }
                userData:
                  type: string
                  description: "First-boot user data (the EC2 UserData equivalent), Linux only. A shell script (starting with #!) is written to disk and run once at first boot, AFTER the base cloud-init (user/ssh/qemu-guest-agent) — so the VM stays reachable. Ignored on Windows. A full #cloud-config document is not accepted here (it can't be safely merged with the base config)."
                expose:   { type: boolean, default: false, description: "Give the VM a LAN IP (MetalLB LoadBalancer) carrying its access port — SSH 22 (Linux) or RDP 3389 (Windows). Default false: reach the VM via port-forward or the web VNC console instead. Setting any entry in ports also implies this." }
                elasticIp:
                  type: object
                  description: "Give an exposed VM the LAN address an Elastic IP allocation holds (a CloudFormation AWS::EC2::EIP allocated by another stack, held by its holder Service in this namespace), instead of an address of its own: the address follows whichever VM names the allocation, and stays with the allocation when the VM goes. Until the allocation reports its address, the VM gets no LAN address."
                  required: [allocationId]
                  properties:
                    allocationId:
                      type: string
                      pattern: '^eipalloc-[0-9a-f]{17}$'
                      description: "The allocation's AllocationId (its AWS::EC2::EIP's GetAtt AllocationId)."
                ports:
                  type: array
                  items:
                    type: object
                    required: [port]
                    properties:
                      port:     { type: integer, description: "Port number (1–65535)." }
                      protocol: { type: string, enum: [TCP, UDP], default: TCP, description: "Transport protocol for this port. Default TCP." }
                  description: "Extra TCP/UDP ports to publish on the VM's LAN IP, beyond the access port (SSH/RDP) — e.g. [{port: 80}, {port: 53, protocol: UDP}]. They ride the same MetalLB IP as SSH/RDP (one LAN IP, the ports you pick). Adding any port also gives the VM a LAN IP (implies expose)."
                network:
                  type: string
                  enum: [masquerade, bridge, macvtap]
                  default: masquerade
                  description: "Network attachment. masquerade (default, supported) puts the VM behind the pod network (NAT) — reach it in-cluster via its Service, or from the LAN via expose/MetalLB. macvtap is the supported direct-LAN mode: a second NIC attaches straight to the physical LAN via a macvtap device (the VM pulls its own DHCP lease and is a first-class LAN host, e.g. reachable on SMB/445). bridge is the legacy LAN mode (Multus+macvlan with KubeVirt bridge binding) and does NOT work on this stack — a macvlan sub-interface cannot be a KubeVirt bridge port; use macvtap instead. macvtap/bridge require networking.vmLan enabled at install and nodes labelled openinfra.dev/vm-lan=true; see docs/virtual-machines.md."
                instanceRole:
                  type: string
                  description: >-
                    Name of a kind: Role (in this namespace) this VM assumes for aws-shim access — the
                    EC2 instance-profile / IAM-role analog. The VM obtains short-lived, rotating
                    credentials for this role from the instance metadata service at boot (no static keys
                    on disk), exactly as an EC2 instance does via its instance profile. The named Role
                    MUST trust the VM service principal (spec.trust including "vm"); a Role that does not
                    is never assumable this way (fail closed). Omit for a VM with no AWS identity.
                metadataOptions:
                  type: object
                  description: >-
                    The instance metadata service inside the guest — the AWS::EC2::Instance
                    MetadataOptions equivalent. A Linux guest serves EC2 instance metadata (IMDSv1 and
                    IMDSv2) at http://169.254.169.254: instance id, region and availability zone, local
                    IPv4, user-data, the instance identity document and, with instanceRole, the role's
                    rotating credentials — where the AWS SDKs, the aws CLI and cloud tooling look for
                    it, including from containers inside the guest. Omitted = the defaults below.
                    Windows guests have no metadata service (these settings are ignored).
                  properties:
                    httpEndpoint:
                      type: string
                      enum: [enabled, disabled]
                      default: enabled
                      description: "enabled (default) serves instance metadata. disabled turns the metadata service off entirely — nothing on 169.254.169.254 and no container-credentials endpoint — so, as on EC2, the guest gets no instanceRole credentials."
                    httpTokens:
                      type: string
                      enum: [optional, required]
                      default: optional
                      description: "optional (default): IMDSv1 (plain GET) and IMDSv2 (session token) both work, and a VM with an instanceRole also gets the loopback container-credentials endpoint (AWS_CONTAINER_CREDENTIALS_FULL_URI). required: IMDSv2 only — a request without a valid session token gets 401, and the container-credentials endpoint (a plain GET) is not served. required is the SSRF-hardened setting."
                    httpPutResponseHopLimit:
                      type: integer
                      minimum: 1
                      maximum: 64
                      default: 1
                      description: "IP hop limit (TTL) of the IMDSv2 session-token response, as on EC2. Default 1, EC2's default, with or without a metadataOptions block. With 1, only processes in the guest itself (and host-network containers) get a session token; a container behind a bridge in the guest (docker's default network, a pod network) is one routing hop further and needs 2; each further hop needs one more. IMDSv1 requests are not hop-limited."
                securityGroups:
                  type: array
                  # SecurityGroup names: each becomes the label key openinfra.dev/sg-<name>.
                  items: { type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 60 }
                  description: "Names of SecurityGroups (firewall rule sets) to attach to this VM."
                subnet:
                  type: string
                  description: >-
                    Name of a kind: Subnet to place this VM in (kube-ovn). The VM's launcher pod draws
                    its IP from that subnet and inherits its OVN-enforced topological isolation — the
                    AWS "launch in this subnet" model. Omit to use the namespace's default network.
                running:  { type: boolean, default: true, description: "Power state. Default true = running; false stops the VM (mapped to KubeVirt runStrategy Halted) while retaining its disk. The console's Start/Stop button flips this." }
                highAvailability: { type: boolean, default: false, description: "Node-independent storage and live migration. Default false = root disk on local-path NVMe (faster, but pinned to one node). true provisions the root disk on Longhorn (replicated, migratable RWX block) and sets evictionStrategy: LiveMigrate, so the VM survives a node loss (reschedule + reboot) and live-migrates off a drained node with zero downtime. See cpuModel for cross-CPU portability." }
                existingRootClaim: { type: string, description: "Boot from an existing root PVC instead of cloning a fresh disk from the OS image — used to migrate or restore a VM onto a pre-populated disk (e.g. one cloned onto Longhorn). When set, no root DataVolume is provisioned." }
                cpuModel: { type: string, description: "Guest CPU model to require (KubeVirt domain.cpu.model). Empty (default) uses host-model — best performance, but pins the VM to its node's exact CPU. For live migration or node-loss recovery across heterogeneous CPUs, set the newest model common to all nodes (e.g. Broadwell-noTSX). HA VMs fall back to Nehalem when this is unset." }
                firmware:
                  type: object
                  description: >-
                    Boot firmware. OMITTED (default): legacy BIOS on a freshly-cloned disk — the catalog's
                    Linux cloud images and the Windows golden images are MBR/BIOS. A MIGRATED disk
                    (existingRootClaim) carries its boot mode baked into its partition layout, so it MUST
                    set firmware.mode and the composition REFUSES to guess (a UEFI-installed disk, GPT + EFI
                    system partition, will not boot under BIOS). Maps to KubeVirt domain.firmware.bootloader.
                  properties:
                    mode:
                      type: string
                      enum: [bios, uefi]
                      description: "bios = legacy SeaBIOS/MBR (default for fresh clones). uefi = OVMF/EFI, required by GPT disks and modern (UEFI) AMIs. REQUIRED when existingRootClaim is set — a migrated disk's boot mode cannot be guessed."
                    secureBoot:
                      type: boolean
                      default: false
                      description: "UEFI Secure Boot (OVMF secure-boot firmware). Requires mode: uefi; enables SMM. The guest must be Secure-Boot compatible."
                    tpm:
                      type: boolean
                      default: false
                      description: "Attach an ephemeral vTPM 2.0 device (KubeVirt domain.devices.tpm). Needed by some Secure Boot / Windows 11 guests. Ephemeral — not persisted across recreate (persistent vTPM state needs the VMPersistentState feature gate, not enabled)."
            status:
              type: object
              properties:
                os:      { type: string }
                ip:      { type: string }
                ready:   { type: boolean }
                rootPopulated:
                  type: boolean
                  description: "An encrypted root disk (spec.rootDisk.encrypted) holds the OS image: set once the copy onto it has completed, and kept, so the image is never copied over the disk again."
                lanIp:
                  type: string
                  description: >-
                    The VM's LAN IP — the MetalLB LoadBalancer address carrying its access port
                    (SSH 22 / RDP 3389) and any spec.ports, read back from the <name>-lan Service
                    once assigned. Empty while unassigned and when the VM is not exposed (neither
                    spec.expose nor spec.ports). Stable for the life of the VM; a deleted and
                    recreated VM may draw a different address.
