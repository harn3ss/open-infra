# open-infra's "EC2": a third public API, kind: VirtualMachine. Give it an OS from
# the curated catalog and get a real VM (KubeVirt) with a persistent disk (CDI),
# cloud-init/cloudbase-init login, a web VNC console, and SSH (Linux) or RDP
# (Windows) access — provisioned the same way kind: Application provisions apps.
# KEEP THIS SCHEMA STABLE — it is part of the product's contract.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xvirtualmachines.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "vm"
    openinfra.dev/chaos-offers: "snapshot"
    openinfra.dev/chaos-accepts: "block-attach"
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names:
    kind: XVirtualMachine
    plural: xvirtualmachines
  claimNames:
    kind: VirtualMachine   # what users write in infra.yaml
    plural: virtualmachines
  defaultCompositionRef:
    name: vm
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [os]
              properties:
                # Curated OS catalog (allowlist). Each entry maps to a disk image +
                # osType in the Composition's $catalog. Linux entries are ready-made
                # cloud images (containerdisks); windows-server-* clone a golden image
                # built via kind: VmImage (console: Virtual Machines -> VM Images).
                # Adding an OS means adding it here AND to the Composition's $catalog.
                os:
                  type: string
                  description: "Operating system, from the curated catalog. Linux entries (ubuntu-*, fedora-40, debian-12, centos-stream-9) boot ready-made cloud images; windows-server-* clone a golden image you build first via kind: VmImage (console: Virtual Machines → VM Images)."
                  enum:
                    - ubuntu-24.04         # linux · cloud image
                    - ubuntu-22.04         # linux · cloud image
                    - fedora-40            # linux · cloud image
                    - debian-12            # linux · cloud image
                    - centos-stream-9      # linux · cloud image
                    - windows-server-2019  # windows · clones <os>-golden (build via kind: VmImage)
                    - windows-server-2022  # windows
                    - windows-server-2025  # windows
                cpu:      { type: integer, default: 2, minimum: 1, description: "Number of vCPU cores (KubeVirt domain.cpu.cores). Default 2." }
                memory:   { type: string, default: "2Gi", description: "Guest RAM, e.g. 2Gi or 4Gi. Default 2Gi." }
                diskSize: { type: string, default: "20Gi", description: "Root disk size, retained across reboots and stop/start. Default 20Gi. Linux grows its rootfs to fit via cloud-init; Windows ignores this and uses a fixed 100Gi root (a generalized image's C: can't be reliably auto-grown)." }
                sshKey:   { type: string, description: "SSH public key injected via cloud-init on first boot (Linux only). If omitted, the only login is a generated password stored in the connection secret (<name>-vm)." }
                userData:
                  type: string
                  description: "First-boot user data (the EC2 UserData equivalent), Linux only. A shell script (starting with #!) is written to disk and run once at first boot, AFTER the base cloud-init (user/ssh/qemu-guest-agent) — so the VM stays reachable. Ignored on Windows. A full #cloud-config document is not accepted here (it can't be safely merged with the base config)."
                expose:   { type: boolean, default: false, description: "Give the VM a LAN IP (MetalLB LoadBalancer) carrying its access port — SSH 22 (Linux) or RDP 3389 (Windows). Default false: reach the VM via port-forward or the web VNC console instead. Setting any entry in ports also implies this." }
                ports:
                  type: array
                  items:
                    type: object
                    required: [port]
                    properties:
                      port:     { type: integer, description: "Port number (1–65535)." }
                      protocol: { type: string, enum: [TCP, UDP], default: TCP, description: "Transport protocol for this port. Default TCP." }
                  description: "Extra TCP/UDP ports to publish on the VM's LAN IP, beyond the access port (SSH/RDP) — e.g. [{port: 80}, {port: 53, protocol: UDP}]. They ride the same MetalLB IP as SSH/RDP (one LAN IP, the ports you pick). Adding any port also gives the VM a LAN IP (implies expose)."
                network:
                  type: string
                  enum: [masquerade, bridge, macvtap]
                  default: masquerade
                  description: "Network attachment. masquerade (default, supported) puts the VM behind the pod network (NAT) — reach it in-cluster via its Service, or from the LAN via expose/MetalLB. macvtap is the supported direct-LAN mode: a second NIC attaches straight to the physical LAN via a macvtap device (the VM pulls its own DHCP lease and is a first-class LAN host, e.g. reachable on SMB/445). bridge is the legacy LAN mode (Multus+macvlan with KubeVirt bridge binding) and does NOT work on this stack — a macvlan sub-interface cannot be a KubeVirt bridge port; use macvtap instead. macvtap/bridge require networking.vmLan enabled at install and nodes labelled openinfra.dev/vm-lan=true; see docs/virtual-machines.md."
                securityGroups:
                  type: array
                  items: { type: string }
                  description: "Names of SecurityGroups (firewall rule sets) to attach to this VM."
                running:  { type: boolean, default: true, description: "Power state. Default true = running; false stops the VM (mapped to KubeVirt runStrategy Halted) while retaining its disk. The console's Start/Stop button flips this." }
                highAvailability: { type: boolean, default: false, description: "Node-independent storage and live migration. Default false = root disk on local-path NVMe (faster, but pinned to one node). true provisions the root disk on Longhorn (replicated, migratable RWX block) and sets evictionStrategy: LiveMigrate, so the VM survives a node loss (reschedule + reboot) and live-migrates off a drained node with zero downtime. See cpuModel for cross-CPU portability." }
                existingRootClaim: { type: string, description: "Boot from an existing root PVC instead of cloning a fresh disk from the OS image — used to migrate or restore a VM onto a pre-populated disk (e.g. one cloned onto Longhorn). When set, no root DataVolume is provisioned." }
                cpuModel: { type: string, description: "Guest CPU model to require (KubeVirt domain.cpu.model). Empty (default) uses host-model — best performance, but pins the VM to its node's exact CPU. For live migration or node-loss recovery across heterogeneous CPUs, set the newest model common to all nodes (e.g. Broadwell-noTSX). HA VMs fall back to Nehalem when this is unset." }
            status:
              type: object
              properties:
                os:      { type: string }
                ip:      { type: string }
                ready:   { type: boolean }
