# The public API of open-infra. This CompositeResourceDefinition turns the
# user-facing `kind: Application` (apiVersion openinfra.dev/v1) into a Crossplane
# composite. KEEP THIS SCHEMA STABLE — it is the product's contract; the engine
# behind it may change but users' infra.yaml must keep working.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xapplications.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "app"
    openinfra.dev/chaos-offers: "sql-session,http-invoke,enqueue,authz-probe"
    openinfra.dev/chaos-accepts: "authz-probe,stream-out"
    openinfra.dev/chaos-hosts: "database,storage"  # Application provisions these node-kinds
    argocd.argoproj.io/sync-wave: "2"
    # Crossplane's CRDs are installed by the crossplane child app (wave -1);
    # skip dry-run validation so this applies even before the CRD is registered.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names:
    kind: XApplication
    plural: xapplications
  claimNames:
    kind: Application        # what users write in infra.yaml
    plural: applications
    # NOTE: a short name (e.g. `oiapp`) cannot be ADDED here on a live XRD — spec.claimNames is
    # IMMUTABLE in Crossplane, so patching it is rejected and the whole XRD apply fails. Adding one
    # needs the XRD recreated (which deletes every claim), so #345.5 is deferred as not-worth-the-churn
    # for a convenience alias; use `kubectl get applications.openinfra.dev` to disambiguate from Argo CD.
  defaultCompositionRef:
    name: application
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              # No hard-required fields: an Application is usually image+port, but it may be
              # "data-only" (just a database/storage/queues block). The workload renders only with an image.
              x-kubernetes-validations:
                # A domain is served by an Ingress routed to the Service's HTTP port (80 -> spec.port).
                # Without spec.port that port does not exist (additionalPorts alone don't create it),
                # so reject the claim at admission rather than render an Ingress that points at
                # nothing. The composition refuses the same combination as a backstop.
                - rule: "!has(self.domain) || size(self.domain) == 0 || (has(self.port) && self.port > 0)"
                  message: "spec.domain requires spec.port: the domain's Ingress routes HTTPS to the app's HTTP port (Service port 80 -> spec.port). Set spec.port to the port the container serves HTTP on, or remove spec.domain."
                # expose puts the pod on a LAN IP via a LAN Service, which must declare at least one
                # port: spec.port or an additionalPorts entry. The composition refuses it too.
                - rule: "!has(self.expose) || !self.expose || (has(self.port) && self.port > 0) || (has(self.additionalPorts) && size(self.additionalPorts) > 0)"
                  message: "spec.expose requires spec.port or spec.additionalPorts: the LAN IP reaches the app on its container ports, and without one there is nothing to expose. Set spec.port (or additionalPorts), or remove spec.expose."
                # spec.port renders Service port 80 named http; an additionalPorts entry reusing either
                # makes a Service the API server rejects (duplicate name or port/protocol). Other
                # collisions (two additionalPorts entries sharing a name or port) are refused by the
                # composition, which names both entries.
                - rule: "!has(self.port) || self.port == 0 || !has(self.additionalPorts) || self.additionalPorts.all(p, p.name != 'http' && (p.port != 80 || (has(p.protocol) && p.protocol != 'TCP')))"
                  message: "spec.additionalPorts must not use the name http or Service port 80/TCP while spec.port is set: spec.port already takes them (Service port 80, named http). Rename the entry or give it another port (its targetPort can still be any container port)."
              properties:
                image:   { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/@-]*$', description: "Container image to run, e.g. ghcr.io/me/my-api:latest. Omit for a data-only app (just a database, buckets, or queues)." }
                port:    { type: integer, description: "The port your container listens on (e.g. 8080). Needed to serve the app over HTTPS or a LAN IP. OMIT it for a worker with no listening socket (a queue consumer) — no Service or TCP health probe is created, and k8s still restarts the container if it exits." }
                command:
                  type: array
                  items: { type: string }
                  description: "Override the image ENTRYPOINT (an ECS container's `command` / a Pod `command`). Lets one image run several roles (api, worker, migrate) selected by command/args."
                args:
                  type: array
                  items: { type: string }
                  description: "Arguments to the entrypoint/command (a Pod `args`)."
                cpu:     { type: string, pattern: '^[+-]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][-+]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$', description: "CPU request/limit for the primary container (e.g. \"500m\" or \"2\"). When unset, a small default is used (an ECS TaskDefinition container's Cpu maps here)." }
                memory:  { type: string, pattern: '^[+-]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][-+]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$', description: "Memory request/limit for the primary container (e.g. \"512Mi\" or \"1Gi\"). When unset, a small default is used (an ECS container's Memory maps here)." }
                startupGraceSeconds:
                  type: integer
                  minimum: 0
                  description: "How long a slow first boot may take before the liveness probe can kill the container (a startup probe's budget; default 150). The budget is counted in 10-second probe periods, rounded up (15 -> 20s), with a minimum of one period (so 0 gives no extra grace: the port must answer the first startup probe). Raise it for images whose first start is slow — a database's initial data-dir init, an antivirus signature download — so they are not killed mid-initialization. Applies only when spec.port is set."
                additionalPorts:
                  type: array
                  description: "Extra Service ports beyond the HTTP port (80 -> spec.port) — e.g. an SMTP 1025 or a second protocol the app serves. Each also becomes a declared containerPort; a container port shared by several Service ports (including spec.port) is declared once per protocol. Service port names and port/protocol pairs must be unique — while spec.port is set, the name http and port 80/TCP are taken by it."
                  items:
                    type: object
                    required: [name, port]
                    properties:
                      name:       { type: string, pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$', description: "Port name (required for a multi-port Service), e.g. smtp." }
                      port:       { type: integer, description: "The Service port." }
                      targetPort: { type: integer, description: "The container port it maps to (defaults to port)." }
                      protocol:   { type: string, enum: [TCP, UDP, SCTP], description: "TCP (default), UDP or SCTP." }
                quota:
                  type: object
                  description: >-
                    Namespace-wide object-count ceilings (compiles to a ResourceQuota). These are
                    generous safety caps to stop runaway loops, not a sizing tool — a ResourceQuota is
                    namespace-scoped, so when several apps share a namespace the most restrictive wins.
                    Raise `services` for a namespace that holds many Knative Functions (each
                    scale-to-zero Function needs ~3 Services). Unset fields keep the defaults.
                  properties:
                    services:               { type: string, pattern: '^[0-9]+$', description: "Max Services (default \"60\"). A Knative Function needs ~3." }
                    pods:                   { type: string, pattern: '^[0-9]+$', description: "Max Pods (default \"100\"). Scale-to-zero Functions idle at 0 pods; this bounds apply/invocation spikes." }
                    persistentvolumeclaims: { type: string, pattern: '^[0-9]+$', description: "Max PersistentVolumeClaims (default \"60\")." }
                volumeMounts:
                  type: array
                  description: "Mount shared pod volumes (declared in spec.volumes) into the primary container — the ECS task-volume MountPoints equivalent."
                  items:
                    type: object
                    required: [name, mountPath]
                    properties:
                      name:      { type: string, pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$', description: "Name of a volume declared in spec.volumes." }
                      mountPath: { type: string, description: "Path to mount it at inside the container." }
                volumes:
                  type: array
                  description: "Pod volumes, mountable into the primary container and sidecars via spec.volumeMounts. By default each is an ephemeral emptyDir (an ECS task's shared Volumes — scratch/shared space, lost on restart). Set `volume:` on an entry to instead mount a kind: Volume by name — durable, Longhorn-backed storage that survives restarts (#152)."
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$', description: "Volume name, referenced by volumeMounts." }
                      volume: { type: string, pattern: '^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$', description: "Optional: name of a kind: Volume (must be mode: Filesystem, same namespace) to mount here as durable storage, instead of an ephemeral emptyDir. Gives a stateful app image a place to keep its data across restarts (#152)." }
                domain:  { type: string, description: "Hostname to serve the app on — open-infra provisions Ingress, a TLS certificate, and DNS for it (e.g. my-api.example.com). Requires spec.port: the Ingress routes to the app's HTTP port." }
                subnet:
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$'
                  description: >-
                    Name of a kind: Subnet to place this app in (kube-ovn). The pod draws its IP from
                    that subnet and inherits its OVN-enforced topological isolation — the AWS "launch
                    in this subnet" model. Omit to use the namespace's default network.
                assumeRole:
                  type: string
                  maxLength: 2048
                  # A role name (AWS's role-name characters, at most 64), or a role ARN
                  # (arn:aws:iam::<12-digit account>:role/[<path>/]<name>), as an ECS task's TaskRoleArn takes it.
                  pattern: '^(arn:aws(-[a-z]+)*:iam::[0-9]{12}:role/([A-Za-z0-9+=,.@_-]+/)*)?[A-Za-z0-9+=,.@_-]{1,64}$'
                  description: >-
                    The app's task role (an ECS task's TaskRoleArn): the name or ARN of a kind: Role of
                    the app's own account. The app's code runs with that role's temporary credentials —
                    its AWS SDK finds them with no keys configured (workload identity: a dedicated
                    ServiceAccount, a projected token, sts:AssumeRoleWithWebIdentity on the aws-shim) —
                    so its calls are exactly as authorized as the role's policies. The role's trust
                    policy must name ecs-tasks.amazonaws.com (or this app's identity,
                    system:serviceaccount:<namespace>:<name>). Naming a role needs iam:PassRole on it.
                    Requires the aws-shim with assume-role enabled.
                expose:
                  type: boolean
                  default: false
                  description: "Also make the app reachable on a LAN IP, in addition to any Ingress — for raw TCP, non-HTTP, or no-DNS access. LAN clients connect to the container's own port numbers: spec.port and each additionalPorts targetPort (not the Service ports). Requires spec.port or additionalPorts."
                scaling:
                  type: object
                  description: "Horizontal autoscaling (HPA) based on CPU."
                  properties:
                    min: { type: integer, default: 1, description: "Minimum number of replicas." }
                    max: { type: integer, default: 5, description: "Maximum replicas the autoscaler may scale up to. Set equal to min (e.g. min: 1, max: 1) for a FIXED-size app — no HPA is created at all (an HPA with equal bounds has nothing to do)." }
                    targetCPUPercent: { type: integer, default: 70, description: "Average CPU utilization (%) the autoscaler targets before adding replicas." }
                database:
                  type: object
                  description: "Attach a managed database; open-infra provisions it and injects its connection URL into the app."
                  x-kubernetes-validations:
                    - rule: "!has(self.engineVersion) || (has(self.engine) && self.engine == 'babelfish')"
                      message: "database.engineVersion applies to engine babelfish only."
                  properties:
                    engine:
                      type: string
                      enum: [postgres, mongo, mysql, babelfish, sqlserver]
                      default: postgres
                      description: "Database engine. postgres = CloudNativePG (relational, injects DATABASE_URL). mongo = FerretDB on DocumentDB-Postgres (Mongo wire protocol, injects MONGODB_URI). mysql = MariaDB (MySQL wire protocol, injects DATABASE_URL). babelfish = SQL Server-compatible (TDS 1433 + T-SQL on Postgres) — experimental, single instance. sqlserver = REAL Microsoft SQL Server (TDS 1433 + T-SQL) — opt-in (requires acceptEula); Developer/Evaluation editions are non-production; single instance on Longhorn, injects SQLSERVER_URL."
                    engineVersion:
                      type: string
                      enum: ["16", "17"]
                      x-kubernetes-validations:
                        - rule: "self == oldSelf"
                          message: "database.engineVersion is fixed at creation: a major-version upgrade is not served. Create a new database at the new version and move the data."
                      description: "babelfish only: the PostgreSQL major version under Babelfish, as Aurora PostgreSQL's EngineVersion chooses it. 17 (the default) = Babelfish 5.4 on PostgreSQL 17.7. 16 = Babelfish 4.10 on PostgreSQL 16.14: choose it to restore a bbf_dump of an Aurora PostgreSQL 16 (Babelfish 4.x) cluster, because Babelfish restores a dump only into the same PostgreSQL version. Fixed at creation."
                    edition:
                      type: string
                      enum: [Developer, Evaluation, Express]
                      default: Developer
                      description: "sqlserver only: SQL Server edition (MSSQL_PID). Developer = free, full-featured, NON-PRODUCTION only (default). Evaluation = full-featured, 180-day. Express = free but capped at 10GB/database. Production use needs a licensed edition (BYOL) — a follow-up."
                    acceptEula:
                      type: boolean
                      default: false
                      description: "sqlserver only: set true to accept Microsoft's SQL Server EULA (https://go.microsoft.com/fwlink/?linkid=857698). REQUIRED for engine=sqlserver — the engine fails closed and provisions nothing (no image is pulled) until you do. open-infra never accepts it for you."
                    recoveryModel:
                      type: string
                      enum: [simple, full]
                      default: simple
                      description: "sqlserver only: the DB's recovery model, applied after provisioning/restore. simple (DEFAULT) = the transaction log is truncated at each checkpoint, so it CANNOT run away and fill the volume/node — the right choice for dev, test, and mirror/estate restores. full = point-in-time recovery, BUT the log grows until a transaction-log backup truncates it; choose full ONLY if you run regular log backups (open-infra does NOT run them for you), or the log will balloon until the volume is full (and, on an uncapped local-path volume, the whole node's disk — which is why the default is simple). Also applied to the instance's model database so databases created later inherit it."
                    placement:
                      type: object
                      additionalProperties: { type: string }
                      description: "sqlserver only: optional nodeSelector for the database pod — pin a large DB to a node with the RAM/storage for it. SET THIS for a large DB: neither local-path nor Longhorn does storage-capacity-aware scheduling, so without placement the pod can bind to any node that fits it by CPU/memory and then run out of disk. local-path in particular is node-local and cannot move or grow, so pin it. Use openinfra.dev/* node labels, never real hostnames."
                    restoreFrom:
                      type: object
                      description: "sqlserver only: restore a backup into this instance on bring-up (the migration landing path). The engine stages the backup onto the SIZED data volume (not node-ephemeral storage) and runs RESTORE DATABASE once — idempotent: skipped if the database already exists. Files are auto-relocated (WITH MOVE) into the data volume, and the staged backup is reclaimed afterward. size must therefore hold the backup AND the restored data at the same time during the restore (≈2× transiently). A capacity preflight runs first on the scheduled node and FAILS FAST with a clear reason if size cannot fit (rather than hitting ENOSPC mid-restore), and the claim stays NotReady until the restore completes — a failed restore surfaces as a NotReady claim with the reason, never a silently-healthy one. Provide EXACTLY ONE of key (single .bak), keys (an ordered striped set), or prefix (enumerate a striped set); setting more than one is rejected (fail-closed)."
                      required: [bucket, secret]
                      properties:
                        bucket: { type: string, description: "S3/MinIO bucket holding the backup." }
                        key:    { type: string, description: "Object key of a SINGLE-file .bak within the bucket. Use for a one-file backup. Mutually exclusive with keys/prefix." }
                        keys:
                          type: array
                          items: { type: string }
                          description: "Object keys of a STRIPED multi-file backup (RDS native backup-to-S3 with @number_of_files), in order. SQL Server needs the whole set to restore; a missing stripe fails the restore loudly. Mutually exclusive with key/prefix."
                        prefix: { type: string, description: "Object-key prefix that enumerates a STRIPED multi-file backup — every object under the prefix is fetched (sorted) and restored as one stripe set. Zero objects fails closed. Mutually exclusive with key/keys." }
                        secret: { type: string, description: "Name of a Secret with S3 credentials for the bucket (keys: S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY)." }
                    name:   { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$-]{0,127}$', description: "Database name (defaults to the application name). A SQL identifier (it names the database in T-SQL and in the restore script)." }
                    size:
                      type: string
                      pattern: '^[0-9]+(\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|k|m)?$'
                      description: "Storage size for the database's data volume, e.g. 20Gi (maps from RDS AllocatedStorage). When unset, the engine default is used (postgres/mysql/mongo 5Gi, babelfish 10Gi, sqlserver 20Gi). Expandable later where the engine + StorageClass support it. NOTE: on local-path, size is NOT enforced — the data lands on the node's own disk and consumes whatever free space it has — and scheduling is not capacity-aware on either local-path or Longhorn, so for a large DB set database.placement to a node that can hold it (local-path cannot move or grow). Longhorn provisions the requested size and backs it up with Velero, so it is the better class for large or movable databases."
                    cpu:
                      type: string
                      description: "CPU request/limit for the database (e.g. \"2\"), sized to match an RDS instance class's vCPU. When unset, the engine operator's default is used."
                    memory:
                      type: string
                      description: "Memory request/limit for the database (e.g. \"8Gi\"), sized to match an RDS instance class's RAM. When unset, the engine operator's default is used."
                    highAvailability:
                      type: boolean
                      default: false
                      description: "Run the database highly available (postgres: primary + standby on separate nodes with automatic failover). Needs 2 or more nodes. Shorthand for replicas: 2. Default false = single instance (fine for dev)."
                    replicas:
                      type: integer
                      minimum: 1
                      description: "postgres only: explicit instance count — 1 primary + (replicas-1) hot standbys (the Aurora replica-count knob). Overrides highAvailability's implied 2. Any value >1 enables streaming replication, cross-node anti-affinity, and the reader endpoint; needs that many nodes. Unset = highAvailability ? 2 : 1."
                    autoscaling:
                      type: object
                      description: "postgres only: autoscale the instance count on load (the Aurora replica-autoscaling analog). A KEDA ScaledObject target-tracks CPU utilization and scales the CNPG Cluster's instances between minReplicas and maxReplicas via its /scale subresource. When set, it owns the instance count (replicas/highAvailability are ignored) and implies standbys (anti-affinity + reader endpoint). Needs ≥ maxReplicas nodes."
                      properties:
                        minReplicas:
                          type: integer
                          minimum: 1
                          default: 2
                          description: "Floor instance count (primary + standbys). Default 2 (one standby), so there is always a reader to scale from."
                        maxReplicas:
                          type: integer
                          minimum: 2
                          description: "Ceiling instance count the autoscaler may scale up to. Required when autoscaling is set."
                        targetCPUPercent:
                          type: integer
                          default: 70
                          description: "Scale up/down to keep average CPU utilization across instances near this percent (default 70)."
                    pointInTimeRecovery:
                      type: boolean
                      default: false
                      description: "postgres only: continuously archive WAL to object storage (the Aurora Backtrack / RDS point-in-time-recovery analog), so the database can be restored to any instant within the retention window. Opt-in (adds ongoing object-storage cost). A restore recovers to a NEW database at a target time (CNPG has no in-place rewind); the app is then cut over to it. Default off."
                    backtrackWindow:
                      type: string
                      default: 7d
                      description: "How far back a point-in-time restore can reach — the WAL-archive retention (e.g. 7d, 720h, 30d). Only meaningful with pointInTimeRecovery. Default 7d."
                    readerEndpoint:
                      type: boolean
                      default: false
                      description: "Surface a read-only reader endpoint (the Aurora reader-endpoint analog): inject DATABASE_RO_HOST pointing at the database's replica-balancing service, for routing reads off the primary. Use with the DATABASE_URL credentials. postgres with standbys (highAvailability or replicas>1) only; default off."
                    vector:
                      type: boolean
                      default: false
                      description: "postgres only: enable the pgvector extension (vector similarity search) — pairs with kind: Model for RAG."
                    expose:
                      type: boolean
                      default: false
                      description: "Expose the database on a LAN IP (MetalLB LoadBalancer) so workstations can connect directly. Default false = in-cluster only."
                    stopped:
                      type: boolean
                      default: false
                      description: "Stop the database to save resources while keeping its data, like RDS stop/start (Postgres hibernates; MySQL/Mongo scale to zero; PVCs are retained). Set back to false to start it."
                    storageClass:
                      type: string
                      pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                      description: "StorageClass for the database's persistent volumes. When unset, each engine keeps its default (local-path; babelfish + sqlserver: longhorn). Set this to your cluster's StorageClass on substrates that don't ship a default local-path provisioner, or to pin the DB onto replicated storage (e.g. longhorn)."
                    storageEncrypted:
                      type: boolean
                      default: false
                      description: "Encrypt the database's storage at rest with LUKS (longhorn-encrypted), keyed by a customer kind: EncryptionKey via encryptionKey — destroying that key crypto-erases the data. Overrides storageClass. Requires the opt-in encryption component. v1: postgres engine only (other engines ignore it)."
                    encryptionKey:
                      type: string
                      description: "Name of the kind: EncryptionKey (a Vault Transit KEK) protecting the database's storage. Required when storageEncrypted is true; ignored otherwise."
                storage:
                  type: object
                  description: "Object storage for the app."
                  properties:
                    buckets:
                      type: array
                      items: { type: string, pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" }
                      description: "S3-compatible bucket names to create and grant the app access to (MinIO). Bucket names are global: a bucket that belongs to another namespace is refused."
                queues:
                  type: array
                  items: { type: string }
                  description: "Message queue names (NATS/JetStream) to create for the app."
                env:
                  type: array
                  description: "Environment variables to set on the app's container."
                  items:
                    type: object
                    properties:
                      name:  { type: string, description: "Variable name." }
                      value: { type: string, description: "Variable value." }
                sidecars:
                  type: array
                  description: "Auxiliary containers that run alongside the app (a logging agent, a proxy, an ECS multi-container task's helper containers). The `image` above is the primary container; these run in the same pod. A sidecar receives only the secrets it lists in its own `secrets`."
                  items:
                    type: object
                    required: [name, image]
                    properties:
                      name:  { type: string, pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$', description: "Sidecar container name (unique within the pod)." }
                      image: { type: string, description: "Sidecar container image." }
                      command:
                        type: array
                        items: { type: string }
                        description: "Override the sidecar image ENTRYPOINT — lets the same image run a different role (e.g. a worker) beside the primary."
                      args:
                        type: array
                        items: { type: string }
                        description: "Arguments to the sidecar entrypoint/command."
                      port:  { type: integer, description: "Optional container port the sidecar listens on." }
                      cpu:    { type: string, pattern: '^[+-]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][-+]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$', description: "CPU request/limit for this sidecar (e.g. \"250m\"). When unset, a small default is used (an ECS sidecar container's Cpu maps here)." }
                      memory: { type: string, pattern: '^[+-]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][-+]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$', description: "Memory request/limit for this sidecar (e.g. \"256Mi\"). When unset, a small default is used (an ECS sidecar container's Memory maps here)." }
                      env:
                        type: array
                        description: "Environment variables for the sidecar."
                        items:
                          type: object
                          properties:
                            name:  { type: string }
                            value: { type: string }
                      volumeMounts:
                        type: array
                        description: "Mount shared pod volumes (spec.volumes) into this sidecar — the ECS task-volume MountPoints equivalent."
                        items:
                          type: object
                          required: [name, mountPath]
                          properties:
                            name:      { type: string, pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$', description: "Name of a volume declared in spec.volumes." }
                            mountPath: { type: string, description: "Path to mount it at inside the sidecar." }
                      secrets:
                        type: array
                        items: { type: string, pattern: '^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$' }
                        description: "Secrets (by name, in the app's namespace) whose keys this sidecar receives as environment variables. A sidecar receives NO secrets unless listed here — not the app's spec.secrets and not its bucket credentials — so a logging agent or proxy never holds the app's credentials. Name exactly what this sidecar needs: an entry of spec.secrets, any other Secret in the namespace, or <app-name>-minio for the app's storage.buckets credentials (an ECS container definition's per-container Secrets)."
                secrets:
                  type: array
                  items: { type: string, pattern: '^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$' }
                  description: "Secret names (in the app's namespace) whose keys are injected into the primary container as environment variables. Sidecars do not receive them; a sidecar lists the secrets it needs in its own sidecars[].secrets."
                securityGroups:
                  type: array
                  # A SecurityGroup's name becomes a pod label (openinfra.dev/sg-<name>), so it is a label-safe name.
                  items: { type: string, maxLength: 60, pattern: '^[A-Za-z0-9]([-A-Za-z0-9_.]{0,58}[A-Za-z0-9])?$' }
                  description: "SecurityGroup (firewall rule set) names to attach to this app's pods."
            status:
              type: object
              properties:
                url: { type: string }
