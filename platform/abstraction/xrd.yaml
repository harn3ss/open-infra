# The public API of open-infra. This CompositeResourceDefinition turns the
# user-facing `kind: Application` (apiVersion openinfra.dev/v1) into a Crossplane
# composite. KEEP THIS SCHEMA STABLE — it is the product's contract; the engine
# behind it may change but users' infra.yaml must keep working.
#
# Synced after Crossplane's CRDs exist (sync-wave 2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xapplications.openinfra.dev
  annotations:
    # Chaos topology tags (consumed by tools/chainforge): the node-kind this resource
    # plays in a chaos chain and the typed ports it offers/accepts. role "none" = not a
    # chaos data-node. The compatibility matrix is derived from these.
    openinfra.dev/chaos-role: "app"
    openinfra.dev/chaos-offers: "sql-session,http-invoke,enqueue,authz-probe"
    openinfra.dev/chaos-accepts: "authz-probe,stream-out"
    openinfra.dev/chaos-hosts: "database,storage"  # Application provisions these node-kinds
    argocd.argoproj.io/sync-wave: "2"
    # Crossplane's CRDs are installed by the crossplane child app (wave -1);
    # skip dry-run validation so this applies even before the CRD is registered.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names:
    kind: XApplication
    plural: xapplications
  claimNames:
    kind: Application        # what users write in infra.yaml
    plural: applications
  defaultCompositionRef:
    name: application
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              # No hard-required fields: an Application is usually image+port, but it may be
              # "data-only" (just a database/storage/queues block). The workload renders only with an image.
              properties:
                image:   { type: string, description: "Container image to run, e.g. ghcr.io/me/my-api:latest. Omit for a data-only app (just a database, buckets, or queues)." }
                port:    { type: integer, description: "The port your container listens on (e.g. 8080). Needed to serve the app over HTTPS or a LAN IP." }
                cpu:     { type: string, description: "CPU request/limit for the primary container (e.g. \"500m\" or \"2\"). When unset, a small default is used (an ECS TaskDefinition container's Cpu maps here)." }
                memory:  { type: string, description: "Memory request/limit for the primary container (e.g. \"512Mi\" or \"1Gi\"). When unset, a small default is used (an ECS container's Memory maps here)." }
                volumeMounts:
                  type: array
                  description: "Mount shared pod volumes (declared in spec.volumes) into the primary container — the ECS task-volume MountPoints equivalent."
                  items:
                    type: object
                    required: [name, mountPath]
                    properties:
                      name:      { type: string, description: "Name of a volume declared in spec.volumes." }
                      mountPath: { type: string, description: "Path to mount it at inside the container." }
                volumes:
                  type: array
                  description: "Shared ephemeral pod volumes (emptyDir), mountable into the primary container and sidecars — an ECS task's shared Volumes. Data lives for the pod's lifetime (scratch/shared space between containers), NOT durable storage (use spec.storage.buckets or a kind: Volume for that)."
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, description: "Volume name, referenced by volumeMounts." }
                domain:  { type: string, description: "Hostname to serve the app on — open-infra provisions Ingress, a TLS certificate, and DNS for it (e.g. my-api.example.com)." }
                assumeRole:
                  type: string
                  description: >-
                    Name of a kind: Role this app runs as (workload identity, IRSA-shaped). The app
                    gets a dedicated ServiceAccount and a projected token; the AWS SDK exchanges it
                    for the role's temporary credentials via sts:AssumeRoleWithWebIdentity on the
                    aws-shim — no static keys. The role's spec.trust MUST name
                    system:serviceaccount:<this-namespace>:<this-app-name>. Requires the aws-shim
                    with assume-role enabled.
                expose:
                  type: boolean
                  default: false
                  description: "Also expose the app's port on a LAN IP (MetalLB LoadBalancer), in addition to any Ingress — for raw TCP, non-HTTP, or no-DNS access."
                scaling:
                  type: object
                  description: "Horizontal autoscaling (HPA) based on CPU."
                  properties:
                    min: { type: integer, default: 1, description: "Minimum number of replicas." }
                    max: { type: integer, default: 5, description: "Maximum replicas the autoscaler may scale up to." }
                    targetCPUPercent: { type: integer, default: 70, description: "Average CPU utilization (%) the autoscaler targets before adding replicas." }
                database:
                  type: object
                  description: "Attach a managed database; open-infra provisions it and injects its connection URL into the app."
                  properties:
                    engine:
                      type: string
                      enum: [postgres, mongo, mysql, babelfish]
                      default: postgres
                      description: "Database engine. postgres = CloudNativePG (relational, injects DATABASE_URL). mongo = FerretDB on DocumentDB-Postgres (Mongo wire protocol, injects MONGODB_URI). mysql = MariaDB (MySQL wire protocol, injects DATABASE_URL). babelfish = SQL Server-compatible (TDS 1433 + T-SQL on Postgres) — experimental, single instance."
                    name:   { type: string, description: "Database name (defaults to the application name)." }
                    size:
                      type: string
                      description: "Storage size for the database's data volume, e.g. 20Gi (maps from RDS AllocatedStorage). When unset, the engine default is used (postgres/mysql/mongo 5Gi, babelfish 10Gi). Expandable later where the engine + StorageClass support it."
                    cpu:
                      type: string
                      description: "CPU request/limit for the database (e.g. \"2\"), sized to match an RDS instance class's vCPU. When unset, the engine operator's default is used."
                    memory:
                      type: string
                      description: "Memory request/limit for the database (e.g. \"8Gi\"), sized to match an RDS instance class's RAM. When unset, the engine operator's default is used."
                    highAvailability:
                      type: boolean
                      default: false
                      description: "Run the database highly available (postgres: primary + standby on separate nodes with automatic failover). Needs 2 or more nodes. Default false = single instance (fine for dev)."
                    vector:
                      type: boolean
                      default: false
                      description: "postgres only: enable the pgvector extension (vector similarity search) — pairs with kind: Model for RAG."
                    expose:
                      type: boolean
                      default: false
                      description: "Expose the database on a LAN IP (MetalLB LoadBalancer) so workstations can connect directly. Default false = in-cluster only."
                    stopped:
                      type: boolean
                      default: false
                      description: "Stop the database to save resources while keeping its data, like RDS stop/start (Postgres hibernates; MySQL/Mongo scale to zero; PVCs are retained). Set back to false to start it."
                    storageClass:
                      type: string
                      description: "StorageClass for the database's persistent volumes. When unset, each engine keeps its default (local-path; babelfish: longhorn). Set this to your cluster's StorageClass on substrates that don't ship a default local-path provisioner, or to pin the DB onto replicated storage (e.g. longhorn)."
                    storageEncrypted:
                      type: boolean
                      default: false
                      description: "Encrypt the database's storage at rest with LUKS (longhorn-encrypted), keyed by a customer kind: EncryptionKey via encryptionKey — destroying that key crypto-erases the data. Overrides storageClass. Requires the opt-in encryption component. v1: postgres engine only (other engines ignore it)."
                    encryptionKey:
                      type: string
                      description: "Name of the kind: EncryptionKey (a Vault Transit KEK) protecting the database's storage. Required when storageEncrypted is true; ignored otherwise."
                storage:
                  type: object
                  description: "Object storage for the app."
                  properties:
                    buckets:
                      type: array
                      items: { type: string }
                      description: "S3-compatible bucket names to create and grant the app access to (MinIO)."
                queues:
                  type: array
                  items: { type: string }
                  description: "Message queue names (NATS/JetStream) to create for the app."
                env:
                  type: array
                  description: "Environment variables to set on the app's container."
                  items:
                    type: object
                    properties:
                      name:  { type: string, description: "Variable name." }
                      value: { type: string, description: "Variable value." }
                sidecars:
                  type: array
                  description: "Auxiliary containers that run alongside the app (a logging agent, a proxy, an ECS multi-container task's helper containers). The `image` above is the primary container; these run in the same pod."
                  items:
                    type: object
                    required: [name, image]
                    properties:
                      name:  { type: string, description: "Sidecar container name (unique within the pod)." }
                      image: { type: string, description: "Sidecar container image." }
                      port:  { type: integer, description: "Optional container port the sidecar listens on." }
                      cpu:    { type: string, description: "CPU request/limit for this sidecar (e.g. \"250m\"). When unset, a small default is used (an ECS sidecar container's Cpu maps here)." }
                      memory: { type: string, description: "Memory request/limit for this sidecar (e.g. \"256Mi\"). When unset, a small default is used (an ECS sidecar container's Memory maps here)." }
                      env:
                        type: array
                        description: "Environment variables for the sidecar."
                        items:
                          type: object
                          properties:
                            name:  { type: string }
                            value: { type: string }
                      volumeMounts:
                        type: array
                        description: "Mount shared pod volumes (spec.volumes) into this sidecar — the ECS task-volume MountPoints equivalent."
                        items:
                          type: object
                          required: [name, mountPath]
                          properties:
                            name:      { type: string, description: "Name of a volume declared in spec.volumes." }
                            mountPath: { type: string, description: "Path to mount it at inside the sidecar." }
                secrets:
                  type: array
                  items: { type: string }
                  description: "Sealed Secret names to mount into the app."
                securityGroups:
                  type: array
                  items: { type: string }
                  description: "SecurityGroup (firewall rule set) names to attach to this app's pods."
            status:
              type: object
              properties:
                url: { type: string }
