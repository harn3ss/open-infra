# Air-gap front-load — node container-runtime mirror config (self-service automation).
#
# Points every node's container runtime at the in-cluster registry mirror by writing its
# registries.yaml (k3s: /etc/rancher/k3s/, RKE2: /etc/rancher/rke2/ — the DaemonSet detects which
# runtime the node runs and targets the right path + unit), so pulls of the public registries resolve
# to the mirror.
# This removes the one manual per-node step from air-gapping. It lives in kube-system because it is a
# privileged, host-touching node agent (the restricted-PSA openinfra-airgap namespace can't host it).
#
# Reachability: the host's containerd is OUTSIDE the pod network and cannot resolve cluster DNS, so the
# mirror is addressed as 127.0.0.1:30500 — the mirror Service's NodePort, which every node exposes and
# routes to the registry pod wherever it runs.
#
# Fallback while on-net: k3s tries the mirror endpoint first and falls back to the canonical upstream on
# a miss, so front-loading before the mirror is fully populated is safe. After the public-egress cutoff
# is elected, upstream is unreachable and only the mirror serves — which is why you populate it first.
#
# Idempotent + minimally disruptive: the agent writes the file ONLY when it differs, and restarts the
# runtime ONLY on a real change (never in a loop). Deployed with `components.airgap: true`.
#
# NOT auto-applied to the reference cluster: enabling this restarts the node runtime, so it ships gated
# and is validated by schema only until an operator elects air-gap on a cluster they can afford to cycle.
apiVersion: v1
kind: ConfigMap
metadata:
  name: airgap-node-registries
  namespace: kube-system
  labels: { openinfra.dev/component: airgap }
data:
  # The desired /etc/rancher/k3s/registries.yaml. Add or trim registries to match what your workloads pull.
  registries.yaml: |
    mirrors:
      docker.io:       { endpoint: ["http://127.0.0.1:30500"] }
      ghcr.io:         { endpoint: ["http://127.0.0.1:30500"] }
      registry.k8s.io: { endpoint: ["http://127.0.0.1:30500"] }
      gcr.io:          { endpoint: ["http://127.0.0.1:30500"] }
      quay.io:         { endpoint: ["http://127.0.0.1:30500"] }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: airgap-node-registries
  namespace: kube-system
  labels: { openinfra.dev/component: airgap, app: airgap-node-registries }
spec:
  selector:
    matchLabels: { app: airgap-node-registries }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 } # one node at a time — never cycle the whole fleet at once
  template:
    metadata:
      labels: { app: airgap-node-registries, openinfra.dev/component: airgap }
    spec:
      hostPID: true # to nsenter the host's PID 1 and restart the runtime unit
      tolerations:
        - { operator: Exists } # run on every node, including control-plane/tainted
      containers:
        - name: configure
          image: alpine:3.20
          securityContext:
            privileged: true # host file write + nsenter into the host to restart the runtime
          env:
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
          command: [/bin/sh, -ceu]
          args:
            - |
              DESIRED=/desired/registries.yaml
              # Detect THIS node's runtime and target its own registries.yaml path + unit. RKE2 reads
              # /etc/rancher/rke2/registries.yaml; k3s reads /etc/rancher/k3s/registries.yaml. Writing
              # the wrong one restarts the node but the mirror redirect silently no-ops.
              UNIT=""
              for u in rke2-server rke2-agent k3s k3s-agent; do
                if nsenter -t 1 -m -u -i -n -p -- systemctl is-active --quiet "$u" 2>/dev/null; then UNIT="$u"; break; fi
              done
              case "$UNIT" in
                rke2-*) DIR=/host/etc/rancher/rke2 ;;
                k3s*)   DIR=/host/etc/rancher/k3s ;;
                *)      DIR=/host/etc/rancher/k3s; echo "[$NODE_NAME] WARN: no k3s/rke2 unit active — defaulting to the k3s path" ;;
              esac
              TARGET="$DIR/registries.yaml"
              echo "[$NODE_NAME] runtime unit='${UNIT:-none}', registries path=$TARGET"
              while :; do
                mkdir -p "$DIR"
                if ! cmp -s "$DESIRED" "$TARGET" 2>/dev/null; then
                  cp "$DESIRED" "$TARGET"
                  if [ -n "$UNIT" ]; then
                    echo "[$NODE_NAME] registries.yaml changed -> restarting $UNIT"
                    nsenter -t 1 -m -u -i -n -p -- systemctl restart "$UNIT" || echo "[$NODE_NAME] WARN: restart $UNIT failed (restart it manually)"
                  else
                    echo "[$NODE_NAME] registries.yaml written to $TARGET; restart the runtime manually"
                  fi
                else
                  echo "[$NODE_NAME] registries.yaml already current ($TARGET)"
                fi
                sleep 300
              done
          volumeMounts:
            - { name: host-etc, mountPath: /host/etc }
            - { name: desired, mountPath: /desired, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: host-etc
          hostPath: { path: /etc, type: Directory }
        - name: desired
          configMap: { name: airgap-node-registries }
