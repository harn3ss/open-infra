# Declared architecture support per open-infra kind (#41 Phase 2).
#
# States (never collapse them): supported | unsupported | untested.
#   supported   — verified to run on this arch.
#   unsupported — known NOT to run (e.g. the first-party data-plane image is single-arch,
#                 or a structural reason like VirtualMachine's x86 guest catalog).
#   untested    — no first-party blocker; arch is available upstream, but not yet run here.
#
# This file is the DECLARED truth. It is checked against reality by CI
# (platform/arch/arch-check.sh, workflow arch-check.yml): a kind declared `supported` for an
# arch MUST have that arch in its first-party image's published manifest, and a kind declared
# `unsupported` while its image HAS gained that arch is flagged as stale — so the declaration
# can never silently drift from what actually ships.
#
# `image` is the first-party data-plane image whose manifest gates the claim (omitted for kinds
# with no first-party image — those inherit their arch from upstream, hence `untested` until run).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openinfra-kind-architectures
  namespace: crossplane-system
  labels:
    app.kubernetes.io/part-of: open-infra
data:
  kinds.yaml: |
    # First-party data-plane images now ship -arm64 tags (build-arm64.yml) AND the compositions
    # arch-select them (imageArchSuffix wiring) -> the wired kinds are arm64: supported. arch-check
    # enforces the -arm64 manifest exists; the end-to-end path (registry->admission->wiring->-arm64
    # image) is runtime-proven for Query on a real arm64 cluster.
    DatabaseProxy:  {amd64: supported, arm64: supported, image: ghcr.io/harn3ss/open-infra-tds-proxy, note: "arm64 via -arm64 tag + composition imageArchSuffix wiring"}
    DataFlow:       {amd64: supported, arm64: supported, image: ghcr.io/harn3ss/open-infra-apply-sink, note: "arm64 via -arm64 tag + composition wiring"}
    Migration:      {amd64: supported, arm64: supported, image: ghcr.io/harn3ss/open-infra-apply-sink, note: "arm64 via -arm64 tag + composition wiring"}
    Replication:    {amd64: supported, arm64: supported, image: ghcr.io/harn3ss/open-infra-apply-sink, note: "arm64 via -arm64 tag + composition wiring"}
    Query:          {amd64: supported, arm64: supported, image: ghcr.io/harn3ss/open-infra-query, note: "arm64 via the -arm64 tag (build-arm64.yml) + the composition's imageArchSuffix wiring; -arm64 image runtime-proven on arm64"}
    GraphQLApi:     {amd64: supported, arm64: supported, image: ghcr.io/harn3ss/open-infra-open-appsync, note: "arm64 via -arm64 tag + composition wiring"}
    Destruction:    {amd64: supported, arm64: supported, image: ghcr.io/harn3ss/open-infra-mc, note: "arm64 RUN-VERIFIED 2026-08-30: the destroyer pod ran on lima-openinfra-arm64 and crypto-erased a Vault Transit key (certificate written, ciphertext unrecoverable). Was manifest-verified before (#42): mc as a shared multi-arch :latest (non-FIPS, so a shared tag is safe) + the destroyer's vault/alpine-k8s images already multi-arch"}
    # Structural (not a build flag): an arm64 host cannot run the x86 VM guest catalog.
    VirtualMachine: {amd64: supported, arm64: unsupported, note: "x86 guest OS catalog; KubeVirt itself is arm64"}
    VmImage:        {amd64: supported, arm64: unsupported, note: "builds/holds the x86 golden images"}
    # No first-party image; arch available upstream (crossplane/provider-kubernetes/etc. publish
    # arm64) but not runtime-confirmed here (survey convergence blocked by the survey proxy).
    CertificateAuthority: {amd64: supported, arm64: untested, note: "pki component OFF on the survey cluster (ca-reconciler not deployed); not runnable here — see survey-2026-08-30"}
    DataClassification:   {amd64: supported, arm64: untested, note: "CR reconciles Synced=True in the mixed cluster (2026-08-30); pure central orchestration, no arm64-node data plane to observe"}
    Directory:            {amd64: supported, arm64: untested, note: "experimental Samba AD DC; heavy data plane not exercised on arm64 (effort cap) — see survey-2026-08-30"}
    EncryptionKey:        {amd64: supported, arm64: supported, note: "arm64 RUN-VERIFIED 2026-08-30: the encryptionkey-reconciler ran on lima-openinfra-arm64 and created a working Vault Transit key (canary encrypt/decrypt round-trip). No first-party image (vault/alpine-k8s multi-arch)"}
    FaultInjection:       {amd64: supported, arm64: untested}
    FileShare:            {amd64: supported, arm64: untested}
    Function:             {amd64: supported, arm64: supported, note: "arm64 RUN-VERIFIED 2026-08-30: the Knative serving data plane (user container + queue-proxy) ran and served an HTTP request on lima-openinfra-arm64. Verified via a node-pinned Knative Service (the exact substrate the composition emits); the Function XRD itself exposes node-pinning only for GPU, so the wrapper CR was not itself pinned"}
    Grant:                {amd64: supported, arm64: supported, note: "arm64 RUN-VERIFIED 2026-08-30: the grant expiry-reconciler ran on lima-openinfra-arm64 and swept an expired Grant (binding teardown). No first-party image (alpine-k8s multi-arch)"}
    Group:                {amd64: supported, arm64: untested, note: "CR reconciles Synced=True in the mixed cluster (2026-08-30); pure central orchestration (RBAC via provider-kubernetes), no arm64-node data plane"}
    HttpApi:              {amd64: supported, arm64: supported, note: "arm64 RUN-VERIFIED 2026-08-29 (survey-2026-08-29): live HttpApi rendered a Traefik Ingress and zero pods — pure orchestration; Traefik (k3s arm64) + provider-kubernetes both arm64"}
    Model:                {amd64: supported, arm64: untested, note: "heavy inference data plane not exercised on arm64 (effort cap) — see survey-2026-08-30"}
    ModelPackage:         {amd64: supported, arm64: supported, note: "registry record only (no workload of its own — composition emits nothing); the served endpoint is a kind: Model. Pure central orchestration, arch-agnostic"}
    Policy:               {amd64: supported, arm64: untested, note: "CR reconciles Synced=True in the mixed cluster (2026-08-30); pure central orchestration, no arm64-node data plane"}
    Role:                 {amd64: supported, arm64: untested, note: "CR reconciles Synced=True in the mixed cluster (2026-08-30); pure central orchestration, no arm64-node data plane"}
    SecurityGroup:        {amd64: supported, arm64: untested, note: "renders a CiliumNetworkPolicy (central orchestration); enforcement is by the native-arm64 Cilium agent (confirmed Running on lima-openinfra-arm64), but SG-specific enforcement not directly exercised on arm64 — see survey-2026-08-30"}
    StateMachine:         {amd64: supported, arm64: untested, image: ghcr.io/harn3ss/open-infra-statemachine, note: "amd64 RUN-VERIFIED 2026-08-30: the controller ran on .194 (amd64) and drove executions to Succeeded end-to-end — the Pass/Choice/Wait/ResultPath engine, and a Task->Function call with retry-through-cold-start (history: TaskFailed->TaskRetry->...->ExecutionSucceeded). The image also builds+executes on arm64 (build-arm64 smoke), but the shipped singleton controller is amd64-pinned, so the arm64 control plane is not exercised."}
    Stream:               {amd64: supported, arm64: untested, note: "bespoke Debezium+Benthos data plane not run on arm64 (effort cap); NATS/JetStream substrate is arm64-confirmed — see survey-2026-08-30"}
    TuningJob:            {amd64: supported, arm64: untested, image: ghcr.io/harn3ss/open-infra-hpo, note: "amd64 RUN-VERIFIED 2026-08-31: the hpo controller ran a 3-trial LR grid sweep (each trial a TrainingJob), read each trial's OPENINFRA_METRIC from logs, and correctly picked the min-loss trial (LR=0.1, loss 0.010); owner-ref GC of trials confirmed. arm64 controller amd64-pinned"}
    # Built-in monitor runs on stock python:3.11-slim (no first-party image).
    ModelMonitor:         {amd64: supported, arm64: untested, note: "amd64 RUN-VERIFIED 2026-08-31: the scheduled CronJob's built-in drift check compared a baseline (amount~50) to drifted current data (amount~80), correctly flagged violation=True drifted=[amount] (drift 0.58 > 0.2), and wrote report/latest.json (independently verified). No first-party image (python:3.11-slim + inline check)"}
    # No first-party image (runs the user's container).
    ProcessingJob:        {amd64: supported, arm64: untested, note: "amd64 RUN-VERIFIED 2026-08-31: a processing job read a named input channel (INPUT_RAW_*), transformed 10 records, and wrote a named output channel (OUTPUT_CLEAN_*) — multi-channel env + INPUTS/OUTPUTS lists confirmed, output independently verified in MinIO. No first-party image (user container)"}
    # No first-party image (runs the user's container).
    BatchTransform:       {amd64: supported, arm64: untested, note: "amd64 RUN-VERIFIED 2026-08-31: a batch job loaded a model artifact from MinIO, scored 10 input records, and wrote predictions/predictions.jsonl back (independently confirmed). No first-party image (user container); arm64 GPU N/A (GPU box is amd64)"}
    # No first-party image (runs the user's training container); GPU nodes (A2000/3090) are amd64.
    TrainingJob:          {amd64: supported, arm64: untested, note: "amd64 RUN-VERIFIED 2026-08-30: a real GPU run on mlbox-g477 (RTX 3090, largegpu tier) — a PyTorch CUDA training loop trained on the 3090 (loss converged) and wrote its artifact to MinIO via the injected S3 creds; composition->bucket-setup->batch Job path proven. No first-party image (user container); arm64 GPU training N/A (GPU box is amd64)"}
    User:                 {amd64: supported, arm64: untested, note: "CR reconciles Synced=True in the mixed cluster (2026-08-30); pure central orchestration, no arm64-node data plane"}
    Volume:               {amd64: supported, arm64: untested, note: "CR reconciles Synced=True (2026-08-30); the Longhorn arm64 data plane (attach/mount on the arm64 node) was NOT exercised — longhorn-host-prereq is unhealthy on lima-openinfra-arm64"}
