# open-infra aws-shim — the AWS-SDK interception front door (S3 over MinIO, v1).
#
# Opt-in, OFF by default: this whole directory is excluded from the app-of-apps unless
# components.awsShim: true (install.sh incl). It is one optional AWS-shaped surface over the
# platform, never a core dependency.
#
# Security posture:
# - The shim reuses internal/iam, so authorization is the SAME impersonated SubjectAccessReview
# the console uses. Its only cluster-wide grant is `create subjectaccessreviews` — which ASKS
# the API server a question and grants nothing.
# - Least privilege by namespace split: the shim reads access-key Secrets ONLY in its own
# namespace, and reads kind: User (never Secrets) in the console namespace to resolve owners.
# - It talks to MinIO as a scoped, NON-root service account (no MinIO admin API), minted the
# same declarative way as the console/query identities.
---
apiVersion: v1
kind: Namespace
metadata:
  name: open-infra-aws-shim
  labels:
    openinfra.dev/component: aws-shim
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-shim
  namespace: open-infra-aws-shim
---
# The platform root CA's PUBLIC certificate, published where the shim can read it: the shim serves it
# at /v1/ca-bundle. (VM guests get the root in their own spec instead, from the EnvironmentConfig the
# platform-ca-publisher keeps, platform-ca-publisher.yaml; that publisher also renews this Certificate
# when the root changes, so the endpoint follows it.) cert-manager writes the issuing CA's certificate into
# an issued Secret's ca.crt, so this Certificate from openinfra-ca carries the root certificate into the
# shim's namespace, where the shim already reads Secrets (Role aws-shim-keys) — the shim never reads
# cert-manager/openinfra-root-ca, which holds the root's PRIVATE key. The carrier certificate itself is
# good for nothing: no DNS/IP name, and an extended key usage that is neither TLS server nor client.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openinfra-ca-bundle
  namespace: open-infra-aws-shim
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # after the openinfra-ca ClusterIssuer (wave 2)
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: openinfra-ca-bundle
  commonName: open-infra root CA bundle
  usages: [digital signature, email protection]
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: openinfra-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
# The shim's in-cluster TLS port (4567). A VM's metadata agent sends its ServiceAccount token to
# /v1/vm-credentials here, and only here: it verifies this certificate against the platform root CA from
# its own spec, so the token is never sent in clear text or to a host that merely answers for this name.
# The shim re-reads the Secret when cert-manager renews it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aws-shim-internal-tls
  namespace: open-infra-aws-shim
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # after the openinfra-ca ClusterIssuer (wave 2)
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: aws-shim-internal-tls
  dnsNames:
    - aws-shim.open-infra-aws-shim.svc
    - aws-shim.open-infra-aws-shim.svc.cluster.local
    # Virtual-hosted S3 against AWS_ENDPOINT_URL: a default SDK client asks for <bucket>.<this name>
    # (a VM guest's resolver answers it, guest-aws-endpoints.yaml; S3_INTERNAL_VHOST_SUFFIXES).
    - "*.aws-shim.open-infra-aws-shim.svc"
    - "*.aws-shim.open-infra-aws-shim.svc.cluster.local"
  usages: [server auth, digital signature]
  duration: 2160h    # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: openinfra-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
# The cluster-scoped grants: ask the API server authorization questions (SubjectAccessReview), and read
# namespaces (their account labels).
# This is exactly the console's authz-check grant — it decides nothing itself, it only asks, so the
# real authority stays the RBAC compiled from kind: Policy/Role/Group, bounded by the boundary.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-infra-aws-shim-authz
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  # sts:AssumeRoleWithWebIdentity (#111): verify a workload's projected SA token via a TokenReview
  # (audience-pinned). Like the SAR above, a TokenReview only ASKS the API server a question and
  # grants nothing. Without this, workload-identity assume fails closed at token verification.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  # Accounts (kind: Account): a namespace's account is its openinfra.dev/account-id label, so the shim reads
  # namespaces — their names and labels, nothing in them — to resolve the caller's account and its home,
  # and Organizations CreateAccount checks a new account's home namespace is free.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-infra-aws-shim-authz
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: open-infra-aws-shim-authz }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# Stage-2 AppSync management: the shim read-modify-writes GraphQLApi claims to apply
# CreateResolver/CreateDataSource/etc. It is cluster-wide because an apiId can name any team namespace;
# the CALLER's permission is still enforced per-request by the impersonated SubjectAccessReview
# ("update graphqlapis" in the target namespace), so this SA capability is only ever exercised on behalf
# of a caller who already passed that gate — the same trust model as the shim's Secret/User reads. The
# management reads (GetGraphqlApi …) check "get graphqlapis" there; ListGraphqlApis lists a page at a time
# and keeps only the APIs in namespaces where the caller may "list graphqlapis".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-infra-aws-shim-graphqlapis
rules:
  - apiGroups: [openinfra.dev]
    resources: [graphqlapis]
    verbs: [get, list, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-infra-aws-shim-graphqlapis
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: open-infra-aws-shim-graphqlapis }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# Read the IAM objects across the cluster for the fine-grained data-plane authorization engine and
# STS role resolution (#111): kind: Policy (dataPlane blocks), and kind: Role/User/Group so the
# engine can resolve a principal's attached spec.policies (dual-plane attachment) and sts:AssumeRole
# can read a Role's spec.trust. Read-only, get/list/watch only — the shim never mutates any of these,
# and it holds no Secret/RBAC grants beyond these. NOTE: the loader fails CLOSED on a list error, so
# a missing grant here denies all governed traffic rather than silently loosening.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-infra-aws-shim-policies
rules:
  - apiGroups: [iam.openinfra.dev]
    resources: [policies, roles, users, groups]
    verbs: [get, list, watch]
  # VM workload credentials: read the per-VM ServiceAccount's openinfra.dev/instance-role annotation
  # after verifying its token (read-only, cluster-wide — the SAs live in the VMs' own namespaces).
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get]
  # ...and confirm the token belongs to that VM's own launcher pod: the VMI must list the token's pod
  # as active and mount the ServiceAccount (any pod running as the SA would otherwise do).
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [get]
  # EC2 RebootInstances: restart a VM in place through KubeVirt's restart subresource. Only once the caller
  # has proven it may change the instance (ec2:RebootInstances on it, and the reboot recorded on its claim
  # with the CALLER's own authority); stopping, starting and terminating change the claim as the caller.
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachines/restart]
    verbs: [update]
  # S3 DeleteBucket and CloudFormation teardown: find the kind: Bucket a bucket is (its composite
  # reports the bucket in status.bucket). Read-only; the claim itself is deleted with the CALLER's
  # authority, never the shim's.
  - apiGroups: [openinfra.dev]
    resources: [xbuckets]
    verbs: [get, list]
  # A VM's EC2 instance id: SSM Run Command's agent channel reads the claim of the VM whose token it
  # verified (its status.instanceId), and the composite of one rendered before it carried that (the id is
  # derived from the composite's uid, ec2_ids.go). Read-only, one object by name.
  - apiGroups: [openinfra.dev]
    resources: [virtualmachines, xvirtualmachines]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-infra-aws-shim-policies
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: open-infra-aws-shim-policies }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# Access-key lookup: read Secrets ONLY in the shim's own namespace (the iam-ak-<id> store). The
# shim never gets secret access in the console namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-keys
  namespace: open-infra-aws-shim
rules:
  # get: authenticate access keys (the SigV4 path). create/update/list/delete: the IAM CreateAccessKey/
  # ListAccessKeys/DeleteAccessKey/UpdateAccessKey doorway writes the iam-ak-* Secrets
  # here via the shared awskeys.Store — the same store the console BFF uses. The CloudFormation doorway
  # keeps its stack, change-set and drift records and their NoEcho values here too (cfn-stack-*,
  # cfn-changeset-*, cfn-drift-*, noecho-*): a record holds what a NoEcho parameter fed into the stack's
  # resources, so it is a Secret that only the shim and cluster admins can read. Scoped to this namespace
  # only; the shim still has NO secret access in the console namespace.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-keys
  namespace: open-infra-aws-shim
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-keys }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# IdentityProvider registry (#136 §2): read the spec-mirror ConfigMaps
# (openinfra.dev/identity-provider) the IdentityProvider composition renders into this namespace, to
# build the external-OIDC web-identity verifier registry. ConfigMaps only, this namespace only,
# read-only — the issuer URLs + audiences are public verification parameters, not secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-idp
  namespace: open-infra-aws-shim
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-idp
  namespace: open-infra-aws-shim
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-idp }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# Console access-key management: the console BFF's "Security credentials" surface mints, lists,
# deactivates and deletes a User's access keys, so the console SA needs full Secret access in the
# shim's KEYS namespace — scoped to THIS namespace only (which holds nothing but iam-ak-<id> key
# Secrets). `list` is the reason this Role must exist: the cluster-wide console ClusterRole grants
# get/create/update/patch/delete on secrets but deliberately withholds list/watch, and listing a
# user's keys by owner label needs it. Granted only when the aws-shim overlay is deployed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: open-infra-console-keys
  namespace: open-infra-aws-shim
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-infra-console-keys
  namespace: open-infra-aws-shim
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: open-infra-console-keys }
subjects:
  - kind: ServiceAccount
    name: console
    namespace: open-infra-console
---
# (The DynamoDB declarative table-sync reads its spec-mirror ConfigMaps from the shim's OWN
# namespace now — see TABLE_CONFIG_NAMESPACE above and the aws-shim-idp Role, which already grants
# configmaps there. No cross-namespace Role into open-infra-console: the control-plane authorizer
# fences the shim out of that IAM/console namespace by design, and the DynamoDB service owning its
# own table registry is the AWS-shaped arrangement.)
---
# CloudFormation doorway: the way AWS does it — a stack op provisions under the CALLER's
# own authority, never the shim's. The shim's cfn front door drives the owned cfn engine through an Applier
# that IMPERSONATES the caller for every resource op, so the API server's RBAC + Cedar admission bound the
# whole stack to exactly what the caller may do. This is the SAME bounded impersonation the console uses on
# /api/k8s: impersonate-GROUPS is pinned by resourceNames to the four openinfra groups (the holder can never
# impersonate system:masters). Every identity the shim acts as is openinfra:<user>, so impersonate-USERS is
# held to that prefix too: RBAC cannot express a name prefix, so the annotation below narrows the Cedar
# corpus (the authoritative authorizer; rbac-to-cedar reads it). Without it a stolen shim token could act
# as a control-plane user such as system:kube-controller-manager, which can mint any ServiceAccount's token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-infra-aws-shim-impersonator
  annotations:
    # openinfra:* covers both identity forms: openinfra:<user> (legacy) and openinfra:<account>:<user>
    # (once IAM policy is the authority).
    openinfra.dev/impersonate-users: "openinfra:*"
    # The shim never acts as the break-glass root (root has no access keys): a shim that impersonated
    # either root identity could only be a principal borrowing root's name.
    openinfra.dev/impersonate-users-deny: "openinfra:root,openinfra:000000000000:root"
rules:
  - apiGroups: [""]
    resources: [groups]
    verbs: [impersonate]
    resourceNames: [openinfra:admins, openinfra:powerusers, openinfra:readers, openinfra:users]
  - apiGroups: [""]
    resources: [users]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-infra-aws-shim-impersonator
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: open-infra-aws-shim-impersonator }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# The CloudFormation stack namespace: kind resources a stack provisions land here (created UNDER the
# caller's impersonated authority). The doorway's own bookkeeping — stack, change-set and drift records —
# is kept as Secrets in the shim's namespace (aws-shim-keys above), not here: readers and power users can
# read ConfigMaps in every namespace. An earlier doorway kept them here as ConfigMaps
# (cfn-stack-*/cfn-changeset-*/cfn-drift-*); the shim moves any it finds, which is all it may still do
# with ConfigMaps here (get, list, delete).
apiVersion: v1
kind: Namespace
metadata:
  name: open-infra-cfn
  labels:
    # the management account (kind: Account 000000000000): GitOps owns this namespace, so its account
    # labels live here, not in the Account composition (two appliers would undo each other's labels)
    openinfra.dev/account-id: "000000000000"
    openinfra.dev/account-status: ACTIVE
    openinfra.dev/component: aws-shim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-cfn-records
  namespace: open-infra-cfn
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-cfn-records
  namespace: open-infra-cfn
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-cfn-records }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# The S3 bucket namespace: a bucket made through S3 CreateBucket is a kind: Bucket claim here, created
# UNDER the caller's impersonated authority (RBAC decides who may), and set up, encrypted, reaped and
# deleted exactly like a stack's bucket. The shim itself needs nothing here: it reads the claim with the
# caller's authority and finds bucket claims through their composites (xbuckets, above).
apiVersion: v1
kind: Namespace
metadata:
  name: open-infra-s3
  labels:
    # the management account (kind: Account 000000000000): GitOps owns this namespace, so its account
    # labels live here, not in the Account composition (two appliers would undo each other's labels)
    openinfra.dev/account-id: "000000000000"
    openinfra.dev/account-status: ACTIVE
    openinfra.dev/component: aws-shim
---
# A stack's Elastic IP allocations (cfn_addresses.go): each is a holder LoadBalancer Service the shim
# creates in the stack namespace (named by its AllocationId, labelled openinfra.dev/eip-holder) after
# checking the caller may allocate it; release refuses while a VM's LAN Service shares its address (list).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-cfn-addresses
  namespace: open-infra-cfn
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-cfn-addresses
  namespace: open-infra-cfn
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-cfn-addresses }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# Finding a function by name: a Lambda Invoke, an SNS/EventBridge/API Gateway delivery or a stack's
# function name check looks for the kind: Function in the Lambda API's namespace (FUNCTIONS_NAMESPACE)
# and the stack namespace (CFN_NAMESPACE), so a function a stack creates is invoked by the name its stack
# reports. Read one claim by name — get only, bound in just those two namespaces; the caller's right to
# invoke is still checked where the function is found. Without it every invoke looks in
# FUNCTIONS_NAMESPACE only. list serves Lambda ListFunctions, a page at a time, over the same two
# namespaces (the caller's own list right is checked in each).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-infra-aws-shim-functions
rules:
  - apiGroups: [openinfra.dev]
    resources: [functions]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-functions
  namespace: default
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: open-infra-aws-shim-functions }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-functions
  namespace: open-infra-cfn
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: open-infra-aws-shim-functions }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# ACM (acm.go): a stack's certificate is its distribution's site TLS, issued by cert-manager as the
# Certificate staticsite-<site>-tls in the stack namespace. DescribeCertificate reads that Certificate's
# status, and GetCertificate the issued certificate and chain from its CertificateRequest's status — read
# only, and never the site's TLS Secret (the private key): no Secret grant here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-acm-certificates
  namespace: open-infra-cfn
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-acm-certificates
  namespace: open-infra-cfn
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-acm-certificates }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# Athena doorway: Trino runs scale-to-zero (console trino-autostop). The doorway scales
# Trino up on StartQueryExecution and stamps the athena.openinfra.dev/last-query annotation the autostop
# honors — so it needs get/list/patch on the ONE trino Deployment in the lakehouse namespace, nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-trino-scaler
  namespace: lakehouse
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
    resourceNames: [trino]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list] # list needs no resourceName
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-trino-scaler
  namespace: lakehouse
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-trino-scaler }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# ECS doorway: an ECS service + its task definition collate into a kind: Application
# provisioned under the CALLER's impersonated authority (the #175 seam), but the doorway's own bookkeeping —
# task-definition, cluster, and service-pointer ConfigMaps (ecs-taskdef-*/ecs-cluster-*/ecs-service-*) — is
# written with the SHIM's ServiceAccount, so the shim SA needs configmap access in the ECS namespace, and
# ONLY here. Dedicated namespace, exactly like open-infra-cfn.
apiVersion: v1
kind: Namespace
metadata:
  name: open-infra-ecs
  labels:
    # the management account (kind: Account 000000000000): GitOps owns this namespace, so its account
    # labels live here, not in the Account composition (two appliers would undo each other's labels)
    openinfra.dev/account-id: "000000000000"
    openinfra.dev/account-status: ACTIVE
    openinfra.dev/component: aws-shim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-ecs-records
  namespace: open-infra-ecs
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-ecs-records
  namespace: open-infra-ecs
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-ecs-records }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# Step Functions doorway: the shim CREATES/reads/deletes kind: StateMachine (the ASL
# claim) and kind: Execution (one run) here on an authorized caller's behalf — the caller is gated by the
# impersonated SAR in the handler, then the shim executes as itself (the same pattern IAM/RDS use). The
# per-execution STS creds Secret is written via the existing aws-shim-keys Role (secrets in this namespace).
# Scoped to THIS namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-statemachines
  namespace: open-infra-aws-shim
rules:
  - apiGroups: [openinfra.dev]
    resources: [statemachines]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [openinfra.dev]
    resources: [executions]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [openinfra.dev]
    resources: [executions/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-statemachines
  namespace: open-infra-aws-shim
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-statemachines }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# Execution-role authority: the statemachine controller reads the per-execution STS creds
# Secret the shim writes here, and injects it into the execution's Tasks so a Task runs under the state
# machine's role (not the controller's ambient authority — the #168 confused-deputy fix). This grant lives
# in the shim overlay (not the core controller manifest) because ONLY shim-created executions carry a
# credentialsSecret; a plain kubectl-created Execution has none and the controller never reads a Secret.
# Scoped to get secrets in THIS namespace only — the least privilege for cross-namespace creds hand-off.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openinfra-statemachine-creds
  namespace: open-infra-aws-shim
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openinfra-statemachine-creds
  namespace: open-infra-aws-shim
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: openinfra-statemachine-creds }
subjects:
  - kind: ServiceAccount
    name: openinfra-statemachine
    namespace: crossplane-system
---
# The credentials fields of an Execution are the shim's alone: only the shim names a credentials Secret
# (at StartExecution, after the caller passed the role's trust check), and no one changes it afterwards.
# The controller also hands an execution only the Secret that execution owns (statemachine/k8s.go), so
# a hand-made Execution naming another's Secret gets nothing; this refuses it at the door.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-execution-credentials
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [openinfra.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [executions]
  variables:
    - name: secret
      expression: "has(object.spec) && has(object.spec.credentialsSecret) ? object.spec.credentialsSecret : ''"
    - name: credNS
      expression: "has(object.spec) && has(object.spec.credentialsNamespace) ? object.spec.credentialsNamespace : ''"
    - name: oldSecret
      expression: "request.operation == 'UPDATE' && has(oldObject.spec) && has(oldObject.spec.credentialsSecret) ? oldObject.spec.credentialsSecret : ''"
    - name: oldCredNS
      expression: "request.operation == 'UPDATE' && has(oldObject.spec) && has(oldObject.spec.credentialsNamespace) ? oldObject.spec.credentialsNamespace : ''"
  validations:
    - expression: >-
        request.operation == 'CREATE'
        ? (variables.secret == '' && variables.credNS == '') ||
          request.userInfo.username == 'system:serviceaccount:open-infra-aws-shim:aws-shim'
        : variables.secret == variables.oldSecret && variables.credNS == variables.oldCredNS
      reason: Forbidden
      messageExpression: >-
        request.operation == 'CREATE'
        ? 'spec.credentialsSecret and spec.credentialsNamespace are set by the aws-shim at StartExecution, not by ' + request.userInfo.username
        : 'spec.credentialsSecret and spec.credentialsNamespace cannot change after the Execution is created'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-execution-credentials
spec:
  policyName: openinfra-execution-credentials
  # Deny, with an audit annotation (after a Warn + Audit canary: only the shim names these fields).
  validationActions: [Deny, Audit]
---
# Owner resolution: read kind: User (NEVER Secrets) in the console namespace, to map an access
# key's owner to its current groups. get+list only; nothing mutating.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-users
  namespace: open-infra-console
rules:
  # IAM management doorway: the shim CREATES/updates/deletes kind: Role/Policy/User
  # here on an authorized caller's behalf (the caller is gated by the impersonated SAR in the handler; the
  # shim then executes as itself, the same pattern RDS uses to provision CNPG clusters). Cluster-wide GET/
  # LIST for the dataPlane loader stays on the open-infra-aws-shim-policies ClusterRole above.
  - apiGroups: [iam.openinfra.dev]
    resources: [users, roles, policies]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-users
  namespace: open-infra-console
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-users }
subjects:
  - kind: ServiceAccount
    name: aws-shim
    namespace: open-infra-aws-shim
---
# --- MinIO scoped identity (declarative mint; same pattern as console-minio-user / query-runtime) ---
# A one-shot Argo Sync hook mints a NON-root MinIO user `openinfra-aws-shim` (canned `readwrite`:
# full S3 CRUD on buckets, NO admin API) and writes its creds into the shim's namespace as
# `aws-shim-minio`. v1 uses this single scoped identity to MinIO; per-principal MinIO users +
# per-bucket policies are the flagged graduation step. The Job runs in the minio namespace (it
# needs the root secret to provision) and writes the creds Secret cross-namespace into
# open-infra-aws-shim via the RoleBinding below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-shim-iam-setup
  namespace: minio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-iam-setup
  namespace: minio
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get] # read the MinIO root secret to provision
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-iam-setup
  namespace: minio
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-iam-setup }
subjects:
  - kind: ServiceAccount
    name: aws-shim-iam-setup
    namespace: minio
---
# Cross-namespace: let the (minio-ns) setup SA write ONLY the aws-shim-minio creds Secret into the
# shim's namespace. Bound by resourceNames to that one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-shim-minio-creds-writer
  namespace: open-infra-aws-shim
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
    resourceNames: [aws-shim-minio]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create] # create needs no resourceName (the object doesn't exist yet)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-shim-minio-creds-writer
  namespace: open-infra-aws-shim
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aws-shim-minio-creds-writer }
subjects:
  - kind: ServiceAccount
    name: aws-shim-iam-setup
    namespace: minio
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aws-shim-iam-setup
  namespace: minio
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 30
  template:
    spec:
      serviceAccountName: aws-shim-iam-setup
      restartPolicy: OnFailure
      volumes:
        - { name: mc, emptyDir: {} }
      initContainers:
        # Bring `mc` in OFFLINE (copied from the image) so a hung download never blocks sync.
        - name: fetch-mc
          image: ghcr.io/harn3ss/open-infra-mc@sha256:a689825d5299d02e6f35973e726a6e49a77469cde644dd52d60586b07bd85744
          command: [sh, -c, "cp /usr/bin/mc /mc/mc && chmod +x /mc/mc"]
          volumeMounts: [{ name: mc, mountPath: /mc }]
      containers:
        - name: setup
          image: alpine/k8s:1.30.0 # kubectl (native); mc from the shared volume
          command: [/bin/sh, -c]
          volumeMounts: [{ name: mc, mountPath: /mc }]
          env:
            - { name: ROOT_USER, valueFrom: { secretKeyRef: { name: minio, key: rootUser } } }
            - { name: ROOT_PASS, valueFrom: { secretKeyRef: { name: minio, key: rootPassword } } }
            - { name: MINIO_URL, value: "http://minio.minio.svc.cluster.local:9000" }
            - { name: DEST_NS, value: "open-infra-aws-shim" }
          args:
            - |
              set -eu
              [ -n "$ROOT_USER" ] && [ -n "$ROOT_PASS" ] || { echo "waiting for MinIO secret…"; exit 1; }
              MC=/mc/mc
              "$MC" alias set m "$MINIO_URL" "$ROOT_USER" "$ROOT_PASS" >/dev/null
              echo "minting scoped aws-shim identity (readwrite: full S3, no admin API)…"

              AK="openinfra-aws-shim"
              # Reuse the existing secret key across reruns for stable creds; else generate.
              SK=$(kubectl get secret aws-shim-minio -n "$DEST_NS" -o jsonpath='{.data.secretKey}' 2>/dev/null | base64 -d || true)
              [ -n "$SK" ] || SK=$(head -c 48 /dev/urandom | md5sum | cut -c1-32)
              "$MC" admin user add m "$AK" "$SK" >/dev/null 2>&1 || "$MC" admin user add m "$AK" "$SK" >/dev/null
              "$MC" admin policy attach m readwrite --user "$AK" >/dev/null 2>&1 || true

              kubectl create secret generic aws-shim-minio -n "$DEST_NS" \
                --from-literal=accessKey="$AK" --from-literal=secretKey="$SK" \
                --dry-run=client -o yaml | kubectl apply -f - >/dev/null
              echo "aws-shim MinIO identity ready ($AK: readwrite, no admin)"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-shim
  namespace: open-infra-aws-shim
  labels: { app: aws-shim }
spec:
  replicas: 1
  selector:
    matchLabels: { app: aws-shim }
  template:
    metadata:
      labels: { app: aws-shim }
    spec:
      serviceAccountName: aws-shim
      # On SIGTERM the shim stops accepting new CloudFormation stack operations (503, which SDKs retry),
      # drains HTTP (<=15s), then gives in-flight stack operations up to 40s to finish. One still running
      # at exit is NOT lost: its lease on the stack record lapses and the next front door fails it and
      # rolls it back (deletes resume) — so this window only saves rollbacks, it is not what prevents a
      # stranded stack.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: aws-shim
          image: ghcr.io/harn3ss/open-infra-aws-shim:latest
          imagePullPolicy: Always
          ports:
            - name: s3
              containerPort: 4566
            - name: https-internal
              containerPort: 4567
            - name: https-aws
              containerPort: 8443
          env:
            - { name: LISTEN_ADDR, value: ":4566" }
            # EC2 instance metadata (IMDS): serve rotating role credentials (/v1/vm-credentials) to the
            # in-guest metadata agent of a kind: VirtualMachine with spec.instanceRole, identified by its
            # per-VM ServiceAccount token (never the source IP). Inert for a VM that declares no
            # instanceRole (and for every non-VM caller — it resolves to no role). Served on the TLS port
            # below only: on plaintext :4566 the path answers 404 (VM_CREDS_ALLOW_PLAINTEXT=true undoes
            # that, for a guest whose agent predates the TLS port).
            - { name: IMDS_ENABLED, value: "true" }
            # The in-cluster TLS port (the aws-shim-internal-tls Certificate above, re-read on renewal).
            - { name: INTERNAL_TLS_LISTEN_ADDR, value: ":4567" }
            - { name: INTERNAL_TLS_CERT_FILE, value: /tls-internal/tls.crt }
            - { name: INTERNAL_TLS_KEY_FILE, value: /tls-internal/tls.key }
            # AWS's own hostnames (guest-aws-endpoints.yaml): a VM guest's resolver answers the amazonaws.com
            # names of the services served here with this Service; port 443 lands on this listener, which
            # serves aws-shim-aws-endpoints-tls (the guest-only openinfra-aws-endpoints CA), re-read on
            # renewal. Absent Secret (networking.guestAwsEndpoints: false): handshakes fail, nothing else.
            - { name: TLS_LISTEN_ADDR, value: ":8443" }
            - { name: TLS_CERT_FILE, value: /tls-aws/tls.crt }
            - { name: TLS_KEY_FILE, value: /tls-aws/tls.key }
            # The shim's own names, virtual-hosted: a default AWS SDK client (no forcePathStyle — the
            # JavaScript SDK v3's default) pointed at AWS_ENDPOINT_URL addresses <bucket>.<this name>.
            - { name: S3_INTERNAL_VHOST_SUFFIXES, value: "aws-shim.open-infra-aws-shim.svc.cluster.local,aws-shim.open-infra-aws-shim.svc" }
            # The platform root CA certificate served at /v1/ca-bundle (public; VM guests trust it at
            # boot): ca.crt of this Secret in the shim's namespace (the openinfra-ca-bundle Certificate
            # above). "" turns the endpoint off.
            - { name: CA_BUNDLE_SECRET, value: "openinfra-ca-bundle" }
            # Go's GC does NOT read the cgroup limit, so under the default GOGC it can grow the heap to
            # ~2x the live set and OOMKill under memory.limits — taking the SHARED front door down for
            # every tenant. GOMEMLIMIT (a soft ceiling ~90% of the limit) makes the GC keep peak heap
            # bounded, trading CPU for not-dying. Same pattern as the audit-offsite sidecar (#294).
            - { name: GOMEMLIMIT, value: "448MiB" }
            # Distributed tracing (#67): export spans to Tempo's OTLP receiver (http:// = insecure gRPC).
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.monitoring.svc.cluster.local:4317" }
            - { name: MINIO_ENDPOINT, value: "minio.minio.svc.cluster.local:9000" }
            - { name: MINIO_ACCESS_KEY, valueFrom: { secretKeyRef: { name: aws-shim-minio, key: accessKey } } }
            - { name: MINIO_SECRET_KEY, valueFrom: { secretKeyRef: { name: aws-shim-minio, key: secretKey } } }
            - { name: KEYS_NAMESPACE, value: "open-infra-aws-shim" }
            - { name: USERS_NAMESPACE, value: "open-infra-console" }
            # Coarse v1 S3 authorization gate is evaluated on applications in this namespace.
            - { name: AUTHZ_NAMESPACE, value: "default" }
            # Lambda (Invoke over kind: Function / Knative): the namespace Functions live in.
            - { name: FUNCTIONS_NAMESPACE, value: "default" }
            # The install's AWS identity (aws-identity.yaml): the account and region every ARN, queue URL
            # and StackId is built in, and the CloudFormation pseudo-parameters resolve to.
            - { name: ACCOUNT_ID, valueFrom: { configMapKeyRef: { name: openinfra-aws-identity, key: ACCOUNT_ID } } }
            - { name: AWS_REGION, valueFrom: { configMapKeyRef: { name: openinfra-aws-identity, key: AWS_REGION } } }
            # SES (SendEmail / SendRawEmail): the platform SMTP relay (the mail component, mail/relay.yaml or
            # mail/relay-capture.yaml). The shim serves SES only while this name resolves, so with the mail
            # component off SES stays not-fronted; turning it on needs no shim change.
            - { name: SES_SMTP_RELAY, value: "smtp-relay.mail.svc.cluster.local:587" }
            # The DNS suffix instances' public DNS names are built on (ec2-a-b-c-d.<suffix>, GetAtt
            # PublicDnsName): a site value (config.yaml awsShim.publicDnsSuffix, applied by install.sh),
            # never in the repo. Absent: instances have no public DNS name, as in a VPC without DNS hostnames.
            - { name: PUBLIC_DNS_SUFFIX, valueFrom: { configMapKeyRef: { name: openinfra-public-dns, key: PUBLIC_DNS_SUFFIX, optional: true } } }
            # DynamoDB data layer: FerretDB (Mongo wire) for the data path + the DocumentDB Postgres
            # behind it for atomic Transact* — both provisioned by dynamodb-backend.yaml (the
            # dynamo-mongo-app Secret). Without these the dynamodb front door answers an honest 501.
            - { name: MONGO_URI, valueFrom: { secretKeyRef: { name: dynamo-mongo-app, key: MONGODB_URI } } }
            - { name: MONGO_PG_URI, valueFrom: { secretKeyRef: { name: dynamo-mongo-app, key: POSTGRESQL_URL } } }
            # Declarative table-sync (kind: Table): the Table composition writes its spec-mirror
            # ConfigMaps into THIS namespace (the shim's own — the DynamoDB service's domain), which
            # the shim already reads (aws-shim-idp Role). Deliberately NOT open-infra-console: the
            # control-plane authorizer fences the shim out of that IAM/console namespace.
            - { name: TABLE_CONFIG_NAMESPACE, value: "open-infra-aws-shim" }
            # DynamoDB RestoreTableToPointInTime: the image the async restore Job runs
            # (the shim's own image, so the Job carries exactly this code). The Job bootstraps a recovery
            # CNPG cluster to the target time + copies the source table — see dynamo-restore-rbac.yaml for
            # its dedicated SA (aws-shim-restore). Keep in lockstep with the container image above.
            - { name: AWS_SHIM_IMAGE, value: "ghcr.io/harn3ss/open-infra-aws-shim:latest" }
            # Step Functions: the namespace kind: StateMachine / Execution and per-execution
            # STS creds Secrets live in (defaults to this namespace). A Task's function:<name> resolves in
            # this namespace, so a Function used as a Task target must live here too.
            - { name: STEPFUNCTIONS_NAMESPACE, value: "open-infra-aws-shim" }
            # CloudFormation: the namespace stacks provision into + the doorway's own
            # stack-record/change-set/drift ConfigMaps live in. Resources are created under the CALLER's
            # impersonated authority; the bookkeeping ConfigMaps are shim-written (RBAC: aws-shim-cfn-records).
            - { name: CFN_NAMESPACE, value: "open-infra-cfn" }
            - { name: ECS_NAMESPACE, value: "open-infra-ecs" }
            # S3 CreateBucket: a bucket made through the S3 API is a kind: Bucket claim here (account-wide, as
            # AWS buckets belong to the account), created under the CALLER's impersonated authority.
            - { name: S3_BUCKET_NAMESPACE, value: "open-infra-s3" }
            # ECR: the doorway fronts the in-cluster distribution registry (MinIO-backed,
            # platform/aws-shim/ecr-registry.yaml). GetAuthorizationToken hands back the credential in
            # ecr-registry-auth (RBAC: aws-shim-ecr-auth-reader); per-repo records are ConfigMaps in
            # ECR_NAMESPACE (RBAC: aws-shim-ecr-records). proxyEndpoint is the in-cluster svc for v1;
            # LAN exposure for external docker clients is the flagged graduation step.
            - { name: ECR_NAMESPACE, value: "open-infra-ecr" }
            - { name: ECR_REGISTRY_URL, value: "http://ecr-registry.open-infra-ecr.svc.cluster.local:5000" }
            - { name: ECR_PROXY_ENDPOINT, value: "http://ecr-registry.open-infra-ecr.svc.cluster.local:5000" }
            - { name: ECR_AUTH_SECRET, value: "ecr-registry-auth" }
            # Per-repo data-plane auth: GetAuthorizationToken returns a caller credential and the
            # registry (token auth) authorizes each push/pull via the shim's /ecr/token endpoint
            # against that caller. Set together with the registry's auth:token config (ecr-registry.yaml).
            - { name: ECR_TOKEN_AUTH, value: "true" }
            # Glue: the Data Catalog doorway fronts the platform's existing Iceberg REST
            # catalog (lakehouse ns) — Glue databases ← Iceberg namespaces, Glue tables ← Iceberg tables.
            # Read + database-lifecycle only; in-cluster, no auth. (Athena, over Trino, is the next slice.)
            - { name: GLUE_CATALOG_URL, value: "http://iceberg-rest.lakehouse.svc.cluster.local:8181" }
            # Athena: executes SQL against Trino (lakehouse ns) over /v1/statement. Trino is
            # scale-to-zero (trino-autostop); the doorway scales it up on query + stamps an activity annotation
            # the autostop honors (RBAC aws-shim-trino-scaler below). Results via GetQueryResults; SQL passed
            # to Trino verbatim (no dialect rewrite). Default result location echoed, not yet written to S3.
            - { name: ATHENA_TRINO_URL, value: "http://trino.lakehouse.svc.cluster.local:8080" }
            - { name: ATHENA_TRINO_NAMESPACE, value: "lakehouse" }
            - { name: ATHENA_TRINO_DEPLOYMENT, value: "trino" }
            - { name: ATHENA_CATALOG, value: "iceberg" }
            - { name: ATHENA_DEFAULT_OUTPUT, value: "s3://lakehouse/athena-results/" }
            # EKS: the least-additive doorway — open-infra IS the cluster. DescribeCluster
            # returns its real endpoint/CA/version so `aws eks update-kubeconfig` works; cluster CRUD / node
            # groups / Fargate / addons refused. Endpoint defaults to the in-cluster API host (no site
            # hostname in this public repo); set EKS_CLUSTER_ENDPOINT out-of-band for external reachability.
            - { name: EKS_CLUSTER_NAME, value: "open-infra" }
            # SQS front door: queues + messages live in a dedicated CNPG Postgres
            # (aws-shim-sqs), chosen for faithful visibility-timeout + receipt-handle (stale-rejection)
            # semantics. The connection URI comes from the CNPG-generated app secret; sslmode=disable is
            # the in-cluster non-TLS path CNPG's default pg_hba allows. Unset -> SQS answers an honest 501.
            - { name: SQS_PG_URI, valueFrom: { secretKeyRef: { name: aws-shim-sqs-app, key: uri } } }
            - { name: PGSSLMODE, value: "disable" }
            # sts:AssumeRole session-token sealing key — Vault-custodied (#111 §1). The shim logs into
            # Vault with its OWN SA token (k8s-auth role aws-shim-sts, provisioned by
            # platform/security/vault.yaml) and reads the 32-byte AES key from sts/signing-key — no raw
            # key in a cluster Secret. It re-fetches every STS_KEY_REFRESH (default 10m) and keeps the
            # previous key for one overlap window, so a key rotation doesn't cut live sessions.
            # STS stays DISABLED (fail-closed, identity surface unchanged) until an operator provisions
            # that key AND the encryption (Vault) component is on — a missing/unreachable Vault just logs
            # a warning at startup and leaves AssumeRole off. STS_SIGNING_KEY (base64 AES-256, e.g. via a
            # Secret) remains an explicit dev/override fallback when Vault is not in play.
            - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
            - { name: STS_VAULT_ROLE, value: "aws-shim-sts" }
            # KMS front door: a CMK is a Vault Transit key named kms-<keyId>; the shim
            # reaches Transit with its OWN SA token (k8s-auth role aws-shim-kms, policy scoped to kms-*
            # keys only — provisioned by platform/security/vault.yaml). CMK metadata (lifecycle state,
            # aliases) shares the SQS Postgres. VAULT_ADDR unset -> KMS answers an honest 501.
            - { name: KMS_VAULT_ROLE, value: "aws-shim-kms" }
            # RDS front door: customer PostgreSQL instances are CloudNativePG Clusters in
            # this dedicated namespace (never shared with the shim's own SQS Postgres). The shim's SA has
            # scoped CNPG-management RBAC there (platform/aws-shim/rds-provisioning.yaml).
            - { name: RDS_NAMESPACE, value: "open-infra-rds" }
            # AppSync (GraphQL) → the open-appsync engine (components.openAppsync). Our own engine, so
            # no admin secret: the shim conveys the verified principal and open-appsync enforces authz
            # internally. Absent (component disabled) → the appsync service returns 502.
            - { name: GRAPHQL_ENDPOINT, value: "http://open-appsync.open-infra-open-appsync.svc.cluster.local:80" }
          # OPTIONAL OIDC/Cognito auth for the AppSync data plane (@aws_oidc / @aws_cognito_user_pools).
          # Off unless OIDC_ISSUER is set. Provide these via a ConfigMap named `aws-shim-oidc` in this
          # namespace (envFrom optional=true, so the shim runs fine without it): OIDC_ISSUER,
          # OIDC_AUDIENCE (required when issuer is set), OIDC_MODE (aws_oidc | aws_cognito_user_pools),
          # and optionally OIDC_GROUPS_CLAIM (explicit override always wins; else inferred from issuer).
          envFrom:
            - configMapRef: { name: aws-shim-oidc, optional: true }
            # Site values that name this installation's LAN addresses (kept out of git), in an optional
            # ConfigMap `aws-shim-site`: S3_VHOST_SUFFIXES (comma-separated S3 hosts that also accept
            # virtual-hosted-style <bucket>.<suffix> requests) and ECR_PUBLIC_ENDPOINT (the registry's TLS
            # LAN URL, returned as the proxyEndpoint and repositoryUri base). Unset = in-cluster only.
            - configMapRef: { name: aws-shim-site, optional: true }
            # How far IAM policy decides (IAM_AUTHZ legacy|shadow|enforce), set by the IAM cutover
            # (hack/iam-cutover.sh) in an optional ConfigMap `openinfra-iam` kept out of git — so ArgoCD's
            # self-heal never undoes a cutover step, and absent means legacy.
            - configMapRef: { name: openinfra-iam, optional: true }
          # Startup gate: the shim runs ~13 per-service ensureSchema calls against the DynamoDB/documentdb
          # backend before it serves, which on a cold or just-restored backend can exceed the liveness
          # budget — so liveness used to SIGTERM it mid-startup (crashloop). The startupProbe gives startup
          # up to ~5min to reach /healthz; liveness/readiness (short) only engage once it's serving.
          startupProbe:
            httpGet: { path: /healthz, port: 4566 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: 4566 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 4566 }
            initialDelaySeconds: 15
            periodSeconds: 20
          # On a rollout the gateway and kube-proxy still send new connections to a terminating pod for a
          # few seconds after it is told to stop. Keep serving that long before shutting down, so a
          # rollout drops no request (the shim then drains in-flight ones on SIGTERM).
          lifecycle:
            preStop:
              sleep: { seconds: 10 }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: internal-tls, mountPath: /tls-internal, readOnly: true }
            - { name: aws-endpoints-tls, mountPath: /tls-aws, readOnly: true }
            - { name: object-encryption, mountPath: /etc/openinfra/object-encryption, readOnly: true }
            - { name: certificates, mountPath: /etc/openinfra/certificates, readOnly: true }
          resources:
            # The shared AWS front door fronts ~25 services; 256Mi/64Mi was too small and scheduled it
            # as needing far less than it does. Raised to a realistic floor (GOMEMLIMIT above keeps the
            # heap under the 512Mi limit).
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        # optional: the shim starts before cert-manager has issued it; until then TLS handshakes fail
        # and VM agents retry. The kubelet fills the volume once the Secret exists.
        - name: internal-tls
          secret: { secretName: aws-shim-internal-tls, optional: true }
        # optional: issued by guest-aws-endpoints.yaml (off with networking.guestAwsEndpoints: false).
        - name: aws-endpoints-tls
          secret: { secretName: aws-shim-aws-endpoints-tls, optional: true }
        # optional: written by storage/minio-kms.yaml once MinIO encrypts new buckets by default; the
        # kubelet refreshes it, so the shim sees the switch without a restart (OBJECT_ENCRYPTION_FILE).
        - name: object-encryption
          configMap: { name: openinfra-object-encryption, optional: true }
        # optional: the domains the operator validated (certificates.validatedDomains), written by
        # install.sh; read live (CERT_VALIDATED_DOMAINS_FILE). Absent = none validated.
        - name: certificates
          configMap: { name: openinfra-certificates, optional: true }
---
# Object encryption switch (components.objectEncryption): the minio-kms-enable Job
# (storage/minio-kms.yaml) writes configmap/openinfra-object-encryption here once MinIO's key works. It
# may touch only that ConfigMap. Inert when the object-encryption component is off (no such SA).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minio-kms-enable
  namespace: open-infra-aws-shim
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [openinfra-object-encryption]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-kms-enable
  namespace: open-infra-aws-shim
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: minio-kms-enable }
subjects:
  - kind: ServiceAccount
    name: minio-kms-enable
    namespace: minio
---
apiVersion: v1
kind: Service
metadata:
  name: aws-shim
  namespace: open-infra-aws-shim
  labels: { app: aws-shim }
spec:
  type: ClusterIP
  selector: { app: aws-shim }
  ports:
    - name: s3
      port: 4566
      targetPort: 4566
    - name: https-internal
      port: 4567
      targetPort: 4567
    # AWS's own hostnames, as a VM guest's resolver answers them (guest-aws-endpoints.yaml).
    - name: https-aws
      port: 443
      targetPort: 8443
---
# Step Functions StartSyncExecution endpoint alias. The AWS SDK/CLI resolve StartSyncExecution to a
# SEPARATE, "sync-"prefixed host (AWS's sync-states.<region>.amazonaws.com), and apply that prefix even
# to an overridden endpoint — so a client pointed at aws-shim.<ns>.svc sends StartSyncExecution to
# sync-aws-shim.<ns>.svc. This Service makes that host resolve to the same shim pods (the shim routes by
# X-Amz-Target, not Host), so StartSyncExecution is reachable with the stock SDK. (#280 Express.)
apiVersion: v1
kind: Service
metadata:
  name: sync-aws-shim
  namespace: open-infra-aws-shim
  labels: { app: aws-shim }
spec:
  type: ClusterIP
  selector: { app: aws-shim }
  ports:
    - name: s3
      port: 4566
      targetPort: 4566
---
# Egress control — a CiliumNetworkPolicy, not a standard NetworkPolicy, DELIBERATELY.
#
# The shim reaches all its backends through ClusterIP Services (MinIO, the kube-apiserver, the
# Knative kourier gateway for Lambda, the open-appsync engine for AppSync). On this cluster Cilium runs
# with kube-proxy replacement and bpf-lb-sock=false, so a standard NetworkPolicy evaluates egress
# against the PRE-DNAT ClusterIP — which a namespaceSelector (backend pods) can't match, so
# ClusterIP egress is silently dropped as an i/o timeout (verified: Lambda→kourier failed under a
# standard netpol, succeeded with this policy). Cilium's `toEntities` understands cluster identity
# and resolves the ClusterIP→backend correctly. This is both correct AND a stronger posture: the
# shim may reach anything IN the cluster (+ the apiserver) but is denied egress to the outside world
# (verified: an external 1.1.1.1 request is blocked). Per-service micro-segmentation would need
# Cilium `toServices`; `toEntities: [cluster]` is the robust v1.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aws-shim-egress
  namespace: open-infra-aws-shim
spec:
  endpointSelector:
    matchLabels: { app: aws-shim }
  egress:
    # In-cluster services (MinIO / Knative / open-appsync) + the kube-apiserver. NOT the outside world.
    - toEntities: [cluster, kube-apiserver]
