# Sealed credentials for the DynamoDB-on-CNPG backend (dynamodb-backend.yaml), replacing the
# out-of-band secrets that landing left as a manual DR step. Encrypted with the in-cluster
# sealed-secrets controller's public key (platform/security/sealed-secrets.yaml) — only that
# controller can decrypt, so the ciphertext is safe in this public repo and GitOps now owns these.
# Produced with: kubeseal --cert <controller cert> --format yaml (strict scope: bound to this
# namespace + name). To rotate, re-seal new values and commit; back up the controller's private
# key out of band (it is the master key).
#
#   - dynamo-mongo-app : type kubernetes.io/basic-auth so CNPG's bootstrap.initdb.secret sets the
#                        app role's password from it on a FRESH/DR bootstrap (an Opaque secret is
#                        ignored by CNPG, which is why the first landing needed a post-bootstrap
#                        ALTER USER). Also carries MONGODB_URI (shim) + POSTGRESQL_URL (FerretDB).
#   - dynamo-wal-minio : MinIO root creds the barman-cloud WAL archiver uses (ObjectStore).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dynamo-mongo-app
  namespace: open-infra-aws-shim
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  encryptedData:
    MONGODB_URI: 
    POSTGRESQL_URL: 
    password: 
    username: 
  template:
    metadata:
      name: dynamo-mongo-app
      namespace: open-infra-aws-shim
    type: kubernetes.io/basic-auth
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dynamo-wal-minio
  namespace: open-infra-aws-shim
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  encryptedData:
    ak: 
    sk: 
  template:
    metadata:
      name: dynamo-wal-minio
      namespace: open-infra-aws-shim
    type: Opaque
