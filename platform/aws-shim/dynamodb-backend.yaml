# DynamoDB data layer for the aws-shim — now on CloudNativePG with continuous WAL archiving, so the
# DynamoDB front door supports continuous backups / point-in-time recovery (UpdateContinuousBackups /
# DescribeContinuousBackups / RestoreTableToPointInTime). The backend is FerretDB (Mongo wire) on a
# DocumentDB-extension Postgres; moving the Postgres from a bare Deployment to a CNPG cluster is what
# makes PITR possible (WAL archived to object storage, restore = bootstrap a new cluster to a target
# time). See memory dynamodb-pitr-cnpg for the proven recipe and the per-knob rationale.
#
# Credentials are provisioned out of band (this repo is public), referenced here by name:
#   - dynamo-mongo-app   : app user (username/password) + MONGODB_URI/POSTGRESQL_URL the shim reads
#                          (MONGO_URI / MONGO_PG_URI). CNPG bootstraps the `app` role from it.
#   - dynamo-wal-minio   : the object-store (MinIO) credentials the barman-cloud plugin archives with.
---
# DocumentDB-Postgres as a CNPG cluster. postgresUID/GID 999 (the image's postgres user; CNPG defaults
# to 26 and would fail initdb otherwise). documentdb libs preloaded + the extension created post-init.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dynamo-docdb
  namespace: open-infra-aws-shim
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  imageName: ghcr.io/ferretdb/postgres-documentdb:17-0.102.0-ferretdb-2.1.0
  postgresUID: 999
  postgresGID: 999
  postgresql:
    shared_preload_libraries:
      - pg_cron
      - pg_documentdb_core
      - pg_documentdb
    parameters:
      cron.database_name: postgres
  bootstrap:
    initdb:
      database: postgres
      owner: app
      # Set the app role's password from the shim's existing connection secret, so MONGO_PG_URI keeps
      # working unchanged (it points at the -rw service; see the secret's POSTGRESQL_URL).
      secret:
        name: dynamo-mongo-app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS documentdb CASCADE
        # FerretDB connects as `app` and must hold the documentdb admin role to create/write
        # collections — the stock postgres-documentdb image grants this in its entrypoint, which CNPG's
        # instance manager replaces, so grant it explicitly (else: "permission denied for schema
        # documentdb_api" on every write).
        - GRANT documentdb_admin_role TO app
  storage:
    size: 10Gi
    storageClass: local-path
  # Continuous WAL archiving via the barman-cloud plugin -> object store (PITR foundation).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: dynamo-docdb-store
---
# Where WAL + base backups go (MinIO). Retention 7 days of recovery window.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: dynamo-docdb-store
  namespace: open-infra-aws-shim
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://db-snapshots/dynamo-pitr/
    endpointURL: http://minio.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: dynamo-wal-minio
        key: ak
      secretAccessKey:
        name: dynamo-wal-minio
        key: sk
    wal:
      compression: gzip
    data:
      compression: gzip
---
# FerretDB proxy (stateless Mongo wire endpoint). Connects to the CNPG primary (-rw) via the shim secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-mongo
  namespace: open-infra-aws-shim
  labels: { app.kubernetes.io/name: dynamo-mongo }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: dynamo-mongo } }
  template:
    metadata: { labels: { app.kubernetes.io/name: dynamo-mongo } }
    spec:
      containers:
        - name: ferretdb
          image: ghcr.io/ferretdb/ferretdb:2
          env:
            - name: FERRETDB_POSTGRESQL_URL
              valueFrom: { secretKeyRef: { name: dynamo-mongo-app, key: POSTGRESQL_URL } }
          ports: [ { containerPort: 27017 } ]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe: { tcpSocket: { port: 27017 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-mongo
  namespace: open-infra-aws-shim
spec:
  selector: { app.kubernetes.io/name: dynamo-mongo }
  ports: [ { port: 27017, targetPort: 27017 } ]
