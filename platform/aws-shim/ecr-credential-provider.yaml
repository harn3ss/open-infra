# The kubelet's ECR credential provider, on each node: an application's image is pulled with its task
# execution role, as ECS pulls a task's image with the task definition's ExecutionRoleArn.
#
# The kubelet runs ecr-credential-provider (console-api/cmd/ecr-credential-provider) for each image it pulls
# from the platform's registry, with a token bound to the pod the image is for (the kubelet's service-account
# token for image pulls, audience openinfra-ecr-pull). The provider trades it at the aws-shim's
# /ecr/pod-credential for the pod's application's execution-role ECR credential (ecr_pod_credential.go), so
# the registry decides each repository on that role's policies, in the application's own account. A pod that
# is no application's, or an application with no execution role, gets no credential from it, and the node
# pulls with its own credential as before (ecr-node-pull-agent.yaml).
#
# Per node the installer:
#   1. copies the provider binary (from the aws-shim image, pinned below) into
#      /var/lib/rancher/credentialprovider/bin, replacing it when it changes (no restart: the kubelet runs it
#      afresh for each pull);
#   2. writes /var/lib/rancher/credentialprovider/config.yaml (its presence is what makes k3s/RKE2 start the
#      kubelet with the provider) and, only when that changes, restarts the node's k3s/k3s-agent once.
#      Containers keep running across the restart; the kubelet is away for seconds;
#   3. if the kubelet is not healthy within three minutes of that restart, puts the previous config back (or
#      removes it), restarts again, and does not try that config again, so a config the kubelet refuses
#      can never leave a node down.
#
# The binary is installed before the config names it: the kubelet does not start with a provider it cannot
# find. GATED: runs only on nodes labelled openinfra.dev/ecr-credential-provider=enabled (and armed for
# node pulls, openinfra.dev/ecr-pull=enabled, whose agent maps the aws-shim's name for the host), so it is
# rolled out node by node. To disarm a node: remove the label, delete config.yaml, restart its k3s.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-ecr-pull-audience
  labels: { openinfra.dev/component: ecr }
rules:
  # The kubelet may request the pod's token for the provider's audience (the NodeRestriction admission's
  # check when the audience is not one the pod's own volumes name).
  - apiGroups: [""]
    resources: [openinfra-ecr-pull]
    verbs: [request-serviceaccounts-token-audience]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-ecr-pull-audience
  labels: { openinfra.dev/component: ecr }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openinfra-ecr-pull-audience
subjects:
  - kind: Group
    name: system:nodes
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-credential-provider
  namespace: kube-system
  labels: { openinfra.dev/component: ecr }
automountServiceAccountToken: false # it calls no API
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ecr-credential-provider
  namespace: kube-system
  labels: { openinfra.dev/component: ecr, app: ecr-credential-provider }
spec:
  selector:
    matchLabels: { app: ecr-credential-provider }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 } # one node at a time
  minReadySeconds: 120
  template:
    metadata:
      labels: { app: ecr-credential-provider, openinfra.dev/component: ecr }
    spec:
      serviceAccountName: ecr-credential-provider
      automountServiceAccountToken: false
      hostPID: true # to nsenter host PID 1: restart the runtime unit, ask the kubelet's health
      nodeSelector:
        openinfra.dev/ecr-pull: enabled
        openinfra.dev/ecr-credential-provider: enabled # armed per node
      tolerations:
        - { operator: Exists }
      initContainers:
        - name: binary
          image: ghcr.io/harn3ss/open-infra-aws-shim@sha256:2199bda273ef326d0b48c7063772e4f9b752005e3facdf1795cefeb263b4e9c9
          command: [/ecr-credential-provider, --install, /out]
          volumeMounts:
            - { name: binary, mountPath: /out }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: install
          image: alpine:3.20
          securityContext:
            privileged: true # host file write + nsenter to restart the runtime
          env:
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: REGISTRY, value: "ecr-registry.open-infra-ecr.svc.cluster.local:5000" }
            - { name: SHIM_URL, value: "http://aws-shim.open-infra-aws-shim.svc.cluster.local:4566" }
          # Site value (not in git), optional ConfigMap ecr-node-pull-site: ECR_PUBLIC_HOST, the registry's LAN
          # host[:port]. Images named with it are pulled through the in-cluster registry (the node agent's
          # mirror), so the provider answers for them too.
          envFrom:
            - configMapRef: { name: ecr-node-pull-site, optional: true }
          command: [/bin/sh, -ceu]
          args:
            - |
              DIR=/host-cp
              BIN="$DIR/bin/ecr-credential-provider"
              CFG="$DIR/config.yaml"
              UNIT=""
              for u in k3s k3s-agent rke2-server rke2-agent; do
                if nsenter -t 1 -m -u -i -n -p -- systemctl is-active --quiet "$u" 2>/dev/null; then UNIT="$u"; break; fi
              done
              echo "[$NODE_NAME] unit=${UNIT:-none}"
              kubelet_healthy() { nsenter -t 1 -n -- wget -q -T 5 -O - http://127.0.0.1:10248/healthz 2>/dev/null | grep -q ok; }
              restart() {
                [ -n "$UNIT" ] || { echo "[$NODE_NAME] no runtime unit found: restart it manually"; return 0; }
                nsenter -t 1 -m -u -i -n -p -- systemctl restart "$UNIT" || echo "[$NODE_NAME] WARN restart $UNIT failed"
              }
              while :; do
                # (1) the binary, before any config names it
                mkdir -p "$DIR/bin"
                if ! cmp -s /out/ecr-credential-provider "$BIN" 2>/dev/null; then
                  cp /out/ecr-credential-provider "$BIN.new" && chmod 0755 "$BIN.new" && mv -f "$BIN.new" "$BIN"
                  echo "[$NODE_NAME] provider binary installed"
                fi
                PUBLIC=""
                if [ -n "${ECR_PUBLIC_HOST:-}" ]; then PUBLIC="$(printf '\n      - "%s"' "$ECR_PUBLIC_HOST")"; fi
                DESIRED="$(cat <<YAML
              apiVersion: kubelet.config.k8s.io/v1
              kind: CredentialProviderConfig
              providers:
                - name: ecr-credential-provider
                  matchImages:
                    - "$REGISTRY"$PUBLIC
                  defaultCacheDuration: "5m"
                  apiVersion: credentialprovider.kubelet.k8s.io/v1
                  args: ["--shim", "$SHIM_URL"]
                  tokenAttributes:
                    serviceAccountTokenAudience: openinfra-ecr-pull
                    cacheType: ServiceAccount
                    requireServiceAccount: false
              YAML
              )"
                SUM="$(printf '%s\n' "$DESIRED" | sha256sum | cut -d' ' -f1)"
                # (2) the config, and one restart when it changes — unless this config already failed here
                if ! printf '%s\n' "$DESIRED" | cmp -s - "$CFG" 2>/dev/null && [ "$(cat "$DIR/failed" 2>/dev/null)" != "$SUM" ]; then
                  [ -f "$CFG" ] && cp "$CFG" "$CFG.previous" || rm -f "$CFG.previous"
                  printf '%s\n' "$DESIRED" > "$CFG.new" && mv -f "$CFG.new" "$CFG"
                  echo "[$NODE_NAME] config.yaml changed -> restarting ${UNIT:-the runtime}"
                  restart
                  # (3) the kubelet must come back healthy with it, or the change is undone
                  ok=""
                  for _ in $(seq 1 36); do sleep 5; if kubelet_healthy; then ok=1; break; fi; done
                  if [ -n "$ok" ]; then
                    echo "[$NODE_NAME] kubelet healthy with the provider"
                  else
                    echo "[$NODE_NAME] ERROR kubelet not healthy in 3 minutes: restoring the previous config"
                    printf '%s' "$SUM" > "$DIR/failed"
                    if [ -f "$CFG.previous" ]; then mv -f "$CFG.previous" "$CFG"; else rm -f "$CFG"; fi
                    restart
                  fi
                fi
                sleep 300
              done
          volumeMounts:
            - { name: host-cp, mountPath: /host-cp }
            - { name: binary, mountPath: /out, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: host-cp
          hostPath: { path: /var/lib/rancher/credentialprovider, type: DirectoryOrCreate }
        - name: binary
          emptyDir: {}
