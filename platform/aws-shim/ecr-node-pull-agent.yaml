# In-cluster runtimeImage pull path — the per-node agent.
#
# Makes the host container runtime able to pull from the in-cluster ecr-registry (which it otherwise
# cannot: it is outside the pod network, so it can't resolve cluster DNS; it defaults to HTTPS; and the
# registry is per-repo token auth). Per node this agent:
#   1. resolves the ecr-registry + aws-shim Service ClusterIPs via its own pod DNS (CoreDNS),
#   2. writes host /etc/hosts entries for both svc.cluster.local names -> those ClusterIPs (nodes route to
#      ClusterIPs; this needs no restart and reconciles if a ClusterIP drifts),
#   3. writes /etc/rancher/k3s/registries.yaml: an http mirror endpoint for the registry (forces plain
#      HTTP) + the pull-only node-puller credential (Basic AWS:<jwt>, used for the realm bearer dance),
#   4. restarts the node runtime ONLY when registries.yaml actually changes (never in a loop).
#
# The credential comes from the node's own identity, as a node's instance role gets its ECR credential on
# AWS: the agent presents its ServiceAccount token (projected, audience openinfra-ecr-node-pull) to the
# shim's /ecr/node-credential and gets the node puller's pull-only credential (ecr_node_pull.go). It asks
# again only when the credential it holds no longer verifies at /ecr/token (a token key rotated or
# retired) or nears its end (30 to 49 days before, a different day for each node, so nodes never renew,
# and restart their runtime, together). A shim it cannot reach changes nothing.
#
# GATED: runs only on nodes labelled openinfra.dev/ecr-pull=enabled, so it is armed node-by-node (arming a
# node restarts its k3s/k3s-agent once). The node-puller credential is pull-only (see ecr-node-pull.yaml);
# a leaked node credential can only pull existing images, never push or delete. Rolled one node at a time,
# each settled for two minutes before the next, so no two nodes restart their runtime together.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-node-pull-agent
  namespace: kube-system
  labels: { openinfra.dev/component: ecr }
automountServiceAccountToken: false # its only token is the projected one, for the shim alone
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ecr-node-pull-agent
  namespace: kube-system
  labels: { openinfra.dev/component: ecr, app: ecr-node-pull-agent }
spec:
  selector:
    matchLabels: { app: ecr-node-pull-agent }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 } # one node at a time — never cycle the fleet at once
  minReadySeconds: 120 # and the next only once this node's runtime has settled
  template:
    metadata:
      labels: { app: ecr-node-pull-agent, openinfra.dev/component: ecr }
    spec:
      serviceAccountName: ecr-node-pull-agent
      automountServiceAccountToken: false
      hostPID: true # to nsenter host PID 1 and restart the runtime unit
      nodeSelector:
        openinfra.dev/ecr-pull: enabled # armed per node
      tolerations:
        - { operator: Exists } # run on every (labelled) node, including control-plane/tainted
      containers:
        - name: configure
          image: alpine:3.20
          securityContext:
            privileged: true # host file write + nsenter to restart the runtime
          env:
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: REGISTRY_HOST, value: "ecr-registry.open-infra-ecr.svc.cluster.local" }
            - { name: REGISTRY_PORT, value: "5000" }
            - { name: SHIM_HOST, value: "aws-shim.open-infra-aws-shim.svc.cluster.local" }
          # Site value (not in git), optional ConfigMap ecr-node-pull-site: ECR_PUBLIC_HOST = the registry's
          # TLS LAN host[:port] (the host part of the shim's ECR_PUBLIC_ENDPOINT). When set, images named with
          # that host are pulled through the in-cluster registry, so the node never needs the LAN path.
          envFrom:
            - configMapRef: { name: ecr-node-pull-site, optional: true }
          command: [/bin/sh, -ceu]
          args:
            - |
              TOKEN_FILE=/var/run/secrets/openinfra/ecr-node-pull/token
              SHIM_URL="http://$SHIM_HOST:4566"
              # This node's renewal offset, 0-19 days: nodes renew on different days.
              OFFSET_DAYS=$(( $(printf '%s' "$NODE_NAME" | cksum | cut -d' ' -f1) % 20 ))
              # cred_status <credential>: valid | invalid | unknown (the shim could not be asked)
              cred_status() {
                out="$(wget -S -O /dev/null -T 15 --header "Authorization: Basic $(printf 'AWS:%s' "$1" | base64 | tr -d '\n')" \
                  "$SHIM_URL/ecr/token?service=ecr-registry" 2>&1)"
                if printf '%s' "$out" | grep -q 'HTTP/[0-9.]* 200'; then echo valid
                elif printf '%s' "$out" | grep -q 'HTTP/[0-9.]* 401'; then echo invalid
                else echo unknown; fi
              }
              # cred_exp <credential>: its expiry (epoch seconds), read from the JWT's claims
              cred_exp() {
                p="$(printf '%s' "$1" | cut -d. -f2 | tr '_-' '/+')"
                case $(( ${#p} % 4 )) in 2) p="$p==" ;; 3) p="$p=" ;; esac
                printf '%s' "$p" | base64 -d 2>/dev/null | sed -n 's/.*"exp": *\([0-9]*\).*/\1/p'
              }
              # fetch_cred: the node pull credential, for this agent's own identity
              fetch_cred() {
                wget -q -O - -T 15 --header "Authorization: Bearer $(cat "$TOKEN_FILE")" "$SHIM_URL/ecr/node-credential" 2>/dev/null \
                  | sed -n 's/.*"password":"\([^"]*\)".*/\1/p'
              }
              resolve() { # first IPv4 for a name, via the pod resolver (CoreDNS)
                getent ahostsv4 "$1" 2>/dev/null | awk '{print $1; exit}' \
                  || nslookup "$1" 2>/dev/null | awk '/^Address/{ip=$NF} END{print ip}'
              }
              # find THIS node's runtime unit + registries.yaml path
              UNIT=""
              for u in k3s k3s-agent rke2-server rke2-agent; do
                if nsenter -t 1 -m -u -i -n -p -- systemctl is-active --quiet "$u" 2>/dev/null; then UNIT="$u"; break; fi
              done
              case "$UNIT" in rke2-*) DIR=/host/etc/rancher/rke2 ;; *) DIR=/host/etc/rancher/k3s ;; esac
              TARGET="$DIR/registries.yaml"
              HOSTS=/host/etc/hosts
              echo "[$NODE_NAME] unit=${UNIT:-none} registries=$TARGET"
              while :; do
                REG_IP="$(resolve "$REGISTRY_HOST")"; SHIM_IP="$(resolve "$SHIM_HOST")"
                if [ -z "$REG_IP" ] || [ -z "$SHIM_IP" ]; then echo "[$NODE_NAME] DNS not ready; retry"; sleep 15; continue; fi
                # (2) host /etc/hosts block (idempotent, marker-delimited; no restart on change)
                BLOCK="$(printf '# BEGIN openinfra-ecr\n%s %s\n%s %s\n# END openinfra-ecr\n' "$REG_IP" "$REGISTRY_HOST" "$SHIM_IP" "$SHIM_HOST")"
                CUR_HOSTS="$(sed -n '/# BEGIN openinfra-ecr/,/# END openinfra-ecr/p' "$HOSTS" 2>/dev/null || true)"
                if [ "$CUR_HOSTS" != "$BLOCK" ]; then
                  sed -i '/# BEGIN openinfra-ecr/,/# END openinfra-ecr/d' "$HOSTS" 2>/dev/null || true
                  printf '%s\n' "$BLOCK" >> "$HOSTS"
                  echo "[$NODE_NAME] /etc/hosts updated (reg=$REG_IP shim=$SHIM_IP)"
                fi
                # (3) desired registries.yaml (http mirror forces plain HTTP; auth = pull-only node-puller).
                # The credential held is kept while it verifies and is not near its end.
                CUR="$(sed -n 's/^ *password: "\(.*\)"$/\1/p' "$TARGET" 2>/dev/null | head -n 1)"
                NEED=""
                if [ -z "$CUR" ]; then
                  NEED="no node pull credential yet"
                elif [ "$(cred_status "$CUR")" = invalid ]; then
                  NEED="the node pull credential no longer verifies"
                else
                  EXP="$(cred_exp "$CUR")"
                  if [ -n "$EXP" ] && [ "$(date +%s)" -ge $(( EXP - (30 + OFFSET_DAYS) * 86400 )) ]; then NEED="the node pull credential is near its end"; fi
                fi
                PW="$CUR"
                if [ -n "$NEED" ]; then
                  NEW="$(fetch_cred)"
                  if [ -n "$NEW" ]; then PW="$NEW"; echo "[$NODE_NAME] $NEED: the shim issued a new one"
                  else echo "[$NODE_NAME] $NEED, and the shim issued none; retrying"; fi
                fi
                if [ -z "$PW" ]; then sleep 30; continue; fi
                # Images named with the registry's public (LAN) host pull through the same in-cluster
                # endpoint; containerd keys auth by endpoint host, so the credential below covers both.
                PUBLIC_MIRROR=""
                if [ -n "${ECR_PUBLIC_HOST:-}" ]; then
                  # leading newline: appended to the line above, so an unset host renders byte-identically
                  PUBLIC_MIRROR="$(printf '\n  "%s":\n    endpoint:\n      - "http://%s:%s"' "$ECR_PUBLIC_HOST" "$REGISTRY_HOST" "$REGISTRY_PORT")"
                fi
                DESIRED="$(cat <<YAML
              mirrors:
                "$REGISTRY_HOST:$REGISTRY_PORT":
                  endpoint:
                    - "http://$REGISTRY_HOST:$REGISTRY_PORT"$PUBLIC_MIRROR
              configs:
                "$REGISTRY_HOST:$REGISTRY_PORT":
                  auth:
                    username: AWS
                    password: "$PW"
              YAML
              )"
                mkdir -p "$DIR"
                if ! printf '%s\n' "$DESIRED" | cmp -s - "$TARGET" 2>/dev/null; then
                  printf '%s\n' "$DESIRED" > "$TARGET"
                  if [ -n "$UNIT" ]; then
                    echo "[$NODE_NAME] registries.yaml changed -> restarting $UNIT"
                    nsenter -t 1 -m -u -i -n -p -- systemctl restart "$UNIT" || echo "[$NODE_NAME] WARN restart $UNIT failed (restart manually)"
                  else
                    echo "[$NODE_NAME] registries.yaml written; restart the runtime manually"
                  fi
                fi
                sleep 300
              done
          volumeMounts:
            - { name: host-etc, mountPath: /host/etc }
            - { name: ecr-node-pull-token, mountPath: /var/run/secrets/openinfra/ecr-node-pull, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: host-etc
          hostPath: { path: /etc, type: Directory }
        - name: ecr-node-pull-token
          projected:
            sources:
              - serviceAccountToken: { audience: openinfra-ecr-node-pull, expirationSeconds: 3600, path: token }
