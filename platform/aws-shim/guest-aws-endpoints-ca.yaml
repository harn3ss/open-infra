# The AWS endpoints CA (guest-only, constrained to amazonaws.com) and its CA-type ClusterIssuer; the rest of
# the guest AWS endpoints is in guest-aws-endpoints.yaml, and this file is excluded with it
# (networking.guestAwsEndpoints: false).
#
# Once the platform's CAs move into OpenBao (openbao.platformCAs: true), this root goes offline and install.sh
# excludes this file: openinfra-aws-endpoints then signs through an OpenBao intermediate the root signed
# (security/openbao-issuers.yaml), and guests keep trusting this same root.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openinfra-aws-endpoints-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  isCA: true
  commonName: open-infra AWS endpoints CA (VM guests)
  subject:
    organizations: [open-infra]
  # The number is the key's generation, as for the platform root (cluster-ca.yaml): a renewal re-signs
  # with the same key; a new key is a new Secret name here and in the ClusterIssuer.
  secretName: openinfra-aws-endpoints-ca-1
  duration: 87600h      # 10 years
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  # It can vouch for AWS's names only: a client that trusts it is not exposed for any other domain, even
  # if its key leaked.
  nameConstraints:
    critical: true
    permitted:
      dnsDomains: [amazonaws.com]
  issuerRef:
    name: openinfra-issuer  # self-signed: the root signs itself
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openinfra-aws-endpoints
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: openinfra-aws-endpoints-ca-1
