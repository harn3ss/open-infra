# AWS's own hostnames inside VM guests: a resolver and a CA for guests only, so an amazonaws.com URL a
# guest carries reaches this platform's AWS front door, never AWS.
#
# A Linux VM guest calls AWS through AWS_ENDPOINT_URL (the aws-shim's in-cluster TLS port). Two kinds of
# call bypass it:
#   - a URL the guest carries from its AWS-side configuration: an SQS QueueUrl
#     (https://sqs.<region>.amazonaws.com/<account>/<queue>; the JavaScript SDK v3 sends to the QueueUrl's
#     host), an image named <account>.dkr.ecr.<region>.amazonaws.com/<repo>, a bucket's virtual-hosted URL,
#     an API's execute-api invoke URL;
#   - an SDK or tool that ignores AWS_ENDPOINT_URL (aws-sdk v2, older botocore).
# Without this file both reach AWS, carrying the role's key id, session token and the request's body. And
# an SDK that addresses buckets virtual-hosted (the JavaScript SDK v3's default) asks for
# <bucket>.aws-shim.open-infra-aws-shim.svc.cluster.local, a name the cluster DNS does not answer.
#
# 1. The guest resolver (kube-system/openinfra-guest-dns at 10.43.0.53), a CoreDNS that answers
#    - <bucket>.aws-shim.open-infra-aws-shim.svc[.cluster.local] with the shim's address;
#    - the amazonaws.com names of the services the aws-shim serves (their regional endpoints; the
#      execute-api, appsync-api and S3 virtual-hosted names; the global sts, iam, cloudfront, s3 and the
#      legacy queue names) with the shim's address;
#    - <account>.dkr.ecr.<region>.amazonaws.com with the guest-facing registry's (ecr-registry-aws);
#    and forwards every other name to the cluster DNS. AWS names of services the shim does not serve
#    (ssmmessages, ec2messages, awscli.amazonaws.com, ...) resolve as they always did. VM guests use it through
#    their VMI's dnsConfig (vm-composition.yaml, from the openinfra-guest-dns EnvironmentConfig below); no
#    other pod does, so platform components that call AWS itself are unaffected. It runs in kube-system on
#    port 53 because a security group with egress rules always allows DNS to kube-system:53
#    (securitygroup-composition.yaml).
# 2. The AWS endpoints CA (cert-manager/openinfra-aws-endpoints-ca): a root of its own, name-constrained to
#    amazonaws.com, that signs only the shim's and the registry's AWS-names certificates, and only in their
#    namespaces (the admission policy below). VM guests trust it: the platform-ca-publisher publishes it
#    beside the platform root (openinfra-platform-ca, awsEndpointsCA) and the guest's agent adds it to the
#    system trust store. LAN clients, which import the platform root, never trust it, so no workstation
#    accepts a certificate this platform minted for an AWS name. (The platform root could not sign these
#    anyway: it is name-constrained to in-cluster and private names, networking/cluster-ca.yaml.)
# 3. The aws-shim serves the AWS names on its AWS-names TLS listener (Service port 443 -> :8443) with
#    aws-shim-aws-endpoints-tls. A caller that came by sqs.<region>.amazonaws.com is answered with queue
#    URLs in that shape, but a queue is always recorded under the shim's own URL, so no other caller is
#    ever handed an amazonaws.com URL. (The shim's internal certificate also covers
#    *.aws-shim.open-infra-aws-shim.svc[.cluster.local], for item one above.)
# 4. ecr-registry-aws: the same registry (same storage, same token trust anchor) serving TLS for
#    <account>.dkr.ecr.<region>.amazonaws.com, its token realm the shim's in-cluster TLS port.
#
# On by default with the aws-shim; networking.guestAwsEndpoints: false makes install.sh exclude this file,
# and guests keep the cluster DNS. Not covered: AWS names of services the shim does not serve, S3's
# dash-region and dualstack forms, and other partitions' domains (amazonaws.com.cn). Those still leave the
# cluster unless guest egress to AWS is blocked. A guest cannot download anonymously from a bucket on AWS
# (an agent installer in a public AWS bucket): every <bucket>.s3... name is answered here.
#
# The resolver's address is a fixed ClusterIP in the statically-assigned band of the Service CIDR
# (10.43.0.0/24 on k3s and RKE2). On a cluster with another Service CIDR, change it in the Service and in
# the EnvironmentConfig below (a render test checks the two agree).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openinfra-aws-endpoints-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  isCA: true
  commonName: open-infra AWS endpoints CA (VM guests)
  subject:
    organizations: [open-infra]
  # The number is the key's generation, as for the platform root (cluster-ca.yaml): a renewal re-signs
  # with the same key; a new key is a new Secret name here and in the ClusterIssuer.
  secretName: openinfra-aws-endpoints-ca-1
  duration: 87600h      # 10 years
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  # It can vouch for AWS's names only: a client that trusts it is not exposed for any other domain, even
  # if its key leaked.
  nameConstraints:
    critical: true
    permitted:
      dnsDomains: [amazonaws.com]
  issuerRef:
    name: openinfra-issuer  # self-signed: the root signs itself
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openinfra-aws-endpoints
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: openinfra-aws-endpoints-ca-1
---
# openinfra-aws-endpoints issues only in the aws-shim's and the registry's namespaces: a tenant who can
# create a Certificate would otherwise get one for an AWS name that every VM guest trusts.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-aws-endpoints-issuance
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [open-infra-aws-shim, open-infra-ecr]
    resourceRules:
      - apiGroups: [cert-manager.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [certificates, certificaterequests]
      - apiGroups: [certificates.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [certificatesigningrequests]
  validations:
    - expression: >-
        request.resource.group != 'cert-manager.io'
        || !has(object.spec.issuerRef)
        || !(object.spec.issuerRef.name == 'openinfra-aws-endpoints'
             && has(object.spec.issuerRef.kind) && object.spec.issuerRef.kind == 'ClusterIssuer'
             && (!has(object.spec.issuerRef.group) || object.spec.issuerRef.group in ['', 'cert-manager.io']))
      reason: Forbidden
      message: "the openinfra-aws-endpoints ClusterIssuer signs only for the aws-shim and the registry"
    - expression: >-
        request.resource.group != 'certificates.k8s.io'
        || object.spec.signerName != 'clusterissuers.cert-manager.io/openinfra-aws-endpoints'
      reason: Forbidden
      message: "the openinfra-aws-endpoints ClusterIssuer does not sign Kubernetes CertificateSigningRequests"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-aws-endpoints-issuance
spec:
  policyName: openinfra-aws-endpoints-issuance
  validationActions: [Deny]
---
