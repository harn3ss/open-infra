    - "*.dkr.ecr.ap-southeast-4.amazonaws.com"
    - "*.dkr.ecr.ap-southeast-5.amazonaws.com"
    - "*.dkr.ecr.ap-southeast-6.amazonaws.com"
    - "*.dkr.ecr.ap-southeast-7.amazonaws.com"
    - "*.dkr.ecr.ap-northeast-1.amazonaws.com"
    - "*.dkr.ecr.ap-northeast-2.amazonaws.com"
    - "*.dkr.ecr.ap-northeast-3.amazonaws.com"
---
# The guest resolver. Rules are tried in order and the first match wins; a rewritten question is
# answered under its original name (answer auto). Every name no rule matches is forwarded unchanged.
# (test/render checks the rules against the services the aws-shim registers and the certificates above.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: openinfra-guest-dns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health :8080
        ready :8181
        # The shim's own name, virtual-hosted (S3 against AWS_ENDPOINT_URL with a default SDK client).
        rewrite stop name regex ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]\.aws-shim\.open-infra-aws-shim\.svc(\.cluster\.local)?\.$ aws-shim.open-infra-aws-shim.svc.cluster.local. answer auto
        # A registry by its ECR name.
        rewrite stop name regex ^[0-9]{12}\.dkr\.ecr\.[a-z]{2}(-gov)?-[a-z]+-[0-9]+\.amazonaws\.com\.$ ecr-registry-aws.open-infra-ecr.svc.cluster.local. answer auto
        # The regional endpoints of the services the aws-shim serves.
        rewrite stop name regex ^(acm|api\.ecr|athena|apigateway|appsync|cloudformation|cognito-idp|dynamodb|ec2|ecr|ecs|eks|email|events|glue|kinesis|kms|lambda|logs|monitoring|organizations|rds|s3|secretsmanager|sns|sqs|ssm|states|streams\.dynamodb|sts|sync-states)\.[a-z]{2}(-gov)?-[a-z]+-[0-9]+\.amazonaws\.com\.$ aws-shim.open-infra-aws-shim.svc.cluster.local. answer auto
        # An API's invoke name, an AppSync API's, a bucket's (regional or global).
        rewrite stop name regex ^[a-z0-9]+\.(execute-api|appsync-api)\.[a-z]{2}(-gov)?-[a-z]+-[0-9]+\.amazonaws\.com\.$ aws-shim.open-infra-aws-shim.svc.cluster.local. answer auto
        rewrite stop name regex ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]\.s3(\.[a-z]{2}(-gov)?-[a-z]+-[0-9]+)?\.amazonaws\.com\.$ aws-shim.open-infra-aws-shim.svc.cluster.local. answer auto
        # Global endpoints, and SQS's legacy names.
        rewrite stop name regex ^(sts|iam|cloudfront|s3|queue|[a-z]{2}(-gov)?-[a-z]+-[0-9]+\.queue)\.amazonaws\.com\.$ aws-shim.open-infra-aws-shim.svc.cluster.local. answer auto
        # Everything else: the cluster DNS (this pod's own resolv.conf, ClusterFirst).
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openinfra-guest-dns
  namespace: kube-system
  labels: { app.kubernetes.io/name: openinfra-guest-dns }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: openinfra-guest-dns }
  template:
    metadata:
      labels: { app.kubernetes.io/name: openinfra-guest-dns }
      annotations:
        # A Corefile change restarts the pods (reload also picks it up in place).
        openinfra.dev/corefile-rev: "1"
    spec:
      priorityClassName: system-cluster-critical
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: openinfra-guest-dns }
      containers:
        - name: coredns
          # The cluster DNS's own CoreDNS release (k3s), by digest.
          image: docker.io/rancher/mirrored-coredns-coredns:1.14.3@sha256:b21d26b915e10acb5bc78715c1e8b6047ab2675389b2bcc18b3a6499d90e74c0
          args: [-conf, /etc/coredns/Corefile]
          ports:
            - { name: dns, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: 8181 }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { add: [NET_BIND_SERVICE], drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/coredns, readOnly: true }
      volumes:
        - name: config
          configMap: { name: openinfra-guest-dns }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openinfra-guest-dns
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: openinfra-guest-dns }
---
apiVersion: v1
kind: Service
metadata:
  name: openinfra-guest-dns
  namespace: kube-system
  labels: { app.kubernetes.io/name: openinfra-guest-dns }
spec:
  type: ClusterIP
  clusterIP: 10.43.0.53
  selector: { app.kubernetes.io/name: openinfra-guest-dns }
  ports:
    - { name: dns, port: 53, targetPort: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 53, protocol: TCP }
---
# The resolver VM guests use (vm-composition.yaml reads it through an Optional environment step: without
# this file, guests keep the cluster DNS).
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: EnvironmentConfig
metadata:
  name: openinfra-guest-dns
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
data:
  guestNameserver: "10.43.0.53"
---
# The registry for its ECR names: the same distribution instance as ecr-registry-public (same storage
# bucket, same upload secret, same token trust anchor), serving TLS itself with the AWS-names
# certificate, so a guest pulls <account>.dkr.ecr.<region>.amazonaws.com/<repo> after an unmodified
# `aws ecr get-login-password | docker login`. Its token realm is the shim's in-cluster TLS port, which
# guests verify against the platform root. distribution reads its certificate once, so the wrapper
# restarts the container when cert-manager renews it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecr-registry-aws
  namespace: open-infra-ecr
  labels: { app: ecr-registry-aws }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ecr-registry-aws }
  template:
    metadata:
      labels: { app: ecr-registry-aws }
    spec:
      serviceAccountName: ecr-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: config, configMap: { name: ecr-registry-config } }
        - { name: tmp, emptyDir: {} }
        - { name: token-cert, configMap: { name: ecr-token-cert } }
        - { name: tls, secret: { secretName: ecr-registry-aws-endpoints-tls } }
      containers:
        - name: registry
          image: ghcr.io/distribution/distribution@sha256:4ba3adf47f5c866e9a29288c758c5328ef03396cb8f5f6454463655fa8bc83e2
          command: [/bin/sh, -c]
          args:
            - |
              set -u
              stamp() { stat -L -c '%Y/%s' /tls/tls.crt /tls/tls.key | tr '\n' ' '; }
              first="$(stamp)"
              registry serve /etc/distribution/config.yml &
              pid=$!
              trap 'kill -TERM "$pid" 2>/dev/null; wait "$pid"; exit 0' TERM INT
              while kill -0 "$pid" 2>/dev/null; do
                sleep 60 &
                wait $!
                if [ "$(stamp)" != "$first" ]; then
                  echo "the TLS certificate was renewed: restarting to serve it"
                  kill -TERM "$pid"
                  wait "$pid"
                  exit 0
                fi
              done
              wait "$pid"
          ports: [{ name: https, containerPort: 5000 }]
          env:
            - { name: REGISTRY_STORAGE_S3_ACCESSKEY, valueFrom: { secretKeyRef: { name: ecr-registry-minio, key: accessKey } } }
            - { name: REGISTRY_STORAGE_S3_SECRETKEY, valueFrom: { secretKeyRef: { name: ecr-registry-minio, key: secretKey } } }
            - { name: REGISTRY_HTTP_SECRET, valueFrom: { secretKeyRef: { name: ecr-registry-auth, key: httpSecret } } }
            - { name: REGISTRY_HTTP_RELATIVEURLS, value: "true" }
            - { name: REGISTRY_HTTP_TLS_CERTIFICATE, value: /tls/tls.crt }
            - { name: REGISTRY_HTTP_TLS_KEY, value: /tls/tls.key }
            - { name: REGISTRY_AUTH_TOKEN_REALM, value: "https://aws-shim.open-infra-aws-shim.svc.cluster.local:4567/ecr/token" }
          volumeMounts:
            - { name: config, mountPath: /etc/distribution }
            - { name: tmp, mountPath: /tmp }
            - { name: token-cert, mountPath: /token-cert, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
          readinessProbe:
            httpGet: { path: /, port: https, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: https, scheme: HTTPS }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: ecr-registry-aws
  namespace: open-infra-ecr
  labels: { app: ecr-registry-aws }
spec:
  type: ClusterIP
  selector: { app: ecr-registry-aws }
  ports:
    - { name: https, port: 443, targetPort: https }
