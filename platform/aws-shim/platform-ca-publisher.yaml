# The platform root CA certificate, published for VM guests through their own spec, and every platform
# certificate kept signed by the current root.
#
# A Linux VM guest trusts the platform root CA: the registry's and S3's TLS addresses use it, and so does
# the shim's in-cluster TLS port, where the guest's metadata agent fetches its role credentials. The guest
# must get that root WITHOUT fetching it over the network, where anything that answers for the shim's name
# (a LAN DHCP/DNS server, for one) could hand it another root. So this CronJob copies the root certificate
# into the cluster-scoped EnvironmentConfig openinfra-platform-ca (data.platformRootCA). The VM composition
# reads it (function-environment-configs) and writes it into each guest's cloud-init Secret.
#
# Source: the root itself. The root Certificate (cert-manager/openinfra-root-ca) is issued through a
# CertificateRequest; the one for its current revision, owned by it, approved and ready, holds the root
# certificate it now has. That is the certificate published, from the moment cert-manager issues it, so a
# re-signed or re-keyed root reaches new guests at once rather than when some leaf next renews. While the
# ClusterIssuer openinfra-ca still signs with a different Secret than the root Certificate writes (a key
# rotation part-way through a sync), nothing changes: guests keep the root that signs.
#
# The AWS endpoints CA (cert-manager/openinfra-aws-endpoints-ca, guest-aws-endpoints.yaml) is published
# the same way, beside the root (data.awsEndpointsCA): guests trust it for the amazonaws.com names their
# resolver answers with the platform's addresses. It is optional — absent (networking.guestAwsEndpoints:
# false), not issued yet, or with its ClusterIssuer signing with another Secret, it is left out this run.
#
# Then every certificate openinfra-ca issued in a platform namespace (the namespaces the admission policy
# in cluster-ca.yaml allows) whose latest CertificateRequest was signed by another root is renewed, as
# `cmctl renew` does it: an Issuing condition on its status. After a key rotation that re-signs the shim,
# the registry, S3 and the carrier Certificate the shim serves /v1/ca-bundle from, with no hand steps.
#
# Public data: the publisher reads no Secret.
#
# Least privilege: in cert-manager, get the two root Certificates and list CertificateRequests; get their
# ClusterIssuers; in each platform namespace, list Certificates and CertificateRequests and
# set a Certificate's status (to renew it); create EnvironmentConfigs, and get/update only
# openinfra-platform-ca. RBAC cannot scope create by name, so the admission policy below confines this
# identity to openinfra-platform-ca, and lets nobody else but system:masters write that config.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-ca-publisher
  namespace: open-infra-aws-shim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ca-publisher
  namespace: open-infra-aws-shim
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests, certificates]
    verbs: [list]
  - apiGroups: [cert-manager.io]
    resources: [certificates/status]
    verbs: [get, patch]   # kubectl patch --subresource=status reads the subresource first
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ca-publisher
  namespace: open-infra-aws-shim
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-ca-publisher }
subjects:
  - kind: ServiceAccount
    name: platform-ca-publisher
    namespace: open-infra-aws-shim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ca-publisher
  namespace: open-infra-ecr
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests, certificates]
    verbs: [list]
  - apiGroups: [cert-manager.io]
    resources: [certificates/status]
    verbs: [get, patch]   # kubectl patch --subresource=status reads the subresource first
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ca-publisher
  namespace: open-infra-ecr
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-ca-publisher }
subjects:
  - kind: ServiceAccount
    name: platform-ca-publisher
    namespace: open-infra-aws-shim
---
# The root's own Certificate and CertificateRequests (public: CSRs and certificates). Not its Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ca-publisher
  namespace: cert-manager
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    resourceNames: [openinfra-root-ca, openinfra-aws-endpoints-ca]
    verbs: [get]
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests]
    verbs: [list]
  # The roots' certificates once the platform's CAs are in OpenBao (public).
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [openinfra-roots]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ca-publisher
  namespace: cert-manager
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-ca-publisher }
subjects:
  - kind: ServiceAccount
    name: platform-ca-publisher
    namespace: open-infra-aws-shim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-platform-ca-publisher
rules:
  - apiGroups: [apiextensions.crossplane.io]
    resources: [environmentconfigs]
    verbs: [create]
  - apiGroups: [apiextensions.crossplane.io]
    resources: [environmentconfigs]
    resourceNames: [openinfra-platform-ca]
    verbs: [get, update, patch]
  - apiGroups: [cert-manager.io]
    resources: [clusterissuers]
    resourceNames: [openinfra-ca, openinfra-aws-endpoints]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-platform-ca-publisher
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: openinfra-platform-ca-publisher }
subjects:
  - kind: ServiceAccount
    name: platform-ca-publisher
    namespace: open-infra-aws-shim
---
# What every new VM guest trusts is decided by openinfra-platform-ca, so only the publisher (and
# system:masters, for recovery) may write it, and the publisher may write nothing else.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-platform-ca-config
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apiextensions.crossplane.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [environmentconfigs]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:open-infra-aws-shim:platform-ca-publisher'
        || object.metadata.name == 'openinfra-platform-ca'
      reason: Forbidden
      message: "the platform-ca-publisher may write only the openinfra-platform-ca EnvironmentConfig"
    - expression: >-
        object.metadata.name != 'openinfra-platform-ca'
        || request.userInfo.username == 'system:serviceaccount:open-infra-aws-shim:platform-ca-publisher'
        || ('system:masters' in request.userInfo.groups)
      reason: Forbidden
      message: "openinfra-platform-ca (the root CA every new VM guest trusts) is written only by the platform-ca-publisher"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-platform-ca-config
spec:
  policyName: openinfra-platform-ca-config
  validationActions: [Deny]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-ca-publisher
  namespace: open-infra-aws-shim
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 300
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: platform-ca-publisher
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - { name: home, emptyDir: {} }
          containers:
            - name: publish
              image: alpine/k8s:1.30.0
              command: [/bin/sh, -ceu]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: home, mountPath: /tmp }
              env:
                - { name: HOME, value: /tmp }
                - { name: ROOT_NS, value: cert-manager }
                - { name: ROOT_CERT, value: openinfra-root-ca }
                - { name: ISSUER, value: openinfra-ca }
                # The AWS endpoints CA guests also trust (guest-aws-endpoints.yaml), and its ClusterIssuer.
                - { name: AWS_CA_CERT, value: openinfra-aws-endpoints-ca }
                - { name: AWS_CA_ISSUER, value: openinfra-aws-endpoints }
                # The namespaces openinfra-ca may issue in (cluster-ca.yaml, openinfra-ca-issuance).
                - { name: PLATFORM_NAMESPACES, value: "open-infra-aws-shim open-infra-ecr openbao" }
                - { name: RENEW_BACKOFF_SECONDS, value: "1800" }
              args:
                - |
                  # issued_pem CERT_JSON: a root Certificate's own certificate, from the CertificateRequest of
                  # its current revision, owned by it, approved and ready (cert-manager sets status, which only
                  # it can write). Certificates only: anything else (a key, stray text) is refused, never
                  # published. Fails, saying why, when there is no such certificate.
                  issued_pem() {
                    i_name="$(printf '%s' "$1" | jq -r .metadata.name)"
                    i_uid="$(printf '%s' "$1" | jq -r .metadata.uid)"
                    i_rev="$(printf '%s' "$1" | jq -r '.status.revision // 0')"
                    i_b64="$(kubectl -n "$ROOT_NS" get certificaterequests -o json \
                      | jq -r --arg uid "$i_uid" --arg rev "$i_rev" --argjson ref "$(printf '%s' "$1" | jq -c .spec.issuerRef)" '[.items[]
                          | select(any(.metadata.ownerReferences[]?; .uid == $uid and .kind == "Certificate"))
                          | select((.metadata.annotations["cert-manager.io/certificate-revision"] // "") == $rev)
                          | select(.spec.issuerRef.name == $ref.name and .spec.issuerRef.kind == $ref.kind)
                          | select(any(.status.conditions[]?; .type == "Approved" and .status == "True"))
                          | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
                          | .status.certificate // empty] | if length == 1 then .[0] else empty end')"
                    [ -n "$i_b64" ] || { echo "no single issued CertificateRequest for $i_name revision $i_rev" >&2; return 1; }
                    i_pem="$(printf '%s' "$i_b64" | base64 -d)"
                    if printf '%s\n' "$i_pem" | grep -q -v -x -e '-----BEGIN CERTIFICATE-----' -e '-----END CERTIFICATE-----' -e '[A-Za-z0-9+/=]*'; then
                      echo "refusing to publish: $i_name is not PEM certificates only" >&2; return 1
                    fi
                    printf '%s' "$i_pem"
                  }
                  ready() { printf '%s' "$1" | jq -e 'any(.status.conditions[]?; .type == "Ready" and .status == "True")' >/dev/null; }

                  # Once the platform's CAs live in OpenBao (docs/openbao.md, "The platform's CAs"), the roots
                  # are offline and their Certificates gone: the roots' certificates are in ConfigMap
                  # openinfra-roots (public, written when the CAs moved). They are published from there, as
                  # PEM certificates only, and no leaf is force-renewed: an intermediate rotation needs none.
                  pem_only() { ! printf '%s\n' "$1" | grep -q -v -x -e '-----BEGIN CERTIFICATE-----' -e '-----END CERTIFICATE-----' -e '[A-Za-z0-9+/=]*' -e ''; }
                  if ! kubectl -n "$ROOT_NS" get certificate "$ROOT_CERT" -o name >/dev/null 2>&1 \
                      && roots="$(kubectl -n "$ROOT_NS" get configmap openinfra-roots -o json 2>/dev/null)"; then
                    pem="$(printf '%s' "$roots" | jq -r '.data.platformRootCA // empty')"
                    aws="$(printf '%s' "$roots" | jq -r '.data.awsEndpointsCA // empty')"
                    case "$pem" in *"BEGIN CERTIFICATE"*) ;; *) echo "openinfra-roots holds no platform root" >&2; exit 1 ;; esac
                    pem_only "$pem" && pem_only "$aws" || { echo "refusing to publish: openinfra-roots is not PEM certificates only" >&2; exit 1; }
                    jq -n --arg pem "$pem" --arg aws "$aws" '{apiVersion: "apiextensions.crossplane.io/v1alpha1", kind: "EnvironmentConfig",
                        metadata: {name: "openinfra-platform-ca", labels: {"app.kubernetes.io/managed-by": "platform-ca-publisher"}},
                        data: ({platformRootCA: (($pem | rtrimstr("\n")) + "\n")} + (if $aws == "" then {} else {awsEndpointsCA: (($aws | rtrimstr("\n")) + "\n")} end))}' \
                      | kubectl apply --server-side --field-manager=platform-ca-publisher -f -
                    echo "openinfra-platform-ca holds the platform root CA (offline; its CAs are in OpenBao)"
                    exit 0
                  fi

                  # The root Certificate, and the Secret the ClusterIssuer signs with.
                  crt="$(kubectl -n "$ROOT_NS" get certificate "$ROOT_CERT" -o json)"
                  if ! ready "$crt"; then
                    echo "$ROOT_NS/$ROOT_CERT is not issued yet; nothing to publish"; exit 0
                  fi
                  rev="$(printf '%s' "$crt" | jq -r '.status.revision // 0')"
                  secret="$(printf '%s' "$crt" | jq -r .spec.secretName)"
                  signs="$(kubectl get clusterissuer "$ISSUER" -o jsonpath='{.spec.ca.secretName}')"
                  if [ "$signs" != "$secret" ]; then
                    echo "$ISSUER signs with Secret $signs while $ROOT_CERT writes $secret (a key rotation in progress); nothing changed this run"
                    exit 0
                  fi
                  pem="$(issued_pem "$crt")" || exit 1

                  # The AWS endpoints CA, when there is one (guest-aws-endpoints.yaml). While it cannot be read
                  # this run (not issued yet, its ClusterIssuer signing with another Secret, an API error),
                  # the one published before stays.
                  aws=""
                  if acrt="$(kubectl -n "$ROOT_NS" get certificate "$AWS_CA_CERT" -o json --ignore-not-found)" && [ -z "$acrt" ]; then
                    echo "no $ROOT_NS/$AWS_CA_CERT (guest AWS endpoints off): the AWS endpoints CA is not published"
                  elif [ -n "$acrt" ] && ready "$acrt" \
                      && [ "$(kubectl get clusterissuer "$AWS_CA_ISSUER" -o jsonpath='{.spec.ca.secretName}')" = "$(printf '%s' "$acrt" | jq -r .spec.secretName)" ] \
                      && aws="$(issued_pem "$acrt")"; then
                    echo "the AWS endpoints CA ($AWS_CA_CERT revision $(printf '%s' "$acrt" | jq -r '.status.revision // 0')) is published beside the root"
                  else
                    aws="$(kubectl get environmentconfig openinfra-platform-ca -o json --ignore-not-found | jq -r '.data.awsEndpointsCA // empty')"
                    echo "$ROOT_NS/$AWS_CA_CERT cannot be read this run (not issued, its issuer signs with another Secret, or an error): ${aws:+the one published before stays}${aws:-none is published}"
                  fi

                  jq -n --arg pem "$pem" --arg aws "$aws" '{apiVersion: "apiextensions.crossplane.io/v1alpha1", kind: "EnvironmentConfig",
                      metadata: {name: "openinfra-platform-ca", labels: {"app.kubernetes.io/managed-by": "platform-ca-publisher"}},
                      data: ({platformRootCA: ($pem + "\n")} + (if $aws == "" then {} else {awsEndpointsCA: ($aws + "\n")} end))}' \
                    | kubectl apply --server-side --field-manager=platform-ca-publisher -f -
                  echo "openinfra-platform-ca holds the platform root CA ($ROOT_CERT revision $rev)"

                  # Platform certificates signed by another root are renewed. The comparison is on the
                  # certificate bytes (whitespace aside): a leaf's latest CertificateRequest records, in
                  # status.ca, the root that signed it.
                  root="$(printf '%s' "$pem" | tr -d ' \r\n')"
                  for ns in $PLATFORM_NAMESPACES; do
                    certs="$(kubectl -n "$ns" get certificates -o json)" || { echo "cannot list Certificates in $ns" >&2; continue; }
                    reqs="$(kubectl -n "$ns" get certificaterequests -o json)" || { echo "cannot list CertificateRequests in $ns" >&2; continue; }
                    printf '%s' "$certs" | jq -r --arg iss "$ISSUER" '.items[]
                        | select(.spec.issuerRef.name == $iss and (.spec.issuerRef.kind // "Issuer") == "ClusterIssuer")
                        | select(all(.status.conditions[]?; .type != "Issuing" or .status != "True"))
                        | .metadata.name' \
                      | while read -r c; do
                          [ -n "$c" ] || continue
                          last="$(printf '%s' "$reqs" | jq -c --arg c "$c" '[.items[]
                              | select(.metadata.annotations["cert-manager.io/certificate-name"] == $c)
                              | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))]
                            | sort_by(.metadata.annotations["cert-manager.io/certificate-revision"] // "0" | tonumber)
                            | last // empty')"
                          [ -n "$last" ] || continue      # never issued yet: cert-manager issues it from the current root
                          ca="$(printf '%s' "$last" | jq -r '.status.ca // empty' | base64 -d 2>/dev/null | tr -d ' \r\n')"
                          [ -n "$ca" ] && [ "$ca" != "$root" ] || continue
                          # At most one renewal per RENEW_BACKOFF_SECONDS: a leaf renewed that recently and
                          # still signed by another root means the ClusterIssuer's Secret does not hold this
                          # root (say, a rotation rolled back without renewing the root) — renewing again
                          # would not help.
                          age=$(( $(date -u +%s) - $(printf '%s' "$last" | jq -r '.metadata.creationTimestamp // "1970-01-01T00:00:00Z" | fromdateiso8601') ))
                          if [ "$age" -lt "$RENEW_BACKOFF_SECONDS" ]; then
                            echo "WARNING: $ns/$c was re-issued ${age}s ago and is still signed by another root; is $ISSUER signing with $ROOT_CERT's key? (renew $ROOT_CERT if a rotation was rolled back)" >&2
                            continue
                          fi
                          # cmctl renew: an Issuing condition. The resourceVersion test makes a concurrent
                          # status write by cert-manager win; the next run retries.
                          cur="$(printf '%s' "$certs" | jq -c --arg c "$c" '.items[] | select(.metadata.name == $c)')"
                          now="$(date -u +%FT%TZ)"
                          patch="$(printf '%s' "$cur" | jq -c --arg now "$now" '[
                              {op: "test", path: "/metadata/resourceVersion", value: .metadata.resourceVersion},
                              {op: "add", path: "/status/conditions", value: ([(.status.conditions // [])[] | select(.type != "Issuing")] + [{
                                type: "Issuing", status: "True", reason: "ManuallyTriggered",
                                message: "Re-issued: signed by a root other than the current platform root CA",
                                lastTransitionTime: $now, observedGeneration: .metadata.generation}])}]')"
                          if kubectl -n "$ns" patch certificate "$c" --subresource=status --type=json -p "$patch" >/dev/null; then
                            echo "renewing $ns/$c: signed by another root"
                          else
                            echo "could not renew $ns/$c this run" >&2
                          fi
                        done
                  done
