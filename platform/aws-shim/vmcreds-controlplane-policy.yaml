# Control-plane authorization grant for VM workload credentials (#344): the aws-shim's
# /v1/vm-credentials endpoint reads a VM's per-VM ServiceAccount to resolve its instance role
# (the openinfra.dev/instance-role annotation), exactly as EKS Pod Identity reads a SA's
# role annotation. That is a `get serviceaccounts` on the control plane, which the Cedar
# control-plane authorizer governs — so it is granted here as a kind: Policy spec.controlPlane
# block (the declarative corpus extension), not only in RBAC (which Cedar overrides).
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: aws-shim-vm-identity
  namespace: open-infra-console
spec:
  description: "aws-shim reads a VM's ServiceAccount to resolve its instance role (VM workload credentials, #344)."
  controlPlane:
    appliesTo: ["ServiceAccount::open-infra-aws-shim/aws-shim"]
    statements:
      - effect: Allow
        actions: ["get"]
        resources: ["serviceaccounts::*"]
---
# The same, for Lambda execution roles: the aws-shim confirms a function's identity token is bound to a
# pod Knative runs for that function — a `get` of the one pod the TokenReview names, of its ReplicaSet and
# of that ReplicaSet's Deployment (which a Knative Revision must own) — before it hands the function its
# role's credentials (lambda_role.go). It reads their metadata only, never their specs (the function's
# environment). The function's ServiceAccount is read under the grant above.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: aws-shim-function-identity
  namespace: open-infra-console
spec:
  description: "aws-shim reads the pod a Lambda function's identity token is bound to (execution roles)."
  controlPlane:
    appliesTo: ["ServiceAccount::open-infra-aws-shim/aws-shim"]
    statements:
      - effect: Allow
        actions: ["get"]
        resources: ["pods::*", "replicasets.apps::*", "deployments.apps::*"]
