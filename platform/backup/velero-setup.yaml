# One-time setup for Velero: create the `velero` bucket in MinIO and write the
# velero-cloud-credentials secret (AWS-format creds for the S3 backup store),
# and the MinIO root creds via env — so no credentials are ever committed.
#
# It has its OWN ServiceAccount scoped to writing that one secret in the velero namespace, rather than
# the cluster-wide-secret openinfra-bucket-setup SA the Bucket compositions use — this Job only ever
# writes velero-cloud-credentials in the velero namespace, so it needs no reach anywhere else.
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# The Job runs in the minio namespace (to read the MinIO root secret via env); its SA lives there too,
# and a RoleBinding in the velero namespace lets it write just the credentials secret there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-setup
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-setup-creds-writer
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # Write only the backup-store credentials secret into the velero namespace.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velero-setup-creds-writer
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: velero-setup-creds-writer }
subjects:
  - kind: ServiceAccount
    name: velero-setup
    namespace: minio
---
apiVersion: batch/v1
kind: Job
metadata:
  name: velero-setup
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Run as a Sync hook (re-created each sync, deleted before the next) like the other setup Jobs
    # (query-iam-setup, longhorn-backup-setup, vault-transit-setup). It must NOT be a plain tracked
    # Job with ttlSecondsAfterFinished: the TTL controller GCs it, then selfHeal sees it missing and
    # re-creates it → the app is permanently OutOfSync and never converges (the setup-job TTL loop,
    # ArgoCD variant). A hook is not part of the drift comparison, so no churn.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      serviceAccountName: velero-setup
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: alpine/k8s:1.30.0
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: minio, key: rootUser } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio, key: rootPassword } }
            - name: AWS_DEFAULT_REGION
              value: minio
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              aws --endpoint-url http://backup-store.minio.svc.cluster.local:9000 s3 mb s3://velero 2>/dev/null || true
              printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > /tmp/cloud
              kubectl create secret generic velero-cloud-credentials -n velero --from-file=cloud=/tmp/cloud --dry-run=client -o yaml | kubectl apply -f -
              echo "velero bucket + credentials ready"
