# Console Deployment — HA Go BFF + React SPA (control-plane high availability).
# Image is built and pushed to GHCR by the open-infra CI pipeline.
# For prod, pin to a digest or a semver tag instead of "latest".
#
# HA profile (GovStack: the control plane MUST be configurable for HA):
#   - 2 replicas behind the Service. The BFF is STATELESS (every request reads the cluster fresh) and
#     the session-signing key is persisted to a Secret and read by every pod (console-api/auth.go), so
#     both replicas validate the same session cookies — safe to run N-up.
#   - topologySpread keeps the replicas on different nodes; a PodDisruptionBudget (pdb.yaml, minAvailable
#     1) stops a drain/upgrade from taking the last one; RollingUpdate maxUnavailable 0 = zero-downtime
#     rollout. Availability under a replica loss is PROVEN by the app-availability chaos oracle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: open-infra-console
  labels:
    app: console
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      serviceAccountName: console

      # Keep the two replicas on different nodes so a node loss can't take both (soft, so a
      # single-node cluster still schedules).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: console

      # Run as a non-privileged, non-root UID (distroless "nonroot" uid). seccompProfile
      # RuntimeDefault completes restricted Pod Security Standards compliance (with the
      # container securityContext below): non-root + RO-rootfs + no-priv-esc + drop-ALL + seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: console
          image: ghcr.io/harn3ss/open-infra-console:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            # Console authentication. Chosen at install time:
            #   local (default) — users in the console-auth Secret, bcrypt hashed. On
            #                     first start a root password is generated and printed
            #                     ONCE to this pod's log; grab it, then rotate by
            #                     deleting the Secret.
            #   ldap / oidc     — reserved (next phase).
            #   none            — NO authentication. Only for throwaway dev clusters:
            #                     /api/k8s/* proxies the Kubernetes API with this pod's
            #                     ServiceAccount, so anyone who can reach it is admin.
            - name: AUTH_MODE
              value: "local"
            - name: CLUSTER_NAME
              value: "open-infra"
            # Distributed tracing (#67): export spans to Tempo's OTLP receiver. The
            # http:// scheme selects an insecure in-cluster gRPC connection. Unset to
            # disable tracing.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4317"
            # Same-origin Grafana embedding: the BFF reverse-proxies /grafana/* to
            # the in-cluster Grafana (which serves_from_sub_path under /grafana),
            # and the SPA embeds dashboards at the relative /grafana. No CORS, no
            # cross-origin cookies, no site-specific URL.
            - name: GRAFANA_BASE_URL
              value: "/grafana"
            - name: GRAFANA_PROXY_TARGET
              value: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local"
            # Loki, for the Audit view (queries the shipped k3s audit log + console iam logs).
            - name: LOKI_URL
              value: "http://loki.monitoring.svc.cluster.local:3100"
            # Prometheus, for live node disk usage on the Nodes page (node-exporter metrics).
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            # Use the SCOPED MinIO identity (openinfra-console, readwrite but no admin API),
            # not the root secret — minted by platform/console/console-minio-user.yaml.
            - name: MINIO_SECRET_NAME
              value: "console-minio-creds"
            # Fault injection (Chaos) is a privileged, non-essential capability, so it is
            # OFF by default (least functionality, NIST CM-7): the console hides the surface
            # entirely unless a deployment opts in. Set to "true" on a test/non-production cluster.
            - name: CHAOS_UI_ENABLED
              value: "false"

          # Lightweight probes on the /healthz endpoint exposed by the Go BFF.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
