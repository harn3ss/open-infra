# Console user roles ("IAM" for open-infra).
#
# The console signs a user in, then proxies their Kubernetes calls with
# Impersonate-User: openinfra:<user> and Impersonate-Group: openinfra:<group>, so
# KUBERNETES RBAC decides what they can do — not application code. That means a
# read-only user is read-only even if a console bug would have let them click
# delete, and every action is attributable in the audit log.
#
#   root / admin -> openinfra:admins      full access (same rights the console has)
#   poweruser    -> openinfra:powerusers  manage resources, but not secrets or RBAC
#   readonly     -> openinfra:readers     get/list/watch only
#
# Before IAM policy was the authority (#360) everyone also landed in openinfra:users; nothing grants or
# impersonates it any more.
---
# 1. Let the console's ServiceAccount impersonate console users/groups. Without
#    this the API server rejects the Impersonate-* headers outright.
#
#    IMPORTANT: `impersonate` on groups with NO resourceNames is effectively
#    cluster-admin — the holder could impersonate system:masters and bypass every
#    other restriction. The group list is therefore pinned to exactly the console's
#    own groups. resourceNames works here because impersonation is a get-shaped
#    named check, not a list.
#
#    Usernames can't be enumerated the same way (they're open-ended), and RBAC
#    cannot express a prefix. But every console identity is minted as
#    `openinfra:<user>`, and Kubernetes binds real power to control-plane user
#    names (system:kube-controller-manager can mint any ServiceAccount's token),
#    so the annotation below holds impersonate-users to `openinfra:*` in the Cedar
#    corpus — the authoritative authorizer (rbac-to-cedar reads it). RBAC alone, the
#    fallback while the webhook is down, still allows any user name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-infra-console-impersonator
  annotations:
    # openinfra:* covers both identity forms: openinfra:<user> (legacy, with the groups below) and
    # openinfra:<account>:<user> (once IAM policy is the authority: no groups, generated bindings).
    openinfra.dev/impersonate-users: "openinfra:*"
rules:
  - apiGroups: [""]
    resources: [groups]
    verbs: [impersonate]
    resourceNames:
      - openinfra:admins
      - openinfra:powerusers
      - openinfra:readers
      # Not openinfra:users: the implicit group every principal carried before IAM policy became the
      # authority (#360) is impersonated by nothing once it decides (the IAM cutover's step 4). Rolling
      # the cutover back past step 3 needs it here again.
  - apiGroups: [""]
    resources: [users]
    verbs: [impersonate]
---
# 1b. The BFF's own endpoints (snapshots, restores) act with this ServiceAccount rather
#     than through the impersonating proxy, so before doing the work they ask the API
#     server whether the SIGNED-IN user could perform the equivalent action, via a
#     SubjectAccessReview, and fail closed. That keeps the authorization decision and
#     the actual access from diverging, and puts the check in the audit log against a
#     person. Creating a SubjectAccessReview only ASKS a question — it grants nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-infra-console-authz-check
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-infra-console-authz-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-infra-console-authz-check
subjects:
  - kind: ServiceAccount
    name: console
    namespace: open-infra-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-infra-console-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-infra-console-impersonator
subjects:
  - kind: ServiceAccount
    name: console
    namespace: open-infra-console
---
# 2b. Break-glass: the management account's root, as the account-qualified identity names it
#     (openinfra:000000000000:root), holds everything the console can do through RBAC alone, so
#     neither a regenerated corpus nor a missing IAM grant can lock root out, and nothing generated
#     from IAM policy is in the way. The authorization webhook's root floor (BREAK_GLASS_ROOT) is the
#     same guarantee on the Cedar side. Hand-written on purpose, and the ONE user binding the
#     rbac-user-authority check allows outside the generated set. The name "root" is reserved for
#     this account at every door that creates principals. The legacy identity (openinfra:root) is
#     deliberately not bound by name: that name alone is not proof of root.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-root-break-glass
  labels: { openinfra.dev/break-glass: "true" }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-infra-console
subjects:
  - kind: User
    name: openinfra:000000000000:root
    apiGroup: rbac.authorization.k8s.io
---
# 3. Power users: manage open-infra resources and workloads, but NOT secrets
#    (credentials) or RBAC. Read-only elsewhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-infra-poweruser
rules:
  - apiGroups: [openinfra.dev]
    resources:
      - applications
      - functions
      - models
      - virtualmachines
      - vmimages
      - volumes
      - fileshares
      - directories
      - migrations
      - replications
      - dataflows
      - streams
      - securitygroups
      - faultinjections
      - queries
      - httpapis
      - graphqlapis
      - databaseproxies
      - statemachines
      - executions
      - trainingjobs
      - modelpackages
      - batchtransforms
      - tuningjobs
      - processingjobs
      - modelmonitors
      - scheduledjobs
      - autoscalinggroups
      - featuregroups
      - staticsites
      - parameters
      - emailsenders
      - buckets
      - queues
      - tables
      - backupplans
      - backupvaults
      - configrules
      # aws-shim coarse authz scopes (#345.6 / #347 Phase 0.2): repositories = ECR
      # (registry login/push/pull), secrets = Secrets Manager. These are the shim's OWN
      # resource types (split off "applications"), so a power user keeps ECR + Secrets
      # Manager once the shim gates on them. NOTE: "secrets" here is secrets.openinfra.dev
      # (apiGroup openinfra.dev), NOT core k8s Secrets — the "NOT secrets/RBAC" above still
      # holds (no apiGroups:[""] secrets, no rbac.authorization.k8s.io here).
      - repositories
      - secrets
      # kube-ovn networking family (#120)
      - vpcs
      - subnets
      - natgateways
      - elasticips
      - transitgateways
      - flowlogs
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims, nodes, namespaces, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [kubevirt.io, cdi.kubevirt.io, snapshot.storage.k8s.io, postgresql.cnpg.io, k8s.mariadb.com]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachineinstances/vnc, virtualmachineinstances/console]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
# 4. Readers: look, don't touch. Deliberately excludes secrets — reading a
#    connection Secret is equivalent to holding the database password.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-infra-readonly
rules:
  - apiGroups: [openinfra.dev]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims, nodes, namespaces, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [kubevirt.io, cdi.kubevirt.io, snapshot.storage.k8s.io, postgresql.cnpg.io, k8s.mariadb.com]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
