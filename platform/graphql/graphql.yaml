# open-infra GraphQL engine (Hasura) — the backend behind the shim's AppSync surface.
#
# Opt-in, OFF by default (components.graphql). AppSync's data plane is GraphQL-over-HTTP; this is
# the REAL GraphQL engine it fronts (over a dedicated CloudNativePG Postgres), so "AppSync via the
# shim" is a genuine SigV4-authenticated path to a real engine, not an emulator. The aws-shim's
# `appsync` service proxies to hasura.open-infra-graphql.svc.cluster.local:8080 and delegates
# per-role authorization to Hasura (see docs/aws-shim.md).
---
apiVersion: v1
kind: Namespace
metadata:
  name: open-infra-graphql
  labels:
    openinfra.dev/component: graphql
---
# Dedicated Postgres for the engine (metadata + data), via the CloudNativePG operator. CNPG
# generates the `graphql-db-app` Secret (with a ready-to-use `uri` connection string) and the
# `graphql-db-rw` Service.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: graphql-db
  namespace: open-infra-graphql
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: local-path # NEVER CIFS/NFS
  bootstrap:
    initdb:
      database: hasura
      owner: app
---
# Admin-secret bootstrap: generate a random Hasura admin secret into `hasura-admin` if absent.
# Sync hook (not a tracked resource) — mirrors the valkey-secret-bootstrap pattern; the Hasura
# Deployment retries (CreateContainerConfigError) until this lands.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hasura-secret-bootstrap
  namespace: open-infra-graphql
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hasura-secret-bootstrap
  namespace: open-infra-graphql
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hasura-secret-bootstrap
  namespace: open-infra-graphql
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: hasura-secret-bootstrap }
subjects:
  - kind: ServiceAccount
    name: hasura-secret-bootstrap
    namespace: open-infra-graphql
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hasura-secret-bootstrap
  namespace: open-infra-graphql
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: hasura-secret-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: alpine/k8s:1.30.0
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              if kubectl -n open-infra-graphql get secret hasura-admin >/dev/null 2>&1; then
                echo "hasura-admin already exists"; exit 0
              fi
              SK=$(head -c 32 /dev/urandom | md5sum | cut -c1-32)
              kubectl -n open-infra-graphql create secret generic hasura-admin \
                --from-literal=adminSecret="$SK"
              echo "hasura-admin created"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasura
  namespace: open-infra-graphql
  labels: { app: hasura }
spec:
  replicas: 1
  selector:
    matchLabels: { app: hasura }
  template:
    metadata:
      labels: { app: hasura }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: hasura
          image: hasura/graphql-engine:v2.42.0
          ports:
            - name: http
              containerPort: 8080
          env:
            # CNPG's app secret ships a ready-to-use connection URI.
            - { name: HASURA_GRAPHQL_DATABASE_URL, valueFrom: { secretKeyRef: { name: graphql-db-app, key: uri } } }
            - { name: HASURA_GRAPHQL_ADMIN_SECRET, valueFrom: { secretKeyRef: { name: hasura-admin, key: adminSecret } } }
            # The web console is off (the shim + GraphQL clients are the interface); no anonymous role.
            - { name: HASURA_GRAPHQL_ENABLE_CONSOLE, value: "false" }
            - { name: HASURA_GRAPHQL_ENABLE_TELEMETRY, value: "false" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: hasura
  namespace: open-infra-graphql
  labels: { app: hasura }
spec:
  type: ClusterIP
  selector: { app: hasura }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
