# cert-manager — TLS ("ACM"). Self-signed cluster issuer for LAN (dev) and a
# Let's Encrypt issuer for public certs (prod). Issuers are created by a small
# post-sync job / the openinfra-config app based on config.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # CRDs early; other components depend on it
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.15.3
    helm:
      values: |
        installCRDs: true
        global:
          leaderElection:
            namespace: cert-manager
        # NameConstraints lets the platform root CA (cluster-ca.yaml) limit what names it can vouch
        # for. It is alpha in v1.15, so both the controller and the webhook need the gate.
        featureGates: NameConstraints=true
        # Production HA (#26): a leader-elected pair for each component — leaderElection is
        # already enabled, so the second controller/cainjector is a warm standby, and the
        # webhook (stateless) load-balances. A PodDisruptionBudget keeps ≥1 up through a
        # node drain / rollout, and soft pod-anti-affinity spreads the pair across nodes when
        # capacity allows (preferred, so it never blocks scheduling on a small cluster).
        replicaCount: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: cert-manager
                      app.kubernetes.io/component: controller
        webhook:
          featureGates: NameConstraints=true
          replicaCount: 2
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/instance: cert-manager
                        app.kubernetes.io/component: webhook
        cainjector:
          replicaCount: 2
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/instance: cert-manager
                        app.kubernetes.io/component: cainjector
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
