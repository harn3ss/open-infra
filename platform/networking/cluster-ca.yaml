# The cluster's own certificate authority, for LAN-facing endpoints a browser or a client must trust.
#
# openinfra-issuer (cluster-issuer.yaml) self-signs every certificate separately, so there is nothing a
# client can trust once for all of them. This file adds a root CA, created once by cert-manager and kept
# in its namespace, and a CA-type ClusterIssuer `openinfra-ca` that signs with it. Trust the root once and
# every certificate `openinfra-ca` issues is trusted. Its certificate is public; the platform publishes it
# (platform/aws-shim/platform-ca-publisher.yaml), so it is read without touching the key's Secret:
#
#   kubectl get environmentconfig openinfra-platform-ca -o jsonpath='{.data.platformRootCA}' > openinfra-root-ca.crt
#
# then add openinfra-root-ca.crt to the OS or browser trust store (or pass it to a client, e.g.
# `curl --cacert`, `AWS_CA_BUNDLE`, `SSL_CERT_FILE`). Use the issuer with the annotation
# `cert-manager.io/cluster-issuer: openinfra-ca` on an Ingress.
#
# Only platform namespaces may use it. cert-manager lets any namespace use a ClusterIssuer, and a
# tenant who can create a Certificate (the stock edit/admin roles can) would otherwise get a cert for
# any name, signed by a root that clients trust. The admission policy below refuses openinfra-ca
# Certificates and CertificateRequests outside the namespaces it lists. That covers Ingress
# annotations, DatabaseProxy spec.tls.issuerRef, and anything else that makes a cert-manager
# Certificate. Tenants keep openinfra-issuer (self-signed) and their own namespaced Issuers.
#
# The root itself and its CA-type ClusterIssuer are in cluster-ca-root.yaml; once the platform's CAs move
# into OpenBao (openbao.platformCAs), the root goes offline, that file is excluded, and openinfra-ca signs
# through OpenBao (security/openbao-issuers.yaml). The admission policy below applies either way.
---
# openinfra-ca issues only in platform namespaces (see the header). To let another platform namespace
# use it, add the namespace to the list below. cert-manager is one because a ClusterIssuer's CA lives
# there: the validated-domain CA (openinfra-acm, install.sh certificates.validatedDomains) is an
# intermediate this root signs, name-constrained to the operator's validated domains. openbao holds the
# listener certificate of the platform's key service (security/openbao.yaml). Only cluster
# administrators can create anything in these namespaces. Kubernetes CSRs that name the issuer as signer are
# refused too, in case cert-manager's CSR signing is ever turned on.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-ca-issuance
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [open-infra-aws-shim, open-infra-ecr, cert-manager, openbao]
    resourceRules:
      - apiGroups: [cert-manager.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [certificates, certificaterequests]
      - apiGroups: [certificates.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [certificatesigningrequests]
  validations:
    - expression: >-
        request.resource.group != 'cert-manager.io'
        || !has(object.spec.issuerRef)
        || !(object.spec.issuerRef.name == 'openinfra-ca'
             && has(object.spec.issuerRef.kind) && object.spec.issuerRef.kind == 'ClusterIssuer'
             && (!has(object.spec.issuerRef.group) || object.spec.issuerRef.group in ['', 'cert-manager.io']))
      reason: Forbidden
      message: "the openinfra-ca ClusterIssuer signs only for platform namespaces; use openinfra-issuer or a namespaced Issuer of your own"
    - expression: >-
        request.resource.group != 'certificates.k8s.io'
        || object.spec.signerName != 'clusterissuers.cert-manager.io/openinfra-ca'
      reason: Forbidden
      message: "the openinfra-ca ClusterIssuer does not sign Kubernetes CertificateSigningRequests"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-ca-issuance
spec:
  policyName: openinfra-ca-issuance
  validationActions: [Deny]
