# One kind: Subnet claim -> one kube-ovn Subnet (kubeovn.io/v1), rendered via provider-kubernetes.
# private=true maps to OVN-enforced isolation; allowSubnets punches explicit holes. Mirrors the
# securitygroup composition pattern (function-go-templating -> provider-kubernetes Object -> ready).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: subnet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef: { apiVersion: openinfra.dev/v1, kind: XSubnet }
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef: { name: crossplane-contrib-function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: subnet
            spec:
              forProvider:
                manifest:
                  apiVersion: kubeovn.io/v1
                  kind: Subnet
                  metadata:
                    name: {{ $name }}
                    labels: { openinfra.dev/subnet: {{ $name }} }
                  spec:
                    protocol: IPv4
                    cidrBlock: {{ $spec.cidr }}
                    natOutgoing: true
                    {{- /* NB: do NOT use `default true` here — sprig's default treats the bool false
                           as empty, so `private: false` would render as true (a public subnet would be
                           silently private). The XRD defaults private to true, so render it directly. */}}
                    {{- if hasKey $spec "private" }}
                    private: {{ $spec.private }}
                    {{- else }}
                    private: true
                    {{- end }}
                    {{- if $spec.vpc }}
                    vpc: {{ $spec.vpc }}
                    {{- end }}
                    {{- if $spec.gateway }}
                    gateway: {{ $spec.gateway }}
                    {{- end }}
                    {{- if $spec.namespaces }}
                    namespaces: {{ toYaml $spec.namespaces | nindent 22 }}
                    {{- end }}
                    {{- if $spec.allowSubnets }}
                    allowSubnets: {{ toYaml $spec.allowSubnets | nindent 22 }}
                    {{- end }}
                    {{- /* acls rendered authoritatively: an empty list clears them (provider-kubernetes
                           merges additively, so an omitted field would leave stale ACLs in place). */}}
                    {{- if $spec.acls }}
                    acls:
                    {{- range $acl := $spec.acls }}
                    {{- $dir := ternary "to-lport" "from-lport" (eq $acl.direction "ingress") }}
                    {{- $parts := list }}
                    {{- if $acl.cidr }}{{- if eq $acl.direction "ingress" }}{{- $parts = append $parts (printf "ip4.src == %s" $acl.cidr) }}{{- else }}{{- $parts = append $parts (printf "ip4.dst == %s" $acl.cidr) }}{{- end }}{{- end }}
                    {{- $proto := $acl.protocol | default "all" }}
                    {{- if ne $proto "all" }}{{- $parts = append $parts $proto }}{{- if $acl.port }}{{- $parts = append $parts (printf "%s.dst == %d" $proto (int $acl.port)) }}{{- end }}{{- end }}
                    {{- if not $parts }}{{- $parts = append $parts "ip4" }}{{- end }}
                    {{- $m := $acl.match | default (join " && " $parts) }}
                      - direction: {{ $dir }}
                        priority: {{ $acl.priority | default 1000 }}
                        match: "{{ $m }}"
                        action: {{ $acl.action }}
                    {{- end }}
                    {{- else }}
                    acls: []
                    {{- end }}
    - step: ready
      functionRef: { name: crossplane-contrib-function-auto-ready }
