# One kind: TransitGateway claim -> a subnet-less kube-ovn Vpc (the hub / transit router) that peers
# with every spoke and routes to every spoke's CIDR. Rendered via a provider-kubernetes Object.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: transitgateway
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef: { apiVersion: openinfra.dev/v1, kind: XTransitGateway }
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef: { name: crossplane-contrib-function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: hub
            spec:
              forProvider:
                manifest:
                  apiVersion: kubeovn.io/v1
                  kind: Vpc
                  metadata:
                    name: {{ $name }}
                    labels: { openinfra.dev/transitgateway: {{ $name }} }
                  spec:
                    vpcPeerings:
                    {{- range $spec.attachments }}
                      - remoteVpc: {{ .vpc }}
                        localConnectIP: {{ .hubConnectIP }}
                    {{- end }}
                    staticRoutes:
                    {{- range $spec.attachments }}
                      - cidr: {{ .cidr }}
                        nextHopIP: {{ .spokeConnectIP }}
                        policy: policyDst
                    {{- end }}
    - step: ready
      functionRef: { name: crossplane-contrib-function-auto-ready }
