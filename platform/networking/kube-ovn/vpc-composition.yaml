# One kind: Vpc claim -> one kube-ovn Vpc (kubeovn.io/v1) via provider-kubernetes.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: vpc
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef: { apiVersion: openinfra.dev/v1, kind: XVpc }
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef: { name: crossplane-contrib-function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $labels := .observed.composite.resource.metadata.labels | default dict }}
            {{- $name := (index $labels "crossplane.io/claim-name") | default .observed.composite.resource.metadata.name }}
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vpc
            spec:
              forProvider:
                manifest:
                  apiVersion: kubeovn.io/v1
                  kind: Vpc
                  metadata:
                    name: {{ $name }}
                    labels: { openinfra.dev/vpc: {{ $name }} }
                  spec:
                    {{- if $spec.namespaces }}
                    namespaces: {{ toYaml $spec.namespaces | nindent 22 }}
                    {{- end }}
    - step: ready
      functionRef: { name: crossplane-contrib-function-auto-ready }
