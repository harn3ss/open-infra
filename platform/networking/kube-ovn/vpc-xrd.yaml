# open-infra's kind: Vpc — an isolated tenant network domain, backed by a kube-ovn Vpc. Subnets in
# different VPCs are fully isolated from each other (real multi-tenant isolation, the AWS VPC model).
# REQUIRES kube-ovn; inert on Canal (see subnet-xrd.yaml).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xvpcs.openinfra.dev
  annotations:
    openinfra.dev/chaos-role: "none"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  group: openinfra.dev
  names: { kind: XVpc, plural: xvpcs }
  claimNames: { kind: Vpc, plural: vpcs }
  defaultCompositionRef: { name: vpc }
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                namespaces:
                  type: array
                  items: { type: string }
                  description: "Namespaces bound to this VPC (their default subnet lives here)."
                routes:
                  type: array
                  description: "Static routes — the VPC route table. e.g. cidr 0.0.0.0/0 -> nextHop a kind: NatGateway's internalIp, so private workloads reach the border device (and ingress replies return through it). Also carries peering/transit routes: a remote VPC's CIDR -> the peer link's far-side IP."
                  items:
                    type: object
                    required: [cidr, nextHop]
                    properties:
                      cidr: { type: string, description: "Destination CIDR, e.g. 0.0.0.0/0." }
                      nextHop: { type: string, description: "Next-hop IP (e.g. a NatGateway internalIp, or a peer link far-side IP)." }
                peerings:
                  type: array
                  description: "VPC peerings — a /30 interconnect to another kind: Vpc (AWS VPC Peering). Declare on BOTH VPCs (each names the other + its own /30 side) and add a spec.routes entry for the remote CIDR via the peer link. Non-transitive, like AWS — for hub-and-spoke transit use kind: TransitGateway."
                  items:
                    type: object
                    required: [remoteVpc, localConnectIP]
                    properties:
                      remoteVpc: { type: string, description: "The kind: Vpc on the other end." }
                      localConnectIP: { type: string, description: "This VPC's IP on the /30 link, e.g. 169.254.100.1/30 (the peer uses .2/30)." }
            status:
              type: object
              properties:
                ready: { type: boolean }
