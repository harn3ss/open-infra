# node-net-guard: two node-level packet rules the overlay alone doesn't provide.
#
# 1. Routed-VIP return path: replies to LAN clients go back through the router.
#    A routed (BGP) LoadBalancer VIP is reached through the router: client -> router -> node. If the
#    client shares the node's subnet, the node would answer it DIRECTLY over L2, so the router's
#    stateful firewall only ever sees one direction of the connection and drops the rest (the
#    handshake completes, then the connection hangs). mangle PREROUTING CONNMARKs a NEW connection
#    whose destination is in a BGP-advertised MetalLB pool; reply packets of that connection
#    (forwarded ones in PREROUTING, locally generated ones such as a hostNetwork ingress in OUTPUT)
#    get the fwmark back, and an ip rule routes that fwmark through the node's default gateway. The
#    routed pools are read from MetalLB (IPAddressPools referenced by a BGPAdvertisement), so no
#    addresses are configured here; with no BGP pools this part does nothing.
#
# 2. Service traffic with no backend is refused on the node, never routed out.
#    kube-ovn load-balances ClusterIPs in OVN and drops the VIP of a Service with no ready endpoints,
#    so a pod's call to such a Service reaches the node still addressed to the service CIDR. kube-ovn's
#    FORWARD rules accept service-CIDR traffic ahead of kube-proxy's "has no endpoints" REJECT, so the
#    packet was routed out the default route (masqueraded to the node IP) instead: the caller waited
#    for a timeout and the gateway received cluster-internal traffic. A NEW packet still addressed to
#    the service CIDR in FORWARD (after DNAT) has no backend by definition, so it is rejected first:
#    TCP reset for TCP, ICMP port-unreachable otherwise. The service CIDR comes from kube-ovn's own
#    ovn40services ipset; without kube-ovn this part does nothing.
#
# Stopping the pod removes everything it added, so deleting the DaemonSet is a full rollback.
# It runs in the kube-ovn image: that image is on every node already and its iptables (nf_tables
# backend) matches the host's.
apiVersion: v1
kind: ServiceAccount
metadata: { name: node-net-guard, namespace: kube-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: node-net-guard-read-pools, namespace: metallb-system }
rules:
  - apiGroups: ["metallb.io"]
    resources: ["ipaddresspools", "bgpadvertisements"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: node-net-guard-read-pools, namespace: metallb-system }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: node-net-guard-read-pools }
subjects: [ { kind: ServiceAccount, name: node-net-guard, namespace: kube-system } ]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: node-net-guard-script, namespace: kube-system }
data:
  node-net-guard.sh: |
    #!/bin/bash
    # Keeps the routed-VIP return-path and no-backend service REJECT rules in place; removes them on exit.
    set -u
    MARK="${MARK:-0x1000000}"          # one bit no other component uses (kube-proxy, kube-ovn use lower bits)
    TABLE="${TABLE:-2540}"
    PRIO="${PRIO:-5200}"
    INTERVAL="${INTERVAL:-30}"
    IPT="iptables -w 5"
    CH_PRE=OI-VIP-RETURN-PRE
    CH_OUT=OI-VIP-RETURN-OUT
    log() { echo "$(date -u +%FT%TZ) node-net-guard: $*"; }

    routed_cidrs() {
      # VIP_CIDRS (space-separated) overrides discovery.
      if [ -n "${VIP_CIDRS:-}" ]; then echo "$VIP_CIDRS"; return; fi
      local pools
      pools=$(kubectl -n metallb-system get bgpadvertisements -o jsonpath='{range .items[*]}{range .spec.ipAddressPools[*]}{@}{"\n"}{end}{end}' 2>/dev/null | sort -u)
      for p in $pools; do
        kubectl -n metallb-system get ipaddresspool "$p" -o jsonpath='{range .spec.addresses[*]}{@}{"\n"}{end}' 2>/dev/null
      done | grep -E '^[0-9.]+/[0-9]+$' | sort -u   # CIDR entries only; ranges (a-b) are skipped
    }

    ensure_chain() { # <chain> <hook>
      $IPT -t mangle -N "$1" 2>/dev/null || true
      $IPT -t mangle -C "$2" -j "$1" 2>/dev/null || $IPT -t mangle -I "$2" 1 -j "$1"
    }

    apply() {
      local cidrs="$1" gw="$2"
      ensure_chain $CH_PRE PREROUTING
      ensure_chain $CH_OUT OUTPUT
      local want_pre want_out
      want_pre=$(mktemp); want_out=$(mktemp)
      for c in $cidrs; do
        echo "-A $CH_PRE -d $c -m conntrack --ctstate NEW -j CONNMARK --set-xmark $MARK/$MARK" >> "$want_pre"
      done
      echo "-A $CH_PRE -m conntrack --ctdir REPLY -m connmark --mark $MARK/$MARK -j MARK --set-xmark $MARK/$MARK" >> "$want_pre"
      echo "-A $CH_OUT -m conntrack --ctdir REPLY -m connmark --mark $MARK/$MARK -j MARK --set-xmark $MARK/$MARK" >> "$want_out"
      for pair in "$CH_PRE:$want_pre" "$CH_OUT:$want_out"; do
        local ch=${pair%%:*} f=${pair#*:}
        if ! diff -q <(iptables-save -t mangle 2>/dev/null | grep -E "^-A $ch " ) "$f" >/dev/null 2>&1; then
          $IPT -t mangle -F "$ch"
          while read -r line; do $IPT -t mangle $line; done < "$f"
          log "programmed $ch: $(grep -c . "$f") rule(s)"
        fi
      done
      rm -f "$want_pre" "$want_out"
      ip rule show | grep -q "fwmark $MARK/$MARK lookup $TABLE" || ip rule add priority "$PRIO" fwmark "$MARK/$MARK" lookup "$TABLE"
      [ "$(ip route show table "$TABLE" 2>/dev/null | awk '/^default/{print $3}')" = "$gw" ] || ip route replace default via "$gw" table "$TABLE"
    }

    CH_SVC=OI-SVC-NO-BACKEND
    svc_reject() {
      # Only on kube-ovn nodes: the ovn40services ipset holds the service CIDR(s).
      if ! ipset list -n 2>/dev/null | grep -qx ovn40services; then
        [ "${svc_state:-}" = absent ] || log "no ovn40services ipset; service REJECT not applied"
        svc_state=absent; return
      fi
      $IPT -N $CH_SVC 2>/dev/null || true
      local want
      want=$(printf '%s\n' \
        "-A $CH_SVC -p tcp -m set --match-set ovn40services dst -m conntrack --ctstate NEW -j REJECT --reject-with tcp-reset" \
        "-A $CH_SVC -m set --match-set ovn40services dst -m conntrack --ctstate NEW -j REJECT --reject-with icmp-port-unreachable")
      if [ "$(iptables-save -t filter 2>/dev/null | grep -E "^-A $CH_SVC ")" != "$want" ]; then
        $IPT -F $CH_SVC
        while read -r line; do $IPT $line; done <<< "$want"
        log "programmed $CH_SVC"
      fi
      # Our jump must be FIRST in FORWARD, ahead of the ACCEPT rules that would let the packet through.
      if [ "$($IPT -S FORWARD 2>/dev/null | sed -n 2p)" != "-A FORWARD -j $CH_SVC" ]; then
        while $IPT -D FORWARD -j $CH_SVC 2>/dev/null; do :; done
        $IPT -I FORWARD 1 -j $CH_SVC
        [ "${svc_state:-}" = on ] && log "re-inserted the $CH_SVC jump at the top of FORWARD"
      fi
      [ "${svc_state:-}" = on ] || log "service traffic with no backend is rejected on this node"
      svc_state=on
    }

    cleanup() {
      log "removing rules"
      for pair in "$CH_PRE:PREROUTING" "$CH_OUT:OUTPUT"; do
        local ch=${pair%%:*} hook=${pair#*:}
        while $IPT -t mangle -D "$hook" -j "$ch" 2>/dev/null; do :; done
        $IPT -t mangle -F "$ch" 2>/dev/null; $IPT -t mangle -X "$ch" 2>/dev/null
      done
      while $IPT -D FORWARD -j $CH_SVC 2>/dev/null; do :; done
      $IPT -F $CH_SVC 2>/dev/null; $IPT -X $CH_SVC 2>/dev/null
      while ip rule del fwmark "$MARK/$MARK" lookup "$TABLE" 2>/dev/null; do :; done
      ip route flush table "$TABLE" 2>/dev/null
      exit 0
    }
    trap cleanup TERM INT

    last=""
    while true; do
      svc_reject
      cidrs=$(routed_cidrs | tr '\n' ' ' | sed 's/ *$//')
      gw=$(ip -4 route show default | awk 'NR==1{print $3}')
      if [ -z "$cidrs" ] || [ -z "$gw" ]; then
        [ "$last" = "idle" ] || log "no routed VIP pools or no default gateway; nothing to do"
        last=idle
      else
        apply "$cidrs" "$gw"
        [ "$last" = "$cidrs via $gw" ] || log "routed VIPs [$cidrs] reply via $gw"
        last="$cidrs via $gw"
      fi
      sleep "$INTERVAL" & wait $!
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-net-guard
  namespace: kube-system
  labels: { app.kubernetes.io/name: node-net-guard }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: node-net-guard } }
  updateStrategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1 } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: node-net-guard }
    spec:
      serviceAccountName: node-net-guard
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations: [ { operator: Exists } ]
      terminationGracePeriodSeconds: 20
      containers:
        - name: node-net-guard
          image: docker.io/kubeovn/kube-ovn:v1.14.41
          command: ["/bin/bash", "/script/node-net-guard.sh"]
          securityContext:
            privileged: false
            capabilities: { add: ["NET_ADMIN", "NET_RAW"], drop: ["ALL"] }
            runAsUser: 0
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: script, mountPath: /script }
            - { name: xtables-lock, mountPath: /run/xtables.lock }
      volumes:
        - name: script
          configMap: { name: node-net-guard-script, defaultMode: 0755 }
        - name: xtables-lock
          hostPath: { path: /run/xtables.lock, type: FileOrCreate }
