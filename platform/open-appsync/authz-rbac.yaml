# Field-level authorization for open-appsync.
#
# The engine enforces a resolver's `auth:` by POSTing a SubjectAccessReview for the CALLER's identity
# — which requires a ServiceAccount that can create subjectaccessreviews. Engine pods run
# per-GraphQLApi in the USER's namespace, and the Crossplane provider deliberately cannot create
# ServiceAccounts or RBAC (its permission boundary, provider-setup.yaml). So this RBAC is applied by
# the ROOT app (which can), and a small reconciler provisions the per-namespace engine SA and keeps
# ONE binding's subjects current — one entry per namespace that runs an auth-using GraphQLApi. Without
# an `auth:` requirement the composition keeps the immediate-start default SA and none of this is on
# the critical path.
#
# Security note: the reconciler holds create/update on clusterrolebindings so it can OWN the authorizer
# binding (a git-declared binding whose subjects grow per namespace would be reverted by ArgoCD's
# self-heal — the grant-reconciler owns its bindings the same way, not from git). The escalation guard
# bounds this: the reconciler possesses only { create subjectaccessreviews, create serviceaccounts,
# manage this binding, read graphqlapis }, so even if its (short-lived, CronJob) token were stolen it
# could bind only that low-risk set — never secrets, cluster-admin, or any higher role. Its ServiceAccount
# and binding writes are further held by name (resourceNames, and an admission policy for create) to the
# open-appsync ServiceAccounts and the open-appsync-authorizer binding. (That holds only while nothing
# else grants crossplane-system ServiceAccounts more — provider-setup.yaml binds by name, never the group.)
#
# Part of the OPT-IN openAppsync component; applied by the root app. The reconciler lives in
# crossplane-system (always present, alongside the other bespoke reconcilers).
---
# (1) The capability engine SAs receive: create SubjectAccessReviews (delegated authorization).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-appsync-authorizer
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
# (2) The reconciler's identity + least-privilege permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-appsync-authz-reconciler
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-appsync-authz-reconciler
rules:
  - apiGroups: [openinfra.dev]
    resources: [graphqlapis]
    verbs: [get, list]
  # Only the engine ServiceAccount (open-appsync, in any namespace) and only the authorizer binding.
  # RBAC cannot name an object at create time, so create stays unnamed here and the admission policy
  # below holds it to the same names.
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, patch]
    resourceNames: [open-appsync]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    verbs: [get, update, patch]
    resourceNames: [open-appsync-authorizer]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    verbs: [create]
  # Possess the authorizer capability itself, so it may bind that ClusterRole without `escalate`.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-appsync-authz-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-appsync-authz-reconciler
subjects:
  - kind: ServiceAccount
    name: open-appsync-authz-reconciler
    namespace: crossplane-system
---
# The reconciler's writes, held to what it is for: ServiceAccounts named open-appsync (carrying no
# instance-role annotation), and the one authorizer binding — roleRef open-appsync-authorizer, subjects
# only open-appsync ServiceAccounts. RBAC's resourceNames cannot cover create; this does.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: open-appsync-authz-reconciler-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [serviceaccounts]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [clusterrolebindings]
  matchConditions:
    - name: the-reconciler
      expression: "request.userInfo.username == 'system:serviceaccount:crossplane-system:open-appsync-authz-reconciler'"
  validations:
    - expression: >-
        request.resource.resource == 'serviceaccounts'
        ? object.metadata.name == 'open-appsync' &&
          !(has(object.metadata.annotations) && 'openinfra.dev/instance-role' in object.metadata.annotations)
        : object.metadata.name == 'open-appsync-authorizer' &&
          object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'open-appsync-authorizer' &&
          (!has(object.subjects) || object.subjects.all(s, s.kind == 'ServiceAccount' && s.name == 'open-appsync'))
      reason: Forbidden
      message: "open-appsync-authz-reconciler may write only open-appsync ServiceAccounts and the open-appsync-authorizer binding"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: open-appsync-authz-reconciler-scope
spec:
  policyName: open-appsync-authz-reconciler-scope
  # Deny, with an audit annotation (after a Warn + Audit canary).
  validationActions: [Deny, Audit]
---
# (3) The reconciler: ensure the engine SA in each auth-using GraphQLApi namespace, then set the
#     authorizer binding's subjects to exactly those SAs (apply = create-or-update, so the binding is
#     reconciler-owned and ArgoCD never reverts its subjects).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: open-appsync-authz-reconciler
  namespace: crossplane-system
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 300
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: open-appsync-authz-reconciler
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: reconcile
              image: alpine/k8s:1.30.0
              command: [/bin/sh, -ceu]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              env:
                - { name: HOME, value: /tmp }
              args:
                - |
                  # Namespaces running an auth-using GraphQLApi (any resolver/subscription with auth:).
                  nss=$(kubectl get graphqlapis.openinfra.dev -A -o json | jq -r '
                    [ .items[]
                      | select( ( ([.spec.resolvers[]?.auth] + [.spec.subscriptions[]?.auth]) | map(select(. != null)) | length ) > 0 )
                      | .metadata.namespace ] | unique | .[]')

                  # Ensure the engine ServiceAccount exists in each (idempotent apply).
                  for ns in $nss; do
                    kubectl create serviceaccount open-appsync -n "$ns" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
                  done

                  # Set the authorizer binding's subjects to exactly those SAs (create-or-update).
                  subjects=$(printf '%s\n' $nss | grep -v '^$' | jq -R '{kind:"ServiceAccount", name:"open-appsync", namespace:.}' | jq -s .)
                  jq -n --argjson subj "$subjects" '{
                    apiVersion: "rbac.authorization.k8s.io/v1", kind: "ClusterRoleBinding",
                    metadata: { name: "open-appsync-authorizer", labels: { "app.kubernetes.io/managed-by": "open-appsync-authz-reconciler" } },
                    roleRef: { apiGroup: "rbac.authorization.k8s.io", kind: "ClusterRole", name: "open-appsync-authorizer" },
                    subjects: $subj
                  }' | kubectl apply -f -
                  echo "authz-reconciler: bound open-appsync SAs in: $(echo $nss | tr '\n' ' ')"
          volumes:
            - { name: tmp, emptyDir: {} }
