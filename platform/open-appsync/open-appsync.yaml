# open-appsync — open-infra's resolver-first, VTL-faithful AWS AppSync engine.
#
# Opt-in, OFF by default (components.openAppsync). The aws-shim's `appsync` service fronts this
# engine (SigV4 → coarse IAM gate → forward to /graphql). It is on a graduation ladder: slice 1 is
# VTL over one DynamoDB-style data source (see open-appsync/README.md). Still
# EXPERIMENTAL / not counted as proven until its end-to-end probe runs on-cluster.
#
# This ships a working engine with a DEMO resolver config (a Todo API) backed by an in-memory data
# source, so it boots and serves real GraphQL without external deps. For durable data, switch the
# data source to `dynamodb` and point MONGO_URI at a FerretDB endpoint (see the ConfigMap comment).
---
apiVersion: v1
kind: Namespace
metadata:
  name: open-infra-open-appsync
  labels:
    openinfra.dev/component: open-appsync
---
# The declarative engine config: config.json (data sources + resolvers) + the VTL templates as
# sibling files (no escaping). To make it durable: set the data source type to "dynamodb" with a
# `collection`, and set MONGO_URI on the Deployment to a FerretDB endpoint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-appsync-config
  namespace: open-infra-open-appsync
data:
  config.json: |
    {
      "dataSources": [{ "name": "todos", "type": "memory" }],
      "resolvers": [
        { "type": "Query", "field": "getTodo", "dataSource": "todos", "request": "getTodo.request.vtl", "response": "response.vtl" },
        { "type": "Mutation", "field": "createTodo", "dataSource": "todos", "request": "createTodo.request.vtl", "response": "response.vtl" }
      ],
      "subscriptions": [
        { "field": "onCreateTodo", "response": "response.vtl", "triggeredBy": ["createTodo"] }
      ]
    }
  getTodo.request.vtl: |
    {
      "version": "2018-05-29",
      "operation": "GetItem",
      "key": { "id": $util.dynamodb.toDynamoDBJson($ctx.args.id) }
    }
  createTodo.request.vtl: |
    {
      "version": "2018-05-29",
      "operation": "PutItem",
      "key": { "id": $util.dynamodb.toDynamoDBJson($util.autoId()) },
      "attributeValues": $util.dynamodb.toMapValuesJson($ctx.args.input)
    }
  response.vtl: |
    $util.toJson($ctx.result)
---
# Dedicated SA (not the namespace default). If this demo ever grows a resolver with an
# auth: requirement, it is the subject the open-appsync-authz-reconciler binds to create
# subjectaccessreviews — see platform/open-appsync/authz-rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-appsync
  namespace: open-infra-open-appsync
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-appsync
  namespace: open-infra-open-appsync
  labels: { app: open-appsync }
spec:
  replicas: 1
  selector:
    matchLabels: { app: open-appsync }
  template:
    metadata:
      labels: { app: open-appsync }
    spec:
      serviceAccountName: open-appsync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: engine
          image: ghcr.io/harn3ss/open-infra-open-appsync:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: LISTEN_ADDR, value: ":8080" }
            - { name: CONFIG_DIR, value: "/etc/open-appsync" }
            # Distributed tracing (#67): export spans to Tempo (http:// = insecure gRPC).
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.monitoring.svc.cluster.local:4317" }
            # For durable data, add: MONGO_URI (a FerretDB endpoint) + MONGO_DB, and switch the
            # config's data source type to "dynamodb" with a collection.
          volumeMounts:
            - { name: config, mountPath: /etc/open-appsync }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap:
            name: open-appsync-config
---
apiVersion: v1
kind: Service
metadata:
  name: open-appsync
  namespace: open-infra-open-appsync
  labels: { app: open-appsync }
spec:
  type: ClusterIP
  selector: { app: open-appsync }
  ports:
    - name: http
      port: 80
      targetPort: 8080
