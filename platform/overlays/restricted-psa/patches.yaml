# Generated restricted-PSA securityContext patches (see kustomization.yaml). Regenerate with the
# generator in the commit that introduced this overlay if base workloads change.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: console-iam-setup
  namespace: minio
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: setup
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: &id001
            drop:
            - ALL
      initContainers:
      - name: fetch-mc
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: *id001
---
