# Nightly Chaos Suite — the containment foundation (safety model, §3 of the design).
# Nothing the suite does may endanger the one real cluster, so the blast radius is
# built BEFORE any fault. This file is pure containment: a disposable namespace, a
# resource cap, an evict-me-first priority, and a ServiceAccount ("runner creds =
# chaos creds") that can fully manage the sandbox and MUTATE NOTHING outside it.
#
# The only cluster-scoped grant is READ-ONLY pod list, used solely by the pre-flight
# guard to prove a fault selector can't match a pod outside the sandbox.
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-sandbox
  labels:
    openinfra.dev/purpose: chaos-sandbox
    # Everything the suite creates lives here; the data under fault is disposable.
---
# Sandbox pods are the lowest-priority workloads on the cluster: under node pressure
# they are evicted FIRST, so the GPU workloads and HA VMs are protected by the
# scheduler, not by hope. Non-preempting — it never evicts anything else.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: chaos-sandbox-low
value: -100
globalDefault: false
preemptionPolicy: Never
description: "Nightly chaos sandbox — evicted first under pressure, preempts nothing."
---
# A runaway scenario cannot exceed this slice.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: chaos-sandbox-quota
  namespace: chaos-sandbox
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "40"
    persistentvolumeclaims: "12"
    requests.storage: 24Gi
---
# Default + ceiling per container, so an unbounded pod can't be authored by accident.
apiVersion: v1
kind: LimitRange
metadata:
  name: chaos-sandbox-limits
  namespace: chaos-sandbox
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
      max: { cpu: "2", memory: 4Gi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-runner
  namespace: chaos-sandbox
---
# The self-hosted runner authenticates to the cluster AS this SA (runner creds = chaos creds);
# its kubeconfig carries the token from THIS Secret. Git-managing it — rather than a one-off
# `kubectl create token` — is what makes the credential DURABLE: if it is ever deleted (e.g. a
# too-broad `kubectl -n chaos-sandbox delete secret --all` during sandbox cleanup, which is
# exactly what silently 401'd the nightly on 2026-08-01), Argo recreates it. ServerSideApply lets
# the token controller own `data`, so Argo manages only metadata/type and never churns the token;
# Prune=false keeps it even through a partial sync. If it is ever recreated the token value
# changes — refresh the runner kubeconfig from it then (kubectl get secret … -o jsonpath .data.token).
apiVersion: v1
kind: Secret
metadata:
  name: chaos-runner-token
  namespace: chaos-sandbox
  annotations:
    kubernetes.io/service-account.name: chaos-runner
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
type: kubernetes.io/service-account-token
---
# WRITE authority is namespace-scoped to chaos-sandbox ONLY. The runner can provision
# ephemeral members, wire a multi-master flow, inject faults, run the harness as a Job,
# and tear it all down — all inside the sandbox. It has NO cluster-scoped write and no
# access to any other namespace, so a fat-fingered selector is rejected by the API
# server, not merely discouraged.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-runner
  namespace: chaos-sandbox
rules:
  - apiGroups: ["openinfra.dev"]
    resources: [faultinjections, databases, dataflows, replications, queries]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, persistentvolumeclaims, services, configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    # pods/exec: seed/inspect the ephemeral members via kubectl exec (sandbox only).
    # pods/attach: the proof-of-fire probe uses `kubectl debug --attach`, which needs BOTH
    # ephemeralcontainers (below) to inject the busybox AND attach to read its output. Without
    # attach, kubectl silently falls back to log-streaming, the probe reads nothing, and every
    # cut reads as "not down" → INCONCLUSIVE (exactly what 401'd... rather, no-op'd the
    # 2026-08-01 nightly after the credential fix). Both are `create`.
    resources: [pods/exec, pods/attach]
    verbs: [create]
  - apiGroups: [""]
    # proof-of-fire probe (oracle pillar 1): attach an ephemeral busybox to the a→b sink pod
    # to witness, from the mesh's own netns, that the partition actually cut the link to pg-b.
    # Sandbox-scoped; read-only witness, cannot change or destroy anything. See docs/chaos-oracle.md.
    resources: [pods/ephemeralcontainers]
    verbs: [get, patch, update]
  - apiGroups: [postgresql.cnpg.io]
    # Scenario 4 provisions disposable CNPG clusters to test a real primary failover.
    # Sandbox-scoped like everything else: the runner cannot touch managed databases
    # in any other namespace.
    resources: [clusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [chaos-mesh.org]
    # READ-ONLY. Crossplane renders these from a FaultInjection; the runner only needs to
    # OBSERVE them to prove a fault actually materialised (it must never author raw chaos).
    resources: [networkchaos, podchaos, stresschaos, timechaos, iochaos]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets, deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-runner
  namespace: chaos-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-runner
subjects:
  - kind: ServiceAccount
    name: chaos-runner
    namespace: chaos-sandbox
---
# The ONLY cluster-scoped grant: READ-ONLY list of pods, namespaces and nodes. pods +
# namespaces let the blast-radius pre-flight prove a fault's selector matches nothing
# outside chaos-sandbox; nodes let the capacity pre-flight (preflight-capacity.sh) sum
# allocatable headroom so a capacity-starved cluster aborts INCONCLUSIVE instead of
# timing out as a false red. Read-only by design — it cannot change or destroy anything,
# cluster-wide or otherwise.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-runner-preflight-readonly
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-runner-preflight-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-runner-preflight-readonly
subjects:
  - kind: ServiceAccount
    name: chaos-runner
    namespace: chaos-sandbox
