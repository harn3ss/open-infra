# Nightly Chaos Suite — the containment foundation (the safety model).
# Nothing the suite does may endanger the one real cluster, so the blast radius is
# built BEFORE any fault. This file is pure containment: a disposable namespace, a
# resource cap, an evict-me-first priority, and a ServiceAccount ("runner creds =
# chaos creds") that can fully manage the sandbox and MUTATE NOTHING outside it.
#
# The only cluster-scoped grant is READ-ONLY pod list, used solely by the pre-flight
# guard to prove a fault selector can't match a pod outside the sandbox.
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-sandbox
  labels:
    openinfra.dev/purpose: chaos-sandbox
    # Everything the suite creates lives here; the data under fault is disposable.
  annotations:
    # Blast-zone containment, universally: force EVERY pod in this namespace onto the disposable
    # chaos nodes, whatever kind creates it. The PodNodeSelector plugin injects the nodeSelector;
    # PodTolerationRestriction injects the toleration for the chaos taint. This lets the sandbox
    # host realistic multi-resource workloads (Application/Database/Migration/Stream/VM/…) without
    # a scheduling passthrough in every composition. REQUIRES the two admission plugins enabled in
    # the k3s server (kube-apiserver-arg in /etc/rancher/k3s/config.yaml — a host-local change,
    # like the audit args; documented in the chaos-suite memory). Harmless if they're not enabled.
    scheduler.alpha.kubernetes.io/node-selector: "openinfra.dev/chaos=true"
    scheduler.alpha.kubernetes.io/defaultTolerations: '[{"key":"openinfra.dev/chaos","operator":"Equal","value":"true","effect":"NoSchedule"}]'
---
# Sandbox pods are the lowest-priority workloads on the cluster: under node pressure
# they are evicted FIRST, so the GPU workloads and HA VMs are protected by the
# scheduler, not by hope. Non-preempting — it never evicts anything else.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: chaos-sandbox-low
value: -100
globalDefault: false
preemptionPolicy: Never
description: "Nightly chaos sandbox — evicted first under pressure, preempts nothing."
---
# A runaway scenario cannot exceed this slice.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: chaos-sandbox-quota
  namespace: chaos-sandbox
spec:
  hard:
    # requests are the real RESERVATION and stay tightly bounded — a whole sandbox reserves <=4 cores /
    # 8Gi regardless of scenario. limits are only a CEILING on the sum of per-pod caps, not reserved
    # capacity; a full multi-master MESH (the generated-mesh scenario: a 3-master mesh is ~12 replication-
    # engine pods + 3 Postgres + transient mm-prep Jobs) needs a bigger limit-budget or its capture/sink
    # pods are quota-rejected mid-mesh and it silently diverges. Nodes sit at ~3% so this over-commits
    # limits safely (actual use tracks requests).
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "24"
    limits.memory: 24Gi
    pods: "40"
    persistentvolumeclaims: "12"
    requests.storage: 24Gi
---
# Default + ceiling per container, so an unbounded pod can't be authored by accident.
apiVersion: v1
kind: LimitRange
metadata:
  name: chaos-sandbox-limits
  namespace: chaos-sandbox
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
      max: { cpu: "2", memory: 4Gi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-runner
  namespace: chaos-sandbox
---
# The self-hosted runner authenticates to the cluster AS this SA (runner creds = chaos creds);
# its kubeconfig carries the token from THIS Secret. Git-managing it — rather than a one-off
# `kubectl create token` — is what makes the credential DURABLE: if it is ever deleted (e.g. a
# too-broad `kubectl -n chaos-sandbox delete secret --all` during sandbox cleanup, which is
# exactly what silently 401'd the nightly on 2026-08-01), Argo recreates it. ServerSideApply lets
# the token controller own `data`, so Argo manages only metadata/type and never churns the token;
# Prune=false keeps it even through a partial sync. If it is ever recreated the token value
# changes — refresh the runner kubeconfig from it then (kubectl get secret … -o jsonpath .data.token).
# ⚠️ NEVER `kubectl apply` this file CLIENT-SIDE: a 3-way merge sets data:{} and CLEARS the controller-
# populated token → the runner's kubeconfig token is rejected 401 → every scenario fails "server has
# asked for the client to provide credentials" (hit 2026-08-13). Let Argo sync it, or use
# `kubectl apply --server-side`. Recovery: delete+recreate the Secret (controller repopulates a fresh
# non-expiring token), then refresh the runner kubeconfig as above.
apiVersion: v1
kind: Secret
metadata:
  name: chaos-runner-token
  namespace: chaos-sandbox
  annotations:
    kubernetes.io/service-account.name: chaos-runner
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
type: kubernetes.io/service-account-token
---
# WRITE authority is namespace-scoped to chaos-sandbox ONLY. The runner can provision
# ephemeral members, wire a multi-master flow, inject faults, run the harness as a Job,
# and tear it all down — all inside the sandbox. It has NO cluster-scoped write and no
# access to any other namespace, so a fat-fingered selector is rejected by the API
# server, not merely discouraged.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-runner
  namespace: chaos-sandbox
rules:
  - apiGroups: ["openinfra.dev"]
    # The full WORKLOAD plane, so the sandbox can compose realistic multi-resource chains (not
    # just multi-master). Still namespace-scoped to chaos-sandbox — creating any of these
    # elsewhere is rejected by the API server. `functions` are CPU-only here (the echo function in
    # the database->stream->function chain requests no GPU) and the namespace pins pods to the chaos
    # nodes; only Model (and any GPU-requesting Function) and VmImage stay excluded — no GPU / build
    # infra on the chaos nodes, so they aren't blast-zone-runnable regardless of RBAC.
    resources: [faultinjections, applications, databases, dataflows, replications, migrations,
                streams, functions, queries, fileshares, directories, volumes, securitygroups,
                virtualmachines]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, persistentvolumeclaims, services, configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    # pods/exec: seed/inspect the ephemeral members via kubectl exec (sandbox only).
    # pods/attach: the proof-of-fire probe uses `kubectl debug --attach`, which needs BOTH
    # ephemeralcontainers (below) to inject the busybox AND attach to read its output. Without
    # attach, kubectl silently falls back to log-streaming, the probe reads nothing, and every
    # cut reads as "not down" → INCONCLUSIVE (exactly what 401'd... rather, no-op'd the
    # 2026-08-01 nightly after the credential fix). Both are `create`.
    resources: [pods/exec, pods/attach]
    verbs: [create]
  - apiGroups: [""]
    # proof-of-fire probe (oracle pillar 1): attach an ephemeral busybox to the a→b sink pod
    # to witness, from the mesh's own netns, that the partition actually cut the link to pg-b.
    # Sandbox-scoped; read-only witness, cannot change or destroy anything. See docs/chaos-oracle.md.
    resources: [pods/ephemeralcontainers]
    verbs: [get, patch, update]
  - apiGroups: [postgresql.cnpg.io]
    # Scenario 4 provisions disposable CNPG clusters to test a real primary failover.
    # Sandbox-scoped like everything else: the runner cannot touch managed databases
    # in any other namespace.
    resources: [clusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [chaos-mesh.org]
    # READ-ONLY. Crossplane renders these from a FaultInjection; the runner only needs to
    # OBSERVE them to prove a fault actually materialised (it must never author raw chaos).
    resources: [networkchaos, podchaos, stresschaos, timechaos, iochaos]
    verbs: [get, list, watch]
  - apiGroups: [serving.knative.dev]
    # READ-ONLY. The delivered-path serverless scenario provisions a kind: Function; Crossplane
    # renders the Knative Service (ksvc). The runner only OBSERVES it to confirm the function is
    # Ready before driving invocations — without this a Forbidden read masquerades as "Knative absent".
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets, deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-runner
  namespace: chaos-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-runner
subjects:
  - kind: ServiceAccount
    name: chaos-runner
    namespace: chaos-sandbox
---
# The ONLY cluster-scoped grant: READ-ONLY list of pods, namespaces and nodes. pods +
# namespaces let the blast-radius pre-flight prove a fault's selector matches nothing
# outside chaos-sandbox; nodes let the capacity pre-flight (preflight-capacity.sh) sum
# allocatable headroom so a capacity-starved cluster aborts INCONCLUSIVE instead of
# timing out as a false red. Read-only by design — it cannot change or destroy anything,
# cluster-wide or otherwise.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-runner-preflight-readonly
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-runner-preflight-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-runner-preflight-readonly
subjects:
  - kind: ServiceAccount
    name: chaos-runner
    namespace: chaos-sandbox
---
# Stream-plane scenarios (kind: Stream / the database->stream->function chain) read the durable
# JetStream stream + the function's consumer by running an EPHEMERAL natsio/nats-box client in the nats
# namespace (`kubectl -n nats run --rm -i ...`) — the no-loss count is JetStream metadata, only readable
# from inside the mesh. Without this the run's SA cannot create that pod, the read returns empty, and the
# stream-live proof-of-fire never passes: the scenario voids INCONCLUSIVE forever instead of verifying.
# Scoped to just the throwaway client (pods + attach/log) in the nats namespace — no secrets, no
# configmaps, nothing else — so it stays a read-only NATS client, not a foothold in the messaging tier.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-runner-nats-client
  namespace: nats
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/attach, pods/log]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-runner-nats-client
  namespace: nats
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-runner-nats-client
subjects:
  - kind: ServiceAccount
    name: chaos-runner
    namespace: chaos-sandbox
