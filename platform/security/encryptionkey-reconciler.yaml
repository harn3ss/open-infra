# Reconciler for kind: EncryptionKey — provisions a Vault Transit key per EncryptionKey and reflects
# its live state into a ConfigMap the console reads. Part of the OPT-IN `encryption` component.
#
# Least privilege on BOTH sides:
#   * Kubernetes: read EncryptionKeys, write only the state ConfigMaps in the console namespace.
#   * Vault: an AppRole scoped to create/read/rotate transit/keys/* — NOT destroy. Key DESTRUCTION
#     (crypto-erase) is deliberately withheld here and gated behind kind: Destruction.
#
# If Vault is unreachable or sealed, or the AppRole secret is absent, the run fails and retries next
# minute — no key is silently skipped, none is silently destroyed.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: encryptionkey-reconciler
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-encryptionkey-reconciler
rules:
  - apiGroups: [openinfra.dev]
    resources: [encryptionkeys]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-encryptionkey-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openinfra-encryptionkey-reconciler
subjects:
  - kind: ServiceAccount
    name: encryptionkey-reconciler
    namespace: crossplane-system
---
# Write the live-state ConfigMaps in the console namespace (single-writer; the composition owns the
# separate spec-mirror ConfigMaps).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: encryptionkey-reconciler-state
  namespace: open-infra-console
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: encryptionkey-reconciler-state
  namespace: open-infra-console
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: encryptionkey-reconciler-state }
subjects:
  - kind: ServiceAccount
    name: encryptionkey-reconciler
    namespace: crossplane-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: encryptionkey-reconciler
  namespace: crossplane-system
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: encryptionkey-reconciler
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - { name: bin, emptyDir: {} }
            - { name: home, emptyDir: {} }
          initContainers:
            - name: fetch-vault
              image: hashicorp/vault:1.17.2
              command: [sh, -c, "cp /bin/vault /bin-shared/vault && chmod +x /bin-shared/vault"]
              volumeMounts: [{ name: bin, mountPath: /bin-shared }]
          containers:
            - name: reconcile
              image: alpine/k8s:1.30.0
              command: [/bin/sh, -ceu]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: bin, mountPath: /bin-shared }
                - { name: home, mountPath: /tmp }
              env:
                - { name: HOME, value: /tmp }
                - { name: PATH, value: "/bin-shared:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
                - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
                - { name: CONSOLE_NS, value: "open-infra-console" }
              args:
                - |
                  # Kubernetes auth: log in with THIS pod's ServiceAccount token — no Vault credential
                  # is stored in any k8s Secret, so nothing with cluster-wide secret read (e.g. the
                  # console SA) can steal Vault access. Fail loudly if login fails (an assignment's
                  # exit status hides the substitution's, so check the token explicitly under set -e).
                  VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                    role=encryptionkey-reconciler \
                    jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)")"
                  export VAULT_TOKEN
                  [ -n "$VAULT_TOKEN" ] || { echo "vault kubernetes login failed" >&2; exit 1; }
                  now=$(date -u +%s)

                  kubectl get encryptionkeys.openinfra.dev -A -o json \
                    | jq -r '.items[] | [.metadata.name, (.spec.keyType // "aes256-gcm96"), (.spec.rotationDays // 0)] | @tsv' \
                    | while IFS="$(printf '\t')" read -r name ktype rotdays; do
                        # Ensure the Transit key exists (idempotent; create-if-missing, never destroy).
                        if ! vault read "transit/keys/$name" >/dev/null 2>&1; then
                          echo "creating transit key $name ($ktype)"
                          vault write -f "transit/keys/$name" type="$ktype" >/dev/null
                        fi

                        # Rotation: rotate if rotationDays>0 and it has been that long since the last
                        # rotation we recorded (first sight seeds the clock; it does not rotate).
                        cm="openinfra-enckey-state-$name"
                        last=$(kubectl get configmap "$cm" -n "$CONSOLE_NS" -o jsonpath='{.data.lastRotatedEpoch}' 2>/dev/null || echo "")
                        [ -n "$last" ] || last="$now"
                        if [ "$rotdays" -gt 0 ] 2>/dev/null; then
                          age=$(( now - last ))
                          if [ "$age" -ge $(( rotdays * 86400 )) ]; then
                            echo "rotating transit key $name (age ${age}s ≥ ${rotdays}d)"
                            if vault write -f "transit/keys/$name/rotate" >/dev/null; then
                              last="$now"
                              # Persist the new rotation time IMMEDIATELY, so if the full state write
                              # below fails we don't re-rotate every run (unbounded version growth).
                              kubectl patch configmap "$cm" -n "$CONSOLE_NS" --type merge \
                                -p "{\"data\":{\"lastRotatedEpoch\":\"$now\"}}" 2>/dev/null || true
                            fi
                          fi
                        fi

                        latest=$(vault read -format=json "transit/keys/$name" | jq -r '.data.latest_version // 0')
                        kubectl create configmap "$cm" -n "$CONSOLE_NS" \
                          --from-literal=exists=true \
                          --from-literal=keyType="$ktype" \
                          --from-literal=latestVersion="$latest" \
                          --from-literal=vaultKeyPath="transit/keys/$name" \
                          --from-literal=lastRotatedEpoch="$last" \
                          --from-literal=lastChecked="$(date -u +%FT%TZ)" \
                          --dry-run=client -o yaml \
                          | kubectl label --local -f - "openinfra.dev/enckey=$name" -o yaml \
                          | kubectl apply -f - >/dev/null
                        echo "synced $name (version $latest)"
                      done
              resources:
                requests: { cpu: 20m, memory: 48Mi }
                limits: { cpu: 300m, memory: 192Mi }
