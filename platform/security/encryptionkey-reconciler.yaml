# Reconciler for kind: EncryptionKey — provisions a Vault Transit key per EncryptionKey and reflects
# its live state into a ConfigMap the console reads. Part of the OPT-IN `encryption` component.
#
# Least privilege on BOTH sides:
#   * Kubernetes: read EncryptionKeys (and their composites, which record each key's namespace and
#     Transit path), write only the state ConfigMaps in the console namespace.
#
# Each key's Transit path is namespace-qualified — transit/keys/ek_<namespace>_<name> — and recorded
# on its composite by the composition; this reconciler provisions exactly that path. Two namespaces'
# same-named EncryptionKeys are two Transit keys. (A key created before namespacing keeps
# transit/keys/<name>.)
#   * Vault: an AppRole scoped to create/read/rotate transit/keys/* — NOT destroy. Key DESTRUCTION
#     (crypto-erase) is deliberately withheld here and gated behind kind: Destruction.
#
# If Vault is unreachable or sealed, or the AppRole secret is absent, the run fails and retries — no
# key is silently skipped, none is silently destroyed.
#
# Latency: an encrypted kind: Volume cannot be keyed until its EncryptionKey's Transit key exists, so
# each run, after its full pass (ensure + rotate + state for every key), keeps polling for
# EncryptionKeys created since — every POLL_SECONDS until WATCH_SECONDS have passed, nearly the whole
# schedule period — and provisions each at once. A new key exists within seconds; the full pass (and
# its Vault + API load) still runs once per 5 minutes. WATCH_SECONDS=0 = one pass per run.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: encryptionkey-reconciler
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-encryptionkey-reconciler
rules:
  # The composite (cluster-scoped, written only by Crossplane) carries each key's claim namespace +
  # name (spec.claimRef) and its Transit path (status.vaultKeyPath) — the record this reconciler
  # provisions. The claim's own status is tenant-writable, so it is never trusted for the path.
  - apiGroups: [openinfra.dev]
    resources: [encryptionkeys, xencryptionkeys]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-encryptionkey-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openinfra-encryptionkey-reconciler
subjects:
  - kind: ServiceAccount
    name: encryptionkey-reconciler
    namespace: crossplane-system
---
# Write the live-state ConfigMaps in the console namespace (single-writer; the composition owns the
# separate spec-mirror ConfigMaps).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: encryptionkey-reconciler-state
  namespace: open-infra-console
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: encryptionkey-reconciler-state
  namespace: open-infra-console
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: encryptionkey-reconciler-state }
subjects:
  - kind: ServiceAccount
    name: encryptionkey-reconciler
    namespace: crossplane-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: encryptionkey-reconciler
  namespace: crossplane-system
spec:
  schedule: "*/5 * * * *"
  # Replace, not Forbid: the reconcile is idempotent, and Forbid + a stuck run (DeadlineExceeded with
  # a pod wedged in Terminating) blocks every later run indefinitely — see the grant-reconciler incident.
  # A run ends its watch (WATCH_SECONDS) before the next tick.
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 295 # > start-up + WATCH_SECONDS + a last sleep and pass, < the 5-minute period
      ttlSecondsAfterFinished: 300 # GC finished jobs so a wedged one can't accumulate
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: encryptionkey-reconciler
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - { name: bin, emptyDir: {} }
            - { name: home, emptyDir: {} }
          initContainers:
            - name: fetch-vault
              image: hashicorp/vault:1.17.2
              command: [sh, -c, "cp /bin/vault /bin-shared/vault && chmod +x /bin-shared/vault"]
              volumeMounts: [{ name: bin, mountPath: /bin-shared }]
          containers:
            - name: reconcile
              image: alpine/k8s:1.30.0
              command: [/bin/sh, -ceu]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: bin, mountPath: /bin-shared }
                - { name: home, mountPath: /tmp }
              env:
                - { name: HOME, value: /tmp }
                - { name: PATH, value: "/bin-shared:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
                - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
                - { name: CONSOLE_NS, value: "open-infra-console" }
                # After the full pass, keep polling for new EncryptionKeys this long (0 = one pass).
                - { name: WATCH_SECONDS, value: "240" }  # the deadline (295s) also counts scheduling + the init container
                - { name: POLL_SECONDS, value: "5" }
              args:
                - |
                  # Kubernetes auth: log in with THIS pod's ServiceAccount token — no Vault credential
                  # is stored in any k8s Secret, so nothing with cluster-wide secret read (e.g. the
                  # console SA) can steal Vault access. Fail loudly if login fails (an assignment's
                  # exit status hides the substitution's, so check the token explicitly under set -e).
                  VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                    role=encryptionkey-reconciler \
                    jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)")"
                  export VAULT_TOKEN
                  [ -n "$VAULT_TOKEN" ] || { echo "vault kubernetes login failed" >&2; exit 1; }
                  start=$(date +%s)
                  W="$(mktemp -d)"
                  : > "$W/synced"
                  TAB="$(printf '\t')"
                  failed=0

                  # sync_key <namespace> <name> <vaultKeyPath> <keyType> <rotationDays>: ensure the
                  # Transit key, rotate it when due, and reflect its state for the console. The path is
                  # the one the key's composite records (transit/keys/ek_<namespace>_<name>; a key
                  # created before namespacing keeps transit/keys/<name>) — never derived from the
                  # bare name, so two namespaces' same-named keys are two Transit keys.
                  sync_key() {
                    kns="$1"; name="$2"; path="$3"; ktype="$4"; rotdays="$5"
                    kname="${path#transit/keys/}"
                    case "$path" in transit/keys/*) ;; *) kname="" ;; esac
                    case "$kname" in
                      "" | *[!A-Za-z0-9_.-]*)
                        # Never address an unexpected path. Fail the run (so it is seen) without
                        # blocking every other key.
                        echo "skipping $kns/$name: recorded Transit path '$path' is not a transit/keys/<name> path" >&2
                        echo "$path" >> "$W/synced"   # reported once per run, not every poll
                        failed=1; return 0 ;;
                    esac
                    # The state ConfigMap's identity: <namespace>.<name> for a namespaced key; a key
                    # created before namespacing keeps its bare-name ConfigMap.
                    case "$kname" in ek_*) kid="$kns.$name" ;; *) kid="$name" ;; esac
                    now=$(date -u +%s)
                    # Ensure the Transit key exists (idempotent; create-if-missing, never destroy).
                    if ! vault read "transit/keys/$kname" >/dev/null 2>&1; then
                      echo "creating transit key $kname ($ktype) for $kns/$name"
                      vault write -f "transit/keys/$kname" type="$ktype" >/dev/null || return 1
                    fi

                    # Rotation: rotate if rotationDays>0 and it has been that long since the last
                    # rotation we recorded (first sight seeds the clock; it does not rotate).
                    cm="openinfra-enckey-state-$kid"
                    last=$(kubectl get configmap "$cm" -n "$CONSOLE_NS" -o jsonpath='{.data.lastRotatedEpoch}' 2>/dev/null || echo "")
                    [ -n "$last" ] || last="$now"
                    if [ "$rotdays" -gt 0 ] 2>/dev/null; then
                      age=$(( now - last ))
                      if [ "$age" -ge $(( rotdays * 86400 )) ]; then
                        echo "rotating transit key $kname (age ${age}s ≥ ${rotdays}d)"
                        if vault write -f "transit/keys/$kname/rotate" >/dev/null; then
                          last="$now"
                          # Persist the new rotation time IMMEDIATELY, so if the full state write
                          # below fails we don't re-rotate every run (unbounded version growth).
                          kubectl patch configmap "$cm" -n "$CONSOLE_NS" --type merge \
                            -p "{\"data\":{\"lastRotatedEpoch\":\"$now\"}}" 2>/dev/null || true
                        fi
                      fi
                    fi

                    kj="$(vault read -format=json "transit/keys/$kname")" || return 1
                    latest=$(printf '%s' "$kj" | jq -r '.data.latest_version // 0')
                    kubectl create configmap "$cm" -n "$CONSOLE_NS" \
                      --from-literal=exists=true \
                      --from-literal=namespace="$kns" \
                      --from-literal=name="$name" \
                      --from-literal=keyType="$ktype" \
                      --from-literal=latestVersion="$latest" \
                      --from-literal=vaultKeyPath="$path" \
                      --from-literal=lastRotatedEpoch="$last" \
                      --from-literal=lastChecked="$(date -u +%FT%TZ)" \
                      --dry-run=client -o yaml \
                      | kubectl label --local -f - "openinfra.dev/enckey=$name" -o yaml \
                      | kubectl apply -f - >/dev/null || return 1
                    echo "synced $kns/$name -> $path (version $latest)"
                    echo "$path" >> "$W/synced"
                  }

                  # list_keys: every claimed EncryptionKey whose composite has recorded its Transit path,
                  # as <namespace> <name> <vaultKeyPath> <keyType> <rotationDays> rows. A composite
                  # without a claim, or not yet rendered (no path), is not provisioned yet.
                  list_keys() {
                    ek="$(kubectl get xencryptionkeys.openinfra.dev -o json)" || { echo "cannot list EncryptionKeys" >&2; return 1; }
                    printf '%s' "$ek" \
                      | jq -r '.items[]
                          | select((.spec.claimRef.namespace // "") != "" and (.spec.claimRef.name // "") != "")
                          | select((.status.vaultKeyPath // "") != "")
                          | [.spec.claimRef.namespace, .spec.claimRef.name, .status.vaultKeyPath,
                             (.spec.keyType // "aes256-gcm96"), (.spec.rotationDays // 0)] | @tsv' \
                      > "$W/keys.tsv"
                  }

                  # Full pass: every EncryptionKey. Any failure fails the run (and it retries).
                  list_keys || exit 1
                  while IFS="$TAB" read -r n k p t r; do
                    [ -n "$k" ] || continue
                    sync_key "$n" "$k" "$p" "$t" "$r" || exit 1
                  done < "$W/keys.tsv"

                  # Watch: provision EncryptionKeys created since the full pass within seconds. A
                  # failure here marks the run failed but keeps watching.
                  while [ $(( $(date +%s) - start )) -lt "$WATCH_SECONDS" ]; do
                    sleep "$POLL_SECONDS"
                    list_keys || { failed=1; continue; }
                    while IFS="$TAB" read -r n k p t r; do
                      [ -n "$k" ] || continue
                      grep -qxF "$p" "$W/synced" && continue
                      sync_key "$n" "$k" "$p" "$t" "$r" || failed=1
                    done < "$W/keys.tsv"
                  done
                  [ "$failed" -eq 0 ] || exit 1
              resources:
                requests: { cpu: 20m, memory: 48Mi }
                limits: { cpu: 300m, memory: 192Mi }
