# Expiry reconciler for kind: Grant (temporal access). A CronJob sweeps every minute and DELETES any
# Grant whose expiry base + spec.duration has passed (or whose duration exceeds the hard cap) — deleting
# the Grant makes Crossplane tear down its ClusterRoleBinding, so access ends on its own. This is the
# "self-destructing privilege" half of temporal access; the grant itself is declarative.
#
# Expiry base = spec.approval.approvedAt when the grant has been approved (access starts at approval, so
# the window runs from there, not from a creation that may have sat pending), else creationTimestamp — so
# a grant that is never approved is still bounded and swept at creation + duration.
#
# Least privilege: the reconciler's ONLY power is get/list/delete on grants.iam.openinfra.dev — it can
# revoke a temporary grant but cannot read secrets, touch other RBAC, or grant anything.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grant-reconciler
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-grant-reconciler
rules:
  - apiGroups: [iam.openinfra.dev]
    resources: [grants]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-grant-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openinfra-grant-reconciler
subjects:
  - kind: ServiceAccount
    name: grant-reconciler
    namespace: crossplane-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grant-reconciler
  namespace: crossplane-system
spec:
  schedule: "* * * * *" # every minute — ~1-minute expiry granularity
  # Replace, not Forbid: the sweep is idempotent (deleting an already-gone Grant is a no-op), so
  # overlap is harmless — but Forbid + a run that stuck (DeadlineExceeded with a pod wedged in
  # Terminating) counted as "active" forever and blocked every later reconcile, so no Grant
  # self-revoked for 12h. Replace supersedes a stuck run on the next tick, so the schedule self-heals.
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 110
      ttlSecondsAfterFinished: 300 # GC finished jobs promptly so a wedged one can't accumulate
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: grant-reconciler
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: reconcile
              image: alpine/k8s:1.30.2
              imagePullPolicy: IfNotPresent
              env:
                - { name: HOME, value: /tmp }
                - { name: GRANT_MAX_DURATION_SECONDS, value: "86400" } # hard cap: 24h
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts: [{ name: tmp, mountPath: /tmp }]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              command: [/bin/sh, -ceu]
              args:
                - |
                  max="${GRANT_MAX_DURATION_SECONDS:-86400}"
                  # ALL time math is done in jq, deliberately NOT in the shell:
                  #   * busybox `date -d` (this image) CANNOT parse the RFC3339 creationTimestamp —
                  #     it fails, and the old code swallowed that and kept the grant forever;
                  #   * busybox awk emitted scientific notation for huge durations, which then broke
                  #     the shell numeric comparison and skipped the over-cap revoke (and crashed).
                  # jq's `now` / `fromdateiso8601` parse correctly and jq compares numerically. The
                  # duration must match a STRICT Go-duration form (integer h/m/s) or it is revoked —
                  # so "0.5h", "abc", "", scientific notation, etc. all fail safe to revoke, never
                  # to a longer-than-intended life. Fail-safe throughout: anything we cannot make
                  # sense of (bad duration, over cap, unparseable timestamp) is REVOKED, not kept.
                  kubectl get grants.iam.openinfra.dev -A -o json | jq -r --argjson max "$max" '
                    def dursecs:
                      if test("^([0-9]+h)?([0-9]+m)?([0-9]+s)?$") then
                        ([scan("([0-9]+)([hms])") | (.[0]|tonumber) * ({"h":3600,"m":60,"s":1}[.[1]])] | add) // 0
                      else -1 end;
                    now as $now
                    | .items[]
                    | .metadata.namespace as $ns
                    | .metadata.name as $name
                    | ((.spec.duration // "") | dursecs) as $secs
                    # Expiry base: approvedAt when approved (window starts at approval), else creation.
                    | (if ((.spec.approval.approvedAt // "") != "") then .spec.approval.approvedAt else .metadata.creationTimestamp end) as $baseTs
                    | (($baseTs // "") | (try fromdateiso8601 catch -1)) as $created
                    | (if ($secs <= 0 or $secs > $max) then "revoke:invalid-or-over-cap"
                       elif ($created < 0) then "revoke:unparseable-timestamp"
                       elif ($now >= ($created + $secs)) then "revoke:expired"
                       else "keep" end) as $action
                    | select($action != "keep")
                    | [$ns, $name, $action] | @tsv
                  ' | while IFS="$(printf '\t')" read -r ns name action; do
                        echo "revoking $ns/$name ($action)"
                        kubectl -n "$ns" delete grant "$name" --ignore-not-found
                      done
          volumes:
            - name: tmp
              emptyDir: {}
