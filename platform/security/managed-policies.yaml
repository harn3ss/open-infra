---
# Queues (SQS) — full. AWS analog: AmazonSQSFullAccess. Control-plane only: there is no SQS
# data-plane front door in the aws-shim, so queue message operations are not Cedar-governed.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: queue-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Queue Full Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of message queues (create, configure and delete Queue resources).
  statements:
    - effect: Allow
      actions: ["queues:*"]
      resources: ["*"]
---
# Queues (SQS) — read only. AWS analog: AmazonSQSReadOnlyAccess.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: queue-read-only
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
