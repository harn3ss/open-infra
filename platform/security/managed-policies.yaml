    openinfra.dev/title: Networking Full Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of security groups (the network firewall surface). VPC/subnet/gateway
    management is not yet grantable via a managed policy.
  statements:
    - effect: Allow
