        resources: ["*"]
---
# Lambda (Functions) — full. AWS analog: AWSLambda_FullAccess.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: function-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Function Full Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of serverless functions: manage the Function resource and invoke functions
    through the Lambda front door.
  statements:
    - effect: Allow
      actions: ["functions:*"]
      resources: ["*"]
  dataPlane:
    statements:
      - effect: Allow
        actions: ["lambda:*"]
        resources: ["*"]
---
# Lambda (Functions) — invoke only. AWS analog: the invoke half of AWSLambdaRole. Control-plane
# read so callers can discover functions; data-plane InvokeFunction to call them.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: function-invoke
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Function Invoke
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Invoke serverless functions (and view them), without permission to create, modify or delete
    them.
  statements:
    - effect: Allow
      actions: ["functions:Get", "functions:List", "functions:Watch"]
      resources: ["*"]
  dataPlane:
    statements:
      - effect: Allow
        actions: ["lambda:InvokeFunction"]
        resources: ["*"]
---
# Compute / VMs — full. AWS analog: AmazonEC2FullAccess. Covers VMs, their images, and volumes.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: vm-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Virtual Machine Full Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of virtual machines, their boot images (VM Images) and attachable block
    volumes.
  statements:
    - effect: Allow
      actions: ["virtualmachines:*", "vmimages:*", "volumes:*"]
      resources: ["*"]
---
# Compute / VMs — read only. AWS analog: AmazonEC2ReadOnlyAccess.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: vm-read-only
