---
# APIs — full. AWS analog: a merged AmazonAPIGatewayAdministrator + AWSAppSyncAdministrator.
# Covers HTTP APIs (API Gateway) and GraphQL APIs (AppSync). NOTE: the AppSync DATA plane is
# governed by GraphQL auth modes (@aws_iam / API key / Cognito / OIDC / Lambda authorizer), not
# by a kind: Policy dataPlane block, so there is no "appsync:*" data-plane action to grant here.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: api-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: API Full Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of HTTP APIs (API Gateway) and GraphQL APIs (AppSync).
  statements:
    - effect: Allow
      actions: ["httpapis:*", "graphqlapis:*"]
      resources: ["*"]
---
# APIs — read only.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: api-read-only
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: API Read Only
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Read-only visibility of HTTP APIs and GraphQL APIs.
  statements:
    - effect: Allow
      actions:
        - httpapis:Get
        - httpapis:List
        - httpapis:Watch
        - graphqlapis:Get
        - graphqlapis:List
        - graphqlapis:Watch
      resources: ["*"]
