        - databaseproxies:Watch
        - migrations:Get
        - migrations:List
        - migrations:Watch
        - replications:Get
        - replications:List
        - replications:Watch
        - dataflows:Get
        - dataflows:List
        - dataflows:Watch
        - streams:Get
        - streams:List
        - streams:Watch
      resources: ["*"]
---
# Networking — full. AWS analog: (a subset of) AmazonVPCFullAccess. NOTE: the only networking
# kind inside the permission boundary today is securitygroups (the EC2 Security Group analog).
# The kube-ovn VPC family (vpcs/subnets/natgateways/elasticips/transitgateways/flowlogs) is not
# yet in the boundary, so it cannot be granted via a managed policy — see the mapping doc.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: networking-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
