    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Read-only access to NoSQL tables: view Table resources and get/query/scan items through the
    DynamoDB front door.
  statements:
    - effect: Allow
      actions: ["tables:Get", "tables:List", "tables:Watch"]
      resources: ["*"]
  dataPlane:
    statements:
      - effect: Allow
        actions:
          - dynamodb:GetItem
          - dynamodb:BatchGetItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:TransactGetItems
          - dynamodb:DescribeTable
          - dynamodb:DescribeTimeToLive
