  statements:
    - effect: Allow
      actions:
        - models:Get
        - models:List
        - models:Watch
        - modelpackages:Get
        - modelpackages:List
        - modelpackages:Watch
        - trainingjobs:Get
        - trainingjobs:List
        - trainingjobs:Watch
        - batchtransforms:Get
        - batchtransforms:List
        - batchtransforms:Watch
        - processingjobs:Get
        - processingjobs:List
        - processingjobs:Watch
        - modelmonitors:Get
        - modelmonitors:List
        - modelmonitors:Watch
        - featuregroups:Get
        - featuregroups:List
        - featuregroups:Watch
      resources: ["*"]
---
# Database / data tier — full. AWS analog: a merged database + DMS admin (AmazonRDSFullAccess +
# AWSDatabaseMigrationServiceFullAccess). Covers database proxies, migrations, replications,
# dataflows and streams. NOTE: open-infra has no standalone kind: Database — a managed database
# INSTANCE is provisioned as a facet of kind: Application, so instance lifecycle needs
# application-full-access (or administrator-access). See the mapping doc.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: database-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Database Full Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of the managed-data tier: database proxies, migrations, replications,
    dataflows and streams. Database instances themselves are provisioned via Application.
  statements:
    - effect: Allow
      actions:
        - databaseproxies:*
        - migrations:*
        - replications:*
        - dataflows:*
        - streams:*
      resources: ["*"]
---
# Database / data tier — read only.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: database-read-only
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
