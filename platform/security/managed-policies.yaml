    openinfra.dev/title: Machine Learning Read Only
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Read-only visibility of the machine-learning surface: models, model packages, training
