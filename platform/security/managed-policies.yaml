# open-infra's out-of-the-box MANAGED-POLICY LIBRARY — the equivalent of AWS's managed
# policies (the ready-made documents you tick to attach to a Role or a principal). Each is a
# `kind: Policy` (iam.openinfra.dev/v1) shipped by the platform, grounded in open-infra's REAL
# permissions:
#
#   * Control plane  — RBAC verbs (Get/List/Watch/Create/Update/Patch/Delete or *) on
#     openinfra.dev kinds. spec.statements compile to a labelled ClusterRole. A Policy can
#     ONLY name the 31 openinfra.dev resources in the permission boundary
#     (platform/abstraction/policy-boundary.yaml); anything else is DROPPED by the
#     composition, so every action below stays inside that whitelist.
#   * Data plane     — Cedar authorization at the aws-shim front doors. Only three services
#     are governed: s3 (Bucket), dynamodb (Table), lambda (Function). Actions come from
#     ui/src/lib/iam-cedar-vocab.ts. dataPlane.appliesTo is intentionally OMITTED: these are
#     ATTACHABLE (managed-axis) policies — the grant takes effect only when a Role/User names
#     the Policy in its spec.policies, never inline-to-everyone.
#
# COORDINATING CONVENTION (with the console agent):
#   label  openinfra.dev/managed-policy: "true"   → the console marks these read-only / "Managed"
#   label  openinfra.dev/policy-category: job-function | service
#   annot. openinfra.dev/title / spec.description  → human labels shown in the console
#
# HONEST SCOPE — a `kind: Policy` is bounded to the openinfra.dev PRODUCT surface. It CANNOT
# grant on iam.openinfra.dev (users/groups/policies/roles/grants) or on the excluded
# governance kinds (certificateauthorities, encryptionkeys, destructions, dataclassifications,
# userpools) — those live outside every Policy's boundary by design. So the ceiling here is
# "full control of the product surface", not cluster-admin: genuine identity/governance
# administration comes from the built-in openinfra:admin group / root break-glass, which no
# attachable policy can confer. See private/iam-ux/managed-policy-library.md for the full
# AWS -> open-infra mapping and the deliberate gaps.
#
# GitOps: raw claim-kind manifests applied by the root app-of-apps. Each carries
# SkipDryRunOnMissingResource=true (the policy CRD is established by the abstraction area at an
# earlier sync-wave) and sync-wave "4" so it lands after the XRD (2) and composition (3). They
# are created in the open-infra-console namespace — the namespace the console BFF reads IAM
# claims from (consoleNamespace()), so the library shows up in the IAM > Policies view.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# JOB-FUNCTION POLICIES
# ─────────────────────────────────────────────────────────────────────────────────────────
---
# AdministratorAccess — the ceiling a kind: Policy can express: every verb on every
# openinfra.dev product kind + every data-plane action on every service. Does NOT include
# identity/governance administration (structurally out of boundary — see header).
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: administrator-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: job-function
  annotations:
    openinfra.dev/title: Administrator Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of the entire open-infra product surface (all openinfra.dev kinds, all verbs)
    plus full data-plane access to S3, DynamoDB and Lambda. Does not confer identity or
    governance administration — those are outside every managed policy's permission boundary.
  statements:
    - effect: Allow
      actions: ["*:*"]
      resources: ["*"]
  dataPlane:
    statements:
      - effect: Allow
        actions: ["*"]
        resources: ["*"]
---
# PowerUserAccess — full use of every product kind and every data service, EXCEPT launching
# fault injection (chaos, a CM-7-gated safety control), which is read-only. AWS PowerUser's own
# carve-out (IAM/Organizations/Account) is already structural here, so this adds the one
# in-boundary safety carve-out a Policy can express. Enumerated, not "*", because RBAC is
# additive-only and cannot subtract a kind from a wildcard.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: power-user-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: job-function
  annotations:
    openinfra.dev/title: Power User Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full access to all open-infra resources and data services for building and operating
    workloads, but cannot launch fault-injection (chaos) experiments — those stay read-only.
    Identity and governance administration remain out of boundary.
  statements:
    - effect: Allow
      actions:
        - applications:*
        - functions:*
        - models:*
        - virtualmachines:*
        - vmimages:*
        - volumes:*
        - fileshares:*
        - directories:*
        - migrations:*
        - replications:*
        - dataflows:*
        - streams:*
        - securitygroups:*
        - queries:*
        - httpapis:*
        - graphqlapis:*
        - databaseproxies:*
        - statemachines:*
        - trainingjobs:*
        - modelpackages:*
        - batchtransforms:*
        - processingjobs:*
        - modelmonitors:*
        - featuregroups:*
        - staticsites:*
        - parameters:*
        - emailsenders:*
        - tables:*
        - buckets:*
        - queues:*
      resources: ["*"]
    - effect: Allow
      actions: ["faultinjections:Get", "faultinjections:List", "faultinjections:Watch"]
      resources: ["*"]
  dataPlane:
    statements:
      - effect: Allow
        actions: ["*"]
        resources: ["*"]
---
# ReadOnlyAccess — Get/List/Watch on every openinfra.dev kind + the read/list data-plane
# actions on S3 and DynamoDB. (Lambda's only enforced action is InvokeFunction, a write, so
# it contributes nothing to a read-only policy.)
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: read-only-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: job-function
  annotations:
    openinfra.dev/title: Read Only Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Read-only visibility across the whole platform: Get/List/Watch on every openinfra.dev kind,
    plus read and list actions on S3 objects/buckets and DynamoDB items/tables.
  statements:
    - effect: Allow
      actions: ["*:Get", "*:List", "*:Watch"]
      resources: ["*"]
  dataPlane:
    statements:
      - effect: Allow
        actions:
          - s3:GetObject
          - s3:ListBucket
          - s3:ListAllMyBuckets
          - dynamodb:GetItem
          - dynamodb:BatchGetItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:TransactGetItems
          - dynamodb:DescribeTable
          - dynamodb:DescribeTimeToLive
          - dynamodb:ListTables
        resources: ["*"]
# ─────────────────────────────────────────────────────────────────────────────────────────
# PER-SERVICE POLICIES — Full / ReadOnly for the highest-value service groups
# ─────────────────────────────────────────────────────────────────────────────────────────
---
# S3 (Buckets) — full. AWS analog: AmazonS3FullAccess.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: bucket-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Bucket Full Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of object-storage buckets: manage the Bucket resource and read/write/delete
    objects through the S3 front door.
  statements:
    - effect: Allow
      actions: ["buckets:*"]
      resources: ["*"]
  dataPlane:
    statements:
      - effect: Allow
        actions: ["s3:*"]
        resources: ["*"]
---
# S3 (Buckets) — read only. AWS analog: AmazonS3ReadOnlyAccess.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: bucket-read-only
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Bucket Read Only
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Read-only access to object-storage buckets: view Bucket resources and get/list objects
    through the S3 front door.
  statements:
    - effect: Allow
      actions: ["buckets:Get", "buckets:List", "buckets:Watch"]
      resources: ["*"]
  dataPlane:
    statements:
      - effect: Allow
        actions: ["s3:GetObject", "s3:ListBucket", "s3:ListAllMyBuckets"]
        resources: ["*"]
---
# DynamoDB (Tables) — full. AWS analog: AmazonDynamoDBFullAccess.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: table-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Table Full Access
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of NoSQL tables: manage the Table resource and read/write items through the
    DynamoDB front door.
  statements:
    - effect: Allow
      actions: ["tables:*"]
      resources: ["*"]
  dataPlane:
    statements:
      - effect: Allow
        actions: ["dynamodb:*"]
        resources: ["*"]
---
# DynamoDB (Tables) — read only. AWS analog: AmazonDynamoDBReadOnlyAccess.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: table-read-only
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
