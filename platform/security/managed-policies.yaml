# open-infra's out-of-the-box MANAGED-POLICY LIBRARY — the equivalent of AWS's managed
# policies (the ready-made documents you tick to attach to a Role or a principal). Each is a
# `kind: Policy` (iam.openinfra.dev/v1) shipped by the platform, grounded in open-infra's REAL
# permissions:
#
#   * Control plane  — RBAC verbs (Get/List/Watch/Create/Update/Patch/Delete or *) on
#     openinfra.dev kinds. spec.statements compile to a labelled ClusterRole. A Policy can
#     ONLY name the openinfra.dev resources in the permission boundary
#     (platform/abstraction/policy-boundary.yaml — the XRD kinds plus the shim-only authz
#     scopes repositories/secrets); anything else is DROPPED by the composition, so every
#     action below stays inside that whitelist.
#   * Data plane     — Cedar authorization at the aws-shim front doors. Only three services
#     are governed: s3 (Bucket), dynamodb (Table), lambda (Function). Actions come from
#     ui/src/lib/iam-cedar-vocab.ts. dataPlane.appliesTo is intentionally OMITTED: these are
#     ATTACHABLE (managed-axis) policies — the grant takes effect only when a Role/User names
#     the Policy in its spec.policies, never inline-to-everyone.
#
# THE AWS POLICY MODEL: the AWS managed policies ship under AWS's own names and ARNs
# (platform/abstraction/managed-policies/). The policies here cover open-infra kinds no AWS managed policy
# does (each one's reason is annotated: openinfra.dev/aws-equivalent "none"), and stay platform policies. The
# deprecated aliases of AWS managed policies that used to sit here were removed at the IAM cutover.
#
# COORDINATING CONVENTION (with the console agent):
#   label  openinfra.dev/managed-policy: "true"   → the console marks these read-only / "Managed"
#   label  openinfra.dev/policy-category: job-function | service
#   annot. openinfra.dev/title / spec.description  → human labels shown in the console
#
# HONEST SCOPE — a `kind: Policy` is bounded to the openinfra.dev PRODUCT surface. It CANNOT
# grant on iam.openinfra.dev (users/groups/policies/roles/grants) or on the excluded
# governance kinds (certificateauthorities, encryptionkeys, destructions, dataclassifications,
# userpools) — those live outside every Policy's boundary by design. So the ceiling here is
# "full control of the product surface", not cluster-admin: genuine identity/governance
# administration comes from the built-in openinfra:admin group / root break-glass, which no
# attachable policy can confer. See private/iam-ux/managed-policy-library.md for the full
# AWS -> open-infra mapping and the deliberate gaps.
#
# GitOps: raw claim-kind manifests applied by the root app-of-apps. Each carries
# SkipDryRunOnMissingResource=true (the policy CRD is established by the abstraction area at an
# earlier sync-wave) and sync-wave "4" so it lands after the XRD (2) and composition (3). They
# are created in the open-infra-console namespace — the namespace the console BFF reads IAM
# claims from (consoleNamespace()), so the library shows up in the IAM > Policies view.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# JOB-FUNCTION POLICIES
# ─────────────────────────────────────────────────────────────────────────────────────────
---
# Block/file storage — full. AWS analog: a merged AmazonEBS + AmazonEFS full access. Covers
# block Volumes and FileShares.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: storage-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Storage Full Access
    openinfra.dev/aws-equivalent: none
    openinfra.dev/aws-equivalent-reason: "volumes and file shares have no single AWS managed policy (EBS is in AmazonEC2FullAccess, EFS is its own service)"
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of block volumes and shared file systems (FileShares).
  statements:
    - effect: Allow
      actions: ["volumes:*", "fileshares:*"]
      resources: ["*"]
---
# Block/file storage — read only.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: storage-read-only
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Storage Read Only
    openinfra.dev/aws-equivalent: none
    openinfra.dev/aws-equivalent-reason: "volumes and file shares have no single AWS managed policy"
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Read-only visibility of block volumes and shared file systems.
  statements:
    - effect: Allow
      actions:
        - volumes:Get
        - volumes:List
        - volumes:Watch
        - fileshares:Get
        - fileshares:List
        - fileshares:Watch
      resources: ["*"]
---
# ML / SageMaker — full. AWS analog: AmazonSageMakerFullAccess. Covers the full ML surface:
# Models, Model Packages, Training Jobs, Batch Transforms, Processing Jobs, Model Monitors and
# Feature Groups. (Hyperparameter tuning jobs are not in the permission boundary; see the doc.)
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: ml-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Machine Learning Full Access
    openinfra.dev/aws-equivalent: none
    openinfra.dev/aws-equivalent-reason: "open-infra's model kinds are not SageMaker (AmazonSageMakerFullAccess grants a service not served)"
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of the machine-learning surface: models, model packages, training jobs, batch
    transforms, processing jobs, model monitors and feature groups.
  statements:
    - effect: Allow
      actions:
        - models:*
        - modelpackages:*
        - trainingjobs:*
        - batchtransforms:*
        - processingjobs:*
        - modelmonitors:*
        - featuregroups:*
      resources: ["*"]
---
# ML / SageMaker — read only. AWS analog: AmazonSageMakerReadOnly.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: ml-read-only
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Machine Learning Read Only
    openinfra.dev/aws-equivalent: none
    openinfra.dev/aws-equivalent-reason: "open-infra's model kinds are not SageMaker"
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Read-only visibility of the machine-learning surface: models, model packages, training
    jobs, batch transforms, processing jobs, model monitors and feature groups.
  statements:
    - effect: Allow
      actions:
        - models:Get
        - models:List
        - models:Watch
        - modelpackages:Get
        - modelpackages:List
        - modelpackages:Watch
        - trainingjobs:Get
        - trainingjobs:List
        - trainingjobs:Watch
        - batchtransforms:Get
        - batchtransforms:List
        - batchtransforms:Watch
        - processingjobs:Get
        - processingjobs:List
        - processingjobs:Watch
        - modelmonitors:Get
        - modelmonitors:List
        - modelmonitors:Watch
        - featuregroups:Get
        - featuregroups:List
        - featuregroups:Watch
      resources: ["*"]
---
# Networking — full. AWS analog: (a subset of) AmazonVPCFullAccess. NOTE: the only networking
# kind inside the permission boundary today is securitygroups (the EC2 Security Group analog).
# The kube-ovn VPC family (vpcs/subnets/natgateways/elasticips/transitgateways/flowlogs) is not
# yet in the boundary, so it cannot be granted via a managed policy — see the mapping doc.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: networking-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Networking Full Access
    openinfra.dev/aws-equivalent: none
    openinfra.dev/aws-equivalent-reason: "security groups, VPCs and address kinds span several AWS policies; AmazonVPCFullAccess grants VPC features not served"
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of security groups (the network firewall surface). VPC/subnet/gateway
    management is not yet grantable via a managed policy.
  statements:
    - effect: Allow
      actions: ["securitygroups:*"]
      resources: ["*"]
---
# Networking — read only.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: networking-read-only
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Networking Read Only
    openinfra.dev/aws-equivalent: none
    openinfra.dev/aws-equivalent-reason: "no single AWS managed policy covers open-infra's networking kinds"
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Read-only visibility of security groups.
  statements:
    - effect: Allow
      actions: ["securitygroups:Get", "securitygroups:List", "securitygroups:Watch"]
      resources: ["*"]
---
# Applications — full. AWS analog: AWSElasticBeanstalkFullAccess (the general "deploy an app"
# service). This is broad: databases, queues and buckets are facets of an Application, so full
# Application access implies the ability to provision them as part of a workload.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: application-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Application Full Access
    openinfra.dev/aws-equivalent: none
    openinfra.dev/aws-equivalent-reason: "kind: Application has no AWS service of its own"
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Full control of Applications — the core PaaS workload kind (which can itself declare
    databases, queues and buckets as part of a workload).
  statements:
    - effect: Allow
      actions: ["applications:*"]
      resources: ["*"]
---
# Applications — read only.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: application-read-only
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: Application Read Only
    openinfra.dev/aws-equivalent: none
    openinfra.dev/aws-equivalent-reason: "kind: Application has no AWS service of its own"
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Read-only visibility of Applications.
  statements:
    - effect: Allow
      actions: ["applications:Get", "applications:List", "applications:Watch"]
      resources: ["*"]
---
# APIs — read only.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: api-read-only
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
  annotations:
    openinfra.dev/title: API Read Only
    openinfra.dev/aws-equivalent: none
    openinfra.dev/aws-equivalent-reason: "AWS has no read-only API Gateway managed policy (AmazonAPIGatewayAdministrator is full access)"
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Read-only visibility of HTTP APIs and GraphQL APIs.
  statements:
    - effect: Allow
      actions:
        - httpapis:Get
        - httpapis:List
        - httpapis:Watch
        - graphqlapis:Get
        - graphqlapis:List
        - graphqlapis:Watch
      resources: ["*"]
