        - vmimages:Get
        - vmimages:List
        - vmimages:Watch
        - volumes:Get
        - volumes:List
        - volumes:Watch
      resources: ["*"]
---
# Block/file storage — full. AWS analog: a merged AmazonEBS + AmazonEFS full access. Covers
# block Volumes and FileShares.
apiVersion: iam.openinfra.dev/v1
kind: Policy
metadata:
  name: storage-full-access
  namespace: open-infra-console
  labels:
    openinfra.dev/managed-policy: "true"
    openinfra.dev/policy-category: service
