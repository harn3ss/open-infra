# Cedar control-plane authorization webhook — SHADOW deployment (Phase 2, docs/authz-webhook.md).
# Under manifests/ so ArgoCD does NOT auto-sync it: this is the experimental shadow run, applied
# with kubectl. hostNetwork on the control-plane node, loopback-only TLS on 127.0.0.1:8099, shadow
# mode (returns no-opinion -> cannot change any authz decision). The API-server wiring
# (authorization-mode=Node,RBAC,Webhook + the webhook kubeconfig) is a host-side root step, not GitOps.
# The TLS secret (authz-webhook-tls) is created out-of-band from a self-signed cert (SAN 127.0.0.1).
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: authz-webhook, namespace: open-infra-authz }
---
# Read kind: Policy cluster-wide for the control-plane corpus (spec.controlPlane). Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: open-infra-authz-webhook-policies }
rules:
  - { apiGroups: [iam.openinfra.dev], resources: [policies], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: open-infra-authz-webhook-policies }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: open-infra-authz-webhook-policies }
subjects: [{ kind: ServiceAccount, name: authz-webhook, namespace: open-infra-authz }]
---
# Read the optional compiled corpus bundle (control-plane-corpus ConfigMap). This MUST be allowed
# here by RBAC so the loader's own read is authorized BEFORE the webhook is consulted — otherwise the
# read falls through to the webhook and recurses (bootstrap acyclicity), which cancels the load.
# Scoped to the one ConfigMap, get-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: authz-webhook-corpus-reader, namespace: open-infra-authz }
rules:
  - { apiGroups: [""], resources: [configmaps], verbs: [get], resourceNames: [control-plane-corpus] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: authz-webhook-corpus-reader, namespace: open-infra-authz }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: authz-webhook-corpus-reader }
subjects: [{ kind: ServiceAccount, name: authz-webhook, namespace: open-infra-authz }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: authz-webhook, namespace: open-infra-authz, labels: { app: authz-webhook } }
spec:
  replicas: 1   # single hostNetwork replica today; HA (>1 control-plane node) is a follow-up. The
                # RBAC fallback (apiserver failurePolicy: NoOpinion) covers a redeploy/outage gap.
  # hostNetwork singleton binds host loopback 127.0.0.1:8099 — a RollingUpdate starts the new pod
  # before the old frees the port ("bind: address already in use"), wedging the rollout. Recreate:
  # terminate the old pod first, then start the new one (a brief shadow-webhook gap is harmless —
  # allows short-circuit at Node/RBAC before the webhook is ever consulted).
  strategy: { type: Recreate }
  selector: { matchLabels: { app: authz-webhook } }
  template:
    metadata: { labels: { app: authz-webhook } }
    spec:
      serviceAccountName: authz-webhook
      # The authorizer is in the API server's critical path; keep the single replica from being
      # evicted/preempted under node pressure (an eviction drops to the RBAC fallback — safe, but stops
      # Cedar enforcing). Availability otherwise rests on that fallback until multi-CP-node HA exists.
      priorityClassName: system-cluster-critical
      # Reachable by the API server WITHOUT cluster networking (authorizers are called early):
      # hostNetwork on the control-plane node, listening on loopback only.
      hostNetwork: true
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
        - { key: CriticalAddonsOnly, operator: Exists }
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: authz-webhook
          image: ghcr.io/harn3ss/open-infra-authz-webhook:latest
          imagePullPolicy: Always
          env:
            - { name: LISTEN_ADDR, value: "127.0.0.1:8099" }   # loopback: only the local API server reaches it
            # ENFORCE: Cedar is the authoritative control-plane authorizer, consulted BEFORE RBAC in the
            # apiserver's authorization-config (#148). Safe as the committed default because the webhook
            # enforces ONLY once it has a corpus: with none loaded (fresh cluster, corpus not applied
            # yet, or a cold-start blip) it returns no-opinion and defers to RBAC rather than denying
            # everything. Set to "shadow" to only LOG would-be decisions (divergence measurement)
            # without deciding — do that first on a cluster whose corpus you have not validated.
            - { name: AUTHZ_MODE, value: "enforce" }
            # Break-glass floor — always allowed in enforce, independent of the corpus. Scoped tight:
            # only system:masters (cluster-admin recovery through a broken/empty corpus) as a GROUP, and
            # the webhook's OWN ServiceAccount as a USER (auto-derived from its projected token — no env
            # needed) so its corpus-source reads are authorizable without the webhook and it can
            # bootstrap. The corpus-auditor SA in this namespace is granted by the corpus like any other
            # principal, so the old namespace-wide bypass is gone. Extra users via BREAK_GLASS_USERS.
            - { name: BREAK_GLASS_GROUPS, value: "system:masters" }
            # Defer-to-RBAC (NoOpinion, NOT allow) for operator-managed infrastructure ServiceAccounts in
            # fenced namespaces the corpus cannot enumerate in advance — the RDS front door provisions a
            # CloudNativePG cluster per DB instance, each minting a new SA governed by CNPG's own tightly
            # scoped per-cluster RBAC. Cedar abstains for those SAs so RBAC decides; users/console/apps are
            # unaffected. Comma-separated; "-" disables. (polyhedron#162)
            - { name: DEFER_TO_RBAC_NAMESPACES, value: "open-infra-rds" }
            - { name: TLS_CERT_FILE, value: "/tls/tls.crt" }
            - { name: TLS_KEY_FILE, value: "/tls/tls.key" }
          volumeMounts: [{ name: tls, mountPath: /tls, readOnly: true }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8099, scheme: HTTPS, host: 127.0.0.1 }
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
      volumes:
        - { name: tls, secret: { secretName: authz-webhook-tls } }
