# OpenBao: the platform's key and secrets service (#359). Three members on three different physical
# nodes share integrated Raft storage, and an OpenBao outside the cluster unseals them (transit seal).
# docs/openbao.md is the operator guide.
#
# OPT-IN, OFF BY DEFAULT (components.openbao). It runs beside the existing Vault (security/vault.yaml)
# and holds nothing until the platform's keys are moved onto it, a step the operator approves.
#
# Site values are never in this file:
#   - EndpointSlice openbao-unseal-host and ConfigMap openbao-unseal-host (ns openbao): where the unseal
#     host is, and its CA certificate. scripts/openbao-site.sh (run by install.sh) renders them from
#     config.yaml openbao.unsealHost; it fetches the CA from the host and refuses it unless its SHA-256
#     fingerprint is the one in config.yaml.
#   - Secret openbao-seal (ns openbao, key token): the unseal host's token for the cluster, which can
#     encrypt and decrypt with the unseal key and do nothing else. The operator creates it from the
#     unseal host's output; nothing in git holds it.
#   - the member nodes: install.sh labels the nodes config.yaml openbao.nodes lists
#     openinfra.dev/openbao=true.
#
# Fail-closed: a member that cannot reach the unseal host exits, and Kubernetes restarts it until the
# host answers. It never starts unsealed, and there is no static key or dev mode to fall back to.
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# The unseal host, by a fixed in-cluster name. The members' seal stanza dials this Service and checks the
# host's certificate for the name openbao-unseal-host (scripts/openbao-unseal-host.ps1 issues it with that
# name), so the host's address is a site value in the EndpointSlice alone.
apiVersion: v1
kind: Service
metadata:
  name: openbao-unseal-host
  namespace: openbao
spec:
  ports:
    - { name: https, port: 8200, protocol: TCP }
---
# The members' API listener certificate, from the platform CA (networking/cluster-ca.yaml), whose name
# constraints admit only in-cluster names: clients use the .svc names below. The key is a leaf key; no
# CA key lives in this namespace. A renewal is picked up live (the tls-reload container below).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-listener
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: openbao-listener-tls
  issuerRef: { name: openinfra-ca, kind: ClusterIssuer, group: cert-manager.io }
  duration: 8760h
  renewBefore: 2160h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [server auth, digital signature]
  dnsNames:
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - openbao-active.openbao.svc
    - openbao-active.openbao.svc.cluster.local
    - openbao-internal.openbao.svc
    - openbao-internal.openbao.svc.cluster.local
    - openbao-0.openbao-internal.openbao.svc
    - openbao-0.openbao-internal.openbao.svc.cluster.local
    - openbao-1.openbao-internal.openbao.svc
    - openbao-1.openbao-internal.openbao.svc.cluster.local
    - openbao-2.openbao-internal.openbao.svc
    - openbao-2.openbao-internal.openbao.svc.cluster.local
---
# The members reach one another (Raft and request forwarding). Besides them, only the key service's
# clients reach the API: pods labelled openinfra.dev/openbao-client=true in the namespaces they run in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-server
  namespace: openbao
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: openbao, component: server }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: openbao, component: server }
      ports:
        - { port: 8200, protocol: TCP }
        - { port: 8201, protocol: TCP }
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [crossplane-system, open-infra-aws-shim, minio, vault, openbao]
          podSelector:
            matchLabels: { openinfra.dev/openbao-client: "true" }
      ports:
        - { port: 8200, protocol: TCP }
---
# The clients trust OpenBao's listener through the CA that signs it, the platform CA. This copies that CA
# certificate, which is public, from the listener's current CertificateRequest into ConfigMap openbao-ca
# in each client namespace; the clients mount it and name it in VAULT_CACERT. After a re-key the previous
# CA stays in the bundle beside the new one, so a client trusts the listener on either side of the change.
#
# Least privilege: in openbao, get the listener Certificate and list CertificateRequests; ConfigMaps:
# create, and get/patch/update only openbao-ca. RBAC cannot scope create by name, so the admission policy
# below confines this identity to openbao-ca in the client namespaces, and lets nobody else but
# system:masters write that ConfigMap there. It reads no Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-ca-publisher
  namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-ca-publisher
  namespace: openbao
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    resourceNames: [openbao-listener]
    verbs: [get]
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-ca-publisher
  namespace: openbao
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: openbao-ca-publisher }
subjects:
  - { kind: ServiceAccount, name: openbao-ca-publisher, namespace: openbao }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-openbao-ca-publisher
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [openbao-ca]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-openbao-ca-publisher
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: openinfra-openbao-ca-publisher }
subjects:
  - { kind: ServiceAccount, name: openbao-ca-publisher, namespace: openbao }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-openbao-ca
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [configmaps]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:openbao:openbao-ca-publisher'
        || (object.metadata.name == 'openbao-ca'
            && request.namespace in ['crossplane-system', 'open-infra-aws-shim', 'minio', 'vault', 'openbao'])
      reason: Forbidden
      message: "the openbao-ca-publisher may write only ConfigMap openbao-ca, in the key service's client namespaces"
    - expression: >-
        object.metadata.name != 'openbao-ca'
        || !(request.namespace in ['crossplane-system', 'open-infra-aws-shim', 'minio', 'vault', 'openbao'])
        || request.userInfo.username == 'system:serviceaccount:openbao:openbao-ca-publisher'
        || ('system:masters' in request.userInfo.groups)
      reason: Forbidden
      message: "openbao-ca (the CA the key service's clients trust) is written only by the openbao-ca-publisher"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-openbao-ca
spec:
  policyName: openinfra-openbao-ca
  validationActions: [Deny]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-ca-publisher
  namespace: openbao
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 300
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: openbao-ca-publisher
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - { name: home, emptyDir: {} }
          containers:
            - name: publish
              image: alpine/k8s:1.30.0@sha256:bd01dae02676ce4cab62fc744e43443eee5bf660054e94d3496d23bfc35d384e
              command: [/bin/sh, -ceu]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - { name: home, mountPath: /tmp }
              env:
                - { name: HOME, value: /tmp }
                - { name: CLIENT_NAMESPACES, value: "crossplane-system open-infra-aws-shim minio vault openbao" }
              args:
                - |
                  # The CA of the listener's current revision, from its owned, ready CertificateRequest
                  # (status cert-manager alone writes). Certificates only: anything else is refused.
                  rev="$(kubectl -n openbao get certificate openbao-listener -o jsonpath='{.status.revision}')"
                  [ -n "$rev" ] || { echo "the listener certificate is not issued yet"; exit 0; }
                  kubectl -n openbao get certificaterequests -o json | jq -r --arg rev "$rev" '
                    [.items[]
                     | select(any(.metadata.ownerReferences[]?; .kind == "Certificate" and .name == "openbao-listener"))
                     | select(.metadata.annotations["cert-manager.io/certificate-revision"] == $rev)
                     | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
                     | .status.ca // empty] | first // empty' > /tmp/ca.b64
                  [ -s /tmp/ca.b64 ] || { echo "no ready CertificateRequest for revision $rev"; exit 0; }
                  base64 -d /tmp/ca.b64 > /tmp/new.pem
                  if ! grep -q -- '-----BEGIN CERTIFICATE-----' /tmp/new.pem || grep -q -- 'PRIVATE KEY' /tmp/new.pem; then
                    echo "refusing to publish: the CertificateRequest's CA is not a certificate" >&2; exit 1
                  fi
                  first_cert() { awk '/-----BEGIN CERTIFICATE-----/{p=1} p{print} /-----END CERTIFICATE-----/{if(p) exit}'; }
                  new="$(first_cert < /tmp/new.pem | tr -d '\n')"
                  for ns in $CLIENT_NAMESPACES; do
                    kubectl -n "$ns" get configmap openbao-ca -o jsonpath='{.data.ca\.crt}' > /tmp/old.pem 2>/dev/null || : > /tmp/old.pem
                    [ "$(first_cert < /tmp/old.pem | tr -d '\n')" = "$new" ] && continue   # already current
                    { first_cert < /tmp/new.pem; first_cert < /tmp/old.pem; } > /tmp/bundle.pem   # new CA, then the previous one
                    if kubectl -n "$ns" create configmap openbao-ca --from-file=ca.crt=/tmp/bundle.pem --dry-run=client -o yaml \
                         | kubectl label --local -f - app.kubernetes.io/managed-by=openbao-ca-publisher -o yaml \
                         | kubectl apply --server-side --field-manager=openbao-ca-publisher --force-conflicts -f - >/dev/null; then
                      echo "published the CA to $ns"
                    else
                      echo "could not publish to $ns (absent?)" >&2
                    fi
                  done
---
# The platform root's publisher (aws-shim/platform-ca-publisher.yaml) renews every platform certificate
# the root signed after a re-key; this lets it renew the listener certificate here too.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ca-publisher
  namespace: openbao
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests, certificates]
    verbs: [list]
  - apiGroups: [cert-manager.io]
    resources: [certificates/status]
    verbs: [get, patch]   # kubectl patch --subresource=status reads the subresource first
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ca-publisher
  namespace: openbao
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-ca-publisher }
subjects:
  - { kind: ServiceAccount, name: platform-ca-publisher, namespace: open-infra-aws-shim }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.30.7
    helm:
      values: |
        global:
          tlsDisable: false
        injector:
          enabled: false
        server:
          image:
            registry: quay.io
            repository: openbao/openbao
            tag: "2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f"
          # All members start together (a member waits for the unseal host, not for its peers), and a
          # change rolls one member at a time, each unsealed before the next.
          podManagementPolicy: Parallel
          updateStrategyType: RollingUpdate
          configAnnotation: true
          priorityClassName: system-cluster-critical
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          terminationGracePeriodSeconds: 30
          shareProcessNamespace: true   # lets tls-reload signal the server
          # On distinct physical nodes the operator chose (openinfra.dev/openbao), never two on one, and
          # only on solid-state disks (openinfra.dev/disk-class, measured by storage/disk-class-labeler).
          nodeSelector:
            openinfra.dev/openbao: "true"
          affinity: |
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: openbao
                      app.kubernetes.io/instance: openbao
                      component: server
                  topologyKey: kubernetes.io/hostname
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - { key: openinfra.dev/disk-class, operator: In, values: [nvme, sata-ssd] }
          extraEnvironmentVars:
            GOMEMLIMIT: 460MiB
            # The bao command inside a member talks to its own server over TLS.
            BAO_CACERT: /openbao/userconfig/openbao-listener-tls/ca.crt
            BAO_TLS_SERVER_NAME: openbao.openbao.svc
          # The transit seal's token (see the header). Fixed, not optional: without it no member starts.
          extraSecretEnvironmentVars:
            - { envName: BAO_TOKEN, secretName: openbao-seal, secretKey: token }
          extraVolumes:
            - { type: secret, name: openbao-listener-tls }
            - { type: configMap, name: openbao-unseal-host }
          volumes:
            - { name: tmp, emptyDir: {} }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          statefulSet:
            securityContext:
              # The chart's defaults, plus OnRootMismatch: the kubelet sets the data volume's group once,
              # instead of widening the Raft database's mode (0600) on every restart.
              pod:
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 1000
                fsGroup: 1000
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile: { type: RuntimeDefault }
              container:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
          # OpenBao reads its listener certificate at start and on SIGHUP. cert-manager renews it in the
          # Secret mounted here; when the file changes, this sends the server SIGHUP.
          extraContainers:
            - name: tls-reload
              image: "quay.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  crt=/openbao/userconfig/openbao-listener-tls/tls.crt
                  last="$(sha256sum "$crt")"
                  while sleep 60; do
                    now="$(sha256sum "$crt")"
                    if [ "$now" != "$last" ] && pkill -HUP -x bao; then
                      echo "listener certificate renewed: the server reloads it"; last="$now"
                    fi
                  done
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 1m, memory: 8Mi }
                limits: { cpu: 50m, memory: 32Mi }
              volumeMounts:
                - { name: userconfig-openbao-listener-tls, mountPath: /openbao/userconfig/openbao-listener-tls, readOnly: true }
          dataStorage:
            enabled: true
            size: 10Gi
            storageClass: local-path   # node-local; Raft keeps the three copies
          service:
            publishNotReadyAddresses: false   # clients reach unsealed members only
          ha:
            enabled: true
            replicas: 3
            apiAddr: "https://$(BAO_K8S_POD_NAME).openbao-internal.openbao.svc:8200"
            disruptionBudget: { enabled: true, maxUnavailable: 1 }
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui           = false
                cluster_name = "open-infra"

                listener "tcp" {
                  address         = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_cert_file   = "/openbao/userconfig/openbao-listener-tls/tls.crt"
                  tls_key_file    = "/openbao/userconfig/openbao-listener-tls/tls.key"
                  tls_min_version = "tls13"
                }

                storage "raft" {
                  path = "/openbao/data"
                  retry_join {
                    leader_api_addr     = "https://openbao-0.openbao-internal.openbao.svc:8200"
                    leader_ca_cert_file = "/openbao/userconfig/openbao-listener-tls/ca.crt"
                  }
                  retry_join {
                    leader_api_addr     = "https://openbao-1.openbao-internal.openbao.svc:8200"
                    leader_ca_cert_file = "/openbao/userconfig/openbao-listener-tls/ca.crt"
                  }
                  retry_join {
                    leader_api_addr     = "https://openbao-2.openbao-internal.openbao.svc:8200"
                    leader_ca_cert_file = "/openbao/userconfig/openbao-listener-tls/ca.crt"
                  }
                }

                # The unseal host (see the header). Its token comes from the environment (BAO_TOKEN).
                seal "transit" {
                  address         = "https://openbao-unseal-host.openbao.svc:8200"
                  tls_server_name = "openbao-unseal-host"
                  tls_ca_cert     = "/openbao/userconfig/openbao-unseal-host/ca.pem"
                  mount_path      = "transit/"
                  key_name        = "autounseal"
                }

                # Every request and response, sensitive fields HMAC'd, into the pod's log (and Loki).
                audit "file" "stdout" {
                  description = "every request and response"
                  options {
                    file_path = "stdout"
                  }
                }

                service_registration "kubernetes" {}
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated: { prune: true, selfHeal: true }
