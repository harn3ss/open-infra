# OpenBao: the platform's key and secrets service (#359). Three members on three different physical
# nodes share integrated Raft storage, and an OpenBao outside the cluster unseals them (transit seal).
# docs/openbao.md is the operator guide.
#
# OPT-IN, OFF BY DEFAULT (components.openbao). It runs beside the existing Vault (security/vault.yaml)
# and holds nothing until the platform's keys are moved onto it, a step the operator approves.
#
# Site values are never in this file:
#   - EndpointSlice openbao-unseal-host and ConfigMap openbao-unseal-host (ns openbao): where the unseal
#     host is, and its CA certificate. scripts/openbao-site.sh (run by install.sh) renders them from
#     config.yaml openbao.unsealHost; it fetches the CA from the host and refuses it unless its SHA-256
#     fingerprint is the one in config.yaml.
#   - Secret openbao-seal (ns openbao, key token): the unseal host's token for the cluster, which can
#     encrypt and decrypt with the unseal key and do nothing else. The operator creates it from the
#     unseal host's output; nothing in git holds it.
#   - the member nodes: install.sh labels the nodes config.yaml openbao.nodes lists
#     openinfra.dev/openbao=true.
#
# Fail-closed: a member that cannot reach the unseal host exits, and Kubernetes restarts it until the
# host answers. It never starts unsealed, and there is no static key or dev mode to fall back to.
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# The unseal host, by a fixed in-cluster name. The members' seal stanza dials this Service and checks the
# host's certificate for the name openbao-unseal-host (scripts/openbao-unseal-host.ps1 issues it with that
# name), so the host's address is a site value in the EndpointSlice alone.
apiVersion: v1
kind: Service
metadata:
  name: openbao-unseal-host
  namespace: openbao
spec:
  ports:
    - { name: https, port: 8200, protocol: TCP }
---
# The members' API listener certificate, from the platform CA (networking/cluster-ca-root.yaml), whose name
# constraints admit only in-cluster names: clients use the .svc names below. The key is a leaf key; no
# CA key lives in this namespace. A renewal is picked up live (the tls-reload container below).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-listener
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: openbao-listener-tls
  issuerRef: { name: openinfra-ca, kind: ClusterIssuer, group: cert-manager.io }
  duration: 8760h
  renewBefore: 2160h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [server auth, digital signature]
  dnsNames:
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - openbao-active.openbao.svc
    - openbao-active.openbao.svc.cluster.local
    - openbao-internal.openbao.svc
    - openbao-internal.openbao.svc.cluster.local
    - openbao-0.openbao-internal.openbao.svc
    - openbao-0.openbao-internal.openbao.svc.cluster.local
    - openbao-1.openbao-internal.openbao.svc
    - openbao-1.openbao-internal.openbao.svc.cluster.local
    - openbao-2.openbao-internal.openbao.svc
    - openbao-2.openbao-internal.openbao.svc.cluster.local
---
# The members reach one another (Raft and request forwarding). Besides them, only the key service's
# clients reach the API: pods labelled openinfra.dev/openbao-client=true in the namespaces they run in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-server
  namespace: openbao
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: openbao, component: server }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: openbao, component: server }
      ports:
        - { port: 8200, protocol: TCP }
        - { port: 8201, protocol: TCP }
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [crossplane-system, open-infra-aws-shim, minio, vault, openbao]
          podSelector:
            matchLabels: { openinfra.dev/openbao-client: "true" }
      ports:
        - { port: 8200, protocol: TCP }
    # cert-manager's controller, which signs the platform's certificates through OpenBao once its CAs are
    # there (security/openbao-issuers.yaml).
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cert-manager }
          podSelector:
            matchLabels: { app.kubernetes.io/name: cert-manager, app.kubernetes.io/component: controller }
      ports:
        - { port: 8200, protocol: TCP }
---
# The clients trust OpenBao's listener through the CA that signs it, the platform CA. This copies that CA
# certificate, which is public, from the listener's current CertificateRequest into ConfigMap openbao-ca
# in each client namespace; the clients mount it and name it in VAULT_CACERT. cert-manager, whose Vault
# issuers read a CA bundle from a Secret only, gets it as Secret cert-manager/openbao-ca. After a re-key the previous
# CA stays in the bundle beside the new one, so a client trusts the listener on either side of the change.
#
# Least privilege: in openbao, get the listener Certificate and list CertificateRequests; ConfigMaps:
# create, and get/patch/update only openbao-ca. RBAC cannot scope create by name, so the admission policy
# below confines this identity to openbao-ca in the client namespaces, and lets nobody else but
# system:masters write that ConfigMap there. It reads no Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-ca-publisher
  namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-ca-publisher
  namespace: openbao
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    resourceNames: [openbao-listener]
    verbs: [get]
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-ca-publisher
  namespace: openbao
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: openbao-ca-publisher }
subjects:
  - { kind: ServiceAccount, name: openbao-ca-publisher, namespace: openbao }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-openbao-ca-publisher
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [openbao-ca]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-openbao-ca-publisher
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: openinfra-openbao-ca-publisher }
subjects:
  - { kind: ServiceAccount, name: openbao-ca-publisher, namespace: openbao }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-openbao-ca
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [configmaps]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:openbao:openbao-ca-publisher'
        || (object.metadata.name == 'openbao-ca'
            && request.namespace in ['crossplane-system', 'open-infra-aws-shim', 'minio', 'vault', 'openbao'])
      reason: Forbidden
      message: "the openbao-ca-publisher may write only ConfigMap openbao-ca, in the key service's client namespaces"
    - expression: >-
        object.metadata.name != 'openbao-ca'
        || !(request.namespace in ['crossplane-system', 'open-infra-aws-shim', 'minio', 'vault', 'openbao'])
        || request.userInfo.username == 'system:serviceaccount:openbao:openbao-ca-publisher'
        || ('system:masters' in request.userInfo.groups)
      reason: Forbidden
      message: "openbao-ca (the CA the key service's clients trust) is written only by the openbao-ca-publisher"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-openbao-ca
spec:
  policyName: openinfra-openbao-ca
  validationActions: [Deny]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-ca-publisher
  namespace: cert-manager
rules:
  - { apiGroups: [""], resources: [secrets], verbs: [create] }
  - { apiGroups: [""], resources: [secrets], resourceNames: [openbao-ca], verbs: [get, patch, update] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-ca-publisher
  namespace: cert-manager
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: openbao-ca-publisher }
subjects:
  - { kind: ServiceAccount, name: openbao-ca-publisher, namespace: openbao }
---
# The same confinement for the one Secret: the publisher writes only secret cert-manager/openbao-ca, and nobody
# else but system:masters writes that Secret (it is the CA cert-manager trusts OpenBao's listener with).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-openbao-ca-secret
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:openbao:openbao-ca-publisher'
        || (object.metadata.name == 'openbao-ca' && request.namespace == 'cert-manager')
      reason: Forbidden
      message: "the openbao-ca-publisher may write only secret cert-manager/openbao-ca"
    - expression: >-
        !(object.metadata.name == 'openbao-ca' && request.namespace == 'cert-manager')
        || request.userInfo.username == 'system:serviceaccount:openbao:openbao-ca-publisher'
        || ('system:masters' in request.userInfo.groups)
      reason: Forbidden
      message: "secret cert-manager/openbao-ca (the CA cert-manager trusts OpenBao with) is written only by the openbao-ca-publisher"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-openbao-ca-secret
spec:
  policyName: openinfra-openbao-ca-secret
  validationActions: [Deny]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-ca-publisher
  namespace: openbao
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 300
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: openbao-ca-publisher
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - { name: home, emptyDir: {} }
          containers:
            - name: publish
              image: alpine/k8s:1.30.0@sha256:bd01dae02676ce4cab62fc744e43443eee5bf660054e94d3496d23bfc35d384e
              command: [/bin/sh, -ceu]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - { name: home, mountPath: /tmp }
              env:
                - { name: HOME, value: /tmp }
                - { name: CLIENT_NAMESPACES, value: "crossplane-system open-infra-aws-shim minio vault openbao" }
              args:
                - |
                  # The CA of the listener's current revision, from its owned, ready CertificateRequest
                  # (status cert-manager alone writes). Certificates only: anything else is refused.
                  rev="$(kubectl -n openbao get certificate openbao-listener -o jsonpath='{.status.revision}')"
                  [ -n "$rev" ] || { echo "the listener certificate is not issued yet"; exit 0; }
                  kubectl -n openbao get certificaterequests -o json | jq -r --arg rev "$rev" '
                    [.items[]
                     | select(any(.metadata.ownerReferences[]?; .kind == "Certificate" and .name == "openbao-listener"))
                     | select(.metadata.annotations["cert-manager.io/certificate-revision"] == $rev)
                     | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
                     | .status.ca // empty] | first // empty' > /tmp/ca.b64
                  [ -s /tmp/ca.b64 ] || { echo "no ready CertificateRequest for revision $rev"; exit 0; }
                  base64 -d /tmp/ca.b64 > /tmp/new.pem
                  if ! grep -q -- '-----BEGIN CERTIFICATE-----' /tmp/new.pem || grep -q -- 'PRIVATE KEY' /tmp/new.pem; then
                    echo "refusing to publish: the CertificateRequest's CA is not a certificate" >&2; exit 1
                  fi
                  first_cert() { awk '/-----BEGIN CERTIFICATE-----/{p=1} p{print} /-----END CERTIFICATE-----/{if(p) exit}'; }
                  new="$(first_cert < /tmp/new.pem | tr -d '\n')"
                  for ns in $CLIENT_NAMESPACES; do
                    kubectl -n "$ns" get configmap openbao-ca -o jsonpath='{.data.ca\.crt}' > /tmp/old.pem 2>/dev/null || : > /tmp/old.pem
                    [ "$(first_cert < /tmp/old.pem | tr -d '\n')" = "$new" ] && continue   # already current
                    { first_cert < /tmp/new.pem; first_cert < /tmp/old.pem; } > /tmp/bundle.pem   # new CA, then the previous one
                    if kubectl -n "$ns" create configmap openbao-ca --from-file=ca.crt=/tmp/bundle.pem --dry-run=client -o yaml \
                         | kubectl label --local -f - app.kubernetes.io/managed-by=openbao-ca-publisher -o yaml \
                         | kubectl apply --server-side --field-manager=openbao-ca-publisher --force-conflicts -f - >/dev/null; then
                      echo "published the CA to $ns"
                    else
                      echo "could not publish to $ns (absent?)" >&2
                    fi
                  done
                  # cert-manager's Vault issuers read their CA bundle from a Secret.
                  kubectl -n cert-manager get secret openbao-ca -o jsonpath='{.data.ca\.crt}' 2>/dev/null | base64 -d > /tmp/old.pem 2>/dev/null || : > /tmp/old.pem
                  if [ "$(first_cert < /tmp/old.pem | tr -d '\n')" != "$new" ]; then
                    { first_cert < /tmp/new.pem; first_cert < /tmp/old.pem; } > /tmp/bundle.pem
                    if kubectl -n cert-manager create secret generic openbao-ca --from-file=ca.crt=/tmp/bundle.pem --dry-run=client -o yaml \
                         | kubectl label --local -f - app.kubernetes.io/managed-by=openbao-ca-publisher -o yaml \
                         | kubectl apply --server-side --field-manager=openbao-ca-publisher --force-conflicts -f - >/dev/null; then
                      echo "published the CA to secret cert-manager/openbao-ca"
                    else
                      echo "could not publish secret cert-manager/openbao-ca" >&2
                    fi
                  fi
---
# The platform root's publisher (aws-shim/platform-ca-publisher.yaml) renews every platform certificate
# the root signed after a re-key; this lets it renew the listener certificate here too.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ca-publisher
  namespace: openbao
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests, certificates]
    verbs: [list]
  - apiGroups: [cert-manager.io]
    resources: [certificates/status]
    verbs: [get, patch]   # kubectl patch --subresource=status reads the subresource first
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ca-publisher
  namespace: openbao
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-ca-publisher }
subjects:
  - { kind: ServiceAccount, name: platform-ca-publisher, namespace: open-infra-aws-shim }
---
# The key service's configuration Job: the mounts, the Kubernetes-auth roles and policies of every client,
# the platform CAs' signing roles, and the STS sealing key. A PostSync hook of every sync.
#
# The first run takes a root token, once, from Secret openbao-bootstrap (scripts/openbao-root-access.sh makes
# it from two recovery keys): it writes vault-config, the configuration administrator, a Kubernetes-auth role
# bound to this Job's own ServiceAccount with 15-minute tokens. Every later run logs in as vault-config, so
# the root token is revoked after that first run (docs/encryption.md). With neither, it does nothing and exits.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-setup
  namespace: openbao
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-setup
  namespace: openbao
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: { openinfra.dev/openbao-client: "true" }   # admitted to OpenBao (NetworkPolicy above)
    spec:
      serviceAccountName: openbao-setup
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 100, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: openbao-ca, configMap: { name: openbao-ca, optional: true } }   # absent on a first sync: the Job no-ops
        - { name: home, emptyDir: {} }
      containers:
        - name: setup
          image: quay.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
          command: [/bin/sh, -ceu]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: openbao-ca, mountPath: /etc/openbao-ca, readOnly: true }
            - { name: home, mountPath: /home/openbao }
          env:
            - { name: HOME, value: /home/openbao }
            - { name: BAO_ADDR, value: "https://openbao-active.openbao.svc:8200" }
            - { name: BAO_CACERT, value: /etc/openbao-ca/ca.crt }
            # A root token, once (see above); revoked and deleted after the first run.
            - name: BAO_TOKEN
              valueFrom: { secretKeyRef: { name: openbao-bootstrap, key: token, optional: true } }
          args:
            - |
              # The bootstrap token is a root token, used ONCE: its run writes vault-config — Vault's
              # configuration administrator, a Kubernetes-auth role bound to this Job's ServiceAccount
              # with short-lived tokens — and every later run logs in as vault-config instead, so the
              # operator revokes and deletes the root token after the first success (docs/encryption.md),
              # as AWS has an account's root credentials put away and its automation use a role.
              vault() { bao "$@"; }   # OpenBao's CLI; the commands below are the same
              if [ -z "${BAO_TOKEN:-}" ]; then
                # Sealed or unreachable: nothing to configure yet (no-op rather than fail every sync).
                vault status >/dev/null 2>&1 || { echo "OpenBao is sealed or unreachable — nothing to do until it answers"; exit 0; }
                if ! BAO_TOKEN="$(vault write -field=token auth/kubernetes/login role=vault-config \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null)"; then
                  echo "no bootstrap token and no vault-config identity yet — provide the bootstrap token once (docs/encryption.md)"
                  exit 0
                fi
                export BAO_TOKEN
                echo "logged in as vault-config (no root token)"
              fi
              until vault status >/dev/null 2>&1; do echo "waiting for OpenBao…"; sleep 5; done
              echo "writing the vault-config identity (Vault's configuration administrator, for this Job alone)…"
              # Exactly what this Job configures: the mounts it enables (never disabling one), Kubernetes
              # auth and its roles, the ACL policies, the audit device, and the STS sealing key — which it
              # may create once but never read (its existence is checked on the metadata path).
              vault policy write vault-config - <<'POLICY'
              path "sys/mounts"               { capabilities = ["read"] }
              path "sys/mounts/*"             { capabilities = ["create", "read", "update"] }
              path "sys/auth"                 { capabilities = ["read"] }
              path "sys/auth/kubernetes"      { capabilities = ["create", "read", "update", "sudo"] }
              path "sys/policies/acl"         { capabilities = ["list"] }
              path "sys/policies/acl/*"       { capabilities = ["create", "read", "update"] }
              path "auth/kubernetes/config"   { capabilities = ["create", "read", "update"] }
              path "auth/kubernetes/role/*"   { capabilities = ["create", "read", "update"] }
              path "sys/audit"                { capabilities = ["read", "sudo"] }
              path "sys/audit/stdout"         { capabilities = ["create", "update", "sudo"] }
              path "sts/metadata/signing-key" { capabilities = ["read"] }
              path "sts/data/signing-key"     { capabilities = ["create"] }
              path "openinfra/+/roles/+"      { capabilities = ["create", "read", "update"] }
              path "openinfra/transit/keys/instance-identity" { capabilities = ["create", "read", "update"] }
              POLICY
              vault auth enable kubernetes 2>/dev/null || echo "  kubernetes auth already enabled"
              vault write auth/kubernetes/config \
                kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              vault write auth/kubernetes/role/vault-config \
                bound_service_account_names=openbao-setup \
                bound_service_account_namespaces=openbao \
                token_policies=vault-config token_ttl=15m token_max_ttl=30m
              echo "enabling the audit device (every request, sensitive fields HMAC'd, to the pod log → Loki)…"
              if vault audit list 2>/dev/null | grep -q '^stdout/'; then
                echo "  audit device already enabled"
              else
                vault audit enable -path=stdout file file_path=stdout && echo "  audit device enabled"
              fi

              echo "enabling Transit engine (idempotent)…"
              vault secrets enable transit 2>/dev/null || echo "  transit already enabled"

              echo "writing the reconciler policy (create/read/update/rotate keys — NOT destroy or crypto-erase)…"
              # `update` is required because Vault's transit backend registers a key WRITE
              # (`vault write transit/keys/<name>`) as an UpdateOperation, not a create — without it the
              # reconciler gets 403 provisioning a key. It still cannot destroy: `delete`, and the crypto-
              # erase paths transit/keys/+/config and /trim, are withheld.
              # `+` matches exactly ONE path segment, so these grants reach transit/keys/<name> and
              # transit/keys/<name>/rotate but NOT transit/keys/<name>/config or /trim — where
              # min_decryption_version / deletion_allowed (crypto-erase of old versions) live. A
              # recursive `*` would hand over exactly the destruction powers this identity must lack.
              # No datakey/encrypt/decrypt/export/list either: it only shepherds key lifecycle.
              # A tenant key's name is namespace-qualified (ek_<namespace>_<name>, one segment, so `+`
              # reaches it; a key created before namespacing keeps its bare name). The KMS front door's
              # kms-* keys are fenced OUT with an explicit deny (deny wins).
              vault policy write encryptionkey-reconciler - <<'POLICY'
              path "transit/keys/+"        { capabilities = ["create", "read", "update"] }
              path "transit/keys/+/rotate" { capabilities = ["update"] }
              path "transit/keys/kms-*"    { capabilities = ["deny"] }
              POLICY

              echo "configuring Kubernetes auth (reconciler logs in with its SA token)…"
              vault auth enable kubernetes 2>/dev/null || echo "  kubernetes auth already enabled"
              # In-cluster: OpenBao reviews tokens with its OWN SA (system:auth-delegator, above); no
              # long-lived reviewer JWT to store.
              vault write auth/kubernetes/config \
                kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              vault write auth/kubernetes/role/encryptionkey-reconciler \
                bound_service_account_names=encryptionkey-reconciler \
                bound_service_account_namespaces=crossplane-system \
                token_policies=encryptionkey-reconciler token_ttl=20m

              echo "writing the DESTROYER policy (crypto-erase) + its Kubernetes-auth role…"
              # The destroyer is the ONLY identity that can crypto-erase: set deletion_allowed on a
              # key's config and delete it. Deliberately separate from the reconciler and bound to its
              # own ServiceAccount, so ordinary key management can never destroy. Still no export/
              # datakey/encrypt/decrypt — it can only destroy, not read or exfiltrate key material.
              # It destroys only the path a Destruction's own-namespace EncryptionKey records
              # (destruction-reconciler.yaml); the KMS front door's kms-* keys are fenced OUT here too.
              vault policy write encryptionkey-destroyer - <<'POLICY'
              path "transit/keys/+"        { capabilities = ["read", "delete"] }
              path "transit/keys/+/config" { capabilities = ["update"] }
              path "transit/keys/kms-*"    { capabilities = ["deny"] }
              POLICY
              vault write auth/kubernetes/role/encryptionkey-destroyer \
                bound_service_account_names=encryptionkey-destroyer \
                bound_service_account_namespaces=crossplane-system \
                token_policies=encryptionkey-destroyer token_ttl=10m

              echo "writing the volume-crypto identity (per-volume LUKS key from an EncryptionKey)…"
              # The volume-crypto reconciler (platform/security/volume-crypto.yaml) materializes each
              # encrypted Volume's <pvc>-crypto Secret from a Transit DATA KEY under the volume's
              # EncryptionKey. Scoped to datakey generation ONLY — it cannot read, rotate, or destroy
              # the KEK, and cannot decrypt (the crypto-erase authority stays with the destroyer role).
              # `+` reaches transit/datakey/plaintext/<key> (one segment), not deeper paths; the
              # reconciler names only the key its claim's own-namespace EncryptionKey records. The KMS
              # front door's kms-* keys are fenced OUT.
              vault policy write volume-crypto - <<'POLICY'
              path "transit/datakey/plaintext/+"     { capabilities = ["update"] }
              path "transit/datakey/plaintext/kms-*" { capabilities = ["deny"] }
              POLICY
              vault write auth/kubernetes/role/volume-crypto \
                bound_service_account_names=volume-crypto \
                bound_service_account_namespaces=crossplane-system \
                token_policies=volume-crypto token_ttl=20m

              echo "writing the MinIO-KES identity (SSE-KMS via KES → OpenBao KV; #37)…"
              # MinIO KES keeps its OWN keys in a KV mount (KES does the wrap/unwrap; it does NOT use
              # Transit). Distinct from the transit engine above. Inert unless the objectEncryption
              # component ships the KES Deployment (platform/security/minio-kes.yaml), which runs in
              # ns `minio` under SA `minio-kes` and logs in with this role.
              vault secrets enable -path=kes -version=1 kv 2>/dev/null || echo "  kes KV already enabled"
              vault policy write minio-kes - <<'POLICY'
              path "kes/*" { capabilities = ["create", "read", "update", "delete", "list"] }
              POLICY
              vault write auth/kubernetes/role/minio-kes \
                bound_service_account_names=minio-kes \
                bound_service_account_namespaces=minio \
                token_policies=minio-kes token_ttl=20m

              echo "enabling the Parameter store (SSM-equivalent) KV-v2 mount + reconciler identity (#72)…"
              # kind: Parameter values live here as a hierarchical KV-v2 tree (params/<ns>/<path>).
              # The parameter-reconciler both writes this tree and materializes the per-namespace
              # openinfra-parameters Secret; its policy is scoped to the params mount only.
              vault secrets enable -path=params -version=2 kv 2>/dev/null || echo "  params KV already enabled"
              vault policy write parameter-reconciler - <<'POLICY'
              path "params/*" { capabilities = ["create", "read", "update", "delete", "list"] }
              POLICY
              vault write auth/kubernetes/role/parameter-reconciler \
                bound_service_account_names=parameter-reconciler \
                bound_service_account_namespaces=crossplane-system \
                token_policies=parameter-reconciler token_ttl=20m

              echo "enabling the STS sealing-key store (aws-shim session-token key) KV-v2 mount + identity (#111 §1)…"
              # The aws-shim mints faithful sts:AssumeRole temporary credentials as AES-256-GCM sealed,
              # STATELESS session tokens. The one piece of long-lived key material — the 32-byte AES
              # sealing key — lives HERE, not in a k8s Secret, so nothing with cluster-wide `get secrets`
              # can read it. The shim logs in with its OWN SA token (role aws-shim-sts) and reads the key;
              # its policy is scoped to read exactly ONE path and nothing else — it cannot write, rotate,
              # list, or reach any other mount. Rotating this key (a new version at sts/signing-key) is the
              # session revoke-all lever: outstanding sealed tokens fail to open once the shim's overlap
              # window passes (see docs/aws-shim.md). An operator writes the key once (or a one-shot Job):
              #   vault kv put sts/signing-key key="$(head -c32 /dev/urandom | base64)"
              vault secrets enable -path=sts -version=2 kv 2>/dev/null || echo "  sts KV already enabled"
              # Write the 32-byte AES sealing key on first bootstrap if absent — this is what ENABLES
              # sts:AssumeRole (without it the shim answers "no signing key configured"). Only-if-absent, so a
              # re-run never rotates it (rotation, the session revoke-all lever, is a deliberate separate action).
              if vault kv metadata get sts/signing-key >/dev/null 2>&1; then
                echo "  sts/signing-key already present (STS already enabled)"
              else
                vault kv put sts/signing-key key="$(head -c 32 /dev/urandom | base64)" >/dev/null && echo "  wrote sts/signing-key — sts:AssumeRole is now ENABLED"
              fi
              # KV-v2 read is at sts/data/signing-key (the `data/` infix); grant read there and only there.
              vault policy write aws-shim-sts - <<'POLICY'
              path "sts/data/signing-key" { capabilities = ["read"] }
              POLICY
              vault write auth/kubernetes/role/aws-shim-sts \
                bound_service_account_names=aws-shim \
                bound_service_account_namespaces=open-infra-aws-shim \
                token_policies=aws-shim-sts token_ttl=20m

              echo "writing the aws-shim-kms policy (the KMS front door's transit access — kms-* keys only)…"
              # The aws-shim KMS doorway is Transit-backed: a KMS CMK is a Transit key,
              # named kms-<keyid>. This policy lets the shim create/read/rotate/delete + encrypt/decrypt +
              # generate data keys, but ONLY on the kms- prefix — the trailing-glob `transit/keys/kms-*`
              # (legal only as the final char, same idiom as `sys/mounts/pki-*`) hard-fences it OUT of the
              # encryptionkey-reconciler / volume-crypto keys. It has NO access to any key without the kms-
              # prefix, and no access to any other mount. `delete` is included because ScheduleKeyDeletion's
              # crypto-erase (after the waiting period) must genuinely destroy the CMK — a KMS key deletion
              # destroys every ciphertext under it, and that authority is deliberately scoped to kms- keys.
              vault policy write aws-shim-kms - <<'POLICY'
              path "transit/keys/kms-*"              { capabilities = ["create", "read", "update", "delete"] }
              path "transit/encrypt/kms-*"           { capabilities = ["update"] }
              path "transit/decrypt/kms-*"           { capabilities = ["update"] }
              path "transit/datakey/plaintext/kms-*" { capabilities = ["update"] }
              POLICY
              vault write auth/kubernetes/role/aws-shim-kms \
                bound_service_account_names=aws-shim \
                bound_service_account_namespaces=open-infra-aws-shim \
                token_policies=aws-shim-kms token_ttl=20m

              echo "Transit ready; reconciler + destroyer + minio-kes + parameter-reconciler + aws-shim-sts + aws-shim-kms authenticate via Kubernetes auth (no stored secrets)."

              # ── kind: CertificateAuthority — PKI engines + least-priv provisioner/issuer split ──
              # Same discipline as Transit above: two identities, each bound to its OWN ServiceAccount
              # and holding exactly one half of the CA lifecycle, so no single leaked token can both
              # mint a CA and issue certs off it. Reuses the kubernetes auth backend enabled above.
              # NOTE: there is deliberately NO base `pki`/`pki_int` mount. Every CertificateAuthority gets
              # its OWN mount, enabled dynamically as pki-<claimName> by the ca-provisioner (see
              # ca-reconciler.yaml, which also sets each mount's max-lease-ttl); an intermediate is signed
              # by its parent's pki-<parent> mount. Because the ONLY PKI mounts that ever exist are
              # pki-<name>, the single-segment `+` used on the data-plane paths below matches exactly those
              # mounts and nothing else — a `+` grant is inert on any path that does not exist. OpenBao
              # cannot express a `pki-*/<subpath>` mid-path glob, so `+` (the transit/keys/+ idiom) is the
              # tightest per-mount data-plane scope available; the pki- PREFIX is still hard-enforced where
              # it matters — mount management — via the trailing-glob `sys/mounts/pki-*` below.

              echo "writing the ca-provisioner policy (build CAs — but NEVER issue/revoke leaf certs)…"
              # Least privilege, two wildcard idioms working together:
              #  • `sys/mounts/pki-*` — the trailing `*` glob (legal ONLY as the final char of a path)
              #    pins mount create/tune/read to the pki-<claimName> namespace. So this identity can NOT
              #    enable or tune `transit` (the KMS) or any non-pki mount, and — with no `delete`
              #    capability — cannot drop a mount either. This is the "MUST NOT touch transit / outside
              #    pki" fence.
              #  • `+` — a single-segment wildcard (exactly the transit/keys/+ idiom above) stands in for
              #    the per-CA mount name on the data plane. ONLY the CA-building endpoints are granted;
              #    issue/issuer and revoke are deliberately ABSENT, so a provisioner can forge a CA but can
              #    never mint or revoke an end-entity certificate. transit exposes none of these subpaths.
              vault policy write ca-provisioner - <<'POLICY'
              path "sys/mounts/pki-*"                  { capabilities = ["create", "read", "update"] }
              path "+/root/generate/internal"          { capabilities = ["create", "update"] }
              path "+/intermediate/generate/internal"  { capabilities = ["create", "update"] }
              path "+/intermediate/set-signed"         { capabilities = ["create", "update"] }
              path "+/root/sign-intermediate"          { capabilities = ["create", "update"] }
              path "+/roles/issuer"                    { capabilities = ["create", "read", "update"] }
              path "+/config/urls"                     { capabilities = ["create", "read", "update"] }
              path "openinfra/*"                       { capabilities = ["deny"] }
              POLICY
              vault write auth/kubernetes/role/ca-provisioner \
                bound_service_account_names=ca-provisioner \
                bound_service_account_namespaces=crossplane-system \
                token_policies=ca-provisioner token_ttl=20m

              echo "writing the ca-issuer policy (issue/revoke leaf certs ONLY — cannot build a CA)…"
              # The mirror image of the provisioner: the ONLY identity that can mint/revoke end-entity
              # certs, and it can do nothing else. `+` again stands in for the per-CA mount name. No
              # root/intermediate generate, no roles write, no sys/mounts write, no transit — so a leaked
              # issuer token can neither forge a new CA nor crypto-erase anything. sys/mounts is read-only
              # so the issuer can resolve which pki-<ca> mounts exist without being able to change them.
              vault policy write ca-issuer - <<'POLICY'
              path "+/issue/issuer"  { capabilities = ["create", "update"] }
              path "+/revoke"        { capabilities = ["create", "update"] }
              path "+/crl/rotate"    { capabilities = ["read", "update"] }
              path "sys/mounts"      { capabilities = ["read"] }
              path "openinfra/*"     { capabilities = ["deny"] }
              POLICY
              vault write auth/kubernetes/role/ca-issuer \
                bound_service_account_names=ca-issuer \
                bound_service_account_namespaces=crossplane-system \
                token_policies=ca-issuer token_ttl=20m
              echo "PKI ready; ca-provisioner builds CAs, ca-issuer mints leaf certs — split by policy."

              # ── The platform's own CAs (#359): intermediates whose keys OpenBao generated and never
              # exports, under openinfra/ — two segments, so the `+` grants of the CertificateAuthority
              # identities above (one segment, pki-<name>) never reach them, and both deny openinfra/*.
              # The intermediates themselves are made once (scripts/openbao-pki.sh): their CSRs are signed
              # by the roots, which stay offline. Here: the mounts, the roles cert-manager signs with, and
              # cert-manager's identity (ClusterIssuers openinfra-ca, openinfra-aws-endpoints, openinfra-acm).
              echo "the platform CAs' mounts, signing roles and cert-manager's identity…"
              for m in pki-platform pki-aws-endpoints pki-acm; do
                vault secrets enable -path="openinfra/$m" -max-lease-ttl=43800h pki 2>/dev/null || echo "  openinfra/$m already enabled"
              done
              # Platform certificates: in-cluster names, the LAN's sslip.io names, private addresses, and the
              # carrier certificate the aws-shim serves the CA bundle from. The root's name constraints bound
              # every certificate under it whatever a role allows.
              vault write openinfra/pki-platform/roles/platform \
                allowed_domains="cluster.local,svc,sslip.io,open-infra root CA bundle" allow_subdomains=true \
                allow_bare_domains=true allow_wildcard_certificates=true allow_ip_sans=true enforce_hostnames=false \
                server_flag=true client_flag=false key_type=any max_ttl=8760h require_cn=false >/dev/null
              # AWS endpoint names for VM guests (the AWS-endpoints root is constrained to amazonaws.com).
              vault write openinfra/pki-aws-endpoints/roles/aws-endpoints \
                allowed_domains="amazonaws.com" allow_subdomains=true allow_bare_domains=true \
                allow_wildcard_certificates=true allow_ip_sans=false server_flag=true client_flag=false \
                key_type=any max_ttl=8760h require_cn=false >/dev/null
              # (openinfra/pki-acm/roles/acm carries the operator's validated domains, a site value: written
              # by scripts/openbao-pki.sh from the CA's own name constraints.)
              for i in platform:openinfra-ca aws-endpoints:openinfra-aws-endpoints acm:openinfra-acm; do
                r="${i%%:*}"; issuer="${i#*:}"
                printf 'path "openinfra/pki-%s/sign/%s" { capabilities = ["update"] }\n' "$r" "$r" \
                  | vault policy write "cert-manager-$r" - >/dev/null
                vault write "auth/kubernetes/role/cert-manager-$r" \
                  bound_service_account_names=openbao-issuer bound_service_account_namespaces=cert-manager \
                  audience="vault://$issuer" token_policies="cert-manager-$r" token_ttl=5m >/dev/null
              done
              echo "platform CAs ready: cert-manager signs through openinfra/pki-* with its own identity, the CA keys never leave OpenBao."

              # ── The instance identity key (#359): EC2 instance identity documents (CFN_V1) are signed by an
              # RSA-2048 Transit key OpenBao generated and never exports or backs up in plaintext, as AWS
              # signs them with a key no instance and no operator holds. Its own mount, openinfra/transit —
              # two segments, so the tenant-key identities' transit/keys/+ grants (the transit/ mount) never
              # reach it, and the CA identities deny openinfra/*. Created once; rotating it is
              # `bao write -f openinfra/transit/keys/instance-identity/rotate` (docs/openbao.md).
              echo "the instance identity key and the aws-shim's identity for it…"
              vault secrets enable -path=openinfra/transit transit 2>/dev/null || echo "  openinfra/transit already enabled"
              if vault read openinfra/transit/keys/instance-identity >/dev/null 2>&1; then
                echo "  openinfra/transit/keys/instance-identity already present"
              else
                vault write -f openinfra/transit/keys/instance-identity type=rsa-2048 \
                  exportable=false allow_plaintext_backup=false >/dev/null && echo "  created openinfra/transit/keys/instance-identity"
              fi
              # The aws-shim signs with that one key (SHA-256, the only hash it uses) and reads its public half
              # (the certificates it serves); it cannot rotate, configure, export, encrypt or decrypt with it.
              vault policy write aws-shim-identity - <<'POLICY'
              path "openinfra/transit/keys/instance-identity"          { capabilities = ["read"] }
              path "openinfra/transit/sign/instance-identity/sha2-256" { capabilities = ["update"] }
              POLICY
              vault write auth/kubernetes/role/aws-shim-identity \
                bound_service_account_names=aws-shim \
                bound_service_account_namespaces=open-infra-aws-shim \
                token_policies=aws-shim-identity token_ttl=20m >/dev/null
              echo "instance identity ready: the aws-shim signs through openinfra/transit/instance-identity, the key never leaves OpenBao."
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.30.7
    helm:
      values: |
        global:
          tlsDisable: false
        injector:
          enabled: false
        server:
          image:
            registry: quay.io
            repository: openbao/openbao
            tag: "2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f"
          # All members start together (a member waits for the unseal host, not for its peers), and a
          # change rolls one member at a time, each unsealed before the next.
          podManagementPolicy: Parallel
          updateStrategyType: RollingUpdate
          configAnnotation: true
          priorityClassName: system-cluster-critical
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          terminationGracePeriodSeconds: 30
          shareProcessNamespace: true   # lets tls-reload signal the server
          # On distinct physical nodes the operator chose (openinfra.dev/openbao), never two on one, and
          # only on solid-state disks (openinfra.dev/disk-class, measured by storage/disk-class-labeler).
          nodeSelector:
            openinfra.dev/openbao: "true"
          affinity: |
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: openbao
                      app.kubernetes.io/instance: openbao
                      component: server
                  topologyKey: kubernetes.io/hostname
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - { key: openinfra.dev/disk-class, operator: In, values: [nvme, sata-ssd] }
          extraEnvironmentVars:
            GOMEMLIMIT: 460MiB
            # The bao command inside a member talks to its own server over TLS.
            BAO_CACERT: /openbao/userconfig/openbao-listener-tls/ca.crt
            BAO_TLS_SERVER_NAME: openbao.openbao.svc
          # The transit seal's token (see the header). Fixed, not optional: without it no member starts.
          extraSecretEnvironmentVars:
            - { envName: BAO_TOKEN, secretName: openbao-seal, secretKey: token }
          extraVolumes:
            - { type: secret, name: openbao-listener-tls }
            - { type: configMap, name: openbao-unseal-host }
          volumes:
            - { name: tmp, emptyDir: {} }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          statefulSet:
            securityContext:
              # The chart's defaults, plus OnRootMismatch: the kubelet sets the data volume's group once,
              # instead of widening the Raft database's mode (0600) on every restart.
              pod:
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 1000
                fsGroup: 1000
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile: { type: RuntimeDefault }
              container:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
          # OpenBao reads its listener certificate at start and on SIGHUP. cert-manager renews it in the
          # Secret mounted here; when the file changes, this sends the server SIGHUP.
          extraContainers:
            - name: tls-reload
              image: "quay.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  crt=/openbao/userconfig/openbao-listener-tls/tls.crt
                  last="$(sha256sum "$crt")"
                  while sleep 60; do
                    now="$(sha256sum "$crt")"
                    if [ "$now" != "$last" ] && pkill -HUP -x bao; then
                      echo "listener certificate renewed: the server reloads it"; last="$now"
                    fi
                  done
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 1m, memory: 8Mi }
                limits: { cpu: 50m, memory: 32Mi }
              volumeMounts:
                - { name: userconfig-openbao-listener-tls, mountPath: /openbao/userconfig/openbao-listener-tls, readOnly: true }
          dataStorage:
            enabled: true
            size: 10Gi
            storageClass: local-path   # node-local; Raft keeps the three copies
          service:
            publishNotReadyAddresses: false   # clients reach unsealed members only
          ha:
            enabled: true
            replicas: 3
            apiAddr: "https://$(BAO_K8S_POD_NAME).openbao-internal.openbao.svc:8200"
            disruptionBudget: { enabled: true, maxUnavailable: 1 }
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui           = false
                cluster_name = "open-infra"

                listener "tcp" {
                  address         = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_cert_file   = "/openbao/userconfig/openbao-listener-tls/tls.crt"
                  tls_key_file    = "/openbao/userconfig/openbao-listener-tls/tls.key"
                  tls_min_version = "tls13"
                }

                # Recovery, on each member's loopback alone (reached only by exec into a member):
                # OpenBao turns off the endpoints that take recovery keys (root-token generation,
                # rekey) on a listener unless it allows them, and the API listener above does not.
                # The recovery keys, not this listener, authorize what is done through it.
                listener "tcp" {
                  address     = "127.0.0.1:8202"
                  tls_disable = true
                  disable_unauthed_generate_root_endpoints = false
                  disable_unauthed_rekey_endpoints         = false
                }

                storage "raft" {
                  path = "/openbao/data"
                  retry_join {
                    leader_api_addr     = "https://openbao-0.openbao-internal.openbao.svc:8200"
                    leader_ca_cert_file = "/openbao/userconfig/openbao-listener-tls/ca.crt"
                  }
                  retry_join {
                    leader_api_addr     = "https://openbao-1.openbao-internal.openbao.svc:8200"
                    leader_ca_cert_file = "/openbao/userconfig/openbao-listener-tls/ca.crt"
                  }
                  retry_join {
                    leader_api_addr     = "https://openbao-2.openbao-internal.openbao.svc:8200"
                    leader_ca_cert_file = "/openbao/userconfig/openbao-listener-tls/ca.crt"
                  }
                }

                # The unseal host (see the header). Its token comes from the environment (BAO_TOKEN).
                seal "transit" {
                  address         = "https://openbao-unseal-host.openbao.svc:8200"
                  tls_server_name = "openbao-unseal-host"
                  tls_ca_cert     = "/openbao/userconfig/openbao-unseal-host/ca.pem"
                  mount_path      = "transit/"
                  key_name        = "autounseal"
                }

                # Every request and response, sensitive fields HMAC'd, into the pod's log (and Loki).
                audit "file" "stdout" {
                  description = "every request and response"
                  options {
                    file_path = "stdout"
                  }
                }

                service_registration "kubernetes" {}
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated: { prune: true, selfHeal: true }
