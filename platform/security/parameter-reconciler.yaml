# Reconciler for kind: Parameter — writes each Parameter's value into Vault's KV-v2
# `params` mount under params/<namespace>/<path>, and materializes a per-namespace
# `openinfra-parameters` Secret (flattened path -> UPPER_SNAKE env key) that apps
# consume via envFrom. Part of the OPT-IN `encryption` component.
#
# Least privilege:
#   * Kubernetes: read Parameters cluster-wide; write only the `openinfra-parameters`
#     Secret in each namespace (it needs cluster-wide Secret write because app
#     namespaces are arbitrary — the one broad grant, scoped to that fixed name in
#     spirit; verbs are get/create/update/patch, never list/watch/delete-all).
#   * Vault: a k8s-auth role scoped to the params/* KV-v2 mount only.
#
# If Vault is unreachable or sealed the run fails and retries next cycle — no
# parameter is silently skipped.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parameter-reconciler
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-parameter-reconciler
rules:
  - apiGroups: [openinfra.dev]
    resources: [parameters]
    verbs: [get, list]
  # Materialize the per-namespace openinfra-parameters Secret. Cluster-wide because
  # app namespaces are arbitrary; no list/watch (can't enumerate other secrets).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-parameter-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openinfra-parameter-reconciler
subjects:
  - kind: ServiceAccount
    name: parameter-reconciler
    namespace: crossplane-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: parameter-reconciler
  namespace: crossplane-system
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 300
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: parameter-reconciler
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - { name: bin, emptyDir: {} }
            - { name: home, emptyDir: {} }
          initContainers:
            - name: fetch-vault
              image: hashicorp/vault:1.17.2
              command: [sh, -c, "cp /bin/vault /bin-shared/vault && chmod +x /bin-shared/vault"]
              volumeMounts: [{ name: bin, mountPath: /bin-shared }]
          containers:
            - name: reconcile
              image: alpine/k8s:1.30.0
              command: [/bin/sh, -ceu]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: bin, mountPath: /bin-shared }
                - { name: home, mountPath: /tmp }
              env:
                - { name: HOME, value: /tmp }
                - { name: PATH, value: "/bin-shared:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
                - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
              args:
                - |
                  # Kubernetes auth: log in with THIS pod's SA token (no stored Vault credential).
                  VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                    role=parameter-reconciler \
                    jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)")"
                  export VAULT_TOKEN
                  [ -n "$VAULT_TOKEN" ] || { echo "vault kubernetes login failed" >&2; exit 1; }

                  # Every namespace that has at least one Parameter.
                  namespaces=$(kubectl get parameters.openinfra.dev -A \
                    -o jsonpath='{range .items[*]}{.metadata.namespace}{"\n"}{end}' | sort -u)

                  for ns in $namespaces; do
                    [ -n "$ns" ] || continue
                    # Write each INLINE value into the KV-v2 tree at params/<ns>/<path>. A Parameter with no
                    # spec.value is VALUE-BY-REFERENCE: its value is populated out-of-band into the same Vault
                    # path, so it is skipped here — writing an empty value would clobber that out-of-band secret.
                    kubectl get parameters.openinfra.dev -n "$ns" -o json \
                      | jq -r '.items[] | select(.spec.value != null) | [.spec.path, .spec.value] | @tsv' \
                      | while IFS="$(printf '\t')" read -r path value; do
                          vault kv put "params/${ns}${path}" value="$value" >/dev/null
                        done

                    # Materialize the per-namespace Secret from VAULT — the single source of truth for BOTH
                    # inline values (written just above) and value-by-reference values (populated out-of-band).
                    # Flatten /app/db/host -> APP_DB_HOST. A path with no value in Vault yet (a value-by-
                    # reference parameter still awaiting its out-of-band value) is omitted until it is
                    # populated: eventually consistent, never an empty env var. Each value is piped through jq
                    # (never a shell variable) so any content is preserved byte-for-byte.
                    kv="$(mktemp)"
                    kubectl get parameters.openinfra.dev -n "$ns" -o jsonpath='{range .items[*]}{.spec.path}{"\n"}{end}' \
                      | while IFS= read -r path; do
                          [ -n "$path" ] || continue
                          key="$(printf '%s' "$path" | sed -e 's#^/##' -e 's#[/-]#_#g' | tr '[:lower:]' '[:upper:]')"
                          vault kv get -format=json "params/${ns}${path}" 2>/dev/null \
                            | jq -ec --arg k "$key" '.data.data.value as $v | if $v == null then empty else {($k): $v} end' >> "$kv" || true
                        done
                    jq -s 'add // {}' "$kv" \
                      | jq '{
                          apiVersion: "v1", kind: "Secret",
                          metadata: { name: "openinfra-parameters", namespace: $ns,
                                      labels: { "openinfra.dev/parameters": "true" } },
                          stringData: .
                        }' --arg ns "$ns" \
                      | kubectl apply -f -
                    rm -f "$kv"
                    echo "reconciled parameters for namespace $ns"
                  done
