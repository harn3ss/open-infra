# iam:PassRole. Naming a kind: Role on something that will later act with that Role's credentials needs
# permission to pass the Role, as on AWS (launching an instance with an instance profile needs
# iam:PassRole on its role). Without it, anyone who could create a VirtualMachine in a namespace could
# take the credentials of any VM-trusted Role there.
#
# The permission is the custom RBAC verb `passrole` on roles.iam.openinfra.dev:
#   - the built-in admins (openinfra:admins) hold it on every Role (ClusterRole openinfra-pass-role);
#   - power users do not, matching AWS's PowerUserAccess, which excludes iam:PassRole;
#   - to let someone else pass one Role, an admin grants the verb on that Role, e.g. in its namespace:
#       kubectl -n <ns> create role pass-<role> --verb=passrole --resource=roles.iam.openinfra.dev --resource-name=<role>
#       kubectl -n <ns> create rolebinding pass-<role> --role=pass-<role> --group=openinfra:<group>
#     then regenerate the control-plane Cedar corpus (docs/authz-webhook.md).
#
# Where it is checked:
#   - VirtualMachine (spec.instanceRole): by the admission policy below, as the requester (the console
#     and the CloudFormation front door both write as the user).
#   - ServiceAccount annotation openinfra.dev/instance-role: the VM credentials endpoint trusts this
#     annotation, so setting it is checked the same way. The VM composition sets it through
#     provider-kubernetes, which holds the verb (the claim it renders was already checked).
#   - StateMachine (roleArn): by the aws-shim, as the caller, on CreateStateMachine/UpdateStateMachine
#     (the shim writes the object itself). StartExecution also requires the role's trust to name the caller.
#   - Function (spec.role, Lambda's execution role): by the admission policy below, as the requester, on
#     the role's name (a name, or the last segment of a role ARN, lower-cased as its kind: Role object is
#     named), as AWS's CreateFunction/UpdateFunctionConfiguration needs iam:PassRole on the role. A role
#     trusting lambda.amazonaws.com is assumable by any function that names it, so naming it is the gate.
#     It is checked in the function's namespace: iam:PassRole compiled from IAM policy holds in every
#     namespace of the account (a role is the account's, wherever its object lives), and a hand-made
#     grant for a function's role is made in the function's namespace.
#   - Application (spec.assumeRole) needs no PassRole: as with IRSA, the Role's trust policy names the
#     workload's ServiceAccount, and only that identity can assume it (an Application never assumes a role
#     on a service's trust, so naming one grants nothing its trust does not).
#
# Each check applies when the Role is set or changed, never to updates that leave it alone (Crossplane's
# own claim updates, status writes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-pass-role
rules:
  - apiGroups: [iam.openinfra.dev]
    resources: [roles]
    verbs: [passrole]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-pass-role-admins
  labels: { openinfra.dev/legacy: "true" }   # a legacy tier grant, deleted at the IAM cutover (iam:PassRole is IAM policy then)
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openinfra-pass-role
subjects:
  - kind: Group
    name: openinfra:admins
    apiGroup: rbac.authorization.k8s.io
---
# provider-kubernetes creates the per-VM ServiceAccount (with its instance-role annotation) from a
# VirtualMachine claim that already passed the check. It runs as the fixed ServiceAccount name
# provider-kubernetes (provider-setup.yaml), so the verb is bound to it alone — not to the rest of
# crossplane-system (the reconcilers, the function pods), none of which passes a Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-pass-role-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openinfra-pass-role
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-pass-role
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [openinfra.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [virtualmachines]
  matchConditions:
    - name: sets-or-changes-the-instance-role
      expression: >-
        has(object.spec) && has(object.spec.instanceRole) && object.spec.instanceRole != '' &&
        (request.operation == 'CREATE' || !has(oldObject.spec) || !has(oldObject.spec.instanceRole) ||
         oldObject.spec.instanceRole != object.spec.instanceRole)
  validations:
    - expression: >-
        authorizer.group('iam.openinfra.dev').resource('roles').namespace(request.namespace)
        .name(object.spec.instanceRole).check('passrole').allowed()
      reason: Forbidden
      messageExpression: >-
        'iam:PassRole denied: ' + request.userInfo.username + ' may not pass Role ' + request.namespace +
        '/' + object.spec.instanceRole + ' to a VirtualMachine (an admin can grant passrole on that Role)'
---
# A Function's execution role. A Function with no spec.role, and an update that leaves it alone, is not
# checked at all (the condition below), so the functions already on the platform are untouched.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-pass-role-function
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [openinfra.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [functions]
  matchConditions:
    - name: sets-or-changes-the-execution-role
      expression: >-
        has(object.spec) && has(object.spec.role) && object.spec.role != '' &&
        (request.operation == 'CREATE' || !has(oldObject.spec) || !has(oldObject.spec.role) ||
         oldObject.spec.role != object.spec.role)
  variables:
    # The Role's object name: a role name, or a role ARN's last path segment, lower-cased (an AWS role name
    # is mixed case; its kind: Role is the lower-cased name).
    - name: role
      expression: "object.spec.role.substring(object.spec.role.lastIndexOf('/') + 1).lowerAscii()"
  validations:
    - expression: >-
        authorizer.group('iam.openinfra.dev').resource('roles').namespace(request.namespace)
        .name(variables.role).check('passrole').allowed()
      reason: Forbidden
      messageExpression: >-
        'iam:PassRole denied: ' + request.userInfo.username + ' may not pass Role ' + object.spec.role +
        ' to Function ' + request.namespace + '/' + object.metadata.name + ' (an admin can grant passrole on that Role)'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-instance-role-binding
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [serviceaccounts]
  matchConditions:
    - name: sets-or-changes-the-instance-role
      expression: >-
        has(object.metadata.annotations) && 'openinfra.dev/instance-role' in object.metadata.annotations &&
        object.metadata.annotations['openinfra.dev/instance-role'] != '' &&
        (request.operation == 'CREATE' || !has(oldObject.metadata.annotations) ||
         !('openinfra.dev/instance-role' in oldObject.metadata.annotations) ||
         oldObject.metadata.annotations['openinfra.dev/instance-role'] != object.metadata.annotations['openinfra.dev/instance-role'])
  validations:
    - expression: >-
        authorizer.group('iam.openinfra.dev').resource('roles').namespace(request.namespace)
        .name(object.metadata.annotations['openinfra.dev/instance-role']).check('passrole').allowed()
      reason: Forbidden
      messageExpression: >-
        'iam:PassRole denied: ' + request.userInfo.username + ' may not bind Role ' + request.namespace + '/' +
        object.metadata.annotations['openinfra.dev/instance-role'] + ' to a ServiceAccount'
---
# Deny, with an audit annotation. (Rolled out after a Warn + Audit canary: a refusal now is a request
# that has no passrole on the Role it names.)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-pass-role
spec:
  policyName: openinfra-pass-role
  validationActions: [Deny, Audit]
---
# Deny from the start: spec.role is new, so no request before it set one.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-pass-role-function
spec:
  policyName: openinfra-pass-role-function
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-instance-role-binding
spec:
  policyName: openinfra-instance-role-binding
  validationActions: [Deny, Audit]
