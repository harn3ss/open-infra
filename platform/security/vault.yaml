# HashiCorp Vault — the KMS behind kind: EncryptionKey (customer-owned keys, NIST SC-12/13/28(1)).
#
# OPT-IN, OFF BY DEFAULT (the `encryption` component). Vault holds the customer's key-encryption keys
# in its Transit engine; open-infra never sees key material. Storage layers wrap their data keys with
# a Transit key, so destroying the key crypto-erases the data (kind: Destruction / SP 800-88).
#
# Standalone with persistent file storage — NOT dev mode: dev mode keeps keys in memory, so a restart
# would lose them and make wrapped data unrecoverable. That means Vault must be INITIALIZED and
# UNSEALED by an operator (it cannot auto-unseal without an external seal), and the operator must
# provide a bootstrap token so the setup Job below can enable Transit. This is deliberately a
# human-in-the-loop step: the whole point of customer-owned keys is that open-infra cannot unseal
# your KMS for you. See docs/encryption.md for the init/unseal/bootstrap runbook.
#
# EXPERIMENTAL: shipped built + reviewed, but not live-verified in this repo's reference environment.
#
# The `vault` namespace is created HERE (early sync-wave) rather than left to the Helm chart's
# CreateNamespace=true: the app-of-apps applies the raw ServiceAccount/Job below into namespace `vault`,
# and the child Application (which would otherwise create the namespace) syncs asynchronously — so
# without this the app-of-apps races and the whole sync fails with `namespaces "vault" not found`.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.28.1
    helm:
      values: |
        global:
          tlsDisable: true   # in-cluster only; front with the mesh / an ingress for TLS
        injector:
          enabled: false      # we use the Transit API directly, not agent injection
        server:
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                address     = "[::]:8200"
                tls_disable = 1
              }
              storage "file" {
                path = "/vault/data"
              }
          dataStorage:
            enabled: true
            size: 10Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
        ui:
          enabled: true
          serviceType: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
# Transit setup — enable the Transit engine and configure Kubernetes auth for the reconciler. The
# reconciler authenticates with its OWN ServiceAccount token (no Vault credential is ever stored in a
# k8s Secret — so nothing with cluster-wide secret read, e.g. the console SA, can steal Vault access).
# Its policy can create/read/rotate transit keys only — NOT destroy or crypto-erase. Runs as an Argo
# Sync hook; waits for the operator-provided `vault-bootstrap` token Secret (post-init/unseal), which
# the runbook then revokes + deletes (docs/encryption.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-transit-setup
  namespace: vault
---
# Vault validates the reconciler's SA token via the TokenReview API, so Vault's own ServiceAccount
# needs the token-review delegation. (The Helm chart's server SA is `vault` in namespace `vault`.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-transit-setup
  namespace: vault
  annotations:
    # PostSync, NOT Sync: this Job waits for Vault to be up + operator-unsealed, so as a Sync hook it
    # deadlocked — it blocked its own sync wave and the Vault server (the thing it waits for) never
    # deployed. PostSync runs it after the main sync has applied the Vault Application.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 60   # retry until the operator has unsealed Vault + provided the bootstrap token
  template:
    spec:
      serviceAccountName: vault-transit-setup
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: hashicorp/vault:1.17.2   # only talks to Vault; no k8s writes, so no kubectl/RBAC
          command: [/bin/sh, -ceu]
          env:
            - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
            # Operator creates this Secret after `vault operator init` + unseal, then REVOKES+DELETES
            # it once this Job succeeds (docs/encryption.md) — it is a root/admin token:
            #   kubectl -n vault create secret generic vault-bootstrap --from-literal=token=<token>
            - name: VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: vault-bootstrap, key: token } }
          args:
            - |
              # Wait until Vault is reachable AND unsealed.
              until vault status >/dev/null 2>&1; do echo "waiting for Vault to be unsealed…"; sleep 5; done

              echo "enabling Transit engine (idempotent)…"
              vault secrets enable transit 2>/dev/null || echo "  transit already enabled"

              echo "writing the reconciler policy (create/read/rotate keys — NOT destroy or crypto-erase)…"
              # `+` matches exactly ONE path segment, so these grants reach transit/keys/<name> and
              # transit/keys/<name>/rotate but NOT transit/keys/<name>/config or /trim — where
              # min_decryption_version / deletion_allowed (crypto-erase of old versions) live. A
              # recursive `*` would hand over exactly the destruction powers this identity must lack.
              # No datakey/encrypt/decrypt/export/list either: it only shepherds key lifecycle.
              vault policy write encryptionkey-reconciler - <<'POLICY'
              path "transit/keys/+"        { capabilities = ["create", "read"] }
              path "transit/keys/+/rotate" { capabilities = ["update"] }
              POLICY

              echo "configuring Kubernetes auth (reconciler logs in with its SA token)…"
              vault auth enable kubernetes 2>/dev/null || echo "  kubernetes auth already enabled"
              # In-cluster: Vault reviews tokens with its OWN SA (system:auth-delegator, above); no
              # long-lived reviewer JWT to store.
              vault write auth/kubernetes/config \
                kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              vault write auth/kubernetes/role/encryptionkey-reconciler \
                bound_service_account_names=encryptionkey-reconciler \
                bound_service_account_namespaces=crossplane-system \
                token_policies=encryptionkey-reconciler token_ttl=20m

              echo "writing the DESTROYER policy (crypto-erase) + its Kubernetes-auth role…"
              # The destroyer is the ONLY identity that can crypto-erase: set deletion_allowed on a
              # key's config and delete it. Deliberately separate from the reconciler and bound to its
              # own ServiceAccount, so ordinary key management can never destroy. Still no export/
              # datakey/encrypt/decrypt — it can only destroy, not read or exfiltrate key material.
              vault policy write encryptionkey-destroyer - <<'POLICY'
              path "transit/keys/+"        { capabilities = ["read", "delete"] }
              path "transit/keys/+/config" { capabilities = ["update"] }
              POLICY
              vault write auth/kubernetes/role/encryptionkey-destroyer \
                bound_service_account_names=encryptionkey-destroyer \
                bound_service_account_namespaces=crossplane-system \
                token_policies=encryptionkey-destroyer token_ttl=10m
              echo "Transit ready; reconciler + destroyer authenticate via Kubernetes auth (no stored secrets)."

              # ── kind: CertificateAuthority — PKI engines + least-priv provisioner/issuer split ──
              # Same discipline as Transit above: two identities, each bound to its OWN ServiceAccount
              # and holding exactly one half of the CA lifecycle, so no single leaked token can both
              # mint a CA and issue certs off it. Reuses the kubernetes auth backend enabled above.
              # NOTE: there is deliberately NO base `pki`/`pki_int` mount. Every CertificateAuthority gets
              # its OWN mount, enabled dynamically as pki-<claimName> by the ca-provisioner (see
              # ca-reconciler.yaml, which also sets each mount's max-lease-ttl); an intermediate is signed
              # by its parent's pki-<parent> mount. Because the ONLY PKI mounts that ever exist are
              # pki-<name>, the single-segment `+` used on the data-plane paths below matches exactly those
              # mounts and nothing else — a `+` grant is inert on any path that does not exist. Vault OSS
              # cannot express a `pki-*/<subpath>` mid-path glob, so `+` (the transit/keys/+ idiom) is the
              # tightest per-mount data-plane scope available; the pki- PREFIX is still hard-enforced where
              # it matters — mount management — via the trailing-glob `sys/mounts/pki-*` below.

              echo "writing the ca-provisioner policy (build CAs — but NEVER issue/revoke leaf certs)…"
              # Least privilege, two wildcard idioms working together:
              #  • `sys/mounts/pki-*` — the trailing `*` glob (legal ONLY as the final char of a path)
              #    pins mount create/tune/read to the pki-<claimName> namespace. So this identity can NOT
              #    enable or tune `transit` (the KMS) or any non-pki mount, and — with no `delete`
              #    capability — cannot drop a mount either. This is the "MUST NOT touch transit / outside
              #    pki" fence.
              #  • `+` — a single-segment wildcard (exactly the transit/keys/+ idiom above) stands in for
              #    the per-CA mount name on the data plane. ONLY the CA-building endpoints are granted;
              #    issue/issuer and revoke are deliberately ABSENT, so a provisioner can forge a CA but can
              #    never mint or revoke an end-entity certificate. transit exposes none of these subpaths.
              vault policy write ca-provisioner - <<'POLICY'
              path "sys/mounts/pki-*"                  { capabilities = ["create", "read", "update"] }
              path "+/root/generate/internal"          { capabilities = ["create", "update"] }
              path "+/intermediate/generate/internal"  { capabilities = ["create", "update"] }
              path "+/intermediate/set-signed"         { capabilities = ["create", "update"] }
              path "+/root/sign-intermediate"          { capabilities = ["create", "update"] }
              path "+/roles/issuer"                    { capabilities = ["create", "read", "update"] }
              path "+/config/urls"                     { capabilities = ["create", "read", "update"] }
              POLICY
              vault write auth/kubernetes/role/ca-provisioner \
                bound_service_account_names=ca-provisioner \
                bound_service_account_namespaces=crossplane-system \
                token_policies=ca-provisioner token_ttl=20m

              echo "writing the ca-issuer policy (issue/revoke leaf certs ONLY — cannot build a CA)…"
              # The mirror image of the provisioner: the ONLY identity that can mint/revoke end-entity
              # certs, and it can do nothing else. `+` again stands in for the per-CA mount name. No
              # root/intermediate generate, no roles write, no sys/mounts write, no transit — so a leaked
              # issuer token can neither forge a new CA nor crypto-erase anything. sys/mounts is read-only
              # so the issuer can resolve which pki-<ca> mounts exist without being able to change them.
              vault policy write ca-issuer - <<'POLICY'
              path "+/issue/issuer"  { capabilities = ["create", "update"] }
              path "+/revoke"        { capabilities = ["create", "update"] }
              path "+/crl/rotate"    { capabilities = ["read", "update"] }
              path "sys/mounts"      { capabilities = ["read"] }
              POLICY
              vault write auth/kubernetes/role/ca-issuer \
                bound_service_account_names=ca-issuer \
                bound_service_account_namespaces=crossplane-system \
                token_policies=ca-issuer token_ttl=20m
              echo "PKI ready; ca-provisioner builds CAs, ca-issuer mints leaf certs — split by policy."
