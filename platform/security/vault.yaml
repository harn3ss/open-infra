# HashiCorp Vault, as an earlier version ran the platform's keys (#359). The key service is now OpenBao
# (security/openbao.yaml); this is kept only for an install whose keys are still in Vault, until
# scripts/vault-to-openbao.sh has moved them (docs/openbao.md, "Moving the keys from Vault").
#
# OFF unless components.encryption AND openbao.keepVault are true (install.sh). Its volume holds every key's
# last copy, sealed: retiring it is setting openbao.keepVault false (or excluding this file) and deleting
# namespace vault, volume included, once the move is verified.
#
# The `vault` namespace is created HERE (early sync-wave) rather than left to the Helm chart's
# CreateNamespace=true: the app-of-apps applies the raw ServiceAccount/Job below into namespace `vault`,
# and the child Application (which would otherwise create the namespace) syncs asynchronously — so
# without this the app-of-apps races and the whole sync fails with `namespaces "vault" not found`.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.28.1
    helm:
      values: |
        global:
          tlsDisable: true   # in-cluster only; front with the mesh / an ingress for TLS
        injector:
          enabled: false      # we use the Transit API directly, not agent injection
        server:
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                address     = "[::]:8200"
                tls_disable = 1
              }
              storage "file" {
                path = "/vault/data"
              }
          dataStorage:
            enabled: true
            size: 10Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
        ui:
          enabled: true
          serviceType: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
# Vault validated its clients' ServiceAccount tokens through the TokenReview API. The platform's key
# service is now OpenBao (security/openbao.yaml, with its configuration Job); this Vault keeps a sealed
# last copy of the keys until it is retired.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
