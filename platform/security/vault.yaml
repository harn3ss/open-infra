# HashiCorp Vault — the KMS behind kind: EncryptionKey (customer-owned keys, NIST SC-12/13/28(1)).
#
# OPT-IN, OFF BY DEFAULT (the `encryption` component). Vault holds the customer's key-encryption keys
# in its Transit engine; open-infra never sees key material. Storage layers wrap their data keys with
# a Transit key, so destroying the key crypto-erases the data (kind: Destruction / SP 800-88).
#
# Standalone with persistent file storage — NOT dev mode: dev mode keeps keys in memory, so a restart
# would lose them and make wrapped data unrecoverable. That means Vault must be INITIALIZED and
# UNSEALED by an operator (it cannot auto-unseal without an external seal), and the operator must
# provide a bootstrap token so the setup Job below can enable Transit. This is deliberately a
# human-in-the-loop step: the whole point of customer-owned keys is that open-infra cannot unseal
# your KMS for you. See docs/encryption.md for the init/unseal/bootstrap runbook.
#
# LIVE-VERIFIED: provision -> round-trip -> crypto-erase proven END-TO-END on the running cluster by
# probe/encryption-vault.sh (customer KEK wraps/unwraps byte-identical; kind: Destruction makes the key
# unrecoverable). The probe is re-runnable — it resets its own throwaway enc-verify state and triggers the
# destroyer, so it is a repeatable gate, not a one-shot. Bringing Vault up is still operator-gated — custody
# of the unseal keys is the customer's by design (open-infra cannot unseal your KMS); see docs/encryption.md
# for the init/unseal runbook.
#
# The `vault` namespace is created HERE (early sync-wave) rather than left to the Helm chart's
# CreateNamespace=true: the app-of-apps applies the raw ServiceAccount/Job below into namespace `vault`,
# and the child Application (which would otherwise create the namespace) syncs asynchronously — so
# without this the app-of-apps races and the whole sync fails with `namespaces "vault" not found`.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.28.1
    helm:
      values: |
        global:
          tlsDisable: true   # in-cluster only; front with the mesh / an ingress for TLS
        injector:
          enabled: false      # we use the Transit API directly, not agent injection
        server:
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                address     = "[::]:8200"
                tls_disable = 1
              }
              storage "file" {
                path = "/vault/data"
              }
          dataStorage:
            enabled: true
            size: 10Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
        ui:
          enabled: true
          serviceType: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
# Vault validated its clients' ServiceAccount tokens through the TokenReview API. The platform's key
# service is now OpenBao (security/openbao.yaml, with its configuration Job); this Vault keeps a sealed
# last copy of the keys until it is retired.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
