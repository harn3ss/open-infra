# HashiCorp Vault — the KMS behind kind: EncryptionKey (customer-owned keys, NIST SC-12/13/28(1)).
#
# OPT-IN, OFF BY DEFAULT (the `encryption` component). Vault holds the customer's key-encryption keys
# in its Transit engine; open-infra never sees key material. Storage layers wrap their data keys with
# a Transit key, so destroying the key crypto-erases the data (kind: Destruction / SP 800-88).
#
# Standalone with persistent file storage — NOT dev mode: dev mode keeps keys in memory, so a restart
# would lose them and make wrapped data unrecoverable. That means Vault must be INITIALIZED and
# UNSEALED by an operator (it cannot auto-unseal without an external seal), and the operator must
# provide a bootstrap token so the setup Job below can enable Transit. This is deliberately a
# human-in-the-loop step: the whole point of customer-owned keys is that open-infra cannot unseal
# your KMS for you. See docs/encryption.md for the init/unseal/bootstrap runbook.
#
# EXPERIMENTAL: shipped built + reviewed, but not live-verified in this repo's reference environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.28.1
    helm:
      values: |
        global:
          tlsDisable: true   # in-cluster only; front with the mesh / an ingress for TLS
        injector:
          enabled: false      # we use the Transit API directly, not agent injection
        server:
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                address     = "[::]:8200"
                tls_disable = 1
              }
              storage "file" {
                path = "/vault/data"
              }
          dataStorage:
            enabled: true
            size: 10Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
        ui:
          enabled: true
          serviceType: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
# Transit setup — enable the Transit engine and mint a least-privilege AppRole for the
# encryptionkey-reconciler (manage transit/keys/* only: create, read, rotate; NOT delete — key
# DESTRUCTION is gated behind kind: Destruction in the crypto-erase feature). Runs as an Argo Sync
# hook; waits for the operator-provided `vault-bootstrap` token Secret (post-init/unseal).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-transit-setup
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-transit-setup
  namespace: vault
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-transit-setup
  namespace: vault
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: vault-transit-setup }
subjects:
  - kind: ServiceAccount
    name: vault-transit-setup
    namespace: vault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-transit-setup
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 60   # retry until the operator has unsealed Vault + provided the bootstrap token
  template:
    spec:
      serviceAccountName: vault-transit-setup
      restartPolicy: OnFailure
      volumes:
        - { name: bin, emptyDir: {} }
      initContainers:
        # Bring the `vault` CLI OFFLINE (copied from the image) so the setup container can have both
        # kubectl (alpine/k8s) and vault. The vault binary is a static Go binary — copies cleanly.
        - name: fetch-vault
          image: hashicorp/vault:1.17.2
          command: [sh, -c, "cp /bin/vault /bin-shared/vault && chmod +x /bin-shared/vault"]
          volumeMounts: [{ name: bin, mountPath: /bin-shared }]
      containers:
        - name: setup
          image: alpine/k8s:1.30.0   # kubectl (native); vault from the shared volume
          command: [/bin/sh, -ceu]
          volumeMounts: [{ name: bin, mountPath: /bin-shared }]
          env:
            - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
            - { name: PATH, value: "/bin-shared:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
            # Operator creates this Secret after `vault operator init` + unseal:
            #   kubectl -n vault create secret generic vault-bootstrap --from-literal=token=<root-or-admin-token>
            - name: VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: vault-bootstrap, key: token } }
          args:
            - |
              # Wait until Vault is reachable AND unsealed.
              until vault status >/dev/null 2>&1; do echo "waiting for Vault to be unsealed…"; sleep 5; done

              echo "enabling Transit engine (idempotent)…"
              vault secrets enable transit 2>/dev/null || echo "  transit already enabled"

              echo "writing the reconciler policy (manage keys, NOT destroy)…"
              vault policy write encryptionkey-reconciler - <<'POLICY'
              path "transit/keys/*"        { capabilities = ["create", "read", "update"] }
              path "transit/keys"          { capabilities = ["list"] }
              path "transit/keys/*/rotate" { capabilities = ["update"] }
              POLICY

              echo "enabling AppRole auth + role (idempotent)…"
              vault auth enable approle 2>/dev/null || echo "  approle already enabled"
              vault write auth/approle/role/encryptionkey-reconciler \
                token_policies="encryptionkey-reconciler" token_ttl=20m token_max_ttl=1h

              RID=$(vault read -field=role_id auth/approle/role/encryptionkey-reconciler/role-id)
              SID=$(vault write -f -field=secret_id auth/approle/role/encryptionkey-reconciler/secret-id)

              # Hand the AppRole creds to the reconciler (in crossplane-system, where it runs).
              kubectl create secret generic encryptionkey-reconciler-vault -n crossplane-system \
                --from-literal=roleId="$RID" --from-literal=secretId="$SID" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Transit ready; reconciler AppRole provisioned."
