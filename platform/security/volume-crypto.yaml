# Reconciler for ENCRYPTED kind: Volume — materializes each volume's LUKS passphrase Secret
# (`<pvc>-crypto`) from a customer key (kind: EncryptionKey / Vault Transit), so encryption at rest
# is real AND crypto-erasable: the passphrase is a Vault Transit data key drawn under the
# EncryptionKey.
#
# Crypto-erase. Longhorn reads the passphrase from the Secret whenever it opens the volume (attach,
# expand), so the Secret must hold it in plain text, beside its wrapped form; destroying the Transit
# key alone would leave the volume readable. So when a Destruction destroys a key (its state record
# InProgress or Destroyed), this reconciler deletes the passphrase Secret of every volume in the
# Destruction's namespace under that key, never keys a volume under it again, and writes the receipt
# the destroyer certifies from (open-infra-console/openinfra-volume-erasure-<namespace>.<name>). The
# erase runs before the Vault login: it needs nothing from Vault. Keeping only the wrapped key would
# have broken every attach, since Longhorn has no hook to unwrap it. Passphrase Secrets carry
# velero.io/exclude-from-backup, so the namespace backups hold no copy of them.
#
# It watches PVCs on the `longhorn-encrypted` StorageClass carrying the annotation
# `openinfra.dev/encryption-key: <EncryptionKey name>` (set by the Volume composition), and for any
# that lack their `<pvc-name>-crypto` Secret, generates a Transit data key under that EncryptionKey
# and writes the Secret in the PVC's namespace.
#
# The name resolves ONLY within the PVC's own namespace: the EncryptionKey <name> in that namespace,
# whose composite records the Transit path it owns (transit/keys/ek_<namespace>_<name>; a key created
# before namespacing keeps transit/keys/<name>). A claim cannot be keyed under another namespace's
# key by naming it — with no EncryptionKey of that name in its own namespace it simply waits. Idempotent: an existing crypto Secret is never
# regenerated (a changed passphrase would make the volume unreadable) — the Secret is written with
# `kubectl create`, which can never overwrite one.
#
# Latency: the PVC binds only once its Secret exists (the CSI provisioner needs it), and kind: Volume
# reports Ready only once the PVC is Bound. So each run, after its first pass, keeps polling for new
# encrypted PVCs every POLL_SECONDS until WATCH_SECONDS have passed — nearly the whole schedule
# period — so a new volume is keyed within seconds, not at the next run. The schedule, and so the
# pod churn, stays one run per 5 minutes. WATCH_SECONDS=0 = one pass per run.
#
# Lifecycle: the Secret is OWNED by its PVC (ownerReference by UID), so Kubernetes garbage-collects
# the passphrase together with the claim — and removes it at once if the claim was deleted between
# this reconciler listing it and writing the Secret. PVCs being deleted are skipped. Crypto Secrets
# written without an owner (before ownership was set) are swept once their claim AND any
# PersistentVolume bound to it are gone. Deleting the passphrase needs nothing from Longhorn: its
# CSI DeleteVolume takes no secret, and the provisioner proceeds without one when it is gone.
#
# Least privilege: Vault role scoped to transit/datakey/plaintext/<key> only (generate a wrapped data
# key — NOT read/rotate/destroy the KEK). Its Kubernetes Secret writes are confined by the admission
# policy at the end of this file to its own labeled `<pvc>-crypto` Secrets. Part of the OPT-IN
# `encryption` component. If Vault is unreachable or the volume-crypto role is absent (operator has
# not run the Vault step), the run fails and retries — no volume is silently left unencrypted, and
# none is silently keyed.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volume-crypto
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openinfra-volume-crypto
rules:
  # Discover encrypted PVCs awaiting their key, cluster-wide.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
  # Read-only: an ownerless crypto Secret is never swept while a PersistentVolume still holds the
  # volume's data (a Released or Retained PV bound to that claim).
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [list]
  # Resolve a claim's EncryptionKey name to the Transit path its composite records (cluster-scoped,
  # written only by Crossplane — never the tenant-writable claim status).
  - apiGroups: [openinfra.dev]
    resources: [xencryptionkeys]
    verbs: [get, list]
  # Materialize the per-volume crypto Secret in the PVC's namespace, and sweep ownerless ones whose
  # volume is gone. Cluster-wide because a Volume can live in any namespace (the same reach the
  # bucket-setup SA has for per-app creds). RBAC cannot scope by name or label: list only adds
  # enumeration to the get this identity already holds, and create/delete are confined to its own
  # labeled `<pvc>-crypto` Secrets by the ValidatingAdmissionPolicy below.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openinfra-volume-crypto
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openinfra-volume-crypto
subjects:
  - kind: ServiceAccount
    name: volume-crypto
    namespace: crossplane-system
---
# Read the destroyer's Destruction records and write the erasure receipts beside them. Writes are
# confined to the receipts by the second admission policy at the end of this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volume-crypto-erasure
  namespace: open-infra-console
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volume-crypto-erasure
  namespace: open-infra-console
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: volume-crypto-erasure }
subjects:
  - kind: ServiceAccount
    name: volume-crypto
    namespace: crossplane-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: volume-crypto-reconciler
  namespace: crossplane-system
spec:
  schedule: "*/5 * * * *"
  # Replace, not Forbid: the reconcile is idempotent, and Forbid + a stuck run blocks every later run
  # (see the grant-reconciler incident). A run ends its watch (WATCH_SECONDS) before the next tick.
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 295 # > start-up + WATCH_SECONDS + a last sleep and pass, < the 5-minute period
      ttlSecondsAfterFinished: 300
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: volume-crypto
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - { name: bin, emptyDir: {} }
            - { name: home, emptyDir: {} }
          initContainers:
            - name: fetch-vault
              image: hashicorp/vault:1.17.2
              command: [sh, -c, "cp /bin/vault /bin-shared/vault && chmod +x /bin-shared/vault"]
              volumeMounts: [{ name: bin, mountPath: /bin-shared }]
          containers:
            - name: reconcile
              image: alpine/k8s:1.30.0
              command: [/bin/sh, -ceu]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: bin, mountPath: /bin-shared }
                - { name: home, mountPath: /tmp }
              env:
                - { name: HOME, value: /tmp }
                - { name: PATH, value: "/bin-shared:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
                - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
                - { name: CONSOLE_NS, value: "open-infra-console" }
                # After the first pass, keep polling for new encrypted PVCs this long (0 = one pass).
                - { name: WATCH_SECONDS, value: "240" }  # the deadline (295s) also counts scheduling + the init container
                - { name: POLL_SECONDS, value: "5" }
              args:
                - |
                  start=$(date +%s)
                  W="$(mktemp -d)"
                  : > "$W/waiting"
                  TAB="$(printf '\t')"
                  failed=0

                  # erase_destroyed <all|inprogress>: load the keys Destructions destroyed (or are
                  # destroying) — what key_pending never keys under — and delete the passphrase Secret
                  # of every volume under each: all of them on the first pass, the in-progress ones on
                  # each poll after. A failed list keys nothing this pass (key_pending checks).
                  erase_destroyed() {
                    rm -f "$W/destroyed.ok"
                    dj="$(kubectl get configmap -n "$CONSOLE_NS" -l openinfra.dev/destruction -o json)" \
                      || { echo "cannot list Destruction records: nothing erased or keyed this pass" >&2; return 1; }
                    printf '%s' "$dj" | jq -r '.items[]
                        | select(.metadata.name | startswith("openinfra-destruction-state-"))
                        | select(.data.phase == "InProgress" or .data.phase == "Destroyed")
                        | select((.data.namespace // "") != "" and ((.data.vaultKeyPath // "") | startswith("transit/keys/")))
                        | [.metadata.name, .data.namespace, .data.vaultKeyPath, .data.phase, (.data.destroyedAt // ""), (.data.encryptionKey // "")] | @tsv' \
                      > "$W/destroyed.tsv"
                    dj=""
                    : > "$W/destroyed.ok"
                    erc=0
                    while IFS="$TAB" read -r st dns dpath dphase dat dkey; do
                      [ -n "$st" ] || continue
                      [ "$1" = all ] || [ "$dphase" = InProgress ] || continue
                      rcpt="openinfra-volume-erasure-${st#openinfra-destruction-state-}"
                      if ! sl="$(kubectl get secret -n "$dns" -l openinfra.dev/volume-crypto -o json)"; then
                        echo "cannot list the crypto Secrets of ${dns}: erasure under ${dpath} retried next pass" >&2
                        erc=1; continue
                      fi
                      # Under this key: the Secret records its path, or (written before Secrets recorded
                      # one) names the destroyed EncryptionKey — fail closed. A Secret created after the
                      # key was destroyed belongs to a new key of that name, and is kept.
                      printf '%s' "$sl" | LP="$dpath" LK="$dkey" LPH="$dphase" LAT="$dat" jq -r '.items[]
                          | select(.metadata.deletionTimestamp == null)
                          | ((.data.OPENINFRA_VAULT_KEY_PATH // "") | @base64d) as $p
                          | select($p == env.LP
                              or ($p == "" and env.LK != "" and ((.data.OPENINFRA_ENCRYPTION_KEY // "") | @base64d) == env.LK))
                          | select(env.LPH == "InProgress" or env.LAT == "" or (.metadata.creationTimestamp // "") <= env.LAT)
                          | .metadata.name' > "$W/erase.txt"
                      sl=""
                      n=0; left=0
                      while read -r s; do
                        [ -n "$s" ] || continue
                        if kubectl delete secret "$s" -n "$dns" --ignore-not-found >/dev/null 2>&1; then
                          echo "erased ${dns}/${s}: the key it was under (${dpath}) was destroyed by a Destruction"
                          n=$((n + 1))
                        else
                          echo "could not erase ${dns}/${s}" >&2
                          left=$((left + 1)); erc=1
                        fi
                      done < "$W/erase.txt"
                      # The receipt the destroyer certifies from: rewritten while the Destruction is in
                      # progress, and afterwards only when something changed or there is none yet.
                      if [ "$dphase" = InProgress ] || [ "$n" -gt 0 ] || [ "$left" -gt 0 ] \
                          || ! kubectl get configmap "$rcpt" -n "$CONSOLE_NS" -o name >/dev/null 2>&1; then
                        was="$(kubectl get configmap "$rcpt" -n "$CONSOLE_NS" -o jsonpath='{.data.erased}' 2>/dev/null || true)"
                        case "$was" in "" | *[!0-9]*) was=0 ;; esac
                        kubectl create configmap "$rcpt" -n "$CONSOLE_NS" \
                          --from-literal=destructionState="$st" \
                          --from-literal=namespace="$dns" \
                          --from-literal=vaultKeyPath="$dpath" \
                          --from-literal=erased="$((was + n))" \
                          --from-literal=remaining="$left" \
                          --from-literal=checkedAt="$(date -u +%FT%TZ)" \
                          --dry-run=client -o yaml \
                          | kubectl label --local -f - openinfra.dev/volume-erasure=true -o yaml \
                          | kubectl apply -f - >/dev/null || { echo "cannot write the erasure receipt $rcpt" >&2; erc=1; }
                      fi
                    done < "$W/destroyed.tsv"
                    return "$erc"
                  }

                  # Erasing needs nothing from Vault, so it runs before the login: a Destruction
                  # completes even while Vault is unreachable.
                  erase_destroyed all || failed=1

                  VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                    role=volume-crypto \
                    jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)")"
                  export VAULT_TOKEN
                  [ -n "$VAULT_TOKEN" ] || { echo "vault kubernetes login failed (has the operator run the volume-crypto Vault step?)" >&2; exit 1; }

                  # One pass: key every encrypted PVC that has no crypto Secret yet. Called as
                  # `key_pending || failed=1`, so a transient API error fails this pass (and, at the
                  # end, the run) without ending the watch; errors are therefore returned explicitly.
                  key_pending() {
                    [ -f "$W/destroyed.ok" ] || { echo "the destroyed keys are unknown this pass: nothing keyed" >&2; return 1; }
                    # Encrypted PVCs that name an EncryptionKey and are NOT being deleted (keying a
                    # claim on its way out would only leave a passphrase behind).
                    pvcs="$(kubectl get pvc -A -o json)" || { echo "cannot list PersistentVolumeClaims" >&2; return 1; }
                    printf '%s' "$pvcs" | jq -r '.items[]
                        | select(.spec.storageClassName=="longhorn-encrypted")
                        | select(.metadata.annotations["openinfra.dev/encryption-key"] != null)
                        | select(.metadata.deletionTimestamp == null)
                        | [.metadata.namespace, .metadata.name, .metadata.uid, .metadata.annotations["openinfra.dev/encryption-key"],
                           (.metadata.creationTimestamp // "")] | @tsv' \
                      > "$W/pvcs.tsv"
                    # Crypto Secrets that already exist (names only — no key material leaves the API).
                    # A failed list just means every PVC gets the per-name check below.
                    kubectl get secret -A -l openinfra.dev/volume-crypto \
                      -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' \
                      > "$W/keyed.txt" 2>/dev/null || : > "$W/keyed.txt"
                    # FILENAME, not NR==FNR: with no crypto Secrets yet keyed.txt is empty, and NR==FNR
                    # would then swallow every PVC as "keyed".
                    awk -F '\t' 'FILENAME == ARGV[1] { keyed[$0]=1; next } !(($1 "/" $2 "-crypto") in keyed)' \
                      "$W/keyed.txt" "$W/pvcs.tsv" > "$W/pending.tsv"

                    # Each EncryptionKey's Transit path, by the namespace + name of its claim, from the
                    # composites (only when a claim is waiting). A failed list fails this pass — a claim
                    # is never keyed under a guessed path.
                    : > "$W/keymap.tsv"
                    if [ -s "$W/pending.tsv" ]; then
                      xek="$(kubectl get xencryptionkeys.openinfra.dev -o json)" || { echo "cannot list EncryptionKeys" >&2; return 1; }
                      printf '%s' "$xek" | jq -r '.items[]
                          | select((.spec.claimRef.namespace // "") != "" and (.status.vaultKeyPath // "") != "")
                          | [.spec.claimRef.namespace, .spec.claimRef.name, .status.vaultKeyPath] | @tsv' \
                        > "$W/keymap.tsv"
                      xek=""
                    fi

                    while IFS="$TAB" read -r ns name uid key created; do
                      [ -n "$name" ] || continue
                      # The authoritative check, by name: an existing crypto Secret (labeled or not) is
                      # NEVER regenerated — that would orphan the LUKS data.
                      if kubectl get secret "${name}-crypto" -n "$ns" >/dev/null 2>&1; then
                        continue
                      fi
                      # The EncryptionKey <key> in THIS claim's namespace, and the Transit key its
                      # composite records. (ENVIRON, not awk -v: no escape processing of the name.)
                      kpath=""
                      case "$key" in
                        "" | *[!a-z0-9.-]*) ;;
                        *) kpath="$(LNS="$ns" LKEY="$key" awk -F '\t' '$1 == ENVIRON["LNS"] && $2 == ENVIRON["LKEY"] { print $3; exit }' "$W/keymap.tsv")" ;;
                      esac
                      kname="${kpath#transit/keys/}"
                      case "$kpath" in transit/keys/*) ;; *) kname="" ;; esac
                      case "$kname" in "" | *[!A-Za-z0-9_.-]*) kname="" ;; esac
                      if [ -z "$kname" ]; then
                        if ! grep -qxF "$ns/$name" "$W/waiting"; then
                          echo "waiting on ${ns}/${name}: no EncryptionKey '$key' in namespace ${ns} (or its composite has not recorded a Transit path yet)" >&2
                          echo "$ns/$name" >> "$W/waiting"
                        fi
                        continue
                      fi
                      # Never under a key a Destruction is destroying, or destroyed: a claim from before
                      # the destruction was erased with it (a new passphrase could never open it again).
                      # A claim created since, under a new EncryptionKey of that name, is keyed.
                      tomb="$(LNS="$ns" LP="$kpath" LC="$created" awk -F '\t' '$2 == ENVIRON["LNS"] && $3 == ENVIRON["LP"] &&
                        ($4 == "InProgress" || $5 == "" || ENVIRON["LC"] == "" || ENVIRON["LC"] <= $5) { print $4; exit }' "$W/destroyed.tsv")"
                      if [ -n "$tomb" ]; then
                        if ! grep -qxF "$ns/$name" "$W/waiting"; then
                          echo "not keying ${ns}/${name}: EncryptionKey '$key' (${kpath}) was destroyed by a Destruction" >&2
                          echo "$ns/$name" >> "$W/waiting"
                        fi
                        continue
                      fi
                      # A data key wrapped by the EncryptionKey's Transit KEK: plaintext is the LUKS
                      # passphrase; ciphertext is the wrapped record (crypto-erase: destroy the KEK
                      # and the passphrase can never be re-derived).
                      dk="$(vault write -f -format=json "transit/datakey/plaintext/$kname" 2>/dev/null || true)"
                      P="$(printf '%s' "$dk" | jq -r '.data.plaintext // empty')"
                      C="$(printf '%s' "$dk" | jq -r '.data.ciphertext // empty')"
                      dk=""
                      if [ -z "$P" ]; then
                        if ! grep -qxF "$ns/$name" "$W/waiting"; then
                          echo "waiting on ${ns}/${name}: no data key from EncryptionKey '$key' (${kpath}) yet (is its Transit key provisioned?)" >&2
                          echo "$ns/$name" >> "$W/waiting"
                        fi
                        continue
                      fi
                      # Owned by the PVC, by UID: garbage collection deletes the passphrase with its
                      # claim, and at once if the claim is already gone. No blockOwnerDeletion — the
                      # claim's deletion never waits on its Secret.
                      if kubectl create secret generic "${name}-crypto" -n "$ns" \
                          --from-literal=CRYPTO_KEY_VALUE="$P" \
                          --from-literal=CRYPTO_KEY_PROVIDER=secret \
                          --from-literal=CRYPTO_KEY_CIPHER=aes-xts-plain64 \
                          --from-literal=CRYPTO_KEY_HASH=sha256 \
                          --from-literal=WRAPPED_KEY="$C" \
                          --from-literal=OPENINFRA_ENCRYPTION_KEY="$key" \
                          --from-literal=OPENINFRA_VAULT_KEY_PATH="$kpath" \
                          --dry-run=client -o json \
                        | jq --arg pvc "$name" --arg uid "$uid" '
                            .metadata.labels["openinfra.dev/volume-crypto"] = (if ($pvc | length) <= 63 then $pvc else "true" end)
                            | .metadata.labels["velero.io/exclude-from-backup"] = "true"
                            | .metadata.ownerReferences = [{apiVersion: "v1", kind: "PersistentVolumeClaim", name: $pvc, uid: $uid}]' \
                        | kubectl create -f - >/dev/null; then
                        echo "materialized ${name}-crypto in ${ns} from EncryptionKey ${key} (${kpath})"
                      elif kubectl get secret "${name}-crypto" -n "$ns" >/dev/null 2>&1; then
                        :   # an overlapping run created it first — keep that one, never replace it
                      else
                        echo "failed to create ${ns}/${name}-crypto" >&2
                        failed=1
                      fi
                      P=""; C=""
                    done < "$W/pending.tsv"

                    # CDI fills a DataVolume (e.g. a VM's encrypted data disk) through a temporary
                    # "prime" PVC that it owns from the target PVC, then rebinds the volume to the
                    # target. Longhorn provisions the prime PVC with ITS name's crypto Secret, so the
                    # prime gets a copy of the target's passphrase (the same volume, so the same key),
                    # owned by the prime PVC so it is collected when CDI deletes the prime.
                    printf '%s' "$pvcs" | jq -r '.items[]
                        | select(.spec.storageClassName=="longhorn-encrypted")
                        | select(.metadata.annotations["openinfra.dev/encryption-key"] == null)
                        | select(.metadata.annotations["cdi.kubevirt.io/storage.populator.kind"] != null)
                        | select(.metadata.deletionTimestamp == null)
                        | (.metadata.ownerReferences // [] | map(select(.kind == "PersistentVolumeClaim")) | .[0].name) as $target
                        | select($target != null)
                        | [.metadata.namespace, .metadata.name, .metadata.uid, $target] | @tsv' \
                      > "$W/primes.tsv"
                    while IFS="$TAB" read -r ns name uid target; do
                      [ -n "$name" ] || continue
                      kubectl get secret "${name}-crypto" -n "$ns" >/dev/null 2>&1 && continue
                      src="$(kubectl get secret "${target}-crypto" -n "$ns" -o json 2>/dev/null)" || {
                        echo "waiting on ${ns}/${name}: its target ${target} has no crypto Secret yet" >&2; continue; }
                      if printf '%s' "$src" | jq --arg pvc "$name" --arg uid "$uid" --arg ns "$ns" '
                            {apiVersion: "v1", kind: "Secret", type: "Opaque", data: .data,
                             metadata: {name: ($pvc + "-crypto"), namespace: $ns,
                               labels: {"openinfra.dev/volume-crypto": (if ($pvc | length) <= 63 then $pvc else "true" end),
                                        "velero.io/exclude-from-backup": "true"},
                               ownerReferences: [{apiVersion: "v1", kind: "PersistentVolumeClaim", name: $pvc, uid: $uid}]}}' \
                          | kubectl create -f - >/dev/null; then
                        echo "materialized ${name}-crypto in ${ns} (CDI prime of ${target}, same passphrase)"
                      elif ! kubectl get secret "${name}-crypto" -n "$ns" >/dev/null 2>&1; then
                        echo "failed to create ${ns}/${name}-crypto" >&2
                        failed=1
                      fi
                    done < "$W/primes.tsv"
                    src=""
                  }

                  # Remove ownerless crypto Secrets whose volume is gone. Only unmistakably ours: the
                  # label names the claim, the Secret is that claim's `<pvc>-crypto`, and it holds the
                  # reconciler's wrapped-key record. Owned Secrets are left to garbage collection.
                  sweep_orphans() {
                    if ! sj="$(kubectl get secret -A -l openinfra.dev/volume-crypto -o json 2>/dev/null)"; then
                      echo "note: cannot list crypto Secrets — orphan sweep skipped this run" >&2
                      return 0
                    fi
                    printf '%s' "$sj" | jq -r '.items[]
                        | select(.metadata.deletionTimestamp == null)
                        | select(((.metadata.ownerReferences // []) | map(select(.kind == "PersistentVolumeClaim")) | length) == 0)
                        | (.metadata.labels["openinfra.dev/volume-crypto"] // "") as $pvc
                        | select($pvc != "" and .metadata.name == ($pvc + "-crypto"))
                        | select(.data.WRAPPED_KEY != null and .data.OPENINFRA_ENCRYPTION_KEY != null)
                        | [.metadata.namespace, .metadata.name, $pvc] | @tsv' > "$W/ownerless.tsv"
                    sj=""
                    [ -s "$W/ownerless.tsv" ] || return 0
                    # Claims a PersistentVolume still points at keep their passphrase: the data exists.
                    if ! pvs="$(kubectl get pv -o json 2>/dev/null)"; then
                      echo "note: cannot list PersistentVolumes — orphan sweep skipped this run" >&2
                      return 0
                    fi
                    printf '%s' "$pvs" | jq -r '.items[] | select(.spec.claimRef != null)
                        | .spec.claimRef.namespace + "/" + .spec.claimRef.name' > "$W/pv-claims.txt"
                    while IFS="$TAB" read -r ns sname pvc; do
                      [ -n "$sname" ] || continue
                      grep -qxF "$ns/$pvc" "$W/pv-claims.txt" && continue
                      # The claim must be provably absent — a failed lookup is never read as "gone".
                      live="$(kubectl get pvc "$pvc" -n "$ns" --ignore-not-found -o name 2>/dev/null)" || continue
                      [ -z "$live" ] || continue
                      if kubectl delete secret "$sname" -n "$ns" --ignore-not-found >/dev/null 2>&1; then
                        echo "removed orphaned ${ns}/${sname}: its PersistentVolumeClaim and volume no longer exist"
                      else
                        echo "could not remove orphaned ${ns}/${sname}" >&2
                        failed=1
                      fi
                    done < "$W/ownerless.tsv"
                  }

                  key_pending || failed=1
                  sweep_orphans || failed=1
                  while [ $(( $(date +%s) - start )) -lt "$WATCH_SECONDS" ]; do
                    sleep "$POLL_SECONDS"
                    erase_destroyed inprogress || failed=1
                    key_pending || failed=1
                  done
                  [ "$failed" -eq 0 ] || exit 1
              resources:
                requests: { cpu: 20m, memory: 48Mi }
                limits: { cpu: 300m, memory: 192Mi }
---
# Admission guard for the grant above. RBAC cannot scope Secret writes by name or label, and a
# cluster-wide `create secrets` would let this identity mint any ServiceAccount's token (a
# kubernetes.io/service-account-token Secret it could then read back). This policy confines the
# volume-crypto ServiceAccount to: CREATE only an Opaque `<pvc>-crypto` Secret carrying the
# openinfra.dev/volume-crypto label; DELETE only a Secret that already carries that label. Every
# other principal is untouched (matchConditions).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-volume-crypto-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: volume-crypto-serviceaccount
      expression: "request.userInfo.username == 'system:serviceaccount:crossplane-system:volume-crypto'"
  validations:
    - expression: >-
        request.operation == 'DELETE'
        ? (has(oldObject.metadata.labels) && 'openinfra.dev/volume-crypto' in oldObject.metadata.labels)
        : ((!has(object.type) || object.type == 'Opaque')
           && object.metadata.name.endsWith('-crypto')
           && has(object.metadata.labels) && 'openinfra.dev/volume-crypto' in object.metadata.labels)
      reason: Forbidden
      message: "the volume-crypto reconciler may only create an Opaque, openinfra.dev/volume-crypto-labeled <pvc>-crypto Secret, and delete only Secrets carrying that label"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-volume-crypto-secrets
spec:
  policyName: openinfra-volume-crypto-secrets
  validationActions: [Deny]
---
# The ConfigMap grant in the console namespace, confined to the erasure receipts: the volume-crypto
# reconciler can never write a Destruction's own state record (it could otherwise forge a finished
# erase) or any other ConfigMap there.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openinfra-volume-crypto-receipts
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
  matchConditions:
    - name: volume-crypto-serviceaccount
      expression: "request.userInfo.username == 'system:serviceaccount:crossplane-system:volume-crypto'"
  validations:
    - expression: "request.name.startsWith('openinfra-volume-erasure-')"
      reason: Forbidden
      message: "the volume-crypto reconciler may only write openinfra-volume-erasure-* ConfigMaps"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openinfra-volume-crypto-receipts
spec:
  policyName: openinfra-volume-crypto-receipts
  validationActions: [Deny]
