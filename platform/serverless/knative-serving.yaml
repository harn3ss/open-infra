# The namespace Knative Serving runs in (the operator reconciles Serving here).
apiVersion: v1
kind: Namespace
metadata:
  name: knative-serving
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
# Declares Knative Serving with net-kourier as the ingress. The operator installs
# serving-core + kourier and keeps config in sync.
#
# - config.features enables the podspec fields a `kind: Function` needs for GPU
#   functions: runtimeClassName (nvidia runtime) + nodeSelector (Knative locks
#   these down by default).
# - config.domain (external DNS = the kourier MetalLB IP) is environment-specific,
#   so it's set out-of-band; the scale-to-zero contract is testable in-cluster
#   without it.
apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: knative-serving
  namespace: knative-serving
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ingress:
    kourier:
      enabled: true
  config:
    network:
      ingress-class: "kourier.ingress.networking.knative.dev"
    features:
      kubernetes.podspec-runtimeclassname: enabled
      kubernetes.podspec-nodeselector: enabled
      # Let a revision set spec.priorityClassName. BURSTABLE functions (kind: Function spec.burstable) set
      # priorityClassName: openinfra-function — the load-bearing key of the Lambda admission model: it is
      # (1) the scopeSelector the per-tenant ResourceQuota matches on, so the quota caps ONLY function pods
      # (platform/compliance/function-concurrency-quota.yaml), and (2) the scheduler-reclaim class (value
      # -10, non-preempting) so functions yield memory before platform pods. Without this flag Knative's
      # webhook REJECTS any revision that names a priorityClass, so burstable can't deploy at all.
      # Knative has NO per-namespace feature gating, so enabling it is necessarily CLUSTER-WIDE: every
      # KService may now name a priorityClass. That broadened capability is fenced by a Kyverno guard
      # (platform/compliance/function-priorityclass-guard.yaml) that allowlists the name to
      # empty|openinfra-function, so the only class a function pod can carry is the safe low-priority one.
      # Non-burstable functions set no priorityClassName and are unaffected. Inert until a burstable pod exists.
      kubernetes.podspec-priorityclassname: enabled
      # Honor the per-revision queue.sidecar.serving.knative.dev/*-resource-* annotations. The function
      # composition sets a small explicit queue-proxy request+limit on BURSTABLE functions so the pod's
      # memory reservation is predictable and a per-tenant requests.memory quota accepts it (a quota that
      # tracks requests.memory rejects any in-scope pod with a request-less container). Inert for every
      # revision that carries no such annotation — i.e. every non-burstable function.
      queueproxy.resource-defaults: enabled
    gc:
      # Reclaim the Knative Services held by SUPERSEDED (non-active) revisions. Knative's default config-gc
      # keeps up to 20 non-active revisions per route before GC even considers them, so a function updated a
      # few times permanently holds every old revision's Services (~2 each) against a shared Services ceiling
      # (6,500). That silently exhausts the ceiling for ANY user who iterates a function in place -- a
      # general-platform problem, independent of the estate mirror (which has its own retire-the-claim step).
      # Keep a small rollback buffer; GC the rest once aged out. An ACTIVE (routed) revision is never GC'd.
      min-non-active-revisions: "2"        # was the implicit default 20 -- keep 2 for rollback, GC beyond
      max-non-active-revisions: "10"       # hard cap regardless of age
      retain-since-create-time: "48h"      # (Knative default) a superseded revision GCs after it ages out
      retain-since-last-active-time: "15h" # (Knative default)
    defaults:
      # AWS Lambda's max timeout is 900s, and spec.timeout on kind: Function is the Lambda-timeout
      # analog, so 900 is the kind's real ceiling. Knative's built-in cap is 600, which rejected a
      # revision declaring up to 900 at admission (claim stuck in ReconcileError) — raise the cap to
      # 900 so anything an AWS estate can legally set, a Function can express. The XRD caps
      # spec.timeout at 900 to match, so the two never disagree. (Raising the cap only PERMITS a
      # longer declared timeout; it doesn't make anything run longer on its own.)
      max-revision-timeout-seconds: "900"
    deployment:
      # The Knative controller resolves an image tag to a digest at revision creation by querying the
      # registry ITSELF (from the controller pod, with no pull credential). For the in-cluster ecr-registry
      # (per-repo token auth via the shim realm) that anonymous request is refused — so a kind: Function on
      # code.runtimeImage from ecr-registry never got a Ready revision. Skip tag resolution for that
      # registry: the revision keeps the tag ref, and the kubelet pulls it with the per-node pull credential
      # (the ecr-node-pull agent). Keep Knative's local-dev defaults alongside it.
      registries-skipping-tag-resolving: "kind.local,ko.local,dev.local,ecr-registry.open-infra-ecr.svc.cluster.local:5000"
    # Distributed tracing (#67): per-request spans through the activator + queue-proxy
    # of every kind: Function, shipped to Tempo's Zipkin receiver. Rendered by the
    # operator into the config-tracing ConfigMap (knative-serving ns).
    tracing:
      backend: zipkin
      zipkin-endpoint: "http://tempo.monitoring.svc.cluster.local:9411/api/v2/spans"
      debug: "false"
      sample-rate: "0.1"
  # Control-plane HA. The components were single-replica: at ~2,000 KPAs
  # the autoscaler is a reconcile choke point and the activator fronts every scale-to-zero cold start, so a
  # single activator is a cluster-wide cold-start SPOF. Run two replicas (leader election for the controllers;
  # the activator load-balances) and give each explicit requests/limits sized off the measured baseline
  # (autoscaler 43m/71Mi, controller 9m/104Mi at 368 KPAs → headroom for ~2,000). Reversible: set replicas 1.
  high-availability:
    replicas: 2
  # Full-estate re-sizing (2026-10-24): at the real full-estate load (~2,030 ksvc / ~6,000 Services /
  # ~2,000 revisions+routes) the #313-baseline limits were undersized. The activator OOMKilled on
  # recovery-storm spikes (512Mi), net-kourier-controller OOM-crashlooped programming ~2,000 routes
  # (500Mi chart default), and the controller runs ~55% of 1Gi and scales with the estate. Raised below.
  deployments:
    - name: activator
      resources:
        - container: activator
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 1Gi }
    - name: autoscaler
      resources:
        - container: autoscaler
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 1Gi }
    - name: controller
      resources:
        - container: controller
          requests: { cpu: 100m, memory: 512Mi }
          limits: { cpu: "1", memory: 2Gi }
    - name: webhook
      resources:
        - container: webhook
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 500m, memory: 512Mi }
    # Kourier programs the data-plane route for every ksvc; at ~2,000 routes it OOM-crashlooped at the
    # 500Mi chart default, holding functions NotReady (RoutesReady=False). Operator applies this via the
    # KnativeServing CR once synced (a live deploy patch is reverted by ArgoCD self-heal).
    - name: net-kourier-controller
      resources:
        - container: controller
          requests: { cpu: 200m, memory: 256Mi }
          limits: { cpu: "1", memory: 1Gi }
