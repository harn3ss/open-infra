# Durability reconcile for the kubelet memory-eviction drop-in (#321 burstable model).
#
# The burstable function model needs the kubelet to evict low-priority (-10) function pods under memory
# pressure BEFORE the kernel OOM killer (which ignores PriorityClass). That requires a host kubelet-arg
# (eviction-hard: memory.available<2Gi) in /etc/rancher/k3s/config.yaml.d/ -- see docs/function-admission.md.
# But that is HOST config, not GitOps-managed, so a rejoined/reprovisioned node loses it (same trap as the
# GPU labels and the #307 disk-class labels). This DaemonSet is the self-heal: it ensures the drop-in file
# is present + correct on every node, re-asserting it every 5 min so a stray removal or a fresh rejoin heals.
#
# DELIBERATELY FILE-ONLY: it does NOT restart k3s/kubelet (a DaemonSet that restarts the control plane or
# loops kubelet restarts is a cluster-wide-outage risk, and this estate is restart-sensitive). The drop-in
# ACTIVATES on the node's next k3s restart (every node reboot does this; a freshly-reprovisioned node that
# must activate immediately gets one `systemctl restart k3s-agent`). The file is always present, so that is
# the only step ever needed -- never re-creating the file by hand.
#
# No broad `operator: Exists` toleration (the #307 labeler lesson): an unhealthy DS on a down/tainted node
# wedges ArgoCD's wave-gated sync. A node that is not Ready has no running kubelet to govern anyway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubelet-eviction-reconcile
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  # The desired host drop-in. MUST match what was rolled by hand 2026-10-27 (so cmp is a no-op on nodes
  # that already have it). eviction-hard REPLACES the default set, so disk 5% thresholds are re-stated;
  # kubelet-arg+ APPENDS so it never clobbers max-pods.
  zzz-eviction.yaml: |
    kubelet-arg+:
      - "eviction-hard=memory.available<2Gi,nodefs.available<5%,imagefs.available<5%"
  reconcile.sh: |
    set -u
    SRC=/src/zzz-eviction.yaml
    DST=/host-k3s-config/zzz-eviction.yaml
    echo "kubelet-eviction-reconcile on ${NODE_NAME}: ensuring ${DST}"
    while true; do
      if ! cmp -s "$SRC" "$DST" 2>/dev/null; then
        cp "$SRC" "$DST" && chmod 0644 "$DST" \
          && echo "$(date -u) reconciled eviction drop-in on ${NODE_NAME} (was missing or stale) -- ACTIVATES on next k3s restart" \
          || echo "$(date -u) FAILED to write ${DST} on ${NODE_NAME}"
      fi
      sleep 300
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubelet-eviction-reconcile
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    matchLabels: { app: kubelet-eviction-reconcile }
  template:
    metadata:
      labels: { app: kubelet-eviction-reconcile }
    spec:
      priorityClassName: system-node-critical
      # No broad tolerations on purpose (see header): skip down/tainted nodes so the DS can't wedge sync.
      containers:
        - name: reconcile
          image: busybox:1.36
          command: ["sh", "/src/reconcile.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          # Runs as root to write the root-owned host config dir; no privileged/hostPID needed (just the
          # one hostPath, mounted RW). It can only write that one directory.
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: src, mountPath: /src }
            - { name: host-k3s-config, mountPath: /host-k3s-config }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 32Mi }
      volumes:
        - name: src
          configMap: { name: kubelet-eviction-reconcile }
        - name: host-k3s-config
          hostPath:
            path: /etc/rancher/k3s/config.yaml.d
            type: DirectoryOrCreate
