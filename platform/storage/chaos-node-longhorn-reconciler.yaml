# Re-add durability for the chaos suite's storage foundation (docs/chaos-suite.md, Scenario 5).
#
# The chaos-node SEGMENTATION was ASSUMED durable across a node rebuild (k8s taint + `openinfra.dev/
# chaos` label living in the k3s agent config). That held for the LABEL but NOT the TAINT: a
# re-registered node has been observed back LABELLED yet UNTAINTED (chaos-node-3 — polyhedron#300),
# which silently returns a chaos node to the general scheduling pool, so an ordinary CNI/storage fault
# on it becomes a production blocker. The Longhorn STORAGE config was never durable either: `tags:
# [chaos]`, `allowScheduling` and the cleared eviction live in the runtime `nodes.longhorn.io` CR, and
# `createDefaultDiskLabeledNodes: true` means a rebuilt chaos node gets no disk at all.
#
# This reconciler closes BOTH gaps declaratively, from the ONE durable signal (the node label): for
# every node labelled `openinfra.dev/chaos=true` it (0) ensures the k8s `openinfra.dev/chaos=true:
# NoSchedule` taint so general work stays off it, (1) sets the Longhorn create-default-disk label so a
# rebuilt node auto-provisions a disk, and (2) ensures its Longhorn node CR is tagged `chaos`,
# schedulable, and not evicting. Idempotent; a one-shot Sync Job applies it now, a CronJob self-heals
# future re-adds. Production stays fenced off these nodes by the taint +
# allowEmptyNodeSelectorVolume=false + the `chaos` tag (see longhorn.yaml / longhorn-chaos-sc.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-node-longhorn-reconciler
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-node-longhorn-reconciler
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  # Read chaos nodes, set the Longhorn create-default-disk label, and ensure the chaos taint
  # (kubectl taint = a node patch) on them.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
  # Set tags / scheduling / eviction on the matching Longhorn node CRs.
  - apiGroups: [longhorn.io]
    resources: [nodes]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-node-longhorn-reconciler
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-node-longhorn-reconciler
subjects:
  - kind: ServiceAccount
    name: chaos-node-longhorn-reconciler
    namespace: longhorn-system
---
# The reconcile script, shared by the Sync Job and the CronJob.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-node-longhorn-reconciler
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  reconcile.sh: |
    set -eu
    found=0
    for node in $(kubectl get nodes -l openinfra.dev/chaos=true -o name); do
      found=1
      n=${node#node/}
      # (0) ensure the k8s chaos TAINT so general workloads stay OFF this chaos node. The segmentation
      #     is supposed to live in the k3s agent config, but a re-registered node can come back LABELLED
      #     yet UNTAINTED (observed on chaos-node-3 — polyhedron#300), silently returning a chaos node to
      #     the general scheduling pool, where a chaos-node fault then becomes a production blocker.
      #     Re-ensure it from the ONE durable signal (the label). --overwrite is idempotent.
      kubectl taint nodes "$n" openinfra.dev/chaos=true:NoSchedule --overwrite
      # (1) auto-provision a Longhorn disk on a rebuilt node (createDefaultDiskLabeledNodes gate).
      kubectl label "$node" node.longhorn.io/create-default-disk=true --overwrite
      # (2) tag the Longhorn node `chaos`, keep it schedulable, and never leave it evicting.
      #     merge-patch replaces the tags array, so this converges to exactly ["chaos"].
      if kubectl -n longhorn-system get nodes.longhorn.io "$n" >/dev/null 2>&1; then
        kubectl -n longhorn-system patch nodes.longhorn.io "$n" --type merge \
          -p '{"spec":{"allowScheduling":true,"evictionRequested":false,"tags":["chaos"]}}'
      else
        echo "note: Longhorn node CR $n not present yet (will converge on the next run)"
      fi
    done
    [ "$found" = 1 ] || echo "no nodes labelled openinfra.dev/chaos=true (nothing to reconcile)"
    echo "chaos-node Longhorn reconcile complete"
---
# One-shot on Argo sync: configure whatever is present right now.
apiVersion: batch/v1
kind: Job
metadata:
  name: chaos-node-longhorn-reconciler
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: chaos-node-longhorn-reconciler
      restartPolicy: OnFailure
      containers:
        - name: reconcile
          image: alpine/k8s:1.30.0 # non-Bitnami (Bitnami purged public tags Aug 2025); has kubectl+sh
          command: [sh, /scripts/reconcile.sh]
          volumeMounts:
            - { name: script, mountPath: /scripts }
      volumes:
        - name: script
          configMap: { name: chaos-node-longhorn-reconciler }
---
# Self-heal: re-apply on a schedule so a rebuilt/re-registered chaos node reacquires its disk +
# tag on its own, without anyone touching it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chaos-node-longhorn-reconciler
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "*/30 * * * *"
  # Replace, not Forbid: this reconcile is idempotent (re-ensures Longhorn state on chaos nodes), so a
  # superseding run is harmless — whereas Forbid + a run stuck in Terminating wedges every later
  # reconcile. Replace supersedes a stuck run; ttlSecondsAfterFinished GCs finished jobs so a wedged one
  # cannot accumulate. (See #71/#32.)
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: chaos-node-longhorn-reconciler
          restartPolicy: OnFailure
          containers:
            - name: reconcile
              image: alpine/k8s:1.30.0 # non-Bitnami (Bitnami purged public tags Aug 2025); has kubectl+sh
              command: [sh, /scripts/reconcile.sh]
              volumeMounts:
                - { name: script, mountPath: /scripts }
          volumes:
            - name: script
              configMap: { name: chaos-node-longhorn-reconciler }
