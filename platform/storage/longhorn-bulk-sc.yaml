# Bulk/sequential Longhorn StorageClass that WELCOMES spinning disk (#307 point 4).
# Databases / VM roots fail closed onto nvme|sata-ssd, but bulk + sequential + stateless-ish data
# (MinIO staging, backups, large append-mostly volumes) may legitimately live on HDD. `diskSelector:
# "hdd"` places replicas on Longhorn disks tagged `hdd` — a spinning disk added to a node as its own
# Longhorn disk carries that tag, so the node keeps serving normal volumes from its untagged SSD/NVMe
# disks. Normal (empty-selector) volumes AVOID tagged disks via `allowEmptyDiskSelectorVolume: false`
# (see longhorn.yaml), so this is opt-in: only a volume created with this class lands on HDD.
# One replica: bulk data here is re-creatable or backed up elsewhere, and there is one HDD.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-bulk
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # StorageClass parameters are immutable: a parameter change is applied by deleting and re-creating the class
    # (existing volumes keep the parameters they were created with).
    argocd.argoproj.io/sync-options: Force=true,Replace=true
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  diskSelector: "hdd"
  staleReplicaTimeout: "30"
  fromBackup: ""
