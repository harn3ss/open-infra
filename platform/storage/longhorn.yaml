# Longhorn — distributed block storage. Backs kind: Volume (EBS-style attachable
# volumes for VMs): CSI snapshots + (optionally) backups to MinIO. NON-default
# storageClass — local-path stays the cluster default (VM roots, app PVCs); volumes
# opt in via storageClassName: longhorn.
#
# NOTE: preUpgradeChecker.jobEnabled=false — the chart's pre-upgrade Helm hook
# deadlocks a fresh Argo install (the PreSync Job needs longhorn-service-account,
# which the main sync creates only afterwards). Disabling the hook is the fix.
# Host prereq (open-iscsi/nfs) is installed by longhorn-host-prereq.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.12.0
    helm:
      values: |
        preUpgradeChecker:
          jobEnabled: false
        # Backup target = MinIO (EBS-to-S3). The longhorn-minio-creds secret is
        # created by longhorn-backup-setup.yaml from the MinIO root secret; the
        # 'longhorn' bucket is pre-created by the MinIO chart (storage/minio.yaml).
        defaultBackupStore:
          backupTarget: s3://longhorn@us-east-1/
          backupTargetCredentialSecret: longhorn-minio-creds
          pollInterval: 300
        persistence:
          defaultClass: false
          defaultClassReplicaCount: 2
          reclaimPolicy: Delete
        defaultSettings:
          defaultReplicaCount: 2
          defaultDataPath: /var/lib/longhorn
          # Only auto-create a default disk on nodes labeled node.longhorn.io/create-default-disk=true
          # (the real storage nodes). Keeps the disposable chaos nodes storage-INELIGIBLE across a
          # full re-add: a re-registered chaos node is unlabeled → gets no disk → can never hold a
          # production replica (the k8s NoSchedule taint does NOT cover Longhorn — instance-manager
          # tolerates all taints and Longhorn schedules replicas by its own allowScheduling). Existing
          # disks are untouched by this setting.
          createDefaultDiskLabeledNodes: true
          # Refines the segmentation for the chaos suite's Scenario 5 (storage replica-loss):
          # the dedicated chaos nodes ARE now Longhorn-schedulable, but ONLY for volumes that
          # explicitly select them. With this false, a volume with an EMPTY node selector (every
          # production volume) refuses any TAGGED node — and only the chaos nodes carry the
          # `chaos` tag — so production stays fenced onto the untagged real storage nodes while
          # the `longhorn-chaos` StorageClass (nodeSelector: chaos) places sandbox replicas on the
          # disposable chaos nodes. Proven live both directions 2026-08-01. The chaos nodes' tag +
          # allowScheduling + eviction-cleared state is runtime node config (nodes.longhorn.io),
          # documented in the chaos-suite memory; re-add durability wants them labeled for a
          # default disk (tracked follow-up).
          allowEmptyNodeSelectorVolume: false
          # HARD anti-affinity: a volume's replicas MUST land on distinct nodes, so losing one
          # node never loses the volume — the precondition for the chaos suite's Scenario 5
          # (storage replica-loss) to be a real test rather than data deletion. Kept at 2
          # replicas (not 3): mlbox is powered down nightly, and a 3-replica hard-affinity
          # volume would sit degraded every night with only 2 storage nodes up.
          replicaSoftAntiAffinity: false
          # best-effort auto-balance so the hard anti-affinity actually takes effect on the
          # EXISTING co-located volumes — Longhorn otherwise only re-evaluates placement on a
          # rebuild event, so healthy same-node replicas would stay put. best-effort only moves
          # replicas when there's an imbalance to correct; quiet in steady state.
          replicaAutoBalance: best-effort
          storageOverProvisioningPercentage: 100
        csi:
          attacherReplicaCount: 1
          provisionerReplicaCount: 1
          resizerReplicaCount: 1
          snapshotterReplicaCount: 1
        longhornUI:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
