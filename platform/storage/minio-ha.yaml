# MinIO (HA variant) — distributed object storage. Selected by install.sh when
# config.yaml `storage.highAvailability: true`; otherwise storage/minio.yaml
# (standalone) is used. Exactly one of the two is included in the app-of-apps.
#
# Distributed = 4 erasure-coded drives, 2 per storage node. Drives are pinned (via
# the openinfra.dev/storage=true node label) to your always-on storage nodes, so an
# ephemeral node powering down never drops MinIO below write quorum. Label at least
# two nodes first:  kubectl label node <a> <b> openinfra.dev/storage=true
# NOT for single-node dev (use storage/minio.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.2.0
    helm:
      values: |
        mode: distributed
        replicas: 4
        # Image: the chart's default quay.io/minio/minio is no longer anonymously pullable — upstream
        # gated its public container images behind authentication (Sep 2026) and archived the project.
        # Use the AGPL community fork pgsty/minio: a true drop-in (same minio binary, root UID,
        # /usr/bin/docker-entrypoint.sh) whose 2026 build reads the existing xl-v3 erasure data in place.
        # Pinned to a release tag; move to a digest pin once validated. See the MinIO migration finding.
        image:
          repository: docker.io/pgsty/minio
          # Pinned by DIGEST (immutable): the chart renders repository:tag, so tag carries the
          # release name AND the @sha256 digest — a valid ref that pulls by digest, with the tag kept
          # for readability. Digest = the RELEASE.2026-08-04 multi-arch index. Bump both together.
          tag: RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
          pullPolicy: IfNotPresent
        # The chart's post-install/upgrade hook job (minio-post-job, which provisions users/policies via
        # the `mc` client) defaults to quay.io/minio/mc -- paywalled exactly like the server image, so the
        # hook sat in ImagePullBackOff and BLOCKED every sync of this app (a resources change could not
        # apply). Point mcImage at the same reachable first-party mc client our own setup hooks already
        # use. Digest-pinned (tag carries the @sha256, as with the server image above).
        mcImage:
          repository: ghcr.io/harn3ss/open-infra-mc
          tag: latest@sha256:a689825d5299d02e6f35973e726a6e49a77469cde644dd52d60586b07bd85744
          pullPolicy: IfNotPresent
        # Pin root creds to the operator-managed `minio` Secret (#151 fault 2). Without this the
        # chart derives them via a Helm `lookup` that preserves the existing Secret — but ArgoCD
        # renders with `helm template`, which does NOT execute `lookup`, so every sync regenerates
        # a RANDOM rootUser/rootPassword, writes it to secret/minio, and drifts from the running
        # server (pods don't restart to re-read it). existingSecret makes the chart MOUNT
        # secret/minio (keys rootUser/rootPassword) instead of rendering it, so it can't drift.
        # ROLLOUT: annotate secret/minio with argocd.argoproj.io/sync-options: Prune=false before
        # syncing — with existingSecret set the chart stops rendering the Secret, and prune would
        # otherwise delete it. Fresh installs must bootstrap secret/minio (keys rootUser/rootPassword).
        existingSecret: minio
        persistence:
          enabled: true
          size: 20Gi
          # storageClass left default; for NAS reuse, bind a pre-made PV instead.
        resources:
          # Guaranteed QoS: requests == limits for BOTH cpu and memory. MinIO is critical platform
          # storage (object store + the container-registry backend + the function-code bucket), so it
          # must be evicted LAST under node memory pressure and its memory must be BOUNDED. Before this
          # it ran Burstable with only a 512Mi request and no limit, so every drive sat OVER its request
          # (590-1546Mi observed) in the kubelet's first-to-evict bucket -- which is how MinIO going down
          # took object storage, the registry and the function-code bucket out together (2026-10-26).
          # Values: memory 4Gi (ample headroom over the 1546Mi busiest drive; the storage nodes have
          # 20Gi+ free), cpu 1000m (observed <110m, ~10x headroom -> no throttling at this scale).
          requests: { memory: 4Gi, cpu: 1000m }
          limits:   { memory: 4Gi, cpu: 1000m }
        # Pin drives to nodes labelled openinfra.dev/storage=true (your always-on
        # storage nodes), never ephemeral ones — otherwise stopping a node drops
        # MinIO below write quorum. Soft anti-affinity then spreads the 4 drives.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: openinfra.dev/storage
                      operator: In
                      values: ["true"]
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels: { app: minio }
        # Root creds come from a Sealed Secret in prod; chart default for dev only.
        consoleService:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
