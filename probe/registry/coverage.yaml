# The few HAND-KEPT facts of the AWS coverage registry. Everything else is read from code:
#   probe/registry/cfn-types.json    — the cfn engine's mapping table + translator dispatch (cfn/coverage_registry_test.go)
#   probe/registry/shim-router.json  — the aws-shim's router + each handler's operations (console-api/cmd/aws-shim/coverage_registry_test.go)
#   probe/shim-services.yaml         — each shim service's proof (its probes)
# probe/shimgen.py joins them into probe/registry/registry.json, gates on it, and renders the coverage
# docs from it (docs/aws-coverage.md, and blocks in README.md, docs/aws-shim.md, docs/cloudformation.md).
#
# Nothing here claims coverage. `namespaces` and `reads` are AWS facts (which API serves a resource
# type, and which calls read one); `exceptions` lists, with a reason, each place the gate would fail
# today. A missing fact fails the gate loudly rather than passing silently.

# CloudFormation namespace -> the SigV4 signing name(s) of the AWS API that serves its resources.
# Every namespace the cfn engine knows must be here (a new one fails the gate until it is added).
namespaces:
  AWS::ApiGateway: [apigateway]
  AWS::ApiGatewayV2: [apigateway]
  AWS::AppSync: [appsync]
  AWS::Athena: [athena]
  AWS::AutoScaling: [autoscaling]
  AWS::CertificateManager: [acm]
  AWS::CloudFormation: [cloudformation]
  AWS::CloudFront: [cloudfront]
  AWS::CloudWatch: [monitoring]
  AWS::Cognito: [cognito-idp]
  AWS::DynamoDB: [dynamodb]
  AWS::EC2: [ec2]
  AWS::ECR: [ecr]
  AWS::ECS: [ecs]
  AWS::EFS: [elasticfilesystem]
  AWS::EKS: [eks]
  AWS::ElasticLoadBalancing: [elasticloadbalancing]
  AWS::ElasticLoadBalancingV2: [elasticloadbalancing]
  AWS::Events: [events]
  AWS::Glue: [glue]
  AWS::IAM: [iam]
  AWS::Kinesis: [kinesis]
  AWS::KMS: [kms]
  AWS::Lambda: [lambda]
  AWS::Logs: [logs]
  AWS::RDS: [rds]
  AWS::Route53: [route53]
  AWS::S3: [s3]
  AWS::SecretsManager: [secretsmanager]
  AWS::SES: [ses, email]
  AWS::SNS: [sns]
  AWS::SQS: [sqs]
  AWS::SSM: [ssm]
  AWS::StepFunctions: [states]

# Signing names the shim serves that have no CloudFormation resource types of their own on AWS, so they
# are never a breadth gap. Every other router service must map from a namespace above.
noResourceTypes:
  sts: "STS issues credentials; CloudFormation has no STS resource type."
  dynamodbstreams: "A table's stream is a property of AWS::DynamoDB::Table (StreamSpecification), not a resource."
  organizations: "Accounts are created with organizations:CreateAccount (or as a kind: Account); the CloudFormation engine translates no AWS::Organizations type, so a stack creates none."
  servicequotas: "Quotas are an account's limits, set by an operator approving a request (kind: Account spec.serviceQuotas); the CloudFormation engine translates no Service Quotas type, so a stack creates none."

# The calls that read a resource type, where the default does not find them (or finds another type's
# call too). The default: any served operation that starts with Describe/Get/List/Head and the type's own
# name (AWS::SQS::Queue -> GetQueueUrl, GetQueueAttributes, ListQueues). One of the listed calls served is
# enough.
reads:
  AWS::EC2::VPC: [DescribeVpcs]
  AWS::CloudFormation::CustomResource: [DescribeStackResource]
  AWS::CloudFormation::WaitCondition: [DescribeStackResource]
  AWS::CloudFormation::WaitConditionHandle: [DescribeStackResource]
  AWS::IAM::ManagedPolicy: [GetPolicy]
  AWS::IAM::Policy: [GetRolePolicy, GetUserPolicy, GetGroupPolicy]
  AWS::SQS::QueuePolicy: [GetQueueAttributes]
  AWS::SNS::TopicPolicy: [GetTopicAttributes]
  AWS::S3::BucketPolicy: [GetBucketPolicy]
  AWS::Lambda::Permission: [GetPolicy]
  AWS::AppSync::GraphQLApi: [GetGraphqlApi, ListGraphqlApis]
  AWS::AppSync::GraphQLSchema: [GetIntrospectionSchema, GetSchemaCreationStatus]
  AWS::AppSync::FunctionConfiguration: [GetFunction, ListFunctions]
  AWS::EC2::EIP: [DescribeAddresses]
  AWS::EC2::EIPAssociation: [DescribeAddresses]
  AWS::EC2::SecurityGroupIngress: [DescribeSecurityGroupRules, DescribeSecurityGroups]
  AWS::EC2::SecurityGroupEgress: [DescribeSecurityGroupRules, DescribeSecurityGroups]
  AWS::EC2::VolumeAttachment: [DescribeVolumes, DescribeInstances]
  AWS::EC2::Route: [DescribeRouteTables]
  AWS::EC2::SubnetRouteTableAssociation: [DescribeRouteTables]
  AWS::EC2::VPCGatewayAttachment: [DescribeInternetGateways]
  AWS::EC2::SubnetNetworkAclAssociation: [DescribeNetworkAcls]

# Each place the gate fails today, with why and where it is tracked. Types are named one by one — no
# wildcards — so a NEW type is never covered by an old exception. An exception that no longer applies
# (the front door or the read call now exists, or the type is no longer deployable) fails the gate
# until it is removed, so this list cannot outlive what it excuses.
#   types:  the CloudFormation types it excuses
#   check:  front-door (no shim service for the type's own API) | read (the service exists but serves
#           none of the calls that read the type)
#   reason: why a stack may still create it today
#   issue:  where the gap is tracked (described generically: this repository is public)
exceptions: []
