# Canonical registry of AWS services the aws-shim fronts — the SINGLE source of truth for the
# service list and count that appear in README.md and docs/aws-shim.md.
#
# WHY THIS FILE EXISTS: the list and count used to be hand-typed in two places and drifted (a
# service could be built + probe-proven yet still documented as "not fronted"). probe/shimgen.py
# renders the docs from this file and, on --check, FAILS CI if:
#   - any probe/aws-shim-*.sh is not claimed by exactly one service here (a new probe forces a
#     registry entry — the anti-drift guarantee), or
#   - a `probes:` entry names a probe file that does not exist, or
#   - a `tier: proven` service has no probe (proven means observed), or
#   - a `tier: gated|planned` service claims a probe (promote it to proven instead).
#
# tier:
#   proven  — built AND proven by a real-AWS-SDK compatibility probe (probe/aws-shim-*.sh, exit 0
#             live). These are what "N probe-proven services" counts.
#   gated   — the doorway is WRITTEN but not probe-proven and ships OFF behind a component. A
#             different state from "not built", with a different owner (enable a component, not
#             build one).
#   planned — no handler yet: an honest 501, never a silent fake.
#
# `pending` lists a service's probes that are written but have not yet run live (exit 0): claimed, so
# the filesystem check still holds, but never counted as proof. Move one to `probes` once it passes.
#
# A proven service is proven to DENY as well: one of its `probes` asserts AWS's access-denied (a call the
# principal's policy does not allow, refused with AccessDenied or the service's own code, before the
# probe's `|| fail`). Until one does, `denialPending` says why — shown in docs/customer-surface.md — and the
# gate fails once a probe does assert it, so the note cannot outlive the gap. probe/iam-no-policy.sh is the
# baseline every service shares: it calls each service the router serves as a principal with no policy,
# and the gate fails when the router serves one it does not call.
#
# `cell` is the short backend phrase shown next to the service name. `experimental: true` marks a
# service whose engine is on the experimental tier (see README "Maturity & guarantees").
#
# `sigv4` is the SigV4 signing name(s) the service is served under: the keys of the aws-shim router
# (probe/registry/shim-router.json, read from console-api/cmd/aws-shim/main.go). Every router key is
# claimed by exactly one service here; a proven or gated service's keys must all be routed (the docs
# cannot claim a front door the code lacks), and a planned one's must not be (it is built: probe it and
# promote it). This joins each service's proof to the CloudFormation coverage registry (probe/coverage.py).

services:
  # --- identity, security, keys ---
  - name: S3
    cell: "→ MinIO"
    tier: proven
    sigv4: [s3]
    probes: [s3]
  - name: STS
    cell: "identity + `AssumeRole` / web-identity"
    tier: proven
    sigv4: [sts]
    probes: [sts, vm-credentials, app-assume-role, sts-deny]
  - name: IAM
    cell: "roles/policies/users → AWS policy JSON → Cedar"
    tier: proven
    sigv4: [iam]
    probes: [iam, iam-timecond, iam-username-like, iam-login-profile, iam-mfa, iam-passedtoservice]
  - name: KMS
    cell: "→ OpenBao Transit"
    tier: proven
    sigv4: [kms]
    probes: [kms, kms-keypolicy]
  - name: Secrets Manager
    cell: "→ OpenBao-Transit-encrypted, versioned"
    tier: proven
    sigv4: [secretsmanager]
    probes: [secretsmanager]
  - name: Cognito
    cell: "user pools → real RS256 JWTs (JWKS-verifiable)"
    tier: proven
    sigv4: [cognito-idp]
    probes: [cognito]

  # --- compute ---
  - name: Lambda
    cell: "→ Knative `Function`s"
    tier: proven
    sigv4: [lambda]
    probes: [lambda, lambda-execution-role, lambda-timeout, lambda-api]
  - name: ECS
    cell: "service + task def → one `kind: Application` (cfn engine), caller-authority via impersonation"
    tier: proven
    sigv4: [ecs]
    probes: [ecs]
  - name: EKS
    cell: "`DescribeCluster` → a working `aws eks update-kubeconfig` against the real API server"
    tier: proven
    sigv4: [eks]
    probes: [eks, eks-tenant-refused]
  - name: Organizations
    cell: "the install's accounts (`kind: Account`): the management account, member accounts by `CreateAccount`, each its own namespaces"
    tier: proven
    sigv4: [organizations]
    probes: [organizations, account-isolation] # each account's resources its own, across the account-scoped front doors
  - name: Service Quotas
    cell: "each account's quotas (AWS's codes and names), an operator's approved increases (`spec.serviceQuotas`), increase requests; Lambda concurrency capped on burstable functions"
    tier: proven
    sigv4: [servicequotas]
    note: "Each account's quotas under AWS's codes and names, increase requests an operator approves (`kind: Account` `spec.serviceQuotas`), and Lambda's concurrent executions enforced on a member account's burstable functions, per namespace."
    probes: [servicequotas]
  - name: EC2
    cell: "`Describe*` over the platform's VMs, volumes, groups, VPCs and subnets (the guest's i- ids), and a VPC's internet gateways, route tables, network ACLs and endpoints (a stack's by their Refs); key pairs an instance's `KeyName` carries"
    tier: proven
    sigv4: [ec2]
    probes: [ec2, cfn-structural-reads]
  - name: ECR
    cell: "→ a backing OCI registry (Distribution /v2)"
    tier: proven
    sigv4: [ecr]
    probes: [ecr, ecr-perrepo]

  # --- data ---
  - name: RDS
    cell: "→ real PostgreSQL (CloudNativePG)"
    tier: proven
    sigv4: [rds]
    probes: [rds]
  - name: DynamoDB
    cell: "→ FerretDB (+ transactions, Streams)"
    tier: proven
    sigv4: [dynamodb, dynamodbstreams]
    probes: [dynamodb, dynamodb-lsi, dynamodb-restore, dynamodb-streams, dynamodb-deny]
  - name: Athena
    cell: "serverless SQL → Trino over the Iceberg lake"
    tier: proven
    sigv4: [athena]
    probes: [athena]
  - name: Glue
    cell: "Data Catalog → the Iceberg REST metastore"
    tier: proven
    sigv4: [glue]
    probes: [glue]

  # --- messaging / streaming ---
  - name: SQS
    cell: "→ Postgres-backed queues"
    tier: proven
    sigv4: [sqs]
    probes: [sqs]
  - name: SNS
    cell: "→ durable SQS fan-out"
    tier: proven
    sigv4: [sns]
    probes: [sns]
  - name: EventBridge
    cell: "scheduled + event-driven rules"
    tier: proven
    sigv4: [events]
    probes: [eventbridge]
  - name: Kinesis Data Streams
    cell: "ordered, sharded, replayable (Postgres)"
    tier: proven
    sigv4: [kinesis]
    probes: [kinesis]

  # --- app / config / observability ---
  - name: SSM
    cell: "Parameter Store → Postgres + KMS-encrypted `SecureString`; Run Command (`AWS-RunShellScript`) on the platform's VMs through their metadata agent"
    tier: proven
    sigv4: [ssm]
    probes: [ssm, ssm-runcommand]
  - name: API Gateway
    cell: "HTTP API v2 + REST v1 → runtime proxy to Lambda"
    tier: proven
    sigv4: [apigateway]
    probes: [apigateway, apigateway-restv1, apigateway-restv1-cfn]
  - name: CloudWatch
    cell: "metrics + alarms that evaluate and fire SNS"
    tier: proven
    sigv4: [monitoring]
    probes: [cloudwatch]
  - name: CloudWatch Logs
    cell: "→ Postgres; a service's own groups (`/aws/lambda/<fn>`, SageMaker jobs, ECS) → the platform log store"
    tier: proven
    sigv4: [logs]
    # logs-lambda: what a function prints, in /aws/lambda/<fn> (cloudwatchlogs_loki.go)
    probes: [cloudwatchlogs, logs-lambda]

  # --- workflow / provisioning ---
  - name: Step Functions
    cell: "owned ASL engine; Tasks run under the state machine's IAM role (per-execution STS)"
    tier: proven
    sigv4: [states]
    experimental: true
    probes: [stepfunctions]
  - name: CloudFormation
    cell: "owned cfn engine; stacks provision under the caller's authority (impersonation)"
    tier: proven
    sigv4: [cloudformation]
    probes: [cloudformation, cfn-customresource, cfn-lift-and-shift, cfn-data-services, cfn-api, cfn-lambda-zip, cfn-cfnresponse]
    pending: [cfn-securitygroup]
  - name: CloudFront
    cell: "a stack's distribution (`kind: StaticSite`): its invalidations (Completed once the site serves the upload) and reads of it, its policies and origin access"
    tier: proven
    sigv4: [cloudfront]
    probes: [cfn-cloudfront]
  - name: ACM
    cell: "a stack's certificates (its distribution's site TLS, issued by cert-manager): `ListCertificates` / `DescribeCertificate` / `GetCertificate`, never the key"
    tier: proven
    sigv4: [acm]
    probes: [acm]
  - name: AppSync
    cell: "→ open-appsync (VTL-faithful engine)"
    tier: proven
    sigv4: [appsync]
    experimental: true
    probes: [appsync, appsync-deny]

  - name: SES
    cell: "v1 `SendEmail`/`SendRawEmail` + v2 `SendEmail`, and the SES SMTP interface (SES SMTP credentials, STARTTLS) → the platform SMTP relay (the `mail` component; a capturing sink on test clusters), which takes mail from the shim alone"
    tier: proven
    sigv4: [ses, email]
    note: "Served while the `mail` component's relay exists; with it off, SES answers as not fronted."
    probes: [ses, ses-smtp]

  # --- honest 501 (no handler) ---
  - name: Route 53
    cell: "DNS"
    tier: planned
    sigv4: [route53]
    probes: []
